      U) zrI kRSNa caitanyam (zrI kRSNa margAnusaraNam)
      1) premayanna zrI kRSNuni pratirUpamu.
      ananta kSamAkaruNAdAnaguNa sammeLanamu.
      premaku paramArthamu andariyandu samabhAvamu.
      sarvamandunna zrI kRSNuni gurtiJci dInula seviJci tariJcuTa.
      pOgadtalanu tanaloni zrI kRSNAMzA sambhUtamaina jIvAtmaku, A zrI kRSNa paramAtma k, agAdhamU sRSTiJce agaDtagA bhAviJci, vinayamuga samhariJcuTa.
      AdhyAtmikamanna, prema pUrita zrI kRSNa bhagavadgItA sUktulananusariJci, svanta prayojanamunAzimpaka, vidhi dharmamulanAcariJcuTa.
      sarvakarmaphalamulanu zrI kRSNArpaNamu gAviJcuTa.
      2) amRtamu atimathuramanu nAnuDi anRtamani abbura paDunaTlu,
      ananta kRpA kRSNulu, AtmArAmulu, nA antarAtmayai vrAyan,
      AdeziJci, upadeziJci, prasAdiJcina, varasiddhipAyasamI zrI kRSNAnandamayavaijayantamu.
      3) mathurAdhipatigA thAmaya mathurAti mathurarasa sravantI tIrthamu.
      bRndAvana vihArIsparza dhanyapuNya samIramunAzvAdiJci, pulakiJci, upAsintu niratamu zrI kRSNAnugrahamuna.
      4) zrI kRSNa sAyujyamu zAzvatamuga labhimpagan.
      uttarAyaNaparalOkapAnthuniki mOkSamu tathyamaTa.
      dakSinAyamuna vaikuNTha ekAdazi nADu mAtrame, viSNupura dvAramu ter2aturaTa.
      sAkSAt sAyujyakara karuNamaya zrI kRSNa paramAtmuni parandhAmamuna dvAramulecaTa? dvArabandhamulEndu? lere dvArapAlakul sarvaloka pAlaka zrI kRSNa sannidhAnamunan
      dakSiNa nAyakuDu, dAkSiNya devuDu,
      dAsarakSakuDu, dazadizalandu dikkaina vADu,
      sadAdayAdRkkulu par2acaga,
      nAkela cinta paralokagatuDaguTakenADainan.
      lIlAkRSNulETulaina, dikkutocani nannutana sannidhikIDpuJcukOnipoyi,
      tama caraNamula cEntaku cera tIrtunani,
      zrI kRSNAnandamaya zAzvata zrI kRSNa sAyujyamitturani dRDhamuga nammitin


      e) zrI kRSNa caraNa vilInam
      (zrI kRSNAnugrahamu dvArA zrI kRSNa sAyujya siddhi)
      sarvezvaruNDu, sarvamandu tAnai, tAne sarvamaguvADu,
      satyadevuDu, sarvajJuDu, sarvakAlamulandu sthiruDu,
      sarvAzritavatsaluDu, smitavadanuDu, sthitaprajJuDu.
      sarvavaraduDu viriJci, hari sAmbazivuluga sRSTi sthiti laya kArakuDu sarvarakSakuDu.
      sarvamicci sAyujyamosagEDi tat sat cit sampUrNAvatAruDu Adi nArAyaNuDu Ananda dhAmuDu.
    en: |-
      After the evil in me has been driven out so that I may reach the footstool of Sri Krishna, and I have been uplifted, my practice for the love of Sri Krishna, addressed to Sri Krishna the lord of all, is this: I worship Lord Sri Krishna chiefly as Sri Krishna Panchayatana (surrounded by the five deities above), with Ganesha, Uma the daughter of Himavan, Shiva who bears the moon on his head, Brahma, and Lakshmi-Narayana seated around him. This is only in accordance with Sri Krishna's gracious command.

      I take refuge at the feet of Mother Durga, Krishna Yogamaya, who appeared as Sri Krishna's sister; she protects me so that I do not fall under the influence of maya. Mother! Mother of the world! Beloved queen of the Lord of the world! Unique beauty of the world (Jagatsundari)! Kashi Vishalakshi (Goddess of wide eyes)! Protector of the worlds, giver of boons, Lakshmi, Parvati, Sarasvati, shining in the cosmic form of Vishnu's wife, younger sister of the Kannayya I worship! Yogamaya Durga Devi! Sarasvati! Gauri! Sandhya Lakshmi! The goddess of twilight, who dwells within the Sri Krishna Gayatri I recite at sandhya (the goddess who uproots all my afflictions, the Mother who fulfils my wishes)! Salutations! A thousand and many salutations to you.

      This should be sung like a bhajan kirtana; its meaning is easy to grasp.

      Salutations first to the dear little God, whom Sri Krishna loves: the cause of auspiciousness, who gets intended works done without hindrance, handsome like the moon, Ganesha of the single tusk.

      Lakshmi Shakti, Durga, Gayatri Devi, Sarasvati who holds the sciences, Gauri who gives all auspiciousness, Narayana's wife, who always brings happiness, the sister of Sri Krishna, Mother of the world! Salutations.

      A mass of a thousand rays, the Sun, praised by many names; he alone is the cause of good health for all of us, the lord of the nine planets, the teacher of Anjaneya; the orb of the Sun is the abode of the Trimurti at the three times of day, and the dwelling of Gayatri Devi. In the daily rite called Sandhyavandana the Trimurti are worshipped as Gayatri Devi: in the morning as Brahma, at noon as Shiva, and in the evening in the form of Vishnu. Salutations to that Prabhakara.

      Salutations to Parama Shiva, who worships Sri Krishna: with Ganga Devi on his head, the moon, matted locks, a trident in his hand, Ardhanarishwara, who bears the burden of all the worlds, gives wealth, and destroys everything at the time of dissolution.

      O Radhanatha! Lakshmi-Narayana, who appear to devotees in Vishnu form as the auspicious Sri of all beauty! You who always protect and guard devotees, the dear mischievous child who floats on water, lying on a banyan leaf! Son of Vasudeva, Sri Krishna! You show many plays and bring joy. You who shine in the cosmic form, Mukunda who gave us the Gita! Salutations, sir! Compassionate one!
    te: |-
      శ్రీకృష్ణుల పదపీఠికాప్రాప్తికై నాలోని చెడుపాలద్రోలబడి, నేను ఉద్ధరింపబడినతదుపరి, అందరికీ ప్రభువగు శ్రీకృష్ణుని ఉద్దేశించి శ్రీకృష్ణ ప్రేమకై చేయుచున్న సాధన - గణేశుడు, హిమవంతుని కుమార్తె ఉమ, చంద్రుని శిరసున దాల్చిన శివుడు, బ్రహ్మ, లక్ష్మీనారాయణులు తనచుట్టూ ఆశీనులై వున్న శ్రీకృష్ణుని, శ్రీకృష్ణపంచాయ తనముగా (పై ఐదుగురు దేవతల చుట్టూగల) శ్రీకృష్ణుదేవులను ప్రధానంగా అర్చిస్తున్నాను, ఇదీ కేవలం శ్రీకృష్ణుని అనుగ్రహ పూర్వకమైన ఆజ్ఞానుసారమే।

      శ్రీకృష్ణునిసోదరిగా, అవతరించిన కృష్ణయోగమాయ, దుర్గామాత, పాదముల నాశ్రయిస్తున్నా ష్ణమాయా ప్రభావంలో పడకుండ వుండేందుకై ఆమె కాపాడుతోంది. తల్లీ! లోకమాతా! లోకేశ్వరుని హృదయరాణీ! లోకైకసుందరీ । (జగత్సుందరీ!) కాశివిశాలాక్షీ । (విశాలమైన కనులదేవీ) లోకములను రక్షించే, వరములిచ్చే, లక్ష్మీ పార్వతి, సరస్వతీ, విష్ణుదేవుని ఇల్లాలి విశ్వరూపంతో విరాజిల్లే, నేను కొలిచే కన్నయ్యచెల్లెమ్మా । యోగమాయాదుర్గాదేవీ ! సరస్వతీ । గౌరీ ! సంధ్యాలక్ష్మీ! నేను సంధ్యవార్చే శ్రీకృష్ణ గాయత్రీ అంతర్గతం గావుండే సంధ్యాదేవతా (నాకున్నఅన్ని జ్యాడ్యాలు ఊడబెరికేదైవతమా! నాకోరికల నీడేర్చేమాతా! వందనం! నీకనేకానేక వందన సహస్రం ।

      భజన కీర్తనలా పాడుకోవాలి భావము సులభగ్రాహ్యమేకదా!

      శుభములకు కారకుడు, తలపెట్టిన పనులను నిరాటంకంగా జరిపించేవాడు, చంద్రుని వంటి, అందగాడు, ఒక దంతంకల గణేశునికి శ్రీకృష్ణుడు ఇష్టపడే చిన్నారి దైవమునకు ప్రథమంగా వందనాలు.

      లక్ష్మీశక్తి, దుర్గ, గాయత్రీదేవి, విద్యలధరించిన సరస్వతి అన్నిమంగళాలనిచ్చేగౌరి, నారయణపత్ని, ఎపుడూ సంతోషముకల్గించేది, శ్రీకృష్ణసోదరి లోకమాతా! నమస్కారం.

      వేయికిరణాల సమూహం, సూర్యుడు బహునామాలతో స్తుతింపబడతాడు వీరే మనందరికి చక్కటి ఆరోగ్యానికి కారకుడు, నవగ్రహముల కధిపతి, ఆంజనేయునికి గురువు, మూడువేళల్లో త్రిమూర్తులకు నివాసముగా వుండే సూర్యమండలం గాయత్రీ దేవికి ఆవాసము, సంధ్యావందనమనే నిత్యకర్మలో త్రిమూర్తులు ప్రాద్దుట బ్రహ్మ, మధ్యాహ్నం శివుడు, సాయంత్రం విష్ణురూపంతో గాయత్రీ దేవిగా ఆరాధింపబడతారు. అటువంటి ప్రభాకరునికి నమస్సులు

      తలపై గంగాదేవి, చంద్రుడు, జటాజూటం, చేతశూలము, అర్ధనారీశ్వరుడు, లో కాలన్నిటి భారంవహించే, ఐశ్వర్యములనిచ్చే, ప్రళయకాలమున అన్నీనశింపజేసే శ్రీకృష్ణుని పూజించే పరమశివునికి నమోవాకములు.

      రాధానాధా। సర్వసుందరమైన శుభశ్రీగా విష్ణురూపంతో భక్తులకు దర్శనమిచ్చే లక్ష్మీ నారాయణా। ఎపుడూ భక్తులను బ్రోచి, రక్షించే, మఱ్ఱి ఆకుమీద,శయనించి, నీటతేలియాడే మురిపాల చిలిపిచేష్టల చిన్నారీ । వసుదేవ సుతశ్రీకృష్ణా! ఎన్నో లీలలు ప్రదర్శించి ఆనందింపచేస్తావు. విశ్వరూపంతో విరాజిల్లే, గీతను మాకిచ్చినముకుందా। దండాలయ్యా । దయామయా।
  - type: verse
    id: v161
    no: '161'
    title: muktAyamAna mukundamAlA
    hk: |-
      aho! atyadbhutam, AhlAdakaram, varNanAtIta manollAsakaram .
      ariSaDvargAdiroga sarvaripuharam
      ajJAnAndhavinAzakaram .
      zubhakaram zAntikaram, bhaktijJAna vairAgya uddIpanakaram, Amanda nandadam .
      zrIkRSNa smitavadana divyamanodarzanam
      sAdhyam zrIkRSNadhyAna pUrvaka zaraNA gatidvArA, sarvadam ante zrIkRSNa sAyujyakaram
    en: Ah! What an unprecedented sight! Joy in the heart, an indescribable contentment; it destroys the six hostile faults, our enemies, and the darkness called ignorance within, brings good, peace, devotion and knowledge, destroys infatuations and gives endless joy. Through meditation, with a focused mind, the divine vision of Lord Sri Krishna has become possible mentally. Endless crores of salutations to Sri Krishna.
    te: 'అహో! ఎంత కనివిని ఎరుగని దృశ్యం! గుండెల్లో సంతోషం, వివరించి చెప్పలేని తృప్తింపు, అరు విరోధకరమైన గుణదోషాలు, మన శత్రువులను, తెలియని తన మనే, చీకటిని నశింపజేసి, మంచిని, శాంతిని, భక్తిజ్ఞానం కల్గించి, వ్యామోహాలు నశింపజేసి, అంతులేని ఆనందాన్నిచ్చేది, మనస్సుకు, ఏకాగ్రత ధ్యానం ద్వారా శ్రీకృష్ణభగవానుల దివ్యదర్శనము మానసికంగా సాధ్యమైనది. శ్రీకృష్ణులకు అనంతకోటి ప్రణామములు.'
  - type: verse
    id: v162
    no: '162'
    hk: |-
      aNvAdi brahma brahmANDaparyantam zrIkRSNAjJAnuvartiH sRSTissarvam, zrIkRSNamayam zrIkRSNAntargataJca..
      tasyakiJcida vivyartham nAsti .
      tasyakiJcidapi akRSNannAsti ..
    en: From the atom up to Brahma the creator, all universes must follow Sri Krishna's command! Everything is Sri Krishna! Sri Krishna is in everything. Nothing is useless, because there is nothing anywhere that is not or is other than Krishna.
    te: 'అణువు మొదలు సృష్టికర్త బ్రహ్మ సహితముగా సర్వ విశ్వములు శ్రీకృష్ణుని ఆజ్ఞకు లోబడి నడుచుకోవలసినవే! అన్నీ శ్రీకృష్ణుడే! అన్నిటా శ్రీకృష్ణుడే. ఏదీ పనికి మాలినది కాదు, ఎందువల్ల నంటే కృష్ణుడు కానిది, లేనిది ఏదీ ఎక్కడా లేదు.'
  - type: verse
    id: v163
    no: '163'
    hk: |-
      oM namAmi kRSNam nanda nandanam navanItacoram, nagadharam nAgazayanam zrIkRSNam .
      praNamAmi, kRSNam pArthasArathim pAJcajanyapANim,
      payaH priyam caparandhAmam zrIkRSNam.
      vandeharnizam kRSNam, viSNum vizvavaradam zrIkRSNam .
      bhajAmi bhavabhayaharam, bhaktavaradam
      muktipradam zrIkRSNam ..
    en: 'I bow to Sri Krishna, who gives liberation: the son of Nanda, the butter thief, who carried Mount Govardhana, who holds the conch, who reclines on Shesha, the charioteer of Arjuna, the joyful form who loves milk, Vishnu who rules and protects all the worlds, who removes the fear of worldly life and grants boons to devotees.'
    te: 'నందుని కుమారుడు, వెన్న దొంగ, గోవర్ధన పర్వతం, శంఖం చేతబట్టిన, శేషశాయి, అర్జునుని రథసారథి, పాలన్న బహుప్రీతిగల ఆనందరూపం, అన్ని లోకాలను పాలించి రక్షించే విష్ణువు, సంసారభయాన్ని పోగొట్టి భక్తులకు వరము లిచ్చి , మోక్షమొసగే శ్రీకృష్ణునికి నమస్కరిస్తున్నాను.'
  - type: verse
    id: v164
    no: '164'
    hk: |-
      zrIkRSNuDu sarvAnanda nidhAnamu, sadA Ananda dhAmamu .
      zrIkRSNuni, nirdezamu sarvarasarAgaramya manoharamu.
      mokSakAma darzitamu .
      sarve sarvadA sarvavidha Azrita mandAramu! bhaktA bhISTapradadaivatamu sarvadA, sarvavarada sAyujyada satyanArAyaNa, lIlA bAla vinoda bharatimu.
      zrIkRSNahAsaprakAzatejo mayamu, bhaktimukti kArakamu..
    en: Sri Krishna is the treasure of all joy, the abode of eternal bliss. Sri Krishna's guidance is delightful to the heart, charming with every rasa and raga, and it shows the way to those who desire liberation. For all who take refuge, at all times and in every way, he is a mandara tree. He is the God who always grants devotees' wishes, the giver of every boon, the giver of union with him, Satyanarayana, full of the play and delight of his childhood sports. He is radiant with the light of Sri Krishna's smile, the cause of devotion and liberation.
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v165
    no: '165'
    title: zrIkRSNuni govinodamu
    hk: |-
      tAnOkatuvvAyi vIpunEkki rayyi rayyina gantulu veyiJcucu, cilipi ceSTalu ceyuveLa, verOka legadUDa allaricedamu
      ramma"ni saigagA, tana kuDipAdamu nAku cuNDa, tanapai kONDEmulu gopakAntalu cEppagA-kopiJcina yazodamma tananu mandalimpagA
      nizzabdamugA nundunani, kapaTa zapathamugA tarjanini, cirupEdavulapai niDu, muddulu mUTagaTTu cinni gopAluni ciguruTAkuvaNTi
      cinnAri ciTTElaraceyi, abhayahastamai, sadA mammulanu kApADucuNDune yuNDugAka!
    en: |-
      Sri Krishna's fun.
      Climbing on the back of a calf and making it leap this way and that, while doing his naughty pranks; another calf licks his right foot as if calling, "Come, let us make more mischief!"; when the gopa women complain about him and angry Mother Yashoda scolds him, he swears falsely that he will stay quiet, and puts his forefinger on his little lips: may that tender, leaf-like little hand of the darling little Gopala become the hand of fearlessness and always protect us!
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v166
    no: '166'
    hk: |-
      navanItacora! nArIcora! nArI cIrAcora
      nArI prANacora nAga garvacora gopI mAnacora.
      gopikAmAnasa corA.
      kSIracorA rukmiNi cora.
      rAdhA hRdaya cora, raNacora .
      cANUraprANacora .
      ramaNIcora maNicaurya dUSi tapAJcajanyacora.
      pArijAtacora namo sarvapApa doSacora varada, zrIhari kRSNA .
    en: O Sri Krishna! You who stole butter! You who stole the hearts of women! You who took away the gopikas' clothes! You who took the life of a demoness like Putana! You who humbled the pride of the serpent Kaliya! You who plundered the gopikas' pride and their minds! You who stole milk! You who carried off Rukmini Devi! You who won the heart of Radha Devi! Ranchhod Rai, who left the battlefield! You who took the life of the wrestler Chanura! You who steal the hearts of charming women! You who bore the blame of stealing the Syamantaka jewel! You who took possession of the conch called Panchajanya! You who brought the parijata tree from Indra's garden! You who remove all sins and faults of devotees! O Sri Hari, Sri Krishna, who grants boons to devotees! Salutations to you!
    te: 'ఓ శ్రీకృష్ణా! వెన్నను దొంగిలించినవాడా! స్త్రీల మనసులను దోచుకున్నవాడా! గోపికల వస్త్రాలను అపహరించినవాడా! పూతన వంటి రాక్షసి ప్రాణాలను హరించినవాడా! కాళియుడనే సర్పం యొక్క గర్వాన్ని అణచినవాడా! గోపికల అహంకారాన్ని, వారి మనసులను కొల్లగొట్టినవాడా! పాలను దొంగిలించినవాడా! రుక్మిణీదేవిని తోడ్కొని పోయినవాడా! రాధాదేవి హృదయాన్ని గెలుచుకున్నవాడా! రణరంగం వీడి వెళ్ళిన రణఛోడ్ రాయా! మల్లయోధుడైన చాణూరుని ప్రాణాలు తీసినవాడా! మనోహరమైన స్త్రీల చిత్తాన్ని దోచుకునేవాడా! శమంతకమణిని దొంగిలించాడనే నిందను మోసినవాడా! పాంచజన్యమనే శంఖాన్ని వశపరచుకున్నవాడా! ఇంద్రుని తోట నుండి పారిజాత వృక్షాన్ని తెచ్చినవాడా! భక్తుల సమస్త పాపాలను, దోషాలను హరించివేసేవాడా! భక్తులకు వరాలనిచ్చే ఓ శ్రీహరీ, శ్రీకృష్ణా! నీకు నమస్కారములు!'
  - type: verse
    id: v167
    no: '167'
    hk: |-
      oM mAtA .
      me, mAdhavI.
      mANikyavINApANI.
      makarakuNDala dharI .
      mahezvarIzcAdhika mamA rAdhyadevI mahIsama kSamAmayI, mamatAnu rAgajharI.
      mama, kArAnu rAgamayI, mama janmArtha mUlakAriNI,
      mA taramIzvarIm namostute .
    en: O Mother who gave me birth! Visible God on earth, higher than Sri Maha Lakshmi, Sarasvati, Parvati and Aditi! The crest-jewel among the most sacred women, whom I worship! Stream of love and affection, more patient than the earth! Mother among mothers, who told me the meaning of this life! Endless crores of salutations.
    te: 'ఓ, నా జన్మనిచ్చిన తల్లీ! శ్రీమహాలక్ష్మీ, సరస్వతీ, పార్వతీ, అదితి కన్న ఉన్నతమైన భూలోక ప్రత్యక్షదైవమా। నేను పూజించే పరమ పవిత్ర వనితా శిరోమణీ। ధరణి కన్న ఓర్పుగల్గిన ప్రేమానురాగవాహినీ। నా యీ జన్మకు అర్థము తెలిపిన అమ్మలగన్న అమ్మా! అనంతకోటి నమస్కారాలు.'
  - type: verse
    id: v168
    no: '168'
    hk: |-
      vidyAlayam prathame, dvitIyaJca granthAlayam, devAlayam tRtIyaJca vidyA vijJAna samupArjanaJca.
      mukti sAdhanArtham, nizcayam daivanirNItam bhuvim.
      mAtRparyaGkamArambhAt, samRddhi rapipAThazAlayoH.
      vidyasamupArjanama sampUrNam bhavati, vinA, anu nitya granthazodhanam..
      tasmAt jJAna bhANDAra granthAlaya saMvardhanam vidhIyate..
    en: A person's learning, which begins on the mother's lap with "ooku, oonga", is not complete as knowledge, however much is learnt in schools, unless many related books are studied. Therefore libraries, famed as storehouses of knowledge, should be established widely, developed and well used with our wealth.
    te: 'తల్లిఒడిలో "ఊక్కూ-ఊంగా"ల తో మొదలైన మనిషి చదువు, పాఠశాలల్లో ఎంత నేర్చినప్పటికీ, ఎన్నో సంబంధిత గ్రంథాలు పరిశీలించకపోతే, విజ్ఞానం సమగ్రము కాదు. అందువలననే, జ్ఞానభాండారాలని ప్రసిద్ధి కెక్కిన, గ్రంథాలయాల్ని, విరివిగా స్థాపించాలి, అభివృద్ధి చేయాలి, సద్వినియోగం చేయాలి మన ధనం'
  - type: verse
    id: v169
    no: '169'
    hk: |-
      yogezvara zrIkRSNa prasAditam, zrIkRSNa prasAditam, sarvaroganivArakam.
      naraloke, sampUrNA nanda jIvanArtham, nityam zrIkRSNa vizvarUpa saundarya nandanam
    en: To prevent all diseases and so that human beings on earth may live fully healthy and happy, the yoga practice taught by Sri Krishna must be done every day. This is the advice of many experienced elders.
    te: 'అన్ని రోగాలు రాకుండా నివారించి, భూలోకంలో మానవులు పూర్తి ఆరోగ్యంగతో [?] ఆనందంగా జీవించడానికి, నిత్యం శ్రీకృష్ణులు ఉపదేశించిన యోగాభ్యాసం తప్పక చేయాలి. ఇది ఎందరో అనుభవజ్ఞులైన పెద్దల ఉపదేశము.'
  - type: verse
    id: v170
    no: '170'
    hk: |-
      oM. namaste astubhagavan vizva varada rukmiNIzAya satyAnandA pradAyya oM namo nArAyaNAya,
      oM namazzivAya, namo zrIrAmabhadrAya, namaH zivarAmakRSNAya, Om namo bhagavate vAsudevAya, ityaneka mantrarUpa pUjitAya, mamArogya rakSaka dhanvantari devAya oM, oM.
      oM namo vizvarUpAya, sadAnamo, mamArAdhya rAdhAmAdhava, zrIkRSNAya, gAna, lAsya, rAgalIlA vinoda
      mukundAya, mama yIpsi tassarvadA, sAyujyadA, yazodAnanda govinda gopAlAya, vaTapatrazayana, jaganmohana, Ananda
      bAlAya, tatsarva sarveza, zrIman zrIkRSNa prabhave, namo namaH ..
      zrIkRSNam vande jagadgurum, sarvadammesAyujyadam..
      he zrIkRSNabhagavAn.
      dehi,me, vAJchitassarvam, ante zAzvatahRdayAnandada, tavazrIcaraNa vilInam..
    en: |-
      O God who grants boons to all the worlds, together with Rukmini, God who bestows true joy! Salutations to you. O Dhanvantari Deva, my protector of health, who are constantly worshipped in many most sacred mantra forms such as "Om Namo Narayanaya", "Om Namah Shivaya", "Namo Sri Ramabhadraya", "Namah Shivaramakrishnaya" and "Om Namo Bhagavate Vasudevaya": salutations to you.

      Om Namo to the cosmic form, whose form is the entire universe! Constant salutations to Radha-Madhava, Sri Krishna, my beloved God. To Mukunda, who roams in the playful delights of song, dance and melodies; to him who always fulfils all my desires and grants supreme liberation; to Ananda Govinda who delights Mother Yashoda's lap; to Gopala; to him who reclines on a banyan leaf; to Ananda Bala Krishna who enchants the worlds; to Lord Sri Krishna, Sarveshwara, who is everything himself: again and again salutations! I bow to that Sri Krishna, the teacher of the world; may he always grant me liberation as union with him! O Lord Sri Krishna! Fulfil all my wishes and, at the end, grant me complete surrender and the good fortune of merging in your divine, sacred feet, which give lasting joy of the heart.
    te: |-
      సమస్త లోకాలకు వరాలనిచ్చే దైవమా, రుక్మిణీ సమేతుడా, సత్యమైన ఆనందాన్ని ప్రసాదించే భగవంతుడా! నీకు నమస్కారము. "ఓం నమో నారాయణాయ", "ఓం నమశ్శివాయ", "నమో శ్రీరామభద్రాయ", "నమః శివరామకృష్ణాయ", "ఓం నమో భగవతే వాసుదేవాయ" వంటి అనేక పరమ పవిత్ర మంత్ర రూపాలచే నిత్యం పూజలందుకునేవాడా, నా ఆరోగ్య సంరక్షకుడైన ధన్వంతరి దేవా, నీకు ప్రణామాలు.
      సమస్త విశ్వమూ తన రూపంగా గల విశ్వరూపునికి ఓం నమో! నా ఆరాధ్య దైవమైన రాధా-మాధవునికి, శ్రీకృష్ణునికి సదా నమస్కారములు. గానం, నాట్యం, రాగాల లీలావినోదాల్లో విహరించే ముకుందునికి, నా కోర్కెలన్నింటినీ ఎల్లప్పుడూ తీరుస్తూ పరమ మోక్షాన్ని అనుగ్రహించేవానికి, యశోదమ్మ ఒడిని మురిపించే ఆనందగోవిందునికి, గోపాలునికి, వటపత్రశయనునికి, లోకాలను సమ్మోహనం చేసే ఆనందబాలకృష్ణునికి, సర్వస్వమూ తానే అయిన సర్వేశ్వరుడు, శ్రీకృష్ణ ప్రభువునకు పునః పునః నమస్కారాలు! జగద్గురువైన ఆ శ్రీకృష్ణునికి వందనం చేస్తున్నాను; ఆయన సదా నాకు సాయుజ్య ముక్తిని ప్రసాదించుగాక! ఓ శ్రీకృష్ణ భగవానుడా! నా సకల అభీష్టాలను నెరవేర్చి, అంత్యమున శాశ్వతమైన హృదయానందాన్నిచ్చే నీ దివ్య శ్రీచరణాలలో సంపూర్ణ శరణాగతిని, లీనమయ్యే భాగ్యాన్ని అనుగ్రహించుము.
  - type: verse
    id: v171
    no: '171'
    hk: |-
      oM.. jagadrakSakam jagadIzvaram jagajjanakam jagannAdham.
      jagatprabhum,
      jagadvaradam jagatsarvadam jagannATaka sUtra dhAriNam.
      jaganmohinIrUpadharam jaganmohanAkAram jagatsundarIzam .
      jagadAnandakArakam
      zrIkRSNam namAmi jagat jIvakoTi kaivalyadam
    en: 'Salutations to Sri Krishna, who gives joy and liberation: the protector of all worlds, the giver of wealth, the father, the lord, the ruler, who gives boons and arranges everything, the hero of the deceitful play, who during the churning of the ocean of milk took the form of the most beautiful woman of all the worlds, made all the demons drunk with infatuation and bewitched them all; the husband of Lakshmi, the beauty of all the worlds.'
    te: 'అన్ని లోకాలకు రక్షకుడు, ఐశ్వర్యాలిచ్చేవాడు, తండ్రి, అధిపతి, పాలకుడు, వరములిచ్చి అన్నీ అమర్చే, కపటనాటకనాయకుడు, పాలసముద్రమధన సమయంలో అతిలోకసుందరి రూపుదాల్చి రాక్షసులందరికీ మదమత్తెక్కించి, అందర్నీ పరవశింపచేసిన, సర్వలోక సుందరుడైన లక్ష్మీపతి, ఆనందకారకుడై, మోక్షమిచ్చే శ్రీకృష్ణునికి నమోవాకాలు.'
  - type: verse
    id: v172
    no: '172'
    hk: |-
      oM. nayA ce, suralokapAlanam, navApsarasAsukha lAlasam, .
      navitta, ramya, harmyeSu
      cittam, na, me, kiJcidanya masti .
      iyam sustanI muktimAninIcahastAt, sumAgIm, zubhAGgIm, zrIkRSNacaraNa sthira cAriNIm dadAtu .
    en: I do not ask to rule the world of the gods, nor for the company of divine women, nor for wealth or to live in mansions. I want nothing else. Let me have the hand of the bride called Liberation, the radiant, divine woman who always moves about at Sri Krishna's sandals. That is enough.
    te: 'దేవాలోకాన్ని ఏలాలని గాని, దివ్యకాంతల పొందుకాని, ధనము భవనాలలో నివాసము కాని నేను అడుగను – నాకింకేదీ వద్దు. యీ శోభస్కరమైన తేజముగల, దివ్యాంగన, శ్రీకృష్ణ పాదుకలందు, ఎల్లపుడూ, సంచరించే, ముక్తి కాంత పాణి గ్రహణము కలగు జేయి చాలు.'
  - type: verse
    id: v173
    no: '173'
    hk: |-
      zravaNAnakSatrodbhavA, dugdhassarvadagA, dagaddhaga dhagaddhagA yadedIpyamAna divyarUpa bAlA.
      vizva nirdezitA.
      vizAlanetrA vizvamAtA! he viSNu
      sahodarI, mUlAtArA rAjitA.
      jaganmUlAdhArA.
      zAradA zyAmalA zaila jANAm zubhAMzA, zrIdurgA.
      namostudevI.
      namo nama, mama yIpsita ssarvadAyinI, varade, sarvamaGgaLA.
      siddhirbhavatu, me, sarve sarvadA!
    en: 'Salutations to Mother Sri Durga, who fulfils all my wishes and brings auspiciousness: born on the Shravana nakshatra, who burns away all troubles, the brilliant form of divine radiance, who took the form of a little child and rules all worlds, Mother of the world with wide eyes! Yogamaya, the dear younger sister of Vishnu! The gentle one who shines with the Moola nakshatra, the support and root of all worlds, who has the parts of the three goddesses.'
    te: 'శ్రవణానక్షత్రమునాడు అవతరించి, అన్ని వెతలను దహించి వేసే, తళతళా మెరిసిపోయే దివ్యతేజో రూపిణి, చిన్న పాపలా ఆకారం దాల్చి, అన్ని లోకాలను శాసించే, విశాలమైన కన్నులుగల లోకమాతా। విష్ణుమూర్తి అనుంగు చెల్లెలైన యోగమాయా। మూలానక్షత్రంతో ప్రకాశించే, అన్నిలోకాలకూ, మూలాలకు, ఆధార భూతమైన, మువ్వరమ్మల అంశలతో కూడుకున్న కోమలీ, శ్రీదుర్గామాత! నా కోరికలన్నీ తీర్చే, శుభములు కల్గించే తల్లికి నమోవాకాలు.'
  - type: verse
    id: v174
    no: '174'
    hk: |-
      akhila lokAzcaryakara, sarvajanAkarSaka, susmita vadanA ravinda madana gopAlam .
      AdinArAyaNam, ArtatrANaparAyaNam, anurAgamaya mAtmArAma, mAnandadhAmam vAsudevam,
      vizvarUpam, rAdhA sahaDolAlAsya lIlA vinodinam, bhaktavazyam zrIkRSNam! tam vande, sarvasarvezvaram, bhaktijJAna, dhyAna vidyAmaya!
      mokSasAdhanagItA pracAram, abhaya dam, memukti dam..
    en: I bow to Madana Gopala, whose lotus-like face smiles, who attracts everyone and at whom all worlds marvel; the Adi Deva whose abode is water, the embodiment of love who helps those who cry out in pain, the form of joy, the son of Vasudeva, who holds the universe within him, the player of delightful games who swings on a swing together with Radha, who is won over by devotees. Prostrations to Sri Krishna Parabrahman himself, God of gods, who gave the Bhagavad Gita, the guide to liberation that teaches devotion, knowledge and meditation, removes fears and grants union with him.
    te: 'అన్ని లోకాలు ఆశ్చర్యపోయే, అందర్నీ ఆకర్షించే, చిరునవ్వుల పద్మము వంటి ముఖము గల మదనగోపాలుడు, నీరు నివసమైన ఆదిదేవులు, బాధలతో ఆక్రోశించేవారిని ఆదుకునే ప్రేమమూర్తి, ఆనంద స్వరూపుడు, వసుదేవుని కుమారుడు, జగత్తు తనలో ఇముడ్చుకున్న, రాధా సహితంగా తూగుటుయ్యాల లూగే లీలావినోది, భక్తులకు వశుడైన వానికి, నమస్కరిస్తున్నాను. దేవాదిదేవులు, భక్తి, జ్ఞానము, ధ్యానములను ప్రబోధించే, మోక్ష మార్గదర్శిని భగవద్గీతను ప్రసాదించి భయములు పోగొట్టి, సాయుజ్యమిచ్చే సాక్షాత్ శ్రీకృష్ణపరబ్రహ్మకు దండములు.'
  - type: verse
    id: v175
    no: '175'
    hk: |-
      zazAGkA, gomAtA madhyasthasthita meghazyAma sundaram, kapilavatsalAlana karakamala kamanIyam .
      mugdhamadhura smita mukhAravindam, madanagopAlam, bRndAvihAra, lIlA mAnuSavigraham.
      vande, yazodAnandagovindam, devakI vasudeva sutam, deva devezvaram, murArim, mAdhavam, nandabAlam, bhajAmi, AnandarAmam, mameza
      zrIkRSNam, zrIkRSNa dAsyAnandavarapradAram, ante zrIkRSNa padakaivalya dam..
    en: "I worship with bhajans Lord Sri Krishna, my master, Gopala, the abode of joy: the one standing between the moon's disc in the sky and the cow Lakshmi nearby, handsome in the colour of a blue cloud, his face lit with a smile as he caresses a calf with his tender hand, Madana Gopala who roams freely in Brindavan, the mischievous actor, the son of Yashoda, who delights the cows, the son of Devaki and Vasudeva, the God of all gods, the enemy of Mura, the beloved of Shri. He gives the unprecedented boon of service to Sri Krishna and at the end of this life unites me with himself. Salutations again and again."
    te: 'ఆకాశములో నున్న చంద్రబింబము, సమీపములోని గోమాలక్ష్మీ మధ్య నిలచిన నీలిమబ్బురంగుల అందగాడు, తన సుకుమారమైన చేతితో లేగదూడను లాలిస్తూన్న చిరునగవువెలిగే వదనం, మదనగోపాలుడై బృందావనంలో స్వేచ్ఛా విహారంచేసే అల్లరినటకుడు, యశోదకొడుకు, ఆవులను ఆనంద పరచే, దేవకీవసుదేవ కుమారుడు, దేవుళ్ళందరికీ దేముడు, మురా విరోధి, శ్రియః కాంతుడు, గోపాలుని, ఆనందనిలయుని నా స్వామి శ్రీకృష్ణదేవేరులను భజనలతో కొలుస్తున్నాను. వారు శ్రీకృష్ణసేవ అనే అపూర్వవరమొసగి, యీ జన్మాంతంలో తనలో ఐక్యం చేసుకుంటున్నారు. తిరిగి తిరిగి నమస్కారాలు.'
  - type: verse
    id: v176
    no: '176'
    hk: |-
      vande dhenur dugdhapriyam, navanItahastam, dugdha ssarvaharam, sarvesarvadA Azritavatsalam, deva devezam, zrIdharam.
      vande, paya sA udhasvatI, gosam vAhana madhye, kSIra dhArApAna, lIlA vinodinam, jagadAdhAram, manoharam vande, bhujaGga bhogA gra, padavinyAsa, vilAsa, bAlagopAlam, tam, kALim dinIpunIta karam, zrIkaram vande, me, zrIkRSNa ucchiSTa, kSIra, navanIta, phalagrahaNabhAgyAdi, mahotRSTa, zrIkRSNa nityasevAvara pradAram, ca, AsmajjanmAnte, zrIkRSNa parama padavilIna varadam..
    en: "I offer full-length prostrations to Karuna Krishna, who at the end of this life merges me permanently into his sandals, so that I may also do constant service and servitude to Sri Krishna: the Lord who lovingly takes cow's milk; with a ball of butter in his hand, the God of gods who destroys everyone's every suffering, the husband of Lakshmi; who, while milking cows, with a mischievous prank drinks the stream of milk from the udder halfway and lets the rest fall on the ground, delighting in it; the support of the universe; Lakshmiharshita, who wipes away the mind's troubles and gladdens the mind; the cowherd boy who danced on the hood of the serpent Kaliya and made the Kalindi free of impurity and useful to the people; Srikara, who, with great kindness, graciously gave me, who have no qualification at all, the very highest gift, the prasadam of milk and butter that Sri Krishna had already tasted."
    te: 'ఆవుపాలు ఆప్యాయంగా స్వీకరించేస్వామి, చేత వెన్నముద్దతో, అందరి అన్నివ్యధలనూ నశింపజేసే దేవాదిదైవము, లక్ష్మీపతి, ఆవుపాలు పితుకుతూ మధ్యలో కొంటె కోణంగి తనముగా, పొదుగు నుంచి పడేపాలధారను సగం సగం త్రాగుతూ, మిగతావి నేలమీద పడేటట్లు చేస్తూ ఆనందిస్తూండే, జగత్తుకు ఆధారభూతుడు, మనస్సులోని వ్యధలను తుడిచేసి, మనసును హర్షింపచేసే లక్ష్మీహర్షితుడు, కాళీయ సర్పముపడగపై నాట్యవిలాసము చేసి, కాళిందిని కల్మషరహితంగా, ప్రజోపకరంగా మార్చిన గోపాలబాలుడు, శ్రీకరుడు, ఎట్టి అర్హతాలేని నాకు అమిత దయతో శ్రీకృష్ణులు ఎంగిలి చేసిన పాలు, వెన్న ప్రసాదాలు స్వీకరించే అత్యంత ఉన్నతమైనవి అనుగ్రహించిన, శ్రీకృష్ణుని నిత్య దాస్యము, సేవలు చేసుకునేట్లుగా కూడా యీ జన్మాంతంలో తన పాదకులతో శాశ్వతంగా కలిపేసుకునే కరుణాకృష్ణులకు సాష్టాంగ దండప్రణామాలర్పిస్తున్నాను.'
  - type: verse
    id: v177
    no: '177'
    hk: |-
      vande vizvamohana bAlam, vizvAdhAram vanamAlim, vana vihAra
      vAsudevam .
      gopAlam sAmUhika vanabhojana madhye, uttiSTham, dadhyAnna kabaLahastam, padmapadayugaLazobhitam! kapaTa gopagogaNa anveSaNa
      nATaka lIlA vinodinam, cirahAsavadanam, sadAvande, vidhAta garvahArakam, gopa, goga NarakSakam, zrIkRSNam, mamArAdhya rAdhA mAdhavam, me,
      zrIkRSNa Ananda, dhAma nitya nivAsa varadam ..
    en: "Respectful salutations to Lord Sri Radha-Krishna, our beloved God, Srinatha, and to Lord Sri Krishna who grants us the boon of liberation in Sri Krishna: the wondrous boy who enchants the whole universe, the support of everything, the son of Vasu who protects the forest and roams in it; Mukunda with a small, smiling face, who, while tending cows in the forest, got up from the middle of his midday meal with a ball of curd rice in his hand, with feet like lotuses, pretending innocence, and made it seem as if he were searching for the cows and cowherds that Brahma's maya had hidden; who humbled the Creator's pride and protected the cows and cowherds."
    te: 'సకల విశ్వమును సమ్మోహనపరచే అద్భుత బాలుడు, సర్వమునకు ఆధారము, వనమును బ్రోచి, విహరించే వసుసుతుడు, వనమున గోవులను కాస్తూ, మధ్యాహ్న భోజన మధ్యలో నుంచి, చేతితో పెరుగన్నం ముద్దతో సహా లేచిన పద్మము వంటి పాదములతో అమాయకునిలా నటిస్తూ, బ్రహ్మమాయం చేసిన గోవులను, గోపాలురను వెదకుతూన్నట్లు నమ్మించే చిరునవ్వుల చిన్నారి మోముల ముకుందునికి, విధాత గర్వమును అణచి, గోవులను, గోపాలరను రక్షించిన మా ఆరాధ్య దైవము రాధాకృష్ణ స్వామికి, శ్రీనాధునికి, మాకు శ్రీకృష్ణ కైవల్యము వరమిచ్చే శ్రీకృష్ణ ప్రభువులకు పాదాభివందనాలు.'
  - type: verse
    id: v178
    no: '178'
    hk: |-
      oM.. kSIrajAnujam, candram, sudhAMzum,
      zaratkAle zRGgArAdhikAsaktikArakam, zrIkRSNa bRndArAsalIlA darzana dhanyadevaram .
      kSIra sandrazayana zrIkRSNazyAla kala, vande zivaziro
      bhUSaNam zazim zubhakaram zazAGkam..
    en: Salutations to the Moon, the brother of Lakshmi Devi who was born from the ocean of milk, who has nectar-bearing rays, who in autumn increases the interest of humankind in the erotic rasa; the fortunate one who saw Sri Krishna's divine Rasa Lila in Brindavan, the younger brother-in-law of Sri Krishna who reclines on the ocean of milk, who shines like an ornament on Shiva's head, who looks on the world coolly as lord of the house, Shashanka.
    te: 'పాల సముద్రమునుంచి జనించిన లక్ష్మీదేవి తమ్ముడు, చంద్రుడు, అమృత కిరణములు కలవాడు, శరదృతువులో మానవాళిలో శృంగార రసం మీద ఆసక్తిని పెంచేవాడు. శ్రీకృష్ణదివ్య బృందారాసలీలలను చూసిన అదృష్టశాలి, పాలసముద్రముపై పవళించే శ్రీకృష్ణుని చినబావమరిది, శివుని తలపై నగవలె వెలిగే, గృహాధిపతియై లోకమును చల్లగా చూసే శశాంకునికి నమస్కారం.'
  - type: verse
    id: v179
    no: '179'
    hk: |-
      zrIkRSNanAmagAnam karomi, punaHpunaH.
      zrIkRSNalIlA smaraNam karomi, punaHpunaH.
      zrIkRSNa bhaktasahavAsam karomi, punaH, punaH, zrIkRSNa pada
      dhyAnam cadAsyam karomi punaH punaH..
    en: All through this life I will keep on singing Sri Krishna's names, listening to and remembering his plays, living and roaming with Sri Krishna's devotees, serving Sri Krishna's feet and meditating again and again. This method, for becoming one with Sri Krishna's feet so that there is no birth again, is just what Sri Krishna taught.
    te: 'యీ జన్మంతా శ్రీకృష్ణ నామగానము, లీలలు వినుట, స్మరించుట, శ్రీకృష్ణ భక్తులతో కలసి వుంటూ, తిరుగుతూ, శ్రీకృష్ణపదదాస్యము, ధ్యానము మళ్ళీ మళ్ళీ చేస్తూనే వుంటాను. తిరిగి పుట్టుక లేకుండా శ్రీకృష్ణ చరణముల లో ఐక్యమగుటకే యీ విధానము, శ్రీకృష్ణులు ఉపదేశించిన దే సుమా.'
  - type: verse
    id: v180
    no: '180'
    hk: |-
      zrIkRSNopadezamu nasnuddeziJcinade:
      o mUDhAtmA! Agrahamunanta mOdiJcukOnumA.kopamunu campukOnumA.
      mAyA mohavimuktuDavagumA.
      jIvitamu kSaNakSaNamu tarugusumA.
      kAlamu iTu painanU vyardhamu
      kAnIyakumA maLLI maLLI puTTi caccu, cakrabandhamunuNDi vimuktuDavagumA.
      koTAnukoTla janmala tadupari narajanma kaligE sumA! tirigi krimikITamugA puTTakumA, duzcaryalu valadusumA.
      pazcattApapaDumA.
      manonAkkAya, karmala pavitruDavagusumA.
      manassAkSiki vyatirekamuga
      naDuvakumA! karuNAmaya zrIkRSNa dhyAna nimagnuDavagumA.
      yI janma tudina zrIkRSNa caraNa vilInamu, sAdhyamu, tathyamu sumA..
      (nenu
      yI jIvitAntam jIvanmRtuDigA paDi vuNDAli) nIpada dAsyamu dhyAnamu, nIpaibhaktiyu, premayu satatamu.
      nIpadadAsula sahavAsamu niratamu yI jIvita paryantamu pramukhamugan: nI nAmagAnamu, zaraNamu, nI divyapadakaivalyamu maraNAnantaramu tathyamugan .
      nIviccina varamulu nAku ananta karuNato nijamuga zrIkRSNA..
      navvutA.
      navvistA.
      navvutU navvistA.
      navvistU navvutA..
      navvulu ruvvutA, civvu rivvunA.
      nuvvu navvaGgA kuvvAkuvvaGgA.
      nityAnam daGgA.
      nalguri madhyaGgA, nirantaraGgA raGgA raGgA, pANDuraGgA..
      helagA, avalIlagA, truLLutU trELLutU taLataLA tArakalA bratikestA! nI dayacENTa, nAtudakaNTA..
      o navvulanidhI.
      nagadhara naLinI zrIkRSNa
      zrInidhI .
      pUrNa dayAdivyadadhI .
      premala pEnnidhI.
      mA jIvana paramAvadhI..
      zaraNanipiJci, nannu, nIcEntaku cercukuNTivi kadammA zrIkRSNAnandamayunigAnimmA.
      yI bratukutudaku nannu zrIkRSNa AnandAdhAma nitya nivAsigA ceyavammA.
      "zrIkRSNa prasAdam" sarvam zrIkRSNArpaNamastu..
    en: |-
      This is Sri Krishna's teaching, directed at me:
      O foolish soul! Beat down your fury; kill your anger. Be free of the delusion of maya. Life dwindles moment by moment. Do not let any more time be wasted. Be freed from the wheel of being born and dying again and again. After crores upon crores of births you have received a human birth! Do not be born again as a worm or insect; give up bad conduct and repent. Be pure in mind, word and deed. Do not act against your conscience. Be immersed in meditation on the compassionate Sri Krishna. At the end of this life, merging into Sri Krishna's feet is attainable and true!

      (I must live out the rest of this life as one dead to the world.) Servitude at your feet, meditation, devotion and love for you, always. Above all, until the end of this life: the company of your servants, singing your name, taking refuge, and your divine state of liberation at your feet after death, which is certain. The boons you have given me with endless compassion are real, Sri Krishna!

      I will laugh. I will make others laugh. Laughing, I will make others laugh. Making others laugh, I will laugh. Scattering laughter, quickly. As you laugh, cooing like a baby, in eternal joy, among everyone, constantly, Ranga, Ranga, Panduranga! Easily, effortlessly, leaping and skipping, I will live sparkling like a star, by your mercy, until my end. O treasure of smiles! Holder of the mountain, lotus-like Sri Krishna, treasure of fortune! Full ocean of divine compassion! Great treasure of love! The supreme limit of our life! Having made me say "I take refuge", you drew me to your hand, did you not? Make me full of the bliss of Sri Krishna. At the end of this life make me an eternal resident of Sri Krishna's abode of bliss.

      "Sri Krishna's prasada." May everything be offered to Sri Krishna.
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v181
    no: '181'
    hk: |-
      namAmi, satatam,tat,sat, cidAnandam, mugdhamuraLI, ravaLIlola, bAlagopAlam, rAdhAmAdhavam, govindam, bRndAvihAra, madana gopAlam, Anandanilayam
      naLinInAdham anantakoTi, brahmANDanAyakam, jagannavaram, gajendramokSadam, vande! vande, nudevam,
      yazodA, mAtAnurAgabaddham, ulUkabandhanakrIDAvinodinaMvizva varadam..
    en: "Salutations always to Sri Krishna, the God of gods and refuge of the worlds: the little Krishna who plays the flute that enchants the world, with that true Chidananda, relishing the sweetness of song; the great wrestler of the world, who plays and sings with Radha in the Tulsi grove, the price of joy, the lord of endless crores of worlds, who makes the universe a drama, who gave liberation to Gajendra, the son of Vasudeva, who, overcome by Mother Yashoda's love, was tied to the mortar, showing his plays."
    te: 'ఆ సత్యమైనచిదానందంతో,జగత్ సమ్మోహనకరమైన, వేణు వునూదుతూ, గాన మాధుర్యాన్నాస్వాదించేచిన్ని కృష్ణునికి, రాధతో కలసి తులసీ వనంలో ఆటపాటలాడే జగజ్జెట్టి,సంతోషపువెలవై,అనంతకోటిలోకాలకూ అధిపతి, జగత్తునునాటకంగా నడిపించే,గజేంద్రునికి మోక్షమిచ్చిన, వసుదేవసుతుడు, తల్లి యశోదప్రేమకు లొంగిపోయి,రోలుకుకట్టబడివున్న, తనలీలలు చూపించే లోకాలకు దిక్కైన సదేవాదిదేవ శ్రీకృష్ణులకు, ఎల్లపుడూ నమస్కారాలు.'
  - type: verse
    id: v182
    no: '182'
    hk: |-
      govindamRdu, madhurAdharA, zoNa, zoNimAvakSarAjitA, rAdhAdi taptahRdaya, bhaktassarvAnanda damAnandadhAmam.
      golokabRndA vAsina, mIzvaram
      devadevezama mArAdhya zrIkRSNam, mama, zrIkRSNa dAsyam, zrIkRSNabhaktim, anmajanmAnte, zrIkRSNapadakaivalyadam, manmAbhirAmam.
      oM hare zrIkRSNAya namaH
    en: 'Endless crores of salutations to Lord Sri Krishna, Sarveshwara, my family deity, the dweller of the joyful Goloka Brindavan: Gopala who delights cows, who together with Radha, whose heart is coloured with love by the touch of his soft, sweet lips, brings all joys to all the devotees, whose hearts are nests of longing; the merciful one who protects me, unworthy as I am, so that I am not left helpless, grants me devotion to serve Sri Krishna, and as soon as this life ends unites me with his lotus feet.'
    te: 'గోవులకు ఆనందంకల్గించే, గోపాలుడు,తన మెత్తని తీయనిపెదవుల తాకిడి ద్వారా రాగరంజితమైన హృదయిని రాధ తోసహా, తహతహలాగుండెల గూడువైన భక్తులందర్కి అన్ని సంతోషాలు సమకూర్చే ఆనందమయ గోలోక బృందావనవాసి, సర్వేశ్వరులు, నేను కొల్చేఇలవేల్పు, అనర్హుడైనన్ను అనాథునిగాకుండాకాపాడి, శ్రీకృష్ణ సేవ భక్తి ప్రసాదించి, యీజన్మముగిసినవెంటనే, తన పాదార విందములలో ఐక్యముచేసు కొనే కారుణ్యులు శ్రీకృష్ణ విభునికి అనంతకోటి ప్రణామాలు.'
  - type: verse
    id: v183
    no: '183'
    hk: |-
      zrIkRSNaMvande jagadgurum mamanityAnuSThAnam - navadazavidha ArAdhana, (sandhyAvandanapUrvakam)
      1. dhyAnam: dhyAnamekaMzrIrAdhAkRSNa devaram..
      2. gAnam: gAnamekaMvaMzImohana kRSNa, krIDAvinodammanoharam, sAmagAnasadRzam..
      3. japamekam,nArAyaNASTAkSariH harekRSNamantrapUrvakam (japam)
      4. bhajanam: bhajanamekam zrIkRSNa divya nAmamanantaphalitadam.
      5. lakSyam: lakSyamekam zrIkRSNa pAdAravinda kaivalyam..
      6. kartavyam: kartavyamekam anukSaNa zrIkRSNa padadhyAnam, nAma gAnam, zeSa jIvitaparyam tam..
      7. sphUrtiH: sphUrtirekam zrIkRSNa anugra hapUrvaka AjJApAlanam..
      8. darzanam: darzanam zrIkRSNa divyamaGgaLa vigraham, zrIkRSNa dayAkAraNAt janmasAphalyArdham..
      9. zaraNam: zaraNa mekaikam zrIkRSNa divyavzrIcaraNadvayam..
      10. vAsam: vAsamekaikam zAzvata zrIkRSNa Ananda dhAmanivAsam..

      vITitopATugA:
      zlo..
      zravaNam, kIrtanam, viSNoH, smaraNam, pAdasevanam arcanam, vandanam, dAsyam, sakhyam, Atmanivedanam - navavidhabhaktimArgamulu (vyAsa bhAgavatam-7:5:23) anusariddAmu.
      1. zravaNam : zravaNamekam zrIkRSNa vividhAvatAra, kathAbharitabhAgavatam..
      2. kIrtanam kIrtanam kRpAkAraka zrIkRSNa bhaktassarva vijayapurANammokSa sAdhakam..
      3. smaraNam : smaraNamekam zrIkRSNa bhagavadgItAsUktimuktAvaLiH..
      4. pAdasevanam: kaivalyaprada, dayAmaya, zrIkRSNa pAdasevanam, karomi AjanmAntam..
      5. arcanam: arca yAmi, devadeveza zrIkRSNam anantarUpa prabhum..
      6. vandanam: vandanam..
      7. dAsyam: dAsyaGkaromi, bhaktassarva sahita zrIkRSNa devaram..
      8. sakhyam sakhyaGkaromi, zrIkRSNa bhakti, pracArakadhmanya puruSa nahasrapUrvakam, sadAhasita, zrIkRSNam, anunityam..
      9. Atmanivedanam: mamArambhAt, zrIkRSNa prasAdita, sparvam, zrIkRSNArpaNam, karomitakSaNam, Atma nivedanam..

      zrIkRSNa dAsyadazakam
      1. kanulumUsina, kAnabaDu, kamanIyakAntuDu, zrIkRSNuDu, dAsoha maJcu, zirasuvaJci, zaraNani, zrIcaraNamulaNTagan.
      2. mukkucivara, cinduleyu, cilipicinnAri, caGgalva dAri, nandanandana, mukunduDu, navarasabharita, zrIkRSNa lIlAmRta, tatvAsvAdana, cesi, mudamuga, gadya padyamula, AtmArpaNa ceya, hRdyamnamugan.
      3. pEdavi vippagA, vEluvaDu, vEnnadOGga, vizvarUpuni, divya gADhAgAnamu, jagatpramodamugan, zrIkRSNa kRpA kAraNambugan!
      4. kaNThamandu, kaliyatirugu, zrIkaNThuDu, akuNThita bhaktidI, kSAparuDa, vagumani, hEccariJcucun.
      5. hRdayasthu~DayyE, mAhiraNmayIzuNDu, mAyAmohAtItuDa, va gumani, hitamu, palkucun.
      6. cetalanadupuceyu, cinmayAnanda, gItAcAryuDu, svaphalApekSarahita, karmAcaraNacesi, sarvakarmaphalamu, tanakarpiJcumanu, zrIkRSNa caityanyam, bOkkaTE, ucitamanucun, takSaNamAcarimpumanucun.
      7. kaDupuniNDu, kAruNyadhAmuni, kaTAkSambuna, zrIkRSNa, madhurapuNya, kathAsmaraNa, zravaNA, nandamulavalan.
      8. naDakalu, nagadharuni, nirdiSTa iSTapadulu, aSTakaSTa naSTaduSTa, nikRSTambulu, nikkamuga, nivAriJcucun.
      9. nArIcora, naLinInAdhu, muraLIravaLulu, nakhazikhaparyantamu, rakSanOsagu, niratamu, nelanAlgucEragula naDayADinan.
      10. dikkutocaninannu, devadeveza zrIkRSNalu, dayAsudhA, karamula, ceradIsi, tana, paramapada, dAsya, dhyAnavaramOsagi, nAlkuJcuna, nArAyaNamantramu,
      nirantaramuga, nartimpajesi, yIjIvitAntamuna, zrIkRSNa kaivalyamu, prasAdim tunani,ri ardratato, sarvaniyantagAna, kevalamu, yIsarvAdhamuni, uddariJci dhanyuni gAceyuTa kun!!

      “zrIkRSNa prasAdam"

      "sarvam zrIkRSNArpaNamastu”

      ~kallUri suryaprakAza mUrti
    en: |-
      I bow to Sri Krishna, the Universal Teacher (Jagadguru).
      My Daily Spiritual Discipline - The Ten-fold Worship (preceded by Sandhyavandanam):
      1. Dhyanam (Meditation): Meditation solely upon the divine Lord Sri Radha-Krishna.
      2. Ganam (Singing): Singing only of the enchanting, flute-bearing Krishna, whose wondrous divine pastimes are as delightful as the sacred Sama Veda melodies.
      3. Japam (Chanting): Chanting the Narayana Ashtakshari mantra preceded by the Hare Krishna Maha-mantra.
      4. Bhajanam (Devotional Worship): Chanting and singing solely the divine holy names of Sri Krishna, which bestow infinite fruits.
      5. Lakshyam (Goal): The singular ultimate goal - attaining liberation (Kaivalya) at the lotus feet of Sri Krishna.
      6. Kartavyam (Duty): The paramount duty - moment-to-moment meditation on Sri Krishna's feet and chanting His name for the remainder of this life.
      7. Sphurti (Inspiration): The sole inspiration - dutiful obedience and adherence to Sri Krishna's commands with His divine grace.
      8. Darshanam (Vision): Beholding Sri Krishna's auspicious divine form, fulfilling the true purpose of this human birth through His mercy.
      9. Sharanam (Refuge): The sole and absolute sanctuary - the twin holy lotus feet of Sri Krishna.
      10. Vasam (Abode): The ultimate residence - eternal dwelling in the blissful supreme realm of Sri Krishna.

      Along with these, following the Nine Paths of Devotion (Navavidha Bhakti from Srimad Bhagavatam 7:5:23):
      1. Shravanam (Hearing): Listening solely to the Bhagavatam, richly filled with accounts of the various divine incarnations and pastimes of Sri Krishna.
      2. Keertanam (Chanting/Glorifying): Glorifying the grace-bestowing purana of the devotee's all-victorious triumphs through Sri Krishna, the means to liberation.
      3. Smaranam (Remembering): Ever recollecting the garland of pearl-like verses of Sri Krishna's Bhagavad Gita.
      4. Pada-sevanam (Serving the Holy Feet): Serving the lotus feet of the compassionate Sri Krishna, the granter of liberation, throughout my lifetime.
      5. Archanam (Ritual Worship): Worshiping the Lord of gods, Sri Krishna, the cosmic sovereign of infinite manifestations.
      6. Vandanam (Offering Homage): Offering humble, reverent prostrations unto Him.
      7. Dasyam (Servitude): Serving the Supreme Lord Sri Krishna alongside all His revered devotees.
      8. Sakhyam (Friendship): Cultivating intimate companionship with the ever-smiling Sri Krishna each day, preceded by the company of thousands of virtuous souls propagating devotion to Him.
      9. Atma-nivedanam (Self-Surrender): Offering complete, immediate self-surrender - dedicating everything bestowed by Sri Krishna's grace entirely back unto Him from the very beginning.

      Sri Krishna Dasyadashakam (Ten Verses on Servitude to Sri Krishna):

      1. Upon closing my eyes, the charmingly effulgent Lord Sri Krishna appears before me; uttering "I am Your servant" (Dasoham), bowing my head, seeking refuge, and touching His lotus feet.
      2. The playful little darling boy at the tip of the nose, adorned with blossoms, the joy of Nanda, Mukunda - relishing the nectar of Krishna's pastimes filled with nine aesthetic sentiments (Navarasa) and joyfully, heartily offering myself through prose and verse.
      3. As the lips open, the divine, deep hymn of the butter-stealer and cosmic-formed Lord pours forth, bringing universal delight through the supreme grace of Sri Krishna!
      4. Residing and revolving within the throat, the glorious-throated Lord constantly warns: "Remain steadfast and unwavering in the discipline of pure devotion!"
      5. The luminous golden Supreme Lord settled within the heart, counseling wisely: "Transcend all illusions of Maya and worldly attachment!"
      6. Guiding all actions, the Chinmayānanda teacher of the Gita urges: "Perform selfless duty without desire for results, dedicate the fruits of all works unto Me; Krishna-consciousness alone is righteous - practice it immediately!"
      7. The stomach fills with fullness and contentment by the compassionate glance of the Lord, through the joy of listening to and remembering the sweet, sacred tales of Sri Krishna.
      8. The paces of life follow the designated paths willed by the Bearer of Mount Govardhana, truly warding off the eightfold afflictions, losses, evils, and miserable plights.
      9. The melodious strains of the flute of the captivating lover of milkmaids and lotus-eyed Lord protect from head to toe always, wherever one walks across the four corners of the earth.
      10. When I was utterly lost, Lord Sri Krishna, God of gods, gathered me in His hands of nectarine compassion, bestowed the boon of servitude and meditation upon His supreme feet, made the Narayana mantra dance continuously upon my tongue, and tenderly resolved, as the Supreme Sovereign, to grant me Krishna-Kaivalya at the end of this life - purely to uplift and sanctify this most humble soul!

      "Sri Krishna Prasadam"

      "Everything is dedicated unto Lord Sri Krishna."

      ~Kalluri Surya Prakasa Murthy
