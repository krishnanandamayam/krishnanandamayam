title:
  hk: zrI kRSNAnandamayam
  en: Sri Krishnanandamayam
  author:
    hk: ''
    en: ''
prefaces:
  en:
    title: Preface
    blocks:
      - type: prose
        id: pe01
        text: |-
          While bowing before the ALMIGHTY with folded hands, eyes pouring out tearful tales of
          misconduct life thus far, ripe with arrogance out of ignorance of the speck of the supreme being
          permanently stay-put in my heart, a thought of wailing for redemption has been kindled by the
          ever-Compassionate Divine, with an indicative violent shiver in the spine & thud in the
          chest convulsions on a glorious day recently. HE simply ordained "Don't worry, | just gave you
          the awakening kick. You ($jIvAtma$) are always part of my universal soul.($paramAtma$)
          Wash out your sins by the Jet-spray of my $nAmoccAraNa$ i.e. chanting oul my name of various
          forms in some of the easiest ways(with total faith & dedication). AND LEAVE THE REST TO ME.
          You would be bestowed with the boon of salvation i.e. $mokSam$: You merging back with me as
          always."
      - type: prose
        id: pe02
        text: |-
          Thus began the Divine Dictations that subsequently emerged as the booklet of free verses titled
          "$zrI kRSNAnandamayam$" i.e., full of Heavenly Bliss of the SUPREMELORD $zrI kRSNa$.
          The source, sprit, script and everything connected with anything on this, that and it are the sole
          proprietary of $zrI kRSNa bhagavAn$!!
          "While studying, devotees to loak at the wide spectrum of spontaneous spirituality similar to
          Upanishaths. But not through the vast voids & vortices of $vyAkaraNam$ and waste a lifetime.
          (a) The letter "$ta$" drawn from "$tat$?” is the Piousest - as Ramayana was Started -
          same has become the first letter of our first verse.
          (b) A twenty-four lettered sentence or a line in praise of the Lord is equivalent to "$gAyatrImantra$"
          - Ramayana contains 24 thousand slokas.
          (c) "Sixteen" is great because the Lord in the form of $zrI rAma$ is "$SoDaza guNa sampanna$"
          - embodiment of all the sixteen super virtues; also Lord $zrI kRSNa$ is "$SoDaza kalA zobhita$"-
           essence of the sixteen shines of Divine glitter
          (d) "Eighteen" is great because of "$aSTAdaza purANa$" - Praising of the Lord with stories and
          episodes full of his kindness & Consideration and Pardoning narrated in eighteen classics.
          (e) 108 totaling 9 - $amRta bIja$. When the Pious seeding is done, i.e. when any $mantra$ or
          $bhagavannAma$ is chanted 108 times, it imparts purity, austerity (honesty+ duty+service) leads to
          devotion & dedication thus leading to integration with the SUPREME. $viSNusahasranAma stotram$
           contains 108 synonyms with “$va$” or its derivatives .
      - type: prose
        id: pe03
        text: |-
          $oM hare zrI kRSNAya namaH$
          Also $oM namo nArAyaNAya namaH$ - $aSTAkSarI$ + $bIja akSaram$ like
          $hAm$/$hrIm$ - totaling 9
          Humans breath daily 2000 multiplied by 108 times
          The good old Lord booned the verses mostly with such lettered compositions and in the names
          of various facets of the SUPREME normally worshiped by the devatees
          (a) $zrI kRSNa$
          (b) $zrI rAma$
          (0) $zrI mahAviSNu$
          (d) $sadAziva$
          (8) $gaNeza$
          (f} $hanuma$
          (g) $subrahmaNya$/$ayyappa$
          (h) $gAyatrI$
          (i) $lakSmI$
          (j) $gaurI$
          (k) $sarasvatI$
          (l) $zrI sAyibAbA$
          and/or any form one can concentrate upon unwaveringly.
      - type: prose
        id: pe04
        text: |-
          $zrI kRSNa$: Combination of $kRS$+$Na$ meaning $astitvam$+$Anandam$-origination, meaning
          and purpose of life + Bountiful joy and eternal happiness. The supreme Lord who gives ultimate
          bliss as boon- personification of universal love. He explains the purpose of human life as making
          dedicated efforts to escape from birth-death-rebirth vicious cycle as attainment of saivation. He
          attracts all sins and destroys them; preacher of $karma siddhAnta$ and $yoga vidyA$ etc.
      - type: sloka
        id: pe05
        hk: karmaNyevAdhikAraste mAphaleSu kadAcana .
      - type: prose
        id: pe06
        text: (Quoted from the Bhagavad Gita, Ch:V)
      - type: prose
        id: pe07
        text: |-
          He atones-oh,earthly being! You simply carry out all assigned work & appropriate jobs throughout
          all stages of your life period with total devotion minus self-interest, as a right and rightful way of
          spending life lively but without claiming any right and demand for results and fruits as per your
          wishes and prescriptions because IAM the one that grants the appropriate entitlements. He
          ordained.
      - type: prose
        id: pe08
        text: |-
          Give up "$a$"- $ahaGkAram$ - Arrogance/prejudiced pride
          "$A$"- $Agraham$ - Anger
          then sure you will be granted with
          "$i$" - $ihaloka sukham$ - happiness during earthly life period & Divine blessing
          "$I$" - $IzvarAnugraham$- Blessing for perpetual joy in Heaven.
      - type: prose
        id: pe09
        text: His declaration -
      - type: sloka
        id: pe10
        hk: |-
          durbhikSecAnadAtAram, sumikSecahariNyadam .
          caturoham namasyAmiraNe dhIramRte zucim ..
      - type: prose
        id: pe11
        text: |-
          | salute all the four categories of people- (a) Food donors during calamities (0) Wealth donors
          for charities in normal times (c) Fearless fighters for national protection and orderly rule.
          (d) Piously dead - i.e. people who live as per the dictates of consciousness and so die peacefully.
      - type: prose
        id: pe12
        text: |-
          Emperor Dushyantha could be a lively example in this context. Seeing shakuntala beauty
          and youth personified aptly described as
      - type: sloka
        id: pe13
        hk: |-
          anAghrAtam puSpaGki salayamiva marUnAGkararuhaiH .
          anAviddham ratnam madhunavamanAsvAditarasam ..
      - type: sloka
        id: pe14
        hk: |-
          yamovaivasvato devoyasya sohRdayasthitaH tasyana
          vivAda stho mAgaGgAm mAkuruSvatH .
      - type: prose
        id: pe15
        text: |-
          Unsmelled fresh flower, tender leaf unmarked by human nail, uncut & unpolished raw diamond,
          fresh untasted sweet honey - he got the idea of taking her as his queen and declares clearly "She
          must be the suitable royal consort, otherwise , such a thought never occurs to me, as there could
          never be any diversion from my righteous path of life as conscious is my best guidance."
      - type: sloka
        id: pe16
        hk: |-
          sarvavedeSuyatpuNyam sarvatIrtheSu yatphalam . tatphalam puruSaApnoti . stutvAdevam janArdanam .
          zrI vAsudevanamostute ..
      - type: prose
        id: pe17
        text: |-
          Meaning that he who never differs with the Supreme Lord (called by any name) who is embedded
          in his heart, has no need for a holy dip in the river Ganga charity in Kurukshethra for washing out
          sins as no sins are ever committed!!.
          Two glaring examples for his ocean wide kindness.
          1) Ajaameela, the wicked hunter, when wailing for his beloved son in his last moments “oh $nArAyaNa$ “
          the Lord accounted it as “$bhagavannAmoccAraNa$’” chanting of nis
          name.
          2) A Lady calling her pet parrot always “$rAma, rAma$" was granted $mokSam$.
      - type: prose
        id: pe18
        text: $bhakti$ , i.e. devotion towards the divine has been best explained by the saint AADI SANKARACHARYA
      - type: sloka
        id: pe19
        hk: aGkolam nijabIjasantati rayaskAnto palam sUcikA . sAndhvInaija - vibhuMlatAkSiti ruham sindhussaridvallabham prApnotIti yathA tathApazupate pAdAravinda dvayam . cetovRtti rupetyatiSTati sadAsAbhaktirityucyate
      - type: prose
        id: pe20
        text: |-
          Just as the $aGkolam$ tree attracts back its seeds for sprouting, iron needle towards magnet, a
          wedded woman her spouse, a creeping plantation encircling a tree trunk and river to ocean - the
          devotee getting naturally & permanently attracted and attached towards the lotus feet of the
          LORD SUPREME is known as $bhakti$.
      - type: sloka
        id: pe21
        hk: |-
          anityAni zarIrANi vibhavonaivazAzvataH :
          natyim sannihito viSNuH kartavyodharma saGgrahaH ..
      - type: prose
        id: pe22
        text: |-
          Sahadeva, the youngest pandava atones “These human bodies eventually die, none of the
          wealth is permanent, every moment life gets reduced and nears Lord $viSNu$; as such carryout
          assigned duties honestly and consciously in a detached manner in accordance with the laws of
          the nation submitting everything to him. This is the surest way to reach Him for re-merger."
  te:
    title: ముందుమాట
    blocks: []
items:
  - type: verse
    id: v1
    no: '1'
    hk: |-
      tejomayam yajJadAna tapaH karmAntargata rAjitam zrI rAmam.
      sarvezvaram sarvArtha sAdhanArthamarcita macyutam zAzvatam.
      dayAnidhim kaivalyada svayam prakAza mUrtim zubhakaram zivam viSNum.
      yogezvara zrI rAdhAkRSNam, tam sadA namAmi zrI lakSmI nArAyaNa daivatam..
    en: The effulgent Lord Sri Ram, who is present in all sacrifices, austerities, and prescribed duties, the supreme embodiment who is worshipped for every objective, the infallible one, the eternal, one who delivers due to ceaseless mercy, one who appears on his own, the all auspicious Lord Shiva, Lord Vishnu, master of mystic Yoga Sri Radha Krishna, the embodiment of all Sri Lakshmi Narayana; to you I offer my humble obligation again and again.
    te: ''
  - type: verse
    id: v2
    no: '2'
    hk: |-
      zrI vighnezvaram sarva vighnaharam kumAragurum ca sumukham phAlacandram.
      smarAmi prathamam surAgra pUjitam gaurIzakumAram siddhArtha gaNezam..
    en: I first remember Lord Vighneswara, who destroys all impediments and obstacles, the spiritual master of Lord Kartikeya, who has a moon-like face, he who is worshipped first among the demigods, the son of mother Parvati, one who fulfills all desires.
    te: ''
  - type: verse
    id: v3
    no: '3'
    hk: |-
      praNAmi jagadvIram, vizvaH zreyakArakam, viSNum jiSNum, muktidam advitIyam acyutam, jagannAtha vallabham..
      dhyAyAmi devakIsutam aniruddham Adi daivatam. deva devezvaram zrI harim, AdimadhyAntarasthitam sthiram..
    en: I offer my obeisances to the SPGH Sri Hari, the infallible Lord, the lord of the universe, the uplifter of this world, Sri Vishnu, the son of Devaki, the Primeval Lord who is unrivaled, the beginning, the middle, and the end of the creation; the unchangeable one.
    te: ''
  - type: verse
    id: v4
    no: '4'
    hk: |-
      pazyAmi paramezvaram vizvezam virUpAkSam memokSadam. phAlAkSam pazupatim satyam zivam sundaram..
      zambhum vizvambharam sAmbam Izvaram zAntam mahezvaram. vizvam sarvam vizvezvaram zivamayam, sadAvandeham tam vizvanAtham..
    en: The controller of the entire world, the beautiful-eyed, the one with a third eye on his face, the one who gives peace and happiness to all living entities, the one who protects the downtrodden upon the mere utterance of his name “sambho”, the one who beholds all the planetary systems, the bestower of wealth, the personification of peace, equal to all, all-auspicious, all-pervasive, supreme controller; perceiving him always through my mind’s eye, I offer him my obeisances.
    te: ''
  - type: verse
    id: v5
    no: '5'
    hk: namAminanda kizoram, zrI kRSNam lokarakSakam, gItAcAryam satya priyam ca, nadAzrI zivadhyAna yoginam, zrIzam zrIkaram zreyam zaurim, rukmiNI prANavallabham, ramyam zrIrAdhAmAdhavam, rAsalIlA vinodinam..
    en: Son of Nanda Maharaja, Protector of the worlds, Sri Krishna, he who presented the truth through the teachings of the Bhagavad Gita, he who always meditates upon Lord Shiva, the all-auspicious bestower, the husband of Rukmini Devi, the one who never separates from Radha Rani, the one who mischievously displays conjugal love; to that Supreme Lord, I offer my obeisances.
    te: ''
  - type: verse
    id: v6
    no: '6'
    hk: rAmam zrIrAmam lokAn ramayantItirAmaH iti sArthaka nAmatAraka rAmam | kaikeyI nandanam kausalyAsutam, vaidehI vallabha dazaratha rAmam . vizvAmitra priyam vaziSTha viziSTa ziSyam ca satyavAkpAlana zobhita eka patnI vratAdi sakala guNAbhirAmam. paramezvara pUjita nadAzivArcanA rAjita saccidAnanda brahmam sarvezvaram zrI rAmam. zaraNA gata rakSaka, bhakta janapoSaka jagadabhirAmam zrI rAmam. jJAna vAziSThArtham ca yoga vAziSTham vizva tejasam zrIrAmam. kAruNyadhAmam kaivalyadam kaLyANa zrI kodaNDarAmam. tam namAmi nirantaram mamArAdhya rAmam manobhirAmam ca hanumatsevita rAmam param jyotiH parandhAmaH zrI zrIrAmam..
    en: One who gives pleasure to all the worlds (befitting his name), the dear son of Kausalya and Dasaratha, the husband of Sita Devi, the favorite student of Vishwamitra, the follower of the vow of having a single wife, the follower of his father’s instructions, the possessor of great qualities like truthfulness, offering respects to Lord Shiva, protector of refuge, he who gives liberation out of mercy, one who ensures his devotees get all they require, the representation of the term “Gnyanavastha” - the possessor of all scientific knowledge, the personification of “Yogavasishta”, the bestower of liberation, the proprietor of all the worlds, the auspicious, the greatest bowman, my favorite Supreme Lord, the one who is ever-faithfully served by Hanuman, to that Sri Rama, I offer my humble obeisances.
    te: ''
  - type: verse
    id: v7
    no: '7'
    hk: |-
      mantram
      hariharaputrAya vidmahe zabaragirivAsAyadhImahi. tanno maNikaNThaH pracodayAt..
      viSNupAdodbhavAyai ca vidmahe zivazaGkara zirasthira nivAsinyaica dhImahi. tanno loka pAvanI gaGgA bhavAnIH pracodayAt..
    en: |-
      Son of Lord Siva and Kesava, residing on the top of Sabarigiri, renowned as Manikantha; to that Ayyappa I offer my obeisances.
      Sprouted from the lotus feet of Sri Mahavishnu, residing on the head of Lord Siva, one who purifies the three worlds - to that Ganga Mata, I offer my obeisances.
    te: ''
  - type: verse
    id: v8
    no: '8'
    hk: |-
      prAtarjapet pitAmaham ca madhyAhne mahezvara rUpiNIm.
      sandhyAkAlevibhum viSNum nityam zrI devIm zrI gAyatrI mAtaram..
    en: I worship Gayatri thrice a day, for she represents Lord Brahma at dawn, Lord Shiva at noon, and Lord Vishnu at dusk.
    te: ''
  - type: verse
    id: v9
    no: '9'
    hk: namostu mAtApitarau namostu pratyakSa devau sucarita zobhitau. dhanyosmi zrI janakajananyau, dhanyosmi yuvayoH garbhodbhavam bhAgyam me mokSakArakam..
    en: To my parents, the personification of the divine, who have a spotless character, the glorious personalities, I offer my obeisances to you. It is my great fortune to have been born from your womb, entitling me to liberation.
    te: ''
  - type: verse
    id: v10
    no: '10'
    hk: aho! bhagavadanugraham advitIyam adbhutam, ayAcitam anirvacanIyam UhAtItam, karuNApUritam ca vizvarUpam adRzavizAlam Anandamayam
    en: |-
      The mercy of the Supreme Lord has no parallel, is ultimate, does not need to be asked, cannot be described, is unimaginable to the human mind, and gives happiness greater than the entire world.
      (If we live with a proper mindset, the Lord helps and protects; he protects those who take refuge)
    te: ''
  - type: verse
    id: v11
    no: '11'
    hk: duSTazikSaNam, ziSTarakSaNam, zrI kRSNAvatAraramya gamyam. vRSabha, zakaTa, kaMsa, naraka, zizupAlAdyasura saMharaNam. lIlAmAnuSa vigraham, bAlA lIlAvinodinam manoharam. yogavidyA vidhAtAram nRtyagAna rasarAgamayam, bhaje ..
    en: I always remember the personal forms of their Lordships Ganapati, Lord Siva, Lord Brahma, Lord Vishnu, Ayyappa, Subrahmanya/Kumara Swamy, Sai of Shiridi, and Puttaparthi.
    te: ''
  - type: verse
    id: v12
    no: '12'
    hk: |-
      "zrI hanumantam AJjaneyam dhanyam, sadA zrIrAma nAma dhyAna daivatam.
      zAkinI DhAkinyAdi duSTasUdanam, vande, bhava bhayaroga zokaharam harim .."
    en: I offer my obeisances to Anjaneya, the son of Anjana Devi, who always recited Lord Rama’s name; the one who destroys all ghosts, removes fear from everyone, eradicates diseases, drives out misery, and protects his devotees.
    te: ''
  - type: verse
    id: v13
    no: '13'
    hk: |-
      namAmi zivazivAnI kumAram, zrIvallIzam, tArakAsura sUdanam.
      mamasarvArthadam, surasenAninam, zrI subrahmaNyezvara daivatam..
    en: I offer my obeisances to the son of Shiva and Shivani, the master of Valli, the killer of Tarakasura. The one who gives meaning to my life, the leader of the devatas, Sri Subrahmanyeswara - my respects to you.
    te: ''
  - type: verse
    id: v14
    no: '14'
    hk: |-
      vandeham zrI veGkaTezam sadA zrInivAnam, Azritavatsalam ca zrIvatsasam.
      kaliyuga pratyakSa daivatam memokSadam zrI sarvezam smarAmitam saptagirivAsinam..
    en: Obeisances to Sri Venkatesa, Sri Srinivasa, the eternal abode of Sri, shelter for refugees, having the Sri Vatsa sign, directly appearing in Kali Yuga, deliverer of liberation, the Supreme Lord - I salute you, the Lord of the Seven Hills.
    te: ''
  - type: verse
    id: v15
    no: '15'
    hk: |-
      "bhajeham ramya guNadhAmam maithilI manobhirAmam zrIrAmam. sAketa sArvabhaumam, satya sandham saccidAnandam zivapriyam.
      bhaktAbhISTa varadam abhayadam zrIdharam hanumadIzvaram, kausalyAnanda rAmam kaivalyadam, dAzarathim, zrIraghurAmam.."
    en: All glories to you, Sri Rama, the embodiment of all auspicious qualities, he who attracts the mind of the daughter of the king of Mithila (Sita), the King of Ayodhya who resides in Satchitananda, dear to Lord Siva, bestower of devotees’ desires, bestower of fearlessness in Lord Hanuman, one who gives happiness to Kausalya, one who liberates, the son of Daradha - Sri Raghu Rama.
    te: ''
  - type: verse
    id: v16
    no: '16'
    hk: |-
      "helA lIlA hAsa vilAsa rasa lAsya zizum tam.
      hiraNmayI hRdayAravindam govindam mukundam..
      harim zrImannArAyaNam zrI mahAviSNum zivantam.
      hiraNyagarbham zrI rAdhAkRSNam, vande mokSadam .."
    en: Having a mischievous smile and playful behavior, the ever-youthful Krishna, who resides in the thoughts of Rukmini Devi, who is the origin of Lord Krishna & Lord Shiva, who is the one who showed his Universal Form, and who is the bestower of liberation - to that Radha Krishna, I bow down.
    te: ''
  - type: verse
    id: v17
    no: '17'
    hk: tejomayIm zrI mahAlakSmIm sarvazubhakAriNIm suzlokAm zrIlam jayAm zrI devIm, aSTaizvarya dAyinIm, vande viSNu vakSaH prakAza razmim, varadAm zrI vaiSNavIm ..
    en: Shining brightly, oh cause for all auspicious deeds, the bestower of all opulence, residing on the chest of Sri Mahavishnu, oh Mahalakshmi, kindly bestow me.
    te: ''
  - type: verse
    id: v18
    no: '18'
    hk: |-
      "zrI rAmAvatAra rahasyam sarve sarvaloka raJjanam.
      zrI kRSNa bhagavadgItA sandezam ca yoga vidhita karmAcaraNam..
      tatsarvam zrI rAmakRSNa bodhanAmRta vedAnta sAram vande vivekagurum devI prasanna zrI mAtuH zAradA nAtham.."
    en: |-
      Pleasing the inhabitants of all the planets when you descend as Lord Rama, you are the accomplisher of all tasks oh selfless personality!
      Lord Sri Krishna taught the Bhagavad Gita as a manual for all ascetics.
      All these are covered in the teachings of Sri Ramakrishna Paramahamsa, the spiritual master of Sri Vivekananda, who could envision the Goddess Sarada Devi; I offer my obeisances to him.
    te: ''
  - type: verse
    id: v19
    no: '19'
    hk: |-
      vande vindhya girivAsinIm vizvambharIm sAvitrIm zrI durgAm sarasvatIm zAmbhavIm.
      vizvajananIm vaiSNavIm, paramezvarIm, saccidAnanda brAhmIm hariNIm haindavIm ..
    en: Oh resident of the Vindhayachala Mountains, maintainer of the Universe, the combined form of Savitri, Durga, and Saraswati, mother of the Universe, teacher of Brahma Gnyana that good thoughts are the source of happiness; to you, I offer my obeisances.
    te: ''
  - type: verse
    id: v20
    no: '20'
    hk: |-
      "zailajA zvedabindujanita vRkSAgra rAjitam,
      zyAmalAsRjitAtmahRdaya saundarya zrI sumam..
      zAradAnAtha hari hara svarUpa tridaLapatram,
      samarpayAmi tat bilvam, sadAzivaprItyartham, nityam.."
    en: To she who resides on the leaf of the tree born from a bead of sweat of Parvathi, to the beautiful-hearted flower created by Goddess Lakshmi, to the bundle of three leaves created in the image of Lord Brahma and Lord Vishnu, and to please Lord Shiva - I offer my obeisances in the form of a bael leaf cluster.
    te: ''
  - type: verse
    id: v21
    no: '21'
    hk: |-
      "vande vighnanAzaka, sarvasiddhi dAyaka zrI vighnezvara sahodarIm vizvezvarIm vizAlAkSIm pArvatI paramezvara priyaputrIm.
      sarvAbhISTa varapradAyinIm aSTaizvarya dAyinIm, zrI santoSi mAtaram . dehime, akhaNDa saubhAgyam prazAnta jIvanam ca prasIda. hevizvapriyA .."
    en: Oh sister of the Supreme Lord and the master of the Universe, the beloved of Lord Shiva, bestower of the eight great boons, oh Santoshi Mata, please protect me, and please bestow me with the boon of ‘Swargam’.
    te: ''
  - type: verse
    id: v22
    no: '22'
    hk: |-
      oM. sarasijanAbham sarojahastam zrI zrIrAmam. mandasmitavadanam maGgaLezam zrIrAdhAkRSNam.
      oM namonArAyaNAya oM namazzivAya ceti. dhyAyAmi niratam, tam, zivam, hrIm zrIm viSNum mokSadam..
    en: Oh incarnation of the lotus-navel Lord, oh sweet-smiled master of Rukmini Devi, oh embodiment of love - Sri Radhakrishna, he who bestows liberation to those who chant the panchakshari mantram of Siva and the ashtakshari mantram of Goddess Shakti; to that Srimannarayana, I offer my obeisances.
    te: ''
  - type: verse
    id: v23
    no: '23'
    hk: zatakoTi nArikeLa phalAntargata divya zvetakAnti tejasam zambhum . zatasahasrakoTi kSIrasAgara sadRza prakAzazobhitam zaGkaram.. ananta koTi tArAzazi tejo rAzinam sAmbam, tulasI bilvasahitam. tam ArAdhayAmi hariharasvarUpa sadAzivAtmaliGgam me viSNusAyujyadam..
    en: Oh lord who is shining like millions of white coconut kernels, with the effulgence of billions of milk oceans, brighter than trillions of stars and the moon, the combined form of Lord Shiva and Krishna, and which has the power to liberate - to such an Atmalingam, I offer my obeisances.
    te: ''
  - type: verse
    id: v24
    no: '24'
    hk: |-
      tejasvinIm tanmayIm, lakSmIm, hariNIm nArAyaNim vibhUtim, ramAm kSIrajAm,
      tejazrIm svaprakAza rUpiNIm, vande hiraNmayIm zriyAm, zivAm ca mokSadAm ..
    en: She who emerged from the milk ocean, with a shining effulgence, adores Lord Vishnu as her husband, and is the bestower of all opulence and liberation - I meditate upon you.
    te: ''
  - type: verse
    id: v25
    no: '25'
    title: sarvArtha sUkSma zlokam
    hk: |-
      oM namo nArAyaNAya oM namazzivAyaca zrIrAma zrI rAdhAkRSNeti .
      dhyAyAmi zrI karam zambhum tatsAmbazivAtmaliGgam vizvezam viSNu sAyujyadam me ..
    en: Chanting the Vishnu Ashtakshari, Shiva Panchakshari, all the names of Lord Sri Rama and Radha Krishna, and all the auspicious names of Lord Shiva - I bow down before all of you. I meditate on the bestower of liberation, Lord Vishnu - may I remember him always!
    te: ''
  - type: section
    id: s01
    hk: |-
      zrI zrIvanalaharI hAram
      sarva saGkaTahAra zrI rAdhAkRSNASTapadi
    en: ''
  - type: verse
    id: v26
    no: '26'
    hk: mugdhamanoharamUrtim, muraLInAda lInam. vizvarUpadhAraNam, vizvamohana vigraham. sadAhasita vadanam, veNugopAla zrIkRSNam rAdhAmAdhavam, namAmi nityam, viSNusAyujyadam.
    en: He who has the most captivating cupid-like form, blending with the sound of the divine flute, the embodiment of all the worlds, bewildering the fourteen canonical planets through his beauty, he who has a sweet smile and a loving face, who always has Radha by his side, and the bestower of liberation and permanent residence in the topmost echelon of Vishnu Loka; to that Venu Gopala Krishna, I offer my humble obeisances.
    te: ''
  - type: verse
    id: v27
    no: '27'
    hk: |-
      zaraNAgatavatsalam zyamantaka grahItAram; zvetavAhana sArathim. sarva maGgaLakaram, uddAlakAkrUrakucelAdibhaktavaradam.
      satyasvarUpam, pArijAtApahAriNam, satsaGkalpa siddhidam, namAmi. sAmavedapriyam, sAndIpanI ziSyam, zrI balarAmAnujam, zrI kRSNam..
    en: To He who shows mercy to his refuge-seekers, accepter of the Samantaka Mani and Satyabhama, charioteer of Arjuna, all-auspicious, most merciful, non-envious, bestower of millions of devotees like Kuchela, the absolute truth, one who bought the nigh-flowering jasmine plant to the Earth, bestower of all initiatives with good intention, lover of Sama Veda recitation, the disciple of Sandipani Muni, and the brother of Lord Balarama - oh Sri Krishna! My respects to you.
    te: ''
  - type: verse
    id: v28
    no: '28'
    hk: 'karmAcaraNabodhitam vidhitakarmAcaraNa Adarza puruSam. sadAzivapUjitam, tapasvinam, tapassva rUpam, tapamAtreNa prasannam. tapAntam, tapAntargatam, tapaH prayojanam ca, paramArtham, zrI harim. tApatrayaharam, tattvAcAryam, praNamAmi, tam, tANDava zrI kRSNam..'
    en: To the one who taught the importance of following one’s prescribed duty and who carried out his duty perfectly, worshipped by Lord Sadasiva, the embodiment of austerity, one who can be obtained only via unalloyed devotion, Supreme Objective, oh Sri Hari, remover of unhealthy desires, teacher of the Vedic essences, I offer my respectful obeisances, Sri Krishna!
    te: ''
  - type: verse
    id: v29
    no: '29'
    hk: duSTazikSaNam, ziSTarakSaNam, zrI kRSNAvatAraramya gamyam. vRSabha, zakaTa, kaMsa, naraka, zizupAlAdyasura saMharaNam. lIlAmAnuSa vigraham, bAlA lIlAvinodinam manoharam. yogavidyA vidhAtAram nRtyagAna rasarAgamayam, bhaje ..
    en: Annihilator of miscreants, protector of devotees, and the upholder of all the good in the world! You have vanquished villains such as Dhenuka, Sakata, Kamsa, Narakasura, and Sisupala. You have given immense happiness to your devotees through your mischievous deeds as a child during your earthly avatar. You have created Yoga vidya and performed Rasa Lilas; I worship you, beloved Sri Krishna.
    te: ''
  - type: verse
    id: v30
    no: '30'
    hk: naLinInAtham, navInItacoram nIlatejam, nIrajAkSam yazodAnanda, devakIvasudeva sutam, gopAlam, gokSIrapriyam . gopIvastrApahara, kALIyamardana, govardhanoddhArakam . kurukSetre, arjunamArgadarzinam. zrI kRSNam, vandeham jagadgurum..
    en: Oh, husband of the goddess of fortune, pilferer of butter, he who is effulgent through the hue of a rain-filled cloud, lotus-eyed Lord, son of Yashoda, son of Vasudeva & Devaki, oh Cowherd, lover of cow milk, stealer of the Gopis’ dresses, dancer on the hood of Kaliya, he who lifted Govardhana Giri, he who showed the path of Dharma to Arjuna during the Kurukshetra war; to that Sri Krishna, the universal teacher, I offer my humble obeisances.
    te: ''
  - type: verse
    id: v31
    no: '31'
    hk: kRRra strIpUtana prANaharam, harivaMzAcAradharma prakAram. mAyAmohita, gopastrIsaha bRndAvanarAsa keLIvirAjinam. aSTadevI vallabham, vipra, gopa, gopikA gogaNarakSakam . vande, zrIharam, iLA patim, zrI kRSNam mamaviSNu sAyujyadam ..
    en: Annihilator of the cruel Putana, uplifter of Dharma as per the lineage of Hari, performer of rasa lilas in Brindavanam with his gopikas, master of eight queens, protector of Brahmanas, cowherds, and cows, I offer obeisances to you Oh Hari, husband of Prithvi, bestower of liberation in Vaikuntha!
    te: ''
  - type: verse
    id: v32
    no: '32'
    hk: |-
      rAjasUyAdhvarya pramukham, agre yudhiSThara pUjitam.
      draupadImAnarakSakam, virAT rUpapradarzinam.
      codyadautya zrI kRSNam, bhUbhArahara bhArataraNa sUtradhAriNam.
      pANDu vaMzavaradam, vande zrI kRSNam, mamakaivalyadam..
    en: The chief of the Rajasuya Yagna performed by Dharmaraja, the receiver of Agra Puja, protector of Draupadi from humiliation and loss of dignity, he who shows the universal form, mediator of peace, he who tactfully instigated the Mahabharata war to reduce the Earth’s burden, protector of the Pandavas; oh Sri Krishna! My obeisances to you, provider of liberation to his refugees.
    te: ''
  - type: verse
    id: v33
    no: '33'
    hk: sarvam zrI kRSNam, sarve sarvadA zrI kRSNam, sarve zaMzrIkRSNam, sarva sarvezam zrI kRSNam sRSTi ssarvam natyam, zrI kRSNamayam, herAdhAkRSNa . tvamevamamazaraNam ..
    en: Everything is Sri Krishna, Sri Krishna is everywhere; Sri Krishna is the Lord of all, he is the Lord of Lords, and the entire creation is filled with Sri Krishna. Oh, Radha & Krishna! You are my only refuge.
    te: ''
  - type: verse
    id: v34
    no: '34'
    title: sASTAGgam
    hk: 'ArtatrAya parAyaNam, nArAyaNam; vaikuNThAdhipam, paramAtmAnam, zrI harim zaGkha cakrazAraGga sarojahastam, viSNum vaijayantI zobhita zrI kaNTham . dazAvatAra dharam dazadizAdIpti karam, dayALum, puruSottamam : zivam, vizvezam vizvagurum zrIrAmam, namAmi tatsarvezam, zrI kRSNam me mokSadam ..'
    en: Refuge of the distressed, oh Narayana, master of Vaikuntha, Paramatma, Sri Hari, he who is decked with a conch shell, a disc, a mace, and a lotus in your hands, he whose neck is decorated with the Vaijayanthi Mala, origin of the avatars, protector of devotees, oh merciful personality, supreme person, best among men, equal to all, auspicious for the world, master of the universe, oh Rama, all obeisances unto you and Sri Krishna, bestower of liberation.
    te: ''
  - type: verse
    id: v35
    no: '35'
    title: AtmArpaNam
    hk: 'pAhimAm, pAhimAm, pApanAzaka pAhimAm, rakSamAm, rakSamAm, zrI rAdhAkRSNa rakSamAm . nAstitvam vinA mamagatiH varade. zaraNAgata vatsala dehime, abhayam aparAdhakSamam, ante viSNu sAyujyam, zAzvata zrI hari caraNasAnnidhyam.'
    en: Rescue me, destroyer of sins! Protect me, oh Radha Krishna! I have no other refuge than you, oh bestower! Oh merciful refuge, please assure me, forgive my offenses, bless me to obtain an eternal place at the lotus feet of Lord Sri Hari at the end of this mortal life.
    te: ''
  - type: section
    id: s02
    hk: zrI zivapaJcakam
    en: ''
  - type: verse
    id: v36
    no: '36'
    hk: zrI “zivapaJcakam” vizvamayam, vizvajanakam, vizvezam vizvanAtham - vizvezvaram, virUpAkSam . vizvazAnti karam . vizvarUpam zrI vizvambharam . vande, sadAzivam, sAmbam, zambhum, Izvaram, zaGkaram..
    en: Oh, all pervading father, oh controller, maintainer of the universe, protector, he with the third eye, peacekeeper of the Universe, Universal form, upholder of the universe, obeisances to you oh Sadasiva, Eeswara, Sankara.
    te: ''
  - type: verse
    id: v37
    no: '37'
    hk: himagirivAsinam, prathama gaNAdhipam . zAnta svarUpam, namo vedassarvAntargatam . viSNuvallabham pArvatI prANanAtham, mokSakaram. vande sadAzivam pArvatIprANanAtham, sAmbam, zambhum, Izvaram zaGkaram..
    en: A resident of the Himalayas, foremost among the Devatas, peaceful personality, he who is present in the essence of the Vedas, master of Lord Vishnu, husband of Sri Parvati, bestower of liberation, obeisances to you oh Sadasiva, Shambhu, master - oh Sankara!
    te: ''
  - type: verse
    id: v38
    no: '38'
    hk: 'zvetam himAlayaH zvetam, zirasthitazcandra nandiH zvetammAmAGkita vizvamAtaH divyam. zvetamanantam phAlAkSammama kaivalyadam. vande, sadAzivam, sAmbara, zambhum Izvaram, zaGkaram..'
    en: A resident of Kailasa, brilliant white-hued one, he who holds the moon on his hair bun, on whose side is the mother of the Universe, luminous with a bright universal glow, he with the third eye, bestower of liberation - oh Lord Siva! My obeisances to you.
    te: ''
  - type: verse
    id: v39
    no: '39'
    hk: yo(ve)gezvarapura chAyAso 'mezvaram govUru' (kOvvUru) umAcoDezvaram zrI rAmezvaram, muktezvaram, kAzIkSetrezvaram, zrIkALahastIzvaram zrI rAjarAjezvaram drAkSArAmezvaram ' pazupatezvaram zrI kALezvaram, kedArezvaram, zrI vaTTi nakSIrArAmezvaram, dvAdaza liGgezvaram, koTiliGgezvaram, kaliyuga kailAsa gokarNezvaram, vande sadAzivam, sAmbam, zambhum Izvaram, zaGkaram..
    en: Present in the temple of Vegeswarapuram (Yogeswarapuram) as Chaya Someswara, as Uma Chodeswara in Kovvuru, as Mukteswara in Rameswaram, master of Kasi Kshetram, Lord of Kalahasti, Raja Rajeswara, Draksha Rameswara, Pasupati, Sri Kaleswara, Kedareswara, Dwadasa Lingeswara, Koti Lingeswara - my obeisances to you, Sada Siva, Sambhu Eeswara, oh Sankara!
    te: ''
  - type: verse
    id: v40
    no: '40'
    hk: nIla grIvam, nIlalo hitam, naLinI vUjitam, pUjayAmi, tulasI, bilva gaGgAjala sahitam. nAgabhUSaNam naTarAjam, nAthamanAtham, zaGkhanA dapriyam. nAgezvaram gaurI mahezvaram kailAsezvarammamamo kSadam, hariharaika rUpazivAtmaliGgam, vande, sadAzivam, sAmbam, zambhum, Izvaram zaGkaram .. zivAyanamaH oM zivAyanamaH zivAyanamaH onnamazzivAyanamaH . harAya namaH oM harAya namaH harAya namaH oM namazzivAyanamaH ..
    en: Oh Lord with the deep blue neck, he who radiates a bluish effulgence, worshipped by Lakshmi Devi, I worship you with Tulasi, bael leaves, and Ganga water. Bedecked with snakes, oh Nataraja, my master, lover of the sound of a conch shell, lord of the Nagas, Gowri Maheswara, master of Kailasa, and he who takes form as a Siva Linga - I offer my obeisances to you.
    te: ''
  - type: verse
    id: v41
    no: '41'
    title: AtmArpaNam
    hk: "zrIkaram, zubhakaram, zreyadam, zivam, jagadIzvaram . tArakArAmamantrasRjita, tapasvinam, . trilocanam. trivikramam, tripurAntakam, namojaga nAthapUjitam. vande, sadAzivam sAmbam, zambhum, Izvaram, zaGkaram.. pAhimAm, paramezvara| rakSamAm bhaktavarada| sAmbasadAzivazambho zaGkara zaraNam me tava caraNa yugam. 'zambho, zaGkara sAmbasadAziva tavacaraNa -yugam mama zaraNam zivoham, zivoham, zivoham, zivoham. haroham, haroham, haroham, haroham... ahambrahma, ahaMviSNuH ahande vomahe zvaraH ahaGkAra rahita maham, pazyAmi sAkSAt parabrahmam, mamahRdayAntargata rAjitam. tvamevAham, tvamevAham, tvamevA hanna saMzayaH sarvajJo bhagavada nujJayA .."
    en: Bestower of wealth, the auspicious one, master of the universe, he who always recites the Taraka Rama namam, ever-meditating three-eyed one, one whose three strides covered the universe, he who destroyed the three cities of the Asuras with a single arrow, he who is worshipped by Jagannadha, respects to you - oh Sada Siva, Sambhu, Eeswara, and Sankara!
    te: ''
  - type: verse
    id: v42
    no: '42'
    title: maGgaLAzAsanam
    hk: 'zrI rAma devAya, zivazaGkarAya, bhakta varadA yamaGgaLam. zrI rukmiNI prANanAdhAya, zrI rAdhAkRSNa prabhave, maGgaLam jayamaGgaLam sarvamaGgaLam nitya zubhamaGgaLam ..'
    en: Lord Sri Rama, Lord Siva, bestower of boons to devotees, he who is the beloved of Sri Rukmini, Sri Radha Krishna, all auspiciousness unto you in all its several forms!
    te: ''
  - type: verse
    id: v43
    no: '43'
    hk: zrI sarasvatIstutiH zrI sarasvatI SoDazAkSara svarNamAlA oM vAgdevIm varadAyinIm vidyA pradAyinIm vidyAm vraNAmi vANIm vINApANIJcajJAna sarasvatIm. zAradAMvi zAradAm vandevarademokSArthInamme rakSa bhAratI . bAsara vAsinI . bhaktavatsalA;
    en: Sri Saraswati Devi, represented by sixteen syllables, goddess of learning, bestower, and personification of knowledge. She with a sweet voice, an expert in all fields, and she who takes up all of our burdens from her abode in Basara, who blesses all who pray to her - my obeisances!
    te: ''
  - type: verse
    id: v44
    no: '44'
    hk: zrI zAradA caturvigazcAkSara saroja hAram . vAgdevIm vara dAyinIm vidyA pradAyinIm vArA hIm vidyAm viriJci priyAm, vANIm vINApANim cavimalAm, sarvaloka pUjitAm zrI jJAnasarasvatIm. zAradAm vizAradAm vanuthAMvande, varade vidyAjJAnamokSArthinam me.. rakSa bhAratI. bAsaravAsinI. zrI pradA, zrI zivAnu DA.. AzritavatsalA..
    en: Sri Saraswati Devi, who is embodied in the 24-syllable mantra whose 4 lines are reminiscent of a lotus garland and whose several epithets are like a fresh scent in the wind, the goddess of all education, I humbly request you to bless me with the eight great fortunes, and salvation through learning. Oh, companion of Maha Siva! You never fail to provide refuge to your devotees.
    te: ''
  - type: verse
    id: v45
    no: '45'
    title: zrI gaurIstotram (sarvamaGgaLAzrayam)
    hk: 'oM vandeham vizvezvarIm praNA vAtmikAm, himabAlA annapUrNAJca zAmbhavIm. AdizaktIm jagajjananIm sumukhaSaNmukha. yormAtara mIzvarIm hrIm zrIm.. zrI gaurIm zauri nRhodarIm zarvANIm, zivAnIm mahAkALIm sarvamaGgaLAm . pAhimAm . varamezvarI. varedezubhapradA. vedamAtA. dehime viSNusAyujyam..'
    en: To she who blesses all the worlds with prosperity, who represents the primordial sound of Om, the daughter of Himavant, the giver of nourishment, the better half of Sambhu, the source of all energy in the Universe, the mother of all worlds, the matriarch of Subrahmanya and Ganesh, she who is represented in the sacred seed syllables, sister of Sri Maha Vishnu, she who has taken various avatars including Sri Maha Kali, whose mere name causes good fortune, who always saves her devotees from all the evil in the world, I humbly request your blessing which shall grant me salvation.
    te: ''
  - type: verse
    id: v46
    no: '46'
    title: zrI subrahmaNma zaraNyam
    hk: |-
      subrahmaNyam subrahmaNyam zivatejam subrahmaNyam, subrahmaNyam subrahmaNyam zrI vallIzam subrahmaNyam . subrahmaNyam subrahmaNyam zivazivAnI nutam subrahmaNyam . subrahmaNyam nubrahmaNyam SaNmukhasvAmika, subrahmaNyam . subrahmaNyam subrahmaNyam surasenAnam subrahmaNyam subrahmaNyam subrahmaNyam tArAkAsuravAram subrahmaNyam . subrahmaNyam subrahmaNyam devasenApatim subrahmaNyam subrahmaNyam subrahmaNyam zrI svAmi nAdham 'subrahmaNyam, subrahmaNyam subrahmaNyam zaravaNa zaravaNa subrahmaNyam . subrahmaNyam subrahmaNyam zaraNam manazaraNam subrahmaNyam, subrahmaNyam subrahmaNyam. bhavabhaya rogazokavaram subrahmaNyam . subrahmaNyam subrahmaNyam mama ArAdhya daivam subrahmaNyam . subrahmaNyam subrahmaNyam varadamme abhayadam..zrI subrahmaNma zaraNyam: subrahmaNyam subrahmaNyam zivatejam subrahmaNyam, subrahmaNyam subrahmaNyam zrI vallIzam subrahmaNyam . subrahmaNyam subrahmaNyam zivazivAnI nutam subrahmaNyam . subrahmaNyam nubrahmaNyam SaNmukhasvAmika, subrahmaNyam . subrahmaNyam subrahmaNyam surasenAnam subrahmaNyam subrahmaNyam subrahmaNyam tArAkAsuravAram subrahmaNyam . subrahmaNyam subrahmaNyam devasenApatim subrahmaNyam subrahmaNyam subrahmaNyam zrI svAmi nAdham 'subrahmaNyam, subrahmaNyam subrahmaNyam zaravaNa zaravaNa subrahmaNyam . subrahmaNyam subrahmaNyam zaraNam manazaraNam subrahmaNyam, subrahmaNyam subrahmaNyam. bhavabhaya rogazokavaram subrahmaNyam . subrahmaNyam subrahmaNyam mama ArAdhya daivam subrahmaNyam . subrahmaNyam subrahmaNyam varadamme abhayadam..
      subrahmaNyam subrahmaNyam subrahmaNyam zUlapANinim subrahmaNyam, subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam (sarvam zrI subrahmaNezvarArpaNamastu)..
    en: I seek refuge under Lord Subrahmanya; who is known by various names - with the effulgence of Lord Siva, six-headed one, leader of the Ganas, killer of Tarakasura, husband of Devasena, and destroyer of fear, disease, and distress - I bow down to you, trident holder.
    te: ''
  - type: verse
    id: v47
    no: '47'
    title: sarvam sarvezvaram
    hk: 'oM teja zrI zam zrIvArimprema svarUpam, karuNAmayaJca bhaktavatsalam. tejorAzinam mohanavaMzI gAna priyam, (golokavAsinam Izvaram). vande zrI rAdhAkRSNam mama mokSadam..'
    en: Oh effulgent Lord, master of fortune, embodiment of love, merciful Lord, affectionate to his devotees, full of luminescence, expert flutist, resident of Goloka, obeisances to you Sri Radha Krishna, deliverer of salvation!
    te: ''
  - type: verse
    id: v48
    no: '48'
    hk: vedam zrI kRSNam vedArtham zrIkRSNam vedAntam zrIkRSNam vedAntargata daivaJca zrIkRSNam . nAdam zrIkRSNam oGkAra nAdam zrI kRSNam veNunAdam zrI kRSNam pAJcajanya gItAnAdam zrI kRSNam. dhyAnam zrI kRSNam yAgam yogam zrI kRSNam vinodam zrIkRSNam bhavabhaya bheda chedanam zrI kRSNam. vandeham tam zrI kRSNam muktidam dhanyam zrI kRSNa dhyAnajIvanam prAptistathyam zrI kRSNaparamapadam..
    en: The essence of the Vedas, their meaning, their goal, and their embodiment are all Sri Krishna. He is represented in the sound of Om, the melody of his flute, and the rumble of the Panchajanya conch shell. Meditation, sacrifice, and penance all lead to Sri Krishna. I offer obeisances to you Sri Krishna, destroyer of fear and bestower of liberation. He who meditates upon Sri Krishna is sure to get eternal salvation.
    te: ''
  - type: verse
    id: v49
    no: '49'
    hk: 'pallavi : rAjazekhara rAjazekhara rAjazekhara pAhimAm rAjazekhara rAjazekhara rAjazekhara rakSamAm candrazekhara candrazekhara candrazekhara pAhimAm induzekhara indu zekhara induzekhara rakSamAm zazizekhara zazizekhara zazizekhara rakSamAm rAjazekhara rAjazekhara rAjazekhara pAhimAm rAjazekhara rAjazekhara rAjazekhara rakSamAm..'
    en: Oh, Eternal Emperor - protect me! Oh, Moon-holder, save me! Moonlike luminescent one, guide me!
    te: ''
  - type: verse
    id: v50
    no: '50'
    title: advaitAbhivAdamu
    hk: 'zaraNam zrI satyanArAyaNam kAruNyadhAmam ramAkAntantri guNAtItam. Arta trAyavarAyaNam annavaravAsinam sadAzivammama kaivalyadam..'
    en: I seek refuge under Sri Satyanarayana, the embodiment of mercy, husband of Ramadevi, he who is above the three gunas - sattva (goodness/calmness/harmoniousness), rajas (passion/activity/movement), and tamas (ignorance/inertia/laziness), he who gives refuge to the distressed, resident of Annavaram, and the auspicious bestower of liberation.
    te: ''
  - type: verse
    id: v51
    no: '51'
    hk: namosiMhAcalavAsinam, svayambhuvam varAhalakSmI nRhiMhasvAminam . zrI mahAviSNAtRtIyAvatAram zrIcandana lepita zivaliGgAkAram . ApadbAndhavam abhayadam ananta AdinArAyaNaJca karuNAsAndram. darzana mAtreNa anirvacanIyA nandapradam bhaktavazam memokSadam..
    en: Obeisances unto you, resident of Simhachalam, self-manifest, Varaha Laksmi Narasimha Swamy, the third incarnation of Maha Vishnu, covered with sandalwood paste as a Sivalingam. Refuge of the distressed, limitless, oh merciful one! One who gives immense happiness just by his darshanam, resident of his devotees’ hearts, bestower of the liberation of mine.
    te: ''
  - type: verse
    id: v52
    no: '52'
    title: vairAgyaphalam
    hk: 'bhAgyam bhogam bhAram mohaGkSetram grAsaMvAsaMsiMhAsanam. vilAsam bhAmAkalApam satIsantAna sukhalAlasam. dehAbhimAnam bandhuprItiH bAdhAkaram, kIrti kAGkSaH bahujanmakArakam. bhavabandham muktiprati bandhakaJca kSudram hRdaya daurbalyam etat sarvam vyarthavyAsaGgam . zrI kRSNadhyAnam taruNopAyam. kurubhaktijJAna yogAbhyAsam: tathyam zAzvata vaikuNThavAsam..'
    en: 'A reflection on the results of renunciation: Desire for wealth, luck, opulence, affection, a resting place, and even salvation is ultimately futile. Only remembering Sri Krishna is the ultimate escape from the 4 ashramas of one’s life. Engage in devotion and service to attain residence in Vaikuntha.'
    te: ''
  - type: verse
    id: v53
    no: '53'
    title: jaya maGgaLabharatavAkyam
    hk: '(anni zubhamulu kalagAlani civaragA yI krindi vidhaGgA prArthiddAm)'
    en: 'Victory and auspicious utterance of Bharat: Let us finally pray in this manner so that all auspiciousness may prevail.'
    te: ''
  - type: verse
    id: v54
    no: '54'
    hk: mAtR vakSojAMsukakarSaNodyatakaraH kRSNaHsapuSNAtunaH..
    en: May the tiny cute palm that pulled Mother Yashoda for food, give protection to the entire universe. Hare Krishna!
    te: ''
  - type: verse
    id: v55
    no: '55'
    hk: oM.. zrImaGgaLagirIzam, yAdagirinAthamantarvedyadhi nAtham, yoganRsiMham, sadAsarvarogamnam. vandeham, bhaktavaradam, zivam, mahAyogapradam, tam, nAra siMham advitIyadaivatam mokSadam ..
    en: Oh resident of Mangala Giri, Yadagiri, Lord of Antarvedi - Yoga Narasimha, destroyer of all malaises! Obeisances to him who is the bestower of devotees, all-auspicious giver of great fortune, he who has no equal, giver of liberation!
    te: ''
  - type: verse
    id: v56
    no: '56'
    hk: oM - vande viSNum sadAzivam, varadam, tatsarvezam, zrIrAmam zrI kRSNam, mokSadam.. (varAliccikaruNiJce zrI mahAviSNuvuku, samabhAvanto cUstU sarva zubhAlanu prasAdiJce sAmbana dAzivuniki, sarvezvaruDaina zrI rAmuniki, mokSapradAta zrI kRSNa vara brahmaku vandanamu. nanu brovagarAvA. karuNAmayazrIrAmA........ tElisItEliyaka ne cesina kAryamulu duSTamEnta yogAnirAmA.... bhavabandhamunaDuma kuDiEDamala iDumalinni yArAmA... karmaphalita manubhaviJcaka tIradEva rikainani pEdavi virutulindarilalo zrI rAmA.... nanuvyadhalanuJci vidhividhitamu nuJci tappimpagala vibhulEvvaru nIvugAka rAmA .... dehabAdha, jADyapubAdha, vyayame vyadhagA rAmA nI bhakti pEnnidhidariceraga nIyadu dayadalacumA rAmA.... kAruNyadhAmuDavu kalalo yIbAdhala kaDatercaga dayacUpavayAjayarAmA.... jaya jaya rAmA.... bhavAnIzaGkara priyuDavu bhakti bhAvana varamunu rayamuganIyavE rAmA.... rAmA... parandhAmA, puruSottama paramezvara zrI rAmA
    en: Obeisances to you Lord Vishnu, the Sadasiva, bestower, master of all. Obeisances to Him who is present in the incarnations of Sri Rama and Sri Krishna!
    te: ''
  - type: verse
    id: v57
    no: '57'
    hk: rAdhe govinda kRSNa| rAdhe gopAla kRSNa| nandamukunda kRSNa| navanItacora kRSNa| pAhi mukunda kRSNa| pAhi murAri kRSNa||
    en: Beloved of Radha, pilferer of butter, rescue us! What does scarcity mean to he who worships you? What is fear to your devotees? May my last days go smoothly without ailments, always engaged in your worship, and may I reach your lotus feet at the end. Please show me the divine path, oh Srimathi Radhe.
    te: ''
  - type: verse
    id: v58
    no: '58'
    title: vizvamohananamohakam
    hk: 'vizvam vizvezam vizvavyAptam vizvasRjitam zAntidam . vizvezvaram vizvanAtham vizvapatim vizvagurum . vizvarUpam virUpAkSam vizvambharam vizvavaradam. vande vizvamohanam vaMzI kRSNam viSNusAyujyadamme..'
    en: Oh master of the Universe, all-pervading Vishnu, bestower of peace, controller of the universe, teacher of the worlds, universal form, omnipresent one, bestower of devotees - my obeisances to you! Let everything be offered to Sri Radha Krishna.
    te: ''
  - type: verse
    id: v59
    no: '59'
    hk: oM. rAdhAgopAlaMrAgamohanaMrAsalIlArAji taMrAgamayam vairAgyapradam yogezvaram Izva rArcitam paramazivabhaktAgresaram zrIzam zaraNam mamavaradam zrI kRSNaMvande mokSadam..
    en: Oh, Radha Gopala, he who engages in the divine, ecstatic dance and play with the gopikas, he who gives his devotees the wisdom to renounce worldly desires, master of mystics, worshipped by Lord Shiva, my rescuer - oh Lord Krishna, my obeisances to you!
    te: ''
  - type: verse
    id: v60
    no: '60'
    hk: nirmala hRdayam sumanoharam sarojasadRza saugandhim pUjya gaGgA godAvarItoya tulyapavitram vaiSNavam zaGkara priyam zrIzrInivAsam. Anandamayam zrIkaram sadAzrI bhagavannAmagAnayAga puNyakArakam. taddhAraNa dhanyamanujam yoga vidyArdhinam zrI kRSNa bhaktam namAmyaham ..
    en: With a heart as clean as the sacred waters of the Ganga and the Godavari, oh Vaishnava, oh dear of Lord Shiva, always blissful, always chanting holy names, oh great devotee of Sri Krishna, obeisances to you.
    te: ''
  - type: verse
    id: v61
    no: '61'
    hk: vizAla vizvam viSNu mayam sadAzivam rAsalIlA lAsyarAganilayam . vizvezasRjitam virATsvarUpam maGgaLArAmam sarvam zrI kRSNahAsam..
    en: This entire universe is filled with Vishnu the all-auspicious, and is an arena for his sacred dance. His universal form is all-enveloping and all-pervading.
    te: ''
  - type: verse
    id: v62
    no: '62'
    hk: 'paGkham laGghanti vArI zaJca zambhuJjayanti naraikavijayaH daitya deha zalkam bhavati (viSNu) zaGkham pAJcajanyam citram zrI kRSNa cidvilAsam (sadA) dayAmayam..'
    en: A monkey leaped effortlessly into the boundless ocean. Only Arjuna, a human, conquered Mahadevuji. The conch named Panchajanya, fashioned out of a demon's body shines in Vishnu's hand. Ah! How extraordinary is Sri Krishna's playfulness? It is always filled with compassion.
    te: ''
  - type: verse
    id: v63
    no: '63'
    hk: uDupi nAtham upendrAnujam udyAnavihAriNam hiraNmayIzaMhira Nyagarbham bhaktavazyaMsadAzivam vAsudevaMvande zrI kRSNamme mokSadam..
    en: The Bala Gopala of Udupi Tirtha, brother of Indra, who roams in Brinda forests, husband of Sri Lakshmi Devi, the supreme god of gods, who can be controlled only through devotion, who protects everyone equally, son of Vasudeva, to Sri Krishna who grants me moksha, I always offer my salutations.
    te: ''
  - type: verse
    id: v64
    no: '64'
    hk: vande gaurI zaGkara kumAram tArakavAram devasenAniJca SaSThIzam. narvadaMzrI vallIzam (viSNuputrIzam) ripughnumme sarvarogaghnam zrI subrahmaNyasvAminam..
    en: Salutations to Sri Subramanya Swami, the son of Parvati and Parameshwara, who destroyed Tarakasura, the commander of the divine army, husband of Sri Valli (daughter of Sri Mahavishnu), who destroys my enemies and diseases.
    te: ''
  - type: verse
    id: v65
    no: '65'
    hk: dagdham tIti sarvaduggAni dahantItimugdha mohinI vyAmoha tRSNam. siddhyam tIti zAzvata zrI viSNu sAyujyam pathamekam zrI kRSNapada dhyAnam ..
    en: It burns away all sorrows, reveals an inappropriate behavior when beauty appears with extreme desire, hints at inner meaning, and bestows eternal Vishnu's union. The most effortless way to achieve all of these is through devotional meditation on Sri Krishna.
    te: ''
  - type: verse
    id: v66
    no: '66'
    hk: sarvadhAriyaina cakradhAriyaina velpANiyaina kodaNDapANi yainan . sarvamamarci mukti niccugA bhagavadbhaktuniki sadvartanukin ..
    en: A perfect, skillful, compassionate, and righteous path. By completely surrendering oneself, one can attain the supreme devotion to Bhagavan.
    te: ''
  - type: verse
    id: v67
    no: '67'
    title: gurvAzIrvAkyam
    hk: 'oM. gAyatrI mantratulyam caturviGg zcAkSara bhagavatprasAdita vAGmayam . tat vedavedAnta zAstrasaGgItAdi kaLAsAhitya narvannabhavati . bhagavannAmasaGkIrtanasamam, tasmAt sarvaprayatnena zrIzrI kRSNa . dhyAna yogAbhyAsI bhava, premamayIbhava, mokSagAmI bhava, siddhirbhava.. sarvam zrI rAdhAkRSNArpaNamastu..'
    en: The one that resonates with the Gayatri Mantra of twenty letters, divine hymns bestowed by God, and other literature. Whoever intends to write - whether it be any Veda, Purana, historical text, or hymn - are merely "scribes" who are not original authors, but those who write what God has graciously inspired and entered into their minds. Whether one studies Veda, Vedanta, scriptures, music, arts, or literature, there is nothing more valuable than singing the various names of God. In other words, reciting God's Ashtottara and Sahasranama stotras is the most supreme practice. In this modern age, there are no restrictions. Therefore, let us strive in all ways, meditate on Sri Krishna, and be filled with devotion! May we journey on the path of liberation - may liberation be attained!
    te: ''
  - type: verse
    id: v68
    no: '68'
    title: zrI rAdhAkRSNa pAdAkrAntam
    hk: 'oM.. uDupInAtham upendrAnujam, udyAna vihAriNam, hiraNma yIzam. hiraNyagarbham,bhakta vazyam, sadAzivam, vAsudevam, vande, zrI kRSNamme, mokSadam..'
    en: Oh, how wonderful! It feels like the heart is floating in the air, and the mind trembles with emotion. With the six primary enemies - kama (desire), krodha (anger), lobha (greed), moha (delusion), mada (pride), and matsarya (jealousy) - one destroys all remaining obstacles. It eliminates the darkness of ignorance, creates vibrations, and brings peace through devotion and knowledge. It ignites and removes delusion about worldly matters, inspiring one to remain neutral. By meditating with closed eyes and maintaining three-fold purity, focusing on the divine feet, one can easily perceive Sri Krishna's radiant, smiling face with the eyes of spiritual wisdom.
    te: ''
  - type: verse
    id: v69
    no: '69'
    hk: ramyamainadi, rAmanAmamu, hRdyamamainadi, rAmacaritamu, bhakti, zaktikArakam, muktipradamodakam..ramya .. dhyAname gamya vathamai, parandhAmuvaDanu, anu gadyamai ..ramya.. sAdhyamainadi rAmasmaraNamu, mokSaH gamyamainadi rAma zaraNyamu.. rAmanAmamu ramyamainadi, ramyamainadi rAma nAmamu, dhanyamainadi nADu jIvanamu, labhyamai tArakarAmamu . abhayamai, mukti pradamai, zrI rAdhAkRSNa caraNa zaraNyamai ..
    en: How pleasant is the name of Lord Rama, how blissful it is to hear his tales, source of Bhakti & Sakthi, bestower of liberation, the ultimate goal - surrender to Lord Rama. Lord Rama’s pleasant name has brought me success in this worldly life, and it shall grant me salvation as well. May it make me fearless, as I surrender in front of Sri Radha Krishna’s lotus feet.
    te: ''
  - type: verse
    id: v70
    no: '70'
    hk: kAmezvaram, kamalAkSam, kAntipuJjam, karuNAmayaJca kaLyANa sarvadam . zrIlakSmIzam, jagadrakSakam, vande harSizam, zrIrAdhAkRSNam, me, kaivalyadam
    en: Salutations to Sri Radha Krishna, the Lord who is the embodiment of all desires, with lotus-like eyes, radiant and luminous, Compassionate, Bestower of all auspiciousness, Lord of Sri Lakshmi, and the Protector of the Universe. Day and night, at all times, I offer my prostrations to this divine couple who grant liberation.
    te: ''
  - type: verse
    id: v71
    no: '71'
    hk: vaikuNThavAsinam, vaijayantI virAjitam, virATpuruSam, zrImahAviSNum, vandeham, vaidehI vibhum vedavedAnta vedyam, zrIrAdhAkRSNam, me, mokSadam..
    en: Salutations to Radha Krishna Bhagavan, who Resides in Vaikuntha, Shines with the Vaijayanti garland, Is the Vishvarupa (cosmic form), Is the husband of Lakshmi Devi, Is the Supreme Lord of Sri Mahavishnu, Is worshipped through all Vedas, Vedantic texts, and hymns, Is the Lord of all worlds and Grants me liberation.
    te: ''
  - type: verse
    id: v72
    no: '72'
    hk: nityAnandamayam devam, viSNum, vibhUti prabhum, sarojA saugandha rAjanam. nIrajAkSam, nikhilalokezam, zrIrAdhAkRSNam, me, muktidam ..
    en: Salutations to Sri Krishna, who is Always filled with boundless joy, A magnificent manifestation of Lord Vishnu, Radiant like a poet with the fragrance of lotus flowers, Adorned with lotus-like eyes, and The supreme lord of all worlds. I offer my reverence to this divine being who grants liberation through speech.
    te: ''
  - type: verse
    id: v73
    no: '73'
    hk: oM.. vande, vizvavibhum vizvam bharam, vizva mohanam, jaganmohinI rUpa dharam . viSNum, zambhu bhrAntikArakam, lIlAvinodinam, zrI bRndAkRSNam me. mokSadam..
    en: Salutations to Sri Krishna, the Lord of the Universe, who is the Ruler of the cosmos, Sustainer of all existence, Creator of divine illusion, Embodying Jagannmohini (world-enchanting) form, Directly manifesting as Saamba Nadasiva, Playfully bewildering and entertaining in Brindavan. I surrender to Mukunda, the bestower of liberation, who grants spiritual freedom.
    te: ''
  - type: verse
    id: v74
    no: '74'
    hk: 'alaGkAra stotrapriyo viSNuH, abhiSekArcana priyazzivaH .. kuGkamapUjAmicchatideviH akSatapatrANizcagaNezaH..'
    en: Lord Vishnu enjoys decorations and hymns, while Lord Shiva prefers abhishekam (ritual bathing) and worship. For Goddess Mahalakshmi, worship is offered with kumkuma (saffron), and Lord Ganesha (Vighneswara) is pleased with akshatas (sacred rice) and leaves.
    te: ''
  - type: verse
    id: v75
    no: '75'
    hk: oM namazzivAyeti paJcAkSarIca, oM namo nArAyaNASTAkSarI mantra sarvasvam. tArakarAmam. zrI rAdhAkRSNam, dhyAnayoga mArga darzinam . oM, namo bhagavate vAsudevA yetidvA dazAkSaryupAsaka, bhaktyAya skAntAkarSitam, karuNAsAndram, vande zrI bRndAkRSNam. me, mokSadam
    en: 'Salutations to Sri Krishna Bhagavan, the divine guide who reveals sacred mantras of liberation: "Om Namassivaya" - 5 letters, "Om Namo Narayanaya" - 8 letters, "Sri Rama" - Taraka mantra. He transforms devotees through various mantras, specifically "Om Namo Bhagavate Vasudevaya" - a 12-letter mantra that attracts devotees like a magnet, Embodies compassion, and grants liberation. These mantras purify the mind, connect the devotee with divine consciousness, provide spiritual guidance, and facilitate inner transformation. By meditating on these sacred sounds, one can transcend worldly limitations and achieve spiritual liberation through the grace of Sri Krishna.'
    te: ''
  - type: verse
    id: v76
    no: '76'
    hk: zrI kRSNarUpam, mugdhamanoharam, vizvamohana maGgaLAnandakaram, vi. zva vyAptam, zrI kRSNanAdam, muraLIravam, oGkAra madhuram, gItAvAkyam ve . dansarvAdhikam, zrI kRSNa bhASyam, nirApekSavidhitakarmAcaraNaJca, yo . gAbhyAsam, bhaktim mukti pradam, zrI kRSNakRtyam duSTa zikSaNam, ziSTarakSaNam .. zrI kRSNatatvam satyam, bhaktavazyam . saccidAnandam, vinodam, vizvapremaH ..
    en: Lord Sri Krishna's form is adorably charming and captivates the mind. It enchants all the worlds, bringing happiness. He fills the entire universe. Sri Krishna's flute music has the sweetness of Omkara, and the words in his songs are more glorious than all the Vedas. The meaning of Sri Krishna's words is that a person should perform their assigned duties without thinking of personal benefit. Devotion is the path to liberation. Sri Krishna's divine actions and hands - destroying the wicked and protecting the righteous. Sri Krishna's nature and method - surrendering to devotees without deceit, embodying Sat-Chit-Ananda (joy filled with true knowledge attained through spiritual inquiry). Delighting through playful actions, overwhelming all worlds with love.
    te: ''
  - type: verse
    id: v77
    no: '77'
    hk: zrI kRSNAvatAram, lIlAmAnuSam, naTahAsalAsya, navarasabharitam, bAlya krIDArambhAta zrI yAjJAna prakAzakam, namAmi, nityam, tatsarvezam mamArA dhyadaivam, zrI rAdhAkRSNam, me, mokSadam ..
    en: Sri Krishna's Avatar - a human form that plays divine lila, overflowing with play, song, dance, and laughter as a little child. From the very beginning, bringing goodness and knowledge to everyone, such a God of Gods, Sri Krishna, is my beloved deity. Eternal salutations to Sri Radha Krishna, who bestow ultimate liberation.
    te: ''
  - type: verse
    id: v78
    no: '78'
    hk: vande vighnezvaram, sarvadam zivatejaJca, zrI zAradAm. zailajAm, zyAmalAm . brahma, viSNuzzivaika sarvezam, saccidAnandam, zrI rAdhAkRSNam, me, mokSadam ..
    en: Salutations to Sri Krishna, the eternal abode of bliss, who exists within the cosmic form of all deities - Vighneswara who accomplishes tasks without obstacles, Kumara, the knowledge-bestowing Saraswati, the auspicious Parvati, wealth-granting Lakshmi, and the cosmic creators and sustainers Brahma, Vishnu, and Maheshwara, who are all integral parts of his universal form.
    te: ''
  - type: verse
    id: v79
    no: '79'
    hk: 'he zrI kRSNa bhagavAn .. deham rogamayam, jarAbhArama tibAdhA karam, nityAnubhavam bAndhava . nirasanam, saMsAram bhayaGkaram sadA . vyarthamadya prabhutyAyuH zUnyamme . bhaviSya jIvitecchaH dehime, - takSaNa asmajjanmAntaJca etat kSaNa . tavazrIpadazAzvata sAnnidhyam, zrIzrIkRSNAnandamaya vaikuNTha vAsam .'
    en: O Sri Krishna Bhagavan! My body is filled with diseases. Old age is extremely difficult. People are dying every day! Family life is disturbed with fear and suffering. Living beyond this point is futile. I have no desire to live anymore. Immediately end this life. In that very moment, eternally place me near Your holy feet and bless me to reside in the most supreme, joyful Vaikuntham, Sri Krishna Prabhu! O Lord of Yoga, accompanied by Radha, God of all gods, firmly established in my heart, with lotus-like eyes, who performed divine play with thousands in Rasa Leela, my eternal celibate, father of all worlds - salutations to Sri Krishna who grants me liberation.
    te: ''
  - type: verse
    id: v80
    no: '80'
    hk: yegezvaram, rAdhA sahaika deha, devezvaram, mamahRdaya sthitam, vande . rAjIvAkSam, rAsalIlA brahmacAriNam, vizvajanakam, zrI kRSNam muktidam ..
    en: The SPGH, the master of mystics, along with Radha as your consort, who resides firmly in my heart, O lotus-eyed, engaging in rasa Leela with millions of gopikas, eternal Brahmachari, progenitor of the universe, my bestower of liberation, I offer my obeisances to you.
    te: ''
  - type: verse
    id: v81
    no: '81'
    hk: maGgaLam zrIrAmacandrAya sarvalo kamaGgaLAyaca. devAya, parabrahmAya, zrIzrI rAdhAkRSNAya maGgaLam..
    en: Victory to Sri Ramachandra, who brings auspiciousness to all worlds! May the Divine Lord, Sri Radha Krishna be blessed! May there be eternal prosperity for all beings and all worlds!
    te: ''
  - type: verse
    id: v82
    no: '82'
    hk: 'oM zrIrAma oM hare kRSNa oM.. vighnezvarAya vidmahe, vighnaharAya dhImahi tanno sarvasiddhiprada gaNeza devatAH pracodayAt II vighnezvara namastubhyam, bhavAnI zaGkara sutaH zivatejAgraja. zrIrAdhAkRSNadhyAnArambham kaivalya prAptyardham kariSyAmi, siddhirbhavatu mesadA..'
    en: I bow down to Lord Ganesha as the divine being who removes obstacles and ensures the success of all endeavors (beginning with my guru and through the grace of Sri Krishna Vibhu, who is the primordial guru of the entire universe). Salutations to you, O Vighnaraja! Son of Parvati and Parameshwara, elder brother of Kumara Swami! I am beginning the meditation of Sri Radha Krishna, the Lord of Lords, to achieve ultimate liberation. Bless me so that my efforts may be successful.
    te: ''
  - type: verse
    id: v83
    no: '83'
    hk: oM.. bhajeham, bhujaGga bhUSaNam, bhavAnIzam, bhavabhayaharam, bhaktavaradam, zrIkRSNavandyam. sadAzivam, namukhaSaNmukhanandi bhRGgyAdi, prathamagaNa, pariveSTitenduzekharam. gaGgAdharam, devAdi devam, vizva sundaram) zrIrAdhAkRSNa satatArAdhanA nandamayam. bhiSakrathamam, sarvarogaghnam, memokSadam..
    en: Nagabhushana (one who wears serpents as ornaments), the husband of Gauri Devi, who destroys fear in samsara, bestows boons to devotees, is worshipped by Sri Krishna, and always views everyone equally. He stands with the primary gana including Ganesha, Kartikeya, and Nandi-Bhringi, wearing the Ganges on his head. He is the lord of all directions, the most beautiful in the universe (Jagannmohan Sadashiva who encompasses all universes within himself, undoubtedly supremely beautiful), who always worships Sri Radha Krishna. A mendicant who destroys all diseases (as per the Rudra mantra, he is the first divine physician), I am singing the devotional praise of the Mahadeva who grants liberation.
    te: ''
  - type: verse
    id: v84
    no: '84'
    hk: zrI dhanvantaram, zrImahA viSNu svarUpam, kSIrasAgara sambhavam, surabhiSagvaram, sarvadam, mama sarvarogaghnaJca, vande, zrIrAdhAkRSNam mokSadam..
    en: Salutations to Sri Dhanvantari, who manifests in the form of Mahavishnu, born when the milk ocean was churned during the divine amrita (nectar) extraction. He is the physician of the gods, who gathers all remedies and, by the grace of Sri Krishna, eliminates all diseases in my body, granting me liberation through Sri Radha Krishna.
    te: ''
  - type: verse
    id: v85
    no: '85'
    hk: junnutinanivADu, kannEnaunananivADu. kannayya mannanalenivADu, dunna potukanna kanikiSTuNDilan..
    en: He who does not appreciate the delicate flavors of colostrum cheese, is effectively blind. He who does not seek the refuge of Krishna has a fate worse than a donkey.
    te: ''
  - type: verse
    id: v86
    no: '86'
    hk: zrI harinAma saGkIrtana manudhyAna pakvamaujunnuvaladannavADu. zrIharihara bhakti kanna minna ledanEruganivADu. zrIharihara ajasatulakaTAkSarahituDai, zrIhari harA. naruDudhariNin dunnakanna hInacarituNDagun..
    en: One who does not desire the spiritual ripening of Sri Hari Nama Sankeertanam is like a buffalo. He who does not know that there is nothing greater than devotion to Sri Hari and Hara, and who is devoid of the graceful glance of Sri Hari and Hara, will become a person of lowly character, worse than anyone else who walks the earth.
    te: ''
  - type: verse
    id: v87
    no: '87'
    hk: calanamandugAni, caJcalanamandu gAni, caJcalAkSa bhogulandugAni caJcalamanaskulandugAni, cakradhAri cariJcaDEnnaDu sarvopagatuNDayyun . nizcala bhaktacittamandu nizcayambuganuNDEllEDalan..
    en: Neither in movement, nor in restlessness, Neither in passionate beings nor in those with fickle minds, Has the Discus-Bearer (Lord) ever wandered. He is omnipresent. In the unwavering devotional heart, He steadily resides everywhere.
    te: ''
  - type: verse
    id: v89
    no: '89'
    hk: surAdhyakSam zivam sadAzivapriyam zivAnanda laharI lAsya ravaLIravam. sadA bhaktavaradam cakradharam zatA nandaJca sahasrAkSam. susmitavadanAravindam sammohanAvatAram zrImannArAyaNam sakalalokezam sarvArdhapradam suzlokezam. sarvaklezaharam zubhAGgam zrIvatsAkam zAzvatam vande zrIkRSNam mamamokSadam..
    en: Salutations to Lakshminarayana, lord of all divine beings, who views everyone equally, beloved of Shiva, delighting in the Omkara sound stream of Shiva's blissful flow. With an unbroken lotus-like face radiating splendor, captivating the entire universe, he is the master of all worlds, bestowing meaningful abundance. With resplendent limbs, the eternal Lakshminarayana, through Sri Krishna Prabhu, grants me liberation.
    te: ''
  - type: verse
    id: v90
    no: '90'
    hk: satataMsmarAmi sakalalokezam rAsalIlAzrI vinodinam zrI kRSNam. nityannamAmi vijayasArathim zikhipiJchamauLim zazibindum zrI kRSNam. sadAvande, go, gopikA, gopa, bAlAnandaGgovardhanoddhArakam zrI kRSNam. bhajAmyaharnizam mahAtejam pApaharam paramAtmAnam memokSadam zrI kRSNam..
    en: Lord of all worlds, one who delights in divine play, Arjuna's charioteer, wearing a peacock feather as an ornament on his head (the union of peacock couples occurring through their eyes - a symbol of brahmacharya. This nuanced ornament is embedded in the divine form of Sri Krishna, the celibate Ghotakata), protecting cows, cowherds, Gopis, and children lifting the Govardhan hill like an umbrella and protecting the Gokulites from Indra's rain, supremely radiant, destroyer of all sins - I continuously meditate upon and bow to Sri Krishna, the divine being who grants me liberation.
    te: ''
  - type: verse
    id: v91
    no: '91'
    hk: oM namo nArAyaNAya oM namazzivAya ceti mahA mantra dvayAntargata “rA” yeti “ma” iti mUlAkSarasam yuktam zrI sadAziva sRjita “rAma”, nAmna virAjita zrI rAmacandram dazaradhAtmajam raghuvIram sarvadam. zirasAnamAmi sadA saccidAnanda brahmaGkaikeyIsutam kausalyAputram.. zrI hanumatsItA lakSmaNa bharata zatRghna sahita bhadrAdrirAmam. manasAsmarAmi smaraNeka mAtreNa zAzvata abhayadam memokSadam||
    en: I constantly remember the Lord of all worlds, Sri Krishna, the delightful one in the Rasa dance I eternally bow to the victorious charioteer, Sri Krishna, with a peacock feather crown and moon-like radiance I always worship Sri Krishna, Who brings joy to cows, cowherds, and children, The lifter of Govardhana mountain Day and night, I worship the great-souled Sri Krishna, Who removes sins, is the Supreme Self, And bestows liberation.
    te: ''
  - type: verse
    id: v92
    no: '92'
    hk: anarthakam kAlayApanam cakSINamAyuHkSaNekSaNe. zarIrazidhilam sahajamantam, kuruzrI kRSNadhyAnam muktipradam ..
    en: Time is fleeting, and it is harmful because, with each passing moment, life's duration diminishes. Our body gradually weakens, and dying over time is an inevitable reality. Therefore, one should always meditate on Sri Krishna. Only then will liberation be attained.
    te: ''
  - type: verse
    id: v93
    no: '93'
    hk: satatamusaccidAnanda svarUpuDaina sAkSAt zrI kRSNa paramAtmaye nannu nirantaramu zrI kRSNapada dhyAna nimagnunigA karuNimpan, sarvaloka prasiddha aSTazvarya pUrvaka divyasaukhyambulelanAku? cAlu nAku I akhaNDaizvarya varaprasAdamu ika e kalakalamunainan kalavaraparacanazakturAlai kalalo kaDali alala valE kUlipovu takSaNa mutana Avegamuto, tejomaya zrIkRSNa bhagavAnAjJAnu sAramu nizcayambugan tAmEntavArainan, paDatIpAdAkrAntulaurA. mArgadarzakapuruSottama zrIkRSNA..
    en: In this fleeting, meaningless time when life diminishes moment by moment, When the body weakens and approaches its natural end, Meditate on Sri Krishna, who bestows liberation.
    te: ''
  - type: verse
    id: v94
    no: '94'
    hk: 'preraNam zrI yogezvara rAmezvara daivataizca, likhitam zrIpadadhyAna gItAvaLi: zreyantasyagAnam zrI rAdhAkRSNa kRpAyogyatArtham. ihajanmam dhanyam kaivalya padasAdhanArthamityucyate..'
    en: Bringing joy to everyone, these divine prayers are written with inspiration from Lord Sri Krishna, the Master of Yoga. Singing these prayers is highly meritorious and earns divine grace. The purpose of human birth is indeed to achieve liberation, preventing humans from endlessly rotating in the cycle of birth and death!
    te: ''
  - type: verse
    id: v95
    no: '95'
    hk: oM.. bhagavadgItAcAryam, bhava bhaya rogazokaharam, bhaktirajjubandhitam. varadam sarvasiddhidam zrInAdham vande zrIkRSNammama mokSadam.. oM zrIrAma oM hare zrI kRSNa parabrahmaNenamaH
    en: Salutations to Sri Krishna, the Guru who bestowed the Bhagavad Gita, who removes the fear of worldly existence, destroys all diseases and sorrows, who is bound by the thread of devotion, fulfills all desires, ensures victory in all endeavors, the Lord of Lakshmi, and grants me liberation.
    te: ''
  - type: verse
    id: v96
    no: '96'
    hk: oM zrI subrahmaNyam narvamaGgaLAnutam surasenAninam ziva tejam, zrI vallIzam . viSNu saGkalpodbhavam, velpANinam bAlam, tArakaharam, SaNmukham. zrI kRSNahAna prakAzapraNavArdha pravINa ziva gurum, rakSakam, vande. kArtikeyam, sarvadam, zaravaNam, sarvarogannam, ripughnaJca memokSadam.
    en: Salutations to Lord Subramanya (Kartikeya), the bestower of all boons, commander of the divine armies, glorified by the radiance of Samba Shiva himself. He is the son-in-law of Vishnu's daughter, born by the divine resolve of Lord Vishnu, wielder of the Vel (spear) weapon, eternally youthful, slayer of Tarakasura, husband of Shasti Devi, bearer of Krishna's divine smile, the first among those who comprehend the meaning of Omkara, established as the guru of Shiva, protector of the worthy, nurtured by the Krittika birds, giver of all things, known as Sharavana, my auspicious lord who destroys all diseases, enemies, and is the cause of liberation - salutations to this supreme divine being.
    te: ''
  - type: verse
    id: v97
    no: '97'
    hk: 'oM. sarvezazrI kRSNam, manoharam, mamArAdhyadevaram, zrIkaram, sadAzirasAnamAmi, manasAsmarAmi sadAhasitavadanam Azritavatsalam vAsudeva zrIkRSNam. (mugdha) muddu kRSNam madana gopAlam rAdhA kRSNam vande karuNA sindhum zrIkRSNam. bAlaGgopAlam yazodAnandanandanam, navanItacoram, lIlAmAnuSam naTvaram - satyasvarUpam sAndIpanI antevAsinam bhaktavaradam, dauSTyAntakam. praNAmyaharnizam paraJjyotiH varandhAma parameza zrIkRSNam, mamakaivalyadam..'
    en: Salutations to Sri Krishna, the supreme lord of all, who captivates the mind, the divine flute player, bestower of prosperity. I continuously bow down and meditate upon him - the ever-smiling, compassionate protector who supports those who seek refuge. He is the son of Vasudeva, the beloved Krishna, the joyful cowherd of Vraja, an ocean of mercy. Born as a small child Gopala in Gokula, he is Yashoda and Nanda's son, the butter thief, who took human birth and displayed countless divine plays. A great performer, embodying truth, a disciple of Sandipani Maharshi, fulfiller of devotees' desires, a pure luminous form, the supreme divine resident of Goloka, the supreme lord who grants me liberation. I salute him day and night, without hesitation, continuously meditating on his divine presence.
    te: ''
  - type: verse
    id: v98
    no: '98'
    title: DolAlAsyam
    hk: |-
      tanmayilAlI, tanmayinAdha devezAlAlI. tejomayilAlI, tejomayahRdayAlAlI. tejasvinIlAlI, tejazrI zazaurI lAlI.. tejorUpiNi lAlI, tejorUpAdhipA lAlI.
      pallavi.. tatsatsItArAmAlAli, ramAramaNAlAlI. tApassarvahara, zrIrAdhAkRSNA lAlI.. sirisirirazmIlAlI, musimusihAsarAzIlAlI. nusmitavadanAlAlI, AzritavatsalalAlI . tapasvinI lAlI, tapasvarUpAlAlI. tatvabodhini lAlI, tatvavedAnta vedyAlAlI.
      vizva mAtA lAlI. vizvanAdh lAlI, sarvamaGgaLa lAlI, piGgaLa sundara lAlI. zubha kAriNI lAlI. zubhazrIkAntA lAlI. kSIrodayA lAlI. kSIra sandra zayanAlAlI. hanumatsevita pUrNAvatAra zrIrAmA lAlI. balarAmAnuja sampUrNAvatAra zrI rAdhA kRSNA lAlI. pUrNacandrikA lAlI. hiraNya garbhA lAlI pallavi . tatsat maithilI manohara lAlI. rAga hRdaya zrI rAdhAkRSNA lAlI. bhava bhaya roga zoka harame, vaziSTha gaNa viziSTA lAlI.......tanmayi lAlI..\
    en: Glory to Goddess Lakshmi! Glory to the Lord of Lakshmi, supreme among all gods! Glory to Sri Krishna, radiant with divine light, filling the entire mind with celestial brilliance! Glory to the luminous Lakshmi! Glory to Sri Vishnu, her consort! Glory to the embodiment of divine radiance! Glory to the Lord of Sri Devi! Glory to Sita and Rama, the essence of truth! Glory to Rama Devi! Glory to the one who brings joy, and destroys all afflictions, Sri Krishna! Glory to the manifestation of prosperity! Glory to the lotus blossoming with a beautiful smile! Glory to the divine who lovingly watches over those who seek refuge! Glory to the essence of penance! Glory to the teacher of ultimate truth! Glory to the lord worshipped in Vedas and Vedanta! Glory to the father of all worlds! Glory to the bestower of all auspiciousness! Glory to Aruna's son! Glory to the cause of all goodness! Glory to the lord of the Mother! Glory to the one who emerged from the milk seal! Glory to the one who flourishes on the milk seal! Glory to the avatar worshipped by Hanuman! Glory to Rama, best of men! Glory to Krishna, the divine among divine beings! Glory to the radiant one, shining like the full moon! Glory to Sri Krishna, god of all universes! Glory to Sita, daughter of Mithila's lord! Glory to Radha and Krishna, filled with love! Glory to Rama, who destroys family fears, diseases, and sorrows, supreme among sages!
    te: ''
  - type: verse
    id: v99
    no: '99'
    title: dhyAna mahatyam - vizvaguru zrI kRSNasUktiH
    hk: |-
      oM.. jihvAgrevanati zrI kRSNanAma saGkIrtanam ca saMsAramaihikam hRdayassarvam zrI kRSNAnandamayam karoti .
      dhyAnam zrI kRSNasAyujyadam tasmAtsarva yatnena zrI kRSNadhyAnayogI bhava sAyujya sAdhana mastu||
    en: One shall have the ability to compose a hymn with Sri Krishna's many divine names. In this world, bound by the cycle of worldly existence, dwelling within the home, Sri Krishna's meditation brings divine bliss. It fills one with supreme joy and ultimately leads to liberation. Therefore, make all efforts to practice Sri Krishna's Dhyana Yoga, and may liberation be attained!
    te: ''
  - type: verse
    id: v100
    no: '100'
    hk: |-
      nitya vandanam tejaH puJjam harim daityaharam mamArAdhya daivam tANDava zrI kRSNam madhurassarvam madhurAdhipam mAdhavam bRndAlIlA zrI kRSNam vizvarUpam. jagatsarvadaJjaganmohanam jagadAnanda kArakam rAdhezam zrI kRSNam. bAla kRSNam me sarvasvam zrInRsiMham gItAkRSNam dhyAnakRSNam sAyujyadam..
      zvAsAntAzvAnam (antya vinnapam) dIna dayALA. zrI kRSNa devA.. dehi me, takSaNam tedivya pada sAyujyam zAzvatam..
      “bhagavadprasAdam” - sarvam zrI rAdhAkRSNArpaNamastu
    en: Salutations to Sri Krishna, the embodiment of radiance, Vishnu, destroyer of demons, my worshippable deity, the master of divine dance. His stories and divine plays are supremely delightful, the protector of Mathura, husband of Lakshmi Devi, who performed Rasa Leela in Vrindavana. He is the cosmic form, the father of the universe, who enchants all worlds, the cause of supreme bliss, Radha's lord. He is like a lion among humans, who taught the Bhagavad Gita, the bestower of liberation to me. O primordial Narayana, protector of the helpless! Sri Krishna Deva! Immediately embrace me in your pure, nectar-filled, blissful feet! Protect me!
    te: ''
  - type: verse
    id: v101
    no: '101'
    title: zrI rAdhAkRSNamuktAvaliH
    hk: |-
      oM namonArAyaNAya, oM namo bhagavate vAsudevAya harekRSNa rAmeti,sadAdhyAyAmi, vizvarUpa zrIkRSNam bhaktajanapAlakam, rakSakam, zrIrAdhAkRSNam, zAzvata zrIkRSNasAyujyadam ..
    en: With the eight-lettered mantra "Om Namo Narayanaya", and the twelve-lettered mantra "Om Namo Bhagavate Vasudevaya", calling out "Hare Krishna, Dama", I meditate upon Sri Radha-Krishna, the cosmic-formed divine beings who protect and nurture devotees, seeking eternal refuge at Sri Krishna's divine lotus feet.
    te: ''
  - type: verse
    id: v102
    no: '102'
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam . skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam . mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi . zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam. (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: 'I bow down and meditate upon the Supreme Lord, Sri Venkateswara Swami, the manifest deity of Kali Yuga, who is Sri Mahavishnu, the giver of all boons. I contemplate in my mind: Kumara Swami, Vighneswara (his elder brother), Narasimha Swami, Shiva, Vishnu, lord of Rama, Hanuman, Sri Rama, cause of all auspiciousness. I prostrate before the divine Sri Radha Krishna, the all-pervading lords of the universe who bestow liberation, the true masters of the Kali Yuga.'
    te: ''
  - type: verse
    id: v103
    no: '103'
    title: zrIkRSNa rakSA kavacam
    hk: |-
      oM taddevakInandanam, kArAgAra janitam, jagannATaka sUtradhAriNam . vAsudevam, bhakta sarvadam vizvarUpa pradarzinam muktidam nizIdhe yamunAmArge, nandagRha pravezikam, vande yazodAnanda gopAlam vizvazAntikaram . kSIrArtham, zizuhelayA, mAtRvakSojAMzuka, karSaNodyutakaraH zrI karaH kRSNassapuSNAtunaH .. (108 akSaramula kUrpu)
    en: O divine child, born in a prison cell, who enchants all worlds with his Vishnu/Yogamaya, who dramatically guides lives according to their karmic results, son of Vasudeva, bestower of all blessings to devotees, who also displayed the cosmic form, the liberation-giver. He is the son of Yashoda, who entered Nanda's home on the Yamuna river path in the night, the cowherd protector, and peace-giver to the entire universe. With childlike innocence, he playfully lifted his tiny hand to pull his mother's pallu (edge of her sari), that hand which bestows all auspiciousness - may it always protect me!
    te: ''
  - type: verse
    id: v104
    no: '104'
    title: zrIkRSNadhyAna sarvasvam
    hk: |-
      oM . vedam zrIkRSNam, vedArtham zrIkRSNam, , vedAntam zrIkRSNam, vedavedAntargata daivam zrIkRSNam, nAdam zrIkRSNam, oM kAra nAdam zrIkRSNam, veNunAdam zrIkRSNam, pAJcajanya gItAnAdam zrIkRSNam dhyAnam zrIkRSNam yAgam yogam zrIkRSNam, vinodam zrIkRSNam, bhavabhayakhedachedanam zrIkRSNam . rAgam zrIkRSNam . anurAgam zrIkRSNam gAnam zrIkRSNam sAmagAnam zrIkRSNam hAsam zrIkRSNam rasalAsyam zrIkRSNam rAdhezam zrIkRSNam, jagadIzam zrIkRSNam . nATyam zrIkRSNam. jagannaTvaram zrIkRSNam mAyAjaganmohinam zrIkRSNam, naTarAjanRtyam zrIkRSNam . vANI vINA nAdAmRtam zrIkRSNam vamde, tam zrIkRSNam mamabhukti rakti zakti bhakti muktidam mumukSam zrIkRSNam dhanyam zrIkRSNa dhyAna jIvanam tathyam zrIkRSNa divyapAda zAzvata sAnnidhyam sAyujyam .. (daza gAyatri samAkSarI)
    en: The essence of all Vedas, the Vedantic literature teaching detachment, the concentrated divine essence within Vedas and Vedanta is Sri Krishna himself! He is the embodiment of sound, Omkara, flute melody (Murali Svaramu), the conch Panchajanya's resonance, and the sound emerging from Gita's recitation. His divine actions instantly dispel fears and afflictions of worldly existence. The melody's rhythm, love's resonance, Sama Veda chanting, dance, he is the first playwright of the cosmic drama, who assumes the enchanting Maya form, performing Shiva's dance, creating Saraswati's musical notes, nectar-like in essence - all these are manifestations of Sri Krishna. To that all-pervading Lord of Lords, Sri Krishna, who spans entire worlds, I offer eternal salutations. May he bestow upon me food, love, strength, and devotion, allowing me to merge into his divine lotus feet throughout my lifetime.
    te: ''
  - type: verse
    id: v105
    no: '105'
    title: zrIkRSNa sAyujya sAdhanam
    hk: ''
    en: The spiritual practice leading to union with Sri Krishna.
    te: ''
  - type: verse
    id: v105a
    no: 105a
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam . skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam . mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi . zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam. (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: O compassionate one, who removes all my sins, who absorbs the karmic consequences of all my actions across human births without leaving me any burden, who eliminates fear with boundless compassion, who grants liberation in this lifetime - I offer full prostration to Sri Krishna.
    te: ''
  - type: verse
    id: v105b
    no: 105b
    title: zrI zrIkRSNa AtmArpaNam
    hk: 'sarvadevezam sarvavizvezam sarvesarvadAzritassarvadam suzlokezam . yuga puruSam snigdhamohanAkAram patitoddhArakam oGkAra prakAzam . jagadgurum jyotisvarupam, dhyAyAmi satatam, tamIzam mehRdaya sthitam. sarvam samarpayAmi. AtmArpaNam kariSyAmi zrIkRSNam mamasAyujdam ..'
    en: I continuously meditate upon Sri Krishna, the supreme lord of all worlds, who eternally protects those who seek his refuge. He is the Lord of Lakshmi, the Yuga Purusha (supreme being of any era), whose smile radiates and enchants, and whose divine form induces ecstasy. He is the one who Uplifts those fallen into spiritual degradation, Illuminates like the resonance of Omkara, Serves as the guru to all, Shines with the pure, luminous form of a divine lamp, and Resides within the heart. The divine being who grants ultimate liberation, I place all that he has given me at his sacred feet, surrendering completely!
    te: ''
  - type: verse
    id: v106
    no: '106'
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam . skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam . mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi . zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam. (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: Salutations to Sri Krishna, the divine child who smiles playfully, the lotus of Mahalakshmi's heart, destroyer of human flaws, the eternal one who can survive even during the time of cosmic dissolution. He is the enchanter of Radha's heart through his extraordinary flute melody, Hiranyagarbha - the supreme god of gods. He is the bestower of liberation to all, my worshipful deity who shall grant me ultimate spiritual freedom. Salutations to that Mukunda (liberator)!
    te: ''
  - type: verse
    id: v107
    no: '107'
    title: zvAsAntAzvAsam (tudi vinnapam)
    hk: |-
      dInadayALA . zrIkRSNadevA . dehi, me, takSaNa te divyapada sAyujyam zAzvatam ..
    en: O protector of the helpless! Sri Krishna! Immediately merge me eternally into your divine lotus feet!
    te: ''
  - type: verse
    id: v108
    no: '108'
    title: vizvamaGgaLam
    hk: |-
      maGgaLam narasimhAya, herambaH bAlAya, hanuma zrIrAmadattAya . gurvAdi nArAyaNaparabrahmAya, harihara zubhazrI devyaizca maGgaLam, sAyIzAzrita vatsalaH sadAzivasvarupAya maGgaLam . jagannAtha, deveza, lIlA vinodagopAla muktipradAya zrIrAdhAkRSNAya maGgaLam .. (108 akSaramula kUrpu)
    en: 'Salutations to: Sri Narasimha Swami, Ganesha, Shanmukha, Anjaneya, Sri Rama, Dattatreya, Adi Narayana, Vishnu, Shiva, Lakshmi, Gauri Devi, Sai Baba. To the divine protector of those who seek refuge, Lord Shiva, Jagannatha, the God of all gods, the playful cowherd Krishna who grants liberation - may eternal auspiciousness prevail! May all worlds be blessed!'
    te: ''
  - type: verse
    id: v109
    no: '109'
    title: dhyAnAntara namovAkam
    hk: ''
    en: An expression of salutation within meditation
    te: ''
  - type: verse
    id: v109-1
    no: 109 (1)
    hk: oM vande vinAyakam kumAram vAyunandanam ca parandhAmam zrI raghu rAmam . brahmaviSNuzziva zrIdevI svarupa vaMzImohanam zrI rAdhA kRSNam mokSadam .
    en: Salutations to Gati, Subrahmanya, Hanuman, Sri Rama, the supreme lord, Brahma, Vishnu, Shiva, Raja Rajeshwari, Gayatri, and to Vamsi Mohana Krishna, who encompasses all divine male and female forms within his cosmic form, the bestower of liberation, Sri Krishna - my prostrations.
    te: ''
  - type: verse
    id: v109-2
    no: 109(2)
    hk: oM namo digdazA pradIpta praNava divyadhavala (prabhaJjana) prakAzam sundarezvaram . (zivam zivAnIzam somazekharam sarvezvaram sarvadam sarva rogaghnam ca ripughnam zAzvata sAyujyadam) zivam zivAnIzam zrIkRSNAnandamayam zambhum mama zrIkRSNa sAyujyadam ..
    en: Salutations to Mahadeva, the supreme lord who Illuminates all directions like Omkara, Embodies pure, radiant white light, Is adorned with serpents, Fills the universe with Sri Krishna's divine bliss, and Grants liberation to devotees.
    te: ''
  - type: verse
    id: v110
    no: '110'
    title: phaNiphaNAgra zrIkRSNapadavinyAsam
    hk: |-
      duSTa zikSaNa vilakSaNa vilAsam . bAlakRSNa kathAzravaNam ca nAmagAnam dhRvam jIvanmuktidAyakam .

      sarvAparAdhAn kSamadhvam
      bhagavatprasAdam
      sarvam zrIrAdhAkRSNArpaNamastu
      zrIkRSNa zaraNAgataH lekhakaH

      punaH zrIkRSNadhyAnam (navanamakam)
    en: Sri Krishna's divine dance on the serpent Kaliya's hood is a unique method of punishing the wicked. The stories filled with the playful child Krishna, when heard or meditated upon by name, bestow liberation.
    te: ''
  - type: verse
    id: v111
    no: '111'
    hk: oM kAra svarUpam, oM kArAlaGkRtam, oM kAra jaTAjUTa dharam oM kAra nAdapriyam, oM kArIzvaram . oM kAratejam, oM kAra nAdAmRtAnandapradam, oM kArakSetrezvaram, oM trinetram . oM tripurAntakam, tripura sundarIzam, oM trailokyavandyam, oM oM zaGkaramIzvaram . oM zambhum, oM sAmbam, oM zivapaJcAkSari tapasvI prasannam, oM, oM satyam zivam sundaram, oM sadAvande, me sAyujyada zrI kRSNa vizvarupAntargata virUpAkSam zAzvatAnandadam .
    en: "Salutations to the divine lord embodied in the cosmic form of Sri Krishna, who is associated with Omkara's essence and form, Adorned with matted locks, Delighting in Omkara's sound, Lord of the Omkara realm, Radiant with Omkara's energy, Providing nectar-like bliss through his divine sound, Three-eyed, Destroyer of Tripura demons, Husband of Tripura Sundari, Worshipped by three worlds, and Known by many names: Shankara, Ishvara, Samba, Shambhu. When worshipped with \"Om Namah Shivaya\", he manifests directly. He is Virupaksha - the embodiment of truth, humility, and auspiciousness, bestowing eternal joy and liberation."
    te: ''
  - type: verse
    id: v112
    no: '112'
    hk: oM namo zrIkRSNAya vAstupumsAya, gRhAdhiSThAna devAyaca . kurusarvAriSTaharam, me, gRhe, sarvatramaGgaLam, lakSmI saha nityanivAsam, zrIkRSNAnandamayam ..
    en: O Sri Krishna! Vastu Purusha! Divine protector of the home! Ensure that Lakshmi Devi remains steadfast in our house, always united with you, blessing us with all auspiciousness, and filling our home with divine bliss!
    te: ''
  - type: verse
    id: v113
    no: '113'
    hk: |-
      hariNApi hareNApi brahmaNApi surendrapi . krodhakAntAprasannArtham
      pAdAkrAntAH nasaMzayaH hemArgadarsaka puruSottama zrIkRSNa . namonamaH.
    en: Harini, Deer, Brahma, and Indra (the king of gods); destroyer of anger, pleasant one, and he who casts away doubt from the mind - O Hemargha-darshaka (Revealer of golden paths), Purushottama, Sri Krishna - Salutations, salutations.
    te: ''
  - type: verse
    id: v114
    no: '114'
    hk: tam nakhazikha paryantamadbhata saundarya zobhitAGgam . zikhipiJchamauLim, mRdUmadhurahAsapradIptavadanam . khaluharam khANDavadahana kArakam, baliSTham, balarAmAnujam . akhaNDatejorAzim Adidaivam, zrIkRSNam, vande, me, mokSadam ..
    en: Salutations to Sri Krishna, who Radiates with immeasurable beauty from head to toe, Has delicate facial features adorned with a perfect, charming smile, Destroys the wicked, Caused the burning of Khandava forest, Possesses immeasurable strength, Is the younger brother of Balarama, Embodies limitless luminosity, and is the primordial divine being. The first among gods, the bestower of liberation to me - my profound prostrations!
    te: ''
  - type: verse
    id: v115
    no: '115'
    hk: |-
      bAlakRSNam gopAlakRSNam rAdhAkRSNam rAsakrIDAkRSNam .
      dhyAyetsadAyoga kRSNam, lIlA kRSNam mokSadam, me, vaMzImohana kRSNam .
    en: Salutations to Sri Krishna, who is The supreme cowherd, Divine dancer with Radha, Bestower of Gita's yogic wisdom, Source of playful joy, Enchanter of listeners through his flute's melody, and The ultimate liberator. The translation captures the profound devotional essence, highlighting Sri Krishna's multifaceted divine nature - his spiritual teachings, divine play, musical prowess, and role as the supreme spiritual guide.
    te: ''
  - type: verse
    id: v116
    no: '116'
    hk: |-
      zrIkRSNadevaram halarAmAnujam, govardhanoddhArakam navanIta
      coram nanda nandanam gopIvastraharam duSTavanitAraJca phaNirAja bANAsuramardana madana gopAlam vana vihAralIlAvinodinam . ziSTastrImAnarakSakam bhArataraNasArathim vizvarUpam vizvajanAkarSaka vigraham . namAmi bhagavadgItA govindam muktimArgabodhakam mukundam vande, me, zrIkRSNam mokSadam ..
    en: Salutations to Sri Krishna, who is Younger brother to Balarama, Lifter of Govardhana hill, protector of cows and cowherds, The butter thief, Nanda's son, Protector of Draupadi's honor by providing infinite garments, Subduer of Kaliya and Banasura, Destroyer of those who deviate from dharma, Divine player who brought joy in Vrindavana, Cosmic form revealing the roots of the Mahabharata war, Divine enchanter who can attract all, Shower of the liberation path through Bhagavad Gita, and Ultimate liberator. My profound prostrations to this supreme divine being!
    te: ''
  - type: verse
    id: v117
    no: '117'
    hk: |-
      viSNum vizvavibhum virATa svarUpam vimalApatim virAjam
      vikramam . vizvAdhAram vijitAtmAnam vaSaTkAram vanamAlim, namo, zrIkRSNam, muktidam ..
    en: Salutations to Sri Krishna, the Vishnu Murthy who is Lord of all worlds, Transcendental in form, Lord of Lakshmi, Radiant with divine strength, Foundational support of the entire universe, Cosmic sustainer, Protector of forests, and Supreme bestower of liberation.
    te: ''
  - type: verse
    id: v118
    no: '118'
    title: nirmalatvam (zrIkRSNapadapIThikA)
    hk: |-
      vaTapatrazAyim vizvAtmAnam aGguSThakrIDAdbhuta lIlAbAlam zrIkRSNam harim zAzvatagm zivamacyutam. tam nArAyaNam zrImannArAyaNam ArtatrAyaparAyaNam AdinArAyaNam vande, zrIkRSNam sarvArthadam, me, zrIkRSNa caraNa vilInavaradam ..
    en: Salutations to Sri Krishna, the eternal divine child who Playfully splashes and frolics on water during the rainy season, Moves his right toe with childlike mischief, Is the eternal one, Embodies Shiva and Achyuta, Blesses those who seek his protection, Bestows everything, and Grants liberation in this lifetime. My profound prostrations to this supreme divine being!
    te: ''
  - type: verse
    id: v119
    no: '119'
    hk: |-
      kaLyANakRSNam kamanIyarupam kAma janakam kAmitArthadam
      karuNA kRSNam kRSNasundaram . kRSNamAnarakSakam kRSNasArathim ca kRSNagItAcAryam tam zrIkRSNam vande me zrIkRSNakaivalyadam ..
    en: Salutations to Sri Krishna, who is Bestower of auspiciousness, Enchanting in appearance, Fulfiller of Manmatha's father's desires, Embodiment of compassion, Radiant in dark cloud-like complexion, Protector of Draupadi's honor, Arjuna's charioteer, Giver of Bhagavad Gita, and Bestower of liberation. The name "Krishna" is significant for both Draupadi and Arjuna, symbolizing divine protection and spiritual guidance.
    te: ''
  - type: verse
    id: v120-0
    no: 120 (0)
    hk: |-
      oM zrIlakSmI gaNeza sahita harezrI kRSNAya namaH. zrIkRSNa priyopaniSat (navakusumAH)

      (mantramulu "mahA devyaica vidmahe viSNupatnIca dhImIhi" vale paThiJcAli) ("mahA devyaica vidmahe viSNupatnIca dhImIhi" iva)
    en: Om, Salutations to Sri Lakshmi and Ganesha, and to Lord Sri Krishna. Sri Krishna's Beloved Upanishad (Nine blossoms of verse)
    te: ''
  - type: verse
    id: v120
    no: '120'
    hk: |-
      oM kSIra rAjakumArI ca vidmahe kSIra sandrazayana zrIkRSNa manoraJjanIca dhImahI .
      tanno akSaya aizvaryadA sadA zrIkRSNapada sevikA AdilakSmIH pracodayAt ..
    en: Om, we meditate upon the princess of the milky ocean, born from the milky ocean; Sri Krishna, the fulfiller of desires, who rests upon the milky ocean, we meditate upon him. May that imperishable bestower of wealth, the eternal servant at the feet of Sri Krishna, Adilakshmi, inspire us.
    te: ''
  - type: verse
    id: v121
    no: '121'
    hk: |-
      oM ramA ramyA zivA hemA ca vidmahe, rAdhA kRSNa rAgarAgiNyai ca dhImahi .
      tanno ramAramaNa caraNa vilIna mArgadarzinIH pracodayAt..
    en: Om, We know Rama, the Beautiful, Shiva, the Golden One; We meditate on Radha, Krishna's passionate beloved; May she who reveals the path of merging into the lotus feet Of the Divine Lover (Rama's Beloved) Always inspire and guide us.
    te: ''
  - type: verse
    id: v122
    no: '122'
    hk: |-
      oM candra vadanAya vidmahe, candrasahodaryaica dhImahi .
      tanno zarazcandrakoTi prabhAsa, zrIkRSNa priyAH zyAmalAH pracodayAt ..
    en: Om, We know the one with a moon-like face; We meditate on the sibling of the moon; May the beloved of Sri Krishna, the dark-complexioned one, Inspire us with the radiance of millions of autumn moons.
    te: ''
  - type: verse
    id: v123
    no: '123'
    hk: |-
      oM zakti svarUpiNyaica vidmahe, bhaktAbhISTa varadAyinI ca dhImahi .
      tanno mukti pradamukunda zrIkRSNa hRdayAnandinIH pracodayAt..
    en: Om, We know the embodiment of Divine Energy; We meditate on the one who grants the desires of devotees; May she who brings joy to Krishna's heart, The bestower of liberation through Mukunda (Krishna), Always inspire and guide us.
    te: ''
  - type: verse
    id: v124
    no: '124'
    hk: |-
      oM sarvamaGgaLAya vidmahe, sarvazubhaparampara kAriNI ca dhImahi.
      tanno sarvasarveza zrIkRSNa sahavAsinIH pracodayAt ..
    en: Om, We know the One who embodies all auspiciousness; We meditate on the supreme creator of all that is blessed; May she who resides alongside Sri Krishna, The mistress of all lords and masters, Always inspire and guide us.
    te: ''
  - type: verse
    id: v125
    no: '125'
    hk: |-
      oM akhilaloka jananIca vidmahe, nikhilaloka zokavinAzinyaica dhImahi.
      tanno akhilANDezvarI apurupA suzlokA kRSNAH pracodayAt..
    en: Om, We know the One who embodies all auspiciousness; We meditate on the supreme creator of all that is blessed; May she who resides alongside Sri Krishna, The mistress of all lords and masters, Always inspire and guide us.
    te: ''
  - type: verse
    id: v126
    no: '126'
    hk: |-
      oM vidyAnAmna virAjitAya vidmahe vizvezvari vimalAdevyaica dhImahi.
      tanno vaiSNavI, kRSNaveNI, vANI, nArAyaNIH pracodayAt..
    en: Om, We know the one who is resplendent among all knowledge; We meditate on the immaculate Universal Goddess; May the Vaishnavi (Divine Feminine Principle), The companion of Krishna, The sacred voice of Narayana, Always inspire and guide us.
    te: ''
  - type: verse
    id: v127
    no: '127'
    hk: |-
      oM aSTavidhalakSmIH zca vidmahe, aSTaizvaryadAyinI zrI mahAlakSmI ca dhImahi .
      tanno aSTakaSTAdi sarvasaGkaTahAriNI zrIkRSNa ramaNIH pracodayAt..
    en: Om, We know Lakshmi who appears in 8 avataras; We meditate on Sri Mahalakshmi, the bestower of eight types of prosperity; May she who removes all obstacles and difficulties, The beloved of Sri Krishna, Always inspire and guide us.
    te: ''
  - type: verse
    id: v128
    no: '128'
    hk: |-
      oM gAyatri sAvitrI sarasvatI rupi sandhyA devyai ca vidmahe, mayA upAsitAdityAntargata tejazrI ca dhImahi .
      tanno zrIkRSNa hAsaharSitA zAntA mokSalakSmIH pracodayAta..
    en: Om, We know the form of Gayatri, Savitri, and Saraswati; We meditate on the Sandhya Goddess, whose radiant essence Is contained within the inner light of the Sun; May the serene Moksha Lakshmi, who delights in Krishna's smile, Always inspire and guide us.
    te: ''
  - type: section
    id: s03
    hk: namovAkam
    en: Obeisance
  - type: verse
    id: v129
    no: '129'
    hk: |-
      oM sarvAntaryAmi zrIhari iti vidmahe, sarvadhara sarvAdhAra sarvavararu zrImannArAyaNAya dhImahi .
      tanno devAdi deva mokSaprada zrIdhara zrIkRSNaH pracodayAt..
    en: Om, We know the Inner Controller, Sri Hari; We meditate on the Supreme Sustainer, the Ultimate Support, the Most Excellent One, Sri Narayana; May Sri Krishna, the Lord of Lords, the bestower of liberation, Who is Sri Dhara (Bearer of Prosperity), Always inspire and guide us.
    te: ''
  - type: verse
    id: v130
    no: '130'
    hk: |-
      oM namo kRSNa namokRSNa zrIkRSNa kRSNa hare hare ..
      ..zrIkRSNa prasAdam..
      ..sarvam zrIkRSNArpaNamastu ..
      .. hariH oM tatsat..
    en: Om, Salutations to Krishna; Salutations again to Krishna; Sri Krishna, Krishna, Hari, Hari Sri Krishna's Grace May everything be offered to Sri Krishna Hari Om, That is the Truth.
    te: ''
  - type: section
    id: s04
    hk: 'puruSottamapadadhyAnam :'
    en: Meditation on the supreme state (or abode) of the Purushottama
  - type: verse
    id: v131
    no: '131'
    hk: |-
      zrIkRSNAya vAstupuMsAya, gRhAdhidevAya, vande,sarvAnugrahakArakAyaca.
      kurumamagRhalakSmI nilayam, zrIkRSNa hRdaya nandanam, sadA zAnti saubhAgya zobhitam ..
    en: O Sri Krishna, divine Vastu Purusha and the primary deity of the home! Bless us in all ways. As the abode of Lakshmi, ensure our home Radiates eternal peace and prosperity, Delights your divine heart, and Remains cool and blessed. My profound prostrations to you!
    te: ''
  - type: verse
    id: v132
    no: '132'
    hk: |-
      tejassarojam zrIkRSNa prasAditam zrIkRSNa bhaktilaharIlAsyamaGgaLArAmam.
      tejazrI kRSNavAsam, bhavam, megRha, zrIkRSNahAsa prakAzamAnandadhAmam ..
    en: In the flowing stream of Sri Krishna's devotion, like a radiant lotus flower, may Lakshmi's blessings eternally remain. Sri Krishna has blessed and graced our home with his sweet, gentle smile, making us truly fortunate.
    te: ''
  - type: section
    id: s05
    hk: vandanam vAsudeva zrIkRSNAya
    en: I bow down to Vasudeva Sri Krishna
  - type: verse
    id: v133
    no: '133'
    hk: |-
      zrIkRSNa nAma gAnam karomi punaH punaH .
      zrIkRSNa lIlAsmaraNam karomi punaH punaH .
      zrIkRSNabhaktasahavAsam karomi punaH punaH .
      zrIkRSNa padadhyAnam AjanmAntam karomi punaH punaH ..
    en: I shall repeatedly chant Sri Krishna's many names! I shall repeatedly remember his playful divine actions and miraculous deeds! I shall meditate on his lotus feet throughout this lifetime, in the company of his devotees! I shall live in divine bliss, immersed in Sri Krishna's joy!
    te: ''
  - type: verse
    id: v134
    no: '134'
    hk: |-
      vande mAtaram pitaram agrajassarvam jyeSTham zreSTham vande .
      vande, asmat gurum zrIkRSNa padadhyAna kArakam .
      vande, vizvaguram zrIkRSNam karuNAmayam, vande .
      vande sadAlIlAkRSNam, sarvadam, asmat janmAnte mama zrIkRSNa kaivalyadam ..
    en: Prostrations to Vasudeva Sri Krishna, who is Divine parent to our birth parents, Universal progenitor, Cosmic guru of all worlds, Embodiment of compassion, Divine enchanter through spiritual play, and Infinite in mercy. Salutations to the supreme lord who Redirects our troubled minds towards divine contemplation, Guides spiritual seekers, Delights through divine cosmic play, and blesses those who seek his lotus feet.
    te: ''
  - type: verse
    id: u1
    no: ''
    title: manavi
    hk: |-
      cinmayAnanda zrIkRSNulu anugrahiJci tAnupaliki, yI
      ceta vrAyiJci nannu tarimpacesitiri.
    en: 'My prayer: May Sri Krishna, the embodiment of conscious bliss, bless me and, through His grace, write with this hand and carry me across (liberate me)'
    te: ''
  - type: verse
    id: u2
    no: ''
    hk: |-
      oM zrI mahAgaNAdhipataye namaH
      oM zrI rAma zrI kRSNa parabrahmaNe namaH
      zrI zrI zrI kRSNa - dAsa samvAdam
    en: |-
      Om, salutations to Sri Maha Ganadhipati (the great Lord of the Ganas, Ganesha)
      Om, salutations to Sri Rama, Sri Krishna, the Supreme Brahman
      This is the sacred dialogue between Sri Krishna,
      the infinite Lord of compassion,
      and his humble devotee, the servant who surrenders in love
    te: ''
  - type: verse
    id: v135A
    no: 135A
    hk: |-
      oM.. tailAbhyaGgana, saugandha, zobhita zubhAGgam, divya dhavaLa vastrAbharaNa zikhipiJchadharam .
      janmadivase mAtRvAtsalya pUrvaka, samarpita, svAdhiSTha bhojana, santuSTa varSa traya bAlakam.
      jananI hastasthita, hrasvasthUla zarIra zrIkRSNam pazya parihAsam karomiti - he pInakAya kRSNa . zlAghanIya .
      sthiraciruhAsavadana, zrI bhagavAnuvAca - pathavihIna arbhaka . tavarakSaNArtham sadA laGghanodyuktoham..
    en: 'With oil massage, fragrant, adorned with auspicious limbs, wearing divine white garments and a peacock feather crown. On his birthday, with maternal affection, the mother offers him his favorite food, satisfied with her three-year-old child. Holding him in her hands, seeing his short and stout body, Sri Krishna with a playful smile, says: "O plump Krishna, you are praiseworthy!" The blessed Lord responds: "O helpless child, I am always prepared to protect you."'
    te: ''
  - type: section
    id: s06
    hk: mamAparAdhakSamAkrozaH
    en: My cry (plea) for forgiveness of offenses
  - type: verse
    id: v136
    no: '136'
    hk: ariSadvargam mamAzritam, ahamkArAgrahapUritasvabhAvam . paranindAtmastutyAcaraNam, asatyamaya vAcAlatvam sarva sanmArgarahitam ca, svalpadaivacintana jIvanam. nAham kSamArhOpi, tvamananta dayAmaya deva iti, kSama . kSama . karuNA kRSNa . rakSa . rakSa . zrIrAdhAkRSNa .. - dehime, abhayam, aparAdhakSama, asmajanmAnte, tavazrIcaraNa sAyujyam , zrIkRSNAnandamayam, zAzvatam .
    en: "O Sri Krishna, Radha Krishna Deva! I confess my spiritual struggles: Persistent Inner Challenges: Overwhelming desires (Kama), Uncontrolled anger (Krodha), Greed (Lobha), Delusion (Moha), Pride (Mada), and Jealousy (Matsarya). My Spiritual Afflictions: Excessive ego, Uncontrolled rage, Constant criticism of others, constant self-praise, Habitual lying, Lack of heartfelt devotion, devoid of all good graces, and Minimal remembrance of the divine. Divine Plea: You are boundless in compassion, Even for the greatest sinner, you offer redemption; Forgive my transgressions, Protect me, Eliminate all my sins, At life's end, nullify karmic punishments, Unite me with your divine lotus feet, and Grant me infinite spiritual bliss."
    te: ''
  - type: verse
    id: v137
    no: '137'
    hk: |-
      oM zrI saurabharamyavarNa, suma, kisalaya latApariSvaGgA zvattha mUlasthitam . tacchayAcchAdi tavinA grISmatApa tejomayam prazAnta vadanam.
      vanavihAra gopAlam, muraLI nAdAmRtAnandapradam vizvamohanam. bhaktahRdayastham, rAdhezam, jagadrakSakam, vande me zrIkRSNam, kaivalyadam .
    en: Salutations to Sri Krishna, who has the Divine Attributes of First to rest under the Ravi tree adorned with beautiful colors and fragrant flowers, Surrounded by creeping vines, Radiant with boundless luminosity, Shielded from harsh sunlight by the tree's shade, and Embodying pure, untroubled joy. His Cosmic Characteristics are that he is a Cowherd in forest gardens, a Divine flute player who enchants all worlds, Mesmerizes through transcendental music, Resides in devotees' hearts, Protector of the universe, Radha's beloved, and Bestower of liberation.
    te: ''
  - type: verse
    id: v138
    no: '138'
    hk: |-
      sadAzivArAdhakam, sadAzivArAdhitam, sazivasvarupam, sadAziva svabhAvam.
      sadA zivAnandarAmam, sadA zivam ca viSNum, sadAzrita ssarvadam.
      sahasrassahasrassahasrAm sarazzirAzim, sahasra zIrarSam, sahasrAkSam, tam. sadAdhyAyAmi, yogezvaram, sarvadevezvaram, sadAdhyanezvaram zrIkRSNam, sadgurum, zrIkRSNa sAyujyadam .
    en: 'Salutations to the supreme divine being who has the Divine Attributes of Eternally worshipping Shiva, Worshipped by Shiva, Viewing all equally, Perpetual source of bliss, and Bestower of everything to those who seek refuge. His Cosmic Characteristics are as follows: Shiva and Vishnu as one unified divine essence, Radiant like a sun with thousands of rays, Yogeshwara with thousand heads and eyes, Lord of all gods, Supreme divine foundation of meditation, Ultimate guru, and the Bestower of liberation.'
    te: ''
  - type: verse
    id: v139
    no: '139'
    hk: |-
      nityasatyatatva zrI kRSNamitrAbhilASiraham, nirantara dhyAnAnandasahitam .
      satyadevasAyajyada zrI kRSNa zaraNAzritam, sarvam zrIkRSNAnujJayA .. - svalambhavam mamazeSajIvitam, sulabham zrI kRSNa zaraNyapatha gamanam . sampUrNArogya pUritam ca, sarvesarvadA zrI kRSNa dhyAnabharitam . pAhi . pAhi . caGgalvadhAri . karuNAmaya, vizvarupa, zrI kRSNavAsudeva . muktiprada . dehi,me, asmat janmAnte zrI kRSNa caraNazAzvata sAyujyam..
    en: |-
      O Sri Krishna, the eternal embodiment of truth, I seek your divine friendship and surrender: Divine Surrender: Yearning for your boundless compassion, Seeking refuge through unrestrained meditation, Desiring liberation through your divine grace.
      Spiritual Petition: Minimize my remaining life's struggles, Guide me effortlessly on your path, Free me from disease and suffering, and Immerse me perpetually in your divine contemplation. Cosmic Invocation: O compassionate one! Son of Vasudeva, radiating cosmic form! Bestower of liberation!
      Final Supplication: Upon my death, instantly merge me into your lotus feet. Grant me eternal bliss without rebirth. Protect and preserve me. I surrender completely to your divine will and grace.
    te: ''
  - type: section
    id: s07
    hk: zrIkRSNamokSanandamayam
    en: Sri Krishna, who is liberation itself and filled with bliss
  - type: verse
    id: v140
    no: '140'
    title: zrIkRSNanivAsasthAnam
    hk: |-
      oM.. vasati, nahinahi, goloke, kapaTakarmiSThinAm, hRdayenica.
      nijabhaktAyatra, zrIkRSNa nAmAni gAyanti, tathyam, tatra zrIkRSNatiSThati ..
    en: Sri Krishna does not reside merely in the higher worlds of Goloka or the minds of cunning worshippers. Wherever true devotees sing his praises, calling his name with pure devotion, there he eternally resides - with his blue eyes, as the embodiment of bliss, steadfast and complete.
    te: ''
  - type: verse
    id: v141
    no: '141'
    title: zrI zrI kRSNa tatvAvagataH (mantram -nArAyaNAya vidmahe)
    hk: |-
      oM tatvasvarUpAya vidmahe, tulasImAlAdharAya dhImahi,
      tannotejomaya, zrIkRSNaH pracodayAt..
    en: I am meditating with a single-pointed concentration on those who embody the essence of truth, understanding them through the path of devotion, while standing in the Tulasi garland. May Sri Krishna, radiant like an infinite luminous lotus, forever bless and guide my meditation!
    te: ''
  - type: verse
    id: v142
    no: '142'
    title: zrIkRSNAmRta bIjAkSarI (bhajana kIrtana)
    hk: |-
      kRSNam kRSNam tejokRSNam zauryakRSNam kRSNam kRSNam.
      kRSNam kRSNam zizukRSNam satyakRSNam kRSNam kRSNam.
      kRSNam kRSNam bAlakRSNam lIlAkRSNam kRSNam kRSNam.
      kRSNam kRSNam bRndAkRSNam gopakRSNam kRSNam kRSNam.
      kRSNam kRSNam rAgakRSNam krIDAkRSNam kRSNam kRSNam.
      kRSNam kRSNam ramyakRSNam vamzIkRSNam kRSNam kRSNam.
      kRSNam kRSNam gItAkRSNam dhyAnakRSNam kRSNam kRSNam.
      kRSNam kRSNam rAmakRSNam rAdhAkRSNam kRSNam kRSNam.


      kRSNam kRSNam mohana kRSNam muraLIkRSNam kRSNam tANdava kRSNam zrIkRSNam .
      kRSNam kRSNam vandekRSNam kRSNam kRSNam karuNAkRSNam sAyujyadam zrI kRSNam ..
      namAmi nityam tam zrI kRSNam me kaivalyadam..
    en: "A Lyrical Garland of Sri Krishna's Many Names: A Devotional Salutation Salutations after the Sri Krishna Bhajan, composed with divine names that celebrate his multifaceted divine essence. The Divine Names Celebrated are Gopal, Govinda, Madhava, Krishna, and Hari."
    te: ''
  - type: verse
    id: v143
    no: '143'
    title: zrIkRSNAnandAmRtamayam
    hk: |-
      tRptAnandam, nityAnandam, tapAnandam, AtmAnandam . vidyAnandam, vijJAnAnandam, jJAnAnandam, gurvAnandam, pUrNAnandam, vedAnandam, devAnandam, brahmAnandam, cidAnandam, sarvAnandam, satyAnandam, viSNvAnandam . sadAnandam, cinmayAnandam, paramAnandam, zivAnandam, karmAnandam raktyAnandam, lakSmyAnandam, sukhAnandam . bhogAnandam, bhAgyAnandam, dharmAnandam, gRhAnandam . dhyAnAnandam nAmagAnAnandam, zrI zrIkRSNa bhaktAnandam, mokSAnandam ..
      sRSTyAnandam, pAlanAnandam, layAnandam, jagatsarvam zrIkRSNAnanda mandiram . yogAnandam, saccidAnandam, tatsarvam zrI kRSNAnandAmRtamayam ..
    en: |-
      Satisfaction brings pure joy; Penance reveals inner divine essence; Learning brings enlightenment; Vedic recitation provides divine wisdom; Meditation grants infinite bliss.
      Divine Manifestations of Happiness: Understanding divine principles, Experiencing spiritual ecstasy, Realizing cosmic truths, Performing righteous actions, and Practicing spiritual disciplines.
      Cosmic Understanding: The entire world is a temple of divine joy. Sri Krishna's bliss permeates existence. Spiritual practices lead to transcendental happiness. Every action can be a pathway to divine ecstasy.
      Spiritual Pathways to Bliss: Meditation, Love and devotion, Achieving personal goals, Following divine dharma, Yogic practices, Spiritual contemplation.
    te: ''
  - type: section
    id: s08
    hk: zrIkRSNa kRpAdhArAmRtam
    en: The nectar-like stream of Sri Krishna's compassion
  - type: verse
    id: v144
    no: '144'
    hk: |-
      oM zrI padmalocanam, padmasundaram, padminI prANezam zrIkRSNam.
      paramadayALum, ca, parandhAmam, praNamAmi, me, paramapadam, zrI zrI kRSNam ..
      sadAzivArAdhakam, sadAzivArAdhitam, sadAzivAnandarAmam, sadAzivam ca viSNum sadAbhaktassarvadam. sahasrassahasrAm sarazzirAzim . sahasrazIrSam sahasrAkSam, tam, sadAdhAyAmi me zrI kRSNam, sAyujyadam ..
    en: Salutations to Sri Krishna, who is the Husband of Lakshmi Devi, Born in the lotus of divine beauty, an Embodiment of boundless compassion, the Supreme divine being, and an Eternal resident of Goloka. His Spiritual Essence is his Eyes beautiful like lotus petals, Infinite mercy, Transcendental cosmic dweller, and the Supreme divine lord.
    te: ''
  - type: verse
    id: v145
    no: '145'
    hk: |-
      zrI kRSNa mandasmita mukhaprakAzamananta koTi zazi prabhasamAnam .
      zrI kRSNa hastazthita navanItagoLam vizAla vizvAdhika dhanyamUrtiH
      zrI kRSNa karAravindastha muraLI svaram madhuram, vizvamohanakaram .
      zrI kRSNa bAlalIlAvinodam, yazodAnandamayam ca, jagatpramodakam ..
      nityam namAmi niratamArAdhayAmi, satatam smarAmi sadA dhyAyAmi me hRdayastham, dayALu, zrI kRSNam, mamasAyujyadam ..
      zrI kRSNa dhyAnam muktipradam, zrI kRSNanAmagAnam mokSakaram zrI kRSNakathA zravaNam sAyujyadam .
    en: "Salutations to Sri Krishna, the divine child whose Smile radiates like millions of moons, Playful actions delight Yashoda, Flute enchants entire worlds, and who Brings joy to cosmic realms. His Spiritual Essence: Eternally worshipped, Remembered with devotion, Residing in devotees' hearts, and Bestower of ultimate liberation. Transcendental Characteristics: Infinite childlike charm, Cosmic musical enchanter, Source of universal bliss, and Compassionate liberator. The divine child Krishna, through his sweet smile, playful actions, and transcendental flute, captivates the entire universe. Meditating on his name, listening to his divine stories, and contemplating his miraculous pastimes are pathways to spiritual liberation."
    te: ''
  - type: verse
    id: v146
    no: '146'
    title: zrIkRSNa mokSAmRtAkSari
    hk: |-
      zrIkRSNam vande, me mokSadam ..
      he zrI kRSNa . mokSa bhikSAndehi .. hare zrI kRSNa . mokSam dehi .
    en: Salutations to Sri Krishna, the bestower of liberation through divine speech! O Sri Krishna! Grant me liberation, Destroyer of sins, Ultimate liberator!
    te: ''
  - type: verse
    id: v147
    no: '147'
    title: zrI kRSNa mAnasika darzanam
    hk: |-
      zrI kRSNam manasAdarzayAmi. zrI kRSNamanodarzanam divyAnandakaram, anantam, anirvacanIyam, adbhutam.

      zrI kRSNadarzanAnandastotram :
      trimUrtyaika rupAya, triguNAtIta devAya, trivikramAya devadevezvarAya - namonamaH maGgaLam . dazAvatAra dharAya, dazakaNTha harAya, dAzarathAya, vizvavaradAya, zrI rAmacandrAya - namonamaH maGgaLam. vizvezAya, vizvavaradAya, vizvavyAptAya, vizvarUpAya vAsudevAya, zrI rAdhezAya, rukmiNI prANezAya namo namaH maGgaLam . sadAzritavatsalAya sadAzivAya, yazodAnandakRSTAya sampUrNAvatArAya, mamazrI zrIkRSNA divyadarzanapradAya, zrI zrI kRSNasAyujyadAya mama, zrI zrI kRSNa AnandamUrtaye namo namo namaH maGgaLam - hare zrI kRSNa . mokSam dehI.
    en: Salutations to Sri Krishna, the Supreme Divine Being who is the Unity of Brahma and Vishnu, Beyond material qualities (sattva, rajas, tamas), Lord of all worlds, Supreme hero, Incarnator of ten divine forms, Vanquisher of Ravana, Fulfiller of universal desires, Cosmic administrator, and Bestower of all blessings. He is the Son of Vasudeva, Lord of Radha, Husband of Rukmini, Compassionate protector, Source of infinite joy, Eternal divine presence, and Embodiment of universal consciousness.
    te: ''
  - type: verse
    id: v148
    no: '148'
    title: jayamaGgaLa bharatAvAkyam
    hk: 'maGgaLam jaya maGgaLam sarvamaGgaLam vizvajayamaGgaLam ..'
    en: Victory! Total Victory! At all times, in all places, for all beings across all cosmic realms - May Absolute Triumph Prevail!
    te: ''
  - type: section
    id: s09
    hk: 'zrIkRSNa dhyAnaphalitam:'
    en: The fruit (result) of meditating on Sri Krishna
  - type: verse
    id: v149
    no: '149'
    hk: |-
      etatsarvam zrI kRSNAjJAnusAram zrI kRSNAnugraha prasAdam .
      zrI kRSNa lIlAgItA ssarvam, zrI kRSNa varapradAnam . zrI kRSNAnandamayam ca, zrI kRSNahAnaprakAzam . zrI rAthAkRSNadhyAna phalitam, zAzvata zrI kRSNa sAyujyam..
    en: "Divine Surrender to Sri Krishna: All my actions, writings, songs, meditations, devotional practices, and playful endeavors are solely by Sri Krishna's gracious blessing. His divine pastimes are Pure grace, Transcendental blessing, and Infinite compassion. His Spiritual Essence: Celebrating Krishna's divine play, Experiencing divine bliss, Surrendering at Radha-Krishna's lotus feet, Seeking eternal union without rebirth. His Key Divine Attributes are boundless mercy, a Radiant smile, Infinite compassion, and Spiritual liberation."
    te: ''
  - type: verse
    id: u3
    no: ''
    hk: bhagavatprasAdam - sarvam zrI rAdhAkRSNArpaNamastu sarvAparAdhAna kSamadhvam mokSasAdhanamastu
    en: By the grace of the Lord - may everything be an offering to Sri Radha-Krishna. May all offenses be forgiven, and may this become the means to liberation
    te: ''
  - type: verse
    id: v150
    no: '150'
    title: zrI kRSNa kizoravilAsam
    hk: |-
      oM.. nandakizoram gopakizoram, vasukizoram, lazokizoram. bAlakizoram, gopAlakizoram, lIlAkizoram, rAgakizoram. nAdakizoram, nATyakizoram, bRndAkizoram brahmAnandakizoram. zrInRsimha kizoram, brahmANda kizoram, sadAvande, mokSadam me zrI kRSNam vizva kizoram ..
    en: "Salutations to Sri Krishna, the Divine Child who is a Cowherd boy (Govabaluda), Son of Vasudeva, Yashodha's beloved child, Nanda's enchanting son, Protector of cows, and Vrindavana's divine dancer. Transcendental Characteristics: Playful infant, Lion-hearted, Cosmic dancer, Flute player, Rasa dance performer, Bestower of divine bliss, Eternal cosmic presence, and Liberator through divine music. Spiritual Essence: Enchanting through childlike pastimes, Singing celestial songs, Dancing with divine grace, Spreading cosmic joy, and Residing in all worlds until cosmic dissolution."
    te: ''
  - type: verse
    id: v151
    no: '151'
    title: zrI kRSNa tatva prakAzakam
    hk: |-
      nanukOlturubhaktulu, sadAtapasvisAmba zivunigA, zivapaJcAkSarito.
      nArAyaNAkSaryupAsakulu, viSNubhaktulu, tArakarAmadhyAnadhanyulu
      zrIrAma zaraNAgatuph tatvajJalu, nAnitya satyavizvamaya zrIkRSNunigA vAsu
      deva dvAdazAkSari japiJci tarintu, rituruliSTadevatAvigrahunigan ..
      sarvadevAzritula samamugacUtunu, sarvamamarci santasaparacEda |
      Artulu pazcAttAptulai, sthiracittulE", sarvezvarA | mAtappulumannimpumu.
      nIvedikkani, OkamArannacAlu, Abhayamicci Adukuni |
      sarvasaubhAgyamulu, janmAntamuna, mokSasAyujyamOsaGgEda,
      nizcayambugan, bhaktavazyuDanai ..
    en: O Lord Krishna, the devotees worship You always as Samba Shiva, with Shiva's Panchakshara mantra. Narayana's mantra worshippers, Vishnu devotees, and those blessed with Tarak Rama meditation have surrendered to Sri Rama's shelter. Those who know the truth, eternal and universal, worship You as Sri Krishna, chanting Vasudeva's twelve-syllable mantra, while also honoring their chosen deity. I see the peace of all divine beings, dedicating everything and bringing joy. Those with wounded hearts, filled with remorse, becoming steady-minded, O Supreme Lord, please forgive our mistakes. You are our sole refuge. Just one glance is enough. Grant us fearlessness and protection. You will bestow all auspiciousness, throughout life and ultimately liberation and divine union, this I firmly believe, for You are controlled by devotion.
    te: ''
  - type: verse
    id: v152
    no: '152'
    title: zrIkRSNa amRtopadezam - antyAdezam
    hk: |-
      nenu bhaktavazyuDanu, dhyAnamArgasulabhalabhyuDanu, veda, dAna, yajJa, japa, tapo,
      karmAnuSThAnAdi, bahuvidhamulugA nannArAdhiJcu bhaktulandari nI karuNintunu, vAri
      hRdayame, nAnijamaina zAzvatanivAsamu.
      zivapaJcAkSarI mantropAsanadvArA, nityatapasvisadAziva svarUpunigA, viSNu aSTAkSarIto,
      nAkaLyANamarUpamaina zrI lakSmi nArAyaNunigA, tArakarAmamantramuto,
      dazAvatAramulalo AdarzapuruSAvatAruDaina zrIrAmunigA, vAsudevadvAdazAkSarIto
      - vizvarUpa zrIkRSNunigA, leka, mare itara iSTa devatA vigrahunigA nAmagAnaJcesinA,
      ArAdhiJcinA, sarvadAprasannuDanu, kAni, Oka svarUpunigA ArAdhiJci,
      marorUpamunu dveSiJcu, ahaGkArulu a thogatipAlauduru.
      bhaktulandaruku, amRta bIjamainatOmmidi akSaramulasamudAyamaina - “navAkSari”
      oM.. zrI.. zivarAmakRSNAya namaH..
      anumantramunu prasAdiJcucunnAnu.
      upAsiJci, mokSasAdhakulaudurugAka !!!
      gamanika : nArAyaNuDanna nIru nivAsamugAgalavADani arthamu, zrI mahAviSNuvani
      cEbuduru. satyame vIrini, divyamaGgaLavigrahuDagu, sarvaloka antya praLayakAlamuna,
      vaTapatrazAyigA, krIDA bAlakRSNarUpunigA vinodiJcu, sarvasarvezvaruDu, zAzvatuDagu
      zrIzrI kRSNa paramAtmagA grahimpadagunu.
      zrImannArAyaNa aSTAkSarI mantropAsana bahuprItikaramu
    en: |-
      Sri Krishna’s divine and binding Guidance: I am controlled by devotion, easily accessible through meditation's path. Through Vedic practices, donations, sacrifices, chanting, penance, and ritual performances, I will show compassion to all devotees who worship me in numerous ways, and their heart is truly my eternal dwelling place.
      Through various paths of mantra worship, one can approach the Divine in multiple forms: As Sadashiva, the eternal ascetic; As Vishnu with the eight-syllable mantra; As Sri Lakshmi Narayana, embodying auspiciousness; As Sri Rama, the ideal avatar in the ten divine incarnations; As Sri Krishna, the universal form with the twelve-syllable Vasudeva mantra; Or through any chosen deity's form.
      However, a word of caution: those who worship one divine form while despising another, driven by ego, will fall into lower spiritual states. The text offers a profound nine-syllable mantra (Navakshari): OM SRI SHIVARAMAKRISHNAYA NAMAH.
      The ultimate guidance is to worship with devotion, seeking liberation.
    te: ''
  - type: verse
    id: v153
    no: '153'
    hk: |-
      oM mAm dhyAyanti, nija bhaktAH zivaH viSNuH zrIrAmaH
      vizvarupa vizvamaya, divyamaGgaLa vigraha, zrI kRSNaH gAyatrIH iti anekarupadaivaca. zivapaJcAkSari, nArAyaNASTAkSari tArakarAma, vAsudeva, dvadazAkSaryAdi upasakAH . samadarziraham, mayAzritassarva rakSakam ca kalausmaraNekamAtreNAbhayam, dadAmi, ihaloke sarvasampadAm, janmAnte zAzvata sAyujyam, bhaktavazyoham sadA. uttamam iSTa devatArAdhanam, narakapradam, parapakSadveSam, kurubhakti yogAbhAyAsam, zreyomokSArtham nityam . zivarAma kRSNAya namaH iti, mayAdatta, amRtabIja, navAkSarI japam, sarvo tkRSTam sarvamantrasAram ca zAntiH kaivalyadam ..
    en: Om, My devotees meditate on me as Shiva, Vishnu, Sri Rama as the Cosmic Form, Universal Being, Divine Auspicious Embodiment, Sri Krishna, and Gayatri in many divine forms. Those who worship Shiva's Five-Syllable Mantra, Narayana's Eight-Syllable Mantra, Taraka Rama, Vasudeva, Twelve-Syllable Mantras. I am equal-minded, a protector of those who seek me. By merely remembering me in Kali Yuga, I grant Fearlessness, All prosperity in this world, and Eternal liberation at life's end. The supreme worship of chosen deities Prevents hell, Avoids enmity toward others, and Cultivates devotion and yoga. For ultimate spiritual liberation, salutations to Shiva, Rama, Krishna! I offer the immortal seed, The Nine-Syllable Japa, and The essence of all mantras, Bringing peace and ultimate liberation.
    te: ''
  - type: section
    id: s10
    hk: 'mama vinnapam :'
    en: My humble request
  - type: verse
    id: v154
    no: '154'
    hk: |-
      bhavam mamajIvitaratham mameza zrIkRSNacoditam, dhanuJjaya sahitam dhanyam . satyazrIH zreyoprAptartham, ante zrIkRSNa caraNa zAzvata vilIna sidyartham ..
      zrI zrI kRSNamaGgaLahArati :
    en: May my life flow smoothly, without turbulence, guided by Sri Krishna's divine direction, akin to Arjuna’s chariot, accompanied by noble virtues. Grant me the blessings of true prosperity and the highest good, allowing me to merge completely into Sri Krishna's sacred feet at the end of this lifetime.
    te: ''
  - type: verse
    id: v155
    no: '155'
    hk: |-
      oM.. tejazrIzAya, zrImannArAyaNAya, svapAdAGguSTha
      cUpaNAnandalIlA bAlAyaca . taddevadevezAya, mameza zrIkRSNAya mokSapradAya, zAzvatAya, maGgaLam ..
      maGgaLam jayamaGgaLam . sarvamaGgaLam .
      sarvesarva janame jayamaGgaLam ..
      maGgaLam mahat zrI zrI zrI zrI zrI
      iti zrI kRSNa dhyAnagItAvaliH sarvam sampUrNam
      sarvAparAdhAn kSamadhvam
      bhagavatprasAtam
      sarvam zrI kRSNArpaNamastu
      hariH oM tatsat
    en: Salutations to Sri Krishnadevaraya, the eternal divine lord who is a Radiant cosmic being, Lotus-eyed divine ruler, Eternal sovereign, Playful divine child, Supreme cosmic deity, Always standing as the supreme authority, Embodiment of divine grace, and an Eternal cosmic presence. Eternal victory and auspiciousness to you, O Sri Krishnadevaraya!
    te: ''
  - type: section
    id: s11
    hk: 'zrI kRSNAsAyUjya sAdhanam :'
    en: The means of attaining union with Sri Krishna
  - type: verse
    id: v156
    no: '156'
    hk: |-
      oM.. tejasvinam, tejazrIzam, tejaH puJjam, tejomayam, tejorAzim, tejorUpam, tejodhipam, tejasvantam .
      tamIzam, tanmayIzam, tatsarvezam, tatsarvArthadam .
      tapazyAmi, zrI zrI kRSNa AjJAnusAram nityam me, tANDava zrI kRSNam, zrI kRSNacaraNa sAyujyadam..

      namo kRSNa. namo kRSNa. kRSNa kRSNa. hare hare.
      hare kRSNa hare kRSNa kRSNa kRSNa hare hare .
      hare rAma. hare rAma. rAma rAma. hare hare.
      zivoham. zivoham. zivoham . zivoham .
      haroham . haroham . haroham . haroham .
      oM namazzivAya.
      oM namaH zrIrAmabhadrAya.
      oM namo nArAyaNAya
      oM namo bhagavate vAsudevAya.
      ..oM .. zrI .. zivarAma kRSNAya namaH ..
    en: Salutations to Sri Krishna, the Divine Embodiment of Radiance, who is the Lord of Effulgence, Personification of Radiance, Supreme Source of Light, Master of Luminosity, and Possessor of Infinite Brilliance. He is Lakshmi's Lord, Bestower of All Blessings, Eternal Divine Dancer, Giver of Liberation, and the Source of Spiritual Bliss. Radiance itself is his form, Controller of all luminous energies, Embodiment of divine light, and a Compassionate divine being.
    te: ''
  - type: verse
    id: v157
    no: '157'
    hk: |-
      oM sarveza zrIkRSNam zirazA namAmi.
      rukmiNIza zrIkRSNam manasA smarAmi.
      rAdheza zrIkRSNam niratamArAdhayAmi.
      satya zrIkRSNam aharnizam vandyAmi.
      parameza zrIkRSNam nirantaram pazyAmi.
      hRdayasthamama zrIkRSNam sadA dhyAyAmi.
      rAgamaya zrIkRSNam me sarvam samarpayAmi .

      sAyujyada zrIkRSNam mamAtmArpaNam kariSyAmi ..
      zrI kRSNapada dhyAnam - sarvesarvadA - zrIkR sAyujya sAdhanam ..
    en: |-
      Prostrations to Sri Krishna, the divine bestower of prosperity for all, who is the Husband of Rukmini, Lord of Radha, Truth's sovereign, Pure divine being, Embodiment of love, and Liberator of souls.
      Spiritual Surrender: Bowing with complete devotion, Offering entire life's experiences, Meditating on his sacred lotus feet, Seeking eternal liberation.
      Profound Devotional Essence: Continuous remembrance, Day and night glorification, Total spiritual submission, Unconditional love and surrender.
    te: ''
  - type: section
    id: s12
    hk: sarvam zrIkRSNArpaNa prakaraNam
    en: The principle (or teaching) of offering everything to Sri Krishna
  - type: verse
    id: v158
    no: '158'
    hk: |-
      zrI kRSNa preritam zrI kRSNasaGkalpitam zrI kRSNa bhASitam
      zrI kRSNaprasAditam. zrIkRSNa uddizyagAnam, zrIkRSNa upadezitam.
      zrI kRSNa prabhAvapUritam ca zrIkRSNa lIlAvinodaprakAzam.
      sarvasarveza, zrI kRSNamayamidam, zrI kRSNastotra sAhitya lakSmissarvam, mayAsaha, mama, sarvadA, sAyujyadA, mameza, zrIkRSNa caraNa, sarojArpaNam, karomi, kevalam zrIkRSNa kRpAkAraNAt ..
    en: |-
      Salutations to Sri Krishna, who Inspires devotional songs about himself, Blesses the creation of his praise, Fills devotional narratives with divine playfulness, and Grants infinite compassion.
      Spiritual Surrender: Offering entire life's experiences, Merging into his sacred lotus feet, Seeking eternal divine connection, Acknowledging his boundless mercy.
      Profound Devotional Essence: Complete submission, Recognizing divine inspiration, Celebrating his transcendental play, Seeking permanent spiritual union.
    te: ''
  - type: verse
    id: v159
    no: '159'
    hk: |-
      zrIkRSNacaraNam mamazaraNam ca sarvasvam,
      zrI kRSNa padadhyAnam zrI kRSNa nirdezita mamajIvitAlambanam.
      zrI kRSNabharita mama hRdayassarvam sarvadA zrI kRSNAnandamayam.
      zrI kRSNapAdAravindam me zAzvatAnanda nilayam ca mokSakSetram ..
      sadAvande me zrI kRSNam sarvadam zrI kRSNasAyujyadam.
    en: |-
      Salutations to Sri Krishna, the Divine Liberator! His lotus feet are my ultimate refuge. My entire existence belongs to him. His divine meditation guides my life's journey.
      Transcendental Essence: My consciousness is filled with Krishna's bliss. His sacred lotus feet - the eternal liberation's abode. Complete surrender to the supreme divine being!
      Profound Devotional Declaration: Eternal prostrations to the one who grants moksha! Seeking permanent union with divine consciousness, Acknowledging Sri Krishna as the supreme path.
    te: ''
  - type: verse
    id: v160
    no: '160'
    hk: |-
      a) zrIzrI kRSNacaitanyam
      zrI kRSNasAyujyasiddhi
      zrI kRSNasAyijyaprAptiki eDaDugulu
      a - zrI kRSNasAyujyasAdhanAsaGkalpam
      A - zrI kRSNa bhaginizrIdurgAmAtApAdAkrAntam
      i - zrI kRSNa lIlAgAna kIrtanam
      I - zrI kRSNapaJcAyatanapUjA
      u - zrI kRSNa mArgAnusaraNam
      U - zrI kRSNa AtmAnusandhAnam
      R - zrI kRSNAnugrahaprAptidvArA
      zrI kRSNasAyujyasiddhi:

      A) zrI kRSNasAyujvasiddhikarasaptapadi
      zrI kRSNasAyujyasAdhanAsaGkalpam
      mamopAttaduritakSayadvArA, sarvezazrIkRSNa prItyartham
      oM heramba, himajA, himAMzuzekharaziva,
      hiraNyagarbhahiriNmayIzanArAyaNapariveSTita,
      zrI kRSNapaJcAyatanapUjAGkariSye
      zrI kRSNammukhyam pUjayAmi
      zrI kRSNasAyujyArtham, zrI kRSNAnugrahAnusAram
      zrI kRSNAnujjayA.

      i) zrI kRSNabhagini yogamAya zrI durgAmAtApAdAkrAntam
      oM|| vandevizvamAtaram, vizvezvarahRda
      yezvarIm, vizvasundarIMvizAlAkSIm, nande |
      vandevizvazreyadAm, vizvarakSaDAm
      zivAm, zivAnIm, vizAradAm, vande,
      vaiSNavIm, vizvavaradAm !
      vande, vizvarUpa, sAyujyadamamArAdhya zrI kRSNa
      sodarIm, yogamAyAm zrI durgAdevIm, vande,
      vande vidyAdharIm, sarvamaGgaLakarIm, sandhyAde
      vIm, mamasarva rogahariNiJca,
      vande me, yIpsitassarvadAm ..

      I) zrI kRSNa lIlAkIrtanam
      oM harikRSNA . harekRSNA . namokRSNA . namAmi zrI kRSNA .
      zizu kRSNA . mAnasacora kRSNA .. bAlakRSNA . krIDAkRSNA .. nandakRSNA . yazodAnanda kRSNA ..
      muddu kRSNA . mukunda kRSNA .. gopIkRSNA . gopAla kRSNA ..
      kALIyavaradAkRSNA . kAmitArdhada zrIkRSNA .. muraLI kRSA . mugdhamanohara zrIkRSNa ..
      nATya kRSNA . naTvara kRSNA .. naLinI kRSNA . nagadhara kRSNA ..
      vamzIkRSNA . mohana kRSNA .. bRndA kRSNA . rAsalIlA kRSNA ..
      rAga kRSNA . rAdhA kRSNA .. gItA kRSNA . kRSNa sAradhi kRSNA ..
      devakIvasu kRSNA . vizvarUpa zrIkRSNA..
      sadAnanda kRSNA . sASTAGga vandanam zrIkRSNA ..
      sarvezvara zrIkRSNA . sAyujyamimmA zrIkRSNA ..
      harikRSNA . harekRSNA ..
      namo kRSNA . namAmi sadA zrI kRSNA ..

      u) zrI kRSNa paJcAyatanapUjA
      i)tam zrI karam sarvakAryanirvighnakaram
      gaNezaJca gajAnanam | zazivarNam,
      ekadantam herambam, zrI kRSNapriyam,
      prathamam namAmi ..
      ii)zivAMzaktim zrI durgAm zrI devIm
      vidyAdharIm sarvamaGgaLAm |
      -nArAyaNIm nityAnandakarIm
      kRSNAm jagadambAnnamostute||
      iii) razmimantam vivasvantam sahasramsum
      ravim raudrAdityam ca divAkaram .
      savitAruNArogyAdhipam bhAskaram sUryam, tam.
      zrI kRSNa nirdezita gagana vihArim,
      sadAnamAmi zrIrAma bhakta hanumadgurum grahAdhipam .
      sandhyAkAle trimurtisthAvaram gAyatrIdharam, karmasAkSim ca pratyakSadaivatam||
      iv) satidharam phaNidharam zUladharam jaTA jUTa dharam ca gaGgAdharam vizvam bharam .
      zazidharam sampatkaram layakaram zivam vande, sadAzrI kRSNArAdhakam muktidam||
      v) rAdhezAya vizvamaGgaLa viSNurupa darzanapradAya
      zrI lakSmInArAyaNAya sadAbhakta varadAya ca vande, vaTapatrazayana,
      vizvamohana mugdhabAlAya, lIlAvinoda vAsudeva zrIkRSNAya, vizvarupAya, gItAyoga pradAya, sAyUjyadAya namonamaH

      U) zrI kRSNa caitanyam (zrI kRSNa margAnusaraNam)
      i) premayanna zrI kRSNuni pratirUpamu.
      ananta kSamAkaruNAdAnaguNa sammeLanamu.
      premaku paramArthamu andariyandu samabhAvamu.
      sarvamandunna zrI kRSNuni gurtiJci dInula seviJci tariJcuTa.
      pOgadtalanu tanaloni zrI kRSNAMzA sambhUtamaina jIvAtmaku, A zrI kRSNa paramAtma k, agAdhamU sRSTiJce agaDtagA bhAviJci, vinayamuga samhariJcuTa.
      AdhyAtmikamanna, prema pUrita zrI kRSNa bhagavadgItA sUktulananusariJci, svanta prayojanamunAzimpaka, vidhi dharmamulanAcariJcuTa.
      sarvakarmaphalamulanu zrI kRSNArpaNamu gAviJcuTa.
      ii) amRtamu atimathuramanu nAnuDi anRtamani abbura paDunaTlu,
      ananta kRpA kRSNulu, AtmArAmulu, nA antarAtmayai vrAyan,
      AdeziJci, upadeziJci, prasAdiJcina, varasiddhipAyasamI zrI kRSNAnandamayavaijayantamu.
      iii) mathurAdhipatigA thAmaya mathurAti mathurarasa sravantI tIrthamu.
      bRndAvana vihArIsparza dhanyapuNya samIramunAzvAdiJci, pulakiJci, upAsintu niratamu zrI kRSNAnugrahamuna.
      iv) zrI kRSNa sAyujyamu zAzvatamuga labhimpagan.
      uttarAyaNaparalOkapAnthuniki mOkSamu tathyamaTa.
      dakSinAyamuna vaikuNTha ekAdazi nADu mAtrame, viSNupura dvAramu ter2aturaTa.
      sAkSAt sAyujyakara karuNamaya zrI kRSNa paramAtmuni parandhAmamuna dvAramulecaTa? dvArabandhamulEndu? lere dvArapAlakul sarvaloka pAlaka zrI kRSNa sannidhAnamunan
      dakSiNa nAyakuDu, dAkSiNya devuDu,
      dAsarakSakuDu, dazadizalandu dikkaina vADu,
      sadAdayAdRkkulu par2acaga,
      nAkela cinta paralokagatuDaguTakenADainan.
      lIlAkRSNulETulaina, dikkutocani nannutana sannidhikIDpuJcukOnipoyi,
      tama caraNamula cEntaku cera tIrtunani,
      zrI kRSNAnandamaya zAzvata zrI kRSNa sAyujyamitturani dRDhamuga nammitin


      e) zrI kRSNa caraNa vilInam
      (zrI kRSNAnugrahamu dvArA zrI kRSNa sAyujya siddhi)
      sarvezvaruNDu, sarvamandu tAnai, tAne sarvamaguvADu,
      satyadevuDu, sarvajJuDu, sarvakAlamulandu sthiruDu,
      sarvAzritavatsaluDu, smitavadanuDu, sthitaprajJuDu.
      sarvavaraduDu viriJci, hari sAmbazivuluga sRSTi sthiti laya kArakuDu sarvarakSakuDu.
      sarvamicci sAyujyamosagEDi tat sat cit sampUrNAvatAruDu Adi nArAyaNuDu Ananda dhAmuDu.
    en: |-
      A) Salutations to Sri Krishna, the Divine Liberator! His lotus feet are my ultimate refuge. My entire existence belongs to him. His divine meditation guides my life's journey.
      Transcendental Essence: My consciousness is filled with Krishna's bliss. His sacred lotus feet - the eternal liberation's abode. Complete surrender to the supreme divine being!
      Profound Devotional Declaration: Eternal prostrations to the one who grants moksha! Seeking permanent union with divine consciousness, Acknowledging Sri Krishna as the supreme path.
      The divine consciousness of Śrī Śrī Kṛṣṇa, through which seven steps for attaining union (sāyujya) with Śrī Kṛṣṇa are described
      B) Resolution for Union: Through the destruction of my accumulated sins, for the pleasure of the Lord of all, Śrī Kṛṣṇa, Om... O Heramba (Gaṇeśa), O Daughter of the Snow (Pārvatī), O Śiva crowned by the moon, Surrounded by Hiraṇyagarbha (Brahmā), the Golden Lord (Viṣṇu), and Nārāyaṇa, I shall perform the worship of Śrī Kṛṣṇa's five deities (pañcāyatana)."
      I worship Śrī Kṛṣṇa as the primary deity, For the purpose of union with Śrī Kṛṣṇa, In accordance with His grace and by His command.

      C) Invocation to Yogamāyā Durgā:
      Om... I salute the Mother of the Universe,
      The Goddess enshrined in the heart of the Lord of the Universe,
      The universally beautiful one with large eyes, I salute.
      I salute the bestower of universal welfare,
      The protector of the universe, the auspicious one,
      The embodiment of peace, the all-knowing one,
      I salute the Vaiṣṇavī, the granter of universal boons.
      I salute the universal form, bestower of union,
      My worshipped sister of Śrī Kṛṣṇa,
      Yogamāyā Śrī Durgādevī, I salute.
      I salute the bearer of knowledge,
      The cause of all auspiciousness,
      Goddess Sandhyā, remover of all my diseases,
      I salute, the giver of all desires.

      D) Śrī Kṛṣṇa Līlākīrtanam
      Om! Hail Kṛṣṇa! Hail Kṛṣṇa! Salutations to Kṛṣṇa! I bow to Śrī Kṛṣṇa.
      Child Kṛṣṇa, stealer of hearts! Playful Kṛṣṇa!
      Kṛṣṇa of Nanda, delight of Yaśodā!
      Sweet Kṛṣṇa, liberator Mukunda!
      Kṛṣṇa of the gopīs, cowherd Kṛṣṇa!
      Kṛṣṇa who blessed Kāliya, fulfiller of desires!
      Flute-playing Kṛṣṇa, enchantingly beautiful!
      Dancing Kṛṣṇa, supreme dancer!
      Lotus-eyed Kṛṣṇa, bearer of mountains!
      Flute-playing Kṛṣṇa, enchanter!
      Kṛṣṇa of Vṛndā, dancer of the Rāsa!
      Passionate Kṛṣṇa, Rādhā’s Kṛṣṇa!
      Kṛṣṇa of the Gītā, ocean of compassion!
      Kṛṣṇa born of Devakī, universal form!
      Eternally blissful Kṛṣṇa, worshipped with eightfold salutations!
      Lord of all, Śrī Kṛṣṇa, grant us union with You!
      Hail Kṛṣṇa! Hail Kṛṣṇa!
      Salutations to Kṛṣṇa! I forever bow to Śrī Kṛṣṇa."

      E) Five-Deity Worship
      i) Gaṇeśa Invocation:
      I first bow to the auspicious Gaṇeśa,
      Remover of obstacles, elephant-faced,
      Moon-colored, one-tusked Heramba,
      Beloved of Śrī Kṛṣṇa
      ii) Durgā Invocation:
      "I salute Śiva's energy, Śrī Durgā,
      Bearer of knowledge, cause of all auspiciousness,
      Nārāyaṇī, bestower of eternal bliss,
      Kṛṣṇā, Mother of the universe.
      iii) Sūrya (Sun God) Invocation:
      I salute Sūrya, radiant sun,
      Thousand-rayed, fierce Āditya,
      Healer, illuminator, roaming the sky at Śrī Kṛṣṇa's command.
      I eternally salute Hanumān, guru of Rāma's devotees,
      Lord of planets, embodiment of twilight,
      Bearer of Gāyatrī, witness of all actions.
      iv) Śiva Invocation:
      I salute Śiva, bearer of Satī,
      Serpent-bearer, trident-holder,
      Bearer of matted locks and Gaṅgā,
      Supporter of the universe, moon-crowned,
      Bestower of wealth, dissolver of creation,
      Eternal worshipper of Śrī Kṛṣṇa, giver of liberation
      v) Viṣṇu/Kṛṣṇa Invocation:
      I salute the Lord of Rādhā,
      Universal auspicious form of Viṣṇu,
      Bestower of divine vision, Śrī Lakṣmī-Nārāyaṇa,
      Eternal giver of boons to devotees.
      I salute the recliner on the banyan leaf,
      Enchanter of the universe, charming child,
      Divine player Vāsudeva Śrī Kṛṣṇa,
      Universal form, giver of the Gītā's yoga,
      Bestower of union (sāyujya). Salutations!

      F) Path of Krishna Consciousness
      i) Love is the true form of Śrī Kṛṣṇa—
      A convergence of infinite forgiveness, compassion, and generosity.
      The highest truth of love is humility and equanimity.
      Remember Śrī Kṛṣṇa in all things; serve and uplift the humble.
      Realize deeply: the individual soul (jīvātmā) within is a part of Śrī Kṛṣṇa,
      The Supreme Soul (Paramātmā) who creates this unfathomable universe.
      Act with humility.
      Spiritually, filled with love,
      Follow the verses of Śrī Kṛṣṇa's Bhagavad Gītā.
      Perform righteous duties without selfish motives.
      Dedicate all fruits of action to Śrī Kṛṣṇa.
      ii) Self-Contemplation:
      Like mistaking nectar for poison in ignorance,
      The infinitely merciful Kṛṣṇa, the self-rejoicing,
      Enters my inner soul—guiding, instructing, blessing—
      The divine wish-fulfilling tree of bliss.
      iii) Sacred Geography:
      Mathurā, land of the Lord, flows with divine essence.
      In Vṛndāvana, where Kṛṣṇa roams,
      Breathe the blessed, holy breeze—
      Goosebumps arise! Worship constantly by His grace.
      iv) Attaining Eternal Union:
      For union with Śrī Kṛṣṇa:
      In Uttarāyaṇa, liberation (mokṣa) is assured.
      In Dakṣiṇāyana, the eleventh step leads to Vaikuṇṭha.
      Are the doors to Kṛṣṇa's abode open?
      The compassionate Lord, protector of all worlds,
      Is ever-present. Why fear the beyond?
      Playful Kṛṣṇa is everywhere—He drew me near,
      Placed my head at His feet.
      I firmly believe: eternal blissful union with Śrī Kṛṣṇa will be granted!"

      G) Merging with Krishna's Feet
      Merged at the feet of Śrī Kṛṣṇa.
      (Success in union with Śrī Kṛṣṇa is achieved through His grace.)
      He is the Lord of all—everything is Himself.
      The true God, all-knowing, eternally steady,
      Lover of refugees, with a smiling face, steadfast in wisdom.
      Granter of boons, creator-sustainer-dissolver with Brahmā and Śiva,
      Protector of all. Granting union with Himself,
      He is the complete incarnation of Truth-Consciousness-Bliss,
      Primordial Nārāyaṇa, the abode of bliss
