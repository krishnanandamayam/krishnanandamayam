title:
  hk: zrI kRSNAnandamayam
  en: Sri Krishnanandamayam
  author:
    hk: ''
    en: ''
prefaces:
  en:
    title: Preface
    blocks:
      - type: prose
        id: pe01
        text: |-
          While bowing before the ALMIGHTY with folded hands, eyes pouring out tearful tales of
          misconduct life thus far, ripe with arrogance out of ignorance of the speck of the supreme being
          permanently stay-put in my heart, a thought of wailing for redemption has been kindled by the
          ever-Compassionate Divine, with an indicative violent shiver in the spine & thud in the
          chest convulsions on a glorious day recently. HE simply ordained "Don't worry, | just gave you
          the awakening kick. You ($jIvAtma$) are always part of my universal soul.($paramAtma$)
          Wash out your sins by the Jet-spray of my $nAmoccAraNa$ i.e. chanting oul my name of various
          forms in some of the easiest ways(with total faith & dedication). AND LEAVE THE REST TO ME.
          You would be bestowed with the boon of salvation i.e. $mokSam$: You merging back with me as
          always."
      - type: prose
        id: pe02
        text: |-
          Thus began the Divine Dictations that subsequently emerged as the booklet of free verses titled
          "$zrI kRSNAnandamayam$" i.e., full of Heavenly Bliss of the SUPREMELORD $zrI kRSNa$.
          The source, sprit, script and everything connected with anything on this, that and it are the sole
          proprietary of $zrI kRSNa bhagavAn$!!
          "While studying, devotees to loak at the wide spectrum of spontaneous spirituality similar to
          Upanishaths. But not through the vast voids & vortices of $vyAkaraNam$ and waste a lifetime.
          (a) The letter "$ta$" drawn from "$tat$?” is the Piousest - as Ramayana was Started -
          same has become the first letter of our first verse.
          (b) A twenty-four lettered sentence or a line in praise of the Lord is equivalent to "$gAyatrImantra$"
          - Ramayana contains 24 thousand slokas.
          (c) "Sixteen" is great because the Lord in the form of $zrI rAma$ is "$SoDaza guNa sampanna$"
          - embodiment of all the sixteen super virtues; also Lord $zrI kRSNa$ is "$SoDaza kalA zobhita$"-
           essence of the sixteen shines of Divine glitter
          (d) "Eighteen" is great because of "$aSTAdaza purANa$" - Praising of the Lord with stories and
          episodes full of his kindness & Consideration and Pardoning narrated in eighteen classics.
          (e) 108 totaling 9 - $amRta bIja$. When the Pious seeding is done, i.e. when any $mantra$ or
          $bhagavannAma$ is chanted 108 times, it imparts purity, austerity (honesty+ duty+service) leads to
          devotion & dedication thus leading to integration with the SUPREME. $viSNusahasranAma stotram$
           contains 108 synonyms with “$va$” or its derivatives .
      - type: prose
        id: pe03
        text: |-
          $oM hare zrI kRSNAya namaH$
          Also $oM namo nArAyaNAya namaH$ - $aSTAkSarI$ + $bIja akSaram$ like
          $hAm$/$hrIm$ - totaling 9
          Humans breath daily 2000 multiplied by 108 times
          The good old Lord booned the verses mostly with such lettered compositions and in the names
          of various facets of the SUPREME normally worshiped by the devatees
          (a) $zrI kRSNa$
          (b) $zrI rAma$
          (0) $zrI mahAviSNu$
          (d) $sadAziva$
          (8) $gaNeza$
          (f} $hanuma$
          (g) $subrahmaNya$/$ayyappa$
          (h) $gAyatrI$
          (i) $lakSmI$
          (j) $gaurI$
          (k) $sarasvatI$
          (l) $zrI sAyibAbA$
          and/or any form one can concentrate upon unwaveringly.
      - type: prose
        id: pe04
        text: |-
          $zrI kRSNa$: Combination of $kRS$+$Na$ meaning $astitvam$+$Anandam$-origination, meaning
          and purpose of life + Bountiful joy and eternal happiness. The supreme Lord who gives ultimate
          bliss as boon- personification of universal love. He explains the purpose of human life as making
          dedicated efforts to escape from birth-death-rebirth vicious cycle as attainment of saivation. He
          attracts all sins and destroys them; preacher of $karma siddhAnta$ and $yoga vidyA$ etc.
      - type: sloka
        id: pe05
        hk: karmaNyevAdhikAraste mAphaleSu kadAcana .
      - type: prose
        id: pe06
        text: (Quoted from the Bhagavad Gita, Ch:V)
      - type: prose
        id: pe07
        text: |-
          He atones-oh,earthly being! You simply carry out all assigned work & appropriate jobs throughout
          all stages of your life period with total devotion minus self-interest, as a right and rightful way of
          spending life lively but without claiming any right and demand for results and fruits as per your
          wishes and prescriptions because IAM the one that grants the appropriate entitlements. He
          ordained.
      - type: prose
        id: pe08
        text: |-
          Give up "$a$"- $ahaGkAram$ - Arrogance/prejudiced pride
          "$A$"- $Agraham$ - Anger
          then sure you will be granted with
          "$i$" - $ihaloka sukham$ - happiness during earthly life period & Divine blessing
          "$I$" - $IzvarAnugraham$- Blessing for perpetual joy in Heaven.
      - type: prose
        id: pe09
        text: His declaration -
      - type: sloka
        id: pe10
        hk: |-
          durbhikSecAnadAtAram, sumikSecahariNyadam .
          caturoham namasyAmiraNe dhIramRte zucim ..
      - type: prose
        id: pe11
        text: |-
          | salute all the four categories of people- (a) Food donors during calamities (0) Wealth donors
          for charities in normal times (c) Fearless fighters for national protection and orderly rule.
          (d) Piously dead - i.e. people who live as per the dictates of consciousness and so die peacefully.
      - type: prose
        id: pe12
        text: |-
          Emperor Dushyantha could be a lively example in this context. Seeing shakuntala beauty
          and youth personified aptly described as
      - type: sloka
        id: pe13
        hk: |-
          anAghrAtam puSpaGki salayamiva marUnAGkararuhaiH .
          anAviddham ratnam madhunavamanAsvAditarasam ..
      - type: sloka
        id: pe14
        hk: |-
          yamovaivasvato devoyasya sohRdayasthitaH tasyana
          vivAda stho mAgaGgAm mAkuruSvatH .
      - type: prose
        id: pe15
        text: |-
          Unsmelled fresh flower, tender leaf unmarked by human nail, uncut & unpolished raw diamond,
          fresh untasted sweet honey - he got the idea of taking her as his queen and declares clearly "She
          must be the suitable royal consort, otherwise , such a thought never occurs to me, as there could
          never be any diversion from my righteous path of life as conscious is my best guidance."
      - type: sloka
        id: pe16
        hk: |-
          sarvavedeSuyatpuNyam sarvatIrtheSu yatphalam . tatphalam puruSaApnoti . stutvAdevam janArdanam .
          zrI vAsudevanamostute ..
      - type: prose
        id: pe17
        text: |-
          Meaning that he who never differs with the Supreme Lord (called by any name) who is embedded
          in his heart, has no need for a holy dip in the river Ganga charity in Kurukshethra for washing out
          sins as no sins are ever committed!!.
          Two glaring examples for his ocean wide kindness.
          1) Ajaameela, the wicked hunter, when wailing for his beloved son in his last moments “oh $nArAyaNa$ “
          the Lord accounted it as “$bhagavannAmoccAraNa$’” chanting of nis
          name.
          2) A Lady calling her pet parrot always “$rAma, rAma$" was granted $mokSam$.
      - type: prose
        id: pe18
        text: $bhakti$ , i.e. devotion towards the divine has been best explained by the saint AADI SANKARACHARYA
      - type: sloka
        id: pe19
        hk: aGkolam nijabIjasantati rayaskAnto palam sUcikA . sAndhvInaija - vibhuMlatAkSiti ruham sindhussaridvallabham prApnotIti yathA tathApazupate pAdAravinda dvayam . cetovRtti rupetyatiSTati sadAsAbhaktirityucyate
      - type: prose
        id: pe20
        text: |-
          Just as the $aGkolam$ tree attracts back its seeds for sprouting, iron needle towards magnet, a
          wedded woman her spouse, a creeping plantation encircling a tree trunk and river to ocean - the
          devotee getting naturally & permanently attracted and attached towards the lotus feet of the
          LORD SUPREME is known as $bhakti$.
      - type: sloka
        id: pe21
        hk: |-
          anityAni zarIrANi vibhavonaivazAzvataH :
          natyim sannihito viSNuH kartavyodharma saGgrahaH ..
      - type: prose
        id: pe22
        text: |-
          Sahadeva, the youngest pandava atones “These human bodies eventually die, none of the
          wealth is permanent, every moment life gets reduced and nears Lord $viSNu$; as such carryout
          assigned duties honestly and consciously in a detached manner in accordance with the laws of
          the nation submitting everything to him. This is the surest way to reach Him for re-merger."
  te:
    title: ముందుమాట
    blocks:
      - type: prose
        id: pt01
        text: |-
          ## ప్రారంభ విన్నపము

          హే ప్రియభక్తా!

          "శ్రీకృష్ణం వందే జగద్గురుం"

          తేజఃస్వరూపుడైన శ్రీ శ్రీకృష్ణభగవానుడు, గత ఐదు సంవత్సరములుగా, దఫ దఫాలుగా ప్రసాదించిన, స్వేచ్ఛాగాన ధ్యానగీతావళి “శ్రీ శ్రీకృష్ణానందమయము” ను ఇందుతో జత చేయుచున్నాను. దైవాంశ సంభూతులగు మీరున్నూ భగవత్ప్రసాదమును స్వీకరింతురుగాక!

          - విశ్వమంతయు ప్రేమమయము – శ్రీకృష్ణసంభూతము

          - ప్రేమశాశ్వతము – సంతృప్తసహజీవనము దాని తత్వము

          - ప్రేమయే జీవితమునకు ఆధారభూతము

          - ప్రేమమయమైన సంతోషజీవితమునందరును గడుపుదురుగాక!

          - ధ్యాన ధన్యులై మోక్షసాధకులౌదురుగాక!

          తత్సర్వసర్వేశ్వరుడగు శ్రీ శ్రీకృష్ణభగవానుని కరుణాకటాక్షములు అనంతముగా మనందరిపై కురిపించుచునే యుండుగాక అనే ప్రార్థనతో...

          కల్లూరి సూర్యప్రకాశమూర్తి

          శ్రీకృష్ణప్రియమగు శ్రీకర సం॥ర శరదృతు ఆశ్వయుజ శు॥ పంచమీ స్థిరవారమున శ్రీకృష్ణార్పణముగా సమర్పించడమైనది (01-10-2011).
      - type: prose
        id: pt02
        text: '## మంగళ శ్లోకము'
      - type: sloka
        id: pt03
        hk: |-
          oM helAlIlAhAsavilAsa rasalAsya zizum tam .
          hiraNmayI hRdayAravindam harim nArAyaNam .
          veNunAdodbhavA adbhutAnurAga jharI rAdhAbhirAmam .
          hiraNyagarbham zrI kRSNam vande mokSadam vande me mokSadam ..
      - type: prose
        id: pt04
        text: |-
          స్థూలముగా భావము:

          కొంటెగా, నవ్వుతూ, చిలిపి చేష్టలు చేసే చిన్ని పాపడు, శ్రీ మహాలక్ష్మికి హృదయ సరోజమైనవాడు, సర్వదోష హారి, ప్రళయ కాలమున నీరుని నివాసముగా గల శాశ్వతుడు, తన అద్భుతమైన వేణునాదము నుండి జనించిన రాగప్రవాహమైన రాధామనోరంజకుడు, హిరణ్యగర్భుడు (దేవాదిదేవుడు) అగు శ్రీకృష్ణునికి ప్రణామము. వారే సర్వులకు మోక్షమిచ్చువారు. నన్ను ముక్తి పొందునట్లు చేయు ఆరాధ్య దైవములు వీరే. అట్టి ముకుందునికి వందనములు.

          మా పురోహితులు బ్రహ్మశ్రీ కొడమంచి శ్రీనివాస శాస్త్రుల వారి వ్యాఖ్యాన సారాంశము:

          చిన్నివానిగా, లీలగా, అవలీలగా, అమాయకంగా నవ్వుతూ, చిలిపి పనులతో చిదానందం కలిగిస్తూ, అనుగ్రహించి, అన్ని రసాలకు పరమావధి అగు భక్తిరసం రగిల్చి, నా హృదయాన్ని పుటం వేసిన బంగారంలా పవిత్రపరచి, తన పాదాలను ఆ కమలంలో నిలిపి, నాచే ధ్యానింపచేసిన దయామయులు; సర్వపాపములు హరించే స్వామి, ప్రళయాంతమున నీరు నివాసముగా గల చిద్విలాసాల ముద్దుపాపడు, తన అద్భుతమైన మురళీగానమనే జలపాతంలో అన్ని లోకాలను ప్రేమతో నింపు కన్నయ్య, రాధకు మనోరంజకుడైన దేవాదిదేవుడు, మోక్షమిచ్చే శ్రీకృష్ణునికి ప్రణామము. క్షమాసింధువు, సర్వవరదుడై, నన్నీ జన్మాంతమున ముక్తివంతునిగా తన చరణములలో విలీనము చేసుకొనే అనాథనాథుడు, నా ఆరాధ్యదైవము, ముకుందునికి సర్వవేళలా వందనములు.
      - type: prose
        id: pt05
        text: |-
          ## మనవి

          ఓం శ్రీ మహాగణాధిపతయే నమః

          హరే రామ హరే రామ రామ రామ హరే హరే

          హరే కృష్ణ హరే కృష్ణ కృష్ణ కృష్ణ హరే హరే

          వ్రాయించువారు యోగేశ్వర శ్రీరామేశ్వరులట

          త్వయ్ వ్రాయించునవి శ్రీ పదధ్యాన గీతావళియట!

          శ్రేయం వీటి గానం రాధాకృష్ణా కృపాసాధనంట!

          సర్వం ఇయ్యది జీవితమ్ము మోక్ష సాధనమ్మునకట!!
      - type: prose
        id: pt06
        text: |-
          ## తత్సర్వేశ్వర ధ్యానారంభం

          శ్రీ గంగా గౌరీశసుతస్తుతిః
      - type: sloka
        id: pt07
        hk: |-
          oM vighnezvara namastubhyam, subrahmaNyezvarAgraja .
          dhyAnArambham kariSyAmi, siddhirbhavatu me sadA ..
      - type: prose
        id: pt08
        text: 'భావము: తత్సర్వేశ్వరుని అమిత కృపవల్ల మానసికంగా పుణ్య గోదావరీ గంగాస్నానంతో పునీతమై, త్రికరణశుద్ధిగా త్రిలోకాలకు తల్లిదండ్రులైన పార్వతీ పరమేశ్వరులకు వందనమాచరించి, తత్వాచార్యులైన వాసుదేవ శ్రీకృష్ణస్మరణ చేసి, శ్రీపదధ్యానం మొదలెడుతున్నాను. ఓ విఘ్నేశ్వరా! శ్రీ సుబ్రహ్మణ్యేశ్వరునికి అన్నగా, శ్రీ కుమారగురువై, అన్నివేళలా అగ్రపూజలందుకునే దైవమా! నమస్కారం. యీ మోక్షసాధన సంకల్పం సిద్ధించేటట్లు అనుగ్రహించు.'
      - type: prose
        id: pt09
        text: శ్రీ సర్వగురు ప్రస్తుతిః
      - type: sloka
        id: pt10
        hk: oM zrI dattAtreyam, trimUrtyeka rUpam, avadhUtam, anasUyAtri varaputram, zrIpAda zrIvallabham, nRsiMhasarasvatim, vizvavibhum, zrI mANikyaprabhum . akkalkoTa svAminam, zrI SirDI (puTTaparti) sAyIzeti paJcAvatAra dharam, zrI gurudattam, digambaram, zrI dakSiNAmUrtim, viSNusAyUjyadam me, zrI zrIrAmam, kRSNam vande jagadgurum ..
      - type: prose
        id: pt11
        text: 'భావము: త్రిమూర్తుల అంశతో వారి స్వరూపంగా అనసూయా-అత్రుల వరపుత్రుడుగా జన్మించిన మహాయోగి దత్తాత్రేయులు; శ్రీపాద శ్రీవల్లభునిగా, నృసింహసరస్వతిగా, మాణిక్యప్రభుగా, అక్కల్కోట సాధువుగా, శ్రీ షిర్డీ (పుట్టపర్తి) సాయిబాబాగా ఐదు అవతారాలెత్తి జ్ఞానబోధ చేసిన శ్రీ గురుదత్తులు, దక్షిణామూర్తివారు; నాకు విష్ణుసాయుజ్యం ప్రసాదించే ఆరాధ్యదైవం శ్రీరాముడు; లోకాలన్నిటికీ గురువైన శ్రీకృష్ణునికి నమస్కృతులు.'
      - type: prose
        id: pt12
        text: సర్వేశ్వర సంస్తుతిః (మధురసాస్వాదనం)
      - type: sloka
        id: pt13
        hk: oM mAdhavam, madhurAdhipam, madhusUdanam, manoharam, mahAzivArcakamacyuta marcita manantam . dhanvantarim, vizvabhiSak nArAyaNam, mama sarvarogaghnam, mokSadam, kRSNam vande vAsudevam ..
      - type: prose
        id: pt14
        text: |-
          భావము: శ్రీపతి, మధురాధిపతి, మధుసంహారి, భక్తుల మనస్సు సదా హరించి అందు విహరించేవాడు; శ్రీ సాంబసదాశివుని అర్చించే ఆదిదైవం, అచ్యుతుని ఆరాధించే ఆదివైద్యులు అంబికానాథులు; ధన్వంతరి, విశ్వచికిత్సకులు శ్రీమన్నారాయణులు; నా శారీరిక, మానసిక, ఆధ్యాత్మిక, వైరాగ్యవిరుద్ధమైన సర్వరోగములను నశింపచేసి మోక్షమును ప్రసాదించే వాసుదేవ శ్రీకృష్ణ పరమాత్మకు ప్రణామము.

          "కృష్" ధాతువునకు "ణ" కారము కలిసినచో "అస్తిత్వము - ఆనందము" అను అర్థము వచ్చును. లోకములోని సమస్త పాపములను ఆకర్షించి నశింపచేస్తూ, జీవులకు తత్వబోధన ద్వారా భక్తిని కలిగించి, మానవుని అస్తిత్వమునకు అర్థము తెలియపరచి, బ్రహ్మానందమునొసగే ఆనందస్వరూపుడు శ్రీకృష్ణపరబ్రహ్మ. ఇంత అర్థము ఇమిడివున్న "శ్రీకృష్ణ" నామకరణమును గర్గమహర్షి నందనందనునికి చేసెను. పరిపూర్ణావతార పురుషోత్తమునికి, సర్వార్థసిద్ధికరునికి, శ్రీకరునికి, శ్రీప్రదాత శ్రీహరికి, ముద్దుకృష్ణునికి వందనం, అభివందనం.

          ఓం శాంతిః శాంతిః శాంతిః | హరిః ఓమ్ తత్ సత్ | సర్వం శ్రీ రాధాకృష్ణార్పణమస్తు
      - type: prose
        id: pt15
        text: |-
          ## శ్రీ "శ్రీ కృష్ణానందలహరి" – పీఠిక

          దైవ ప్రేరిత మనోభావతరంగాల ప్రతిరూప స్వేచ్ఛాగీతికలు. సకల దేవతల ప్రస్తుతి కలదు. "త" అక్షరము గొప్పది; రామాయణం "తపస్స్వాధ్యాయ నిరతం తపస్వీ..." శ్లోకముతో ప్రారంభం. మన మొదటి గీతిక "త"కారా రంభం, చివరి గీతిక "త"కార సంపూర్తి. గాయత్రీ మంత్రములోని 24 అక్షరములు, రామాయణంలోని 24 వేల శ్లోకముల వలె 24 గీతికలు. మొదటి శ్లోకం "దైవతం"తో, చివరి శ్లోకం "మోక్షదాం"తో పూర్తవుతాయి. దైవధ్యానమునకు పరమావధి మోక్షం కోరటమే కదా!

          ముక్తాయింపుగా 22, 23 శ్లోకములు: మొదటిది శ్రీ విష్ణు అష్టాక్షరీ, శ్రీ శివ పంచాక్షరీ, తారకరామ, శక్తి, లక్ష్మీ బీజాక్షరములతో కూడినది. నాల్గు పాదములు నాల్గు దిక్కుల సూచనగా పాదమునకు 16 అక్షరములతో ఎటు తిరిగినా షోడశకళా ప్రపూర్ణుడైన పురుషోత్తముడే దిక్కని ప్రబోధిస్తున్నట్లు ప్రభవించినది. రెండవది సర్వశ్రేష్ఠమైన శివవిష్ణువుల సంయుక్త రూపమైన సదాశివాత్మలింగమును తులసీ మారేడుదళములతో సహా ఆరాధించటం విష్ణుసాయుజ్యం ఇచ్చేదిగా నిరూపితమైనది. చివరగా అన్ని భేషజాలను విడిచి "నీ పాదాల నాశ్రయించిన నన్ను కాచి రక్షించి మోక్షం ఇమ్మని యాచించటం" ఆత్మార్ఫణం – ఆనందో బ్రహ్మ.

          తేది: 21-01-2007, వ్యయ సం॥ర ప్రథమ మాఘ ఆదివారంనాడు శ్రీ భద్రాద్రి శ్రీరామచంద్రస్వామికి దర్శన, అర్చనా పూర్వకముగా ఈ శ్లోకముల మూలప్రతిని సమర్పించడమైనది.
items:
  - type: verse
    id: v1
    no: '1'
    hk: |-
      tejomayam yajJadAna tapaH karmAntargata rAjitam zrI rAmam.
      sarvezvaram sarvArtha sAdhanArthamarcita macyutam zAzvatam.
      dayAnidhim kaivalyada svayam prakAza mUrtim zubhakaram zivam viSNum.
      yogezvara zrI rAdhAkRSNam, tam sadA namAmi zrI lakSmI nArAyaNa daivatam..
    en: The effulgent Lord Sri Ram, who is present in all sacrifices, austerities, and prescribed duties, the supreme embodiment who is worshipped for every objective, the infallible one, the eternal, one who delivers due to ceaseless mercy, one who appears on his own, the all auspicious Lord Shiva, Lord Vishnu, master of mystic Yoga Sri Radha Krishna, the embodiment of all Sri Lakshmi Narayana; to you I offer my humble obligation again and again.
    te: 'తేజస్సుతో నిండి, యజ్ఞము, దానము, తపస్సు వంటి అన్ని కర్మలయందుండు శ్రీరాముడు, సర్వేశ్వరుడు, అన్ని ప్రయోజనములకై ఆరాధించబడే అనంతుడు, శాశ్వతంగా వుండేవాడు, దయతో మోక్షమిచ్చే స్వయంప్రకాశకుడు, శుభకరుడైన శివ-విష్ణు స్వరూపుడు, విశ్వప్రేమికులైన రాధాకృష్ణులందరి స్వరూపమైన శ్రీ లక్ష్మీనారాయణునికి సదా నమస్కారములు.'
  - type: verse
    id: v2
    no: '2'
    hk: |-
      zrI vighnezvaram sarva vighnaharam kumAragurum ca sumukham phAlacandram.
      smarAmi prathamam surAgra pUjitam gaurIzakumAram siddhArtha gaNezam..
    en: I first remember Lord Vighneswara, who destroys all impediments and obstacles, the spiritual master of Lord Kartikeya, the pleasant-faced one with the crescent moon on his forehead, he who is worshipped first among the demigods, the son of mother Parvati, one who fulfills all desires.
    te: 'అన్ని విఘ్నములను నశింపచేసే, కుమారస్వామికి గురువు, చంద్రుని వంటి ముఖము గల, దేవతలందరి కంటే ముందుగా పూజింపవలసిన పార్వతీతనయుడైన గణేశుని తలచుకుంటున్నాను.'
  - type: verse
    id: v3
    no: '3'
    hk: |-
      praNAmi jagadvIram, vizvaH zreyakArakam, viSNum jiSNum, muktidam advitIyam acyutam, jagannAtha vallabham..
      dhyAyAmi devakIsutam aniruddham Adi daivatam. deva devezvaram zrI harim, AdimadhyAntarasthitam sthiram..
    en: I bow to the valiant Lord of the universe, the benefactor of all creation, the all-pervading Vishnu, the ever-victorious, the giver of liberation, the peerless and infallible Achyuta, the beloved Lord of the cosmos. I meditate upon the son of Devaki, the unhindered one, the primal deity, the supreme God of gods, Sri Hari, who remains steadfast and eternal through the beginning, middle, and end of creation.
    te: |-
      సర్వలోకాల మంచికి కారకుడు, శ్రీ విష్ణువు, మోక్షమునిచ్చే సాటి లేనిదైవం, రక్షకుడైనలోక
      పాలకునికి నమస్కారం దేవకీ కుమారుడు, వ్యతిరేకము లేనివాడు, మొదటి దైవం, దేవుళ్ళందరకూదేవుడు, సృష్టిముందు మధ్యలో చివరకూడా నిశ్చలంగా వుండే శ్రీహరిని ప్రార్థిస్తున్నాను.
  - type: verse
    id: v4
    no: '4'
    hk: |-
      pazyAmi paramezvaram vizvezam virUpAkSam memokSadam. phAlAkSam pazupatim satyam zivam sundaram..
      zambhum vizvambharam sAmbam Izvaram zAntam mahezvaram. vizvam sarvam vizvezvaram zivamayam, sadAvandeham tam vizvanAtham..
    en: I behold the Supreme Lord, the Ruler of the cosmos, the uniquely-eyed Virupaksha, the grantor of my liberation, the one with the third eye, the Lord of all beings, who is Truth, Auspiciousness, and Beauty. I look upon Shambhu, the sustainer of the cosmos, Samba (accompanied by the Divine Mother Amba), the Supreme Ruler Ishwara, the embodiment of peace, the great Maheshwara. The entire universe is pervaded by the Lord of the Universe and is filled with Shiva; unto that Vishwanatha (Lord of the Cosmos), I bow down forever.
    te: |-
      విశ్వమును పాలించే ఈశ్వరుడు, సుందరనేత్రుడు, ముఖమున మూడోకన్నుగల, జీవులందరకు సుఖశాంతులొసగే బాధ్యతాయుత దైవం బాధతో “శంభో” అని ఆక్రోశిస్తే చాలు,ఆదుకునే, అన్నిలోకాలను భరించి, ఐశ్వర్యమునిచ్చే శాంతి స్వరూపుడు, సముడు, శుభుడు, విశ్వమంతా వ్యాపించివున్న మహేశ్వరుని మనోనేత్రంతో దర్శిస్తూ ఎల్లపుడూ
      నమస్కరిస్తుంటాను.
  - type: verse
    id: v5
    no: '5'
    hk: namAminanda kizoram, zrI kRSNam lokarakSakam, gItAcAryam satya priyam ca, nadAzrI zivadhyAna yoginam, zrIzam zrIkaram zreyam zaurim, rukmiNI prANavallabham, ramyam zrIrAdhAmAdhavam, rAsalIlA vinodinam..
    en: I bow to the young son of Nanda, Sri Krishna, the savior and protector of the worlds, the preceptor of the Bhagavad Gita, the lover of Truth, and the supreme Yogi who ever meditates upon Lord Shiva. Salutations to the Lord of Lakshmi, the bestower of all auspiciousness and ultimate welfare, the descendant of Shura (Sauri), the beloved life of Rukmini, the enchantingly beautiful Lord of Radha (Radha-Madhava), who delights in the joyful divine play of the Rasa Leela.
    te: 'నందునిబిడ్డ లోకములను రక్షించే శ్రీ కృష్ణునికి, భగవద్గీతను బోధించి, నిజమునిష్టపడే, ఎపుడూ శివుని తపస్సులో వుండే, అన్ని శుభాల్ని ఇచ్చే రుక్మిణీ భర్త, రాధాదేవితో ఎపుడూ వీడని ప్రేమ స్వరూపి, శృంగారచిలిపి చేష్టల భగవానునికి నమస్కారము.'
  - type: verse
    id: v6
    no: '6'
    hk: rAmam zrIrAmam lokAn ramayantItirAmaH iti sArthaka nAmatAraka rAmam | kaikeyI nandanam kausalyAsutam, vaidehI vallabha dazaratha rAmam . vizvAmitra priyam vaziSTha viziSTa ziSyam ca satyavAkpAlana zobhita eka patnI vratAdi sakala guNAbhirAmam. paramezvara pUjita nadAzivArcanA rAjita saccidAnanda brahmam sarvezvaram zrI rAmam. zaraNA gata rakSaka, bhakta janapoSaka jagadabhirAmam zrI rAmam. jJAna vAziSThArtham ca yoga vAziSTham vizva tejasam zrIrAmam. kAruNyadhAmam kaivalyadam kaLyANa zrI kodaNDarAmam. tam namAmi nirantaram mamArAdhya rAmam manobhirAmam ca hanumatsevita rAmam param jyotiH parandhAmaH zrI zrIrAmam..
    en: I bow to Sri Rama, whose name is truly meaningful as He delights all the worlds, the liberating Taraka Rama; the joy of Kaikeyi, the son of Kausalya, the beloved consort of Vaidehi, and the dear son of Dasharatha. He is dear to Sage Vishwamitra, the distinguished disciple of Sage Vashistha, adorned with the virtue of keeping His truthful word, and enchanting with supreme qualities such as the vow of having only one wife. He is worshiped by the Supreme Lord Shiva and shines through the adoration of Sadashiva; He is the Sachidananda Parabrahma and the Supreme Lord of all. He is the savior of those who surrender to Him, the protector and nurturer of His devotees, and the delight of the entire universe; the true inner essence of Jnana Vashistha, the embodiment of Yoga Vashistha, and the cosmic radiance itself. He is the abode of compassion, the bestower of liberation, and the auspicious Kodanda Rama. I bow incessantly to that Sri Rama-my worshipful Lord, the charmer of my mind, the One served devotedly by Hanuman, the Supreme Light, and the Ultimate Abode.
    te: |-
      అన్నిలోకాలను సంతోషపెట్టే (తనపేరుకు అర్థం నిరూపించే టట్టుగా) కైకేయీ, కౌసల్యాదశరథుల ముద్దు బిడ్డ సీతభర్త విశ్వామిత్రునికి ప్రియమైన, వశిష్టునికి ప్రత్యేకమైన శిష్యుడు ఏకపత్నీవ్రతం, తండ్రి ఆజ్ఞను తలదాల్చేటటువంటి సత్యవాక్పాలనవంటి అనేక గొప్పగుణవ ంతుడు, శివునిపూజిస్తూ, ఎప్పుడూ
      ఈశ్వరని చేత ఆరాధింప బడేవాడు, ఆశ్రయించినవానికిరక్షకుడై, దయతో మోక్షమిచ్చే భక్తులస్సు అన్నీ అమరేటట్టు చూసేవాడు, “జ్ఞానవాశిష్ఠ” మనే విజ్ఞాన వేదానికి అర్థమైన యోగవాశిష్ఠ మనే ముక్తి ప్రదమైన పవిత్రప్రబోధాత్మక వాఙ్మయస్వరూపుడు,
      సర్వలోకాలకు అధిపతి, శుభకారకుడు, ధనుర్ధారి, నా ఇష్టదైవము, ఎపుడూ హనుమంతునిచే, సేవింపబడే, శ్రీ రాముని కెపుడూ నమస్కారము.
  - type: verse
    id: v7
    no: '7'
    hk: |-
      mantram
      hariharaputrAya vidmahe zabaragirivAsAyadhImahi. tanno maNikaNThaH pracodayAt..
      viSNupAdodbhavAyai ca vidmahe zivazaGkara zirasthira nivAsinyaica dhImahi. tanno loka pAvanI gaGgA bhavAnIH pracodayAt..
    en: |-
      Son of Lord Siva and Kesava, residing on the top of Sabarigiri, renowned as Manikantha; to that Ayyappa I offer my obeisances.
      Sprouted from the lotus feet of Sri Mahavishnu, residing on the head of Lord Siva, one who purifies the three worlds - to that Ganga Mata, I offer my obeisances.
    te: 'శివకేశవుల కుమారుడై శబరగిరి మీదని వసించే మణికంఠుని పేరుతో ప్రశస్తికల అయ్యప్పస్వామికి వందనం. శ్రీ మహావిష్ణువు పాదములందు పుట్టి, శివుని శిరస్సునవుండే, అన్నిలోకాలను పవిత్రం చేసేగంగాదేవీ! వందనం.'
  - type: verse
    id: v8
    no: '8'
    hk: |-
      prAtarjapet pitAmaham ca madhyAhne mahezvara rUpiNIm.
      sandhyAkAlevibhum viSNum nityam zrI devIm zrI gAyatrI mAtaram..
    en: In the morning, one should meditate upon Her in the form of Brahma (Pitamaha); at noon, as the embodiment of Lord Shiva (Maheshwara); and in the evening twilight, as the all-pervading Lord Vishnu (Vibhu). Thus, one must daily worship and chant the sacred name of the Divine Mother, Sri Gayatri Devi.
    te: 'ప్రొద్దుట బ్రహ్మ, మధ్యాహ్నం శివుడు, సాయంత్రం విష్ణు రూపంతో, రోజూ గాయత్రీ దేవిని పూజిస్తున్నాను.'
  - type: verse
    id: v9
    no: '9'
    hk: namostu mAtApitarau namostu pratyakSa devau sucarita zobhitau. dhanyosmi zrI janakajananyau, dhanyosmi yuvayoH garbhodbhavam bhAgyam me mokSakArakam..
    en: To my parents, the personification of the divine, who have a spotless character, the glorious personalities, I offer my obeisances to you. It is my great fortune to have been born from your womb, entitling me to liberation.
    te: 'ప్రత్యక్షదైవాలైన తల్లిదండ్రులకు ప్రణామాలు. మీ గర్భమున జన్మించిన భాగ్యము నాకు ముక్తిదాయకము.'
  - type: verse
    id: v10
    no: '10'
    hk: aho! bhagavadanugraham advitIyam adbhutam, ayAcitam anirvacanIyam UhAtItam, karuNApUritam ca vizvarUpam adRzavizAlam Anandamayam
    en: |-
      The mercy of the Supreme Lord has no parallel, is ultimate, does not need to be asked, cannot be described, is unimaginable to the human mind, and gives happiness greater than the entire world.
      (If we live with a proper mindset, the Lord helps and protects; he protects those who take refuge)
    te: 'దేవునిదయ సాటిలేనిది, గొప్పది యాచించ నవసరం లేనిది, వర్ణింపశక్యముకానిది, ఊహింపలేము దయతోనేత్రం కంటేనికాలస్తే ఆనందం ఇస్తుంది (మనం సరైన విధానంలో బ్రతికితే దేవుడు సహాయపడి రక్షిస్తాడు. శరణన్నవారిని ఆదుకుంటాడు.'
  - type: verse
    id: v11
    no: '11'
    hk: duSTazikSaNam, ziSTarakSaNam, zrI kRSNAvatAraramya gamyam. vRSabha, zakaTa, kaMsa, naraka, zizupAlAdyasura saMharaNam. lIlAmAnuSa vigraham, bAlA lIlAvinodinam manoharam. yogavidyA vidhAtAram nRtyagAna rasarAgamayam, bhaje ..
    en: I always remember the personal forms of their Lordships Ganapati, Lord Siva, Lord Brahma, Lord Vishnu, Ayyappa, Subrahmanya/Kumara Swamy, Sai of Shiridi, and Puttaparthi.
    te: 'గణపతి, శివుడు, బ్రహ్మ, విష్ణువు, అయ్యప్ప, సుబ్రహ్మణ్యం కుమార స్వామి షిర్డి, పుటపర్తిలలో వుండే సాయినాధులు వీరందరి స్వరూప దైవాన్ని ఎపుడూస్మరిస్తూంటాను.'
  - type: verse
    id: v12
    no: '12'
    hk: |-
      "zrI hanumantam AJjaneyam dhanyam, sadA zrIrAma nAma dhyAna daivatam.
      zAkinI DhAkinyAdi duSTasUdanam, vande, bhava bhayaroga zokaharam harim .."
    en: I offer my obeisances to Anjaneya, the son of Anjana Devi, who always recited Lord Rama’s name; the one who destroys all ghosts, removes fear from everyone, eradicates diseases, drives out misery, and protects his devotees.
    te: 'అంజనీకుమారుడు, ఎపుడూ రామనామస్మరణ చేస్తూ అన్ని భూతప్రేతపిశాచాలను సంహరించి, సంసారంలోని భయము, అనారోగ్యం, బాధలను తొలగించి, రక్షించే ఆంజనేయ స్వామికి ఎపుడూ నమస్కారం.'
  - type: verse
    id: v13
    no: '13'
    hk: |-
      namAmi zivazivAnI kumAram, zrIvallIzam, tArakAsura sUdanam.
      mamasarvArthadam, surasenAninam, zrI subrahmaNyezvara daivatam..
    en: I offer my obeisances to the son of Shiva and Shivani, the master of Valli, the killer of Tarakasura. The one who gives meaning to my life, the leader of the devatas, Sri Subrahmanyeswara - my respects to you.
    te: 'గౌరీ శంకరుల కొడుకు, శ్రీ వల్లి భర్త, తారకాసురుని సంహరించిన, దేవతల సేనకు నాయకుడు, నాకు అన్నీ ఇచ్చే శ్రీ సుబ్రహ్మణ్య స్వామికేపుడూ నమస్సులు.'
  - type: verse
    id: v14
    no: '14'
    hk: |-
      vandeham zrI veGkaTezam sadA zrInivAnam, Azritavatsalam ca zrIvatsasam.
      kaliyuga pratyakSa daivatam memokSadam zrI sarvezam smarAmitam saptagirivAsinam..
    en: Obeisances to Sri Venkatesa, Sri Srinivasa, the eternal abode of Sri, shelter for refugees, having the Sri Vatsa sign, directly appearing in Kali Yuga, deliverer of liberation, the Supreme Lord - I salute you, the Lord of the Seven Hills.
    te: 'శ్రీనివాసునికి, శ్రీ వేంకటేశునుకి, ఎల్లరి భయాల్ని పోగొట్టి ఆదుకునే కలియుగంలోని ప్రత్యక్ష దైవం అందరికీ రక్షకుడైనవానికి, ఏడుకొండలవానికి వందనం.'
  - type: verse
    id: v15
    no: '15'
    hk: |-
      "bhajeham ramya guNadhAmam maithilI manobhirAmam zrIrAmam. sAketa sArvabhaumam, satya sandham saccidAnandam zivapriyam.
      bhaktAbhISTa varadam abhayadam zrIdharam hanumadIzvaram, kausalyAnanda rAmam kaivalyadam, dAzarathim, zrIraghurAmam.."
    en: All glories to you, Sri Rama, the embodiment of all auspicious qualities, he who attracts the mind of the daughter of the king of Mithila (Sita), the King of Ayodhya who resides in Satchitananda, dear to Lord Siva, bestower of devotees’ desires, bestower of fearlessness in Lord Hanuman, one who gives happiness to Kausalya, one who liberates, the son of Dasaradha - Sri Raghu Rama.
    te: 'మంచిగుణములరాశి, సీతాపతి, అయోధ్యాపాలకుడు కౌసల్యకు సంతోషకారకుడు, దయతో నిండి జీవితంలో అన్ని భయాలు, బాధలు, రోగాలు తొలగించి, అభయమిచ్చే హనుమంతుని ఆరాధ్యదైవం, దశరథకుమారుడైన శ్రీరాముని భజనచేస్తున్నాను.'
  - type: verse
    id: v16
    no: '16'
    hk: |-
      "helA lIlA hAsa vilAsa rasa lAsya zizum tam.
      hiraNmayI hRdayAravindam govindam mukundam..
      harim zrImannArAyaNam zrI mahAviSNum zivantam.
      hiraNyagarbham zrI rAdhAkRSNam, vande mokSadam .."
    en: Having a mischievous smile and playful behavior, the ever-youthful Krishna, who resides in the thoughts of Rukmini Devi, who is the origin of Lord Krishna & Lord Shiva, who is the one who showed his Universal Form, and who is the bestower of liberation - to that Radha Krishna, I bow down.
    te: 'కొంటెగా, నవ్వుతూ, చిలిపి చేష్టలు చేసే చిన్న పాపడు రుక్మిణి మనస్సులో పూవులాపరిమళిస్తూ, విష్ణువు, శివుడు తానే విశ్వరూపం ప్రదర్శించిన, మోక్షమిచ్చే రాధాకృష్ణులకు నమోవాకాలు.'
  - type: verse
    id: v17
    no: '17'
    hk: tejomayIm zrI mahAlakSmIm sarvazubhakAriNIm suzlokAm zrIlam jayAm zrI devIm, aSTaizvarya dAyinIm, vande viSNu vakSaH prakAza razmim, varadAm zrI vaiSNavIm ..
    en: Shining brightly, oh cause for all auspicious deeds, the bestower of all opulence, residing on the chest of Sri Mahavishnu, oh Mahalakshmi, kindly bestow me.
    te: 'వెలుగులప్రోగు, అన్ని మంచికార్యాలకు కారకురాలు, అన్ని ఐశ్వర్యాల నిచ్చే, శ్రీ మహా విష్ణువుహృదయంపై ప్రకాశించే శ్రీ మహాలక్ష్మి, నన్ను బ్రోచి రక్షింపు తల్లీ !'
  - type: verse
    id: v18
    no: '18'
    hk: |-
      "zrI rAmAvatAra rahasyam sarve sarvaloka raJjanam.
      zrI kRSNa bhagavadgItA sandezam ca yoga vidhita karmAcaraNam..
      tatsarvam zrI rAmakRSNa bodhanAmRta vedAnta sAram vande vivekagurum devI prasanna zrI mAtuH zAradA nAtham.."
    en: |-
      Pleasing the inhabitants of all the planets when you descend as Lord Rama, you are the accomplisher of all tasks oh selfless personality!
      Lord Sri Krishna taught the Bhagavad Gita as a manual for all ascetics.
      All these are covered in the teachings of Sri Ramakrishna Paramahamsa, the spiritual master of Sri Vivekananda, who could envision the Goddess Sarada Devi; I offer my obeisances to him.
    te: 'అన్నిలోకాలను సంతోషపెట్టడం రామావతారంలోని నిగూఢ నిజం, తనకు విధించిన పనులను స్థిరమైన, స్వార్ధరహితమైన మనస్సుతో, తపస్సులా ఆచరించమనే యోగబోధ భగవద్గీత శ్రీకృష్ణుని ఉపదేశం. ఇవన్నీ శ్రీ రామకృష్ణ పరమహంస బోధించిన వేదాంతంలో వున్నాయి. అటువంటి వివేకానంద స్వామి గురువు శారదామాతభర్తకు, దేవిని ప్రత్యక్షం చేసుకున్న వానికి వందనం.'
  - type: verse
    id: v19
    no: '19'
    hk: |-
      vande vindhya girivAsinIm vizvambharIm sAvitrIm zrI durgAm sarasvatIm zAmbhavIm.
      vizvajananIm vaiSNavIm, paramezvarIm, saccidAnanda brAhmIm hariNIm haindavIm ..
    en: Oh resident of the Vindhayachala Mountains, maintainer of the Universe, the combined form of Savitri, Durga, and Saraswati, mother of the Universe, teacher of Brahma Gnyana that good thoughts are the source of happiness; to you, I offer my obeisances.
    te: 'వింధ్య పర్వతములలో నివసించే, విశ్వమును భరించే సావిత్రీ దుర్గా సరస్వతుల ఏకరూపం, లోకాలకు తల్లి మంచి ఆలోచనే ఆనందకరమని బ్రహ్మజ్ఞానం బోధించే తల్లీ, నమస్కారం.'
  - type: verse
    id: v20
    no: '20'
    hk: |-
      "zailajA zvedabindujanita vRkSAgra rAjitam,
      zyAmalAsRjitAtmahRdaya saundarya zrI sumam..
      zAradAnAtha hari hara svarUpa tridaLapatram,
      samarpayAmi tat bilvam, sadAzivaprItyartham, nityam.."
    en: To she who resides on the leaf of the tree born from a bead of sweat of Parvathi, to the beautiful-hearted flower created by Goddess Lakshmi, to the bundle of three leaves created in the image of Lord Brahma and Lord Vishnu, and to please Lord Shiva - I offer my obeisances in the form of a bael leaf cluster.
    te: 'పార్వతీ దేవి చెమట బిందువునుంచిపుట్టిన చెట్టు అంచునవెలిగే, లక్ష్మీ దేవిచే సృష్టింపబడ్డ ఆత్మ సౌందర్యపూవు బ్రహ్మా, విష్ణుమహేశ్వరుల రూపాలతోవుండే మూడు ఆకులగుత్తి, మారేడు దళాన్ని ఎపుడూ శివునికి ఇష్టం కల్గించడానికి సమర్పిస్తున్నాను.'
  - type: verse
    id: v21
    no: '21'
    hk: |-
      "vande vighnanAzaka, sarvasiddhi dAyaka zrI vighnezvara sahodarIm vizvezvarIm vizAlAkSIm pArvatI paramezvara priyaputrIm.
      sarvAbhISTa varapradAyinIm aSTaizvarya dAyinIm, zrI santoSi mAtaram . dehime, akhaNDa saubhAgyam prazAnta jIvanam ca prasIda. hevizvapriyA .."
    en: Oh sister of the Supreme Lord and the master of the Universe, the beloved of Lord Shiva, bestower of the eight great boons, oh Santoshi Mata, please protect me, and please bestow me with the boon of ‘Swargam’.
    te: 'అన్ని అడ్డంకుల్నీ తొలగించి, కోరికల్ని తీర్చే విఘ్నేశ్వరుని చెల్లెలు, ప్రపంచానికి అధిపతి భరించేది శివపార్వతుల ముద్దులపట్టి, అన్నివరాల్ని ప్రసాదించి, ఎనిమిది ఐశ్వర్యాలనూ ఇచ్చే సంతోషిమాతా రక్షించి, నాకు జీవితాంతం పసుపుకుంకుమలు బాధలేని సంతృప్తి నిండిన జీవితం ఇయ్యు - నమస్కారం.'
  - type: verse
    id: v22
    no: '22'
    hk: |-
      oM. sarasijanAbham sarojahastam zrI zrIrAmam. mandasmitavadanam maGgaLezam zrIrAdhAkRSNam.
      oM namonArAyaNAya oM namazzivAya ceti. dhyAyAmi niratam, tam, zivam, hrIm zrIm viSNum mokSadam..
    en: Oh incarnation of the lotus-navel Lord, oh sweet-smiled master of Rukmini Devi, oh embodiment of love - Sri Radhakrishna, he who bestows liberation to those who chant the panchakshari mantram of Siva and the ashtakshari mantram of Goddess Shakti; to that Srimannarayana, I offer my obeisances.
    te: 'నాభినుండి తామరతాడు, పూవుకల విష్ణువు అవతారం, కమలము వంటి మృదువైన చేతులు గల శ్రీరాముడు, చిరునవ్వుముఖంతో, రుక్మిణీ పతి, ప్రేమ స్వరూపుడైన శ్రీరాధాకృష్ణులు, అష్టాక్షరీ, శివపంచాక్షరీ మంత్రములతో ఎపుడూ శివుని, శక్తిని లక్ష్మిని మోక్షమిచ్చే శ్రీ మన్నారాయణుని, ధ్యానిస్తుంటాను.'
  - type: verse
    id: v23
    no: '23'
    hk: zatakoTi nArikeLa phalAntargata divya zvetakAnti tejasam zambhum . zatasahasrakoTi kSIrasAgara sadRza prakAzazobhitam zaGkaram.. ananta koTi tArAzazi tejo rAzinam sAmbam, tulasI bilvasahitam. tam ArAdhayAmi hariharasvarUpa sadAzivAtmaliGgam me viSNusAyujyadam..
    en: Oh lord who is shining like millions of white coconut kernels, with the effulgence of billions of milk oceans, brighter than trillions of stars and the moon, the combined form of Lord Shiva and Krishna, and which has the power to liberate - to such an Atmalingam, I offer my obeisances.
    te: 'నూరుకోట్ల కొబ్బరి కాయల లోన వుండే పవిత్రమైన తెల్లని కాంతి వలె, నూరు వేలకోట్ల పాలసముద్రపు వెలుగులా, అంతులేని కోట్లనక్షత్ర, చంద్రుల కాంతి సమూహం, శివవిష్ణువులు కల్సిన ఏకైక రూపమైన శివుని ఆత్మలింగాన్ని (మోక్షాన్నిచ్చే, విష్ణులోకాన్నిచ్చే) ఎపుడూ ధ్యానిస్తూన్నాను.'
  - type: verse
    id: v24
    no: '24'
    hk: |-
      tejasvinIm tanmayIm, lakSmIm, hariNIm nArAyaNim vibhUtim, ramAm kSIrajAm,
      tejazrIm svaprakAza rUpiNIm, vande hiraNmayIm zriyAm, zivAm ca mokSadAm ..
    en: She who emerged from the milk ocean, with a shining effulgence, adores Lord Vishnu as her husband, and is the bestower of all opulence and liberation - I meditate upon you.
    te: 'నూరుకోట్ల కొబ్బరి కాయల లోన వుండే పవిత్రమైన తెల్లని కాంతి వలె, నూరు వేలకోట్ల పాలసముద్రపు వెలుగులా, అంతులేని కోట్లనక్షత్ర, చంద్రుల కాంతి సమూహం, శివవిష్ణువులు కల్సిన ఏకైక రూపమైన శివుని ఆత్మలింగాన్ని (మోక్షాన్నిచ్చే, విష్ణులోకాన్నిచ్చే) ఎపుడూ ధ్యానిస్తుంటాను. '
  - type: verse
    id: v25
    no: '25'
    title: sarvArtha sUkSma zlokam
    hk: |-
      oM namo nArAyaNAya oM namazzivAyaca zrIrAma zrI rAdhAkRSNeti .
      dhyAyAmi zrI karam zambhum tatsAmbazivAtmaliGgam vizvezam viSNu sAyujyadam me ..
    en: Chanting the Vishnu Ashtakshari, Shiva Panchakshari, all the names of Lord Sri Rama and Radha Krishna, and all the auspicious names of Lord Shiva - I bow down before all of you. I meditate on the bestower of liberation, Lord Vishnu - may I remember him always!
    te: 'విష్ణు అష్టాక్షరీ, శివపంచాక్షరీ నామాలతో శ్రీరాముని, రాధాకృష్ణులను, అన్ని శుభాలనిచ్చే శివుని ఆత్మలింగం - అన్ని రూపాలతో మోక్షమిచ్చే భగవంతుని ధ్యానిస్తున్నాను ఎల్లప్పుడు తరించెదగాక!'
  - type: section
    id: s01
    hk: |-
      zrI zrIvanalaharI hAram
      sarva saGkaTahAra zrI rAdhAkRSNASTapadi
    en: 'Sri Sri Vanavihari Haram (The Garland of the Divine Forest Wanderer) - The Sri Radha-Krishna Ashtapadi that dispels all afflictions and difficulties.'
  - type: verse
    id: v26
    no: '26'
    hk: mugdhamanoharamUrtim, muraLInAda lInam. vizvarUpadhAraNam, vizvamohana vigraham. sadAhasita vadanam, veNugopAla zrIkRSNam rAdhAmAdhavam, namAmi nityam, viSNusAyujyadam.
    en: He who has the most captivating cupid-like form, blending with the sound of the divine flute, the embodiment of all the worlds, bewildering the fourteen canonical planets through his beauty, he who has a sweet smile and a loving face, who always has Radha by his side, and the bestower of liberation and permanent residence in the topmost echelon of Vishnu Loka; to that Venu Gopala Krishna, I offer my humble obeisances.
    te: 'ముచ్చట గొలిపే రూపం వేణు ధ్వనిలో కలిసివుంటూ, అన్నిలోకాలనుతనలో నిలుపుకునే, చతుర్దశ భువనాలను మైమరపించే ఆకృతి, చిరునవ్వు చెక్కు చెదరని మొగము, రాధాదేవితో ఎల్లవుడూ కలసివుంటూ, విష్ణులోకంలో జన్మాంతమున శాశ్వతనివాసమనే మోక్షమును ప్రసాదించే, శ్రీ వేణుగోపాల కృష్ణునికి, నిత్యమూ నమస్కరిస్తున్నాను.'
  - type: verse
    id: v27
    no: '27'
    hk: |-
      zaraNAgatavatsalam zyamantaka grahItAram; zvetavAhana sArathim. sarva maGgaLakaram, uddAlakAkrUrakucelAdibhaktavaradam.
      satyasvarUpam, pArijAtApahAriNam, satsaGkalpa siddhidam, namAmi. sAmavedapriyam, sAndIpanI ziSyam, zrI balarAmAnujam, zrI kRSNam..
    en: To He who shows mercy to his refuge-seekers, accepter of the Samantaka Mani and Satyabhama, charioteer of Arjuna, all-auspicious, most merciful, non-envious, bestower of millions of devotees like Kuchela, the absolute truth, one who bought the nigh-flowering jasmine plant to the Earth, bestower of all initiatives with good intention, lover of Sama Veda recitation, the disciple of Sandipani Muni, and the brother of Lord Balarama - oh Sri Krishna! My respects to you.
    te: 'నీ వేదికైని వైరుక్కినవానిని ఆదరించేవాడు, శ్యమంతకమణిని సత్రాజిత్, కుమార్తె సత్యభామతోపాటు సమర్పించగా, స్వీకరించినవాడు, అర్జునుని రథసారథి, అన్ని శుభములకు కారకుడు, ఉద్దాలకుడు, అక్రూరుడు, కుచేలుడు వంటి కోటానుకోట్ల భక్తులను ఆదరించినవాడు, తన రూపే నిజము యొక్క ఆకారముగల దైవం, దేవలోకంనుంచి పారిజాతపు పువ్వును తెచ్చినవాడు (భూలోకంలోని భక్తులకు యీ పవిత్ర పుష్పమును అందుబాటులోనికి తెచ్చినవాడని భావము) మంచి ఉద్దేశ్యంతో ప్రారంభించిన అన్ని పనులను అనుగ్రహించేవాడు, సామవేదగానం ఇష్టపడేవాడు, సాందీపనీ మహర్షి శిష్యుడై (ఎంత వాడైనా చివరకు భగవంతుడైనా సరే, భూలోకంలో జన్మించినందున గురువుకు శుశ్రూష చేసి, వారిద్వారా విద్యను పొందాలనే విధిని ఆచరించి చూపించిన) బలరాముని తమ్ముడైన శ్రీ కృష్ణునుకి వందనం.'
  - type: verse
    id: v28
    no: '28'
    hk: 'karmAcaraNabodhitam vidhitakarmAcaraNa Adarza puruSam. sadAzivapUjitam, tapasvinam, tapassva rUpam, tapamAtreNa prasannam. tapAntam, tapAntargatam, tapaH prayojanam ca, paramArtham, zrI harim. tApatrayaharam, tattvAcAryam, praNamAmi, tam, tANDava zrI kRSNam..'
    en: To the one who taught the importance of following one’s prescribed duty and who carried out his duty perfectly, worshipped by Lord Sadasiva, the embodiment of austerity, one who can be obtained only via unalloyed devotion, Supreme Objective, oh Sri Hari, remover of unhealthy desires, teacher of the Vedic essences, I offer my respectful obeisances, Sri Krishna!
    te: 'ప్రతీ మానవుడు, జన్మరీత్యా శాస్త్రరీత్యా, సాంఘికరీత్యా తనకు విధించబడిన అన్ని పనులనూ చేసి తీరాలని, బాధ్యతను ఎగగొట్టేందుకు కుహనావైరాగ్యం, మెట్టవేదాంతం చెప్పేవాళ్ళను వెయిట్టినట్లుగా, తనతనకర్మలన్నీ ఆచరించి, ఆదర్శంగానిలచినవాడు, ఎల్లప్పుడూ శివుడు పూజించే, తనరూపమే తపస్సు అయినా, స్వయంగా తపస్సుచేసే కేవలం తపస్సు ద్వారా (ధ్యానరూపమైన భక్తిమార్గం ద్వారా) మాత్రమే అనుగ్రహించే, తపస్సుకు తుది తానే, నిబిడీకృతమైన దీతనే, తపస్సు ఉద్దేశ్యము, ఫలితము కూడా శ్రీ మహావిష్ణువే తానై, భక్తులవ్యధను పారద్రోలే, భగవద్గీత ద్వారా జీవితంలో ఆచరించవలసిన కర్మలు, జీవితాంతములో విచారించవలసిన (ఆలోచించ వలసిన) వేదాంతం బోధించిన నృత్యము చేసే శ్రీ కృష్ణునికి నమస్సులు.'
  - type: verse
    id: v29
    no: '29'
    hk: duSTazikSaNam, ziSTarakSaNam, zrI kRSNAvatAraramya gamyam. vRSabha, zakaTa, kaMsa, naraka, zizupAlAdyasura saMharaNam. lIlAmAnuSa vigraham, bAlA lIlAvinodinam manoharam. yogavidyA vidhAtAram nRtyagAna rasarAgamayam, bhaje ..
    en: Annihilator of miscreants, protector of devotees, and the upholder of all the good in the world! You have vanquished villains such as Dhenuka, Sakata, Kamsa, Narakasura, and Sisupala. You have given immense happiness to your devotees through your mischievous deeds as a child during your earthly avatar. You have created Yoga vidya and performed Rasa Lilas; I worship you, beloved Sri Krishna.
    te: 'చెడును, చెడ్డవారిని దండించి, మంచిని, మంచి వారిని ఆదరించి, రక్షించడమే, శ్రీ కృష్ణావతారము యొక్క గొప్ప ఆనందకరమైన, అందమైన పద్ధతి. ధేనుకాసురుడు కంసుడు నరకుడు, శిశుపాలుడు వంటి అనేకలోకకంఠకులైన దుర్మార్గులను సంహరించిన, తన బాల్యచేష్టలతో, ఎన్నో లీలలతో, ఆటపాటలతో, ఆనందిస్తూ ఎల్లరనూ సంతోషపరచేవాడు, యోగవిద్యను సృష్టించి, రాసలీలను ఇష్టపడే, ప్రేమ స్వరూపుడైన శ్రీ కృష్ణునికి భజన చేయుచున్నాను.'
  - type: verse
    id: v30
    no: '30'
    hk: naLinInAtham, navInItacoram nIlatejam, nIrajAkSam yazodAnanda, devakIvasudeva sutam, gopAlam, gokSIrapriyam . gopIvastrApahara, kALIyamardana, govardhanoddhArakam . kurukSetre, arjunamArgadarzinam. zrI kRSNam, vandeham jagadgurum..
    en: Oh, husband of the goddess of fortune, pilferer of butter, he who is effulgent through the hue of a rain-filled cloud, lotus-eyed Lord, son of Yashoda, son of Vasudeva & Devaki, oh Cowherd, lover of cow milk, stealer of the Gopis’ dresses, dancer on the hood of Kaliya, he who lifted Govardhana Giri, he who showed the path of Dharma to Arjuna during the Kurukshetra war; to that Sri Krishna, the universal teacher, I offer my humble obeisances.
    te: 'లక్ష్మి (రుక్మిణి) భర్త, వెన్న దొంగ నీలవర్ణంతో ప్రకాశించేవాడు, పద్మం (తామర పువ్వు) వంటి అందమైన కన్నులుగలవాడు, యశోదానందులకు, దేవకీవసుదేవులకు పుత్రుడు, గోవులను కాచి, ఆవుపాలను ప్రీతిగా త్రాగేవాడు, గోపికల వస్త్రములను ఎత్తుకు పోయిన వాడు (కాత్యాయనీదేవికి 40 రోజులు దీక్షతో పూజచేసి, ఉద్యాపనచేయకుండా, సిగ్గు లేకుండా బట్టలు గట్టుపై వదిలేసి, నలుగురుసంచరించే ప్రదేశంలోని యమునానది ఘాట్ లో స్నానం చేస్తున్న బాధ్యతారహిత ప్రవర్తనను వారికే తెలియ చెప్పాలని బాలగోపాలుడుచేసిన చిన్న చమత్కారం) కాళియుడనే దుష్ట సర్పమును త్రొక్కితల పై నర్తించి, గర్వభంగము చేసి, వాని విషజ్వాలలవల్ల చెడిపోయిన సరస్సు (నుంచి పారద్రోలి), శుద్ధిచేసిన తదుపరి శుభ్రమైన ఆ నీటి మడుగునీళ్ళు అందరికీ త్రాగుటకు అందచేసిన వాడు గోవర్ధన గిరి పర్వతమును గొడుగులా పైకెత్తి ఇంద్రుని శిలావర్షం నుంచి గోపాలురను రక్షించిన, కురుక్షేత్రంలో యుద్ధం చేసి, బంధువులను సంహరించి, రాజ్యము సంపాదించనని మోహంలో పడిన అర్జునునికి కర్మసిద్ధాంతము, దైవత్వం వేదాంతం భగవద్గీతగా బోధించి, కర్తవ్యోన్ముఖుని చేసినలోక గురువు శ్రీ కృష్ణునికి నమస్కారము.'
  - type: verse
    id: v31
    no: '31'
    hk: kRRra strIpUtana prANaharam, harivaMzAcAradharma prakAram. mAyAmohita, gopastrIsaha bRndAvanarAsa keLIvirAjinam. aSTadevI vallabham, vipra, gopa, gopikA gogaNarakSakam . vande, zrIharam, iLA patim, zrI kRSNam mamaviSNu sAyujyadam ..
    en: Annihilator of the cruel Putana, uplifter of Dharma as per the lineage of Hari, performer of rasa lilas in Brindavanam with his gopikas, master of eight queens, protector of Brahmanas, cowherds, and cows, I offer obeisances to you Oh Hari, husband of Prithvi, bestower of liberation in Vaikuntha!
    te: 'తనను చంపాలనే దుష్టాలోచనతో వచ్చిన పూతనను, “స్త్రీ” అని ఆలోచించకుండా ప్రాణాలు తియ్యటం శ్రీ హరివంశంలోవున్న ఆచార ప్రకారమే (విష్ణువు ముందు అవతారమైన శ్రీరాముడు తాటకిని చంపడం, తర్వాతే శ్రీ కృష్ణావతారంలో పూతనవధకదా!) నీ మాయవల్ల మోహితులైన గోపస్త్రీలతో సహా బృందావనంలో రాసకేళి జరిపి ప్రకాశించావు. ఎనిమిది మంది పట్టమహిషుల నాధుడవు, బ్రహ్మ జ్ఞానసంపన్నులకు, గోపాలురకు, గోపికలకు, ఆవులమందలకు రక్షకుడవు. ఓ శ్రీ మహావిష్ణూ ! భూపతీ ! శ్రీకృష్ణా ! నాకు విష్ణులోక శాశ్వతనివాసమనే ముక్తినిచ్చే నీకు నమస్కారం.'
  - type: verse
    id: v32
    no: '32'
    hk: |-
      rAjasUyAdhvarya pramukham, agre yudhiSThara pUjitam.
      draupadImAnarakSakam, virAT rUpapradarzinam.
      codyadautya zrI kRSNam, bhUbhArahara bhArataraNa sUtradhAriNam.
      pANDu vaMzavaradam, vande zrI kRSNam, mamakaivalyadam..
    en: The chief of the Rajasuya Yagna performed by Dharmaraja, the receiver of Agra Puja, protector of Draupadi from humiliation and loss of dignity, he who shows the universal form, mediator of peace, he who tactfully instigated the Mahabharata war to reduce the Earth’s burden, protector of the Pandavas; oh Sri Krishna! My obeisances to you, provider of liberation to his refugees.
    te: 'ధర్మరాజు చేసిన రాజసూయ యాగమునకు ప్రధాన కారకుడు అందరిలోకి ముఖ్యుడు, మొదటి పూజ అందుకున్న ద్రౌపదిమానమును వస్త్రాపహరణం జరక్కుండా రక్షించిన విశ్వరూపము ప్రదర్శించిన, విచిత్రమైన రాయబారంనెరపి, భూమి బరువుతగ్గించే మహా భారత యుద్ధముకు కారకుడు, పాండువంశము అంతమైపోకుండా, చక్రం అడ్డుపెట్టి అశ్వత్థామ బ్రహ్మశిరోనామకదివ్యాస్త్రంనుండి పరీక్షిత్తును రక్షించిన, నాకు ముక్తిప్రసాదించే శ్రీ కృష్ణునికి నమస్సులు'
  - type: verse
    id: v33
    no: '33'
    hk: sarvam zrI kRSNam, sarve sarvadA zrI kRSNam, sarve zaMzrIkRSNam, sarva sarvezam zrI kRSNam sRSTi ssarvam natyam, zrI kRSNamayam, herAdhAkRSNa . tvamevamamazaraNam ..
    en: Everything is Sri Krishna, Sri Krishna is everywhere; Sri Krishna is the Lord of all, he is the Lord of Lords, and the entire creation is filled with Sri Krishna. Oh, Radha & Krishna! You are my only refuge.
    te: 'అంతా శ్రీ కృష్ణుడే అంతటా శ్రీ కృష్ణుడే, అందరకూ ప్రభువు శ్రీ కృష్ణుడే అందరి ప్రభువులకూ ప్రభువు శ్రీ కృష్ణుడే మొత్తం సృష్టి అంతా శ్రీ కృష్ణునితో నిండివున్నదన్నది నిజం. ఓ రాధా కృష్ణులారా ! మీరే నాకు దిక్కు.'
  - type: verse
    id: v34
    no: '34'
    title: sASTAGgam
    hk: 'ArtatrAya parAyaNam, nArAyaNam; vaikuNThAdhipam, paramAtmAnam, zrI harim zaGkha cakrazAraGga sarojahastam, viSNum vaijayantI zobhita zrI kaNTham . dazAvatAra dharam dazadizAdIpti karam, dayALum, puruSottamam : zivam, vizvezam vizvagurum zrIrAmam, namAmi tatsarvezam, zrI kRSNam me mokSadam ..'
    en: Refuge of the distressed, oh Narayana, master of Vaikuntha, Paramatma, Sri Hari, he who is decked with a conch shell, a disc, a mace, and a lotus in your hands, he whose neck is decorated with the Vaijayanthi Mala, origin of the avatars, protector of devotees, oh merciful personality, supreme person, best among men, equal to all, auspicious for the world, master of the universe, oh Rama, all obeisances unto you and Sri Krishna, bestower of liberation.
    te: 'ఆక్రోశించిన వారిని ఆదుకునే, శ్రీ మన్నారాయణుడు, వైకుంఠానికి పాలకుడు, పరమాత్ముడు, శ్రీ మహావిష్ణువు, శంఖం, చక్రం, గద తామరపూవుచేతుల ధరించిన, పదిదిక్కులను ప్రకాశింపచేసే, దశావతారాలు ధరించి బాధితులను ఆదుకున్న దయామయుడు, పురుషులలో శ్రేష్ఠుడు, అందరినీ సమానంగా చూస్తూ, ఐశ్వర్యముల నిచ్చే విశ్వానికి ప్రభువైన శివుడు, లోకాలన్నిటికి గురువైన శ్రీరాముడు ఇలా అనేక రూపాలలో ఆరాధింపబడే, అన్నిలోకాలకు పరిపాలకుడైన నాకు మోక్షమిచ్చే శ్రీ కృష్ణునికి ప్రణామము.'
  - type: verse
    id: v35
    no: '35'
    title: AtmArpaNam
    hk: 'pAhimAm, pAhimAm, pApanAzaka pAhimAm, rakSamAm, rakSamAm, zrI rAdhAkRSNa rakSamAm . nAstitvam vinA mamagatiH varade. zaraNAgata vatsala dehime, abhayam aparAdhakSamam, ante viSNu sAyujyam, zAzvata zrI hari caraNasAnnidhyam.'
    en: Rescue me, destroyer of sins! Protect me, oh Radha Krishna! I have no other refuge than you, oh bestower! Oh merciful refuge, please assure me, forgive my offenses, bless me to obtain an eternal place at the lotus feet of Lord Sri Hari at the end of this mortal life.
    te: 'ఆదుకో నన్నాదుకో, పాపాలు నశింపచేసేవాడా! నన్ను కాపాడు, కాపాడు ఓ రాధా కృష్ణ దైవమా! నువ్వుతప్ప నాకేవేరే దిక్కులేదు ఆశ్రయించినవార్ని కాపాడేవాడా నాకు భయంపోగొట్టు, అన్ని తప్పులను క్షమించు ఈ జీవితంపూర్తయ్యాక ముక్తి ఇయ్యు! శాశ్వతంగా శ్రీ మహావిష్ణువు పాదముల దగ్గర వుండేలా అనుగ్రహించు!'
  - type: section
    id: s02
    hk: zrI zivapaJcakam
    en: 'The sacred five-verse hymn in praise of Lord Shiva'
  - type: verse
    id: v36
    no: '36'
    title: zrI “zivapaJcakam”
    hk: |-
      vizvamayam, vizvajanakam, vizvezam vizvanAtham.
      vizvezvaram, virUpAkSam vizvazAnti karam . 
      vizvarUpam zrI vizvambharam . 
      vande, sadAzivam, sAmbam, zambhum, Izvaram, zaGkaram..
    en: ''
    te: 'లోకములన్నిట వ్యాపించిన తండ్రి, ఈశ్వరుడు పాలకుడు, రక్షకుడు, ముక్కంటి, శాంతి కారకుడు, భరించే వాడైన సర్వేశ్వరునికిపెప్పుడూ నమస్కారం.'
  - type: verse
    id: v37
    no: '37'
    hk: |-
      himagirivAsinam, prathama gaNAdhipam . 
      zAnta svarUpam, namo vedassarvAntargatam . 
      viSNuvallabham pArvatI prANanAtham, mokSakaram. 
      vande sadAzivam pArvatIprANanAtham, sAmbam, zambhum, Izvaram zaGkaram..
    en: A resident of the Himalayas, foremost among the Devatas, peaceful personality, he who is present in the essence of the Vedas, master of Lord Vishnu, husband of Sri Parvati, bestower of liberation, obeisances to you oh Sadasiva, Shambhu, master - oh Sankara!
    te: ''
  - type: verse
    id: v38
    no: '38'
    hk: 'zvetam himAlayaH zvetam, zirasthitazcandra nandiH zvetammAmAGkita vizvamAtaH divyam. zvetamanantam phAlAkSammama kaivalyadam. vande, sadAzivam, sAmbara, zambhum Izvaram, zaGkaram..'
    en: A resident of Kailasa, brilliant white-hued one, he who holds the moon on his hair bun, on whose side is the mother of the Universe, luminous with a bright universal glow, he with the third eye, bestower of liberation - oh Lord Siva! My obeisances to you.
    te: ''
  - type: verse
    id: v39
    no: '39'
    hk: yo(ve)gezvarapura chAyAso 'mezvaram govUru' (kOvvUru) umAcoDezvaram zrI rAmezvaram, muktezvaram, kAzIkSetrezvaram, zrIkALahastIzvaram zrI rAjarAjezvaram drAkSArAmezvaram ' pazupatezvaram zrI kALezvaram, kedArezvaram, zrI vaTTi nakSIrArAmezvaram, dvAdaza liGgezvaram, koTiliGgezvaram, kaliyuga kailAsa gokarNezvaram, vande sadAzivam, sAmbam, zambhum Izvaram, zaGkaram..
    en: Present in the temple of Vegeswarapuram (Yogeswarapuram) as Chaya Someswara, as Uma Chodeswara in Kovvuru, as Mukteswara in Rameswaram, master of Kasi Kshetram, Lord of Kalahasti, Raja Rajeswara, Draksha Rameswara, Pasupati, Sri Kaleswara, Kedareswara, Dwadasa Lingeswara, Koti Lingeswara - my obeisances to you, Sada Siva, Sambhu Eeswara, oh Sankara!
    te: ''
  - type: verse
    id: v40
    no: '40'
    hk: nIla grIvam, nIlalo hitam, naLinI vUjitam, pUjayAmi, tulasI, bilva gaGgAjala sahitam. nAgabhUSaNam naTarAjam, nAthamanAtham, zaGkhanA dapriyam. nAgezvaram gaurI mahezvaram kailAsezvarammamamo kSadam, hariharaika rUpazivAtmaliGgam, vande, sadAzivam, sAmbam, zambhum, Izvaram zaGkaram .. zivAyanamaH oM zivAyanamaH zivAyanamaH onnamazzivAyanamaH . harAya namaH oM harAya namaH harAya namaH oM namazzivAyanamaH ..
    en: Oh Lord with the deep blue neck, he who radiates a bluish effulgence, worshipped by Lakshmi Devi, I worship you with Tulasi, bael leaves, and Ganga water. Bedecked with snakes, oh Nataraja, my master, lover of the sound of a conch shell, lord of the Nagas, Gowri Maheswara, master of Kailasa, and he who takes form as a Siva Linga - I offer my obeisances to you.
    te: ''
  - type: verse
    id: v41
    no: '41'
    title: AtmArpaNam
    hk: "zrIkaram, zubhakaram, zreyadam, zivam, jagadIzvaram . tArakArAmamantrasRjita, tapasvinam, . trilocanam. trivikramam, tripurAntakam, namojaga nAthapUjitam. vande, sadAzivam sAmbam, zambhum, Izvaram, zaGkaram.. pAhimAm, paramezvara| rakSamAm bhaktavarada| sAmbasadAzivazambho zaGkara zaraNam me tava caraNa yugam. 'zambho, zaGkara sAmbasadAziva tavacaraNa -yugam mama zaraNam zivoham, zivoham, zivoham, zivoham. haroham, haroham, haroham, haroham... ahambrahma, ahaMviSNuH ahande vomahe zvaraH ahaGkAra rahita maham, pazyAmi sAkSAt parabrahmam, mamahRdayAntargata rAjitam. tvamevAham, tvamevAham, tvamevA hanna saMzayaH sarvajJo bhagavada nujJayA .."
    en: Bestower of wealth, the auspicious one, master of the universe, he who always recites the Taraka Rama namam, ever-meditating three-eyed one, one whose three strides covered the universe, he who destroyed the three cities of the Asuras with a single arrow, he who is worshipped by Jagannadha, respects to you - oh Sada Siva, Sambhu, Eeswara, and Sankara!
    te: ''
  - type: verse
    id: v42
    no: '42'
    title: maGgaLAzAsanam
    hk: 'zrI rAma devAya, zivazaGkarAya, bhakta varadA yamaGgaLam. zrI rukmiNI prANanAdhAya, zrI rAdhAkRSNa prabhave, maGgaLam jayamaGgaLam sarvamaGgaLam nitya zubhamaGgaLam ..'
    en: Lord Sri Rama, Lord Siva, bestower of boons to devotees, he who is the beloved of Sri Rukmini, Sri Radha Krishna, all auspiciousness unto you in all its several forms!
    te: ''
  - type: verse
    id: v43
    no: '43'
    hk: zrI sarasvatIstutiH zrI sarasvatI SoDazAkSara svarNamAlA oM vAgdevIm varadAyinIm vidyA pradAyinIm vidyAm vraNAmi vANIm vINApANIJcajJAna sarasvatIm. zAradAMvi zAradAm vandevarademokSArthInamme rakSa bhAratI . bAsara vAsinI . bhaktavatsalA;
    en: Sri Saraswati Devi, represented by sixteen syllables, goddess of learning, bestower, and personification of knowledge. She with a sweet voice, an expert in all fields, and she who takes up all of our burdens from her abode in Basara, who blesses all who pray to her - my obeisances!
    te: ''
  - type: verse
    id: v44
    no: '44'
    hk: zrI zAradA caturvigazcAkSara saroja hAram . vAgdevIm vara dAyinIm vidyA pradAyinIm vArA hIm vidyAm viriJci priyAm, vANIm vINApANim cavimalAm, sarvaloka pUjitAm zrI jJAnasarasvatIm. zAradAm vizAradAm vanuthAMvande, varade vidyAjJAnamokSArthinam me.. rakSa bhAratI. bAsaravAsinI. zrI pradA, zrI zivAnu DA.. AzritavatsalA..
    en: Sri Saraswati Devi, who is embodied in the 24-syllable mantra whose 4 lines are reminiscent of a lotus garland and whose several epithets are like a fresh scent in the wind, the goddess of all education, I humbly request you to bless me with the eight great fortunes, and salvation through learning. Oh, companion of Maha Siva! You never fail to provide refuge to your devotees.
    te: ''
  - type: verse
    id: v45
    no: '45'
    title: zrI gaurIstotram (sarvamaGgaLAzrayam)
    hk: 'oM vandeham vizvezvarIm praNA vAtmikAm, himabAlA annapUrNAJca zAmbhavIm. AdizaktIm jagajjananIm sumukhaSaNmukha. yormAtara mIzvarIm hrIm zrIm.. zrI gaurIm zauri nRhodarIm zarvANIm, zivAnIm mahAkALIm sarvamaGgaLAm . pAhimAm . varamezvarI. varedezubhapradA. vedamAtA. dehime viSNusAyujyam..'
    en: To she who blesses all the worlds with prosperity, who represents the primordial sound of Om, the daughter of Himavant, the giver of nourishment, the better half of Sambhu, the source of all energy in the Universe, the mother of all worlds, the matriarch of Subrahmanya and Ganesh, she who is represented in the sacred seed syllables, sister of Sri Maha Vishnu, she who has taken various avatars including Sri Maha Kali, whose mere name causes good fortune, who always saves her devotees from all the evil in the world, I humbly request your blessing which shall grant me salvation.
    te: ''
  - type: verse
    id: v46
    no: '46'
    title: zrI subrahmaNma zaraNyam
    hk: |-
      subrahmaNyam subrahmaNyam zivatejam subrahmaNyam, 
      subrahmaNyam subrahmaNyam zrI vallIzam subrahmaNyam . 
      subrahmaNyam subrahmaNyam zivazivAnI sutam subrahmaNyam . 
      subrahmaNyam subrahmaNyam SaNmukhasvAmika subrahmaNyam . 
      subrahmaNyam subrahmaNyam surasenAnim subrahmaNyam .
      subrahmaNyam subrahmaNyam tArAkAsuravAram subrahmaNyam . 
      subrahmaNyam subrahmaNyam devasenApatim subrahmaNyam .
      subrahmaNyam subrahmaNyam zrI svAminAtham subrahmaNyam . 
      subrahmaNyam subrahmaNyam zaravaNa zaravaNa subrahmaNyam . 
      subrahmaNyam subrahmaNyam zaraNam manazaraNam subrahmaNyam . 
      subrahmaNyam subrahmaNyam bhavabhaya rogazokavaram subrahmaNyam . 
      subrahmaNyam subrahmaNyam mamArAdhya daivam subrahmaNyam . 
      subrahmaNyam subrahmaNyam varadam me abhayadam subrahmaNyam..
      subrahmaNyam subrahmaNyam subrahmaNyam zUlapANinim subrahmaNyam .
      subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam .
      subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam ..
      (sarvam zrI subrahmaNezvarArpaNamastu)..
    en: I seek refuge under Lord Subrahmanya; who is known by various names - with the effulgence of Lord Siva, six-headed one, leader of the Ganas, killer of Tarakasura, husband of Devasena, and destroyer of fear, disease, and distress - I bow down to you, trident holder.
    te: ''
  - type: verse
    id: v47
    no: '47'
    title: sarvam sarvezvaram
    hk: 'oM teja zrIzam zrIvArim prema svarUpam, karuNAmayam ca bhaktavatsalam. tejorAzinam mohanavaMzI gAna priyam, (golokavAsinam Izvaram). vande zrI rAdhAkRSNam mama mokSadam..'
    en: Oh effulgent Lord, master of fortune, embodiment of love, merciful Lord, affectionate to his devotees, full of luminescence, expert flutist, resident of Goloka, obeisances to you Sri Radha Krishna, deliverer of salvation!
    te: ''
  - type: verse
    id: v48
    no: '48'
    hk: |-
      vedam zrI kRSNam vedArtham zrIkRSNam 
      vedAntam zrIkRSNam vedAntargata daivam ca zrIkRSNam . 
      nAdam zrIkRSNam oM kAra nAdam zrI kRSNam 
      veNunAdam zrI kRSNam pAJcajanya gItAnAdam zrI kRSNam. 
      dhyAnam zrI kRSNam yAgayogam zrI kRSNam 
      vinodam zrIkRSNam bhavabhaya bheda chedanam zrI kRSNam. 
      vandeham tam zrI kRSNam muktidam 
      dhanyam zrI kRSNa dhyAnajIvanam 
      prAptiH tathyam zrI kRSNaparamapadam..
    en: The essence of the Vedas, their meaning, their goal, and their embodiment are all Sri Krishna. He is represented in the sound of Om, the melody of his flute, and the rumble of the Panchajanya conch shell. Meditation, sacrifice, and penance all lead to Sri Krishna. I offer obeisances to you Sri Krishna, destroyer of fear and bestower of liberation. He who meditates upon Sri Krishna is sure to get eternal salvation.
    te: ''
  - type: verse
    id: v49
    no: '49'
    hk: |-
      pallavi : 
      rAjazekhara rAjazekhara rAjazekhara pAhimAm 
      rAjazekhara rAjazekhara rAjazekhara rakSamAm 
      candrazekhara candrazekhara candrazekhara pAhimAm 
      induzekhara induzekhara induzekhara rakSamAm 
      zazizekhara zazizekhara zazizekhara rakSamAm 
      rAjazekhara rAjazekhara rAjazekhara pAhimAm 
      rAjazekhara rAjazekhara rAjazekhara rakSamAm..
    en: Oh, Eternal Emperor - protect me! Oh, Moon-holder, save me! Moonlike luminescent one, guide me!
    te: ''
  - type: verse
    id: v50
    no: '50'
    title: advaitAbhivAdamu
    hk: |-
      zaraNam zrI satyanArAyaNam kAruNyadhAmam ramAkAntam triguNAtItam. 
      ArtatrANa parAyaNam annavaravAsinam sadAzivam mama kaivalyadam..
    en: I seek refuge under Sri Satyanarayana, the embodiment of mercy, husband of Ramadevi, he who is above the three gunas - sattva (goodness/calmness/harmoniousness), rajas (passion/activity/movement), and tamas (ignorance/inertia/laziness), he who gives refuge to the distressed, resident of Annavaram, and the auspicious bestower of liberation.
    te: ''
  - type: verse
    id: v51
    no: '51'
    hk: |-
      namo simhAcalavAsinam, svayambhuvam varAhalakSmI nRhiMhasvAminam . 
      zrI mahAviSNoH tRtIyAvatAram zrIcandana lepita zivaliGgAkAram .
      ApadbAndhavam abhayadam ananta AdinArAyaNam ca karuNAsAndram.
      darzana mAtreNa anirvacanIyAnandapradam bhaktavazam memokSadam..
    en: Obeisances unto you, resident of Simhachalam, self-manifest, Varaha Laksmi Narasimha Swamy, the third incarnation of Maha Vishnu, covered with sandalwood paste as a Sivalingam. Refuge of the distressed, limitless, oh merciful one! One who gives immense happiness just by his darshanam, resident of his devotees’ hearts, bestower of the liberation of mine.
    te: ''
  - type: verse
    id: v52
    no: '52'
    title: vairAgyaphalam
    hk: |-
      bhAgyam bhogam bhAram moham kSetram grAsam vAsam simhAsanam. 
      vilAsam bhAmAkalApam satIsantAna sukhalAlasam. 
      dehAbhimAnam bandhuprItiH bAdhAkaram, kIrti kAGkSaH bahujanmakArakam. 
      bhavabandham muktiprati bandhakam ca kSudram hRdaya daurbalyam etat sarvam vyarthavyAsaGgam . 

      zrI kRSNadhyAnam taruNopAyam. kurubhaktijJAna yogAbhyAsam. tathyam zAzvata vaikuNThavAsam..
    en: 'A reflection on the results of renunciation: Desire for wealth, luck, opulence, affection, a resting place, and even salvation is ultimately futile. Only remembering Sri Krishna is the ultimate escape from the 4 ashramas of one’s life. Engage in devotion and service to attain residence in Vaikuntha.'
    te: ''
  - type: verse
    id: v53
    no: '53'
    title: jaya maGgaLabharatavAkyam
    hk: '(anni zubhamulu kalagAlani civaragA yI {kriMdi} vidhamugA prArthiddAmu)'
    en: 'Victory and auspicious utterance of Bharat: Let us finally pray in this manner so that all auspiciousness may prevail.'
    te: ''
  - type: verse
    id: v54
    no: '54'
    hk: mAtR vakSojAMsukakarSaNodyatakaraH kRSNaHsapuSNAtunaH..
    en: May the tiny cute palm that pulled Mother Yashoda for food, give protection to the entire universe. Hare Krishna!
    te: '"అమ్మా ఆకలేస్తోంది" అని తల్లిపైట కొంగు లాగడానికి ఎత్తిన శ్రీకృష్ణుని చిన్నారి చెయ్యి విశ్వమునకు అభయహస్తమై సదా రక్షించుగాక!'
  - type: verse
    id: v55
    no: '55'
    hk: oM.. zrImaGgaLagirIzam, yAdagirinAthamantarvedyadhi nAtham, yoganRsiMham, sadAsarvarogamnam. vandeham, bhaktavaradam, zivam, mahAyogapradam, tam, nAra siMham advitIyadaivatam mokSadam ..
    en: Oh resident of Mangala Giri, Yadagiri, Lord of Antarvedi - Yoga Narasimha, destroyer of all malaises! Obeisances to him who is the bestower of devotees, all-auspicious giver of great fortune, he who has no equal, giver of liberation!
    te: ''
  - type: verse
    id: v56
    no: '56'
    hk: oM - vande viSNum sadAzivam, varadam, tatsarvezam, zrIrAmam zrI kRSNam, mokSadam.. (varAliccikaruNiJce zrI mahAviSNuvuku, samabhAvanto cUstU sarva zubhAlanu prasAdiJce sAmbana dAzivuniki, sarvezvaruDaina zrI rAmuniki, mokSapradAta zrI kRSNa vara brahmaku vandanamu. nanu brovagarAvA. karuNAmayazrIrAmA........ tElisItEliyaka ne cesina kAryamulu duSTamEnta yogAnirAmA.... bhavabandhamunaDuma kuDiEDamala iDumalinni yArAmA... karmaphalita manubhaviJcaka tIradEva rikainani pEdavi virutulindarilalo zrI rAmA.... nanuvyadhalanuJci vidhividhitamu nuJci tappimpagala vibhulEvvaru nIvugAka rAmA .... dehabAdha, jADyapubAdha, vyayame vyadhagA rAmA nI bhakti pEnnidhidariceraga nIyadu dayadalacumA rAmA.... kAruNyadhAmuDavu kalalo yIbAdhala kaDatercaga dayacUpavayAjayarAmA.... jaya jaya rAmA.... bhavAnIzaGkara priyuDavu bhakti bhAvana varamunu rayamuganIyavE rAmA.... rAmA... parandhAmA, puruSottama paramezvara zrI rAmA
    en: Obeisances to you Lord Vishnu, the Sadasiva, bestower, master of all. Obeisances to Him who is present in the incarnations of Sri Rama and Sri Krishna!
    te: ''
  - type: verse
    id: v57
    no: '57'
    hk: rAdhe govinda kRSNa| rAdhe gopAla kRSNa| nandamukunda kRSNa| navanItacora kRSNa| pAhi mukunda kRSNa| pAhi murAri kRSNa||
    en: Beloved of Radha, pilferer of butter, rescue us! What does scarcity mean to he who worships you? What is fear to your devotees? May my last days go smoothly without ailments, always engaged in your worship, and may I reach your lotus feet at the end. Please show me the divine path, oh Srimathi Radhe.
    te: ''
  - type: verse
    id: v58
    no: '58'
    title: vizvamohananamohakam
    hk: 'vizvam vizvezam vizvavyAptam vizvasRjitam zAntidam . vizvezvaram vizvanAtham vizvapatim vizvagurum . vizvarUpam virUpAkSam vizvambharam vizvavaradam. vande vizvamohanam vaMzI kRSNam viSNusAyujyadamme..'
    en: Oh master of the Universe, all-pervading Vishnu, bestower of peace, controller of the universe, teacher of the worlds, universal form, omnipresent one, bestower of devotees - my obeisances to you! Let everything be offered to Sri Radha Krishna.
    te: ''
  - type: verse
    id: v59
    no: '59'
    hk: oM. rAdhAgopAlaMrAgamohanaMrAsalIlArAji taMrAgamayam vairAgyapradam yogezvaram Izva rArcitam paramazivabhaktAgresaram zrIzam zaraNam mamavaradam zrI kRSNaMvande mokSadam..
    en: He who protects all of us together with Radha and the cows, the embodiment of love who shines in the Rasa dance that enchants people with the music of his flute, the Lord of yoga who bestows detachment, worshipped by Shiva, the foremost among the devotees of Supreme Shiva, the husband of Lakshmi - seeking refuge in him who protects me, I offer my obeisances to Sri Krishna, the giver of liberation.
    te: 'రాధను, గోవుల సహితంగా మనందరినీ పాలించేవాడు, వేణుగానంతో ముగ్ధులను చేయు రాసలీలతో రాజిల్లే ప్రేమ మూర్తి, వైరాగ్యమునొసగెడి యోగే శ్వరుడు, శివునిచే పూజింపబడే, పరమశివుని భక్తులలో మొదటివాడు, లక్ష్మీపతి,నన్ను రక్షించే వానిని శరణువేడుకుంటూ, మోక్షమిచ్చే శ్రీకృష్ణునికి నమస్కరిస్తున్నాను.'
  - type: verse
    id: v60
    no: '60'
    hk: nirmala hRdayam sumanoharam sarojasadRza saugandhim pUjya gaGgA godAvarItoya tulyapavitram vaiSNavam zaGkara priyam zrIzrInivAsam. Anandamayam zrIkaram sadAzrI bhagavannAmagAnayAga puNyakArakam. taddhAraNa dhanyamanujam yoga vidyArdhinam zrI kRSNa bhaktam namAmyaham ..
    en: A pure heart delights the mind. It is like the fragrance of the lotus. It is as sacred as the revered waters of the Ganga and the Godavari. It is the very support that Vishnu worships, dear to Shiva, the abode of Goddess Lakshmi, and always full of joy. It bestows prosperity and, through the sacrifice of singing the Lord's names always, brings merit. To such a blessed person, who has a pure mind and is a yogi and seeker, a devotee of Sri Krishna, I always offer my obeisances.
    te: 'నిర్మలమైన హృదయము మనస్సును ఆహ్లాదపరస్తుంది. తామరపూవుసువాస నవంటిది. పూజ్యమైన గంగా, గోదావరీ తీర్థము (నీరు) వలె పవిత్రమైనది. అదే విష్ణువు నారాధించే ఆధారము శివునికి ఇష్టము, లక్ష్మీదేవి నివాసము, సంతోషం తోనిండివుంటుంది. ఐశ్వర్యము నిచ్చేది,ఎపుడూ దేవుని నామగానం అనే యజ్ఞము చేస్తూ పుణ్యము కలిగించేది, అటువంటి పవిత్రమైన మనస్సుకల్గిన మానవుడు,ధన్యుడు, యోగిసాధ కుడు అయిన శ్రీ కృష్ణ భక్తునికి ఎపుడూ నమస్కరిస్తూంటాను.'
  - type: verse
    id: v61
    no: '61'
    hk: vizAla vizvam viSNu mayam sadAzivam rAsalIlA lAsyarAganilayam . vizvezasRjitam virATsvarUpam maGgaLArAmam sarvam zrI kRSNahAsam..
    en: "This endless universe is filled with Vishnu and is always in balance. It is full of the nine rasas and various arts, with dance, song, play and music. Brahma's creation is part of the universal form of Sri Krishna, and all living beings rejoice, experiencing all auspiciousness: everywhere there are only the sparkling smiles of Sri Krishna."
    te: 'యీ అనంతమైన జగత్తు విష్ణువుతో నిండి ఎపుడూ సమతుల్యం. నవరసాలు కూడిన వివిధ కళలతో, నృత్యం, గానం ఆటపాటలతో నిండివుంటుంది. బ్రహ్మసృష్టి శ్రీ కృష్ణ విశ్వరూపంలో అంతర్భాగం, అన్ని శుభములు అనుభవిస్తూ జీవకోటి ఆనందిస్తుంటారు: మొత్తం అంతటా శ్రీ కృష్ణుని చిరునవ్వుల చిందులే.'
  - type: verse
    id: v62
    no: '62'
    hk: 'paGkham laGghanti vArI zaJca zambhuJjayanti naraikavijayaH daitya deha zalkam bhavati (viSNu) zaGkham pAJcajanyam citram zrI kRSNa cidvilAsam (sadA) dayAmayam..'
    en: A monkey leaped across the endless ocean with ease. Arjuna, a mere human, conquered Mahadeva. The conch named Panchajanya, made from part of the body of a demon, shines in the hand of Lord Vishnu. Aha! How wonderful is the divine play of Sri Krishna! It is always full of compassion, is it not!
    te: 'ఒక కోతి అంతులేని సముద్రాన్ని అవలీలగా గెంతేసింది. కేవలం మనుష్యుడైన అర్జునుడు మహాదేవుణ్ణి జయించాడు. ఒక రాక్షసుని శరీరంలోని భాగమైన పాంచజన్యం అనేపేరుగల శంఖం, విష్ణుమూర్తి చేతిలో చేరి ప్రకాశిస్తూంది. ఆహా! శ్రీ కృష్ణ చిదిల్వానం ఎంతచిత్రం! ఎప్పుడూ దయతోనిండి వుంటుంది కదా!'
  - type: verse
    id: v63
    no: '63'
    hk: uDupi nAtham upendrAnujam udyAnavihAriNam hiraNmayIzaMhira Nyagarbham bhaktavazyaMsadAzivam vAsudevaMvande zrI kRSNamme mokSadam..
    en: The child Gopala of Udupi Tirtha, younger brother of Indra, who roams in the forest of Brindavan, husband of Sri Lakshmi Devi, God of gods, who is won over only by devotion, who protects and guards everyone equally, son of Vasudeva - always my salutations to Sri Krishna, who gives me liberation.
    te: 'ఉడుపి తీర్థంలోని బాల గోపాలుడు, ఇంద్రునికి తమ్ముడు, బృందా వనములోవిహరించేవాడు, శ్రీ లక్ష్మీ దేవి భర్త, దేవాది దేవుడు, భక్తితో మాత్రమే, వశమయ్యేవాడు, అందరనీ సమానంగా కాచి రక్షించేవాడు, వసుదేవుని తనయుడు, నాకు మోక్షమిచ్చే శ్రీకృష్ణునికి ఎప్పుడూ వందనములు.'
  - type: verse
    id: v64
    no: '64'
    hk: vande gaurI zaGkara kumAram tArakavAram devasenAniJca SaSThIzam. narvadaMzrI vallIzam (viSNuputrIzam) ripughnumme sarvarogaghnam zrI subrahmaNyasvAminam..
    en: Son of Parvati and Parameshwara, slayer of Tarakasura, commander of the army of the gods, husband of Goddess Shashthi and of Sri Valli, the daughter of Sri Mahavishnu, destroyer of my enemies and of all diseases - salutations to Sri Subrahmanya Swami.
    te: 'పార్వతీపరమేశ్వరుల కుమారుడు, తారకాసురుని సంహరించిన వాడు, దేవతల సేనానాయకుడు, షష్ఠీ దేవికి, శ్రీ మహావిష్ణువు కూతురైన శ్రీ వల్లికి భర్త, నా శత్రువులను, సమస్తరోగములను నశింపజేసే, శ్రీసుబ్రహ్మణ్య స్వామికి నమోవాకములు'
  - type: verse
    id: v65
    no: '65'
    hk: dagdham tIti sarvaduggAni dahantItimugdha mohinI vyAmoha tRSNam. siddhyam tIti zAzvata zrI viSNu sAyujyam pathamekam zrI kRSNapada dhyAnam ..
    en: It burns away all sufferings; it reduces to ashes the habit of behaving improperly out of excessive desire when a beautiful woman comes into sight; it grants eternal union with Vishnu. The one very easy method that provides all of these is to meditate on Sri Krishna with devotion.
    te: 'అన్ని బాధల్నీ కాల్చిపారేస్తుంది, అందమైన అతివ కంటబడగానే విపరీతమైన కోరికతో అనుచితంగా ప్రవర్తించే తీరును, నుసిచేస్తుంది, శాశ్వతమైన విష్ణు సాయుజ్యాన్ని ప్రసాదిస్తుంది. వీటన్నిటినీ సమకూర్చే చాలా సులభమైన ఒకే ఒక పద్ధతి శ్రీ కృష్ణుని భక్తితో ధ్యానించడమే॥'
  - type: verse
    id: v66
    no: '66'
    hk: sarvadhAriyaina cakradhAriyaina velpANiyaina kodaNDapANi yainan . sarvamamarci mukti niccugA bhagavadbhaktuniki sadvartanukin ..
    en: A perfect, skillful, compassionate, and righteous path. By completely surrendering oneself, one can attain the supreme devotion to Bhagavan.
    te: ''
  - type: verse
    id: v67
    no: '67'
    title: gurvAzIrvAkyam
    hk: 'oM. gAyatrI mantratulyam caturviGg zcAkSara bhagavatprasAdita vAGmayam . tat vedavedAnta zAstrasaGgItAdi kaLAsAhitya narvannabhavati . bhagavannAmasaGkIrtanasamam, tasmAt sarvaprayatnena zrIzrI kRSNa . dhyAna yogAbhyAsI bhava, premamayIbhava, mokSagAmI bhava, siddhirbhava.. sarvam zrI rAdhAkRSNArpaNamastu..'
    en: "It is equal to the twenty-four-letter Gayatri mantra: the hymns and literature bestowed by God. Whatever the Veda, Purana, Itihasa, Stotra or Kalpa, all the 'authors' who claim to have written them are merely 'scribes', who only write down what God, in his grace, has placed in their minds; they are not the owners. Whatever Veda, Vedanta, scripture, music, art or literature one studies and practices, it bears less fruit than singing the various names of God. That is, reciting the Ashtottara and Sahasranama stotras of the Lord is best. In this modern age, no rules are necessary. Therefore, let us try in every way and keep meditating on Sri Krishna! May we be filled with love! May we travel on the path of liberation - may we attain liberation!"
    te: 'ఇరువది నాల్గు అక్షరాల తో కూడిన గాయత్రీమంత్రంతో సరితూగేది, భగవంతుడు ప్రసాదించిన స్తోత్రములు వగైరా సాహిత్యము. ఏ వేదమైనా, పురాణం, ఇతిహాసం, స్తోత్రం కల్పం - ఇవన్నీ వ్రాసేమని చెప్పుకునే “ రచయిత” లందరూ కేవలం “ లేఖకులు” భగవంతుడు అనుగ్రహించి, వీరి మనస్సులో ప్రవేశ పెట్టిన వాటిని లిఖించే వారు మాత్రమే కాని స్వంతదారులు కాదు. ఏవేదం, వేదాంతం, శాస్త్రం, సంగీతం, కళ, సాహిత్యం, అభ్యసించి, ఉపాసించినా భగవంతుని వివిధ నామాలు గానం చెయ్యటంకన్న తక్కువ ఫలవంతం.అంటే, భగవంతుని అష్టోత్తర, సహస్రనామస్తోత్రాలు పఠించటమే ఉత్తమం. యీ ఆధునికయుగంలో, ఏ నియమాలు అవసరంలేదు. అందువల్ల అన్నివిధాలా ప్రయత్నించి, శ్రీకృష్ణ ధ్యానం చేస్తూందుముగాక! ప్రేమతో నిండి వుందుము గాక! మోక్షమార్గములో ప్రయాణింస్తూందాము-ముక్తి కలుగుగాక!'
  - type: verse
    id: v68
    no: '68'
    title: zrI rAdhAkRSNa pAdAkrAntam
    hk: 'oM.. uDupInAtham upendrAnujam, udyAna vihAriNam, hiraNma yIzam. hiraNyagarbham,bhakta vazyam, sadAzivam, vAsudevam, vande, zrI kRSNamme, mokSadam..'
    en: Aha! Oho! How wonderful! The heart feels as if it is floating in the air, and the mind trembles with joy. It destroys the six main enemies - desire, anger, greed, delusion, pride and jealousy - along with all the remaining foes; it scatters the pitch darkness called ignorance; it brings auspiciousness and peace; it kindles devotion and knowledge, removes attachment to worldly matters and inspires one to stay detached. If, with eyes closed in meditation, one holds the feet of Sri Krishna in the mind with purity of thought, word and deed, then very easily the face of Sri Krishna, shining brightly with a smile, becomes visible to our inner eyes - that is, to the eyes of wisdom. It surely gives everything here in this life and grants liberation at the end of life.
    te: 'ఆహా! ఓహోహో!! చాలా అద్భుతం, హృదయం గాలిలో తేలిపోయేటట్టు అనిపించేది, మనస్సు త్రుళ్ళిపడుతుంది. కామ, క్రోధ, లోభ, మోహ, మద, మాత్సర్యాలు అనబడే ఆరు ప్రధాన శత్రువులతో పాటు, మిగిలిన విరోధులందరను నశింపచేసేది, అజ్ఞానం అనే కారుచీకటిని పటాపంచలు చేసేది, శుభములు, శాంతి కల్గించేది, భక్తి, జ్ఞానం, రగిల్చి ప్రాపంచిక విషయాలమీది మోహం తొలగించి, తటస్థంగా వుండేటట్టు ప్రేరేపించేది-ధ్యానంతో కన్నులు మూసుకుని త్రికరణశుద్ధిగా శ్రీకృష్ణుని పాదములను మనస్సులో నిలుపుకుంటే, చాలా సులభంగా, శ్రీకృష్ణుని చిరునవ్వుతో తళతళా ప్రకాశించే ముఖము మనకన్నులకు కనబడుతుంది. అంటే, జ్ఞానేత్రాలకు అని అర్థం. అది నిక్కచ్చిగా ఇహంలో అన్నీ ఇచ్చి జన్మాంతంలో మోక్షం కల్గిస్తుంది.'
  - type: verse
    id: v69
    no: '69'
    hk: ramyamainadi, rAmanAmamu, hRdyamamainadi, rAmacaritamu, bhakti, zaktikArakam, muktipradamodakam..ramya .. dhyAname gamya vathamai, parandhAmuvaDanu, anu gadyamai ..ramya.. sAdhyamainadi rAmasmaraNamu, mokSaH gamyamainadi rAma zaraNyamu.. rAmanAmamu ramyamainadi, ramyamainadi rAma nAmamu, dhanyamainadi nADu jIvanamu, labhyamai tArakarAmamu . abhayamai, mukti pradamai, zrI rAdhAkRSNa caraNa zaraNyamai ..
    en: How pleasant is the name of Lord Rama, how blissful it is to hear his tales, source of Bhakti & Sakthi, bestower of liberation, the ultimate goal - surrender to Lord Rama. Lord Rama’s pleasant name has brought me success in this worldly life, and it shall grant me salvation as well. May it make me fearless, as I surrender in front of Sri Radha Krishna’s lotus feet.
    te: ''
  - type: verse
    id: v70
    no: '70'
    hk: kAmezvaram, kamalAkSam, kAntipuJjam, karuNAmayaJca kaLyANa sarvadam . zrIlakSmIzam, jagadrakSakam, vande harSizam, zrIrAdhAkRSNam, me, kaivalyadam
    en: Lord of the embodiment of all desires, with lotus-like eyes, a mass of light, full of compassion, bestower of all auspiciousness, the Lord of Sri Lakshmi, protector of the world - to Sri Radha Krishna, the Lord and giver of liberation, my salutations night and day, at all times.
    te: 'అన్ని కోరికల స్వరూపమునకు అధిపతి, కమలమువంటి కన్నులు కలవాడు, వెలుగులపోగు, దయామయుడు, అన్ని శుభములు కల్గించేవాడు, శ్రీలక్ష్మీనాధుడు, జగత్తుకు రక్షకుడు, అయిన శ్రీరాధాకృష్ణ ప్రభువునకు, మోక్షమొసగే స్వామికి, రాత్రిపగలు, అన్ని వేళలా, నమస్కారములు.'
  - type: verse
    id: v71
    no: '71'
    hk: vaikuNThavAsinam, vaijayantI virAjitam, virATpuruSam, zrImahAviSNum, vandeham, vaidehI vibhum vedavedAnta vedyam, zrIrAdhAkRSNam, me, mokSadam..
    en: He who lives in Vaikuntha, who shines with the Vaijayanti garland, the cosmic form, Sri Mahavishnu the husband of Goddess Lakshmi, the God worshipped through all the Vedas, Vedantas, hymns and so on, the Lord of all worlds - salutations to Radha Krishna Bhagavan, who gives me liberation.
    te: 'వైకుంఠంలో నివసించేవాడు, వైజయంతి మాలతో ప్రకాశించేవాడు, విశ్వరూపుడు, లక్ష్మీదేవి భర్తగు శ్రీమహావిష్ణువు, అన్నివేదాలు, వేదాంతాలు, స్తోత్రం వగైరాలతో ఆరాధింపబడే దేముడు, అన్నిలోకాలకు అధిపతి, నాకు మోక్షమిచ్చే రాధాకృష్ణ భగవానులకు నమస్సులు.'
  - type: verse
    id: v72
    no: '72'
    hk: nityAnandamayam devam, viSNum, vibhUti prabhum, sarojA saugandha rAjanam. nIrajAkSam, nikhilalokezam, zrIrAdhAkRSNam, me, muktidam ..
    en: The God who is always full of joy, Vishnu who displays glorious powers, who shines gracefully with the fragrance of lotus flowers, who has eyes like lotuses, the Lord of all worlds - my salutations to Sri Krishna, who gives me liberation.
    te: 'ఎపుడూ ఆనందం నిండివుండే దైవం, మహిమలు ప్రదర్శించే విష్ణువు, తామరపూల పరిమళంతో తీవిగా విరాజిల్లే, కమలము వంటి కళ్ళుకల, అన్ని లోకాలకు అధిపతి, నాకు ముక్తినిచ్చే శ్రీకృష్ణునికి వందనములు.'
  - type: verse
    id: v73
    no: '73'
    hk: oM.. vande, vizvavibhum vizvam bharam, vizva mohanam, jaganmohinI rUpa dharam . viSNum, zambhu bhrAntikArakam, lIlAvinodinam, zrI bRndAkRSNam me. mokSadam..
    en: The ruler of the universe, its sustainer, the enchanter, who with the form of Jaganmohini bewildered even Samba Sadashiva himself, who playfully roamed and sported in Brindavan - I bow to Sri Krishna, to Mukunda, who gives me liberation.
    te: 'విశ్వానికి పాలకుడు, భరించేవాడు, మోహింపచేసేవాడు, జగన్మోహినీ రూపంతో సాక్షాత్ సాంబ సదాశివునే భ్రమింపచేసి, లీలగా బృందావనంలో విహరించి, వినోదించే శ్రీకృష్ణుని, నాకు ముక్తినిచ్చే ముకుందునికి మొక్కుతున్నాను.'
  - type: verse
    id: v74
    no: '74'
    hk: 'alaGkAra stotrapriyo viSNuH, abhiSekArcana priyazzivaH .. kuGkamapUjAmicchatideviH akSatapatrANizcagaNezaH..'
    en: Vishnu likes decoration and hymns; Shiva likes abhisheka and archana; worship with kumkum is dear to Sri Mahalakshmi; Vighneshwara likes akshata and leaves. If each is worshipped in the way that is pleasing to him, that Lord becomes pleased and grants his grace easily.
    te: 'విష్ణువు అలంకారం, స్తోత్రం ఇష్టపడతాడు; శివుడు అభిషేకం, అర్చన - కుంకుమతో పూజ శ్రీమహాలక్ష్మికి ప్రీతి, విఘ్నేశ్వరునికి అక్షతలు, ఆకులు ఇష్టము. ఎవరికి ప్రీతి పాత్రమైనవిధంగా వారిని అర్చిస్తే, ఆ స్వామి ప్రసన్నుడై, సులభంగా కరుణిస్తాడు.'
  - type: verse
    id: v75
    no: '75'
    hk: oM namazzivAyeti paJcAkSarIca, oM namo nArAyaNASTAkSarI mantra sarvasvam. tArakarAmam. zrI rAdhAkRSNam, dhyAnayoga mArga darzinam . oM, namo bhagavate vAsudevA yetidvA dazAkSaryupAsaka, bhaktyAya skAntAkarSitam, karuNAsAndram, vande zrI bRndAkRSNam. me, mokSadam
    en: 'The five-letter mantra ''Om Namah Shivaya'', the eight-letter mantra ''Om Namo Narayanaya'', the Taraka mantra ''Sri Rama'' - whichever mantra one meditates with, he is our guide who blesses us, Lord Sri Radha Krishna; he is drawn like a magnet to devotees who worship with the twelve-letter ''Om Namo Bhagavate Vasudevaya''. To such an ocean of compassion, Sri Krishna Bhagavan, the giver of liberation to me, my obeisances.'
    te: '‘ఓనమశ్శివాయ’ అనే ఐదు అక్షరముల మంత్రము, “ఓంనమోనారాయణాయ” అనే ఎనిమిది అక్షరముల మంత్రము, “శ్రీరామ” అనే తారక మంత్రము - ఏవిధమైన మంత్రపూర్వకముగా ధ్యానం చేసినా, మనలను ధన్యులను చేసే మనకు మార్గదర్శకుడు, శ్రీరాధాకృష్ణ విభుడు: ‘ఓం నమో భగవతే వాసుదేవాయ’ అనే పన్నెండు అక్షరములతో ఉపాసించే భక్తులపట్ల అయస్కాంతంలా ఆకర్షితుడౌతాడు. అట్టి దయాసముద్రుడు, నాకు ముక్తి ప్రదాత అగు శ్రీకృష్ణ భగవానులకు ప్రణామము.'
  - type: verse
    id: v76
    no: '76'
    hk: zrI kRSNarUpam, mugdhamanoharam, vizvamohana maGgaLAnandakaram, vizva vyAptam, zrI kRSNanAdam, muraLIravam, oGkAra madhuram, gItAvAkyam vedansarvAdhikam, zrI kRSNa bhASyam, nirApekSavidhitakarmAcaraNaJca, yogAbhyAsam, bhaktim mukti pradam, zrI kRSNakRtyam duSTa zikSaNam, ziSTarakSaNam.. zrI kRSNatatvam satyam, bhaktavazyam. saccidAnandam, vinodam, vizvapremaH..
    en: "The form of Sri Krishna is charming and captivates the mind. It enchants all the worlds and brings auspiciousness. It fills the whole universe. The sweetness of Sri Krishna's flute is the sweetness of Omkara, and the words of the Gita have greater glory than all the Vedas. The meaning of Sri Krishna's words is that, without desiring personal gain, a person should perform the duties prescribed to him. Liberation is attained through devotion. Sri Krishna's sports and deeds are the destruction of the wicked and the protection of the righteous. Sri Krishna's nature and way is to be won over by devotees without any deceit: Sat, Chit, Ananda (the joy filled with true knowledge gained through inquiry). He delights through mischievous deeds and floods all the worlds with love."
    te: 'శ్రీకృష్ణుని ఆకారము ముద్దుగావుంటూ, మనస్సును ఆకట్టుకుంటుంది. ప్రపంచాలన్నింటినీ మోహింపచేసి, శుభాలు కల్గిస్తుంది. జగత్తంతా నిండి వుంటుంది. శ్రీకృష్ణుని వేణుగానం ఓంకారపు తీయదనము, గీతలోని మాటలు అన్ని వేదాలకంటే, అధిక మహిమకల్గినవి. శ్రీకృష్ణుని మాటలకర్థము - స్వంతప్రయోజనం ఆశించకుండా, మనిషి తనకు విధించబడిన కర్మలు ఆచరించాలి. భక్తి ద్వారా ముక్తి సాధకము. శ్రీ కృష్ణుని లీలలు, చేతలు - దుర్మార్గులను నశింపచేసి, సన్మార్గులను రక్షించుట. శ్రీకృష్ణుని ప్రకృతి, పద్ధతి - కపటము లేకుండ భక్తులకు వశమగుట, సత్ చిత్, ఆనందం (నిజమైన, జిజ్ఞాసద్వారా లభించే జ్ఞానంతో నిండివుండే ఆనందం). కొంటె పనులతో ఆనందపరచటం, అన్ని లోకాలనూ ప్రేమతో ముంచెత్తటం.'
  - type: verse
    id: v77
    no: '77'
    hk: zrI kRSNAvatAram, lIlAmAnuSam, naTahAsalAsya, navarasabharitam, bAlya krIDArambhAta zrI yAjJAna prakAzakam, namAmi, nityam, tatsarvezam mamArA dhyadaivam, zrI rAdhAkRSNam, me, mokSadam ..
    en: The incarnation of Sri Krishna - a human form that performs divine sports, flooding with play, song, dance and laughter, as a small child, beginning with all his games, bringing good and knowledge to everyone - such Sri Krishna, the God of gods, is my beloved deity whom I worship. To Sri Radha Krishna, who grants liberation, my salutations always.
    te: 'శ్రీకృష్ణావతారం - లీలలు చేసే మనుష్యరూపం, ఆట, పాట, నాట్యం, నవ్వులతో ముంచెత్తేది, చిన్న పిల్లాడిగా, ఆడినవన్నిటితో మొదలుగా, అందరికీ మంచి, జ్ఞానం కల్గించటం, అటువంటి దేవద్ధేవుడైన శ్రీకృష్ణుడు నేను ఆరాధించే ఇష్ట దైవం, కైవల్యం కలుగజేసే శ్రీరాధాకృష్ణదేవులకు ఎల్లప్పుడూ నమస్కారము.'
  - type: verse
    id: v78
    no: '78'
    hk: vande vighnezvaram, sarvadam zivatejaJca, zrI zAradAm. zailajAm, zyAmalAm . brahma, viSNuzzivaika sarvezam, saccidAnandam, zrI rAdhAkRSNam, me, mokSadam ..
    en: To Vighneshwara, who gets the intended tasks done without obstacles; to Kumaraswami, who arranges everything; Saraswati, the giver of knowledge; Parvati, the bringer of auspiciousness; Lakshmi Devi, who bestows the eight kinds of wealth; Brahma, Vishnu and Maheshwara, the agents of creation, preservation and dissolution - all these being an integral part of his cosmic form - my obeisances to the eternal Sri Krishna, the ever blissful abode.
    te: 'నిర్విఘ్నంగా తలచిన పనులు జరిపించేటటువంటి విఘ్నేశ్వరునికి, అన్ని అమర్చే కుమారస్వామికి, విద్యాప్రదాయిని సరస్వతి, మంగళకారిణి పార్వతి, అష్టైశ్వర్యాలనిచ్చే లక్ష్మీదేవి, సృష్టి, స్థితి, లయకారకులైన బ్రహ్మ, విష్ణు, మహేశ్వరులు - వీరందరూ తనవిశ్వరూపంలో అంతర్భాగంగా గల శాశ్వతుడైన సదా ఆనందధామములగు శ్రీకృష్ణునికి ప్రణామము.'
  - type: verse
    id: v79
    no: '79'
    hk: 'he zrI kRSNa bhagavAn .. deham rogamayam, jarAbhArama tibAdhA karam, nityAnubhavam bAndhava . nirasanam, saMsAram bhayaGkaram sadA . vyarthamadya prabhutyAyuH zUnyamme . bhaviSya jIvitecchaH dehime, - takSaNa asmajjanmAntaJca etat kSaNa . tavazrIpadazAzvata sAnnidhyam, zrIzrIkRSNAnandamaya vaikuNTha vAsam .'
    en: O Sri Krishna Bhagavan! The body is full of disease. Old age is very hard. Being pushed away by one's own people happens every day! Family life is disturbing with fear and troubles. From now on, my living is futile. I no longer have any desire to live. Bring this life to an end immediately. And in that moment, draw me to your sacred feet and let me stay forever in the supremely blissful Vaikuntha, Lord Sri Krishna!
    te: 'ఓ శ్రీకృష్ణ భగవాన్! శరీరం రోగములతో నిండివుంది. ముసలితనం చాలాకష్టమైనది. అయినవాళ్ళు విదిలించడం రోజూ జరుగుతున్నదే! కుటుంబ జీవితం భయం, బాధలతో కలవర పరుస్తోంది. ఇటుపైన నేను బ్రతకటం వృధా. నాకు ఇంకా జీవించాలనే కోరిక ఏమాత్రం లేదు. తక్షణం యీ జన్మను ముగింపచేయి. ఆక్షణమేనీ శ్రీపాదములచెంతకు శాశ్వతంగా చేరదీసి అత్యుత్తమమైన ఆనందకరమైన వైకుంఠంలో ఉండేలా అనుగ్రహించు, శ్రీకృష్ణప్రభు!'
  - type: verse
    id: v80
    no: '80'
    hk: yegezvaram, rAdhA sahaika deha, devezvaram, mamahRdaya sthitam, vande . rAjIvAkSam, rAsalIlA brahmacAriNam, vizvajanakam, zrI kRSNam muktidam ..
    en: The Lord of yoga, together with Radha, God of all gods, firmly established in my heart, with eyes like lotuses, who sported with many thousands in his Rasa dances, ever a celibate, the father of all the worlds - my salutations to Sri Krishna, who gives me liberation.
    te: 'యోగేశ్వరుడు, రాధా సహితుడైన, అందరి దేముళ్ళకూ దేముడు, నా హృదయంలో స్థిరంగా నిల్చిన, పద్మముల వంటి కన్నులు గల, రాసలీలలతో కొన్ని వేలమందితో విహారము సల్పిన, సదా బ్రహ్మచారి, అన్ని లోకాలకూ తండ్రి అయిన, నాకు ముక్తినిచ్చే శ్రీకృష్ణునికి వందనములు.'
  - type: verse
    id: v81
    no: '81'
    hk: maGgaLam zrIrAmacandrAya sarvalo kamaGgaLAyaca. devAya, parabrahmAya, zrIzrI rAdhAkRSNAya maGgaLam..
    en: Victory to Sri Ramachandra, who brings auspiciousness to all the worlds! May there be auspiciousness to Sri Radha Krishna, the Lord and the Supreme Soul! May there always be well-being for all beings and all worlds!
    te: 'అన్ని లోకములకూ శుభములు కల్గించే, శ్రీరామచంద్రునికి జయమగుగాక! భగవంతుడు, పరమాత్మడగు శ్రీరాధాకృష్ణులకు మంగళమగుగాక! సర్వులకు, సర్వలోకములకు, సదా శుభమగుగాక!'
  - type: verse
    id: v82
    no: '82'
    hk: 'oM zrIrAma oM hare kRSNa oM.. vighnezvarAya vidmahe, vighnaharAya dhImahi tanno sarvasiddhiprada gaNeza devatAH pracodayAt II vighnezvara namastubhyam, bhavAnI zaGkara sutaH zivatejAgraja. zrIrAdhAkRSNadhyAnArambham kaivalya prAptyardham kariSyAmi, siddhirbhavatu mesadA..'
    en: Understanding the one who is said to be the Lord of obstacles as the God who removes (destroys) obstacles, I come to know that this very Lord is the one who makes all efforts bear fruit (beginning with my teacher, and by the grace of Sri Krishna, the original Guru of the entire universe). O Vighnaraja, son of Parvati and Parameshwara, elder brother of Kumaraswami, my salutations to you. For attaining the state of liberation, I begin the meditation on the Lord of gods, Sri Radha Krishna. Bless that this effort of mine becomes successful.
    te: 'విఘ్నములకు అధిపతి అని చెప్పబడిన వారిని, విఘ్నములను హరించే (నశింపజేసే) దైవముగా అర్థముచేసుకుని, ఆస్వామియే అన్ని ప్రయత్నములు ఫలించేటట్లుగా చేయువారని (మావిద్యాగురువుగారితో మొదలు, విశ్వమునకే ఆది గురువైన శ్రీకృష్ణ విభుని అనుగ్రహముతో) తెలుసు కొనుచున్నాను. పార్వతీ పరమేశ్వరుల కుమారుడు, కుమారస్వామికి అన్నగారైన ఓ విఘ్నరాజా! నీకు నమస్కారము. కైవల్య పదసాధనకై, దేవాది దేవులు శ్రీ రాధాకృష్ణ ప్రభువుల ధ్యానము మొదలెడుతున్నాను. నాయీ ప్రయత్నము సఫలం అయ్యేలా అనుగ్రహించు.'
  - type: verse
    id: v83
    no: '83'
    hk: oM.. bhajeham, bhujaGga bhUSaNam, bhavAnIzam, bhavabhayaharam, bhaktavaradam, zrIkRSNavandyam. sadAzivam, namukhaSaNmukhanandi bhRGgyAdi, prathamagaNa, pariveSTitenduzekharam. gaGgAdharam, devAdi devam, vizva sundaram) zrIrAdhAkRSNa satatArAdhanA nandamayam. bhiSakrathamam, sarvarogaghnam, memokSadam..
    en: Nagabhushana (one who wears a serpent as an ornament), husband of Goddess Gauri, destroyer of fear in worldly life, giver of boons to devotees, saluted by Sri Krishna, who always looks upon everyone equally, attended by the foremost hosts - Ganesha, Karttikeya, Nandi, Bhringi and others - who bears Goddess Ganga on his head, God of all the gods, the most handsome in the world (Jaganmohana Sadashiva, who holds all the universes within himself, is without doubt supremely beautiful), who always worships Sri Radha Krishna, the primal mendicant, destroyer of all diseases (according to the Rudra mantra 'adhyavocadadhivaktaa prathamo daivyo bhishak', Ishwara is the first physician), the Mahadeva who gives liberation - I sing praises of him.
    te: 'నాగభూషణుడు (పామును ఆభరణముగా ధరించినవాడు) గౌరీ దేవి భర్త, సంసారంలో భయం నశింపజేసేవాడు, భక్తులకువరములు ప్రసాదించేవాడు, శ్రీకృష్ణునిచే నమస్కరింపబడేవాడు, ఎపుడూ అందర్నీ సమానంగా చూసేవాడు, గణేశ, కార్తికేయ, నంది,భృంగిమొదలగు ప్రథమ గణముతో కొలువుతీరేవాడు గంగా దేవిని శిరస్సున ధరించినవాడు, దేవతలందరికి దేవుడు, జగత్తులో అత్యంత అందగాడు ( అన్ని విశ్వములను తనలో ఇముడ్చు కున్న జగన్మోహన సదాశివుడు నిస్సంశయంగా మహాసుందరుడే), శ్రీ రాధాకృష్ణులను ఎల్లపుడూ కొలిచేవాడు, ఆది బిక్షువు, అన్ని రోగములు నశింపజేసేవాడు ( అధ్యవోచధతివకా ప్రథమోదైవ్యోభిషక్" అనే రుద్రమంత్రము ప్రకారము ఈశ్వరుడు మొదటివైద్యులు), ముక్తినిచ్చే మహాదేవుని గూర్చి భజన చేస్తున్నాను.'
  - type: verse
    id: v84
    no: '84'
    hk: zrI dhanvantaram, zrImahA viSNu svarUpam, kSIrasAgara sambhavam, surabhiSagvaram, sarvadam, mama sarvarogaghnaJca, vande, zrIrAdhAkRSNam mokSadam..
    en: He who shines in the form of Sri Mahavishnu, born when the ocean of milk was churned to obtain nectar, the physician of the gods, who provides everything, who removes all the diseases in my body according to the grace of Sri Krishna - my salutations to Sri Dhanvantari, and to Sri Radha Krishna, the giver of liberation to me.
    te: 'శ్రీమహావిష్ణువు రూపంతో ప్రకాశించేవాడు,అమృతసాధనకై పాలసముద్రము చిలికినపుడు పుట్టినవాడు, దేవతలకు వైద్యులు, అన్నీ సమకూర్చి, నాశరీరములోని అన్ని వ్యాధులను శ్రీకృష్ణానుగ్రహానుసారము, పోగొట్టే శ్రీధన్వంతరికి, నాకుముక్తి ప్రదాతైన శ్రీ రాధాకృష్ణ దేవునికి వందనములు.'
  - type: verse
    id: v85
    no: '85'
    hk: junnutinanivADu, kannEnaunananivADu. kannayya mannanalenivADu, dunna potukanna kanikiSTuNDilan..
    en: He who does not appreciate the delicate flavors of colostrum cheese, is effectively blind. Similarly, he who does not seek the refuge of Krishna has a fate worse than a donkey.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v86
    no: '86'
    hk: zrI harinAma saGkIrtana manudhyAna pakvamaujunnuvaladannavADu. zrIharihara bhakti kanna minna ledanEruganivADu. zrIharihara ajasatulakaTAkSarahituDai, zrIhari harA. naruDudhariNin dunnakanna hInacarituNDagun..
    en: One who does not desire the spiritual ripening of Sri Hari Nama Sankeertanam is like a buffalo. He who does not know that there is nothing greater than devotion to Sri Hari and Hara, and who is devoid of the graceful glance of Sri Hari and Hara, will become a person of lowly character, worse than anyone else who walks the earth.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v87
    no: '87'
    hk: calanamandugAni, caJcalanamandu gAni, caJcalAkSa bhogulandugAni caJcalamanaskulandugAni, cakradhAri cariJcaDEnnaDu sarvopagatuNDayyun . nizcala bhaktacittamandu nizcayambuganuNDEllEDalan..
    en: Neither in movement, nor in restlessness, Neither in passionate beings nor in those with fickle minds, Has the Discus-Bearer (Lord) ever wandered. He is omnipresent. In the unwavering devotional heart, He steadily resides everywhere.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v89
    no: '89'
    hk: surAdhyakSam zivam sadAzivapriyam zivAnanda laharI lAsya ravaLIravam. sadA bhaktavaradam cakradharam zatA nandaJca sahasrAkSam. susmitavadanAravindam sammohanAvatAram zrImannArAyaNam sakalalokezam sarvArdhapradam suzlokezam. sarvaklezaharam zubhAGgam zrIvatsAkam zAzvatam vande zrIkRSNam mamamokSadam..
    en: Lord of the hosts of gods, who always looks upon everyone equally, dear to Shiva, delighted by the sound of Omkara, the stream of Shiva's bliss, with an unwithering face full of the beauty of a lotus flower, enchanting everyone, whose dwelling is in the waters, the Lord of all worlds, giver of all that is meaningful, with radiant limbs, the Lord of Lakshmi, the eternal one - folded-hand salutations to Sri Krishna Prabhu, who gives me liberation.
    te: 'దేవగణములకు అధిపతి, ఎపుడూ అందర్నీ సమంగా చూసేవాడు, శివునికి ఇష్టుడు, శివానందప్రవాహమైన ఓంకార శబ్దప్రమోదుడు, చెక్కుచెదరని తామర పూవ్వు వంటిసొయగంనిండిన,ముఖంతో, అందర్నీ మోహింపజేసే, నీరు నివాసముగాగల, అన్నిలోకాలకు అధిపతి, అర్థవంతమైన అన్నిటినీ ఇచ్చేవాడు,శోభస్కరమైన అవయవములతో, లక్ష్మీనాధుడు, శాశ్వతుడగు, నాకు మోక్షమిచ్చే శ్రీ కృష్ణప్రభువుకు నమస్సుమాంజలులు.'
  - type: verse
    id: v90
    no: '90'
    hk: satataMsmarAmi sakalalokezam rAsalIlAzrI vinodinam zrI kRSNam. nityannamAmi vijayasArathim zikhipiJchamauLim zazibindum zrI kRSNam. sadAvande, go, gopikA, gopa, bAlAnandaGgovardhanoddhArakam zrI kRSNam. bhajAmyaharnizam mahAtejam pApaharam paramAtmAnam memokSadam zrI kRSNam..
    en: The Lord of all worlds, who delights in the Rasa dance, Arjuna's charioteer, who wears a peacock feather as an ornament on his head (peacocks mate through the union of the eyes - this bird is a symbol of celibacy; this idea is contained in the above ornament of Sri Krishna, who is an ever-celibate), protecting the cows, the cowherds, the gopikas and the children, who held up Mount Govardhana like an umbrella on his little finger and protected the people of Gokula from Indra's rain of stones, supremely radiant, destroyer of all sins - I always hold in my mind, meditate upon and bow to Sri Krishna, the Supreme Soul, the God who gives me liberation.
    te: 'అన్ని లోకాలకు ప్రభువు,రాసలీలతో వినోదించేవాడు, అర్జునునిరథసారథి, నెమలికన్ను అలంకారముగా తలలో ధరించినవాడు (నెమలి దంపతుల కలయిక కన్నులతో జరుగుతుంది - యీపక్షి బ్రహ్మచర్యమునకు ప్రతీక. ఘోటకబ్రహ్మచారియైన శ్రీకృష్ణుని పైవిధమైన అలంకారంలో యీసూచన ఇమిడివున్నది) ఆవులను, ఆవులకాచేవారిని, గోపికలను, బాలులను రక్షిస్తూ, గోవర్ధనగిరిని గొడుగులా చిటికెనవ్రేలి పైనిలిపి, ఇంద్రునిరాళ్ళ వర్షం నుంచి, గోకుల వాసుల్ని రక్షించినవాడు. అత్యంత కాంతి వంతుడు, పాపములన్నీ నశింపజేసేవాడు - అయిన శ్రీ కృష్ణపరమాత్మను, నాకు ముక్తి నిచ్చేదైవమును ఎల్లపుడూ మనస్సులో నిలుపుకుని ధ్యానిస్తూంటాను, నమస్కరిస్తూంటాను.'
  - type: verse
    id: v91
    no: '91'
    hk: oM namo nArAyaNAya oM namazzivAya ceti mahA mantra dvayAntargata “rA” yeti “ma” iti mUlAkSarasam yuktam zrI sadAziva sRjita “rAma”, nAmna virAjita zrI rAmacandram dazaradhAtmajam raghuvIram sarvadam. zirasAnamAmi sadA saccidAnanda brahmaGkaikeyIsutam kausalyAputram.. zrI hanumatsItA lakSmaNa bharata zatRghna sahita bhadrAdrirAmam. manasAsmarAmi smaraNeka mAtreNa zAzvata abhayadam memokSadam||
    en: "Salutations to Lord Ramachandra, who shines with the sacred name 'Rama'—crafted by Lord Sadashiva Himself by combining the vital root syllables 'Ra' and 'Ma' from the two great mantras: 'Om Namo Narayanaya' and 'Om Namah Shivaya'. I bow my head eternally to the embodiment of Sachidananda Parabrahma, the son of Dasharatha, the hero of the Raghu dynasty, the bestower of everything, and the beloved son of Kaikeyi and Kausalya. With all my heart, I meditate upon Bhadradri Rama, who is accompanied by Sri Hanuman, Sita, Lakshmana, Bharata, and Shatrughna-the Lord who, by mere remembrance alone, grants eternal fearlessness and bestows liberation upon me."
    te: 'ఓం నమో నారాయణాయ" అనే విష్ణు అష్టాక్షరీ మంత్రము మరియు "ఓం నమశ్శివాయ" అనే శివ పంచాక్షరీ మంత్రములలోని కీలకమైన మూలాక్షరాలైన "రా" మరియు "మ"లను సంధించి, సాక్షాత్తు శ్రీ సదాశివునిచే సృష్టించబడిన "రామ" అనే తారకనామముతో విరాజిల్లే శ్రీరామచంద్రునికి ప్రణామాలు! దశరథుని కుమారుడు, రఘువంశ వీరుడు, కోరినవన్నీ ప్రసాదించేవాడు, సచ్చిదానంద పరబ్రహ్మ స్వరూపుడు, కైకేయీ-కౌసల్యల ముద్దుల తనయుడైన శ్రీరామునికి నిరంతరం శిరస్సు వంచి నమస్కరిస్తున్నాను. శ్రీ హనుమంతుడు, సీతాదేవి, లక్ష్మణుడు, భరతుడు మరియు శత్రుఘ్నులతో కూడి కొలువైయున్న భద్రాద్రి రామచంద్రుని మనసారా స్మరిస్తున్నాను; కేవలం ఆ నామస్మరణ మాత్రంచేతనే శాశ్వతమైన అభయమును, నాకు మోక్షమును ప్రసాదించు ఆ ప్రభువునకు వందనములు.'
  - type: verse
    id: v92
    no: '92'
    hk: anarthakam kAlayApanam cakSINamAyuHkSaNekSaNe. zarIrazidhilam sahajamantam, kuruzrI kRSNadhyAnam muktipradam ..
    en: Wasting time is harmful, because with every passing moment life span keeps shrinking. That our body withers and that we die in the course of time is very ordinary and unavoidable. Therefore one should always meditate on Sri Krishna. Only then will liberation come.
    te: 'సమయంవృధాచెయ్యటం చేటు ఎందుకంటే, క్షణం గడిచే కొద్దీ,ఆయుర్దాయంతగ్గి పోతూంటుంది, మనశరీరము కృశించిపోవటం,కాలక్రమేణా చనిపోవటం చాలా మామూలు, తప్పని విషయం. అందువల్ల ఎపుడూ శ్రీకృష్ణుని ధ్యానిస్తూండాలి. అపుడే మోక్షంకల్గుతుంది.'
  - type: verse
    id: v93
    no: '93'
    hk: satatamusaccidAnanda svarUpuDaina sAkSAt zrI kRSNa paramAtmaye nannu nirantaramu zrI kRSNapada dhyAna nimagnunigA karuNimpan, sarvaloka prasiddha aSTazvarya pUrvaka divyasaukhyambulelanAku? cAlu nAku I akhaNDaizvarya varaprasAdamu ika e kalakalamunainan kalavaraparacanazakturAlai kalalo kaDali alala valE kUlipovu takSaNa mutana Avegamuto, tejomaya zrIkRSNa bhagavAnAjJAnu sAramu nizcayambugan tAmEntavArainan, paDatIpAdAkrAntulaurA. mArgadarzakapuruSottama zrIkRSNA..
    en: In this fleeting, meaningless time when life diminishes moment by moment, When the body weakens and approaches its natural end, Meditate on Sri Krishna, who bestows liberation.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v94
    no: '94'
    hk: 'preraNam zrI yogezvara rAmezvara daivataizca, likhitam zrIpadadhyAna gItAvaLiH zreyantasyagAnam zrI rAdhAkRSNa kRpAyogyatArtham. ihajanmam dhanyam kaivalya padasAdhanArthamityucyate..'
    en: These divine prayer songs have been written, bringing joy to everyone, with the inspiration of Lord Sri Krishna, the Master of Yoga. Singing them is very beneficial and makes one deserving of the Lord's grace. The purpose of this birth is to attain liberation, so that humans do not keep turning like a wheel, being born again and dying - this is certain!
    te: 'అందరకూ ఆనందం కల్గించే, యోగేశ్వర శ్రీకృష్ణ దేవుల ప్రేరణతో, యీదైవ ప్రార్థన గీతాలు వ్రాయబడినది. వీటిని పాడుకోవటం చాలా శ్రేయస్కరం, భగవంతుని దయకు అర్హత కల్గిస్తుంది. యీ జన్మప్రయోజనం, మానవులు, తిరిగిపుడుతూ, చస్తూచక్రంలా తిరుగు తూందకుండా, కైవల్యం సాధించడానికే సుమా!'
  - type: verse
    id: v95
    no: '95'
    hk: oM.. bhagavadgItAcAryam, bhava bhaya rogazokaharam, bhaktirajjubandhitam. varadam sarvasiddhidam zrInAdham vande zrIkRSNammama mokSadam.. oM zrIrAma oM hare zrI kRSNa parabrahmaNenamaH
    en: The Guru who bestowed the Bhagavad Gita, remover of the fear of worldly existence, destroyer of all diseases and sorrows, who is bound by the rope called devotion, who fulfils all desires and makes all things go on victoriously, the husband of Rama (Lakshmi) - salutations to Sri Krishna, who gives me liberation.
    te: 'భగవద్గీత ప్రసాదించిన గురువు, సంసార భయం తొలగించేవాడు, అన్ని రోగాలనూ, దుఃఖాలనూ నశింప జేసే, భక్తి అనే త్రాడుతో బంధింపబడే,కోరికలన్నీ తీర్చే అన్ని పనులూ దిగ్విజయంగా జరిగేటట్టుచేసే, రమాపతి, నాకు ముక్తినిచ్చే శ్రీకృష్ణులకు నమోవాకములు.'
  - type: verse
    id: v96
    no: '96'
    hk: oM zrI subrahmaNyam narvamaGgaLAnutam surasenAninam ziva tejam, zrI vallIzam . viSNu saGkalpodbhavam, velpANinam bAlam, tArakaharam, SaNmukham. zrI kRSNahAna prakAzapraNavArdha pravINa ziva gurum, rakSakam, vande. kArtikeyam, sarvadam, zaravaNam, sarvarogannam, ripughnaJca memokSadam.
    en: The son of Uma who gives all auspiciousness, commander of the army of the gods, glorified as the very radiance of Samba Shiva himself, husband of Sri Valli, the daughter of Vishnu, born according to the will of Sri Mahavishnu, wielder of the weapon called Vel, always a child, slayer of Tarakasura, husband of Goddess Shashthi, renowned as the Guru even of Shiva, the foremost among those who explained the meaning of Omkara, the light of Sri Krishna's smile, protector of the distressed, raised by the Krittikas, giver of everything, the one called Saravana, my auspicious one, destroyer of all diseases and enemies, the giver of liberation - salutations to Subrahmanyeshwara.
    te: 'అన్ని శుభములనిచ్చే ఉమాసుతుడు, దేవతలసేనానాయకుడు, సాక్షాత్సాంబశివుని తేజస్సుగాకీర్తింపబడే వాడు విష్ణుమూర్తికూతురగు శ్రీ వల్లికిభర్త, శ్రీమహావిష్ణువు సంకల్ప ప్రకారము జనించినవాడు, వేల్ అనే ఆయుధం ధరించేవాడు, ఎపుడూ చిన్న పిల్లవాడే, తారకాసురుని చంపిన, షష్ఠీదేవిభర్త, శ్రీకృష్ణుని చిరునవ్వు యొక్క వెలుగైన ఓంకారమునకు అర్థము తెలిసినవారిలో ప్రథముడైన శివునికే గురువుగా ప్రసిద్ధిచెందిన వాడు, ఆర్తులను కాపాడేవాడు, కృత్తికా పక్షులచే పెంచబడ్డవాడు, అన్నీ ఇచ్చేవాడు, శరవణుడు అనే, నా మంగళవాడు, అన్ని వ్యాధులను శత్రువులను, నశింపజేసి, మోక్షకారకుడైన సుబ్రహ్మణ్యేశ్వరునికి నమోవాకములు.'
  - type: verse
    id: v97
    no: '97'
    hk: 'oM. sarvezazrI kRSNam, manoharam, mamArAdhyadevaram, zrIkaram, sadAzirasAnamAmi, manasAsmarAmi sadAhasitavadanam Azritavatsalam vAsudeva zrIkRSNam. (mugdha) muddu kRSNam madana gopAlam rAdhA kRSNam vande karuNA sindhum zrIkRSNam. bAlaGgopAlam yazodAnandanandanam, navanItacoram, lIlAmAnuSam naTvaram - satyasvarUpam sAndIpanI antevAsinam bhaktavaradam, dauSTyAntakam. praNAmyaharnizam paraJjyotiH varandhAma parameza zrIkRSNam, mamakaivalyadam..'
    en: 'Sri Krishna, the Lord of all, who captivates the mind, the God whom I worship, the giver of prosperity - to him I always bow my head and offer obeisances. I remember him in my mind and worship him on the path of meditation: the ever-smiling face, who supports those who take refuge, Sri Krishna the son of Vasudeva, Sri Krishna of charming ways, who brings joy, Radha Krishna Prabhu the cowherd, Sri Krishna the ocean of compassion - my salutations; the young Gopala, child of Yashoda and Nanda, who stole butter in Gokula, who was born as a human and showed many divine sports, the great actor, the true one of towering form, disciple of the sage Sandipani, fulfiller of the wishes of devotees, the sacred form of light, dweller of the supreme Goloka, the Supreme Lord, who grants me liberation - to that Sri Krishna I always offer obeisances, without any distinction of day or night.'
    te: 'అందరికీ అధిపతి శ్రీకృష్ణుడు, మనస్సును ఆకట్టుకునేవాడు,నేను కొలిచే దేవుడు, ఐశ్వర్యములిచ్చేవాడువీరికి ఎపుడూ తలవంచి నమస్కరిస్తున్నాను. మానసికంగా తలుచుకుంటున్నాను ధ్యానమార్గంలో ఆరాధిసున్నాను ఎపుడూ నవ్వుతూండే ముఖం, ఆశ్రయించిన వారిని ఆదుకునే, వసుదేవుని కుమారుడగు శ్రీకృష్ణుడు, ముద్దులొలికే శ్రీకృష్ణుడు, ఆనంద పరిచే, ఆవుల కాపరి రాధాకృష్ణప్రభువు, దయాసాగరుడగు శ్రీ కృష్ణునికి నమస్కారం చిన్నవాడైన గోపాలుడు, యశోదా నందుల బిడ్డ, గోకులంలో వెన్నదొంగిలించేవాడు, మనుష్యునిగా జన్మించి, అనేక లీలలు చూపిన వాడు, మహానటుడు, నిజమునిండిన నిలువెత్తురూపసి, సాందీపనిమహర్షికి శిష్యుడు, భక్తుల కోరికలను తీర్చేవాడు, పవిత్రమైన జ్యోతి స్వరూపుడు,సర్వోత్కృష్టమైన గోలోకవాసి, పరమేశ్వరుడు, నాకు కైవల్య మొసగే, శ్రీ కృష్ణునికి, పగలు రాత్రి, అనే భేదంలేకుండా ఎపుడూ నమస్కరిస్తూంటాను.'
  - type: verse
    id: v98
    no: '98'
    title: DolAlAsyam
    hk: |-
      tanmayilAlI, tanmayinAdha devezAlAlI. tejomayilAlI, tejomayahRdayAlAlI. tejasvinIlAlI, tejazrI zazaurI lAlI.. tejorUpiNi lAlI, tejorUpAdhipA lAlI.
      pallavi.. tatsatsItArAmAlAli, ramAramaNAlAlI. tApassarvahara, zrIrAdhAkRSNA lAlI.. sirisirirazmIlAlI, musimusihAsarAzIlAlI. nusmitavadanAlAlI, AzritavatsalalAlI . tapasvinI lAlI, tapasvarUpAlAlI. tatvabodhini lAlI, tatvavedAnta vedyAlAlI.
      vizva mAtA lAlI. vizvanAdh lAlI, sarvamaGgaLa lAlI, piGgaLa sundara lAlI. zubha kAriNI lAlI. zubhazrIkAntA lAlI. kSIrodayA lAlI. kSIra sandra zayanAlAlI. hanumatsevita pUrNAvatAra zrIrAmA lAlI. balarAmAnuja sampUrNAvatAra zrI rAdhA kRSNA lAlI. pUrNacandrikA lAlI. hiraNya garbhA lAlI pallavi . tatsat maithilI manohara lAlI. rAga hRdaya zrI rAdhAkRSNA lAlI. bhava bhaya roga zoka harame, vaziSTha gaNa viziSTA lAlI.......tanmayi lAlI..
    en: Lakshmi Devi, jojo (lullaby)! Lord of Lakshmi, the master of all the gods, jojo! O mass of radiance, jojo! Sri Krishna, whose mind is filled with divine radiance, jojo! Lakshmi, who is full of radiance, jojo! Her husband Sri Vishnu, jojo! O embodiment of radiance, jojo! Lord of Sridevi, jojo! O Sita and Rama, the forms of truth and reality, jojo! Rama Devi, jojo! O giver of joy, Sri Krishna, who destroys all anxieties, jojo! O light of good fortune, jojo! O lotus who shines with a good smiling face! O God who looks with love on those who take refuge, jojo! O one immersed in penance, the very form of penance, jojo! O Mother who teaches the truth! O Lord who accepts the worship offered in the Vedas and Vedantas, jojo! Father of all the worlds! Mother who gives all auspiciousness, jojo! Dear son of Aruna! Father! O cause of all auspiciousness, jojo! Lord of that Mother, jojo! O one born from the ocean of milk, jojo! O one who reclines on the ocean of milk, jojo! O complete incarnation served by Anjaneya, Sri Rama, jojo! Purushottama, younger brother of Balarama, God of gods who has everything in fullness, incarnation Sri Krishna, jojo! Mother who shines like the full moon, jojo! Sri Krishna, God of all in all the worlds, jojo! Husband of Sita, daughter of the king of Mithila, the very form of truth, jojo! Sri Radha Krishna Prabhu, whose heart is full of love, jojo! O Sri Ramachandra, supreme one in the lineage of Vasishtha, who destroys my family worries, fears, diseases and weeping, jojo!
    te: 'లక్ష్మీదేవీ జోజో। లక్ష్మీపతీ, అందరి దేముళ్ళకే అధిపతీ, జోజో/ కాంతిపుంజమా జోజో మనసంతా దివ్యకాంతితో నిండిన శ్రీకృష్ణా! జోజో। కాంతినిండివుండే లక్ష్మీజోజో। ఆమెభర్తపగు శ్రీ విష్ణూ! జోజో। కాంతిస్వరూపీ! జోజో శ్రీదేవీనాధా! జోజో! తత్త్వము, సత్యముల రూపమైన సీతారాములారా! జోజో! రమాదేవికి జోజో! ఆనందంకల్గించేవాడా అన్ని వ్యాకులాల్నీ నశింపజేసే శ్రీకృష్ణా। జోజో! సౌభాగ్యముల ప్రకాశమా! జోజో! మంచి నవ్వుముఖంతో రాజిల్లేకమలా! ఆశ్రయించిన వారిని ప్రేమతో చూసేదేవా! జోజో! తపస్సులో మునిగివుండే, తపస్సు యొక్క ఆకారమా! జోజో! తత్త్వమును భోధించేమాతా। తత్త్వము, వేద వవేదాంతములందు పూజనీ యుడగా నివాళులందు కొనే స్వామీ। జోజో! అన్నిలోకాలకూ తండ్రీ! అన్ని మంగళములనిచ్చే అమ్మా॥ జోజో! అరుణనందరా। నాన్నా! శుభములకుకారకురాలా/జోజో! ఆమాతకు నాధా/జోజో! పాలనముద్రం నుండి ఉద్భవించిన దానా!జోజో! పాలనముద్రమీద పవళించే వాడా/జోజో! ఆంజనేయునిచే సేవింపబడేపూర్ణావతారా! శ్రీరామా! జోజో బలరాముని తమ్ముడైన పురుషోత్తమా అన్ని నిండుగా గల దేవాదిదేవా శ్రీకృష్ణావతారా! జోజో నిండు నున్నమి నాటి చంద్రుని వలెశోభిల్లేతల్లీ! జోజో అన్ని విశ్వాల్లో అందరికీ దేవుడైన శ్రీ కృష్ణా! జోజో నిజము యొక్క ఆకారమైనమిథిలాధిపతి కూతురైన, సీతకువతి! జోజో! ప్రేమతో నిండుగుండెల శ్రీరాధాకృష్ణ ప్రభూ! జోజో! నాకుగల కుటుంబీక, భయము,వ్యాధులు, ఏడ్పులు, నశింపజేసే, వశిష్ఠగణములో, సర్వోత్కృష్టుడైన శ్రీరామచంద్రా! జోజో!'
  - type: verse
    id: v99
    no: '99'
    title: dhyAna mahatyam - vizvaguru zrI kRSNasUktiH
    hk: |-
      oM.. jihvAgrevanati zrI kRSNanAma saGkIrtanam ca saMsAramaihikam hRdayassarvam zrI kRSNAnandamayam karoti .
      dhyAnam zrI kRSNasAyujyadam tasmAtsarva yatnena zrI kRSNadhyAnayogI bhava sAyujya sAdhana mastu||
    en: On the tip of the tongue is the power to sing hymns with the many names of Sri Krishna; in this world the bondage of worldly life stays in the home. Meditation on Sri Krishna is filled with the bliss of Sri Krishna, gives great joy, and at the end, liberation. Therefore, making all efforts, may they practise the yoga of meditation on Sri Krishna! May liberation be attained!
    te: 'నాలిక కొననేవుంటుంది శ్రీకృష్ణుని బహునామాలతో స్తోత్రం (చేసేశక్తి), యీలోకంలో బంధమైన సంసారం ఇంట్లో వుంటుంది. శ్రీకృష్ణ ధ్యానం శ్రీకృష్ణానందం తోనిండివుండినది, కల్గిస్తుంది మహాసంతోషం, చివరల్లోముక్తి. అందువల్ల అన్ని ప్రయత్నాలుచేసి, శ్రీకృష్ణధ్యాన యోగం అభ్యసింతురుగాక! మోక్షము లభించుగాక!'
  - type: verse
    id: v100
    no: '100'
    hk: |-
      nitya vandanam tejaH puJjam harim daityaharam mamArAdhya daivam tANDava zrI kRSNam madhurassarvam madhurAdhipam mAdhavam bRndAlIlA zrI kRSNam vizvarUpam. jagatsarvadaJjaganmohanam jagadAnanda kArakam rAdhezam zrI kRSNam. bAla kRSNam me sarvasvam zrInRsiMham gItAkRSNam dhyAnakRSNam sAyujyadam..
      zvAsAntAzvAnam (antya vinnapam) dIna dayALA. zrI kRSNa devA.. dehi me, takSaNam tedivya pada sAyujyam zAzvatam..
      “bhagavadprasAdam” - sarvam zrI rAdhAkRSNArpaNamastu
    en: A mass of radiance, Vishnu, the slayer of demons, the God I worship, Sri Krishna who delights in dance - all his tales and divine sports are supremely delightful; the ruler of Mathura, husband of Lakshmi Devi, who carried on the Rasa dance in Brindavan, the cosmic form, who has become the entire universe, who enchants everyone in all times, the cause of bliss, the Lord of Radha, Sri Krishna himself! Salutations to little Krishna, who arranged everything for me. He who is like a lion among men, who taught meditation through the Gita, Sri Krishna, the giver of liberation to me! May he keep graciously blessing me so that I always remember him! O Adi Narayana, who supports those with no refuge! O Lord Sri Krishna! Right now, merge me into your sacred, nectar-filled, blissful feet! Protect me and guard me.
    te: 'కాంతి సమూహము, విష్ణువు, రాక్షసులను చంపేసే వాడు, నేనుకొలిచే దైవం, నాట్యవినోది శ్రీకృష్ణుడు, ఆయన గాధలన్నీ, లీలలన్నీ మహా రుచివంతం, మదురకుపాలకుడు, లక్ష్మీదేవి భర్త, బృందావనం లో, రాసలీల సాగించిన వాడు, విశ్వరూపుడు, జగత్తంతాతానైన, అన్నిలో కాలనూ వ్యామోహింపజేసే వాడు, ఆనందమునకు కారకుడు రాధానాధుడు శ్రీ కృష్ణుడే। నాకు అన్నీ అమర్చిన బుజ్జి కృష్ణునికి నమోవాకాలు. నరులలో సింహమువంటివాడు, గీత ద్వారాధ్యాన బోధచేసిన, నాకు కైవల్య ప్రసాది శ్రీ కృష్ణులే! ఎపుడూ వారిని స్మరించేటట్టు నన్ను అనుగ్రహిస్తూనే వుందురు గాక! దిక్కులేని వారిని ఆదుకునే ఆది నారాయణా ! శ్రీకృష్ణ దేవా! ఇప్పటికిప్పుడే నన్ను నీ పవిత్రమైన అమృతమునిండిన ఆనందదాయకమైన పాదములలో నన్నుకలిపేసుకో! కాచిరక్షించు।'
  - type: verse
    id: v101
    no: '101'
    title: zrI rAdhAkRSNamuktAvaliH
    hk: |-
      oM namonArAyaNAya, oM namo bhagavate vAsudevAya harekRSNa rAmeti,sadAdhyAyAmi, vizvarUpa zrIkRSNam bhaktajanapAlakam, rakSakam, zrIrAdhAkRSNam, zAzvata zrIkRSNasAyujyadam ..
    en: With the eight-letter (8 syllables) mantra 'Om Namo Narayanaya', with the twelve-letter mantra 'Om Namo Bhagavate Vasudevaya', and chanting 'Hare Krishna, Rama', I always meditate on Sri Radha Krishna, the cosmic form, who rules and protects his devotees, and on Sri Krishna, who grants the eternal union with Sri Krishna.
    te: 'ఓం నమోనారాయణాయ అనే అష్టాక్షరి(8 అక్షరాల) మంత్రంతో, ఓం నమోభగవతే వాసుదేవాయ అనే ద్వాదశాక్షరితో, హరే కృష్ణ, రామ అంటూ, విశ్వరూపుడు, భక్త జనులను పాలించి రక్షించే శ్రీరాధాకృష్ణులను శాశ్వత మైన శ్రీకృష్ణసాయుజ్యమొసగే శ్రీ కృష్ణ దేవులను ఎపుడూ ధ్యానిస్తున్నాను.'
  - type: verse
    id: v102
    no: '102'
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam . skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam . mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi . zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam. (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: 'That Lord of all, Sri Mahavishnu, who gives all boons as Sri Venkateswara Swami, the visible God of Kali Yuga; Kumaraswami and his elder brother Vighneshwara; Narasimha Swami; Shiva; Sainath; Vishnu, the husband of Rama (Lakshmi); Hanuman; and Sri Rama, the cause of auspiciousness - keeping them in my mind, I meditate. To Sri Radha Krishna, the maker of Kali Yuga, the Lord of all the worlds, the giver of liberation, I bow my head and offer my obeisances.'
    te: 'ఆసర్వేశ్వరుడు, కలియుగ ప్రత్యక్ష దైవమైన శ్రీవేంకటేశ్వరస్వామి గా అన్నివరాల నిచ్చే శ్రీమహావిష్ణువును, కుమారస్వామి, వీరి అన్న గార్లైన విఘ్నేశ్వరుని, నరసింహస్వామిని, శివుని, సాయినాథుని,రమాపతి యగు విష్ణువును, హనుమంతుని, శుభములకు కారకుడైన శ్రీరాముని మనస్సులో నిలిపి, ధ్యానంచేస్తున్నాను. కలియుగ కర్త అయిన, విశ్వములన్నిటికివిభుడు, కైవల్య మొసగే శ్రీరాధా కృష్ణ దేవులకు తలవంచి నమస్కరిస్తున్నాను.'
  - type: verse
    id: v103
    no: '103'
    title: zrIkRSNa rakSA kavacam
    hk: |-
      oM taddevakInandanam, kArAgAra janitam, jagannATaka sUtradhAriNam . vAsudevam, bhakta sarvadam vizvarUpa pradarzinam muktidam nizIdhe yamunAmArge, nandagRha pravezikam, vande yazodAnanda gopAlam vizvazAntikaram . kSIrArtham, zizuhelayA, mAtRvakSojAMzuka, karSaNodyutakaraH zrI karaH kRSNassapuSNAtunaH .. (108 akSaramula kUrpu)
    en: That son of Devaki, born in a prison cell, who enchants the worlds with his Vishnu / Yogamaya, who runs lives as a gripping drama according to the fruits of each one's actions, the son of Vasudeva, who grants everything to his devotees, who even showed the cosmic form, the giver of liberation, who entered Nanda's house by the Yamuna path on a dark night, the son of Yashoda, the cowherd, who gives peace to the whole universe - that tiny little hand of Sri Krishna, which he raised to tug at his mother's sari end, stubbornly crying that he wanted milk, the giver of all auspiciousness - may it always protect me!
    te: 'ఆదేవకికొడుకు, చెరసాల లో జన్మించిన వాడు, లోకాలను తన విష్ణు / యోగమాయతో మోహింపజేసి, ఎవరి కర్మల ఫలానుసారం జీవితములు ఉత్కంఠతో నాటకముగా నడిపించేవాడు, వసుదేవుని పుత్రుడు, భక్తులకు అన్నీ ప్రసాదించేవాడుగా, విశ్వరూపాన్ని కూడ ప్రదర్శించినవాడు, మోక్షప్రదాత, చీకటి రాత్రిలో యమునానదీ మార్గంలో నందునింట ప్రవేశించిన వాడు, యశోదసుతుడు, ఆవులకాపరి, విశ్వమంతటికి శాంతినిచ్చే వాడు,పాలుకావాలని చిన్న పిల్లాడి మంకుతనం చేష్టతో తల్లి పైటకొంగు లాగటానికి పైకెత్తిన, శ్రీకృష్ణుని ఆ చిన్నారి చిట్టి చెయ్యి, అన్ని శుభములనిచ్చేది, నన్ను సదా రక్షించుచుండుగదా!'
  - type: verse
    id: v104
    no: '104'
    title: zrIkRSNadhyAna sarvasvam
    hk: |-
      oM . vedam zrIkRSNam, vedArtham zrIkRSNam, , vedAntam zrIkRSNam, vedavedAntargata daivam zrIkRSNam, nAdam zrIkRSNam, oM kAra nAdam zrIkRSNam, veNunAdam zrIkRSNam, pAJcajanya gItAnAdam zrIkRSNam dhyAnam zrIkRSNam yAgam yogam zrIkRSNam, vinodam zrIkRSNam, bhavabhayakhedachedanam zrIkRSNam . rAgam zrIkRSNam . anurAgam zrIkRSNam gAnam zrIkRSNam sAmagAnam zrIkRSNam hAsam zrIkRSNam rasalAsyam zrIkRSNam rAdhezam zrIkRSNam, jagadIzam zrIkRSNam . nATyam zrIkRSNam. jagannaTvaram zrIkRSNam mAyAjaganmohinam zrIkRSNam, naTarAjanRtyam zrIkRSNam . vANI vINA nAdAmRtam zrIkRSNam vamde, tam zrIkRSNam mamabhukti rakti zakti bhakti muktidam mumukSam zrIkRSNam dhanyam zrIkRSNa dhyAna jIvanam tathyam zrIkRSNa divyapAda zAzvata sAnnidhyam sAyujyam .. (daza gAyatri samAkSarI)
    en: All the Vedas, the meaning of the Vedas, the Vedanta literature that teaches detachment - the God hidden within the Vedas and Vedanta is Sri Krishna himself! Sound, the Omkara, the sound of the flute, the sound of Sri Krishna's conch called Panchajanya, the sound arising from the recitation of the Gita, meditation, yajnas and yagas, humorous conversations, witty remarks - all of these are the very acts of Sri Krishna that uproot the fear and sorrows of worldly life. The melody in a song, love, the musical note, the chanting of the Sama Veda, dance, the first playwright of the world, the one who took the form of the enchanting Mohini, the dance of Shiva, the veena music played by Saraswati, which is like nectar - all these are Sri Krishna - in all of these it is Sri Krishna. To such Sri Krishna, the God of gods pervading all the worlds, to the Lord of the universe, Sri Krishna, who gives me food, love, strength and devotion and who at the end of this life merges me into his feet, my constant salutations.
    te: 'వేదములన్నీ, వేదములకర్థము, వైరాగ్యము బోధించే వేదాంతసాహిత్యము, వేదవేదాంతములలో, నిబిడీకృతమైన దైవము శ్రీ కృష్ణుడే! శబ్దం, ఓంకారం, వేణుస్వరము, పాంచజన్య మనే శ్రీ కృష్ణుని శంఖపుధ్వని, గీతాఉచ్చారణ వల్ల కల్గిన శబ్దము, ధ్యానం, యజ్ఞ యాగములు, జరిపేహాస్యపు సంభాషణలు, చతురోక్తులు, ఇవన్నీ కూడా సంసారములోని భయము,వ్యధలను మొదలంటే సరికే సే శ్రీకృష్ణ చర్యలే. పాటలోని రాగము, ప్రేమ, స్వరము, సామవేదం చదవటం, నాట్యము, జగత్తులోని మొదటి నాటక కర్త, మాయాజగన్మోహినీ రూపం ధరించిన వాడు, శివుని నృత్యము, సరస్వతి చేసే వీణానాదం, అమృతం వంటిది. ఇవన్నీ శ్రీకృష్ణుడే - వీటన్నీటా శ్రీకృష్ణుడే. అటువంటి లోకమంతా వ్యాపించిన దేవదేవుడు శ్రీ కృష్ణునికి, నాకు తిండి, ప్రేమ, బలం, భక్తి ప్రసాదించి, యీజన్మాంతలో తన పాదములలో విలీనము చేసుకునే జగన్నాధులగు శ్రీకృష్ణ దైవమునకు సదావందనము.'
  - type: verse
    id: v105
    no: '105'
    title: zrIkRSNa sAyujya sAdhanam
    hk: ''
    en: The spiritual practice leading to union with Sri Krishna.
    te: ''
  - type: verse
    id: v105a
    no: 105a
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam . skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam . mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi . zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam. (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: The merciful one removes all my sins, and so that I need not bear from now on the fruits of all the actions done in all my births, he himself accepts them with boundless compassion, removes my fear, arranges everything, and at the end of this life grants liberation - to that Sri Krishna, my full prostration.
    te: 'దయామయుడు నాపాపములన్నీ పోగొట్టి, సర్వజన్మలలో చేసిన, అన్ని కర్మల ఫలితములు ఇటుపై నేను భరించ వలసిన అవసరం లేకుండా, అపారమైన కరుణతో తానే స్వీకరించి, భయం పోగొట్టి, అన్నీ అమర్చి, యీజన్మాంతంలో ముక్తినిచ్చే శ్రీకృష్ణునికి సాష్టాంగనమస్కారము.'
  - type: verse
    id: v105b
    no: 105b
    title: zrI zrIkRSNa AtmArpaNam
    hk: 'sarvadevezam sarvavizvezam sarvesarvadAzritassarvadam suzlokezam . yuga puruSam snigdhamohanAkAram patitoddhArakam oGkAra prakAzam . jagadgurum jyotisvarupam, dhyAyAmi satatam, tamIzam mehRdaya sthitam. sarvam samarpayAmi. AtmArpaNam kariSyAmi zrIkRSNam mamasAyujdam ..'
    en: The God of gods, the lord of all the worlds, who always protects all who take refuge in him, the husband of Sri Lakshmi, the Yuga Purusha (the best among all, in whatever age), shining with smiles, of an enchanting form, who has uplifted many who had fallen into ruin through their qualities, the radiance of the Omkara sound itself, the guru of all, that Lord who shines brilliantly in the form of a sacred flame and abides in my heart - Sri Krishna - I always meditate upon him. Along with myself, I place before his feet everything he has given me; he alone is the God who grants union with himself!
    te: 'దేవాదిదేవుడు, అన్నిలోకాలకు అధిపతి, ఎల్లపుడూ తనను ఆశ్రయించిన వారందర్నీ ఆదుకునేవాడు, శ్రీలక్ష్మీ నాథుడు, యుగపురుషుడు (ఏయుగంలోనైన, అందరిలో శ్రేష్ఠుడు) నవ్వులతో రాజిల్లే, పరవశింపజేసే రూపసి, ఎందరో గుణగణరీత్యా అధోగతి పాలైన వారిని ఉద్ధరించినవాడు, ఓంకార స్వరమునకే వెలుగుజిలుగు, అందరికీ గురువు, పవిత్రమైన దీపశిఖరూపంతో తళతళలాడే ఆయీశ్వరుడునాహృదయంలో నిలిచి యున్నవాడైన శ్రీకృష్ణుని ఎపుడూ ధ్యానిస్తున్నాను. నాతో సహా, వారు నాకిచ్చినవన్నీ, వారి పాదాల ముందుపెడుతున్నాను, సాయుజ్యం ఇచ్చే దైవం వీరేసుమా!'
  - type: verse
    id: v106
    no: '106'
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam . skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam . mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi . zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam. (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: The little child who smiles mischievously and plays pranks, the lotus of Sri Mahalakshmi's heart, remover of all faults, the eternal one whose dwelling is the water at the time of dissolution, the delighter of Radha's heart, a flow of melody born from his wondrous flute music, Hiranyagarbha - that is, the God of gods - my obeisance to Sri Krishna; he alone gives liberation to all, he alone is the worshipful God who makes me attain liberation - my salutations to such Mukunda.
    te: 'కొంటెగానవ్వుతూ చిలిపిచేష్టలు చేసేచిన్ని పాపడు, శ్రీమహాలక్ష్మీ హృదయ సరోజ మైనవాడు, సర్వదోషహారి, ప్రళయ కాలమున నీరు నివాసము గాగల శాశ్వతుడు, తన అద్భుతమైన వేణునాదము నుంచి జనించిన, రాగప్రవాహమైన రాధామనోరంజకుడు, హిరణ్యగర్భుడు - అనగా దేవాది దేవుడు, అగుశ్రీ కృష్ణునికి ప్రణామము, వారే సర్వులకు మోక్షమిచ్చేవాడు, నన్ను ముక్తిపొందునట్లు చేయు ఆరాధ్యదైవము వీరే, అట్టి ముకుందునికి వందనములు.'
  - type: verse
    id: v107
    no: '107'
    title: zvAsAntAzvAsam (tudi vinnapam)
    hk: |-
      dInadayALA . zrIkRSNadevA . dehi, me, takSaNa te divyapada sAyujyam zAzvatam ..
    en: Oh protector of the helpless! Sri Krishna! Right now, merge me eternally into your feet.
    te: 'దిక్కులేనివారిని రక్షించేవాడా! శ్రీకృష్ణా! ఇపుడే నాన్ను శాశ్వతంగా నీ పాదాలలో కలిపేసుకో'
  - type: verse
    id: v108
    no: '108'
    title: vizvamaGgaLam
    hk: |-
      maGgaLam narasimhAya, herambaH bAlAya, hanuma zrIrAmadattAya . gurvAdi nArAyaNaparabrahmAya, harihara zubhazrI devyaizca maGgaLam, sAyIzAzrita vatsalaH sadAzivasvarupAya maGgaLam . jagannAtha, deveza, lIlA vinodagopAla muktipradAya zrIrAdhAkRSNAya maGgaLam .. (108 akSaramula kUrpu)
    en: 'To Sri Narasimha Swami, to Ganesha, to Shanmukha, to Anjaneya, to Sri Rama, to Dattatreya, to Adi Narayana who is the Supreme Brahman, to Vishnu and Shiva, to Lakshmi, Gauri and the goddesses who give all auspiciousness, to Sai Baba, to Samba Sadashiva who cares for those who take refuge in him, to Jagannatha, the God of all gods, to Gopala Krishna of the playful sports, and to Sri Krishna Swami who gives liberation - may there always be auspiciousness! May there be well-being for all the worlds!'
    te: 'శ్రీనృసింహస్వామికి, గణేశునికి, షణ్ముఖునికి, ఆంజనేయునికి, శ్రీరామునికి,దత్తాత్రేయునికి, పరబ్రహ్మఅయిన ఆదినారయణునికి, విష్ణు,శివ,అన్ని మంగళాలనిచ్చే లక్ష్మీ, గౌరీ, దేవీలకు, సాయి బాబాకు, ఆశ్రయించిన వారిని ఆదరించేసాంబసదా శివునికి,జగన్నాధుడు,దేవులందరకు దేవుడు, లీలావినోదాలగోపాలకృష్ణునికి, మోక్షమిచ్చే శ్రీకృష్ణ స్వామికి ఎల్లపుడూ మంగళమగు గాక! అన్నిలోకాలకు శుభమగుగాక!'
  - type: verse
    id: v109
    no: '109'
    title: dhyAnAntara namovAkam
    hk: ''
    en: |-
      Concluding prayer upon meditation
    te: |
  - type: verse
    id: v109-1
    no: 109 (1)
    hk: oM vande vinAyakam kumAram vAyunandanam ca parandhAmam zrI raghu rAmam . brahmaviSNuzziva zrIdevI svarupa vaMzImohanam zrI rAdhA kRSNam mokSadam .
    en: Om, I bow to Lord Vinayaka (Ganesha), to Lord Kumara (Kartikeya), to the son of the wind-god (Hanuman), and to Sri Raghurama, the Supreme Abode. I bow unto Lord Radha-Krishna, the embodiment of Brahma, Vishnu, Shiva, and Sri Devi (the Divine Mother), who enchants all with His divine flute and bestows supreme liberation.
    te: 'గణేశునికి, సుబ్రహ్మణ్యనికి, హనుమకు, పరంధాముడైన శ్రీరామునికి, బ్రహ్మవిష్ణు, శివ, రాజరాజేశ్వరి, గాయత్రి అందరి స్త్రీపురుష స్వరూపువైన దేవులందరిని, తన విశ్వరూపంలో, ఇముడ్చుకున్న, వంశీ మోహన కృష్ణుడు, కైవల్య ప్రదుడైన శ్రీకృష్ణునికి వందనం.'
  - type: verse
    id: v109-2
    no: 109(2)
    hk: oM namo digdazA pradIpta praNava divyadhavaLa (prabhaJjana) prakAzam sundarezvaram . (zivam zivAnIzam somazekharam sarvezvaram sarvadam sarva rogaghnam ca ripughnam zAzvata sAyujyadam) zivam zivAnIzam zrIkRSNAnandamayam zambhum mama zrIkRSNa sAyujyadam ..
    en: Salutations to Mahadeva, the supreme lord who Illuminates all directions like Omkara, Embodies pure, radiant white light, Is adorned with serpents, Fills the universe with Sri Krishna's divine bliss, and Grants liberation to devotees.
    te: 'అన్ని దిక్కులు ప్రకాశింపజేసే ఓంకారం, పవిత్రమైన ధగధగమెరిసే తెలువు కాంతిజి గేళ్ళతో నిండిన అమితమైన అందగాడు, శివుడు, గౌరీపతి, శ్రీకృష్ణానందంతో నిండింపుండే దైవము, మాకు ముక్తి వరదుడు అగు మహాదేవునికి నమోవాకాలు.'
  - type: verse
    id: v110
    no: '110'
    title: phaNiphaNAgra zrIkRSNapadavinyAsam
    hk: |-
      duSTa zikSaNa vilakSaNa vilAsam . bAlakRSNa kathAzravaNam ca nAmagAnam dhRvam jIvanmuktidAyakam .

      sarvAparAdhAn kSamadhvam
      bhagavatprasAdam
      sarvam zrIrAdhAkRSNArpaNamastu
      zrIkRSNa zaraNAgataH lekhakaH
    en: The effortless dance of Sri Krishna's feet placed on the snake's hood (on Kaliya's head) is a novel way of punishing the wicked! By hearing the stories full of the sports of the darling Gopala Krishna, or by meditating on his names one by one, liberation is attained.
    te: 'పాముపడగ (కాళీయుని తలపై) నిలిపిన శ్రీకృష్ణుని పదముల అలవోక నృత్యము, దుష్టులను శిక్షించే వినూత్న పద్ధతి! ముద్దు గోపాల కృష్ణునిలీలలలో నిండిన కథలు విన్నా, పేరు పేరుగా ధ్యానంచేసినా ముక్తి కల్గుతుంది.'
  - type: verse
    id: v111
    no: '111'
    title: punaH zrIkRSNadhyAnam (navanamakam)
    hk: oM kAra svarUpam, oM kArAlaGkRtam, oM kAra jaTAjUTa dharam oM kAra nAdapriyam, oM kArIzvaram . oM kAratejam, oM kAra nAdAmRtAnandapradam, oM kArakSetrezvaram, oM trinetram . oM tripurAntakam, tripura sundarIzam, oM trailokyavandyam, oM oM zaGkaramIzvaram . oM zambhum, oM sAmbam, oM zivapaJcAkSari tapasvI prasannam, oM, oM satyam zivam sundaram, oM sadAvande, me sAyujyada zrI kRSNa vizvarupAntargata virUpAkSam zAzvatAnandadam .
    en: "His form is the Omkara, his ornament; the one with matted locks, who loves the sound of Omkara, lord of the Omkara kshetra, the radiance of Omkara, who gives bliss equal to the nectar of its sound, the three-eyed one, who slew the Tripurasuras, husband of Tripurasundari, worshipped by the three worlds - Shankara, Ishwara, Samba, Shambhu - he appears before you if worshipped with 'Om Namah Shivaya'. Virupaksha, the union of truth, equanimity and auspiciousness, giver of eternal joy - salutations to that Lord who is present within the cosmic form of Sri Krishna, the giver of liberation."
    te: 'ఓంకారము ఆకారము, అలంకరణ, జడలధారి, ఓంకార శబ్దమునిష్టపడే, ఓంకారక్షేత్రనాధుడు, ఓంకారపుతేజస్సు, దాని ధ్వని అనే అమృతముతోసమానమైన ఆనందం ఇచ్చే, మూడు కళ్ళవాడు, త్రిపురాసురులను చంపిన, త్రిపుర సుందరి భర్త, ముల్లోకాలు పూజించే, శంకరుడు, ఈశ్వరుడు, సాంబుడు, శంభుడు, “ఓంనమశ్శివాయ” తో ఉపాసిస్తే సాక్షాత్కరిస్తాడు. నిజము, సమత్వము, శుభముల కలయిక అగు విరూపాక్షుడు, శాశ్వతమైన సంతోషమిచ్చేవాడు, కైవల్యమిచ్చే శ్రీకృష్ణుని విశ్వరూపంలో నిబిడీకృతమైన స్వామికి నమస్కారములు.'
  - type: verse
    id: v112
    no: '112'
    hk: oM namo zrIkRSNAya vAstupumsAya, gRhAdhiSThAna devAyaca . kurusarvAriSTaharam, me, gRhe, sarvatramaGgaLam, lakSmI saha nityanivAsam, zrIkRSNAnandamayam ..
    en: Oh Sri Krishna! Vastu Purusha! God who stands as protector of the home! Make it so that Goddess Lakshmi stays steadfast in our house always, that you remain united with her always, that all auspiciousness comes about, and that it is full of Sri Krishna's bliss.
    te: 'ఓ శ్రీకృష్ణా! వాస్తుపురుషుడా! ఇంటికి రక్షణగా నిలిచే దైవమా! మా ఇంట ఎపుడూ లక్ష్మీదేవి స్థిరముగా వుండేలా, ఆమెతో నిత్యమూ కలిసినీవుంటూ, అన్ని శుభాలకలిగేటట్టు, శ్రీకృష్ణానందమయంగా చెయ్యి.'
  - type: verse
    id: v113
    no: '113'
    hk: |-
      hariNApi hareNApi brahmaNApi surendrapi . krodhakAntAprasannArtham
      pAdAkrAntAH nasaMzayaH hemArgadarsaka puruSottama zrIkRSNa . namonamaH.
    en: Harini, Deer, Brahma, and Indra (the king of gods); destroyer of anger, pleasant one, and he who casts away doubt from the mind - O Hemargha-darshaka (Revealer of golden paths), Purushottama, Sri Krishna - Salutations, salutations.
    te: ''
  - type: verse
    id: v114
    no: '114'
    hk: tam nakhazikha paryantamadbhata saundarya zobhitAGgam . zikhipiJchamauLim, mRdUmadhurahAsapradIptavadanam . khaluharam khANDavadahana kArakam, baliSTham, balarAmAnujam . akhaNDatejorAzim Adidaivam, zrIkRSNam, vande, me, mokSadam ..
    en: The beauty of limbs shining with immense loveliness from head to toe, the peacock feather on the head, the charm of the face shining with a lovely smile, the destroyer of the wicked, the cause of the burning of the Khandava forest, the immensely powerful, the younger brother of Balarama, an endless mass of radiance, the foremost of the gods - salutations to Sri Krishna, who gives me liberation.
    te: 'తలనించి కాలిగోటి వరకూ అమితమైన అందంతో వెలిగిపోయే అవయవాలసొంపు, తలలోని నెమలి కన్ను, చక్కటి చిరునవ్వుతో విరాజిల్లే మోము చందము, దుర్మార్గులను సంహరించే, ఖాండవవనం తగుల బడుటకు కారణమైనవాడు, అమితబలశాలి, బలరాముని తమ్ముడు, అంతులేని కాంతి పుంజం, మొదటి దేవులు, నాకు మోక్షమిచ్చే శ్రీకృష్ణునికి నమస్సులు.'
  - type: verse
    id: v115
    no: '115'
    hk: |-
      bAlakRSNam gopAlakRSNam rAdhAkRSNam rAsakrIDAkRSNam .
      dhyAyetsadAyoga kRSNam, lIlA kRSNam mokSadam, me, vaMzImohana kRSNam .
    en: Salutations to Sri Krishna - to Bala Krishna, the cowherd, the one who danced the dance of love with Radha, who gave the yoga knowledge of the Gita, the joy of play and song, who enchants listeners with the music of his flute, the giver of liberation.
    te: 'బాలకృష్ణునికి, ఆవులకాపరికి, రాధతో కలిసి, ప్రేమ నాట్యము సల్పిన వానికి, గీతా యోగవిద్యలనిచ్చిన, ఆటపాటల ఆనందుడు, మురళీగానంతో శ్రోతలను మంత్రముగ్ధులను చేసే, మోక్షప్రదాత శ్రీకృష్ణునికి వందనం.'
  - type: verse
    id: v116
    no: '116'
    hk: |-
      zrIkRSNadevaram halarAmAnujam, govardhanoddhArakam navanIta
      coram nanda nandanam gopIvastraharam duSTavanitAraJca phaNirAja bANAsuramardana madana gopAlam vana vihAralIlAvinodinam . ziSTastrImAnarakSakam bhArataraNasArathim vizvarUpam vizvajanAkarSaka vigraham . namAmi bhagavadgItA govindam muktimArgabodhakam mukundam vande, me, zrIkRSNam mokSadam ..
    en: Salutations to Sri Krishna Deva - the younger brother of Balarama, who held up the Govardhana mountain, protected the cows and cowherds, the butter thief, Nanda's son, the sly thief who carried off the gopikas' clothes, (who later saved Draupadi from dishonor by giving endless saris), who crushed those who strayed from dharma such as Kaliya and Banasura, who roamed Vrindavan with play and song and gave delight, the primal deity of the Bharata war, who assumed the cosmic form, the divinely beautiful one who can attract all the worlds, who showed the path of liberation through the Bhagavad Gita, the giver of my liberation.
    te: 'శ్రీకృష్ణదేవునికి, బలరామునికి చిన్నిసోదరుడు, గోవర్ధనగిరి నెత్తి, గో, గోపాలురను కాపాడిన, వెన్నదొంగ, నందుని సుతుడు, గోపికల బట్టలెత్తుకుపోయిన టక్కరిదొంగ, (తదుపరి మానభంగం కాకుండా అంతులేని చీరలిచ్చి ద్రౌపతిని కాపాడిన వాడు) కాళీయుడు, బాణాసురులు మొదలైన ధర్మము తప్పిన వారిని అణగ ద్రొక్కినవాడు, బృందావనంలో ఆటపాటలతో విహరించి ఆనందపరచినవాడు, భారతయుద్ధానికి మూలవిరాట్, విశ్వరూపం దాల్చిన, అన్ని లోకాలనూ ఆకర్షింపగల దివ్యసుందరుడు, భగద్గీత ద్వారా ముక్తి మార్గం చూపినవాడు, నామోక్షకారకుడైన శ్రీకృష్ణునికి వందనము.'
  - type: verse
    id: v117
    no: '117'
    hk: |-
      viSNum vizvavibhum virATa svarUpam vimalApatim virAjam
      vikramam . vizvAdhAram vijitAtmAnam vaSaTkAram vanamAlim, namo, zrIkRSNam, muktidam ..
    en: Salutations to Sri Krishna, who is Vishnu Murthy, lord of all the worlds, of the cosmic form, husband of Lakshmi, shining with strength and valor, the very support of the universe, the mighty champion, the ruler of the forests, the giver of liberation.
    te: 'విష్ణుమూర్తి, అన్నిలోకాలకు ప్రభువు, విరాట్ స్వరూపుడు, లక్ష్మీపతి, బలపరాక్రమాలతో శోభిల్లేవాడు, విశ్వానికే ఆధారభూతుడు, జగజ్జట్టి, వనములకు పాలకుడు, ముక్తినిచ్చే శ్రీకృష్ణునికి నమస్కారము.'
  - type: verse
    id: v118
    no: '118'
    title: nirmalatvam (zrIkRSNapadapIThikA)
    hk: |-
      vaTapatrazAyim vizvAtmAnam aGguSThakrIDAdbhuta lIlAbAlam zrIkRSNam harim zAzvatagm zivamacyutam. tam nArAyaNam zrImannArAyaNam ArtatrAyaparAyaNam AdinArAyaNam vande, zrIkRSNam sarvArthadam, me, zrIkRSNa caraNa vilInavaradam ..
    en: Floating on the water at the time of dissolution, on a banyan leaf, sucking the big toe of his right foot like an infant and delighting in it - the little boy, the eternal one, who himself is Shiva and Achyuta, who welcomes those who bow and pray 'protect us', who gives everything and at the end of this life grants liberation - a flower-offering of salutations to that Sri Krishna.
    te: 'ప్రళయకాలంలో నీటిపైన త్రేలియాడుతూ, మఱ్ఱి ఆకుమీద తన కుడికాలి బొటనవ్రేలును శిశు చేష్టగా చీకుతూ వినోదించే చిన్ని బాలుడు, శాశ్వతుడు, శివుడు, అచ్యుతుడూ తానైనవాడు, కావుమని మ్రొక్కేవారి నాదరించేవాడు, అన్నీ ఇచ్చి, యీ జన్మాంతంలో కైవల్యమిచ్చే శ్రీకృష్ణునికి నమస్సుమాంజలి.'
  - type: verse
    id: v119
    no: '119'
    hk: |-
      kaLyANakRSNam kamanIyarupam kAma janakam kAmitArthadam
      karuNA kRSNam kRSNasundaram . kRSNamAnarakSakam kRSNasArathim ca kRSNagItAcAryam tam zrIkRSNam vande me zrIkRSNakaivalyadam ..
    en: The giver of auspiciousness, a form pleasing to the eye, (the father of Manmatha) who creates desires and fulfills them, compassionate, shining with the hue of a dark blue cloud, protector of Draupadi's honor, charioteer of Arjuna, giver of the Bhagavad Gita, the cause of my liberation - salutations to Sri Krishna. (The name 'Krishna' belongs to Draupadi and to Arjuna also.)
    te: 'శుభములనిచ్చే కంటికింపైన రూపసి, (మన్మధుని తండ్రి) కోరికలు పుట్టించి వాటిని తీర్చేవాడు, కరుణామయుడు, నీలిమేఘవర్ణంతో మెరిసేవాడు, ద్రౌపదీ మానరక్షకుడు, అర్జునసారథి, భగవద్గీతా ప్రదాత నాకు మోక్షకారకుడు శ్రీకృష్ణునికి వందనం. (“కృష్ణ” అన్నపేరు ద్రౌపదికీ, అర్జునునికీ కూడ వున్నది.)'
  - type: verse
    id: v120-0
    no: 120 (0)
    hk: |-
      oM zrIlakSmI gaNeza sahita harezrI kRSNAya namaH. zrIkRSNa priyopaniSat (navakusumAH)

      (mantramulu "mahA devyaica vidmahe viSNupatnIca dhImIhi" vale paThiJcAli) ("mahA devyaica vidmahe viSNupatnIca dhImIhi" iva)
    en: Om, Salutations to Sri Lakshmi and Ganesha, and to Lord Sri Krishna. Sri Krishna's Beloved Upanishad (Nine blossoms of verse)
    te: ''
  - type: verse
    id: v120
    no: '120'
    hk: |-
      oM kSIra rAjakumArI ca vidmahe kSIra sandrazayana zrIkRSNa manoraJjanIca dhImahI .
      tanno akSaya aizvaryadA sadA zrIkRSNapada sevikA AdilakSmIH pracodayAt ..
    en: "(By the grace of an excellent guru's instruction) Ksheera Rajakumari: the daughter of the king of the milky ocean (Goddess Lakshmi) - Vidmahe: we come to know (her as the mother who gives all auspiciousness) - she, as the embodiment of love who delights the mind of Sri Krishna reclining on the milky ocean - Dheemahi: we meditate upon this Mother of the Universe who gives endless wealth, the fortunate one who always presses the feet of Sri Krishna - may she, Prachodayat: continue to inspire us to become those who meditate on the feet of Sri Krishna!"
    te: '(ఉత్కృష్టమైన గురూపదేశము వలన) క్షీరరాజకుమారి: పాలసముద్రుని కుమార్తె (లక్ష్మీదేవి) విద్మహే: తెలుసుకొనుచున్నాము (అన్ని శుభములనిచ్చేదే అమ్మయని) యీమె, పాలసముద్రం పై పవళించే శ్రీకృష్ణుని మనస్సును సంతోష పరిచే ప్రేమరూపిణిగా, ధీమహి: ధ్యానించు చున్నాము యీ విశ్వమాత అంతులేని సంపద నిచ్చేది, ఎల్లపుడు శ్రీకృష్ణుని చరణములోత్తుతూన్న భాగ్యశాలిని మమ్ము శ్రీకృష్ణ పదధ్యానమూర్తులుగా ప్రచోదయాత్: ప్రేరేపించుచునే యుండుగాక!'
  - type: verse
    id: v121
    no: '121'
    hk: |-
      oM ramA ramyA zivA hemA ca vidmahe, rAdhA kRSNa rAgarAgiNyai ca dhImahi .
      tanno ramAramaNa caraNa vilIna mArgadarzinIH pracodayAt..
    en: Om, We know Rama, the Beautiful, Shiva, the Golden One; We meditate on Radha, Krishna's passionate beloved; May she who reveals the path of merging into the lotus feet Of the Divine Lover (Rama's Beloved) Always inspire and guide us.
    te: ''
  - type: verse
    id: v122
    no: '122'
    hk: |-
      oM candra vadanAya vidmahe, candrasahodaryaica dhImahi .
      tanno zarazcandrakoTi prabhAsa, zrIkRSNa priyAH zyAmalAH pracodayAt ..
    en: Om, We know the one with a moon-like face; We meditate on the sibling of the moon; May the beloved of Sri Krishna, the dark-complexioned one, Inspire us with the radiance of millions of autumn moons.
    te: ''
  - type: verse
    id: v123
    no: '123'
    hk: |-
      oM zakti svarUpiNyaica vidmahe, bhaktAbhISTa varadAyinI ca dhImahi .
      tanno mukti pradamukunda zrIkRSNa hRdayAnandinIH pracodayAt..
    en: Om, We know the embodiment of Divine Energy; We meditate on the one who grants the desires of devotees; May she who brings joy to Krishna's heart, The bestower of liberation through Mukunda (Krishna), Always inspire and guide us.
    te: ''
  - type: verse
    id: v124
    no: '124'
    hk: |-
      oM sarvamaGgaLAya vidmahe, sarvazubhaparampara kAriNI ca dhImahi.
      tanno sarvasarveza zrIkRSNa sahavAsinIH pracodayAt ..
    en: Om, We know the One who embodies all auspiciousness; We meditate on the supreme creator of all that is blessed; May she who resides alongside Sri Krishna, The mistress of all lords and masters, Always inspire and guide us.
    te: ''
  - type: verse
    id: v125
    no: '125'
    hk: |-
      oM akhilaloka jananIca vidmahe, nikhilaloka zokavinAzinyaica dhImahi.
      tanno akhilANDezvarI apurupA suzlokA kRSNAH pracodayAt..
    en: Om, We know the One who embodies all auspiciousness; We meditate on the supreme creator of all that is blessed; May she who resides alongside Sri Krishna, The mistress of all lords and masters, Always inspire and guide us.
    te: ''
  - type: verse
    id: v126
    no: '126'
    hk: |-
      oM vidyAnAmna virAjitAya vidmahe vizvezvari vimalAdevyaica dhImahi.
      tanno vaiSNavI, kRSNaveNI, vANI, nArAyaNIH pracodayAt..
    en: Om, We know the one who is resplendent among all knowledge; We meditate on the immaculate Universal Goddess; May the Vaishnavi (Divine Feminine Principle), The companion of Krishna, The sacred voice of Narayana, Always inspire and guide us.
    te: ''
  - type: verse
    id: v127
    no: '127'
    hk: |-
      oM aSTavidhalakSmIH zca vidmahe, aSTaizvaryadAyinI zrI mahAlakSmI ca dhImahi .
      tanno aSTakaSTAdi sarvasaGkaTahAriNI zrIkRSNa ramaNIH pracodayAt..
    en: Om, We know Lakshmi who appears in 8 avataras; We meditate on Sri Mahalakshmi, the bestower of eight types of prosperity; May she who removes all obstacles and difficulties, The beloved of Sri Krishna, Always inspire and guide us.
    te: ''
  - type: verse
    id: v128
    no: '128'
    hk: |-
      oM gAyatri sAvitrI sarasvatI rupi sandhyA devyai ca vidmahe, mayA upAsitAdityAntargata tejazrI ca dhImahi .
      tanno zrIkRSNa hAsaharSitA zAntA mokSalakSmIH pracodayAta..
    en: Om, We know the form of Gayatri, Savitri, and Saraswati; We meditate on the Sandhya Goddess, whose radiant essence Is contained within the inner light of the Sun; May the serene Moksha Lakshmi, who delights in Krishna's smile, Always inspire and guide us.
    te: ''
  - type: section
    id: s03
    hk: namovAkam
    en: Obeisance
  - type: verse
    id: v129
    no: '129'
    hk: |-
      oM sarvAntaryAmi zrIhari iti vidmahe, sarvadhara sarvAdhAra sarvavararu zrImannArAyaNAya dhImahi .
      tanno devAdi deva mokSaprada zrIdhara zrIkRSNaH pracodayAt..
    en: ''
    te: ''
  - type: verse
    id: v130
    no: '130'
    hk: |-
      oM namo kRSNa namokRSNa zrIkRSNa kRSNa hare hare ..
      ..zrIkRSNa prasAdam..
      ..sarvam zrIkRSNArpaNamastu ..
      .. hariH oM tatsat..
    en: Om, Salutations to Krishna; Salutations again to Krishna; Sri Krishna, Krishna, Hari, Hari Sri Krishna's Grace May everything be offered to Sri Krishna Hari Om, That is the Truth.
    te: ''
  - type: section
    id: s04
    hk: 'puruSottamapadadhyAnam :'
    en: Meditation on the supreme state (or abode) of the Purushottama
  - type: verse
    id: v131
    no: '131'
    hk: |-
      zrIkRSNAya vAstupuMsAya, gRhAdhidevAya, vande,sarvAnugrahakArakAyaca.
      kurumamagRhalakSmI nilayam, zrIkRSNa hRdaya nandanam, sadA zAnti saubhAgya zobhitam ..
    en: Oh Lord Sri Krishna! In the form of Vastu Purusha you are the chief deity of the house and bless us in every way. Make our house an abode of Lakshmi, always shining with peace and prosperity, look after our house kindly and prepare it so that we can live in a way that pleases Sri Krishna's mind. My salutations to you.
    te: 'హే శ్రీకృష్ణదేవా! వాస్తు పురుషరూపంగా ఇంటికి ప్రధానదైవము, అన్ని విధాలా అనుగ్రహిస్తావు. లక్ష్మీనిలయముగా, ఎల్లపుడు శాంతి సౌభాగ్యాలతో శోభిల్లేటట్టుగా శ్రీకృష్ణుని మనస్సు హర్షించేటట్టుమేము ఉండగలిగేటట్లు, మా ఇంటిని చల్లగా చూడు, తయారు చెయ్యి. నీకు వందనం.'
  - type: verse
    id: v132
    no: '132'
    hk: |-
      tejassarojam zrIkRSNa prasAditam zrIkRSNa bhaktilaharIlAsyamaGgaLArAmam.
      tejazrI kRSNavAsam, bhavam, megRha, zrIkRSNahAsa prakAzamAnandadhAmam ..
    en: Like a radiant lotus flower, an auspicious dwelling that sways in the stream of devotion to Sri Krishna, so that Lakshmi and Sri Krishna always remain here - this house (where we live) is graciously bestowed by Sri Krishna as a heap of joy from his sweet smiles. The Lords Sri Krishna have made us blessed.
    te: 'ప్రకాశవంతమైన తామరపుష్పంలా, శ్రీకృష్ణుని భక్తి ప్రవాహంలో ఓలలాడే శుభనివాసం, లక్ష్మీ శ్రీకృష్ణులు ఎల్లపుడు నిలిచేటట్లు, శ్రీకృష్ణుని మధురమైన చిరునవ్వుల సంతోషాల ప్రోగుగా శ్రీకృష్ణులు అనుగ్రహించి ప్రసాదించినదీ ఇల్లు (మేము కాపురముండేది). ధన్యులను చేసినారు శ్రీకృష్ణవిభులు.'
  - type: section
    id: s05
    hk: vandanam vAsudeva zrIkRSNAya
    en: I bow down to Vasudeva Sri Krishna
  - type: verse
    id: v133
    no: '133'
    hk: |-
      zrIkRSNa nAma gAnam karomi punaH punaH .
      zrIkRSNa lIlAsmaraNam karomi punaH punaH .
      zrIkRSNabhaktasahavAsam karomi punaH punaH .
      zrIkRSNa padadhyAnam AjanmAntam karomi punaH punaH ..
    en: I will sing the many names of Sri Krishna again and again! I will recall Sri Krishna's mischievous deeds and the wonders he did effortlessly, again and again! Living together with Sri Krishna's devotees, I will meditate on Sri Krishna's feet throughout this life, again and again! I will live full of Sri Krishna's bliss, over and over with delight!
    te: 'శ్రీ కృష్ణుని పలునామాలు పాడుకుంటాను మళ్ళీ మళ్ళీ! శ్రీ కృష్ణుని చిలిపి చేష్టలు, అవలీలగా చేసిన అద్భుతములు తలచుకొంటాను మళ్ళీ మళ్ళీ! శ్రీ కృష్ణుని భక్తులతో కలిసి జీవినూ శ్రీ కృష్ణుని చరణములను యీజన్మంతా ధ్యానిస్తూంటాను మళ్ళీ మళ్ళీ! శ్రీ కృష్ణానందమయంగా బ్రతుకుతుంటాను తృళ్ళీ తృళ్లీ!!'
  - type: verse
    id: v134
    no: '134'
    hk: |-
      vande mAtaram pitaram agrajassarvam jyeSTham zreSTham vande .
      vande, asmat gurum zrIkRSNa padadhyAna kArakam .
      vande, vizvaguram zrIkRSNam karuNAmayam, vande .
      vande sadAlIlAkRSNam, sarvadam, asmat janmAnte mama zrIkRSNa kaivalyadam ..
    en: My salutations to the parents who gave us birth, to the parents of the universe, Rukmini and Radha Krishna, to all the excellent ones who were born before us, to the gurus who turned my mind, which was stamping about in irritation, toward meditation on Sri Krishna's feet, to Sri Krishna, the guru of all the worlds, to the compassionate one who always delights in his blissful play, to the infinitely merciful Vasudeva Sri Krishna.
    te: 'మాకు జన్మనిచ్చిన తల్లి దండ్రులకు, విశ్వజననీ జనకులు రుక్మిణీ రాధాకృష్ణులకు మాకంటే ముందు జన్మించిన ఉత్తములైన వారందరికీ, శ్రీ కృష్ణపద ధ్యానం వైపు, చికాకులతో చిందులు త్రొక్కే నామనస్సును మళ్ళించిన గురుదేవులకు, అన్నిలోకాలకు గురువైన శ్రీ కృష్ణులకు, కరుణా మయుడైన, ఎపుడూ చిద్విలాసాలతో వినోదించే వారికి, అనంత దయామయుడైన వాసుదేవ శ్రీ కృష్ణునికి ప్రణామము.'
  - type: verse
    id: u1
    no: ''
    title: manavi
    hk: |-
      cinmayAnanda zrIkRSNulu anugrahiJci tAnupaliki, yI
      ceta vrAyiJci nannu tarimpacesitiri.
    en: 'My prayer: May Sri Krishna, the embodiment of conscious bliss, bless me and, through His grace, write with this hand and carry me across (liberate me)'
    te: ''
  - type: verse
    id: u2
    no: ''
    hk: |-
      oM zrI mahAgaNAdhipataye namaH
      oM zrI rAma zrI kRSNa parabrahmaNe namaH
      zrI zrI zrI kRSNa - dAsa samvAdam
    en: |-
      Om, salutations to Sri Maha Ganadhipati (the great Lord of the Ganas, Ganesha)
      Om, salutations to Sri Rama, Sri Krishna, the Supreme Brahman
      This is the sacred dialogue between Sri Krishna,
      the infinite Lord of compassion,
      and his humble devotee, the servant who surrenders in love
    te: ''
  - type: verse
    id: v135A
    no: 135A
    hk: |-
      oM.. tailAbhyaGgana, saugandha, zobhita zubhAGgam, divya dhavaLa vastrAbharaNa zikhipiJchadharam .
      janmadivase mAtRvAtsalya pUrvaka, samarpita, svAdhiSTha bhojana, santuSTa varSa traya bAlakam.
      jananI hastasthita, hrasvasthUla zarIra zrIkRSNam pazya parihAsam karomiti - he pInakAya kRSNa . zlAghanIya .
      sthiraciruhAsavadana, zrI bhagavAnuvAca - pathavihIna arbhaka . tavarakSaNArtham sadA laGghanodyuktoham..
    en: 'With oil massage, fragrant, adorned with auspicious limbs, wearing divine white garments and a peacock feather crown. On his birthday, with maternal affection, the mother offers him his favorite food, satisfied with her three-year-old child. Holding him in her hands, seeing his short and stout body, Sri Krishna with a playful smile, says: "O plump Krishna, you are praiseworthy!" The blessed Lord responds: "O helpless child, I am always prepared to protect you."'
    te: ''
  - type: section
    id: s06
    hk: mamAparAdhakSamAkrozaH
    en: My cry (plea) for forgiveness of offenses
  - type: verse
    id: v136
    no: '136'
    hk: ariSadvargam mamAzritam, ahamkArAgrahapUritasvabhAvam . paranindAtmastutyAcaraNam, asatyamaya vAcAlatvam sarva sanmArgarahitam ca, svalpadaivacintana jIvanam. nAham kSamArhOpi, tvamananta dayAmaya deva iti, kSama . kSama . karuNA kRSNa . rakSa . rakSa . zrIrAdhAkRSNa .. - dehime, abhayam, aparAdhakSama, asmajanmAnte, tavazrIcaraNa sAyujyam , zrIkRSNAnandamayam, zAzvatam .
    en: "Desire, anger, greed, delusion, pride and jealousy always cling to me. My nature is full of arrogance and excessive anger. I keep praising myself while criticizing others. I am a source of lies, and talking too much is my habit. From whatever angle one looks, there is no good conduct in me. I think of God very little and spend life as I please. I am in no way worthy of being forgiven. Even so, Oh Lord Sri Krishna, since you are God full of endless compassion, with a nature that forgives any sinner, forgive me. Protect me, Oh Radha Krishna Deva! Remove my fear. Forgive all my faults and destroy my sin. At the end of this life, that is, the very moment I die, cancel the realm of Yama, the punishments and so on, merge me into your sacred feet, and make me always meditate on you and be immersed in endless bliss."
    te: 'కామ, క్రోధ, లోభ, మోహ, మద, మాత్సర్యాలు నన్నెపుడూ అంటి పెట్టుకునే వుంటాయి. దురహంకారము, అతికోపము నిండిన స్వభావము. ఇతరులను నిందిస్తూ నన్ను నేను పొగుడుకుంటూంటాను. అబద్ధాల పుట్టగా, అతివాగుడు అలవాటు. ఏవిధంగా చూసినా మంచి ప్రవర్తన లేదు. చాలా తక్కువగా భగవంతుణ్ణి తలుస్తూ జీవితం ఇష్టం వచ్చినట్లు గడిపేస్తూంటా. నేను ఎంత మాత్రం మన్నింపబడటాన్కి అర్హుణ్ణి కాదు. అయినా సరే, హే శ్రీ కృష్ణ విభో! నీవు అంతులేని కరుణతో నిండిన దైవము కనుక, ఎటువంటి పాపి నైన మన్నించే నైజం కలవాడివిగా, నన్ను క్షమించు. రక్షించు, ఓ రాధాకృష్ణదేవా! నాకు భయం పొగొట్టు. అన్ని తప్పుల్నీ మన్నించి పాపం నశింపజేయి. యీ జన్మాంతంలో, అంటే చనిపోయిన తక్షణం యమలోకం, శిక్షలు వగైరాలు రద్దుచేసి, శ్రీ చరణాలలో కలిపేసుకుని, ఎపుడూ నిన్ను ధ్యానించి, అంతులేని ఆనందంలో మునిగా వుండేలా చెయ్యి.'
  - type: verse
    id: v137
    no: '137'
    hk: |-
      oM zrI saurabharamyavarNa, suma, kisalaya latApariSvaGgA zvattha mUlasthitam . tacchayAcchAdi tavinA grISmatApa tejomayam prazAnta vadanam.
      vanavihAra gopAlam, muraLI nAdAmRtAnandapradam vizvamohanam. bhaktahRdayastham, rAdhezam, jagadrakSakam, vande me zrIkRSNam, kaivalyadam .
    en: Salutations to Sri Krishna, who stood at the foot of the peepal tree with its beautiful colors and fragrant flowers, entwined with tender-leafed creepers; of limitless radiance, who in the shade of that tree is untouched by the heat of the summer sun; whose mind is full of bliss free of all pains; the cowherd who roams in forest flower gardens, who gives joy and enchants all the worlds with the music of his wondrous divine flute, who lives in the minds of devotees, the lord of Radha, the protector of the universe, and the giver of liberation to me.
    te: 'అందమైన రంగు, సువాసనగల పూలతో, లేతచిగుళ్ళ తీగలతో, చుట్టుకున్న మ్రానుగల రావిచెట్టు మొదట నిల్చినవాడు, ఆచెట్టు నీడవల్ల వేసంగి ఎండబాధ లేకున్న అపరిమిత కాంతివంతుడు, ఏ వ్యధలు లేని ఆనందభావనగలనుదురు, అడవి పూల తోటలలో విహరించే ఆవుల కాపరి, తన అద్భుతమైన దివ్య వేణువు గానంతో ఆనందం ఇచ్చి అన్ని లోకాలనూ సమ్మోహన పరచేవాడు, భక్తుల మనస్సులలో మనుగడ, రాధానాథుడు, విశ్వమును రక్షించే వాడు అగు, నాకు మోక్షమొసగే శ్రీకృష్ణునికి నమస్కారం.'
  - type: verse
    id: v138
    no: '138'
    hk: |-
      sadAzivArAdhakam, sadAzivArAdhitam, sazivasvarupam, sadAziva svabhAvam.
      sadA zivAnandarAmam, sadA zivam ca viSNum, sadAzrita ssarvadam.
      sahasrassahasrassahasrAm sarazzirAzim, sahasra zIrarSam, sahasrAkSam, tam. sadAdhyAyAmi, yogezvaram, sarvadevezvaram, sadAdhyanezvaram zrIkRSNam, sadgurum, zrIkRSNa sAyujyadam .
    en: 'Salutations to Sri Krishna - who always worships Shiva and is worshipped by Shiva, whose way is to look on all equally, who always gives joy, Shiva and Vishnu who give everything to all who take refuge, the Sun shining with thousands upon thousands of rays, the Lord of yogis with a thousand heads and eyes, the lord of all gods, the presiding deity of the method of meditation, the supreme guru - and to the one who gives liberation to me, the seeker of liberation.'
    te: 'ఎపుడూ శివుని పూజించే, శివునిచే పూజింపబడే, అందర్నీ సమంగా చూసే పద్ధతి, ఎపుడూ ఆనందం కలిగించే, ఆశ్రయించిన వారందరికీ అన్నీ ఇచ్చే శివుడు, విష్ణువు, వేలవేల కిరణాలతో విరాజిల్లే వెలుగు ప్రోగుల సూర్యుడు, వేయి తలలు, కన్నులు గల యోగేశ్వరుడు, అందరి దేముళ్ళకు నాథుడు, ధ్యాన విధానమునకు అధిష్ఠానదైవము, ఉత్తమగురవు-శ్రీకృష్ణునికి, నాకు ముక్తినిచ్చే ముముక్షువుకు నమోవాకాలు.'
  - type: verse
    id: v139
    no: '139'
    hk: |-
      nityasatyatatva zrI kRSNamitrAbhilASiraham, nirantara dhyAnAnandasahitam .
      satyadevasAyajyada zrI kRSNa zaraNAzritam, sarvam zrIkRSNAnujJayA .. - svalambhavam mamazeSajIvitam, sulabham zrI kRSNa zaraNyapatha gamanam . sampUrNArogya pUritam ca, sarvesarvadA zrI kRSNa dhyAnabharitam . pAhi . pAhi . caGgalvadhAri . karuNAmaya, vizvarupa, zrI kRSNavAsudeva . muktiprada . dehi,me, asmat janmAnte zrI kRSNa caraNazAzvata sAyujyam..
    en: |-
      I seek only the friendship of Sri Krishna, whose very nature is always truth. Along with the divine bliss that comes from unobstructed meditation, I have begged for the refuge of Sri Krishna, the true Lord who gives liberation - all this is only with Sri Krishna's permission. May the rest of my life be very short! May I travel on the path of taking refuge in Sri Krishna without much toil! May I pass my time without any disease or trouble and always remain immersed in meditation on Sri Krishna! Oh you who wear a garland of fragrant flowers! Ocean of compassion! Son of Vasudeva, shining in the cosmic form! Giver of liberation! Sri Krishna! After I die, without any delay, immediately merge me into your sacred feet, and bless me to be always full of bliss, so that I am not born again and do not suffer the cycle of birth and death. Protect and guard me! I have trusted only you - according to your command, according to your grace.
    te: 'ఎల్లపుడూ సత్యమే స్వభావస్వరూపముగా గల శ్రీ కృష్ణునిదే స్నేహం కోరుకుంటా. అడ్డూ అదుపులేని ధ్యానమువల్ల కలిగే దివ్యానందంతో సహా, నిజమైన భగవంతుడు కైవల్యమిచ్చే శ్రీకృష్ణుని ఆశ్రయాన్ని యాచించా - ఇదంతా శ్రీకృష్ణుని అనుమతితోనే. నా మిగిలిన జీవితం చాలా తక్కువగుగాక! ఎక్కువ శ్రమ లేకుండా శ్రీకృష్ణుని ఆశ్రయించే మార్గంలో ప్రయాణింతును గాక! ఏ రోగం, రొచ్చు లేకుండా కాలక్షేపం చేస్తూ, ఎపుడూ శ్రీ కృష్ణుని ధ్యానంలో మునిగివుందును గాక! చంగల్వ పూలదండ ధరించిన వాడా! దయానముద్రుడా! విశ్వరూపంతో విలసిల్లే వసుదేవునికుమారా! ముక్తిని అనుగ్రహించే వాడా! శ్రీకృష్ణా! నేను చనిపోయిన అనంతరం ఎట్టి జాప్యం లేకుండా తక్షణం నీ శ్రీపాదములలో విలీనం చేసుకుని, తిరిగి, పుట్టి, చచ్చు రొచ్చు లేని విధంగా ఎల్లపుడూ ఆనందంతో నిండివుండేలా అనుగ్రహించు. కాచి రక్షించు! నిన్నే నమ్ముకున్నాను - నీ ఆజ్ఞానుసారం, నీ అనుగ్రహప్రకారం'
  - type: section
    id: s07
    hk: zrIkRSNamokSanandamayam
    en: Sri Krishna, who is liberation itself and filled with bliss
  - type: verse
    id: v140
    no: '140'
    title: zrIkRSNanivAsasthAnam
    hk: |-
      oM.. vasati, nahinahi, goloke, kapaTakarmiSThinAm, hRdayenica.
      nijabhaktAyatra, zrIkRSNa nAmAni gAyanti, tathyam, tatra zrIkRSNatiSThati ..
    en: Sri Krishna does not dwell in Goloka, the abode of bliss above all the worlds, nor in the minds of false worshippers. Wherever devotees sing his praises name by name, there, truly, the blue-eyed one, the abode of bliss, Sri Krishna is always present steadfastly.
    te: 'అన్ని లోకాలకన్న పైన, ఆనందనిలయమైన గోలోకంలో కాని, దొంగ ఆరాధకుల మనస్సులలో కాని, శ్రీకృష్ణుడు వుండడు. ఎక్కడెక్కడ తనను పేరుపేరునా స్తోత్రం చేస్తూ భక్తులు పాడుకుంటూంటారో, అక్కడ నిక్కముగా, నీలనయన, ఆనంద ధామ, శ్రీకృష్ణులు ఎల్లపుడూ స్థిరంగా వుంటారు.'
  - type: verse
    id: v141
    no: '141'
    title: zrI zrI kRSNa tatvAvagataH (mantram -nArAyaNAya vidmahe)
    hk: |-
      oM tatvasvarUpAya vidmahe, tulasImAlAdharAya dhImahi,
      tannotejomaya, zrIkRSNaH pracodayAt..
    en: I am praying (meditating) with a one-pointed mind to the one who is the very form of the Truth, whom I have come to know through the path of devotion, who wears a tulasi garland around his neck. May Sri Krishna with Kamalavati, a mass of radiance, always keep inspiring my meditation upon them!
    te: 'తత్వము యొక్క ఆకారమైనవారిని, భక్తి మార్గంలో తెలుసుకుని, తులసీ దండమెడలో వున్నవారిని ఏకాగ్రచిత్తంతో ప్రార్థిస్తూ (ధ్యానిస్తూ) న్నాను. ఆకాంతివుంజమైన కమలావతి శ్రీకృష్ణులు వారిపైని నాధ్యానమును నదా ప్రేరేపించుచునేయుందురు గాక!'
  - type: verse
    id: v142
    no: '142'
    title: zrIkRSNAmRta bIjAkSarI (bhajana kIrtana)
    hk: |-
      kRSNam kRSNam tejokRSNam zauryakRSNam kRSNam kRSNam.
      kRSNam kRSNam zizukRSNam satyakRSNam kRSNam kRSNam.
      kRSNam kRSNam bAlakRSNam lIlAkRSNam kRSNam kRSNam.
      kRSNam kRSNam bRndAkRSNam gopakRSNam kRSNam kRSNam.
      kRSNam kRSNam rAgakRSNam krIDAkRSNam kRSNam kRSNam.
      kRSNam kRSNam ramyakRSNam vamzIkRSNam kRSNam kRSNam.
      kRSNam kRSNam gItAkRSNam dhyAnakRSNam kRSNam kRSNam.
      kRSNam kRSNam rAmakRSNam rAdhAkRSNam kRSNam kRSNam.


      kRSNam kRSNam mohana kRSNam muraLIkRSNam kRSNam tANdava kRSNam zrIkRSNam .
      kRSNam kRSNam vandekRSNam kRSNam kRSNam karuNAkRSNam sAyujyadam zrI kRSNam ..
      namAmi nityam tam zrI kRSNam me kaivalyadam..
    en: "A song composed with the many names of Sri Krishna; free singing: after the Sri Krishna bhajan, salutations to them."
    te: 'శ్రీ కృష్ణుని పలునామాలతో కూర్చిన గీతిక; స్వేచ్ఛా గానం: శ్రీకృష్ణ భజన తర్వాత, వారికి నమస్కారములు.'
  - type: verse
    id: v143
    no: '143'
    title: zrIkRSNAnandAmRtamayam
    hk: |-
      tRptAnandam, nityAnandam, tapAnandam, AtmAnandam . vidyAnandam, vijJAnAnandam, jJAnAnandam, gurvAnandam, pUrNAnandam, vedAnandam, devAnandam, brahmAnandam, cidAnandam, sarvAnandam, satyAnandam, viSNvAnandam . sadAnandam, cinmayAnandam, paramAnandam, zivAnandam, karmAnandam raktyAnandam, lakSmyAnandam, sukhAnandam . bhogAnandam, bhAgyAnandam, dharmAnandam, gRhAnandam . dhyAnAnandam nAmagAnAnandam, zrI zrIkRSNa bhaktAnandam, mokSAnandam ..
      sRSTyAnandam, pAlanAnandam, layAnandam, jagatsarvam zrIkRSNAnanda mandiram . yogAnandam, saccidAnandam, tatsarvam zrI kRSNAnandAmRtamayam ..
    en: |-
      The experience of joy that comes from contentment is always bliss! What arises from penance is the rapture of knowing the Supreme Self within oneself! From learning comes satisfaction; the rapture of grasping the essence of learning; the comfort of discerning right from wrong; the guru's satisfaction that arises from imparting knowledge to proper disciples! The contentment that lacks nothing comes from reciting the Vedas; from understanding the divine principle comes knowledge of Brahman, and joy of the mind; looking at it all, the feeling that delights even Sri Mahavishnu comes from upholding truth: always, the joy that arises from inquiry and excellent spiritual practice is the great happiness that comes from understanding the Shiva principle. Through performing actions, through love and affection, through accomplishing what one intended, the happiness that arises is joy from comforts and from prosperity; by following prescribed dharma the householder is happy. By meditation (under various names) one attains liberation and gains endless joy - in the sustaining of creation, in the total wiping away at dissolution, in the transformations that occur in all the worlds - in all of these, bliss is blended together - Sri Krishnananda, a single abode of bliss - that is, the world itself is one dwelling of joy. What is concentrated in yoga, the union of purity and truths, one different form of bliss - all these are filled with the nectar of bliss that is the gift of Sri Krishna.
    te: 'తృప్తి వల్ల వచ్చే సంతోషపు అనుభవం, ఎపుడూ ఆనందమే! తపస్సు వల్ల కలిగేది తనలోని, పరమాత్మను తెలుసుకున్న పరవశం! చదువువల్ల సంతనము, చదువుల సారము గ్రహించిన పరవశత, తప్పొప్పుల గ్రహింపుతో హాయి, సరియైన శిష్యులకు విద్య బోధన వల్లే కల్గే గురువుగారి సంతనము! ఏ తక్కువ లేని తృప్తి, వేద పఠనం వల్ల వచ్చేది, దైవతత్వము అర్ధమగుట వల్ల కలిగే బ్రహ్మజ్ఞానము, మనస్సునకు ఉల్లాసము, అంతటాచూస్తే, సత్యపాలన వల్ల శ్రీ మహావిష్ణువుకే, మురిసిపాయే భావం: ఎపుడూ, జిజ్ఞాస, ఉత్కృష్టమైన సాధనతో కలిగే ఆనందం శివతత్వము అర్ధమగుటలో వచ్చిన మహాసంతోషము. కర్మలు చేయటం వల్ల, ప్రేమానురాగాల వల్ల, అనుకున్నది సాధించటం వల్ల, వచ్చేది సుఖంకలిగించే ఆనంధం సౌఖ్యాల వల్ల, ఐశ్వర్యాల వల్ల, విధితధర్మం ఆచరించటం వల్ల గృహస్థుడు ఆనందిస్తాడు.ధ్యానం చేయటం వల్ల, (వివిధ పేర్లతో) మోక్షముసాధించి, అంతులేని ఆనందం పొందుతాడు - సృష్టిలా పరిపాలనలో, ప్రళయంతో మొత్తం తుడిచిపెట్టెయ్యడంలో - అన్నిజగత్తులో జరిగే పరిమణామాలే - వీటన్నిటిలో కలబోసి ఉన్నది ఆనందం - ఒక మందిరంగాగల శ్రీ కృష్ణానందం- అంటే, లోకమే ఒక ఆనందపునిలయం. యోగంలో నిబిడీకృతమైనది, శౌచిత్వము సత్యముల సముదాయ మొక ఆనంద విభిన్న రూపము ఇవన్నీ కూడ శ్రీ కృష్ణుని ప్రసాదితము గాగల ఆనందపు అమృతముతో నిండివున్నది.'
  - type: section
    id: s08
    hk: zrIkRSNa kRpAdhArAmRtam
    en: The nectar-like stream of Sri Krishna's compassion
  - type: verse
    id: v144
    no: '144'
    hk: |-
      oM zrI padmalocanam, padmasundaram, padminI prANezam zrIkRSNam.
      paramadayALum, ca, parandhAmam, praNamAmi, me, paramapadam, zrI zrI kRSNam ..
      sadAzivArAdhakam, sadAzivArAdhitam, sadAzivAnandarAmam, sadAzivam ca viSNum sadAbhaktassarvadam. sahasrassahasrAm sarazzirAzim . sahasrazIrSam sahasrAkSam, tam, sadAdhAyAmi me zrI kRSNam, sAyujyadam ..
    en: Salutations to Sri Krishna - with beautiful eyes like a lotus flower, beauty itself, the husband of Goddess Lakshmi born in the lotus, infinitely compassionate, the Supreme Abode, who grants eternal residence in that supreme Sri Krishna Goloka. (The meaning of the remaining portion is given in song 138.)
    te: 'తామరపూవు వంటి సుందర మైనకనులు, సౌందర్యం, పద్మములో జన్మించిన లక్ష్మీదేవి భర్త, అనంతకరుణామయుడు, పరంధాముడు, ఆ అత్యున్నతమైన శ్రీ కృష్ణగోలోకమునశాశ్వతనివాస మొసగే, శ్రీకృష్ణునికి వందనం (మిగిలిన భాగమునకు భావము 138 గీతక లో ఇవ్వబడినది)'
  - type: verse
    id: v145
    no: '145'
    hk: |-
      zrI kRSNa mandasmita mukhaprakAzamananta koTi zazi prabhasamAnam .
      zrI kRSNa hastazthita navanItagoLam vizAla vizvAdhika dhanyamUrtiH
      zrI kRSNa karAravindastha muraLI svaram madhuram, vizvamohanakaram .
      zrI kRSNa bAlalIlAvinodam, yazodAnandamayam ca, jagatpramodakam ..
      nityam namAmi niratamArAdhayAmi, satatam smarAmi sadA dhyAyAmi me hRdayastham, dayALu, zrI kRSNam, mamasAyujyadam ..
      zrI kRSNa dhyAnam muktipradam, zrI kRSNanAmagAnam mokSakaram zrI kRSNakathA zravaNam sAyujyadam .
    en: "The face of the little Sri Krishna, who sheds a smile, is like the spread of countless crores of moons; the lump of butter in his hand - in this vast world it is the most fortunate - because it has reached his hand, and he will eat it! The sound of the flute in Sri Krishna's hands is very sweet and enchants all the worlds. Sri Krishna's tiny, mischievous little acts delight Yashoda and are a cause of joy to all the worlds; I salute him every day - I worship him constantly, always meditate on him, remember him - the compassionate Lord in my heart, Sri Krishna, who gives me liberation. Meditation on Sri Krishna, praising him with his many names, hearing the stories woven with his sports and wonders - all of these are able to grant liberation!"
    te: 'చిరునవ్వు చిందించే చిన్నారి శ్రీకృష్ణుని మోము అంతులేనికోటానుకోట్ల చంద్రుల సాగను, వారిచేతిలోనున్న వెన్న ముద్ద, విశాల జగత్తులో నే చాలా అదృష్టవంతురాలు - ఎందువల్లనంటే, వారి చేతజేరింది, వారు అరగిస్తారు! శ్రీకృష్ణుచేత వేణువుధ్వని అతితీపి, లోకాలన్నిటినీ సమ్మోహింపజేస్తుంది. శ్రీకృష్ణునిచిన్న తనపుచిలిపి చేష్టలు యశోదనుమురిపించి, అన్నిలోకాలకు సంతోషకారణము ప్రతిరోజు నమస్కరిస్తున్నా - నిరంతరం పూజిస్తున్నా, ఎపుడూ ధ్యానంచేస్తున్నా, జ్ఞప్తిచేసుకుంటున్నా, నాహృదయంలోని, కనికరించే స్వామి నాకు కైవల్యమిచ్చే శ్రీకృష్ణుని. శ్రీకృష్ణుని ధ్యానం, శ్రీకృష్ణుని పలునామలతో స్తోత్రంచెయ్యటం, వారిలీలలతో, మహత్తులతో కూర్చిన కథలు వినటం, ఇవన్నీ మోక్షంఇవ్వగలిగేవే!'
  - type: verse
    id: v146
    no: '146'
    title: zrIkRSNa mokSAmRtAkSari
    hk: |-
      zrIkRSNam vande, me mokSadam ..
      he zrI kRSNa . mokSa bhikSAndehi .. hare zrI kRSNa . mokSam dehi .
    en: Salutations to Sri Krishna, who gives me liberation. Oh Sri Krishna! Grant me liberation. Remover of sins, Sri Krishna! Give me kaivalya!
    te: 'నాకు మోక్షమిచ్చే శ్రీకృష్ణునికి నమస్కారం. ఓ శ్రీకృష్ణా! ముక్తి నినాకుముక్తి గావెయ్యి. పాపహారి శ్రీకృష్ణా ! కైవల్యమిమ్మా!'
  - type: verse
    id: v147
    no: '147'
    title: zrI kRSNa mAnasika darzanam
    hk: |-
      zrI kRSNam manasAdarzayAmi. zrI kRSNamanodarzanam divyAnandakaram, anantam, anirvacanIyam, adbhutam.

      zrI kRSNadarzanAnandastotram :
      trimUrtyaika rupAya, triguNAtIta devAya, trivikramAya devadevezvarAya - namonamaH maGgaLam . dazAvatAra dharAya, dazakaNTha harAya, dAzarathAya, vizvavaradAya, zrI rAmacandrAya - namonamaH maGgaLam. vizvezAya, vizvavaradAya, vizvavyAptAya, vizvarUpAya vAsudevAya, zrI rAdhezAya, rukmiNI prANezAya namo namaH maGgaLam . sadAzritavatsalAya sadAzivAya, yazodAnandakRSTAya sampUrNAvatArAya, mamazrI zrIkRSNA divyadarzanapradAya, zrI zrI kRSNasAyujyadAya mama, zrI zrI kRSNa AnandamUrtaye namo namo namaH maGgaLam - hare zrI kRSNa . mokSam dehI.
    en: I am able to see Sri Krishna with my mind - by his grace this experience is unprecedented, wonderful, a bringer of great joy, and gives endless bliss that cannot be expressed in words. In the joy of seeing him, I praise Lord Sri Krishna in this way. Oh you whose form is the unity of Brahma, Vishnu and Shiva! Oh God of gods, whom the qualities of sattva, rajas and tamas cannot approach! Oh matchless hero of the three worlds! Salutations! Victory to you! Oh you who took ten avatars! Oh Rama who destroyed the ten-headed Ravana! Oh giver of all that is desired to the beings of all the worlds! Salutations, victory! Oh ruler of all the worlds, giver of all boons! Oh you who pervade all the worlds, the cosmic form! Son of Vasudeva! Lord of Radha! Husband of Rukmini! Sri Krishna! Salutations, victory! Oh Purushottama, the most excellent incarnation, perfect and complete, who shows kindness and an equal eye to those who always take refuge in you, who delights Yashoda! Oh my worshipful God, who gave me your divine vision and who will merge me in yourself forever! Oh God of gods, bliss incarnate! Salutations, victory, victory, Om Sri Krishna! Grant me liberation!
    te: 'శ్రీకృష్ణునిమనస్సుతో చూడగలుగుతున్నాను - వారి అనుగ్రహ వల్ల యీఅనుభవం అపూర్వం, అద్భుతం, మహాసంతోష కారి, మాటలలో చెప్పలేని అంతము ఎరుగని ఆనందం కల్గిస్తుంది. వారిని చూసిన ఆనందంతో, శ్రీకృష్ణ భగవానుని, యీవిధంగా స్తోత్రం చేస్తున్నాను. బ్రహ్మ విష్ణుశివుల సమైక్యమైన ఆకారము గలవాడా! సత్వ, రజస్త మోగుణములు దరిచేరరాని దేవాది దేవా! ముల్లో కాలలో నూసాటిలేని శూరుడా! నమస్కారం! జయమగుగాక! పదిఅవతరాలెత్తిన వాడా! పది తలలరావణుని పరిమార్చినరామా! అన్నిలోకాలలోని వారికీ కోరినవన్నీ ఒసగేవాడా! నమస్కారం జయమగుగాక! అన్నిలోకాలకు పరిపాలకు డా! అన్నివరాలిచ్చేవాడా! అన్నిలోకాలలో,నిబిడీకృతమైన, విశ్వరూపుడా! వసుదేవుని పుత్రుడా! రాధానాధా! రుక్మిణి పతీ! శ్రీకృష్ణా! నమస్కారం జయమగుగాక! ఎపుడూ నిన్నాశ్రయించిన వారి మీద దయచూపే, నమంగా చూసే, యశోదకు సంతోషకారి, పరిపూర్ణ మైనపురుషోత్తమోత్తమ అవతారా! నాకు నీదివ్య దర్శనం ప్రసాదించిన, శాశ్వతంగా నీలోకలుపుకునే, నాఆరాధ్యదైవమా! ఆనందము మూర్తీభవించిన దేవదేవా! నమస్కారం జయం జయం, ఓం శ్రీకృష్ణా!నాకు ముక్తినిమ్ముసుమా!'
  - type: verse
    id: v148
    no: '148'
    title: jayamaGgaLa bharatAvAkyam
    hk: 'maGgaLam jaya maGgaLam sarvamaGgaLam vizvajayamaGgaLam ..'
    en: Victory, victory, completely! May there be victory in everything, for everyone, at all times, for the dwellers of all the worlds!
    te: 'జయం జయం పూర్తిగా! అన్నిటా అందరికీ అన్నివేళలా అన్నిలోకాలవాసులకూ జయమగుగాక!'
  - type: section
    id: s09
    hk: 'zrIkRSNa dhyAnaphalitam:'
    en: The fruit (result) of meditating on Sri Krishna
  - type: verse
    id: v149
    no: '149'
    hk: |-
      etatsarvam zrI kRSNAjJAnusAram zrI kRSNAnugraha prasAdam .
      zrI kRSNa lIlAgItA ssarvam, zrI kRSNa varapradAnam . zrI kRSNAnandamayam ca, zrI kRSNahAnaprakAzam . zrI rAthAkRSNadhyAna phalitam, zAzvata zrI kRSNa sAyujyam..
    en: "All these deeds, writings, songs and works, meditations, bhajans, play and song, and all the songs of Sri Krishna's leelas are what Sri Krishna has graciously granted! Chatting about Sri Krishna's leelas, drawing out affectionate melodies - all are boons given by him. Praying to the Lords Sri Radha Krishna, who are full of divine bliss, and whose smiles sprinkle brilliant light, so that there is no more rebirth, and merging as a part of their sacred feet - that is all! What else do I want beyond this, Kannayya! Keep on showing me mercy, indeed."
    te: 'యీచేతలు, వ్రాతలు, గీతాలా పనలు, ధ్యానములు, భజనలు, ఆటపాటలు, శ్రీకృష్ణ లీలాగానములన్నీ శ్రీకృష్ణులు అనుగ్రహించి దయ చేసినవే! శ్రీకృష్ణులలీలలు ముచ్చటించు కోవటం, మురిపెంగారాగాలు తియ్యటం, అన్నీ వారిచ్చినవరమే। వారిదివ్యానందమయమైన, చిరునవ్వుల వెలుగు జిలుగుల చిందులు, శ్రీరాధాకృష్ణ ప్రభువులను ప్రార్థించటం ఇక మరుజన్మ లేని విధంగా వారి పవిత్రపాదములలో అంశగా కలిసిపోవటమే! ఇంతకన్నా ఏదైనా నాకెందుకు కన్నయ్యా! నన్ను కరుణిస్తూంటూనేవుండు సుమీ ।'
  - type: verse
    id: u3
    no: ''
    hk: bhagavatprasAdam - sarvam zrI rAdhAkRSNArpaNamastu sarvAparAdhAna kSamadhvam mokSasAdhanamastu
    en: By the grace of the Lord - may everything be an offering to Sri Radha-Krishna. May all offenses be forgiven, and may this become the means to liberation
    te: ''
  - type: verse
    id: v150
    no: '150'
    title: zrI kRSNa kizoravilAsam
    hk: |-
      oM.. nandakizoram gopakizoram, vasukizoram, lazokizoram. bAlakizoram, gopAlakizoram, lIlAkizoram, rAgakizoram. nAdakizoram, nATyakizoram, bRndAkizoram brahmAnandakizoram. zrInRsimha kizoram, brahmANda kizoram, sadAvande, mokSadam me zrI kRSNam vizva kizoram ..
    en: "To the cowherd boy, the son of Vasudeva, the darling child of Goddess Yashoda, the charming child who is Nanda's son, the little lion cub, the cowherd, the tender little one, who delights with play and song, the sole embodiment of love, who sings songs, who dances, who roams in Vrindavan, the darling child who spread the bliss of Brahman through the Rasa dance, the one and only beloved child who remains in all the worlds even at the end of dissolution, child Mukunda who rests on the banyan leaf! Oh Lord Sri Krishna, Murali Mohana, the giver of liberation! My obeisances to you always!"
    te: 'గోపబాలుడు, వసుదేవసుతుడు, యశోదాదేవి ముద్దుబిడ్డ నందుని కుమారుడైన ముగ్ధబాలునికి, చిన్న సింహంపిల్ల, ఆవుల కాపరి, కోమలమైన చిన్నారి, ఆటపాటలతో మురిపించే, ప్రేమైక చిరుమూర్తి, పాటలు పాడే, నృత్యము నాడే, బృందావనవిహారి, రాసలీలద్వారా బ్రహ్మానందం పంచిన బుజ్జిబాబు, అన్నిలోకాలలో, ప్రళయాంతంలో, నిల్చిన ఏకైక ముద్దులమురిపాల బాల ముకుందవటపత్రశాయీ! శ్రీకృష్ణ ప్రభో । మోక్షమిచ్చే మురళీ మోహనా। వందనం నీకెల్లపుడూ!'
  - type: verse
    id: v151
    no: '151'
    title: zrI kRSNa tatva prakAzakam
    hk: |-
      nanukOlturubhaktulu, sadAtapasvisAmba zivunigA, zivapaJcAkSarito.
      nArAyaNAkSaryupAsakulu, viSNubhaktulu, tArakarAmadhyAnadhanyulu
      zrIrAma zaraNAgatuph tatvajJalu, nAnitya satyavizvamaya zrIkRSNunigA vAsu
      deva dvAdazAkSari japiJci tarintu, rituruliSTadevatAvigrahunigan ..
      sarvadevAzritula samamugacUtunu, sarvamamarci santasaparacEda |
      Artulu pazcAttAptulai, sthiracittulE", sarvezvarA | mAtappulumannimpumu.
      nIvedikkani, OkamArannacAlu, Abhayamicci Adukuni |
      sarvasaubhAgyamulu, janmAntamuna, mokSasAyujyamOsaGgEda,
      nizcayambugan, bhaktavazyuDanai ..
    en: O Lord Krishna, the devotees worship You always as Samba Shiva, with Shiva's Panchakshara mantra. Narayana's mantra worshippers, Vishnu devotees, and those blessed with Tarak Rama meditation have surrendered to Sri Rama's shelter. Those who know the truth, eternal and universal, worship You as Sri Krishna, chanting Vasudeva's twelve-syllable mantra, while also honoring their chosen deity. I see the peace of all divine beings, dedicating everything and bringing joy. Those with wounded hearts, filled with remorse, becoming steady-minded, O Supreme Lord, please forgive our mistakes. You are our sole refuge. Just one glance is enough. Grant us fearlessness and protection. You will bestow all auspiciousness, throughout life and ultimately liberation and divine union, this I firmly believe, for You are controlled by devotion.
    te: ''
  - type: verse
    id: v152
    no: '152'
    title: zrIkRSNa amRtopadezam - antyAdezam
    hk: |-
      nenu bhaktavazyuDanu, dhyAnamArgasulabhalabhyuDanu, veda, dAna, yajJa, japa, tapo,
      karmAnuSThAnAdi, bahuvidhamulugA nannArAdhiJcu bhaktulandari nI karuNintunu, vAri
      hRdayame, nAnijamaina zAzvatanivAsamu.
      zivapaJcAkSarI mantropAsanadvArA, nityatapasvisadAziva svarUpunigA, viSNu aSTAkSarIto,
      nAkaLyANamarUpamaina zrI lakSmi nArAyaNunigA, tArakarAmamantramuto,
      dazAvatAramulalo AdarzapuruSAvatAruDaina zrIrAmunigA, vAsudevadvAdazAkSarIto
      - vizvarUpa zrIkRSNunigA, leka, mare itara iSTa devatA vigrahunigA nAmagAnaJcesinA,
      ArAdhiJcinA, sarvadAprasannuDanu, kAni, Oka svarUpunigA ArAdhiJci,
      marorUpamunu dveSiJcu, ahaGkArulu a thogatipAlauduru.
      bhaktulandaruku, amRta bIjamainatOmmidi akSaramulasamudAyamaina - “navAkSari”
      oM.. zrI.. zivarAmakRSNAya namaH..
      anumantramunu prasAdiJcucunnAnu.
      upAsiJci, mokSasAdhakulaudurugAka !!!
      gamanika : nArAyaNuDanna nIru nivAsamugAgalavADani arthamu, zrI mahAviSNuvani
      cEbuduru. satyame vIrini, divyamaGgaLavigrahuDagu, sarvaloka antya praLayakAlamuna,
      vaTapatrazAyigA, krIDA bAlakRSNarUpunigA vinodiJcu, sarvasarvezvaruDu, zAzvatuDagu
      zrIzrI kRSNa paramAtmagA grahimpadagunu.
      zrImannArAyaNa aSTAkSarI mantropAsana bahuprItikaramu
    en: |-
      Sri Krishna’s divine and binding Guidance: I am controlled by devotion, easily accessible through meditation's path. Through Vedic practices, donations, sacrifices, chanting, penance, and ritual performances, I will show compassion to all devotees who worship me in numerous ways, and their heart is truly my eternal dwelling place.
      Through various paths of mantra worship, one can approach the Divine in multiple forms: As Sadashiva, the eternal ascetic; As Vishnu with the eight-syllable mantra; As Sri Lakshmi Narayana, embodying auspiciousness; As Sri Rama, the ideal avatar in the ten divine incarnations; As Sri Krishna, the universal form with the twelve-syllable Vasudeva mantra; Or through any chosen deity's form.
      However, a word of caution: those who worship one divine form while despising another, driven by ego, will fall into lower spiritual states. The text offers a profound nine-syllable mantra (Navakshari): OM SRI SHIVARAMAKRISHNAYA NAMAH.
      The ultimate guidance is to worship with devotion, seeking liberation.
    te: ''
  - type: verse
    id: v153
    no: '153'
    hk: |-
      oM mAm dhyAyanti, nija bhaktAH zivaH viSNuH zrIrAmaH
      vizvarupa vizvamaya, divyamaGgaLa vigraha, zrI kRSNaH gAyatrIH iti anekarupadaivaca. zivapaJcAkSari, nArAyaNASTAkSari tArakarAma, vAsudeva, dvadazAkSaryAdi upasakAH . samadarziraham, mayAzritassarva rakSakam ca kalausmaraNekamAtreNAbhayam, dadAmi, ihaloke sarvasampadAm, janmAnte zAzvata sAyujyam, bhaktavazyoham sadA. uttamam iSTa devatArAdhanam, narakapradam, parapakSadveSam, kurubhakti yogAbhAyAsam, zreyomokSArtham nityam . zivarAma kRSNAya namaH iti, mayAdatta, amRtabIja, navAkSarI japam, sarvo tkRSTam sarvamantrasAram ca zAntiH kaivalyadam ..
    en: Om, My devotees meditate on me as Shiva, Vishnu, Sri Rama as the Cosmic Form, Universal Being, Divine Auspicious Embodiment, Sri Krishna, and Gayatri in many divine forms. Those who worship Shiva's Five-Syllable Mantra, Narayana's Eight-Syllable Mantra, Taraka Rama, Vasudeva, Twelve-Syllable Mantras. I am equal-minded, a protector of those who seek me. By merely remembering me in Kali Yuga, I grant Fearlessness, All prosperity in this world, and Eternal liberation at life's end. The supreme worship of chosen deities Prevents hell, Avoids enmity toward others, and Cultivates devotion and yoga. For ultimate spiritual liberation, salutations to Shiva, Rama, Krishna! I offer the immortal seed, The Nine-Syllable Japa, and The essence of all mantras, Bringing peace and ultimate liberation.
    te: ''
  - type: section
    id: s10
    hk: 'mama vinnapam :'
    en: My humble request
  - type: verse
    id: v154
    no: '154'
    hk: |-
      bhavam mamajIvitaratham mameza zrIkRSNacoditam, dhanuJjaya sahitam dhanyam . satyazrIH zreyoprAptartham, ante zrIkRSNa caraNa zAzvata vilIna sidyartham ..
      zrI zrI kRSNamaGgaLahArati :
    en: May my life proceed without any ups and downs, smoothly, easily and on the straight path, guided by the Lord Sri Krishna together with Arjuna (Phalguna). May riches be given to me for my experience, and at the end of this life may I become merged in the footsteps of Sri Krishna!
    te: 'నా జీవితం ఎట్టి ఒడుదుడుకులు లేకుండా సజావుగా, సాఫిగా, ఋజుమార్గంలో, పల్గుణునితో సహా శ్రీకృష్ణ విభుని చేనిర్దేశింప బడి, సాగుగాక! ఐశ్వర్యములు, అనుభవమునకు ఇవ్వబడి, నాయీజన్మాంతములో శ్రీ కృష్ణుల అడుగులలో అంతర్లీనమౌదునుగాక!'
  - type: verse
    id: v155
    no: '155'
    hk: |-
      oM.. tejazrIzAya, zrImannArAyaNAya, svapAdAGguSTha
      cUpaNAnandalIlA bAlAyaca . taddevadevezAya, mameza zrIkRSNAya mokSapradAya, zAzvatAya, maGgaLam ..
      maGgaLam jayamaGgaLam . sarvamaGgaLam .
      sarvesarva janame jayamaGgaLam ..
      maGgaLam mahat zrI zrI zrI zrI zrI
      iti zrI kRSNa dhyAnagItAvaliH sarvam sampUrNam
      sarvAparAdhAn kSamadhvam
      bhagavatprasAtam
      sarvam zrI kRSNArpaNamastu
      hariH oM tatsat
    en: To the Lord of Kantimati, to the lotus-eyed one who has the water as his dwelling, to the little mischievous child who, in childhood play, sucks his own toe, to the God of gods, to my master, to the ever-abiding Lord Sri Krishna, always may there be auspiciousness, auspiciousness and victory, victory!
    te: 'కాంతిమతీనాధునికి, నీరు నివాసముగాగల నీరజాక్షునికి, బాల్యచేష్టగా, తనకు డిపాదంబొటనవ్రేలు చీకుకునే చిన్నారి చిలిపి పాపనికి, ఆదేవాదిదేవునికి, నాకు, అధిపతి, ఎపుడూ నిలిచివుండే శ్రీకృష్ణదేవేరులకు ఎల్లపుడు శుభం శుభంజయంజయం'
  - type: section
    id: s11
    hk: 'zrI kRSNAsAyUjya sAdhanam :'
    en: The means of attaining union with Sri Krishna
  - type: verse
    id: v156
    no: '156'
    hk: |-
      oM.. tejasvinam, tejazrIzam, tejaH puJjam, tejomayam, tejorAzim, tejorUpam, tejodhipam, tejasvantam .
      tamIzam, tanmayIzam, tatsarvezam, tatsarvArthadam .
      tapazyAmi, zrI zrI kRSNa AjJAnusAram nityam me, tANDava zrI kRSNam, zrI kRSNacaraNa sAyujyadam..

      namo kRSNa. namo kRSNa. kRSNa kRSNa. hare hare.
      hare kRSNa hare kRSNa kRSNa kRSNa hare hare .
      hare rAma. hare rAma. rAma rAma. hare hare.
      zivoham. zivoham. zivoham . zivoham .
      haroham . haroham . haroham . haroham .
      oM namazzivAya.
      oM namaH zrIrAmabhadrAya.
      oM namo nArAyaNAya
      oM namo bhagavate vAsudevAya.
      ..oM .. zrI .. zivarAma kRSNAya namaH ..
    en: 'The radiant one, the husband of Kantimati, a mass of light, full of light, whose very form is light, the master of light, to whom all light belongs, that Sri Krishna, the Lord of Lakshmi, the giver of everything: with devotion, through the permission granted by his grace, always, with dance, to our Sri Krishna, who delights the eyes and grants liberation, my obeisances at all times.'
    te: 'కాంతివంతుడు, కాంతిమతీపతి, కాంతిపుంజం,కాంతి మయుడు, కాంతియే ఆకారము, కాంతికి అధినాధుడు, కాంతి అంతా తన స్వంతమైనవాడు, ఆ శ్రీకృష్ణులు, లక్ష్మీనాథుడు, అన్నీ ఇచ్చేవాడు, శ్రీకృష్ణులను, వారి దయవల్ల ఇవ్వబడిన అనుజ్ఞవల్ల భక్తితో ఎపుడూ, నృత్యముతో నయనానందకర, కైవల్యప్రదుడు మాశ్రీకృష్ణునికి ఎల్లవేళలా నమస్సులు.'
  - type: verse
    id: v157
    no: '157'
    hk: |-
      oM sarveza zrIkRSNam zirazA namAmi.
      rukmiNIza zrIkRSNam manasA smarAmi.
      rAdheza zrIkRSNam niratamArAdhayAmi.
      satya zrIkRSNam aharnizam vandyAmi.
      parameza zrIkRSNam nirantaram pazyAmi.
      hRdayasthamama zrIkRSNam sadA dhyAyAmi.
      rAgamaya zrIkRSNam me sarvam samarpayAmi .

      sAyujyada zrIkRSNam mamAtmArpaNam kariSyAmi ..
      zrI kRSNapada dhyAnam - sarvesarvadA - zrIkR sAyujya sAdhanam ..
    en: |-
      I bow my head and offer obeisance to Sri Krishna, who gives prosperity to all. Heartfelt salutations to Sri Krishna, the husband of Rukmini; unbroken salutations to Radha Krishna. Greetings night and day to Sri Krishna, the lord of Satya. Prostrations always to the pure God of gods, Sri Krishna. I worship him in my heart. To Sri Krishna, the one embodiment of love, I dedicate everything that I have enjoyed so far as mine, which was given by him. To Sri Krishna, the bestower of liberation, I place my very self at his feet. Meditating on the feet of Sri Krishna with single-pointed attention, always, is the way to attain liberation.
    te: 'అందరకీ ఐశ్వర్య మిచ్చే శ్రీకృష్ణునికి తల వంచి వందనంచేస్తున్నాను. రుక్మిణి పతి శ్రీకృష్ణునికి మనసారా నమస్కారం రాధాకృష్ణునికి అవిచ్ఛంన్నంగా,నమోవాకాలు. సత్యానాధుడు శ్రీకృష్ణునికి రాత్రి, పగలు కూడ అభివంధనం. విశుద్ధదేవదేవ శ్రీకృష్ణునికి ఎల్లపుడూ దండాలు. నాహృదయంలో కొలుస్తూంటాను. ప్రేమైకమూర్తి శ్రీకృష్ణునికి వారిచ్చినవే నావిగాఇంత వరకూ అనుభవిస్తున్న వన్నీ అంకితంచేస్తున్నాను. కైవల్య కర శ్రీకృష్ణునికి ఆత్మనే వారి చరణముల చెంత వుంచేస్తున్నాను. శ్రీకృష్ణుని పాదాలను తదేకంగా, ఎపుడూ ధ్యానించడమే, ముక్తి పొందడానికి మార్గము.'
  - type: section
    id: s12
    hk: sarvam zrIkRSNArpaNa prakaraNam
    en: The principle (or teaching) of offering everything to Sri Krishna
  - type: verse
    id: v158
    no: '158'
    hk: |-
      zrI kRSNa preritam zrI kRSNasaGkalpitam zrI kRSNa bhASitam
      zrI kRSNaprasAditam. zrIkRSNa uddizyagAnam, zrIkRSNa upadezitam.
      zrI kRSNa prabhAvapUritam ca zrIkRSNa lIlAvinodaprakAzam.
      sarvasarveza, zrI kRSNamayamidam, zrI kRSNastotra sAhitya lakSmissarvam, mayAsaha, mama, sarvadA, sAyujyadA, mameza, zrIkRSNa caraNa, sarojArpaNam, karomi, kevalam zrIkRSNa kRpAkAraNAt ..
    en: |-
      Singing these songs about Sri Krishna, which Sri Krishna himself inspired, which he remembered and proclaimed and bestowed, is what he has asked me to do. All the stories of Sri Krishna's delightful, mischievous deeds, full of his greatness, are filled with the splendour of Sri Krishna. This heap of riches, the composition of these hymns to Sri Krishna, which he began through me, he blessed me with everything, and at the end of this life he will merge me into his sandals and grant me the boon of eternal residence; I offer all of it at the lotus feet of Sri Krishna. All this is only because of Sri Krishna's endless compassion!
    te: 'శ్రీకృష్ణులు ప్రేరేపించి, వారుతలుచుకొని ప్రవచించి, ప్రసాదించిన యీ శ్రీకృష్ణుని గూర్చిన గీతాలుపాడటం, వారుచెయ్య మన్నదే. శ్రీకృష్ణుని మహాత్యమునిండిన శ్రీకృష్ణులు జరిపిన ఆనందింపజేసే చిలిపి చేష్టల గాధాలన్నీ శ్రీ కృష్ణుని వైభవముతో నిండివున్నవి, యీ శ్రీకృష్ణుని స్తోత్రముల రచన అనే ఐశ్వర్యపు రాశిని నాతో మొదలు పెట్టి అన్నియును, నాకు అన్నీ అనుగ్రహించి, యీజన్మాంతంలో తన పాదుకులలో కలిపేసుకుని శాశ్వతంగాని వాసం వరంగాఇచ్చిన, శ్రీకృష్ణుల పాదపద్మములచెంత సమర్పించు చున్నాను, ఇదంతా శ్రీకృష్ణుల అనంతదయవల్లే సుమా!'
  - type: verse
    id: v159
    no: '159'
    hk: |-
      zrIkRSNacaraNam mamazaraNam ca sarvasvam,
      zrI kRSNa padadhyAnam zrI kRSNa nirdezita mamajIvitAlambanam.
      zrI kRSNabharita mama hRdayassarvam sarvadA zrI kRSNAnandamayam.
      zrI kRSNapAdAravindam me zAzvatAnanda nilayam ca mokSakSetram ..
      sadAvande me zrI kRSNam sarvadam zrI kRSNasAyujyadam.
    en: |-
      The feet of Sri Krishna alone are my refuge. They are everything! Meditation on Sri Krishna, as he has commanded as if drawing a line, is the support of my life. By his grace, my whole mind, where he dwells, is full of the bliss of Sri Krishna. The lotus feet of Sri Krishna are the place of liberation where I have been granted to dwell forever. Always offering all salutations, my obeisances again and again to Sri Krishna, who grants liberation.
    te: 'శ్రీకృష్ణుని పాదములే నాకుగతి. అన్నీ అవ్వే! శ్రీకృష్ణుల ధ్యానం, వారు గీతగీసినట్లుగా శాశించిన ప్రకారమే, నాబ్రతుక్కు ఆలంబనం. వారి అనుగ్రహంవల్ల వారు నివాసమున్న నా మనస్సంతా శ్రీకృష్ణానందమయం. శ్రీకృష్ణ పదకమలములు నేను శాశ్వతంగా నివసింప ననుగ్రహింపబడిన ముక్తి స్థానం. ఎపుడూ నమస్త మొసగి, మోక్షమిచ్చే శ్రీకృష్ణునికి నమోనమః'
  - type: verse
    id: v160
    no: '160'
    hk: |-
      a) zrIzrI kRSNacaitanyam
      zrI kRSNasAyujyasiddhi
      zrI kRSNasAyijyaprAptiki eDaDugulu
      a - zrI kRSNasAyujyasAdhanAsaGkalpam
      A - zrI kRSNa bhaginizrIdurgAmAtApAdAkrAntam
      i - zrI kRSNa lIlAgAna kIrtanam
      I - zrI kRSNapaJcAyatanapUjA
      u - zrI kRSNa mArgAnusaraNam
      U - zrI kRSNa AtmAnusandhAnam
      R - zrI kRSNAnugrahaprAptidvArA
      zrI kRSNasAyujyasiddhi:

      A) zrI kRSNasAyujvasiddhikarasaptapadi
      zrI kRSNasAyujyasAdhanAsaGkalpam
      mamopAttaduritakSayadvArA, sarvezazrIkRSNa prItyartham
      oM heramba, himajA, himAMzuzekharaziva,
      hiraNyagarbhahiriNmayIzanArAyaNapariveSTita,
      zrI kRSNapaJcAyatanapUjAGkariSye
      zrI kRSNammukhyam pUjayAmi
      zrI kRSNasAyujyArtham, zrI kRSNAnugrahAnusAram
      zrI kRSNAnujjayA.

      i) zrI kRSNabhagini yogamAya zrI durgAmAtApAdAkrAntam
      oM|| vandevizvamAtaram, vizvezvarahRda
      yezvarIm, vizvasundarIMvizAlAkSIm, nande |
      vandevizvazreyadAm, vizvarakSaDAm
      zivAm, zivAnIm, vizAradAm, vande,
      vaiSNavIm, vizvavaradAm !
      vande, vizvarUpa, sAyujyadamamArAdhya zrI kRSNa
      sodarIm, yogamAyAm zrI durgAdevIm, vande,
      vande vidyAdharIm, sarvamaGgaLakarIm, sandhyAde
      vIm, mamasarva rogahariNiJca,
      vande me, yIpsitassarvadAm ..

      I) zrI kRSNa lIlAkIrtanam
      oM harikRSNA . harekRSNA . namokRSNA . namAmi zrI kRSNA .
      zizu kRSNA . mAnasacora kRSNA .. bAlakRSNA . krIDAkRSNA .. nandakRSNA . yazodAnanda kRSNA ..
      muddu kRSNA . mukunda kRSNA .. gopIkRSNA . gopAla kRSNA ..
      kALIyavaradAkRSNA . kAmitArdhada zrIkRSNA .. muraLI kRSA . mugdhamanohara zrIkRSNa ..
      nATya kRSNA . naTvara kRSNA .. naLinI kRSNA . nagadhara kRSNA ..
      vamzIkRSNA . mohana kRSNA .. bRndA kRSNA . rAsalIlA kRSNA ..
      rAga kRSNA . rAdhA kRSNA .. gItA kRSNA . kRSNa sAradhi kRSNA ..
      devakIvasu kRSNA . vizvarUpa zrIkRSNA..
      sadAnanda kRSNA . sASTAGga vandanam zrIkRSNA ..
      sarvezvara zrIkRSNA . sAyujyamimmA zrIkRSNA ..
      harikRSNA . harekRSNA ..
      namo kRSNA . namAmi sadA zrI kRSNA ..

      u) zrI kRSNa paJcAyatanapUjA
      1)tam zrI karam sarvakAryanirvighnakaram
      gaNezaJca gajAnanam | zazivarNam,
      ekadantam herambam, zrI kRSNapriyam,
      prathamam namAmi ..
      2)zivAMzaktim zrI durgAm zrI devIm
      vidyAdharIm sarvamaGgaLAm |
      -nArAyaNIm nityAnandakarIm
      kRSNAm jagadambAnnamostute||
      3) razmimantam vivasvantam sahasramsum
      ravim raudrAdityam ca divAkaram .
      savitAruNArogyAdhipam bhAskaram sUryam, tam.
      zrI kRSNa nirdezita gagana vihArim,
      sadAnamAmi zrIrAma bhakta hanumadgurum grahAdhipam .
      sandhyAkAle trimurtisthAvaram gAyatrIdharam, karmasAkSim ca pratyakSadaivatam||
      4) satidharam phaNidharam zUladharam jaTA jUTa dharam ca gaGgAdharam vizvam bharam .
      zazidharam sampatkaram layakaram zivam vande, sadAzrI kRSNArAdhakam muktidam||
      5) rAdhezAya vizvamaGgaLa viSNurupa darzanapradAya
      zrI lakSmInArAyaNAya sadAbhakta varadAya ca vande, vaTapatrazayana,
      vizvamohana mugdhabAlAya, lIlAvinoda vAsudeva zrIkRSNAya, vizvarupAya, gItAyoga pradAya, sAyUjyadAya namonamaH

      U) zrI kRSNa caitanyam (zrI kRSNa margAnusaraNam)
      1) premayanna zrI kRSNuni pratirUpamu.
      ananta kSamAkaruNAdAnaguNa sammeLanamu.
      premaku paramArthamu andariyandu samabhAvamu.
      sarvamandunna zrI kRSNuni gurtiJci dInula seviJci tariJcuTa.
      pOgadtalanu tanaloni zrI kRSNAMzA sambhUtamaina jIvAtmaku, A zrI kRSNa paramAtma k, agAdhamU sRSTiJce agaDtagA bhAviJci, vinayamuga samhariJcuTa.
      AdhyAtmikamanna, prema pUrita zrI kRSNa bhagavadgItA sUktulananusariJci, svanta prayojanamunAzimpaka, vidhi dharmamulanAcariJcuTa.
      sarvakarmaphalamulanu zrI kRSNArpaNamu gAviJcuTa.
      2) amRtamu atimathuramanu nAnuDi anRtamani abbura paDunaTlu,
      ananta kRpA kRSNulu, AtmArAmulu, nA antarAtmayai vrAyan,
      AdeziJci, upadeziJci, prasAdiJcina, varasiddhipAyasamI zrI kRSNAnandamayavaijayantamu.
      3) mathurAdhipatigA thAmaya mathurAti mathurarasa sravantI tIrthamu.
      bRndAvana vihArIsparza dhanyapuNya samIramunAzvAdiJci, pulakiJci, upAsintu niratamu zrI kRSNAnugrahamuna.
      4) zrI kRSNa sAyujyamu zAzvatamuga labhimpagan.
      uttarAyaNaparalOkapAnthuniki mOkSamu tathyamaTa.
      dakSinAyamuna vaikuNTha ekAdazi nADu mAtrame, viSNupura dvAramu ter2aturaTa.
      sAkSAt sAyujyakara karuNamaya zrI kRSNa paramAtmuni parandhAmamuna dvAramulecaTa? dvArabandhamulEndu? lere dvArapAlakul sarvaloka pAlaka zrI kRSNa sannidhAnamunan
      dakSiNa nAyakuDu, dAkSiNya devuDu,
      dAsarakSakuDu, dazadizalandu dikkaina vADu,
      sadAdayAdRkkulu par2acaga,
      nAkela cinta paralokagatuDaguTakenADainan.
      lIlAkRSNulETulaina, dikkutocani nannutana sannidhikIDpuJcukOnipoyi,
      tama caraNamula cEntaku cera tIrtunani,
      zrI kRSNAnandamaya zAzvata zrI kRSNa sAyujyamitturani dRDhamuga nammitin


      e) zrI kRSNa caraNa vilInam
      (zrI kRSNAnugrahamu dvArA zrI kRSNa sAyujya siddhi)
      sarvezvaruNDu, sarvamandu tAnai, tAne sarvamaguvADu,
      satyadevuDu, sarvajJuDu, sarvakAlamulandu sthiruDu,
      sarvAzritavatsaluDu, smitavadanuDu, sthitaprajJuDu.
      sarvavaraduDu viriJci, hari sAmbazivuluga sRSTi sthiti laya kArakuDu sarvarakSakuDu.
      sarvamicci sAyujyamosagEDi tat sat cit sampUrNAvatAruDu Adi nArAyaNuDu Ananda dhAmuDu.
    en: |-
      To attain the pedestal of the feet of Sri Krishna, after the evil within me has been driven out and I have been uplifted, the practice I am doing, addressed to Sri Krishna, the Lord of all, for the love of Sri Krishna: I worship primarily the Lord Sri Krishna, seated with Ganesha, Uma the daughter of Himavan, Shiva who bears the moon on his head, and Brahma and Lakshmi-Narayana seated around him, as the Sri Krishna Panchayatana (the one surrounded by the above five deities). This is only according to Sri Krishna's gracious command!

      As the sister of Sri Krishna, Krishna's Yogamaya who incarnated, Mother Durga: I take refuge at her feet; she protects me so that I do not fall under the influence of illusion (maya). Mother! Mother of the world! Beloved queen of the Lord of the world! The one beauty of the world (Jagatsundari)! Kashi Vishalakshi (the goddess of wide eyes)! Protector of the worlds, giver of boons, Lakshmi, Parvati, Saraswati, the consort of Lord Vishnu shining in the universal form, the younger sister of Kannayya (Krishna) whom I worship! Yogamaya Durgadevi! Saraswati! Gauri! Sandhya Lakshmi! Goddess Sandhya, who dwells within the Sri Krishna Gayatri with which I perform Sandhya worship, goddess who uproots all my dullness, Mother who fulfils my desires! Obeisance! To you, many thousands of obeisances.

      It should be sung like a bhajan keertana; the meaning is easy to grasp, is it not!

      First obeisances to Ganesha, the cause of auspiciousness, who makes the undertaken tasks go on without hindrance, the handsome one like the moon, the one-tusked, the little god whom Sri Krishna loves.

      Lakshmi Shakti, Durga, Goddess Gayatri, Saraswati who bears knowledge, Gauri who gives all auspiciousness, the consort of Narayana, the one who always brings joy, Sri Krishna's sister, Mother of the world! Salutations.

      The Sun, a mass of a thousand rays, is praised by many names. He is the cause of good health for all of us, the lord of the nine planets, the teacher of Anjaneya. The orb of the Sun, which is the abode of the Trimurtis (Brahma, Vishnu, Shiva) in the three times of the day, is the abode of Goddess Gayatri. In the daily rite called Sandhyavandanam, the Trimurtis are worshipped as Goddess Gayatri: in the morning as Brahma, at noon as Shiva, in the evening in the form of Vishnu. Obeisances to such a Prabhakara (the Sun).

      Goddess Ganga on his head, the moon, matted locks, a trident in his hand, Ardhanarishvara, who bears the burden of all the worlds, who gives riches, who destroys everything at the time of dissolution: salutations to Parama Shiva, who worships Sri Krishna.

      Lord of Radha! Lakshmi Narayana, who gives darshan to devotees in the form of Vishnu as all-beautiful auspicious Sri! The little child of delightful, mischievous deeds, who always protects and saves devotees, who lies on a banyan leaf and floats on the water! Sri Krishna, son of Vasudeva! You display so many leelas and give joy. Mukunda, who shines in the universal form and gave us the Gita! Prostrations, Lord! Merciful one!
    te: |-
      శ్రీకృష్ణుల పదపీఠికాప్రాప్తికై నాలోని చెడుపాలద్రోలబడి, నేను ఉద్ధరింపబడినతదుపరి, అందరికీ ప్రభువగు శ్రీకృష్ణుని ఉద్దేశించి శ్రీకృష్ణ ప్రేమకై చేయుచున్న సాధన - గణేశుడు, హిమవంతుని కుమార్తె ఉమ, చంద్రుని శిరసున దాల్చిన శివుడు, బ్రహ్మ, లక్ష్మీనారాయణులు తనచుట్టూ ఆశీనులై వున్న శ్రీకృష్ణుని, శ్రీకృష్ణపంచాయ తనముగా (పై ఐదుగురు దేవతల చుట్టూగల) శ్రీకృష్ణుదేవులను ప్రధానంగా అర్చిస్తున్నాను, ఇదీ కేవలం శ్రీకృష్ణుని అనుగ్రహ పూర్వకమైన ఆజ్ఞానుసారమే।

      శ్రీకృష్ణునిసోదరిగా, అవతరించిన కృష్ణయోగమాయ, దుర్గామాత, పాదముల నాశ్రయిస్తున్నా ష్ణమాయా ప్రభావంలో పడకుండ వుండేందుకై ఆమె కాపాడుతోంది. తల్లీ! లోకమాతా! లోకేశ్వరుని హృదయరాణీ! లోకైకసుందరీ । (జగత్సుందరీ!) కాశివిశాలాక్షీ । (విశాలమైన కనులదేవీ) లోకములను రక్షించే, వరములిచ్చే, లక్ష్మీ పార్వతి, సరస్వతీ, విష్ణుదేవుని ఇల్లాలి విశ్వరూపంతో విరాజిల్లే, నేను కొలిచే కన్నయ్యచెల్లెమ్మా । యోగమాయాదుర్గాదేవీ ! సరస్వతీ । గౌరీ ! సంధ్యాలక్ష్మీ! నేను సంధ్యవార్చే శ్రీకృష్ణ గాయత్రీ అంతర్గతం గావుండే సంధ్యాదేవతా (నాకున్నఅన్ని జ్యాడ్యాలు ఊడబెరికేదైవతమా! నాకోరికల నీడేర్చేమాతా! వందనం! నీకనేకానేక వందన సహస్రం ।

      భజన కీర్తనలా పాడుకోవాలి భావము సులభగ్రాహ్యమేకదా!

      శుభములకు కారకుడు, తలపెట్టిన పనులను నిరాటంకంగా జరిపించేవాడు, చంద్రుని వంటి, అందగాడు, ఒక దంతంకల గణేశునికి శ్రీకృష్ణుడు ఇష్టపడే చిన్నారి దైవమునకు ప్రథమంగా వందనాలు.

      లక్ష్మీశక్తి, దుర్గ, గాయత్రీదేవి, విద్యలధరించిన సరస్వతి అన్నిమంగళాలనిచ్చేగౌరి, నారయణపత్ని, ఎపుడూ సంతోషముకల్గించేది, శ్రీకృష్ణసోదరి లోకమాతా! నమస్కారం.

      వేయికిరణాల సమూహం, సూర్యుడు బహునామాలతో స్తుతింపబడతాడు వీరే మనందరికి చక్కటి ఆరోగ్యానికి కారకుడు, నవగ్రహముల కధిపతి, ఆంజనేయునికి గురువు, మూడువేళల్లో త్రిమూర్తులకు నివాసముగా వుండే సూర్యమండలం గాయత్రీ దేవికి ఆవాసము, సంధ్యావందనమనే నిత్యకర్మలో త్రిమూర్తులు ప్రాద్దుట బ్రహ్మ, మధ్యాహ్నం శివుడు, సాయంత్రం విష్ణురూపంతో గాయత్రీ దేవిగా ఆరాధింపబడతారు. అటువంటి ప్రభాకరునికి నమస్సులు

      తలపై గంగాదేవి, చంద్రుడు, జటాజూటం, చేతశూలము, అర్ధనారీశ్వరుడు, లో కాలన్నిటి భారంవహించే, ఐశ్వర్యములనిచ్చే, ప్రళయకాలమున అన్నీనశింపజేసే శ్రీకృష్ణుని పూజించే పరమశివునికి నమోవాకములు.

      రాధానాధా। సర్వసుందరమైన శుభశ్రీగా విష్ణురూపంతో భక్తులకు దర్శనమిచ్చే లక్ష్మీ నారాయణా। ఎపుడూ భక్తులను బ్రోచి, రక్షించే, మఱ్ఱి ఆకుమీద,శయనించి, నీటతేలియాడే మురిపాల చిలిపిచేష్టల చిన్నారీ । వసుదేవ సుతశ్రీకృష్ణా! ఎన్నో లీలలు ప్రదర్శించి ఆనందింపచేస్తావు. విశ్వరూపంతో విరాజిల్లే, గీతను మాకిచ్చినముకుందా। దండాలయ్యా । దయామయా।
  - type: verse
    id: v161
    no: '161'
    title: muktAyamAna mukundamAlA
    hk: |-
      aho! atyadbhutam, AhlAdakaram, varNanAtIta manollAsakaram | ariSaDvargAdiroga sarvaripuharam
      ajJAnAndhavinAzakaram | zubhakaram zAntikaram, bhaktijJAna vairAgya uddIpanakaram, Amanda nandadam | zrIkRSNa smitavadana divyamanodarzanam
      sAdhyam zrIkRSNadhyAna pUrvaka zaraNA gatidvArA, sarvadam ante zrIkRSNa sAyujyakaram
    en: Ah! Wonderfully marvellous, delightful, bringing a joy beyond description. It destroys the diseases of the six inner enemies (desire, anger, greed, delusion, pride, envy) and all foes; it destroys the blindness of ignorance. It brings auspiciousness and peace, kindles devotion, knowledge and detachment, and gives unfailing bliss. The divine vision of Sri Krishna's smiling face is attainable through meditation on Sri Krishna and through surrender; in the end it gives union with Sri Krishna.
    te: 'అహో! ఎంత కనివిని ఎరుగని దృశ్యం! గుండెల్లో సంతోషం, వివరించి చెప్పలేని తృప్తింపు, అరు విరోధకరమైన గుణదోషాలు, మన శత్రువులను, తెలియని తన మనే, చీకటిని నశింపజేసి, మంచిని, శాంతిని, భక్తిజ్ఞానం కల్గించి, వ్యామోహాలు నశింపజేసి, అంతులేని ఆనందాన్నిచ్చేది, మనస్సుకు, ఏకాగ్రత ధ్యానం ద్వారా శ్రీకృష్ణభగవానుల దివ్యదర్శనము మానసికంగా సాధ్యమైనది. శ్రీకృష్ణులకు అనంతకోటి ప్రణామములు.'
  - type: verse
    id: v162
    no: '162'
    hk: |-
      aNvAdi brahma brahmANDaparyantam zrIkRSNAjJAnuvartiH sRSTissarvam, zrIkRSNamayam zrIkRSNAntargataJca.. tasyakiJcida vivyartham nAsti |
      tasyakiJcidapi akRSNannAsti ..
    en: From the atom up to Brahma and the whole universe, all creation follows Sri Krishna's command; the universe is full of manifestations of Sri Krishna and contained within Sri Krishna.  Nothing is useless, because there is nothing that is not Krishna.
    te: 'అణువు మొదలు సృష్టికర్త బ్రహ్మ సహితముగా సర్వ విశ్వములు శ్రీకృష్ణుని ఆజ్ఞకు లోబడి నడుచుకోవలసినవే! అన్నీ శ్రీకృష్ణుడే! అన్నిటా శ్రీకృష్ణుడే. ఏదీ పనికి మాలినది కాదు, ఎందువల్ల నంటే కృష్ణుడు కానిది, లేనిది ఏదీ ఎక్కడా లేదు.'
  - type: verse
    id: v163
    no: '163'
    hk: |-
      oM namAmi kRSNam nanda nandanam navanItacoram, nagadharam nAgazayanam zrIkRSNam . praNamAmi, kRSNam pArthasArathim pAJcajanyapANim,
      payaH priyam caparandhAmam zrIkRSNam. vandeharnizam kRSNam, viSNum vizvavaradam zrIkRSNam | bhajAmi bhavabhayaharam, bhaktavaradam
      muktipradam zrIkRSNam ..
    en: I bow to Krishna, the son of Nanda, the butter thief, the bearer of the mountain, the one who reclines on the serpent, Sri Krishna. I salute Krishna, Arjuna's charioteer, holding the Panchajanya conch, fond of milk, the supreme abode, Sri Krishna. I praise Krishna day and night, Vishnu, giver of boons to the world, Sri Krishna. I worship the remover of the fear of worldly life, the boon-giver to devotees, the bestower of liberation, Sri Krishna.
    te: 'నందుని కుమారుడు, వెన్న దొంగ, గోవర్ధన పర్వతం, శంఖం చేతబట్టిన, శేషశాయి, అర్జునుని రథసారథి, పాలన్న బహుప్రీతిగల ఆనందరూపం, అన్ని లోకాలను పాలించి రక్షించే విష్ణువు, సంసారభయాన్ని పోగొట్టి భక్తులకు వరము లిచ్చి , మోక్షమొసగే శ్రీకృష్ణునికి నమస్కరిస్తున్నాను.'
  - type: verse
    id: v164
    no: '164'
    hk: |-
      zrIkRSNuDu sarvAnanda nidhAnamu, sadA Ananda dhAmamu | zrIkRSNuni, nirdezamu sarvarasarAgaramya manoharamu. mokSakAma darzitamu . sarve sarvadA sarvavidha Azrita mandAramu! bhaktA bhISTapradadaivatamu sarvadA, sarvavarada sAyujyada satyanArAyaNa, lIlA bAla vinoda bharatimu. zrIkRSNahAsaprakAzatejo mayamu, bhaktimukti kArakamu..
    en: Lord Sri Krishna is the embodiment of all bliss, the above of eternal happiness. Lord Krishna's music filled with mellowness that steals the heart, shows the path of salvation. He is the wish-fulfilling tree in all ways at all times for all those who take refuge. One who is the fulfiller of desires for devotees, bestowers of all boons, bestower of liberation Satyanarayana. Filled with joyful childhood pastimes! Lord Krishna’s bright and effulgent smile is the bestower of devotion and liberation.
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v165
    no: '165'
    title: zrIkRSNuni govinodamu
    hk: |-
      tAnOkatuvvAyi vIpunEkki rayyi rayyina gantulu veyiJcucu, cilipi ceSTalu ceyuveLa, verOka legadUDa allaricedamu
      ramma"ni saigagA, tana kuDipAdamu nAku cuNDa, tanapai kONDEmulu gopakAntalu cEppagA-kopiJcina yazodamma tananu mandalimpagA
      nizzabdamugA nundunani, kapaTa zapathamugA tarjanini, cirupEdavulapai niDu, muddulu mUTagaTTu cinni gopAluni ciguruTAkuvaNTi
      cinnAri ciTTElaraceyi, abhayahastamai, sadA mammulanu kApADucuNDune yuNDugAka!
    en: 'While riding upon the back of a calf, making it prance swiftly this way and that in playful mischief; while another young calf licks His right foot as if beckoning Him, "Come, let us stir up more antics!"; when Mother Yashoda, enraged by the gopis bringing complaints against Him, scolds Him—placing His index finger upon His tender little lips in a feigned, innocent vow that He will remain utterly quiet-may that tender, leaf-soft little palm of the adorably charming child Gopala turn into a hand of blessing and protection, ever safeguarding us always!'
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v166
    no: '166'
    hk: |-
      navanItacora! nArIcora! nArI cIrAcora
      nArI prANacora nAga garvacora gopI mAnacora. gopikAmAnasa corA. kSIracorA rukmiNi cora. rAdhA hRdaya cora, raNacora |
      cANUraprANacora | ramaNIcora maNicaurya dUSi tapAJcajanyacora. pArijAtacora namo sarvapApa doSacora varada, zrIhari kRSNA .
    en: O Krishna! Stealer of butter! Stealer of the hearts of women! Stealer of the milkmaids' garments! Stealer of the lives of wicked women (like Putana)! Stealer of the pride of serpents (Kaliya)! Stealer of the ego of the Gopis! Stealer of the hearts and minds of the milkmaids! Stealer of milk! One who abducted Rukmini (to marry her)! Stealer of Radha’s heart! One who strategically fled the battlefield! Stealer of the life of Chanura! Enchanter and captivator of women! One falsely accused of stealing the Syamantaka jewel! One who seized the conch from Panchajana! One who took away the divine Parijata tree! O stealer and destroyer of all sins and faults! O giver of boons! O Lord Sri Hari Krishna, salutations unto You!
    te: 'ఓ శ్రీకృష్ణా! వెన్నను దొంగిలించినవాడా! స్త్రీల మనసులను దోచుకున్నవాడా! గోపికల వస్త్రాలను అపహరించినవాడా! పూతన వంటి రాక్షసి ప్రాణాలను హరించినవాడా! కాళియుడనే సర్పం యొక్క గర్వాన్ని అణచినవాడా! గోపికల అహంకారాన్ని, వారి మనసులను కొల్లగొట్టినవాడా! పాలను దొంగిలించినవాడా! రుక్మిణీదేవిని తోడ్కొని పోయినవాడా! రాధాదేవి హృదయాన్ని గెలుచుకున్నవాడా! రణరంగం వీడి వెళ్ళిన రణఛోడ్ రాయా! మల్లయోధుడైన చాణూరుని ప్రాణాలు తీసినవాడా! మనోహరమైన స్త్రీల చిత్తాన్ని దోచుకునేవాడా! శమంతకమణిని దొంగిలించాడనే నిందను మోసినవాడా! పాంచజన్యమనే శంఖాన్ని వశపరచుకున్నవాడా! ఇంద్రుని తోట నుండి పారిజాత వృక్షాన్ని తెచ్చినవాడా! భక్తుల సమస్త పాపాలను, దోషాలను హరించివేసేవాడా! భక్తులకు వరాలనిచ్చే ఓ శ్రీహరీ, శ్రీకృష్ణా! నీకు నమస్కారములు!'
  - type: verse
    id: v167
    no: '167'
    hk: |-
      oM mAtA | me, mAdhavI. mANikyavINApANI. makarakuNDala dharI |
      mahezvarIzcAdhika mamA rAdhyadevI mahIsama kSamAmayI, mamatAnu rAgajharI. mama, kArAnu rAgamayI, mama janmArtha mUlakAriNI,
      mA taramIzvarIm namostute |
    en: O my mother who gave me birth! Visible deity on earth, higher than Mahalakshmi, Saraswati, Parvati or Aditi. Crown-jewel of the most sacred women, whom I worship. Stream of love and affection, more patient than the earth. Mother among mothers, who made known to me the meaning of this birth of mine - countless millions of obeisances.
    te: 'ఓ, నా జన్మనిచ్చిన తల్లీ! శ్రీమహాలక్ష్మీ, సరస్వతీ, పార్వతీ, అదితి కన్న ఉన్నతమైన భూలోక ప్రత్యక్షదైవమా। నేను పూజించే పరమ పవిత్ర వనితా శిరోమణీ। ధరణి కన్న ఓర్పుగల్గిన ప్రేమానురాగవాహినీ। నా యీ జన్మకు అర్థము తెలిపిన అమ్మలగన్న అమ్మా! అనంతకోటి నమస్కారాలు.'
  - type: verse
    id: v168
    no: '168'
    hk: |-
      vidyAlayam prathame, dvitIyaJca granthAlayam, devAlayam tRtIyaJca vidyA vijJAna samupArjanaJca. mukti sAdhanArtham, nizcayam daivanirNItam bhuvim. mAtRparyaGkamArambhAt, samRddhi rapipAThazAlayoH. vidyasamupArjanama sampUrNam bhavati, vinA, anu nitya granthazodhanam..
      tasmAt jJAna bhANDAra granthAlaya saMvardhanam vidhIyate..
    en: Schools, libraries, and temples respectively are arrangements made by God in this world for human beings to acquire education, knowledge, and salvation. We should make our lives fruitful with their good use. A man who starts by gurgling in his mother's lap, no matter how much he studies and learns in schools, if he does not consult many relevant texts (reference books, etc.), will not gain knowledge. Therefore, libraries should be widely established and developed as repositories of knowledge. Thus we should make good use of the immeasurable wealth known as knowledge.
    te: 'తల్లిఒడిలో "ఊక్కూ-ఊంగా"ల తో మొదలైన మనిషి చదువు, పాఠశాలల్లో ఎంత నేర్చినప్పటికీ, ఎన్నో సంబంధిత గ్రంథాలు పరిశీలించకపోతే, విజ్ఞానం సమగ్రము కాదు. అందువలననే, జ్ఞానభాండారాలని ప్రసిద్ధి కెక్కిన, గ్రంథాలయాల్ని, విరివిగా స్థాపించాలి, అభివృద్ధి చేయాలి, సద్వినియోగం చేయాలి మన ధనం'
  - type: verse
    id: v169
    no: '169'
    hk: |-
      yogezvara zrIkRSNa prasAditam, zrIkRSNa prasAditam, sarvaroganivArakam. naraloke, sampUrNA nanda jIvanArtham, nityam zrIkRSNa vizvarUpa saundarya nandanam
    en: To avoid all diseases and live hale and healthy on earth, one must regularly practice yoga, as instructed by Lord Krishna. This is the advice of many experienced elders.
    te: 'అన్ని రోగాలు రాకుండా నివారించి, భూలోకంలో మానవులు పూర్తి ఆరోగ్యంగతో [?] ఆనందంగా జీవించడానికి, నిత్యం శ్రీకృష్ణులు ఉపదేశించిన యోగాభ్యాసం తప్పక చేయాలి. ఇది ఎందరో అనుభవజ్ఞులైన పెద్దల ఉపదేశము.'
  - type: verse
    id: v170
    no: '170'
    hk: |-
      oM. namaste astubhagavan vizva varada rukmiNIzAya satyAnandA pradAyya oM namo nArAyaNAya,
      oM namazzivAya, namo zrIrAmabhadrAya, namaH zivarAmakRSNAya, Om namo bhagavate vAsudevAya, ityaneka mantrarUpa pUjitAya, mamArogya rakSaka dhanvantari devAya oM, oM. oM namo vizvarUpAya, sadAnamo, mamArAdhya rAdhAmAdhava, zrIkRSNAya, gAna, lAsya, rAgalIlA vinoda
      mukundAya, mama yIpsi tassarvadA, sAyujyadA, yazodAnanda govinda gopAlAya, vaTapatrazayana, jaganmohana, Ananda
      bAlAya, tatsarva sarveza, zrIman zrIkRSNa prabhave, namo namaH .. zrIkRSNam vande jagadgurum, sarvadammesAyujyadam||
      he zrIkRSNabhagavAn| dehi,me, vAJchitassarvam, ante zAzvatahRdayAnandada, tavazrIcaraNa vilInam..
    en: |-
      The above can be recited as a mantra as in Srirudra Namakam or as a meditation song - a hymn praising and saluting our adoring Lord Sri Krishna with various names.
      Salutations unto You, O Divine Lord, Bestower of boons unto the entire universe, Consort of Rukmini, Bestower of the bliss of truth! Worshiped through numerous sacred mantras - "Om Namo Narayanaya", "Om Namah Shivaya", "Namo Sri Ramabhadraya", "Namah Shiva-Rama-Krishnaya", and "Om Namo Bhagavate Vasudevaya" - salutations unto the divine Lord Dhanvantari, the protector of my health. Salutations unto the Cosmic Form! Eternal salutations to my adorable deity Radha-Madhava, Sri Krishna; to Mukunda, who delights in song, graceful dance, divine melodies, and playful pastimes! Bestower of all my desires at all times, Granter of ultimate liberation, the joy of Mother Yashoda, Govinda, Gopala! To the one resting upon the banyan leaf, the Enchanter of the whole universe, the embodiment of divine bliss as the holy child! To the Lord of all, Supreme Ruler of everything, the glorious Lord Sri Krishna, salutations again and again! I bow to Sri Krishna, the Guru of the universe, who eternally grants me liberation. O Lord Sri Krishna! Bestow upon me all my heartfelt desires, and ultimately, grant me that eternal inner heart's bliss - complete absorption and eternal refuge at Your holy lotus feet.
    te: |-
      సమస్త లోకాలకు వరాలనిచ్చే దైవమా, రుక్మిణీ సమేతుడా, సత్యమైన ఆనందాన్ని ప్రసాదించే భగవంతుడా! నీకు నమస్కారము. "ఓం నమో నారాయణాయ", "ఓం నమశ్శివాయ", "నమో శ్రీరామభద్రాయ", "నమః శివరామకృష్ణాయ", "ఓం నమో భగవతే వాసుదేవాయ" వంటి అనేక పరమ పవిత్ర మంత్ర రూపాలచే నిత్యం పూజలందుకునేవాడా, నా ఆరోగ్య సంరక్షకుడైన ధన్వంతరి దేవా, నీకు ప్రణామాలు.
      సమస్త విశ్వమూ తన రూపంగా గల విశ్వరూపునికి ఓం నమో! నా ఆరాధ్య దైవమైన రాధా-మాధవునికి, శ్రీకృష్ణునికి సదా నమస్కారములు. గానం, నాట్యం, రాగాల లీలావినోదాల్లో విహరించే ముకుందునికి, నా కోర్కెలన్నింటినీ ఎల్లప్పుడూ తీరుస్తూ పరమ మోక్షాన్ని అనుగ్రహించేవానికి, యశోదమ్మ ఒడిని మురిపించే ఆనందగోవిందునికి, గోపాలునికి, వటపత్రశయనునికి, లోకాలను సమ్మోహనం చేసే ఆనందబాలకృష్ణునికి, సర్వస్వమూ తానే అయిన సర్వేశ్వరుడు, శ్రీకృష్ణ ప్రభువునకు పునః పునః నమస్కారాలు! జగద్గురువైన ఆ శ్రీకృష్ణునికి వందనం చేస్తున్నాను; ఆయన సదా నాకు సాయుజ్య ముక్తిని ప్రసాదించుగాక! ఓ శ్రీకృష్ణ భగవానుడా! నా సకల అభీష్టాలను నెరవేర్చి, అంత్యమున శాశ్వతమైన హృదయానందాన్నిచ్చే నీ దివ్య శ్రీచరణాలలో సంపూర్ణ శరణాగతిని, లీనమయ్యే భాగ్యాన్ని అనుగ్రహించుము.
  - type: verse
    id: v171
    no: '171'
    hk: |-
      oM.. jagadrakSakam jagadIzvaram jagajjanakam jagannAdham| jagatprabhum,
      jagadvaradam jagatsarvadam jagannATaka sUtra dhAriNam. jaganmohinIrUpadharam jaganmohanAkAram jagatsundarIzam | jagadAnandakArakam
      zrIkRSNam namAmi jagat jIvakoTi kaivalyadam
    en: Protector of the world, Lord of the world, father of the world, master of the universe, ruler of the world, giver of boons and of everything to the world, the one who holds the strings of the world-drama, who took the form of the world-enchanting woman (Mohini), who has the form that enchants the world, lord of the world's beauties, maker of the world's joy - I bow to Sri Krishna, who gives liberation to all the beings of the world.
    te: 'అన్ని లోకాలకు రక్షకుడు, ఐశ్వర్యాలిచ్చేవాడు, తండ్రి, అధిపతి, పాలకుడు, వరములిచ్చి అన్నీ అమర్చే, కపటనాటకనాయకుడు, పాలసముద్రమధన సమయంలో అతిలోకసుందరి రూపుదాల్చి రాక్షసులందరికీ మదమత్తెక్కించి, అందర్నీ పరవశింపచేసిన, సర్వలోక సుందరుడైన లక్ష్మీపతి, ఆనందకారకుడై, మోక్షమిచ్చే శ్రీకృష్ణునికి నమోవాకాలు.'
  - type: verse
    id: v172
    no: '172'
    hk: |-
      oM. nayA ce, suralokapAlanam, navApsarasAsukha lAlasam, . navitta, ramya, harmyeSu
      cittam, na, me, kiJcidanya masti | iyam sustanI muktimAninIcahastAt, sumAgIm, zubhAGgIm, zrIkRSNacaraNa sthira cAriNIm dadAtu .
    en: I do not ask for the possession of the heavenly world, or embrace of beautiful women, or wealth, or residence in palaces or any material desires. I only wish to have the hand of liberation which resides at the most auspicious divine lotus feet of Lord Sri Krishna.
    te: 'దేవాలోకాన్ని ఏలాలని గాని, దివ్యకాంతల పొందుకాని, ధనము భవనాలలో నివాసము కాని నేను అడుగను – నాకింకేదీ వద్దు. యీ శోభస్కరమైన తేజముగల, దివ్యాంగన, శ్రీకృష్ణ పాదుకలందు, ఎల్లపుడూ, సంచరించే, ముక్తి కాంత పాణి గ్రహణము కలగు జేయి చాలు.'
  - type: verse
    id: v173
    no: '173'
    hk: |-
      zravaNAnakSatrodbhavA, dugdhassarvadagA, dagaddhaga dhagaddhagA yadedIpyamAna divyarUpa bAlA. vizva nirdezitA. vizAlanetrA vizvamAtA! he viSNu
      sahodarI, mUlAtArA rAjitA. jaganmUlAdhArA. zAradA zyAmalA zaila jANAm zubhAMzA, zrIdurgA. namostudevI. namo nama, mama yIpsita ssarvadAyinI, varade, sarvamaGgaLA. siddhirbhavatu, me, sarve sarvadA!
    en: O Mother of the Universe with broad, graceful eyes, who incarnated under the star Shravana, who burns away all sorrows and tribulations, and whose form radiates with glittering divine effulgence! Assuming the form of an innocent little girl, You hold sway over all the worlds. O Yogamaya, beloved sister of Lord Vishnu! Radiant like the star Moola, You are the supreme primal foundation of all cosmic realms and elements; the tender, exquisite embodiment integrating the divine aspects of the holy Trinity of Goddesses - O Mother Sri Durga! Salutations and reverent homage unto the Mother who fulfills all my desires and bestows all auspiciousness.
    te: 'శ్రవణానక్షత్రమునాడు అవతరించి, అన్ని వెతలను దహించి వేసే, తళతళా మెరిసిపోయే దివ్యతేజో రూపిణి, చిన్న పాపలా ఆకారం దాల్చి, అన్ని లోకాలను శాసించే, విశాలమైన కన్నులుగల లోకమాతా। విష్ణుమూర్తి అనుంగు చెల్లెలైన యోగమాయా। మూలానక్షత్రంతో ప్రకాశించే, అన్నిలోకాలకూ, మూలాలకు, ఆధార భూతమైన, మువ్వరమ్మల అంశలతో కూడుకున్న కోమలీ, శ్రీదుర్గామాత! నా కోరికలన్నీ తీర్చే, శుభములు కల్గించే తల్లికి నమోవాకాలు.'
  - type: verse
    id: v174
    no: '174'
    hk: |-
      akhila lokAzcaryakara, sarvajanAkarSaka, susmita vadanA ravinda madana gopAlam | AdinArAyaNam, ArtatrANaparAyaNam, anurAgamaya mAtmArAma, mAnandadhAmam vAsudevam,
      vizvarUpam, rAdhA sahaDolAlAsya lIlA vinodinam, bhaktavazyam zrIkRSNam! tam vande, sarvasarvezvaram, bhaktijJAna, dhyAna vidyAmaya!
      mokSasAdhanagItA pracAram, abhaya dam, memukti dam||
    en: I bow to Madanagopala, whose lotus-like smiling face enchants everyone and fills all worlds with wonder; the primordial deity whose abode is the waters; the embodiment of pure love who rescues those crying out in distress; the personification of divine bliss; the son of Vasudeva; the one who contains the entire cosmos within Himself; the playful lord who sways delightfully on a swing along with Radha; and the one who willingly surrenders to His devotees. Salutations unto the supreme Lord of lords, the manifest Para-Brahman Sri Krishna, who bestows the Bhagavad Gita - the guide to liberation that teaches devotion, knowledge, and meditation - dispels all fears, and grants complete absorption into the divine.
    te: 'అన్ని లోకాలు ఆశ్చర్యపోయే, అందర్నీ ఆకర్షించే, చిరునవ్వుల పద్మము వంటి ముఖము గల మదనగోపాలుడు, నీరు నివసమైన ఆదిదేవులు, బాధలతో ఆక్రోశించేవారిని ఆదుకునే ప్రేమమూర్తి, ఆనంద స్వరూపుడు, వసుదేవుని కుమారుడు, జగత్తు తనలో ఇముడ్చుకున్న, రాధా సహితంగా తూగుటుయ్యాల లూగే లీలావినోది, భక్తులకు వశుడైన వానికి, నమస్కరిస్తున్నాను. దేవాదిదేవులు, భక్తి, జ్ఞానము, ధ్యానములను ప్రబోధించే, మోక్ష మార్గదర్శిని భగవద్గీతను ప్రసాదించి భయములు పోగొట్టి, సాయుజ్యమిచ్చే సాక్షాత్ శ్రీకృష్ణపరబ్రహ్మకు దండములు.'
  - type: verse
    id: v175
    no: '175'
    hk: |-
      zazAGkA, gomAtA madhyasthasthita meghazyAma sundaram, kapilavatsalAlana karakamala kamanIyam | mugdhamadhura smita mukhAravindam, madanagopAlam, bRndAvihAra, lIlA mAnuSavigraham| vande, yazodAnandagovindam, devakI vasudeva sutam, deva devezvaram, murArim, mAdhavam, nandabAlam, bhajAmi, AnandarAmam, mameza
      zrIkRSNam, zrIkRSNa dAsyAnandavarapradAram, ante zrIkRSNa padakaivalya dam..
    en: Like the orb of the full moon shining in the sky, standing gracefully amidst nearby cows radiant as Lakshmi, He is the dark cloud-hued charmer; with a smiling countenance as He caresses a tender calf with His delicate, gentle hand; the mischievous performer who wanders freely in Vrindavana as Madanagopala; the darling son of Yashoda and the son of Devaki and Vasudeva who brings delight to the cattle; the Supreme God above all deities, the slayer of demon Mura, the beloved Lord of Sri, Gopala, the very abode of divine bliss - I worship my Lord Sri Krishna and His consorts with hymns and devotion. May He bestow upon me the matchless boon of service unto Sri Krishna, merging me into Himself at the end of this lifetime. Salutations unto Him again and again!
    te: 'ఆకాశములో నున్న చంద్రబింబము, సమీపములోని గోమాలక్ష్మీ మధ్య నిలచిన నీలిమబ్బురంగుల అందగాడు, తన సుకుమారమైన చేతితో లేగదూడను లాలిస్తూన్న చిరునగవువెలిగే వదనం, మదనగోపాలుడై బృందావనంలో స్వేచ్ఛా విహారంచేసే అల్లరినటకుడు, యశోదకొడుకు, ఆవులను ఆనంద పరచే, దేవకీవసుదేవ కుమారుడు, దేవుళ్ళందరికీ దేముడు, మురా విరోధి, శ్రియః కాంతుడు, గోపాలుని, ఆనందనిలయుని నా స్వామి శ్రీకృష్ణదేవేరులను భజనలతో కొలుస్తున్నాను. వారు శ్రీకృష్ణసేవ అనే అపూర్వవరమొసగి, యీ జన్మాంతంలో తనలో ఐక్యం చేసుకుంటున్నారు. తిరిగి తిరిగి నమస్కారాలు.'
  - type: verse
    id: v176
    no: '176'
    hk: |-
      vande dhenur dugdhapriyam, navanItahastam, dugdha ssarvaharam, sarvesarvadA Azritavatsalam, deva devezam, zrIdharam. vande, paya sA udhasvatI, gosam vAhana madhye, kSIra dhArApAna, lIlA vinodinam, jagadAdhAram, manoharam vande, bhujaGga bhogA gra, padavinyAsa, vilAsa, bAlagopAlam, tam, kALim dinIpunIta karam, zrIkaram vande, me, zrIkRSNa ucchiSTa, kSIra, navanIta, phalagrahaNabhAgyAdi, mahotRSTa, zrIkRSNa nityasevAvara pradAram, ca, AsmajjanmAnte, zrIkRSNa parama padavilIna varadam..
    en: "I offer my prostrated, humble salutations unto the compassionate Lord Krishna: the Lord who affectionately accepts cow's milk; the Supreme God of all gods with a lump of butter in His hand, who eradicates every sorrow of all beings; the Consort of Goddess Lakshmi; the foundation of the universe who, while milking the cows, plays mischievous antics by drinking half of the stream falling from the udder and letting the rest spill onto the ground in sheer delight; the One who enchants the heart of Lakshmi, wiping away every mental anguish and filling the soul with joy; the cowherd boy who danced gracefully upon the hoods of the Kaliya serpent, purifying the waters of the Kalindi (Yamuna) and restoring it for the welfare of the people; the bringer of auspiciousness; the benevolent Lord who, out of boundless mercy toward an undeserving soul like me, blessed me with the exalted prasada of milk and butter tasted by Sri Krishna Himself, granting me His eternal servitude and worship, and ultimately promising to merge me eternally with His holy feet at the end of this lifetime."
    te: 'ఆవుపాలు ఆప్యాయంగా స్వీకరించేస్వామి, చేత వెన్నముద్దతో, అందరి అన్నివ్యధలనూ నశింపజేసే దేవాదిదైవము, లక్ష్మీపతి, ఆవుపాలు పితుకుతూ మధ్యలో కొంటె కోణంగి తనముగా, పొదుగు నుంచి పడేపాలధారను సగం సగం త్రాగుతూ, మిగతావి నేలమీద పడేటట్లు చేస్తూ ఆనందిస్తూండే, జగత్తుకు ఆధారభూతుడు, మనస్సులోని వ్యధలను తుడిచేసి, మనసును హర్షింపచేసే లక్ష్మీహర్షితుడు, కాళీయ సర్పముపడగపై నాట్యవిలాసము చేసి, కాళిందిని కల్మషరహితంగా, ప్రజోపకరంగా మార్చిన గోపాలబాలుడు, శ్రీకరుడు, ఎట్టి అర్హతాలేని నాకు అమిత దయతో శ్రీకృష్ణులు ఎంగిలి చేసిన పాలు, వెన్న ప్రసాదాలు స్వీకరించే అత్యంత ఉన్నతమైనవి అనుగ్రహించిన, శ్రీకృష్ణుని నిత్య దాస్యము, సేవలు చేసుకునేట్లుగా కూడా యీ జన్మాంతంలో తన పాదకులతో శాశ్వతంగా కలిపేసుకునే కరుణాకృష్ణులకు సాష్టాంగ దండప్రణామాలర్పిస్తున్నాను.'
  - type: verse
    id: v177
    no: '177'
    hk: |-
      vande vizvamohana bAlam, vizvAdhAram vanamAlim, vana vihAra
      vAsudevam | gopAlam sAmUhika vanabhojana madhye, uttiSTham, dadhyAnna kabaLahastam, padmapadayugaLazobhitam! kapaTa gopagogaNa anveSaNa
      nATaka lIlA vinodinam, cirahAsavadanam, sadAvande, vidhAta garvahArakam, gopa, goga NarakSakam, zrIkRSNam, mamArAdhya rAdhA mAdhavam, me,
      zrIkRSNa Ananda, dhAma nitya nivAsa varadam ..
    en: "Humble salutations at the lotus feet of Lord Sri Krishna, the master who grants us the supreme boon of eternal liberation: the wonderful child who enchants the entire cosmos; the cosmic foundation of all existence; the son of Vasudeva who protects the sacred forest and wanders freely within it; the smiling-faced Mukunda who, while tending the cows in the groves, rose mid-way through His midday meal with a morsel of curd rice still held in His hand, feigning innocence on His lotus feet as though searching for the calves and cowherd boys hidden away by Brahma's illusion; our adored deity Radha-Krishna, the Lord of Sri, who humbled the pride of the Creator Brahma and protected the cows and cowherd companions."
    te: 'సకల విశ్వమును సమ్మోహనపరచే అద్భుత బాలుడు, సర్వమునకు ఆధారము, వనమును బ్రోచి, విహరించే వసుసుతుడు, వనమున గోవులను కాస్తూ, మధ్యాహ్న భోజన మధ్యలో నుంచి, చేతితో పెరుగన్నం ముద్దతో సహా లేచిన పద్మము వంటి పాదములతో అమాయకునిలా నటిస్తూ, బ్రహ్మమాయం చేసిన గోవులను, గోపాలురను వెదకుతూన్నట్లు నమ్మించే చిరునవ్వుల చిన్నారి మోముల ముకుందునికి, విధాత గర్వమును అణచి, గోవులను, గోపాలరను రక్షించిన మా ఆరాధ్య దైవము రాధాకృష్ణ స్వామికి, శ్రీనాధునికి, మాకు శ్రీకృష్ణ కైవల్యము వరమిచ్చే శ్రీకృష్ణ ప్రభువులకు పాదాభివందనాలు.'
  - type: verse
    id: v178
    no: '178'
    hk: |-
      oM.. kSIrajAnujam, candram, sudhAMzum,
      zaratkAle zRGgArAdhikAsaktikArakam, zrIkRSNa bRndArAsalIlA darzana dhanyadevaram | kSIra sandrazayana zrIkRSNazyAla kala, vande zivaziro
      bhUSaNam zazim zubhakaram zazAGkam..
    en: Born from the Ocean of Milk, the younger brother of Goddess Lakshmi, the Moon possesses soothing, nectarine rays and enlivens feelings of romantic grace and tender love among humanity during the autumn season. The fortunate one who beheld the divine celestial Raas Leela pastimes of Sri Krishna in Vrindavana; the younger brother-in-law of Lord Krishna who reclines upon the Milky Ocean; the one who shines like an exquisite ornament adorning the head of Lord Shiva; the celestial ruler who gazes upon the entire world with gentle, soothing coolness - salutations unto Lord Shashanka.
    te: 'పాల సముద్రమునుంచి జనించిన లక్ష్మీదేవి తమ్ముడు, చంద్రుడు, అమృత కిరణములు కలవాడు, శరదృతువులో మానవాళిలో శృంగార రసం మీద ఆసక్తిని పెంచేవాడు. శ్రీకృష్ణదివ్య బృందారాసలీలలను చూసిన అదృష్టశాలి, పాలసముద్రముపై పవళించే శ్రీకృష్ణుని చినబావమరిది, శివుని తలపై నగవలె వెలిగే, గృహాధిపతియై లోకమును చల్లగా చూసే శశాంకునికి నమస్కారం.'
  - type: verse
    id: v179
    no: '179'
    hk: |-
      zrIkRSNanAmagAnam karomi, punaHpunaH. zrIkRSNalIlA smaraNam karomi, punaHpunaH| zrIkRSNa bhaktasahavAsam karomi, punaH, punaH, zrIkRSNa pada
      dhyAnam cadAsyam karomi punaH punaH..
    en: Throughout this entire life, I shall constantly sing the holy names of Sri Krishna, listen to and remember His divine pastimes, remain and walk in the company of Krishna devotees, and engage repeatedly in servitude and meditation at the feet of Sri Krishna. This very path, meant for merging into the holy feet of Sri Krishna beyond the cycle of rebirth, is indeed that which was taught by Lord Krishna Himself.
    te: 'యీ జన్మంతా శ్రీకృష్ణ నామగానము, లీలలు వినుట, స్మరించుట, శ్రీకృష్ణ భక్తులతో కలసి వుంటూ, తిరుగుతూ, శ్రీకృష్ణపదదాస్యము, ధ్యానము మళ్ళీ మళ్ళీ చేస్తూనే వుంటాను. తిరిగి పుట్టుక లేకుండా శ్రీకృష్ణ చరణముల లో ఐక్యమగుటకే యీ విధానము, శ్రీకృష్ణులు ఉపదేశించిన దే సుమా.'
  - type: verse
    id: v180
    no: '180'
    hk: |-
      zrIkRSNopadezamu nasnuddeziJcinade:
      o mUDhAtmA! Agrahamunanta mOdiJcukOnumA.kopamunu campukOnumA. mAyA mohavimuktuDavagumA. jIvitamu kSaNakSaNamu tarugusumA. kAlamu iTu painanU vyardhamu
      kAnIyakumA maLLI maLLI puTTi caccu, cakrabandhamunuNDi vimuktuDavagumA. koTAnukoTla janmala tadupari narajanma kaligE sumA! tirigi krimikITamugA puTTakumA, duzcaryalu valadusumA. pazcattApapaDumA. manonAkkAya, karmala pavitruDavagusumA. manassAkSiki vyatirekamuga
      naDuvakumA! karuNAmaya zrIkRSNa dhyAna nimagnuDavagumA. yI janma tudina zrIkRSNa caraNa vilInamu, sAdhyamu, tathyamu sumA.. (nenu
      yI jIvitAntam jIvanmRtuDigA paDi vuNDAli) nIpada dAsyamu dhyAnamu, nIpaibhaktiyu, premayu satatamu. nIpadadAsula sahavAsamu niratamu yI jIvita paryantamu pramukhamugan: nI nAmagAnamu, zaraNamu, nI divyapadakaivalyamu maraNAnantaramu tathyamugan |
      nIviccina varamulu nAku ananta karuNato nijamuga zrIkRSNA.. navvutA| navvistA| navvutU navvistA| navvistU navvutA.. navvulu ruvvutA, civvu rivvunA. nuvvu navvaGgA kuvvAkuvvaGgA. nityAnam daGgA| nalguri madhyaGgA, nirantaraGgA raGgA raGgA, pANDuraGgA..
      helagA, avalIlagA, truLLutU trELLutU taLataLA tArakalA bratikestA! nI dayacENTa, nAtudakaNTA.. o navvulanidhI. nagadhara naLinI zrIkRSNa
      zrInidhI | pUrNa dayAdivyadadhI | premala pEnnidhI. mA jIvana paramAvadhI.. zaraNanipiJci, nannu, nIcEntaku cercukuNTivi kadammA zrIkRSNAnandamayunigAnimmA. yI bratukutudaku nannu zrIkRSNa AnandAdhAma nitya nivAsigA ceyavammA.
      "zrIkRSNa prasAdam" sarvam zrIkRSNArpaNamastu..
    en: |-
      Sri Krishna’s teaching for the individual:
      "O foolish soul! Cast away all fury from its roots; conquer your anger; be liberated from the illusions of Maya and worldly infatuation! Behold, life diminishes moment by moment! Do not squander time any further; liberate yourself from the vicious cycle of repeatedly being born and dying! Remember, this human birth was attained only after millions of lifetimes! Do not be reborn as a worm or insect; refrain from wicked deeds! Repent! Purify yourself in thought, word, and bodily action! Never act against your conscience! Immerse yourself deeply in meditation upon the compassionate Sri Krishna! At the end of this lifetime, merging into the lotus feet of Sri Krishna is attainable and an absolute truth!"
      Throughout the rest of this life, one must remain dead to worldly pursuits.

      The Bhakta's Epiphany:
      Servitude at Your lotus feet, constant meditation, unwavering devotion, and love for You always! The enduring company of the servants of Your feet until the very end of this life! Foremost of all: singing Your holy names, seeking Your ultimate refuge, and attaining the divine salvation at Your holy feet after death is an undeniable certainty. Truly, O Sri Krishna, these are the boons You have granted unto me out of boundless mercy!

      I will smile; I will make others smile; smiling, I will bring smiles; making others smile, I will smile! I will scatter showers of smiles swiftly all around! As You smile like an innocent, babbling baby - in eternal bliss, amidst everyone, ceaselessly! O Ranga, Ranga, Panduranga! Playfully, effortlessly, leaping and dancing with sparkling joy like a gleaming star, I will live my life by the side of Your grace until my very last breath! O Treasury of smiles! Bearer of the Govardhana hill! Lotus-like Sri Krishna, abode of divine fortune! Ocean of complete and divine compassion! Great treasure-trove of pure love! The supreme culmination and purpose of our existence!Having made me surrender, You took me close to You, did You not, O Mother? Make me completely filled with the bliss of Sri Krishna! At the end of this earthly life, grant me eternal residence in the joyous abode of Sri Krishna!

      "Sri Krishna Prasadam" - Everything is dedicated unto Lord Sri Krishna!
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v181
    no: '181'
    hk: |-
      namAmi, satatam,tat,sat, cidAnandam, mugdhamuraLI, ravaLIlola, bAlagopAlam, rAdhAmAdhavam, govindam, bRndAvihAra, madana gopAlam, Anandanilayam
      naLinInAdham anantakoTi, brahmANDanAyakam, jagannavaram, gajendramokSadam, vande! vande, nudevam,
      yazodA, mAtAnurAgabaddham, ulUkabandhanakrIDAvinodinaMvizva varadam||
    en: "Eternal salutations unto the Supreme God of all gods, Lord Sri Krishna, the sole refuge of all the worlds who displays His wondrous divine pastimes: the little Krishna who, filled with that true consciousness and bliss, plays His world-enchanting flute and relishes the sublime sweetness of melody; the champion of the universe who sings and plays alongside Radha in the sacred Tulasi grove; the very embodiment of supreme happiness; the Sovereign of countless crores of universes who directs the cosmos like a grand divine play; the son of Vasudeva who bestowed liberation upon Gajendra the elephant; and the One who, yielding entirely to Mother Yashoda's pure love, allowed Himself to be bound to a wooden mortar."
    te: 'ఆ సత్యమైనచిదానందంతో,జగత్ సమ్మోహనకరమైన, వేణు వునూదుతూ, గాన మాధుర్యాన్నాస్వాదించేచిన్ని కృష్ణునికి, రాధతో కలసి తులసీ వనంలో ఆటపాటలాడే జగజ్జెట్టి,సంతోషపువెలవై,అనంతకోటిలోకాలకూ అధిపతి, జగత్తునునాటకంగా నడిపించే,గజేంద్రునికి మోక్షమిచ్చిన, వసుదేవసుతుడు, తల్లి యశోదప్రేమకు లొంగిపోయి,రోలుకుకట్టబడివున్న, తనలీలలు చూపించే లోకాలకు దిక్కైన సదేవాదిదేవ శ్రీకృష్ణులకు, ఎల్లపుడూ నమస్కారాలు.'
  - type: verse
    id: v182
    no: '182'
    hk: |-
      govindamRdu, madhurAdharA, zoNa, zoNimAvakSarAjitA, rAdhAdi taptahRdaya, bhaktassarvAnanda damAnandadhAmam. golokabRndA vAsina, mIzvaram
      devadevezama mArAdhya zrIkRSNam, mama, zrIkRSNa dAsyam, zrIkRSNabhaktim, anmajanmAnte, zrIkRSNapadakaivalyadam, manmAbhirAmam. oM hare zrIkRSNAya namaH
    en: 'Boundless crores of reverent salutations unto the compassionate Supreme Lord, Sri Krishna: the cowherd protector who brings supreme delight to the cows; the Lord of all existence who resides in the blissful realm of Goloka Vrindavana, bestowing all joy and fulfillment upon His ardent devotees whose hearts yearn for Him, along with Radha, whose soul is saturated with divine melodies through the touch of His tender, sweet lips; my revered household deity; the ever-merciful One who has protected an unworthy soul like me from being an orphan, blessed me with the divine path of Krishna-bhakti and sacred service, and who will gracefully merge me into His holy lotus feet the very moment this earthly life comes to an end.'
    te: 'గోవులకు ఆనందంకల్గించే, గోపాలుడు,తన మెత్తని తీయనిపెదవుల తాకిడి ద్వారా రాగరంజితమైన హృదయిని రాధ తోసహా, తహతహలాగుండెల గూడువైన భక్తులందర్కి అన్ని సంతోషాలు సమకూర్చే ఆనందమయ గోలోక బృందావనవాసి, సర్వేశ్వరులు, నేను కొల్చేఇలవేల్పు, అనర్హుడైనన్ను అనాథునిగాకుండాకాపాడి, శ్రీకృష్ణ సేవ భక్తి ప్రసాదించి, యీజన్మముగిసినవెంటనే, తన పాదార విందములలో ఐక్యముచేసు కొనే కారుణ్యులు శ్రీకృష్ణ విభునికి అనంతకోటి ప్రణామాలు.'
  - type: verse
    id: v183
    no: '183'
    hk: |-
      zrIkRSNaMvande jagadgurum mamanityAnuSThAnam - navadazavidha ArAdhana, (sandhyAvandanapUrvakam)
      1. dhyAnam: dhyAnamekaMzrIrAdhAkRSNa devaram..
      2. gAnam: gAnamekaMvaMzImohana kRSNa, krIDAvinodammanoharam, sAmagAnasadRzam..
      3. japamekam,nArAyaNASTAkSariH harekRSNamantrapUrvakam (japam)
      4. bhajanam: bhajanamekam zrIkRSNa divya nAmamanantaphalitadam|
      5. lakSyam: lakSyamekam zrIkRSNa pAdAravinda kaivalyam||
      6. kartavyam: kartavyamekam anukSaNa zrIkRSNa padadhyAnam, nAma gAnam, zeSa jIvitaparyam tam..
      7. sphUrtiH: sphUrtirekam zrIkRSNa anugra hapUrvaka AjJApAlanam..
      8. darzanam: darzanam zrIkRSNa divyamaGgaLa vigraham, zrIkRSNa dayAkAraNAt janmasAphalyArdham..
      9. zaraNam: zaraNa mekaikam zrIkRSNa divyavzrIcaraNadvayam..
      10. vAsam: vAsamekaikam zAzvata zrIkRSNa Ananda dhAmanivAsam..

      vITitopATugA:
      zlo.. zravaNam, kIrtanam, viSNoH, smaraNam, pAdasevanam arcanam, vandanam, dAsyam, sakhyam, Atmanivedanam - navavidhabhaktimArgamulu (vyAsa bhAgavatam-7:5:23) anusariddAmu.
      1. zravaNam : zravaNamekam zrIkRSNa vividhAvatAra, kathAbharitabhAgavatam..
      2. kIrtanam kIrtanam kRpAkAraka zrIkRSNa bhaktassarva vijayapurANammokSa sAdhakam..
      3. smaraNam : smaraNamekam zrIkRSNa bhagavadgItAsUktimuktAvaLiH..
      4. pAdasevanam: kaivalyaprada, dayAmaya, zrIkRSNa pAdasevanam, karomi AjanmAntam..
      5. arcanam: arca yAmi, devadeveza zrIkRSNam anantarUpa prabhum..
      6. vandanam: vandanam..
      7. dAsyam: dAsyaGkaromi, bhaktassarva sahita zrIkRSNa devaram..
      8. sakhyam sakhyaGkaromi, zrIkRSNa bhakti, pracArakadhmanya puruSa nahasrapUrvakam, sadAhasita, zrIkRSNam, anunityam..
      9. Atmanivedanam: mamArambhAt, zrIkRSNa prasAdita, sparvam, zrIkRSNArpaNam, karomitakSaNam, Atma nivedanam..

      zrIkRSNa dAsyadazakam
      1. kanulumUsina, kAnabaDu, kamanIyakAntuDu, zrIkRSNuDu, dAsoha maJcu, zirasuvaJci, zaraNani, zrIcaraNamulaNTagan.
      2. mukkucivara, cinduleyu, cilipicinnAri, caGgalva dAri, nandanandana, mukunduDu, navarasabharita, zrIkRSNa lIlAmRta, tatvAsvAdana, cesi, mudamuga, gadya padyamula, AtmArpaNa ceya, hRdyamnamugan.
      3. pEdavi vippagA, vEluvaDu, vEnnadOGga, vizvarUpuni, divya gADhAgAnamu, jagatpramodamugan, zrIkRSNa kRpA kAraNambugan!
      4. kaNThamandu, kaliyatirugu, zrIkaNThuDu, akuNThita bhaktidI, kSAparuDa, vagumani, hEccariJcucun.
      5. hRdayasthu~DayyE, mAhiraNmayIzuNDu, mAyAmohAtItuDa, va gumani, hitamu, palkucun.
      6. cetalanadupuceyu, cinmayAnanda, gItAcAryuDu, svaphalApekSarahita, karmAcaraNacesi, sarvakarmaphalamu, tanakarpiJcumanu, zrIkRSNa caityanyam, bOkkaTE, ucitamanucun, takSaNamAcarimpumanucun.
      7. kaDupuniNDu, kAruNyadhAmuni, kaTAkSambuna, zrIkRSNa, madhurapuNya, kathAsmaraNa, zravaNA, nandamulavalan.
      8. naDakalu, nagadharuni, nirdiSTa iSTapadulu, aSTakaSTa naSTaduSTa, nikRSTambulu, nikkamuga, nivAriJcucun.
      9. nArIcora, naLinInAdhu, muraLIravaLulu, nakhazikhaparyantamu, rakSanOsagu, niratamu, nelanAlgucEragula naDayADinan.
      10. dikkutocaninannu, devadeveza zrIkRSNalu, dayAsudhA, karamula, ceradIsi, tana, paramapada, dAsya, dhyAnavaramOsagi, nAlkuJcuna, nArAyaNamantramu,
      nirantaramuga, nartimpajesi, yIjIvitAntamuna, zrIkRSNa kaivalyamu, prasAdim tunani,ri ardratato, sarvaniyantagAna, kevalamu, yIsarvAdhamuni, uddariJci dhanyuni gAceyuTa kun!!

      “zrIkRSNa prasAdam"

      "sarvam zrIkRSNArpaNamastu”

      ~kallUri suryaprakAza mUrti
    en: |-
      I bow to Sri Krishna, the Universal Teacher (Jagadguru).
      My Daily Spiritual Discipline - The Ten-fold Worship (preceded by Sandhyavandanam):
      1. Dhyanam (Meditation): Meditation solely upon the divine Lord Sri Radha-Krishna.
      2. Ganam (Singing): Singing only of the enchanting, flute-bearing Krishna, whose wondrous divine pastimes are as delightful as the sacred Sama Veda melodies.
      3. Japam (Chanting): Chanting the Narayana Ashtakshari mantra preceded by the Hare Krishna Maha-mantra.
      4. Bhajanam (Devotional Worship): Chanting and singing solely the divine holy names of Sri Krishna, which bestow infinite fruits.
      5. Lakshyam (Goal): The singular ultimate goal - attaining liberation (Kaivalya) at the lotus feet of Sri Krishna.
      6. Kartavyam (Duty): The paramount duty - moment-to-moment meditation on Sri Krishna's feet and chanting His name for the remainder of this life.
      7. Sphurti (Inspiration): The sole inspiration - dutiful obedience and adherence to Sri Krishna's commands with His divine grace.
      8. Darshanam (Vision): Beholding Sri Krishna's auspicious divine form, fulfilling the true purpose of this human birth through His mercy.
      9. Sharanam (Refuge): The sole and absolute sanctuary - the twin holy lotus feet of Sri Krishna.
      10. Vasam (Abode): The ultimate residence - eternal dwelling in the blissful supreme realm of Sri Krishna.

      Along with these, following the Nine Paths of Devotion (Navavidha Bhakti from Srimad Bhagavatam 7:5:23):
      1. Shravanam (Hearing): Listening solely to the Bhagavatam, richly filled with accounts of the various divine incarnations and pastimes of Sri Krishna.
      2. Keertanam (Chanting/Glorifying): Glorifying the grace-bestowing purana of the devotee's all-victorious triumphs through Sri Krishna, the means to liberation.
      3. Smaranam (Remembering): Ever recollecting the garland of pearl-like verses of Sri Krishna's Bhagavad Gita.
      4. Pada-sevanam (Serving the Holy Feet): Serving the lotus feet of the compassionate Sri Krishna, the granter of liberation, throughout my lifetime.
      5. Archanam (Ritual Worship): Worshiping the Lord of gods, Sri Krishna, the cosmic sovereign of infinite manifestations.
      6. Vandanam (Offering Homage): Offering humble, reverent prostrations unto Him.
      7. Dasyam (Servitude): Serving the Supreme Lord Sri Krishna alongside all His revered devotees.
      8. Sakhyam (Friendship): Cultivating intimate companionship with the ever-smiling Sri Krishna each day, preceded by the company of thousands of virtuous souls propagating devotion to Him.
      9. Atma-nivedanam (Self-Surrender): Offering complete, immediate self-surrender - dedicating everything bestowed by Sri Krishna's grace entirely back unto Him from the very beginning.

      Sri Krishna Dasyadashakam (Ten Verses on Servitude to Sri Krishna):

      1. Upon closing my eyes, the charmingly effulgent Lord Sri Krishna appears before me; uttering "I am Your servant" (Dasoham), bowing my head, seeking refuge, and touching His lotus feet.
      2. The playful little darling boy at the tip of the nose, adorned with blossoms, the joy of Nanda, Mukunda - relishing the nectar of Krishna's pastimes filled with nine aesthetic sentiments (Navarasa) and joyfully, heartily offering myself through prose and verse.
      3. As the lips open, the divine, deep hymn of the butter-stealer and cosmic-formed Lord pours forth, bringing universal delight through the supreme grace of Sri Krishna!
      4. Residing and revolving within the throat, the glorious-throated Lord constantly warns: "Remain steadfast and unwavering in the discipline of pure devotion!"
      5. The luminous golden Supreme Lord settled within the heart, counseling wisely: "Transcend all illusions of Maya and worldly attachment!"
      6. Guiding all actions, the Chinmayānanda teacher of the Gita urges: "Perform selfless duty without desire for results, dedicate the fruits of all works unto Me; Krishna-consciousness alone is righteous - practice it immediately!"
      7. The stomach fills with fullness and contentment by the compassionate glance of the Lord, through the joy of listening to and remembering the sweet, sacred tales of Sri Krishna.
      8. The paces of life follow the designated paths willed by the Bearer of Mount Govardhana, truly warding off the eightfold afflictions, losses, evils, and miserable plights.
      9. The melodious strains of the flute of the captivating lover of milkmaids and lotus-eyed Lord protect from head to toe always, wherever one walks across the four corners of the earth.
      10. When I was utterly lost, Lord Sri Krishna, God of gods, gathered me in His hands of nectarine compassion, bestowed the boon of servitude and meditation upon His supreme feet, made the Narayana mantra dance continuously upon my tongue, and tenderly resolved, as the Supreme Sovereign, to grant me Krishna-Kaivalya at the end of this life - purely to uplift and sanctify this most humble soul!

      "Sri Krishna Prasadam"

      "Everything is dedicated unto Lord Sri Krishna."

      ~Kalluri Surya Prakasa Murthy
