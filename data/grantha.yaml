title:
  hk: zrI kRSNAnandamayam
  en: Sri Krishnanandamayam
  author:
    hk: ''
    en: ''
prefaces:
  en:
    title: Preface
    blocks:
      - type: prose
        id: pe01
        text: |-
          While bowing before the ALMIGHTY with folded hands, eyes pouring out tearful tales of
          misconduct life thus far, ripe with arrogance out of ignorance of the speck of the supreme being
          permanently stay-put in my heart, a thought of wailing for redemption has been kindled by the
          ever-Compassionate Divine, with an indicative violent shiver in the spine & thud in the
          chest convulsions on a glorious day recently. HE simply ordained "Don't worry, | just gave you
          the awakening kick. You ($jIvAtma$) are always part of my universal soul.($paramAtma$)
          Wash out your sins by the Jet-spray of my $nAmoccAraNa$ i.e. chanting oul my name of various
          forms in some of the easiest ways(with total faith & dedication). AND LEAVE THE REST TO ME.
          You would be bestowed with the boon of salvation i.e. $mokSam$: You merging back with me as
          always."
      - type: prose
        id: pe02
        text: |-
          Thus began the Divine Dictations that subsequently emerged as the booklet of free verses titled
          "$zrI kRSNAnandamayam$" i.e., full of Heavenly Bliss of the SUPREMELORD $zrI kRSNa$.
          The source, sprit, script and everything connected with anything on this, that and it are the sole
          proprietary of $zrI kRSNa bhagavAn$!!
          "While studying, devotees to loak at the wide spectrum of spontaneous spirituality similar to
          Upanishaths. But not through the vast voids & vortices of $vyAkaraNam$ and waste a lifetime.
          (a) The letter "$ta$" drawn from "$tat$?” is the Piousest - as Ramayana was Started -
          same has become the first letter of our first verse.
          (b) A twenty-four lettered sentence or a line in praise of the Lord is equivalent to "$gAyatrImantra$"
          - Ramayana contains 24 thousand slokas.
          (c) "Sixteen" is great because the Lord in the form of $zrI rAma$ is "$SoDaza guNa sampanna$"
          - embodiment of all the sixteen super virtues; also Lord $zrI kRSNa$ is "$SoDaza kalA zobhita$"-
           essence of the sixteen shines of Divine glitter
          (d) "Eighteen" is great because of "$aSTAdaza purANa$" - Praising of the Lord with stories and
          episodes full of his kindness & Consideration and Pardoning narrated in eighteen classics.
          (e) 108 totaling 9 - $amRta bIja$. When the Pious seeding is done, i.e. when any $mantra$ or
          $bhagavannAma$ is chanted 108 times, it imparts purity, austerity (honesty+ duty+service) leads to
          devotion & dedication thus leading to integration with the SUPREME. $viSNusahasranAma stotram$
           contains 108 synonyms with “$va$” or its derivatives .
      - type: prose
        id: pe03
        text: |-
          $oM hare zrI kRSNAya namaH$
          Also $oM namo nArAyaNAya namaH$ - $aSTAkSarI$ + $bIja akSaram$ like
          $hAm$/$hrIm$ - totaling 9
          Humans breath daily 2000 multiplied by 108 times
          The good old Lord booned the verses mostly with such lettered compositions and in the names
          of various facets of the SUPREME normally worshiped by the devatees
          (a) $zrI kRSNa$
          (b) $zrI rAma$
          (0) $zrI mahAviSNu$
          (d) $sadAziva$
          (8) $gaNeza$
          (f} $hanuma$
          (g) $subrahmaNya$/$ayyappa$
          (h) $gAyatrI$
          (i) $lakSmI$
          (j) $gaurI$
          (k) $sarasvatI$
          (l) $zrI sAyibAbA$
          and/or any form one can concentrate upon unwaveringly.
      - type: prose
        id: pe04
        text: |-
          $zrI kRSNa$: Combination of $kRS$+$Na$ meaning $astitvam$+$Anandam$-origination, meaning
          and purpose of life + Bountiful joy and eternal happiness. The supreme Lord who gives ultimate
          bliss as boon- personification of universal love. He explains the purpose of human life as making
          dedicated efforts to escape from birth-death-rebirth vicious cycle as attainment of saivation. He
          attracts all sins and destroys them; preacher of $karma siddhAnta$ and $yoga vidyA$ etc.
      - type: sloka
        id: pe05
        hk: karmaNyevAdhikAraste mAphaleSu kadAcana .
      - type: prose
        id: pe06
        text: (Quoted from the Bhagavad Gita, Ch:V)
      - type: prose
        id: pe07
        text: |-
          He atones-oh,earthly being! You simply carry out all assigned work & appropriate jobs throughout
          all stages of your life period with total devotion minus self-interest, as a right and rightful way of
          spending life lively but without claiming any right and demand for results and fruits as per your
          wishes and prescriptions because IAM the one that grants the appropriate entitlements. He
          ordained.
      - type: prose
        id: pe08
        text: |-
          Give up "$a$"- $ahaGkAram$ - Arrogance/prejudiced pride
          "$A$"- $Agraham$ - Anger
          then sure you will be granted with
          "$i$" - $ihaloka sukham$ - happiness during earthly life period & Divine blessing
          "$I$" - $IzvarAnugraham$- Blessing for perpetual joy in Heaven.
      - type: prose
        id: pe09
        text: His declaration -
      - type: sloka
        id: pe10
        hk: |-
          durbhikSecAnadAtAram, sumikSecahariNyadam .
          caturoham namasyAmiraNe dhIramRte zucim ..
      - type: prose
        id: pe11
        text: |-
          | salute all the four categories of people- (a) Food donors during calamities (0) Wealth donors
          for charities in normal times (c) Fearless fighters for national protection and orderly rule.
          (d) Piously dead - i.e. people who live as per the dictates of consciousness and so die peacefully.
      - type: prose
        id: pe12
        text: |-
          Emperor Dushyantha could be a lively example in this context. Seeing shakuntala beauty
          and youth personified aptly described as
      - type: sloka
        id: pe13
        hk: |-
          anAghrAtam puSpaGki salayamiva marUnAGkararuhaiH .
          anAviddham ratnam madhunavamanAsvAditarasam ..
      - type: sloka
        id: pe14
        hk: |-
          yamovaivasvato devoyasya sohRdayasthitaH tasyana
          vivAda stho mAgaGgAm mAkuruSvatH .
      - type: prose
        id: pe15
        text: |-
          Unsmelled fresh flower, tender leaf unmarked by human nail, uncut & unpolished raw diamond,
          fresh untasted sweet honey - he got the idea of taking her as his queen and declares clearly "She
          must be the suitable royal consort, otherwise , such a thought never occurs to me, as there could
          never be any diversion from my righteous path of life as conscious is my best guidance."
      - type: sloka
        id: pe16
        hk: |-
          sarvavedeSuyatpuNyam sarvatIrtheSu yatphalam . tatphalam puruSaApnoti . stutvAdevam janArdanam .
          zrI vAsudevanamostute ..
      - type: prose
        id: pe17
        text: |-
          Meaning that he who never differs with the Supreme Lord (called by any name) who is embedded
          in his heart, has no need for a holy dip in the river Ganga charity in Kurukshethra for washing out
          sins as no sins are ever committed!!.
          Two glaring examples for his ocean wide kindness.
          1) Ajaameela, the wicked hunter, when wailing for his beloved son in his last moments “oh $nArAyaNa$ “
          the Lord accounted it as “$bhagavannAmoccAraNa$’” chanting of nis
          name.
          2) A Lady calling her pet parrot always “$rAma, rAma$" was granted $mokSam$.
      - type: prose
        id: pe18
        text: $bhakti$ , i.e. devotion towards the divine has been best explained by the saint AADI SANKARACHARYA
      - type: sloka
        id: pe19
        hk: aGkolam nijabIjasantati rayaskAnto palam sUcikA . sAndhvInaija - vibhuMlatAkSiti ruham sindhussaridvallabham prApnotIti yathA tathApazupate pAdAravinda dvayam . cetovRtti rupetyatiSTati sadAsAbhaktirityucyate
      - type: prose
        id: pe20
        text: |-
          Just as the $aGkolam$ tree attracts back its seeds for sprouting, iron needle towards magnet, a
          wedded woman her spouse, a creeping plantation encircling a tree trunk and river to ocean - the
          devotee getting naturally & permanently attracted and attached towards the lotus feet of the
          LORD SUPREME is known as $bhakti$.
      - type: sloka
        id: pe21
        hk: |-
          anityAni zarIrANi vibhavonaivazAzvataH :
          natyim sannihito viSNuH kartavyodharma saGgrahaH ..
      - type: prose
        id: pe22
        text: |-
          Sahadeva, the youngest pandava atones “These human bodies eventually die, none of the
          wealth is permanent, every moment life gets reduced and nears Lord $viSNu$; as such carryout
          assigned duties honestly and consciously in a detached manner in accordance with the laws of
          the nation submitting everything to him. This is the surest way to reach Him for re-merger."
  te:
    title: ముందుమాట
    blocks:
      - type: prose
        id: pt01
        text: |-
          ## ప్రారంభ విన్నపము

          హే ప్రియభక్తా!

          "శ్రీకృష్ణం వందే జగద్గురుం"

          తేజఃస్వరూపుడైన శ్రీ శ్రీకృష్ణభగవానుడు, గత ఐదు సంవత్సరములుగా, దఫ దఫాలుగా ప్రసాదించిన, స్వేచ్ఛాగాన ధ్యానగీతావళి “శ్రీ శ్రీకృష్ణానందమయము” ను ఇందుతో జత చేయుచున్నాను. దైవాంశ సంభూతులగు మీరున్నూ భగవత్ప్రసాదమును స్వీకరింతురుగాక!

          - విశ్వమంతయు ప్రేమమయము – శ్రీకృష్ణసంభూతము

          - ప్రేమశాశ్వతము – సంతృప్తసహజీవనము దాని తత్వము

          - ప్రేమయే జీవితమునకు ఆధారభూతము

          - ప్రేమమయమైన సంతోషజీవితమునందరును గడుపుదురుగాక!

          - ధ్యాన ధన్యులై మోక్షసాధకులౌదురుగాక!

          తత్సర్వసర్వేశ్వరుడగు శ్రీ శ్రీకృష్ణభగవానుని కరుణాకటాక్షములు అనంతముగా మనందరిపై కురిపించుచునే యుండుగాక అనే ప్రార్థనతో...

          కల్లూరి సూర్యప్రకాశమూర్తి

          శ్రీకృష్ణప్రియమగు శ్రీకర సం॥ర శరదృతు ఆశ్వయుజ శు॥ పంచమీ స్థిరవారమున శ్రీకృష్ణార్పణముగా సమర్పించడమైనది (01-10-2011).
      - type: prose
        id: pt02
        text: '## మంగళ శ్లోకము'
      - type: sloka
        id: pt03
        hk: |-
          oM helAlIlAhAsavilAsa rasalAsya zizum tam .
          hiraNmayI hRdayAravindam harim nArAyaNam .
          veNunAdodbhavA adbhutAnurAga jharI rAdhAbhirAmam .
          hiraNyagarbham zrI kRSNam vande mokSadam vande me mokSadam ..
      - type: prose
        id: pt04
        text: |-
          స్థూలముగా భావము:

          కొంటెగా, నవ్వుతూ, చిలిపి చేష్టలు చేసే చిన్ని పాపడు, శ్రీ మహాలక్ష్మికి హృదయ సరోజమైనవాడు, సర్వదోష హారి, ప్రళయ కాలమున నీరుని నివాసముగా గల శాశ్వతుడు, తన అద్భుతమైన వేణునాదము నుండి జనించిన రాగప్రవాహమైన రాధామనోరంజకుడు, హిరణ్యగర్భుడు (దేవాదిదేవుడు) అగు శ్రీకృష్ణునికి ప్రణామము. వారే సర్వులకు మోక్షమిచ్చువారు. నన్ను ముక్తి పొందునట్లు చేయు ఆరాధ్య దైవములు వీరే. అట్టి ముకుందునికి వందనములు.

          మా పురోహితులు బ్రహ్మశ్రీ కొడమంచి శ్రీనివాస శాస్త్రుల వారి వ్యాఖ్యాన సారాంశము:

          చిన్నివానిగా, లీలగా, అవలీలగా, అమాయకంగా నవ్వుతూ, చిలిపి పనులతో చిదానందం కలిగిస్తూ, అనుగ్రహించి, అన్ని రసాలకు పరమావధి అగు భక్తిరసం రగిల్చి, నా హృదయాన్ని పుటం వేసిన బంగారంలా పవిత్రపరచి, తన పాదాలను ఆ కమలంలో నిలిపి, నాచే ధ్యానింపచేసిన దయామయులు; సర్వపాపములు హరించే స్వామి, ప్రళయాంతమున నీరు నివాసముగా గల చిద్విలాసాల ముద్దుపాపడు, తన అద్భుతమైన మురళీగానమనే జలపాతంలో అన్ని లోకాలను ప్రేమతో నింపు కన్నయ్య, రాధకు మనోరంజకుడైన దేవాదిదేవుడు, మోక్షమిచ్చే శ్రీకృష్ణునికి ప్రణామము. క్షమాసింధువు, సర్వవరదుడై, నన్నీ జన్మాంతమున ముక్తివంతునిగా తన చరణములలో విలీనము చేసుకొనే అనాథనాథుడు, నా ఆరాధ్యదైవము, ముకుందునికి సర్వవేళలా వందనములు.
      - type: prose
        id: pt05
        text: |-
          ## మనవి

          ఓం శ్రీ మహాగణాధిపతయే నమః

          హరే రామ హరే రామ రామ రామ హరే హరే

          హరే కృష్ణ హరే కృష్ణ కృష్ణ కృష్ణ హరే హరే

          వ్రాయించువారు యోగేశ్వర శ్రీరామేశ్వరులట

          త్వయ్ వ్రాయించునవి శ్రీ పదధ్యాన గీతావళియట!

          శ్రేయం వీటి గానం రాధాకృష్ణా కృపాసాధనంట!

          సర్వం ఇయ్యది జీవితమ్ము మోక్ష సాధనమ్మునకట!!
      - type: prose
        id: pt06
        text: |-
          ## తత్సర్వేశ్వర ధ్యానారంభం

          శ్రీ గంగా గౌరీశసుతస్తుతిః
      - type: sloka
        id: pt07
        hk: |-
          oM vighnezvara namastubhyam, subrahmaNyezvarAgraja .
          dhyAnArambham kariSyAmi, siddhirbhavatu me sadA ..
      - type: prose
        id: pt08
        text: 'భావము: తత్సర్వేశ్వరుని అమిత కృపవల్ల మానసికంగా పుణ్య గోదావరీ గంగాస్నానంతో పునీతమై, త్రికరణశుద్ధిగా త్రిలోకాలకు తల్లిదండ్రులైన పార్వతీ పరమేశ్వరులకు వందనమాచరించి, తత్వాచార్యులైన వాసుదేవ శ్రీకృష్ణస్మరణ చేసి, శ్రీపదధ్యానం మొదలెడుతున్నాను. ఓ విఘ్నేశ్వరా! శ్రీ సుబ్రహ్మణ్యేశ్వరునికి అన్నగా, శ్రీ కుమారగురువై, అన్నివేళలా అగ్రపూజలందుకునే దైవమా! నమస్కారం. యీ మోక్షసాధన సంకల్పం సిద్ధించేటట్లు అనుగ్రహించు.'
      - type: prose
        id: pt09
        text: శ్రీ సర్వగురు ప్రస్తుతిః
      - type: sloka
        id: pt10
        hk: oM zrI dattAtreyam, trimUrtyeka rUpam, avadhUtam, anasUyAtri varaputram, zrIpAda zrIvallabham, nRsiMhasarasvatim, vizvavibhum, zrI mANikyaprabhum . akkalkoTa svAminam, zrI SirDI (puTTaparti) sAyIzeti paJcAvatAra dharam, zrI gurudattam, digambaram, zrI dakSiNAmUrtim, viSNusAyUjyadam me, zrI zrIrAmam, kRSNam vande jagadgurum ..
      - type: prose
        id: pt11
        text: 'భావము: త్రిమూర్తుల అంశతో వారి స్వరూపంగా అనసూయా-అత్రుల వరపుత్రుడుగా జన్మించిన మహాయోగి దత్తాత్రేయులు; శ్రీపాద శ్రీవల్లభునిగా, నృసింహసరస్వతిగా, మాణిక్యప్రభుగా, అక్కల్కోట సాధువుగా, శ్రీ షిర్డీ (పుట్టపర్తి) సాయిబాబాగా ఐదు అవతారాలెత్తి జ్ఞానబోధ చేసిన శ్రీ గురుదత్తులు, దక్షిణామూర్తివారు; నాకు విష్ణుసాయుజ్యం ప్రసాదించే ఆరాధ్యదైవం శ్రీరాముడు; లోకాలన్నిటికీ గురువైన శ్రీకృష్ణునికి నమస్కృతులు.'
      - type: prose
        id: pt12
        text: సర్వేశ్వర సంస్తుతిః (మధురసాస్వాదనం)
      - type: sloka
        id: pt13
        hk: oM mAdhavam, madhurAdhipam, madhusUdanam, manoharam, mahAzivArcakamacyuta marcita manantam . dhanvantarim, vizvabhiSak nArAyaNam, mama sarvarogaghnam, mokSadam, kRSNam vande vAsudevam ..
      - type: prose
        id: pt14
        text: |-
          భావము: శ్రీపతి, మధురాధిపతి, మధుసంహారి, భక్తుల మనస్సు సదా హరించి అందు విహరించేవాడు; శ్రీ సాంబసదాశివుని అర్చించే ఆదిదైవం, అచ్యుతుని ఆరాధించే ఆదివైద్యులు అంబికానాథులు; ధన్వంతరి, విశ్వచికిత్సకులు శ్రీమన్నారాయణులు; నా శారీరిక, మానసిక, ఆధ్యాత్మిక, వైరాగ్యవిరుద్ధమైన సర్వరోగములను నశింపచేసి మోక్షమును ప్రసాదించే వాసుదేవ శ్రీకృష్ణ పరమాత్మకు ప్రణామము.

          "కృష్" ధాతువునకు "ణ" కారము కలిసినచో "అస్తిత్వము - ఆనందము" అను అర్థము వచ్చును. లోకములోని సమస్త పాపములను ఆకర్షించి నశింపచేస్తూ, జీవులకు తత్వబోధన ద్వారా భక్తిని కలిగించి, మానవుని అస్తిత్వమునకు అర్థము తెలియపరచి, బ్రహ్మానందమునొసగే ఆనందస్వరూపుడు శ్రీకృష్ణపరబ్రహ్మ. ఇంత అర్థము ఇమిడివున్న "శ్రీకృష్ణ" నామకరణమును గర్గమహర్షి నందనందనునికి చేసెను. పరిపూర్ణావతార పురుషోత్తమునికి, సర్వార్థసిద్ధికరునికి, శ్రీకరునికి, శ్రీప్రదాత శ్రీహరికి, ముద్దుకృష్ణునికి వందనం, అభివందనం.

          ఓం శాంతిః శాంతిః శాంతిః | హరిః ఓమ్ తత్ సత్ | సర్వం శ్రీ రాధాకృష్ణార్పణమస్తు
      - type: prose
        id: pt15
        text: |-
          ## శ్రీ "శ్రీ కృష్ణానందలహరి" – పీఠిక

          దైవ ప్రేరిత మనోభావతరంగాల ప్రతిరూప స్వేచ్ఛాగీతికలు. సకల దేవతల ప్రస్తుతి కలదు. "త" అక్షరము గొప్పది; రామాయణం "తపస్స్వాధ్యాయ నిరతం తపస్వీ..." శ్లోకముతో ప్రారంభం. మన మొదటి గీతిక "త"కారా రంభం, చివరి గీతిక "త"కార సంపూర్తి. గాయత్రీ మంత్రములోని 24 అక్షరములు, రామాయణంలోని 24 వేల శ్లోకముల వలె 24 గీతికలు. మొదటి శ్లోకం "దైవతం"తో, చివరి శ్లోకం "మోక్షదాం"తో పూర్తవుతాయి. దైవధ్యానమునకు పరమావధి మోక్షం కోరటమే కదా!

          ముక్తాయింపుగా 22, 23 శ్లోకములు: మొదటిది శ్రీ విష్ణు అష్టాక్షరీ, శ్రీ శివ పంచాక్షరీ, తారకరామ, శక్తి, లక్ష్మీ బీజాక్షరములతో కూడినది. నాల్గు పాదములు నాల్గు దిక్కుల సూచనగా పాదమునకు 16 అక్షరములతో ఎటు తిరిగినా షోడశకళా ప్రపూర్ణుడైన పురుషోత్తముడే దిక్కని ప్రబోధిస్తున్నట్లు ప్రభవించినది. రెండవది సర్వశ్రేష్ఠమైన శివవిష్ణువుల సంయుక్త రూపమైన సదాశివాత్మలింగమును తులసీ మారేడుదళములతో సహా ఆరాధించటం విష్ణుసాయుజ్యం ఇచ్చేదిగా నిరూపితమైనది. చివరగా అన్ని భేషజాలను విడిచి "నీ పాదాల నాశ్రయించిన నన్ను కాచి రక్షించి మోక్షం ఇమ్మని యాచించటం" ఆత్మార్ఫణం – ఆనందో బ్రహ్మ.

          తేది: 21-01-2007, వ్యయ సం॥ర ప్రథమ మాఘ ఆదివారంనాడు శ్రీ భద్రాద్రి శ్రీరామచంద్రస్వామికి దర్శన, అర్చనా పూర్వకముగా ఈ శ్లోకముల మూలప్రతిని సమర్పించడమైనది.
items:
  - type: verse
    id: v1
    no: '1'
    hk: |-
      tejomayam yajJadAna tapaH karmAntargata rAjitam zrI rAmam.
      sarvezvaram sarvArtha sAdhanArthamarcita macyutam zAzvatam.
      dayAnidhim kaivalyada svayamprakAzamUrtim zubhakaram zivam viSNum.
      yogezvara zrI rAdhAkRSNam, tam sadA namAmi zrI lakSmI nArAyaNa daivatam..
    en: 'Obeisances always to Sri Lakshmi-Narayana: Sri Rama, full of radiance and present in all rites such as sacrifice, charity and austerity; the Lord of all; the infinite one worshipped for every purpose; the eternal one; the self-luminous one who graciously grants liberation; the auspicious form of Shiva and Vishnu together; the embodiment of Radha and Krishna, lovers of the whole universe.'
    te: 'తేజస్సుతో నిండి, యజ్ఞము, దానము, తపస్సు వంటి అన్ని కర్మలయందుండు శ్రీరాముడు, సర్వేశ్వరుడు, అన్ని ప్రయోజనములకై ఆరాధింపబడే అనంతుడు, శాశ్వతంగా వుండేవాడు, దయతో మోక్షమిచ్చే స్వయంప్రకాశకుడు, శుభకరుడైన శివ-విష్ణు స్వరూపుడు, విశ్వప్రేమికులైన రాధాకృష్ణులందరి స్వరూపమైన శ్రీ లక్ష్మీనారాయణునికి సదా నమస్కారములు.'
  - type: verse
    id: v2
    no: '2'
    hk: |-
      zrI vighnezvaram sarva vighnaharam kumAragurum ca sumukham phAlacandram.
      smarAmi prathamam surAgrapUjitam gaurIza kumAram siddhArtha gaNezam..
    en: 'I remember Ganesha, the son of Parvati: the destroyer of all obstacles, the elder brother of Kumaraswami, the one with a moon-like face, who is to be worshipped before all the gods.'
    te: 'అన్ని విఘ్నములను నశింపచేసే, కుమారస్వామికి గురువు, చంద్రుని వంటి ముఖము గల, దేవతలందరి కంటే ముందుగా పూజింపవలసిన పార్వతీతనయుడైన గణేశుని తలచుకుంటున్నాను.'
  - type: verse
    id: v3
    no: '3'
    hk: |-
      1. praNAmi jagadvIram, vizvaH zreyakArakam, viSNum jiSNum, muktidam advitIyam acyutam, jagannAtha vallabham..
      2. dhyAyAmi devakIsutam aniruddham Adi daivatam.
      deva devezvaram zrI harim, AdimadhyAntarasthitam sthiram..
    en: |-
      1. Salutations to Sri Vishnu, the cause of the good of all worlds, the incomparable God who grants liberation, the protector and ruler of the worlds. 
      2. I pray to Sri Hari, the son of Devaki, who has no opposite, the first God, the God of all gods, who remains unchanging before creation, in the middle and at the end.
    te: |-
      1. సర్వలోకాల మంచికి కారకుడు, శ్రీ విష్ణువు, మోక్షమునిచ్చే సాటి లేనిదైవం, రక్షకుడైన లోకపాలకునికి నమస్కారం.
      2. దేవకీ కుమారుడు, వ్యతిరేకము లేనివాడు, మొదటి దైవం, దేవుళ్ళందరికీ దేవుడు, సృష్టిముందు మధ్యలో చివరకూడా నిశ్చలంగా వుండే శ్రీహరిని ప్రార్థిస్తున్నాను.
  - type: verse
    id: v4
    no: '4'
    hk: |-
      1. pazyAmi paramezvaram vizvezam virUpAkSam memokSadam.
      phAlAkSam pazupatim satyam zivam sundaram..
      2. zambhum vizvambharam sAmbam Izvaram zAntam mahezvaram.
      vizvam sarvam vizvezvaram zivamayam, sadAvandeham tam vizvanAtham..
    en: 'I always bow, seeing with the eye of the mind Maheshwara, the ruler of the universe: Ishwara of beautiful eyes, with a third eye on his forehead, the responsible God who gives happiness and peace to all beings, who rescues one who merely cries out in pain, "Shambho!", who bears all the worlds and grants prosperity, the embodiment of peace, impartial and auspicious, pervading the whole universe.'
    te: |-
      విశ్వమును పాలించే ఈశ్వరుడు, సుందరనేత్రుడు, ముఖమున మూడోకన్నుగల, జీవులందరకు సుఖశాంతులొసగే బాధ్యతాయుత దైవం బాధతో “శంభో” అని ఆక్రోశిస్తే చాలు, ఆదుకునే, అన్నిలోకాలను భరించి, ఐశ్వర్యమునిచ్చే శాంతి స్వరూపుడు, సముడు, శుభుడు, విశ్వమంతా వ్యాపించివున్న మహేశ్వరుని మనోనేత్రంతో దర్శిస్తూ ఎల్లపుడూ నమస్కరిస్తుంటాను.
  - type: verse
    id: v5
    no: '5'
    hk: |-
      namAmi nandakizoram, zrI kRSNam lokarakSakam.
      gItAcAryam satya priyam ca, sadA zrI ziva dhyAna yoginam.
      zrIzam zrIkaram zreyam zaurim, rukmiNI prANavallabham.
      ramyam zrIrAdhAmAdhavam, rAsalIlA vinodinam..
    en: "Salutations to Lord Sri Krishna - the beloved child of Nanda and the savior of the worlds; the one who taught the Bhagavad Gita, loves the truth, and remains eternally immersed in the meditation of Lord Shiva; the consort of Rukmini who bestows all auspiciousness, the embodiment of an inseparable and eternal love with Radha Devi, and the divine Lord of delightful, playful, and charming leelas."
    te: |-
      నందునిబిడ్డ, లోకములను రక్షించే శ్రీ కృష్ణునికి, భగవద్గీతను బోధించి, నిజమునిష్టపడే, ఎపుడూ శివుని తపస్సులో వుండే, అన్ని శుభాల్ని ఇచ్చే రుక్మిణీ భర్త, రాధాదేవితో ఎపుడూ వీడని ప్రేమ స్వరూపి, శృంగార చిలిపి చేష్టల భగవానునికి నమస్కారము.
  - type: verse
    id: v6
    no: '6'
    hk: |-
      rAmam zrIrAmam lokAn ramayantItirAmaH iti sArthaka nAmatAraka rAmam .
      kaikeyI nandanam kausalyAsutam, vaidehI vallabha dazaratha rAmam .
      vizvAmitra priyam vaziSTha viziSTa ziSyam ca satyavAkpAlana zobhita eka patnI vratAdi sakala guNAbhirAmam.
      paramezvara pUjita sadAzivArcanA rAjita saccidAnanda brahmam sarvezvaram zrI rAmam.
      zaraNA gata rakSaka, bhakta janapoSaka jagadabhirAmam zrI rAmam.
      jJAna vAziSThArtham ca yoga vAziSTham vizva tejasam zrIrAmam.
      kAruNyadhAmam kaivalyadam kaLyANa zrI kodaNDarAmam.
      tam namAmi nirantaram mamArAdhya rAmam manobhirAmam ca hanumatsevita rAmam {paraMjyotiH} parandhAmaH zrI zrIrAmam..
    en: "Obeisances always to Sri Rama: he who delights all the worlds (proving the meaning of his name), the beloved child of Kaikeyi, Kausalya and Dasharatha, the husband of Sita, dear to Vishwamitra, the special disciple of Vasishtha; a man of many great virtues such as faithfulness to one wife and truthfulness in carrying out his father's command; who worships Shiva and is himself always worshipped by Ishwara; the protector of those who take refuge in him, who graciously grants liberation and sees that all his devotees' wishes are fulfilled; the embodiment of the sacred, liberating teaching, the Yoga Vasishtha, the essence of the science of Jnana Vasishtha; the lord of all worlds, the auspicious one, the bearer of the bow, my chosen deity, who is always served by Hanuman."
    te: |-
      అన్నిలోకాలను సంతోషపెట్టే కైకేయీ, కౌసల్యాదశరథుల ముద్దు బిడ్డ, సీత భర్త, విశ్వామిత్రునికి ప్రియమైన, వశిష్టునికి ప్రత్యేకమైన శిష్యుడు, ఏకపత్నీవ్రతం, తండ్రి ఆజ్ఞను తలదాల్చేటటువంటి సత్యవాక్పాలన వంటి అనేక గొప్పగుణవ ంతుడు, శివుని పూజిస్తూ, ఎప్పుడూ ఈశ్వరుని చేత ఆరాధింపబడేవాడు, ఆశ్రయించిన వానికి రక్షకుడై, దయతో మోక్షమిచ్చే భక్తులకు అన్నీ అమరేటట్టు చూసేవాడు, “జ్ఞానవాశిష్ఠ”మనే విజ్ఞాన వేదానికి అర్థమైన, "యోగవాశిష్ఠ"మనే ముక్తి ప్రదమైన పవిత్ర ప్రబోధాత్మక వాఙ్మయస్వరూపుడు, సర్వలోకాలకు అధిపతి, శుభకారకుడు, ధనుర్ధారి, నా ఇష్టదైవము, ఎపుడూ హనుమంతునిచే సేవింపబడే శ్రీ రాముని కెపుడూ నమస్కారము.
  - type: verse
    id: v7
    no: '7'
    title: mantram
    hk: |-
      1) hariharaputrAya vidmahe zabaragirivAsAyadhImahi.
      tanno maNikaNThaH pracodayAt..
      2) viSNupAdodbhavAyai ca vidmahe zivazaGkara zirasthira nivAsinyaica dhImahi.
      tanno loka pAvanI gaGgA bhavAnIH pracodayAt..
    en: |-
      1) Salutations to Ayyappa Swami, famed by the name Manikanta, who dwells on Sabarigiri and is the son of Shiva and Keshava.
      2) Salutations, O Ganga Devi, born at the feet of Sri Maha Vishnu, who dwell on Shiva's head and purify all the worlds.
    te: |-
      1) శివకేశవుల కుమారుడై శబరగిరి మీదని వసించే మణికంఠుని పేరుతో ప్రశస్తికల అయ్యప్పస్వామికి వందనం. 
      2) శ్రీ మహావిష్ణువు పాదములందు పుట్టి, శివుని శిరస్సునవుండే, అన్నిలోకాలను పవిత్రం చేసే గంగాదేవీ! వందనం.
  - type: verse
    id: v8
    no: '8'
    hk: |-
      prAtarjapet pitAmaham ca madhyAhne mahezvara rUpiNIm.
      sandhyAkAlevibhum viSNum nityam zrI devIm zrI gAyatrI mAtaram..
    en: In the morning as Brahma, at noon as Shiva, and in the evening in the form of Vishnu, I worship Gayatri Devi every day.
    te: 'ప్రొద్దుట బ్రహ్మ, మధ్యాహ్నం శివుడు, సాయంత్రం విష్ణు రూపంతో, రోజూ గాయత్రీ దేవిని పూజిస్తున్నాను.'
  - type: verse
    id: v9
    no: '9'
    hk: |-
      namostu mAtApitarau namostu pratyakSa devau sucarita zobhitau.
      dhanyosmi zrI janakajananyau, dhanyosmi yuvayoH garbhodbhavam bhAgyam me mokSakArakam..
    en: Salutations to my parents, the visible gods. The good fortune of being born in your womb is what gives me liberation.
    te: 'ప్రత్యక్ష దైవాలైన తల్లిదండ్రులకు ప్రణామాలు. మీ గర్భమున జన్మించిన భాగ్యము నాకు ముక్తిదాయకము.'
  - type: verse
    id: v10
    no: '10'
    hk: aho! bhagavadanugraham advitIyam adbhutam, ayAcitam anirvacanIyam UhAtItam, karuNApUritam ca vizvarUpam adRzavizAlam Anandamayam..
    en: |-
      God's grace is incomparable and great, needs no asking, cannot be described and cannot be imagined; when it falls like a glance, it gives joy. (If we live in the right way, God helps and protects us. He shelters those who surrender to him.)
    te: 'దేవునిదయ సాటిలేనిది, గొప్పది, యాచించనవసరం లేనిది, వర్ణింపశక్యము కానిది, ఊహింపలేము దయతో లోకంకంటే విశాలమై ఆనందం ఇస్తుంది (మనం సరైన విధానంలో బ్రతికితే దేవుడు సహాయపడి రక్షిస్తాడు). శరణన్నవారిని ఆదుకుంటాడు.'
  - type: verse
    id: v11
    no: '11'
    hk: |-
      gaNezam gaurIzam vANIzam ramezam, zabarigirivAsinam ca aruNAcalezam .
      zrI SirDI kSetrezam puTTapartivAsinam tatsarvezam smarAmi sadA zrI sAyIzam ..
    en: 'I always remember the God who is the form of all of these: Ganapati, Shiva, Brahma, Vishnu, Ayyappa, Subrahmanya Kumara Swami, and the Sai Nathas who dwell in Shirdi and Puttaparthi.'
    te: 'గణపతి, శివుడు, బ్రహ్మ, విష్ణువు, అయ్యప్ప, సుబ్రహ్మణ్యం, కుమార స్వామి, షిర్డి, పుటపర్తిలలో వుండే సాయినాధులు, వీరందరి స్వరూప దైవాన్ని ఎపుడూ స్మరిస్తూంటాను.'
  - type: verse
    id: v12
    no: '12'
    hk: |-
      zrI hanumantam AJjaneyam dhanyam, sadA zrIrAma nAma dhyAna daivatam.
      zAkinI DhAkinyAdi duSTasUdanam, vande, bhava bhayaroga zokaharam harim ..
    en: Obeisances always to Anjaneya Swami, the son of Anjani, who is ever engaged in chanting the name of Rama, destroys all ghosts, spirits and demons, removes fear, illness and sufferings from worldly life, and protects.
    te: 'అంజనీకుమారుడు, ఎపుడూ రామనామస్మరణ చేస్తూ అన్ని భూత ప్రేత పిశాచాలను సంహరించి, సంసారంలోని భయము, అనారోగ్యం, బాధలను తొలగించి, రక్షించే ఆంజనేయ స్వామికి ఎపుడూ నమస్కారం.'
  - type: verse
    id: v13
    no: '13'
    hk: |-
      namAmi zivazivAnI kumAram, zrIvallIzam, tArakAsura sUdanam.
      mamasarvArthadam, surasenAninam, zrI subrahmaNyezvara daivatam..
    en: Obeisances always to Sri Subrahmanya Swami, the son of Gauri and Shankara, the husband of Sri Valli, the slayer of Tarakasura, the commander of the army of the gods, who gives me everything.
    te: 'గౌరీ శంకరుల కొడుకు, శ్రీ వల్లి భర్త, తారకాసురుని సంహరించిన, దేవతల సేనకు నాయకుడు, నాకు అన్నీ ఇచ్చే శ్రీ సుబ్రహ్మణ్య స్వామికేపుడూ నమస్సులు.'
  - type: verse
    id: v14
    no: '14'
    hk: |-
      vandeham zrI veGkaTezam sadA zrInivAnam, Azritavatsalam ca zrIvatsasam.
      kaliyuga pratyakSa daivatam me mokSadam zrI sarvezam smarAmi tam saptagirivAsinam..
    en: Salutations to Srinivasa, to Sri Venkatesha, the visible God of Kali Yuga who removes everyone's fears and protects them, the protector of all, the Lord of the seven hills.
    te: 'శ్రీనివాసునికి, శ్రీ వేంకటేశునుకి, ఎల్లరి భయాల్ని పోగొట్టి ఆదుకునే కలియుగంలోని ప్రత్యక్ష దైవం అందరికీ రక్షకుడైనవానికి, ఏడుకొండలవానికి వందనం.'
  - type: verse
    id: v15
    no: '15'
    hk: |-
      bhajeham ramya guNadhAmam maithilI manobhirAmam zrIrAmam.
      sAketa sArvabhaumam, satya sandham saccidAnandam zivapriyam.
      bhaktAbhISTa varadam abhayadam zrIdharam hanumadIzvaram, kausalyAnanda rAmam kaivalyadam, dAzarathim, zrIraghurAmam..
    en: 'I sing the praises of Sri Rama, the son of Dasharatha: a mass of good qualities, the husband of Sita, the ruler of Ayodhya, the delight of Kausalya, full of compassion, who removes all fears, sufferings and diseases in life and grants fearlessness, the beloved deity of Hanuman.'
    te: 'మంచి గుణముల రాశి, సీతాపతి, అయోధ్యాపాలకుడు, కౌసల్యకు సంతోషకారకుడు, దయతో నిండి జీవితంలో అన్ని భయాలు, బాధలు, రోగాలు తొలగించి, అభయమిచ్చే హనుమంతుని ఆరాధ్యదైవం, దశరథకుమారుడైన శ్రీరాముని భజనచేస్తున్నాను.'
  - type: verse
    id: v16
    no: '16'
    hk: |-
      helA lIlA hAsa vilAsa rasa lAsya zizum tam.
      hiraNmayI hRdayAravindam govindam mukundam..
      harim zrImannArAyaNam zrI mahAviSNum zivam tam.
      hiraNyagarbham zrI rAdhAkRSNam, vande mokSadam ..
    en: "Salutations to Radha and Krishna, who bestow liberation: the mischievous, smiling, playful little child who spreads fragrance like a flower in Rukmini's heart, who himself displayed the cosmic form as Vishnu and Shiva."
    te: 'కొంటెగా, నవ్వుతూ, చిలిపి చేష్టలు చేసే చిన్న పాపడు, రుక్మిణి మనస్సులో పూవులా పరిమళిస్తూ, విష్ణువు, శివుడు తానే విశ్వరూపం ప్రదర్శించిన, మోక్షమిచ్చే రాధాకృష్ణులకు నమోవాకాలు.'
  - type: verse
    id: v17
    no: '17'
    hk: tejomayIm zrI mahAlakSmIm sarvazubhakAriNIm suzlokAm zrIlam jayAm zrI devIm, aSTaizvarya dAyinIm, vande viSNu vakSaH prakAza razmim, varadAm zrI vaiSNavIm ..
    en: 'O Sri Maha Lakshmi, mass of radiance, the cause of all good works, the giver of all wealth, who shines on the chest of Sri Maha Vishnu: protect me, Mother!'
    te: 'వెలుగులప్రోగు, అన్ని మంచి కార్యాలకు కారకురాలు, అన్ని ఐశ్వర్యాలనిచ్చే, శ్రీ మహా విష్ణువు హృదయంపై ప్రకాశించే శ్రీ మహాలక్ష్మి, నన్ను బ్రోచి రక్షింపు తల్లీ !'
  - type: verse
    id: v18
    no: '18'
    hk: |-
      zrI rAmAvatAra rahasyam sarve sarvaloka raJjanam.
      zrI kRSNa bhagavadgItA sandezam ca yoga vidhita karmAcaraNam.
      tatsarvam zrI rAmakRSNa bodhanAmRta vedAnta sAram.
      vande vivekagurum devI prasanna zrI mAtuH zAradA nAtham..
    en: |-
      Bringing delight to all the worlds is the hidden truth of the Rama incarnation. The teaching of yoga, that one should carry out one's assigned duties with a steady, selfless mind as an austerity, is Sri Krishna's instruction in the Bhagavad Gita. All of this is in the Vedanta taught by Sri Ramakrishna Paramahamsa. Salutations to him, the guru of Swami Vivekananda, the husband of Sarada Mata, who made the Goddess appear before him.
    te: 'అన్నిలోకాలను సంతోషపెట్టడం రామావతారంలోని నిగూఢ నిజం, తనకు విధించిన పనులను స్థిరమైన, స్వార్ధరహితమైన మనస్సుతో, తపస్సులా ఆచరించమనే యోగబోధ భగవద్గీత శ్రీకృష్ణుని ఉపదేశం. ఇవన్నీ శ్రీ రామకృష్ణ పరమహంస బోధించిన వేదాంతంలో వున్నాయి. అటువంటి వివేకానంద స్వామి గురువు శారదామాతభర్తకు, దేవిని ప్రత్యక్షం చేసుకున్న వానికి వందనం.'
  - type: verse
    id: v19
    no: '19'
    hk: |-
      vande vindhyA girivAsinIm vizvambharIm sAvitrIm zrI durgAm sarasvatIm zAmbhavIm.
      vizvajananIm vaiSNavIm, paramezvarIm, saccidAnandabrAhmIm hariNIm haindavIm ..
    en: Obeisances to the Mother who dwells in the Vindhya mountains, who bears the universe, the single form of Savitri, Durga and Sarasvati, the mother of the worlds, who teaches the knowledge of Brahman that good thoughts bring joy.
    te: 'వింధ్యా పర్వతములలో నివసించే, విశ్వమును భరించే సావిత్రీ దుర్గా సరస్వతుల ఏకరూపం, లోకాలకు తల్లి, మంచి ఆలోచనే ఆనందకరమని బ్రహ్మజ్ఞానం బోధించే తల్లీ, నమస్కారం.'
  - type: verse
    id: v20
    no: '20'
    hk: |-
      zailajA zvedabindujanita vRkSAgra rAjitam.
      zyAmalAsRjitAtmahRdaya saundarya zrI sumam.
      zAradAnAtha harihara svarUpa tridaLapatram.
      samarpayAmi tat bilvam, sadAzivaprItyartham nityam..
    en: "I always offer to Shiva, for his pleasure, the bilva leaf: the three-leaf cluster that shines at the tip of a tree born from a drop of Goddess Parvati's sweat, the flower of inner beauty created by Goddess Lakshmi, the three leaves bearing the forms of Brahma, Vishnu and Maheshwara."
    te: 'పార్వతీ దేవి చెమట బిందువు నుంచి పుట్టిన చెట్టు అంచునవెలిగే, లక్ష్మీ దేవిచే సృష్టింపబడ్డ ఆత్మ సౌందర్య పూవు, బ్రహ్మా-విష్ణు-మహేశ్వరుల రూపాలతోవుండే మూడు ఆకులగుత్తి, మారేడు దళాన్ని ఎపుడూ శివునికి ఇష్టం కల్గించడానికి సమర్పిస్తున్నాను.'
  - type: verse
    id: v21
    no: '21'
    hk: |-
      vande vighnanAzaka, sarvasiddhi dAyaka zrI vighnezvara sahodarIm vizvezvarIm vizAlAkSIm pArvatI paramezvara priyaputrIm.
      sarvAbhISTa varapradAyinIm aSTaizvarya dAyinIm, zrI santoSi mAtaram .
      dehime, akhaNDa saubhAgyam prazAnta jIvanam ca prasIda hevizvapriyA ..
    en: 'Santoshi Mata, the younger sister of Vighneshwara who removes all obstacles and fulfils wishes, the beloved child of Shiva and Parvati who bears the lord of the world, bestower of all boons and giver of the eight kinds of wealth: protect me and give me, as long as I live, a contented life without suffering, with turmeric and kumkum (the marks of a happily married woman). Salutations.'
    te: 'అన్ని అడ్డంకుల్నీ తొలగించి, కోరికల్ని తీర్చే విఘ్నేశ్వరుని చెల్లెలు, ప్రపంచానికి అధిపతి భరించేది, శివపార్వతుల ముద్దులపట్టి, అన్ని వరాల్ని ప్రసాదించి, ఎనిమిది ఐశ్వర్యాలనూ ఇచ్చే సంతోషిమాతా రక్షించి, నాకు జీవితాంతం పసుపుకుంకుమలు బాధలేని సంతృప్తి నిండిన జీవితం ఇయ్యు - నమస్కారం.'
  - type: verse
    id: v22
    no: '22'
    hk: |-
      oM.. sarasijanAbham sarojahastam zrI zrIrAmam, mandasmitavadanam maGgaLezam zrIrAdhAkRSNam.
      oM namonArAyaNAya oM namazzivAya ceti dhyAyAmi niratam, tam, zivam, hrIm zrIm viSNum mokSadam..
    en: 'I always meditate on Shiva, Shakti and Lakshmi, and on Sri Mannarayana who grants liberation, with the eight-syllable mantra of Vishnu and the five-syllable mantra of Shiva: on Vishnu, in whose navel is the lotus stalk and flower, on Sri Rama of soft, lotus-like hands, on smiling-faced Krishna, the husband of Rukmini, and on Sri Radha and Krishna, the embodiment of love.'
    te: 'నాభినుండి తామరతాడు, పూవు కల విష్ణువు అవతారం, కమలము వంటి మృదువైన చేతులు గల శ్రీరాముడు, చిరునవ్వు ముఖంతో, రుక్మిణీపతి, ప్రేమ స్వరూపుడైన శ్రీ రాధాకృష్ణులు, అష్టాక్షరీ, శివపంచాక్షరీ మంత్రములతో ఎపుడూ శివుని, శక్తిని, లక్ష్మిని, మోక్షమిచ్చే శ్రీమన్నారాయణుని ధ్యానిస్తుంటాను.'
  - type: verse
    id: v23
    no: '23'
    hk: |-
      zatakoTi nArikeLa phalAntargata divya zvetakAnti tejasam zambhum .
      zatasahasrakoTi kSIrasAgara sadRza prakAzazobhitam zaGkaram.
      ananta koTi tArAzazi tejo rAzinam sAmbam, tulasI bilvasahitam.
      tam ArAdhayAmi hariharasvarUpa sadAzivAtmaliGgam me viSNusAyujyadam..
    en: I always meditate on the Atmalinga of Shiva, the one form in which Shiva and Vishnu are united (which gives liberation and the world of Vishnu), like the pure white light inside a hundred crore coconuts, like the brilliance of a hundred thousand crore oceans of milk, a mass of light of endless crores of stars and moons.
    te: 'నూరుకోట్ల కొబ్బరి కాయల లోన వుండే పవిత్రమైన తెల్లని కాంతి వలె, నూరు వేలకోట్ల పాలసముద్రపు వెలుగులా, అంతులేని కోట్లనక్షత్ర, చంద్రుల కాంతి సమూహం, శివవిష్ణువులు కల్సిన ఏకైక రూపమైన శివుని ఆత్మలింగాన్ని (మోక్షాన్నిచ్చే, విష్ణు లోకాన్నిచ్చే) ఎపుడూ ధ్యానిస్తూన్నాను.'
  - type: verse
    id: v24
    no: '24'
    hk: |-
      tejasvinIm tanmayIm, lakSmIm, hariNIm nArAyaNIm vibhUtIm, ramAm kSIrajAm.
      tejazrIm svaprakAza rUpiNIm, vande hiraNmayIm zriyAm, zivAm ca mokSadAm ..
    en: O Mother, radiating with brilliant effulgence, born of the ocean of milk, the divine consort of Lord Sri Maha Vishnu, the universal mother to all, and the bestower of all riches, luxuries, and fortunes! Salutations unto You who grants supreme liberation; I shall always meditate upon You.
    te: 'కళకళలాడే తేజస్సుతో, పాలసముద్రం నుంచి పుట్టి, శ్రీ మహా విష్ణువుకు భార్యవై, అందరకు తల్లివై, అన్ని భోగభాగ్యాలనిచ్చే తల్లీ! మోక్షమునిచ్చే నీకు ప్రణామం. ఎపుడూ నిన్ను ధ్యాన్నిస్తుంటాను.'
  - type: verse
    id: v25
    no: '25'
    title: sarvArtha sUkSma zlokam
    hk: |-
      oM namo nArAyaNAya oM namazzivAyaca zrIrAma zrI rAdhAkRSNeti .
      dhyAyAmi zrI karam zambhum tatsAmbazivAtmaliGgam vizvezam viSNu sAyujyadam me ..
    en: 'I meditate on the God who gives liberation in all forms: Sri Rama, Radha and Krishna, and the Atmalinga of Shiva who gives all auspiciousness, with the eight-syllable names of Vishnu and the five-syllable names of Shiva. May I always be liberated!'
    te: 'విష్ణు అష్టాక్షరీ, శివపంచాక్షరీ నామాలతో శ్రీరాముని, రాధాకృష్ణులను, అన్ని శుభాలనిచ్చే శివుని ఆత్మలింగం - అన్ని రూపాలతో మోక్షమిచ్చే భగవంతుని ధ్యానిస్తున్నాను. ఎల్లప్పుడు తరించెదగాక!'
  - type: section
    id: s01
    hk: |-
      zrI zrIvanalaharI hAram
      sarva saGkaTahAra zrI rAdhAkRSNASTapadI
    en: 'Sri Sri Vanavihari Haram (The Garland of the Divine Forest Wanderer) - The Sri Radha-Krishna Ashtapadi that dispels all afflictions and difficulties.'
  - type: verse
    id: v26
    no: '26'
    hk: |-
      mugdhamanoharamUrtim, muraLInAda lInam.
      vizvarUpadhAraNam, vizvamohana vigraham.
      sadAhasita vadanam, veNugopAla zrIkRSNam.
      rAdhAmAdhavam, namAmi nityam, viSNusAyujyadam..
    en: "I constantly bow to Sri Venugopala Krishna: the charming form that merges into the sound of the flute, who holds all the worlds within himself, whose figure enchants the fourteen worlds, whose face never loses its smile, who is always together with Radha Devi, and who grants liberation in the form of a permanent abode in Vishnu's world at the end of life."
    te: 'ముచ్చట గొలిపే రూపం వేణు ధ్వనిలో కలిసివుంటూ, అన్నిలోకాలను తనలో నిలుపుకునే, చతుర్దశ భువనాలను మైమరపించే ఆకృతి, చిరునవ్వు చెక్కుచెదరని మొగము, రాధాదేవితో ఎల్లవుడూ కలసివుంటూ, విష్ణులోకంలో జన్మాంతమున శాశ్వతనివాసమనే మోక్షమును ప్రసాదించే, శ్రీ వేణుగోపాల కృష్ణునికి, నిత్యమూ నమస్కరిస్తున్నాను.'
  - type: verse
    id: v27
    no: '27'
    hk: |-
      zaraNAgatavatsalam zyamantaka grahItAram, zvetavAhana sArathim.
      sarva maGgaLakaram, uddAlakAkrUrakucelAdibhaktavaradam.
      satyasvarUpam, pArijAtApahAriNam, satsaGkalpa siddhidam, namAmi.
      sAmavedapriyam, sAndIpanI ziSyam, zrI balarAmAnujam, zrI kRSNam..
    en: 'Salutations to Sri Krishna, the younger brother of Balarama: he who cherishes even one who has been an enemy; who accepted the Syamantaka jewel when Satrajit offered it along with his daughter Satyabhama; the charioteer of Arjuna; the cause of all auspiciousness; who cherished crores upon crores of devotees such as Uddalaka, Akrura and Kuchela; the God whose own form is the form of truth; who brought the parijata flower from the world of the gods (meaning he made this sacred flower available to devotees on earth); who blesses all works begun with a good intention; who loves the singing of the Sama Veda; who became a disciple of the sage Sandipani (showing that, however great, even God, being born on earth, must serve his guru and receive learning from him).'
    te: 'నీవేదిక్కని మ్రొక్కినవానిని ఆదరించేవాడు, శ్యమంతకమణిని సత్రాజిత్, కుమార్తె సత్యభామతోపాటు సమర్పించగా స్వీకరించినవాడు, అర్జునుని రథసారథి, అన్ని శుభములకు కారకుడు, ఉద్దాలకుడు, అక్రూరుడు, కుచేలుడు వంటి కోటానుకోట్ల భక్తులను ఆదరించినవాడు, తన రూపే నిజము యొక్క ఆకారముగల దైవం, దేవలోకం నుంచి పారిజాతపు పువ్వును తెచ్చినవాడు (భూలోకంలోని భక్తులకు యీ పవిత్ర పుష్పమును అందుబాటులోనికి తెచ్చినవాడని భావము), మంచి ఉద్దేశ్యంతో ప్రారంభించిన అన్ని పనులను అనుగ్రహించేవాడు, సామవేదగానం ఇష్టపడేవాడు, సాందీపనీ మహర్షి శిష్యుడై (ఎంత వాడైనా చివరకు భగవంతుడైనా సరే, భూలోకంలో జన్మించినందున గురువుకు శుశ్రూష చేసి, వారిద్వారా విద్యను పొందాలనే విధిని ఆచరించి చూపించిన), బలరాముని తమ్ముడైన శ్రీ కృష్ణునుకి వందనం.'
  - type: verse
    id: v28
    no: '28'
    hk: |-
      karmAcaraNabodhakam, vidhitakarmAcaraNa Adarza puruSam.
      sadAzivapUjitam, tapasvinam, tapassva rUpam, tapamAtreNa prasannam.
      tapAntam, tapAntargatam, tapaH prayojanam ca, paramArtham, zrI harim.
      tApatrayaharam, tattvAcAryam, praNamAmi, tam, tANDava zrI kRSNam..
    en: 'Salutations to Sri Krishna the dancer: who stood as an ideal by performing all his own duties, in the way that every person must do all the duties assigned to them by birth, by scripture and by society, and not the way of those who preach false renunciation and dry Vedanta to avoid responsibility; whom Shiva always worships; whose very form is penance, yet who is pleased only through penance (the path of devotion as meditation); who is himself the end of penance, the hidden light, the purpose and the fruit of penance as Sri Maha Vishnu himself; who drives away the sorrow of devotees; who taught through the Bhagavad Gita the duties to be performed in life and the Vedanta to be reflected upon at the end of life.'
    te: 'ప్రతీ మానవుడు, జన్మరీత్యా శాస్త్రరీత్యా, సాంఘికరీత్యా తనకు విధించబడిన అన్ని పనులనూ చేసి తీరాలని, బాధ్యతను ఎగగొట్టేందుకు కుహనావైరాగ్యం, మెట్టవేదాంతం చెప్పేవాళ్ళను మొట్టినట్లుగా, తనతనకర్మలన్నీ ఆచరించి, ఆదర్శంగా నిలచినవాడు, ఎల్లప్పుడూ శివుడు పూజించే, తనరూపమే తపస్సు అయినా, స్వయంగా తపస్సుచేసే కేవలం తపస్సు ద్వారా (ధ్యానరూపమైన భక్తిమార్గం ద్వారా) మాత్రమే అనుగ్రహించే, తపస్సుకు తుది తానే, నిబిడీకృతమైన దీతనే, తపస్సు ఉద్దేశ్యము, ఫలితము కూడా శ్రీ మహావిష్ణువే తానై, భక్తులవ్యధను పారద్రోలే, భగవద్గీత ద్వారా జీవితంలో ఆచరించవలసిన కర్మలు, జీవితాంతములో విచారించవలసిన (ఆలోచించ వలసిన) వేదాంతం బోధించిన నృత్యము చేసే శ్రీ కృష్ణునికి నమస్సులు.'
  - type: verse
    id: v29
    no: '29'
    hk: |-
      duSTazikSaNam, ziSTarakSaNam, zrI kRSNAvatAraramya gamyam.
      vRSabha, zakaTa, kaMsa, naraka, zizupAlAdyasura saMharaNam.
      lIlAmAnuSa vigraham, bAlA lIlAvinodinam manoharam.
      yogavidyA vidhAtAram nRtyagAna rasarAgamayam, bhaje ..
    en: 'I sing the praises of Sri Krishna, the embodiment of love, who loves the Rasa Lila: the great, joyful and beautiful way of the Krishna incarnation is to punish evil and the wicked and to cherish and protect good people. He killed many wicked tormentors of the world such as Dhenukasura, Kamsa, Naraka and Shishupala, and with his childhood pranks, many divine plays, games and songs, he delights and pleases everyone; he created the science of yoga.'
    te: 'చెడును, చెడ్డవారిని దండించి, మంచిని, మంచి వారిని ఆదరించి, రక్షించడమే శ్రీ కృష్ణావతారము యొక్క గొప్ప ఆనందకరమైన, అందమైన పద్ధతి. ధేనుకాసురుడు, కంసుడు, నరకాసురుడు, శిశుపాలుడు వంటి అనేక లోక కంఠకులైన దుర్మార్గులను సంహరించిన, తన బాల్యచేష్టలతో, ఎన్నో లీలలతో, ఆటపాటలతో, ఆనందిస్తూ ఎల్లరనూ సంతోషపరచేవాడు, యోగవిద్యను సృష్టించి, రాసలీలను ఇష్టపడే, ప్రేమ స్వరూపుడైన శ్రీ కృష్ణునికి భజన చేయుచున్నాను.'
  - type: verse
    id: v30
    no: '30'
    hk: |-
      naLinInAtham, navInItacoram nIlatejam, nIrajAkSam.
      yazodAnanda, devakIvasudeva sutam, gopAlam, gokSIrapriyam .
      gopIvastrApahara, kALIyamardana, govardhanoddhArakam .
      kurukSetre, arjunamArgadarzinam zrI kRSNam, vandeham jagadgurum..
    en: "Salutations to Sri Krishna, the teacher of the world: the husband of Lakshmi (Rukmini), the butter thief, shining in a blue hue, with beautiful lotus-like eyes, the son of Yashoda and Nanda and of Devaki and Vasudeva, who tended cows and happily drank cow's milk; who took away the clothes of the gopikas (a small joke by the child Gopala to show them their irresponsible behaviour: after performing a forty-day vow of worship to Katyayani Devi and without completing the closing rite, they left their clothes on the bank shamelessly and bathed in the Yamuna ghat, a place where people pass); who danced on the head of the wicked serpent Kaliya, humbled his pride, drove him out of the lake spoiled by the flames of his poison and, after purifying it, made its clean water available for everyone to drink; who lifted Mount Govardhana like an umbrella and protected the cowherds from Indra's rain of stones; who, at Kurukshetra, taught the doctrine of karma, divinity and Vedanta as the Bhagavad Gita to Arjuna, who had fallen into delusion, saying he would not fight, kill his kinsmen and win a kingdom, and made him turn to his duty."
    te: 'లక్ష్మి (రుక్మిణి) భర్త, వెన్నదొంగ, నీలవర్ణంతో ప్రకాశించేవాడు, పద్మం (తామర పువ్వు) వంటి అందమైన కన్నులుగలవాడు, యశోదానందులకు, దేవకీవసుదేవులకు పుత్రుడు, గోవులను కాచి, ఆవుపాలను ప్రీతిగా త్రాగేవాడు, గోపికల వస్త్రములను ఎత్తుకు పోయిన వాడు (కాత్యాయనీదేవికి 40 రోజులు దీక్షతో పూజచేసి, ఉద్యాపనచేయకుండా, సిగ్గు లేకుండా బట్టలు గట్టుపై వదిలేసి, నలుగురుసంచరించే ప్రదేశంలోని యమునానది ఘాట్ లో స్నానం చేస్తున్న బాధ్యతారహిత ప్రవర్తనను వారికే తెలియ చెప్పాలని బాలగోపాలుడు చేసిన చిన్న చమత్కారం), కాళియుడనే దుష్టసర్పమును త్రొక్కితలపై నర్తించి, గర్వభంగము చేసి, వాని విషజ్వాలలవల్ల చెడిపోయిన సరస్సు (నుంచి పారద్రోలి), శుద్ధిచేసిన తదుపరి శుభ్రమైన ఆ నీటి మడుగునీళ్ళు అందరికీ త్రాగుటకు అందచేసిన వాడు గోవర్ధన గిరి పర్వతమును గొడుగులా పైకెత్తి ఇంద్రుని శిలావర్షం నుంచి గోపాలురను రక్షించిన, కురుక్షేత్రంలో యుద్ధం చేసి, బంధువులను సంహరించి, రాజ్యము సంపాదించనని మోహంలో పడిన అర్జునునికి కర్మసిద్ధాంతము, దైవత్వం వేదాంతం భగవద్గీతగా బోధించి, కర్తవ్యోన్ముఖుని చేసినలోక గురువు శ్రీ కృష్ణునికి నమస్కారము.'
  - type: verse
    id: v31
    no: '31'
    hk: |-
      krUrastrI pUtana prANaharam, harivaMzAcAradharma prakAram.
      mAyAmohita, gopastrIsaha bRndAvanarAsa keLIvirAjinam.
      aSTadevI vallabham, vipra, gopa, gopikA gogaNarakSakam .
      vande, zrIharam, iLA patim, zrI kRSNam mamaviSNu sAyujyadam ..
    en: Salutations to you, Sri Krishna, who give liberation, the permanent abode in the world of Vishnu. Killing Putana, who came with the wicked intention of killing you, without considering that she was a woman, is in keeping with the practice in the Sri Harivamsa (was it not the earlier incarnation of Vishnu, Sri Rama, who killed Tataka, and only afterwards, in the Krishna incarnation, Putana's death?). You shone, performing the Rasa dance in Brindavan with the gopa women enchanted by your maya. You are the lord of the eight chief queens, and the protector of those rich in knowledge of Brahman, of the cowherds, the gopikas and the herds of cows. O Sri Maha Vishnu! Lord of the earth! Sri Krishna!
    te: 'తనను చంపాలనే దుష్టాలోచనతో వచ్చిన పూతనను, “స్త్రీ” అని ఆలోచించకుండా ప్రాణాలు తియ్యటం శ్రీహరి వంశంలోవున్న ఆచార ప్రకారమే (విష్ణువు ముందు అవతారమైన శ్రీరాముడు తాటకిని చంపడం, తర్వాతే శ్రీ కృష్ణావతారంలో పూతనవధకదా!) నీ మాయ వల్ల మోహితులైన గోపస్త్రీలతో సహా బృందావనంలో రాసకేళి జరిపి ప్రకాశించావు. ఎనిమిది మంది పట్టమహిషుల నాధుడవు, బ్రహ్మజ్ఞాన సంపన్నులకు, గోపాలురకు, గోపికలకు, ఆవులమందలకు రక్షకుడవు. ఓ శ్రీ మహావిష్ణూ! భూపతీ! శ్రీకృష్ణా! నాకు విష్ణులోక శాశ్వతనివాసమనే ముక్తినిచ్చే నీకు నమస్కారం.'
  - type: verse
    id: v32
    no: '32'
    hk: |-
      rAjasUyAdhvarya pramukham, agre yudhiSThara pUjitam.
      draupadImAnarakSakam, virAT rUpapradarzinam.
      codyadautya zrI kRSNam, bhUbhArahara bhArataraNa sUtradhAriNam.
      pANDu vaMzavaradam, vande zrI kRSNam, mamakaivalyadam..
    en: "Salutations to Sri Krishna, who gives me liberation: the chief cause of the Rajasuya sacrifice performed by Dharmaraja, the most important of all, who received the first worship; who protected Draupadi's honour from the disrobing and showed the cosmic form; who performed the strange embassy; the cause of the great Mahabharata war that lightened the earth's burden; who, so that the Pandava line would not end, placed his discus in the way and saved Parikshit from Ashwatthama's divine weapon, the Brahmashiras."
    te: 'ధర్మరాజు చేసిన రాజసూయ యాగమునకు ప్రధాన కారకుడు, అందరిలోకి ముఖ్యుడు, మొదటి పూజ అందుకున్న ద్రౌపదిమానమును వస్త్రాపహరణం జరక్కుండా రక్షించిన విశ్వరూపము ప్రదర్శించిన, విచిత్రమైన రాయబారంనెరపి, భూమి బరువుతగ్గించే మహా భారత యుద్ధముకు కారకుడు, పాండువంశము అంతమైపోకుండా, చక్రం అడ్డుపెట్టి అశ్వత్థామ బ్రహ్మశిరోనామక దివ్యాస్త్రం నుండి పరీక్షిత్తును రక్షించిన, నాకు ముక్తి ప్రసాదించే శ్రీ కృష్ణునికి నమస్సులు.'
  - type: verse
    id: v33
    no: '33'
    hk: |-
      sarvam zrIkRSNam, sarve sarvadA zrIkRSNam, sarvezam zrIkRSNam, sarva sarvezam zrI kRSNam.
      sRSTissarvam satyam zrI kRSNamayam, he rAdhAkRSNa tvameva mama zaraNam ..
    en: Everything is Sri Krishna and everywhere is Sri Krishna; Sri Krishna is the lord of all and the lord of all lords. It is true that the whole creation is filled with Sri Krishna. O Radha and Krishna! You alone are my refuge.
    te: 'అంతా శ్రీ కృష్ణుడే, అంతటా శ్రీ కృష్ణుడే, అందరకూ ప్రభువు శ్రీ కృష్ణుడే, అందరి ప్రభువులకూ ప్రభువు శ్రీ కృష్ణుడే, మొత్తం సృష్టి అంతా శ్రీ కృష్ణునితో నిండి వున్నదన్నది నిజం. ఓ రాధా కృష్ణులారా! మీరే నాకు దిక్కు.'
  - type: verse
    id: v34
    no: '34'
    title: sASTAGgam
    hk: |-
      ArtatrANa parAyaNam, nArAyaNam, vaikuNThAdhipam, paramAtmAnam, zrI harim.
      zaGkha cakrazAraGga sarojahastam, viSNum vaijayantI zobhita zrI kaNTham .
      dazAvatAra dharam dazadizAdIpti karam, dayALum, puruSottamam .
      zivam, vizvezam vizvagurum zrIrAmam, namAmi tatsarvezam, zrI kRSNam me mokSadam ..
    en: 'Salutations to Sri Krishna, who gives me liberation: Sri Mannarayana who comes to the aid of those who cry out, the ruler of Vaikuntha, the Supreme Self, Sri Maha Vishnu, who holds the conch, discus, mace and lotus in his hands, who lights up the ten directions, the compassionate one who took the ten incarnations and helped the afflicted, the best among men, the lord of the universe who looks on all equally and grants wealth as Shiva, the teacher of all the worlds as Sri Rama, worshipped in many such forms, and the ruler of all the worlds.'
    te: 'ఆక్రోశించిన వారిని ఆదుకునే, శ్రీ మన్నారాయణుడు, వైకుంఠానికి పాలకుడు, పరమాత్ముడు, శ్రీ మహావిష్ణువు, శంఖం, చక్రం, గద తామరపూవుచేతుల ధరించిన, పదిదిక్కులను ప్రకాశింపచేసే, దశావతారాలు ధరించి బాధితులను ఆదుకున్న దయామయుడు, పురుషులలో శ్రేష్ఠుడు, అందరినీ సమానంగా చూస్తూ, ఐశ్వర్యములనిచ్చే విశ్వానికి ప్రభువైన శివుడు, లోకాలన్నిటికి గురువైన శ్రీరాముడు ఇలా అనేక రూపాలలో ఆరాధింపబడే, అన్నిలోకాలకు పరిపాలకుడైన నాకు మోక్షమిచ్చే శ్రీ కృష్ణునికి ప్రణామము.'
  - type: verse
    id: v35
    no: '35'
    title: AtmArpaNam
    hk: |-
      pAhimAm, pAhimAm, pApanAzaka pAhimAm.
      rakSamAm, rakSamAm, zrI rAdhAkRSNa rakSamAm .
      nAsti tvam vinA mamagatiH varada! zaraNAgata vatsala.
      dehime, abhayam aparAdhakSamam, ante viSNu sAyujyam, zAzvata zrI hari caraNasAnnidhyam..
    en: Rescue me, rescue me, destroyer of sins! Protect me, protect me, O God Radha-Krishna! I have no refuge but you. Protector of those who take refuge, remove my fear and forgive all my faults. When this life is over, grant me liberation! Bless me to remain forever at the feet of Sri Maha Vishnu!
    te: 'ఆదుకో నన్నాదుకో, పాపాలు నశింపచేసేవాడా! నన్ను కాపాడు, కాపాడు ఓ రాధా కృష్ణ దైవమా! నువ్వుతప్ప నాకేవేరే దిక్కులేదు ఆశ్రయించిన వార్ని కాపాడేవాడా నాకు భయంపోగొట్టు, అన్ని తప్పులను క్షమించు ఈ జీవితం పూర్తయ్యాక ముక్తి ఇయ్యు! శాశ్వతంగా శ్రీ మహావిష్ణువు పాదముల దగ్గర వుండేలా అనుగ్రహించు!'
  - type: section
    id: s02
    hk: zrI zivapaJcakam
    en: 'The sacred five-verse hymn in praise of Lord Shiva'
  - type: verse
    id: v36
    no: '36'
    hk: |-
      vizvamayam, vizvajanakam, vizvezam vizvanAtham.
      vizvezvaram, virUpAkSam vizvazAnti karam.
      vizvarUpam zrI vizvambharam.
      vande, sadAzivam, sAmbam, zambhum, Izvaram, zaGkaram..
    en: 'Obeisances always to Sarveshwara, the father who pervades all the worlds, Ishwara the ruler and protector, the three-eyed one, the cause of peace, the sustainer.'
    te: 'లోకములన్నిట వ్యాపించిన తండ్రి, ఈశ్వరుడు, పాలకుడు, రక్షకుడు, ముక్కంటి, శాంతి కారకుడు, భరించే వాడైన సర్వేశ్వరునికెప్పుడూ నమస్కారం.'
  - type: verse
    id: v37
    no: '37'
    hk: |-
      himagirivAsinam, prathama gaNAdhipam .
      zAnta svarUpam, namo vedassarvAntargatam .
      viSNuvallabham pArvatI prANanAtham, mokSakaram.
      vande sadAzivam pArvatIprANanAtham, sAmbam, zambhum, Izvaram zaGkaram..
    en: Salutations to Samba Sadashiva, the dweller of the Himalayas, the lord of the foremost ganas, the embodiment of peace, who is rooted in all the Vedas, the master of Sri Maha Vishnu, the husband of Parvati, the giver of liberation.
    te: 'హిమాలయవాసి, ప్రథమ గణములకధిపతి, శాంతి స్వరూపుడు, అన్ని వేదాములందు నిబిడీకృతుడు, శ్రీ మహావిష్ణువుకు అధినాథుడు, పార్వతీపతి, మోక్షకారకుడైన సాంబ సదాశివునికి వందనము.'
  - type: verse
    id: v38
    no: '38'
    hk: |-
      zvetam himAlayaH zvetam, zirasthitazcandra nandiH zvetam mAmAGkita vizvamAtaH divyam.
      zvetamanantam phAlAkSammama kaivalyadam.
      vande, sadAzivam, sAmbara, zambhum Izvaram, zaGkaram..
    en: 'Salutations to Samba Sadashiva, the three-eyed one who grants liberation: the one whose abode, the Himalayan mountain (Kailasa), is white, with the moon on his head and Mother of the Universe Uma Devi on his left side, who shines with endless divine white radiance, the light of the universe.'
    te: 'నివాసమైన హిమవత్పరృతము (కైలాసం), నెత్తిమీది చంద్రుడు, ఎడమ ప్రక్కనున్న జగన్మాత ఉమాదేవి, ధవళమైతే, అనంత దివ్య ధవళకాంతితో తళతళలాడే జగజ్జ్యోతి త్రినేత్రుడు మోక్షమిచ్చే సాంబసదా శివునికి నమస్కృతులు.'
  - type: verse
    id: v39
    no: '39'
    hk: yo(ve)gezvarapura chAyAso 'mezvaram govUru' (kOvvUru) umAcoDezvaram zrI rAmezvaram, muktezvaram, kAzIkSetrezvaram, zrIkALahastIzvaram zrI rAjarAjezvaram drAkSArAmezvaram ' pazupatezvaram zrI kALezvaram, kedArezvaram, zrI vaTTi nakSIrArAmezvaram, dvAdaza liGgezvaram, koTiliGgezvaram, kaliyuga kailAsa gokarNezvaram, vande sadAzivam, sAmbam, zambhum Izvaram, zaGkaram..
    en: 'Salutations to Samba Sadashiva, who shines under many names in twelve sacred places: as Chhaya Someshwara at Yogeshwarapuram (Vegeshwarapuram) in West Godavari district; at Kovvur, the Goshpada kshetra, as Uma Chodeshwara, where Sri Radha and Krishna delight as guardians of the shrine; as Rameshwara, installed by Sri Rama in the south; in East Godavari district as Mukteshwaram, Draksharamam, and Koti Lingeshwara in Rajahmundry (known as the Dakshina Kashi; after the Kashi pilgrimage one must come here and mingle the Ganga with the Godavari, otherwise it is not fulfilled); Kashi, Vemulawada, Kalahasti, Nepal; Kaleshwaram in Adilabad district, in the middle of the Godavari; Kedaram in the Himalayas; and Palakollu in West Godavari district.'
    te: 'పశ్చిమ గోదావరి జిల్లాలోని వే(యో)గేశ్వరపురంలో ఛాయా సోమేశ్వరునిగా, కొవ్వూరు గోష్పాదక్షేత్రం, శ్రీ రాధాకృష్ణులు క్షేత్రపాలకులై మురిపించగా ఉమాచోడేశ్వరునిగా, దక్షిణాదిన శ్రీరాముడు ప్రతిష్ఠించిన రామేశ్వరునిగా తూర్పుగోదావరి జిల్లా ముక్తీశ్వరం, ద్రాక్షారామం, రాజమహేంద్రవరములోని కోటిలింగేశ్వరునిగా (దక్షిణ కాశీగా ప్రసిద్ధి కాశీయాత్ర తర్వాత ఇక్కడికివచ్చి గంగను గోదావరిలో కలువకపోతే, సిద్దించదు), కాశీ, వేములవాడ, కాళహస్తి, నేపాల్, గోదావరి మధ్యలోని పట్టీ సం ఆదిలాబాద్ జిల్లాలోని కాళేశ్వరం, హిమాలయల్లోని) కేదారం, పశ్చిమగోదావరిజిల్లాలోని పాలకొల్లు, 12 క్షేత్రాల్లో పలునామాలతో విరాజిల్లే సాంబసదాశివునికి ప్రణామం.'
  - type: verse
    id: v40
    no: '40'
    hk: |-
      nIla grIvam, nIlalo hitam, naLinI vUjitam, pUjayAmi, tulasI, bilva gaGgAjala sahitam.
      nAgabhUSaNam naTarAjam, nAthamanAtham, zaGkhanA dapriyam.
      nAgezvaram gaurI mahezvaram kailAsezvarammamamo kSadam, hariharaika rUpazivAtmaliGgam, vande, sadAzivam, sAmbam, zambhum, Izvaram zaGkaram ..
      zivAyanamaH oM zivAyanamaH zivAyanamaH onnamazzivAyanamaH .
      harAya namaH oM harAya namaH harAya namaH oM namazzivAyanamaH ..
    en: 'I offer salutations to the Shivatmalinga, the single form that is the union of Shiva and Vishnu and grants liberation, worshipping it with tulsi, bilva leaves and Ganga water. I bow, chanting hymns to Shiva and Hara: the blue-throated one, a mass of blue radiance, worshipped by Sri Lakshmi Devi, the wearer of serpents, Nataraja, the refuge of the refugeless, Nageshwara who loves the sound of the conch.'
    te: 'నీల కంఠుడు, నీలివర్ణకాంతిపుంజం, శ్రీ లక్ష్మీదేవితో పూజింపడే, సర్పధారి, నటరాజ, దిక్కులేని వారికి దిక్కు శంఖ శబ్దం ఇష్టపడే నాగేశ్వరుడు, మోక్షాన్నిచ్చే శివవిష్ణువుల కలయికగా ఒకే రూపమైన శివాత్మలింగమును తులసీ, మారేడుగంగానీరముతో అర్చించి వందనం సమర్పిస్తూన్నా శివుడు, హరుడు అనిస్తోత్రముచేస్తూ, నమస్కరిస్తున్నాను.'
  - type: verse
    id: v41
    no: '41'
    title: AtmArpaNam
    hk: |-
      zrIkaram, zubhakaram, zreyadam, zivam, jagadIzvaram .
      tArakArAmamantrasRjita, tapasvinam, .
      trilocanam.
      trivikramam, tripurAntakam, namojaga nAthapUjitam.
      vande, sadAzivam sAmbam, zambhum, Izvaram, zaGkaram..
      pAhimAm, paramezvara.
      rakSamAm bhaktavarada.
      sAmbasadAzivazambho zaGkara zaraNam me tava caraNa yugam.
      'zambho, zaGkara sAmbasadAziva tavacaraNa -yugam mama zaraNam zivoham, zivoham, zivoham, zivoham.
      haroham, haroham, haroham, haroham...
      ahambrahma, ahaMviSNuH ahande vomahe zvaraH ahaGkAra rahita maham, pazyAmi sAkSAt parabrahmam, mamahRdayAntargata rAjitam.
      tvamevAham, tvamevAham, tvamevA hanna saMzayaH sarvajJo bhagavada nujJayA ..
    en: Always, salutations to Samba Sadashiva, the cause of wealth and auspicious good, who cherishes all equally, the protector of the world, the three-eyed one, the incomparable hero of the three worlds, the slayer of the three demons of Tripura, worshipped by Sri Maha Vishnu. Protect and save me, O lover of devotees! Your feet are my refuge. Since you grant liberation by merging the jivatma, which stands in me as a part of you, into the Paramatma, by becoming one with you, you are I and I am you; there is no difference of higher or lower. In that case, whatever forms we take, Brahma, Vishnu, Shiva and so on, the two of us who have merged into that Supreme Self are one. Since you have graciously let my ego perish and the eye of knowledge open, I am able to see mentally your divine form of light shining in my heart.
    te: 'ఐశ్వర్య శుభప్రదమైన మంచికి కారకుడు, అందరినీ సమంగా ఆదరించే, జగద్రక్షకుని, ముక్కంటి, ముల్లోకాలలో సాటిలేని పరాక్రమశాలి, త్రిపురాలైన ముగ్గురు రాక్షసులను మట్టుపెట్టినవాడు, శ్రీ మహావిష్ణువు పూజించే సాంబ సదా శివునికి ఎల్లపుడూ నమోవాకములు నన్నుబ్రోచి రక్షించు, ఓ భక్తపక్షపాతీ! నీ పాదాలే నాకు శరణ్యం, నాలోని నీ అంశతో నిలిచియున్న జీవాత్మను పరమాత్మలో లయంచేస్తూ నువ్వు మోక్షం ఇస్తావు కాబట్టి నీలో ఐక్యమైపోవడం వల్ల నీవే నేను, నేనే నీవు, తరతమబేధాల్లేవు. అటువంటప్పుడు బ్రహ్మ, విష్ణు, శివ వగైరా ఏ రూపాల్లో వున్నా ఆపరమాత్మలో కలిసిపోయిన మనమిద్దరమూ ఒకటే. అహంకారం నశించిపోయి, జ్ఞాననేత్రం తెరుచుకునేటట్లు నువ్వు అనుగ్రహించావు కాబట్టి నా హృదయంలో కలప్రకాశించే నీ దివ్య జ్యోతి స్వరూపాన్ని మానసికంగా చూడగల్గుతున్నాను.'
  - type: verse
    id: v42
    no: '42'
    title: maGgaLAzAsanam
    hk: |-
      zrI rAma devAya, zivazaGkarAya, bhakta varadA yamaGgaLam.
      zrI rukmiNI prANanAdhAya, zrI rAdhAkRSNa prabhave, maGgaLam jayamaGgaLam sarvamaGgaLam nitya zubhamaGgaLam ..
    en: Lord Sri Rama, Lord Siva, bestower of boons to devotees, he who is the beloved of Sri Rukmini, Sri Radha Krishna, all auspiciousness unto you in all its several forms!
    te: 'మంగళ వాక్యము'
  - type: verse
    id: v43
    no: '43'
    hk: |-
      zrI sarasvatIstutiH zrI sarasvatI SoDazAkSara svarNamAlA oM vAgdevIm varadAyinIm vidyA pradAyinIm vidyAm vraNAmi vANIm vINApANIJcajJAna sarasvatIm.
      zAradAMvi zAradAm vandevarademokSArthInamme rakSa bhAratI .
      bAsara vAsinI .
      bhaktavatsalA;
    en: |-
      Hymn to Sarasvati (a golden garland of 16 syllables).
      Salutations to Sarasvati: lord of all speech, the giver of what is asked, the bestower of learning, the form of knowledge, the embodiment of sound, holder of the veena, worshipped by all the worlds; Mother, famed by the names Sharada and Visharada, the goddess of knowledge who dwells at the Basara shrine and bears our burdens and responsibilities, compassionate to those who worship her.
    te: |-
      సరస్వతీస్తుతి (16 అక్షరాల బంగారు దండ)
      అన్నిపలుకులకు అధిపతివి, కోరినవి ఇచ్చే, చదువు నొసంగే విద్యారూపి! శబ్దస్వరూపీ, వీణధరించిన, అన్నిలోకములచే ఆరాధింపబడే సరస్వతీ! శారద, విశారదనామాలతో ప్రసిద్ధి పొందిన తల్లీ మా బరువు బాధ్యతలు మోసే బాసరక్షేత్రంలో వేంచేసియున్న జ్ఞానాధి దేవతా! కొలిచే వారినిదయదల్చేదానా! నమస్కారం.
  - type: verse
    id: v44
    no: '44'
    hk: |-
      zrI zAradA caturvigazcAkSara saroja hAram .
      vAgdevIm vara dAyinIm vidyA pradAyinIm vArA hIm vidyAm viriJci priyAm, vANIm vINApANim cavimalAm, sarvaloka pUjitAm zrI jJAnasarasvatIm.
      zAradAm vizAradAm vanuthAMvande, varade vidyAjJAnamokSArthinam me..
      rakSa bhAratI.
      bAsaravAsinI.
      zrI pradA, zrI zivAnu DA..
      AzritavatsalA..
    en: A garland of lotus flowers, a four-line verse of 24 syllables (like the Gayatri mantra) addressed to Goddess Sarasvati. O lord of learning, resplendent under many names! Mother of learning! Bless me, who desire true learning, knowledge and through it liberation. Giver of the eight kinds of wealth! Beloved sister of Sri Shiva! Compassionate one who grants fearlessness to those who seek refuge.
    te: 'సరస్వతీ దేవి నుద్దేశించిన 24 అక్షరాల (గాయత్రీమంత్రం వలె) 4 పాదాలు గల పద్యం అనే తామరపూలమాల వివిధనామాలతో విరాజిల్లే విధ్యాధినేతా ! చదువుల తల్లీ ! సువిద్య, జ్ఞానం తద్వారా మోక్షం కోరుకుంటున్న నన్ను అనుగ్రహించు అష్టైశ్వర్యములు ప్రసాదించేదానా ! శ్రీ శివుని అనుంగు సహోదరీ ! శరణుకోరినవారికి అభయమునిచ్చే కరుణామయీ'
  - type: verse
    id: v45
    no: '45'
    title: zrI gaurIstotram (sarvamaGgaLAzrayam)
    hk: |-
      oM vandeham vizvezvarIm praNA vAtmikAm, himabAlA annapUrNAJca zAmbhavIm.
      AdizaktIm jagajjananIm sumukhaSaNmukha.
      yormAtara mIzvarIm hrIm zrIm..
      zrI gaurIm zauri nRhodarIm zarvANIm, zivAnIm mahAkALIm sarvamaGgaLAm .
      pAhimAm .
      varamezvarI.
      varedezubhapradA.
      vedamAtA.
      dehime viSNusAyujyam..
    en: 'The embodiment of the Omkara mantra who gives wealth to all the worlds, the daughter of Himavan, Annapurna, the wife of Shambhu, the source of all powers, the mother of the universe, the mother of Ganesha and Subrahmanyeshwara, the goddess meditated upon in the form of the seed syllable, the sister of Sri Maha Vishnu, Mother who shines in many forms such as Mahakali, the Mother who gives all auspiciousness and protects devotees through so many incarnations, Katyayani: save and protect me, and grant me liberation as union with Vishnu.'
    te: 'లోకాలన్నిటికీ సంపదలనిచ్చే ఓంకారమంత్ర స్వరూపిణి, హిమవంతుని కూతురు, అన్నపూర్ణ, శంభుని ఇల్లాలు, అన్ని శక్తులకు మూలం, విశ్వమాత, గణేశ, సుబ్రహ్మణ్యేశ్వరులకు తల్లి, బీజాక్షర రూపంలో ధ్యానింపబడే దేవి, శ్రీ మహావిష్ణువుకు సోదరి, మహాకాళిమొదలైన అనేక రూపాల్లో విరాజిల్లే అమ్మవారు, అన్ని శుభాలనిచ్చే అమ్మ ఇన్ని అవతారాలతో భక్తులను రక్షించే, కాత్యాయనీ, నన్ను కాచిరక్షించు విష్ణు సాయుజ్యమనే మోక్షమును నాకు ప్రసాదించు.'
  - type: verse
    id: v46
    no: '46'
    title: zrI subrahmaNma zaraNyam
    hk: |-
      subrahmaNyam subrahmaNyam zivatejam subrahmaNyam,
      subrahmaNyam subrahmaNyam zrI vallIzam subrahmaNyam .
      subrahmaNyam subrahmaNyam zivazivAnI sutam subrahmaNyam .
      subrahmaNyam subrahmaNyam SaNmukhasvAmika subrahmaNyam .
      subrahmaNyam subrahmaNyam surasenAnim subrahmaNyam .
      subrahmaNyam subrahmaNyam tArAkAsuravAram subrahmaNyam .
      subrahmaNyam subrahmaNyam devasenApatim subrahmaNyam .
      subrahmaNyam subrahmaNyam zrI svAminAtham subrahmaNyam .
      subrahmaNyam subrahmaNyam zaravaNa zaravaNa subrahmaNyam .
      subrahmaNyam subrahmaNyam zaraNam manazaraNam subrahmaNyam .
      subrahmaNyam subrahmaNyam bhavabhaya rogazokavaram subrahmaNyam .
      subrahmaNyam subrahmaNyam mamArAdhya daivam subrahmaNyam .
      subrahmaNyam subrahmaNyam varadam me abhayadam subrahmaNyam..
      subrahmaNyam subrahmaNyam subrahmaNyam zUlapANinim subrahmaNyam .
      subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam .
      subrahmaNyam subrahmaNyam subrahmaNyam subrahmaNyam ..
      (sarvam zrI subrahmaNezvarArpaNamastu)..
    en: "Sri Subrahmanya Sharanyam: this is a hymn composed with various names, descriptions of the Lord's playful sports, and his glories. May my beloved deity Sri Subrahmanyeshwara grant me fearlessness and protect me! I am the servant of his servants."
    te: 'శ్రీ సుబ్రహ్మణ్య శరణ్యం : వివిధనామములతో, స్వామివారిలీలా విలాసముల వర్ణనతో, మహిమలతో కూర్చిన స్తోత్ర పాఠమిది. నా ఆరాధ్యదైవమైన శ్రీ సుబ్రహ్మణ్యేశ్వరుడు నాకు అభయమిచ్చి కాపాడుగాక! వారి దాసాను దాసుడను.'
  - type: verse
    id: v47
    no: '47'
    title: sarvam sarvezvaram
    hk: |-
      oM teja zrIzam zrIvArim prema svarUpam, karuNAmayam ca bhaktavatsalam.
      tejorAzinam mohanavaMzI gAna priyam, (golokavAsinam Izvaram).
      vande zrI rAdhAkRSNam mama mokSadam..
    en: 'Prostration to Sri Radha-Krishna, the divine couple: the mass of radiance, Sri Kantapati (husband of Lakshmi), the embodiment of love, compassionate, cherishing devotees, full of light, fond of the music of the flute, and to the Supreme Abode who gives me liberation.'
    te: 'కాంతిపుంజమైన శ్రీ కాంతాపతి, ప్రేమమూర్తి దయామయుడు భక్తులను ఆదరించే, జ్యోతిర్మయుడు, మురళీ గానం ఇష్టపడే, శ్రీరాధాకృష్ణ దైవతమునకు, నాకు మోక్షమిచ్చే పరంధామునికి సాష్టాంగ ప్రమాణం.'
  - type: verse
    id: v48
    no: '48'
    hk: |-
      vedam zrI kRSNam vedArtham zrIkRSNam
      vedAntam zrIkRSNam vedAntargata daivam ca zrIkRSNam .
      nAdam zrIkRSNam oM kAra nAdam zrI kRSNam
      veNunAdam zrI kRSNam pAJcajanya gItAnAdam zrI kRSNam.
      dhyAnam zrI kRSNam yAgayogam zrI kRSNam
      vinodam zrIkRSNam bhavabhaya bheda chedanam zrI kRSNam.
      vandeham tam zrI kRSNam muktidam
      dhanyam zrI kRSNa dhyAnajIvanam
      prAptiH tathyam zrI kRSNaparamapadam..
    en: "The Veda, Vedanta, the meaning of the Veda, the God hidden within the Vedas, the sound of Om, the sound of the Panchajanya conch, the song of the Bhagavad Gita, and with entertainments, remembering the Lord's plays, the remembrance of Hari's name that cuts away the pains of worldly life such as fear and grief: to spend life in any way remembering Sri Krishna, the Lord, in devotion through yogic meditation is great good fortune. That being is blessed and will certainly attain eternal liberation."
    te: 'వేదం వేదాంతం, వేదానికి అర్థం, వేదములందు లోనదాగియున్న దైవం, ఓంకారనాదం, పాంచ జన్యశంఖా రావo, భగవద్గీతా గానం, వినోదములతో, భగవల్లీలలస్మరణతో సంసారంలో భయం, శోకంవగైరా వ్యధలను నరికిపారవేసే హరినామస్మరణం ఏదోరకంగా శ్రీకృష్ణుని, భగవంతునితలుచు కుంటూ భక్తి భావంతో యోగధ్యా నంద్వారా జీవితం గడపటం మహోదృష్టం. ఆ జీవి ధన్యుడు తప్పకుండా శాశ్వతంగా మోక్షం లభిస్తుంది.'
  - type: verse
    id: v49
    no: '49'
    hk: |-
      pallavi:
      rAjazekhara rAjazekhara rAjazekhara pAhimAm
      rAjazekhara rAjazekhara rAjazekhara rakSamAm
      candrazekhara candrazekhara candrazekhara pAhimAm
      induzekhara induzekhara induzekhara rakSamAm
      zazizekhara zazizekhara zazizekhara rakSamAm
      rAjazekhara rAjazekhara rAjazekhara pAhimAm
      rAjazekhara rAjazekhara rAjazekhara rakSamAm..
    en: A hymn to Sri Samba Sadashiva with his various names, and a prayer to forgive faults and protect.
    te: 'శ్రీ సాంబసదా శివుని వివిధ నామాలతో స్తోత్రం చేసి, తప్పులను క్షమించి కాచి రక్షించమని ప్రార్థన.'
  - type: verse
    id: v50
    no: '50'
    title: advaitAbhivAdamu
    hk: |-
      zaraNam zrI satyanArAyaNam kAruNyadhAmam ramAkAntam triguNAtItam.
      ArtatrANa parAyaNam annavaravAsinam sadAzivam mama kaivalyadam..
    en: 'I take refuge in Sri Satyanarayana Swami: the compassionate one, the husband of Lakshmi, beyond the qualities of sattva, tamas and rajas, the protector of devotees who seek his shelter and of those in distress, who dwells in the Annavaram shrine in East Godavari district in the form of Shiva, who gives me liberation.'
    te: 'శ్రీ సత్యనారాయణ స్వామిని, కరుణాపూరితుని, లక్ష్మీపతిని, సత్వతమోరజోగుణముల కతీతుడై బాధల్లోవున్నవారిని, ఆశ్రయించిన భక్త రక్షకుని, తూర్పు గోదావరి జిల్లాలోని అన్నవరక్షేత్రంలో వెలసియున్న శివస్వరూపుని నాకు మోక్షమిచ్చే వానిని శరణువేడు తున్నాను.'
  - type: verse
    id: v51
    no: '51'
    hk: |-
      namo simhAcalavAsinam, svayambhuvam varAhalakSmI nRhiMhasvAminam .
      zrI mahAviSNoH tRtIyAvatAram zrIcandana lepita zivaliGgAkAram .
      ApadbAndhavam abhayadam ananta AdinArAyaNam ca karuNAsAndram.
      darzana mAtreNa anirvacanIyAnandapradam bhaktavazam memokSadam..
    en: Salutations to Sri Varahalakshmi Narasimha Swami, who is self-manifested at the sacred shrine of Simhachalam in Vizianagaram district, the third incarnation of Sri Maha Vishnu, who is always covered with sandalwood paste in the form of a Shivalinga except on Akshaya Tritiya (which comes in the month of Vaishakha); the first God, who helps like a kinsman those in danger, compassionate, the remover of fear, who gives the bliss of Brahman by his mere sight, who dwells at Yadagiri, the Lord of the gods who is won over by his devotees, and who gives me liberation.
    te: 'విజయనగరం జిల్లా సింహాచల దివ్య క్షేత్రంలో స్వయంభువుగా వెలసి, నెలకున్న శ్రీవరాహలక్ష్మీ నృసింహస్వామికి, శ్రీ మహావిష్ణువు యొక్క మూడవ అవతారం ఒక్క అక్షతదియ నాడు (వైశాఖ మాసంలోవస్తుంది) తప్పఎపుడూ గంధంపూతతో శివలింగాకారంతో వుండే వానికి ఆపదల్లో వున్న వారికి బంధువులా ఆదుకునే ప్రథమ దైవం, దయా మయుడు భయంపోగొట్టేవాడు, దర్శన మాత్రం చేత బ్రహ్మానందానుభూతి కల్గించే, యాదగిరివాసికి భక్తులకు వశుడైన దేవేశునికి, నాకు మోక్షమిచ్చే వానికి నమస్కారం.'
  - type: verse
    id: v52
    no: '52'
    title: vairAgyaphalam
    hk: |-
      bhAgyam bhogam bhAram moham kSetram grAsam vAsam simhAsanam.
      vilAsam bhAmAkalApam satIsantAna sukhalAlasam.
      dehAbhimAnam bandhuprItiH bAdhAkaram, kIrti kAGkSaH bahujanmakArakam.
      bhavabandham muktiprati bandhakam ca kSudram hRdaya daurbalyam etat sarvam vyarthavyAsaGgam .

      zrI kRSNadhyAnam taruNopAyam.
      kurubhaktijJAna yogAbhyAsam.
      tathyam zAzvata vaikuNThavAsam..
    en: 'Wealth and the comfort that comes from it, desire, land, houses, position, sensual pleasure with young women, and excessive attachment to wife and children: all these are burdens that weigh a person down. Excessive love for the body, for adornments, for tasty food and sweet drinks, and attachment to relatives, bring great suffering. The scramble for name and fame is the root of taking many births; love of worldly life is an obstacle to the goal of liberation; mental weakness is very base, and the cause of all of these. All these are useless pastimes. Meditation done with devotion to Sri Krishna is the means to cross the ocean of worldly life here and the river Vaitarani after death. Therefore, O soul! This birth, these bonds and riches are all illusion ("Brahma satyam, jagan mithya", Adi Shankara). The Supreme Lord alone is true, steady and eternal. What appears in the world and creation, what is experienced, and all bonds that arise through karma are delusion, maya, untrue, impermanent, and the root of unrest. Practise yoga with the dispassionate knowledge that the Supreme Lord alone is eternal. You will surely attain liberation without rebirth, a permanent abode in Vaikuntha.'
    te: 'ఐశ్వర్యం తద్వారావచ్చే సౌఖ్యం, కాంక్ష, భూమి, భవనం, పదవి, తరుణులతో రసికత, భార్యా బిడ్డలపై మితిమీరిన మమకారం - ఇవన్నీ మనిషిని క్రుంగదీసే బరువులు శరీరo మీద, అలంకారాలమీద రుచికర భోజన, మధురపానీయాల్లో ఆనందించే అత్యంత ప్రీతి, చుట్టాలమీద అభిమానం - చాలాకష్టాలు కల్గిస్తుంది. పేరుప్రతిష్ఠలకై ప్రాకులాట ఎన్నో జన్మలెత్తడానికి మూలం సంసారప్రీతి మోక్షగమ్యానికి అడ్డంకి మానసిక బలహీనత ఎంతో నీచం - వీటన్నిటికీకారణ భూతం. ఇవన్నీ ఎందుకూ కొరగాని కాలక్షేపాలు శ్రీ కృష్ణుని మీద భక్తి భావంతో చేసే ధ్యానమే ఇహంలో సంసారసముద్రాన్ని, మరణానంతరం వైతరణీనదిని దాటడానికి, సాధకం అందువల్ల ఓ జీవా! ఈ జన్మ, బంధాలు, ఐశ్వర్యాలు అన్నీ భ్రమలు (బ్రహ్మసత్యం, జగన్మిథ్యా"- ఆది శంకరులు). - సర్వేశ్వరుడు సత్యం, స్థిరం, శాశ్వతం. లోకం, సృష్టిలో అగుపడేవి, అనుభవించేవి, కర్మరీత్యా కల్గిన బంధాలన్నీ భ్రాంతి, మాయ, అసత్యం, అశాశ్వతం, అశాంతికి మూలం). పరమేశ్వరుడే శాశ్వతం నిత్యం అనే వైరాగ్య జ్ఞానంతో, యోగం అభ్యసించి ఆచరించు. శాశ్వతంగా వైకుంఠవాసమనే పునర్జన్మలేనిముక్తి లభించి తీరుతుంది.'
  - type: verse
    id: v53
    no: '53'
    title: jaya maGgaLabharatavAkyam
    hk: '(anni zubhamulu kalagAlani civaragA yI {kriMdi} vidhamugA prArthiddAmu)'
    en: 'Victory and auspicious utterance of Bharat: Let us finally pray in this manner so that all auspiciousness may prevail.'
    te: 'మంగళ వాక్యము'
  - type: verse
    id: v54
    no: '54'
    hk: mAtR vakSojAMsukakarSaNodyatakaraH kRSNaHsapuSNAtunaH..
    en: When Sri Krishna says in sweet baby talk, "Mother! I am hungry, give me a snack!", and Yashoda, busy with her work, says "I'm coming in a moment", he says "No! I want it now!", and in his fondly stubborn way reaches up to pull his mother's sari end. May that charming, enchanting little hand of Krishna become the hand of fearlessness that gives lasting peace to the universe! May it protect me!
    te: '"అమ్మా! నాకు ఆకవేస్తోంది, తాయిలంపెట్టు" అని శ్రీకృష్ణుడు ముద్దుమాటలాడితే, పనిలో ఉన్న యశోద "ఒక్కక్షణం వస్తున్నా" నంటే "ఊహు! నాకిప్పులే కావాలి", అని మురిపెంగా మారాంచేస్తూ తల్లిపైట కొంగులాగటానికై ఎత్తిన, ఆ ముగ్ధమోహన కృష్ణుని చిన్నారి చిట్టి చెయ్యి విశ్వమునకు శాశ్వతముగా శాంతినిచ్చే అభయహస్తమగుగాక! నన్ను రక్షించుచుండుగాక !'
  - type: verse
    id: v55
    no: '55'
    hk: |-
      oM.. zrImaGgaLagirIzam, yAdagirinAthamantarvedyadhi nAtham, yoganRsiMham, sadAsarvarogamnam.
      vandeham, bhaktavaradam, zivam, mahAyogapradam, tam, nAra siMham advitIyadaivatam mokSadam ..
    en: 'I always bow to Sri Narasimha Swami, the incomparable God who dwells in many holy places: Mangalagiri near Vijayawada, Yadagirigutta near Warangal, Yoga Narasimha in Mysore, Antarvedi near Narasapuram, who grants good yogas, who as Shiva sees all alike, and who at the end of this life gives the eternal empire of liberation.'
    te: 'విజయవాడ, సమీపంలోని మజ్జళగిరి వరంగల్లు దగ్గరి యాదగిరిగుట్ట, మైసూరలలోని యోగనృసింహ నరసాపురం సమీపంలోని అంతర్వేది - ఇలా అనేకపుణ్యక్షేత్రాల్లో వెలసి, మంచి యోగములనిచ్చి, శివునిగా సమదర్శియై యీజన్మాంతమున శాశ్వతమోక్ష సామ్రాజ్యాన్నిచ్చే సాటిలేని దైవం శ్రీ నృసింహస్వామికేపుడూ నమస్కరిస్తున్నాను.'
  - type: verse
    id: v56
    no: '56'
    hk: |-
      oM - vande viSNum sadAzivam, varadam, tatsarvezam, zrIrAmam zrI kRSNam, mokSadam..
      (varAliccikaruNiJce zrI mahAviSNuvuku, samabhAvanto cUstU sarva zubhAlanu prasAdiJce sAmbana dAzivuniki, sarvezvaruDaina zrI rAmuniki, mokSapradAta zrI kRSNa vara brahmaku vandanamu.
      nanu brovagarAvA.
      karuNAmayazrIrAmA........
      tElisItEliyaka ne cesina kAryamulu duSTamEnta yogAnirAmA....
      bhavabandhamunaDuma kuDiEDamala iDumalinni yArAmA...
      karmaphalita manubhaviJcaka tIradEva rikainani pEdavi virutulindarilalo zrI rAmA....
      nanuvyadhalanuJci vidhividhitamu nuJci tappimpagala vibhulEvvaru nIvugAka rAmA ....
      dehabAdha, jADyapubAdha, vyayame vyadhagA rAmA nI bhakti pEnnidhidariceraga nIyadu dayadalacumA rAmA....
      kAruNyadhAmuDavu kalalo yIbAdhala kaDatercaga dayacUpavayAjayarAmA....
      jaya jaya rAmA....
      bhavAnIzaGkara priyuDavu bhakti bhAvana varamunu rayamuganIyavE rAmA....
      rAmA...
      parandhAmA, puruSottama paramezvara zrI rAmA
    en: Salutations to Sri Maha Vishnu who grants boons and shows mercy; to Samba Sadashiva, who looks on all alike and grants all auspiciousness; to Sri Rama, the Lord of all; and to Sri Krishna Parabrahma, the giver of liberation. Will you not come to protect me, compassionate Sri Rama? Knowingly or unknowingly, how wicked are the deeds I have done, O Rama who delights in yoga! Amid the bonds of worldly life, the troubles on the right and left, O Rama! Everyone must experience the fruit of karma, people say with a shrug, O Sri Rama! Who but you, O Rama, can free me from sufferings and from the course of fate? Bodily pain, the pain of sluggishness, expense itself a pain, O Rama! Do not let me stay on the shore of the treasure of devotion to you; have mercy, Rama! You are an abode of compassion; be kind enough to end these sufferings of mine in my dreams, Jaya Rama! Jaya Jaya Rama! Beloved of Bhavani and Shankara, quickly grant me the boon of a devotional attitude, O Rama! Rama, the Supreme Abode, Purushottama, Parameshwara, Sri Rama!
    te: 'వరాలిచ్చికరుణించే శ్రీ మహావిష్ణువుకు, సమభావంతో చూస్తూ సర్వ శుభాలను ప్రసాదించే సాంబసదాశివునికి, సర్వేశ్వరుడైన శ్రీ రామునికి, మోక్షప్రదాత శ్రీ కృష్ణ పరబ్రహ్మకు వందనము. ననుబ్రోవగరావా! కరుణామయ శ్రీరామా... తెలిసీతెలియక, నే చేసిన కార్యముల దుష్టమొంత యోగానిరామ... భవబంధమునడుమ కుడిఎడమల ఇడుములన్ని యారామా... కర్మఫలిత మనుభవించక తీరదెవరికైనని పెదవి విరుతులిందరిలో శ్రీ రామా... ననువ్యధలనుంచి విధివిధితము నుంచి తప్పింపగల విభులెవ్వరు నీవుగాక రామా... దేహబాధ, జాడ్యపుబాధ, వ్యయమే వ్యధగా - రామా నీ భక్తిపెన్నిధిదరిచేరగ నీయదు దయదలచుమా రామా... కారుణ్యధాముడవు కలలో యీబాధల కడతేర్చగ దయచూపవయాజయరామా... జయ జయ రామా... భవానీశంకర ప్రియుడవు భక్తి భావన వరమును రయముగనీయవె రామా... రామా.. పరంధామా, పురుషోత్తమ పరమేశ్వర శ్రీ రామా...'
  - type: verse
    id: v57
    no: '57'
    hk: |-
      rAdhe govinda kRSNa.
      rAdhe gopAla kRSNa.
      nandamukunda kRSNa.
      navanItacora kRSNa.
      pAhi mukunda kRSNa.
      pAhi murAri kRSNa..
    en: With your support beside me I lack nothing, Krishna! Why should I fear, Krishna? I have no suffering, Krishna! Radhe... Keep all your grace upon me and protect me, Ramaramana Krishna! Increase and nourish my devotion to you, protect me, Ramesha Krishna! Increase and nourish my devotion to you, protect me, Parameshakrishna! Protect me, Paramdhama Krishna! Radhe... Let the rest of my life be short, let it pass easily, let it pass in full health, let it be filled with worship of you! At the end let me reach the nearness of your feet, take me in, bring me close, O bearer of the conch... Radhe...
    te: 'నీ అండదండ నాకుండ, లోటేమీరాదు కృష్ణ! భయమేలనాకు కృష్ణ! బాధేమీలేదు కృష్ణ! రాధే... నీ దయంతానామీదిల్లైవుంచి, కాచిరక్షించు రమారమణ కృష్ణ, పెంచీ పోషించునీ మీది నాదుభక్తి, పాహి రమేశకృష్ణ! పెంచీ పోషించు నీ మీది నాదుభక్తిక, పాహి! పరమేశకృష్ణ! పాహి పరంధామకృష్ణ! రాధే... నా శేష జీవతంస్వల్పమైపోనీ! సులభంగానడవనీ సంపూర్ణారోగ్యంతో గడవనీ, నీ ఆరాధనతోనిండి ఉండనీ! అంతంలోనీ పదసన్నిధిచేరనీ, చేర నీయిచేరదీయిశంగల్వధారీ... రాధే...'
  - type: verse
    id: v58
    no: '58'
    title: vizvamohana namovAkam
    hk: |-
      vizvam vizvezam vizvavyAptam vizvasRjitam zAntidam .
      vizvezvaram vizvanAtham vizvapatim vizvagurum .
      vizvarUpam virUpAkSam vizvambharam vizvavaradam.
      vande vizvamohanam vaMzI kRSNam viSNusAyujyadamme..
    en: He who is the universe Himself, the Lord of the cosmos, all-pervading, the creator of the universe, and the giver of peace! The Supreme Lord of the universe, the Master of the cosmos, the protector of the universe, and the Universal Guru! The cosmic-formed, the the one with supreme vision, the sustainer of the universe, and the bestower of cosmic boons! I bow unto that enchanting flute-bearing Lord Krishna, the enchanter of the universe, who grants unto me the eternal communion and liberation in Lord Vishnu.
    te: 'ఈ సమస్త విశ్వము తానైనవాడు, విశ్వమునకు ఈశ్వరుడు, సకల జగత్తునందు వ్యాపించియున్నవాడు, విశ్వమును సృష్టించినవాడు, శాంతిని ప్రసాదించువాడు! విశ్వేశ్వరుడు, సమస్త విశ్వమునకు నాథుడు, విశ్వపతి, లోకాలన్నింటికీ ఆదిగురువు! విశ్వరూపుడు, విలక్షణమైన నేత్రములు గల విరూపాక్షుడు (శివస్వరూపుడు), విశ్వమును భరించి పోషించువాడు, సమస్త లోకములకు వరములనొసగువాడు! సకల జగత్తును మోహింపజేయు వంశీకృష్ణుడు మరియు నాకు శాశ్వతమైన విష్ణుసాయుజ్యమును (మోక్షమును) ప్రసాదించే ఆ పరమాత్మునికి నేను ప్రణామములు సమర్పిస్తున్నాను.'
  - type: verse
    id: v59
    no: '59'
    hk: |-
      oM. rAdhAgopAlaMrAgamohanaMrAsalIlArAji taMrAgamayam vairAgyapradam yogezvaram Izva rArcitam paramazivabhaktAgresaram zrIzam zaraNam mamavaradam zrI kRSNaMvande mokSadam..
    en: 'I bow to Sri Krishna, who gives liberation, taking refuge in him who protects me: the ruler of all of us together with Radha and the cows, the embodiment of love who reigns in the Rasa Lila that enchants with the music of the flute, the Lord of yoga who bestows dispassion, worshipped by Shiva, the foremost among the devotees of Parama Shiva, the husband of Lakshmi.'
    te: 'రాధను, గోవుల సహితంగా మనందరినీ పాలించేవాడు, వేణుగానంతో ముగ్ధులను చేయు రాసలీలతో రాజిల్లే ప్రేమ మూర్తి, వైరాగ్యమునొసగెడి యోగే శ్వరుడు, శివునిచే పూజింపబడే, పరమశివుని భక్తులలో మొదటివాడు, లక్ష్మీపతి,నన్ను రక్షించే వానిని శరణువేడుకుంటూ, మోక్షమిచ్చే శ్రీకృష్ణునికి నమస్కరిస్తున్నాను.'
  - type: verse
    id: v60
    no: '60'
    hk: |-
      nirmala hRdayam sumanoharam sarojasadRza saugandhim pUjya gaGgA godAvarItoya tulyapavitram vaiSNavam zaGkara priyam zrIzrInivAsam.
      Anandamayam zrIkaram sadAzrI bhagavannAmagAnayAga puNyakArakam.
      taddhAraNa dhanyamanujam yoga vidyArdhinam zrI kRSNa bhaktam namAmyaham ..
    en: A pure heart delights the mind. It is like the fragrance of a lotus. It is as sacred as the revered water of the Ganga and Godavari. It is the very basis for worshipping Vishnu, dear to Shiva, the dwelling of Lakshmi Devi, full of joy, the giver of wealth, and by always performing the sacrifice of singing God's name it brings merit. I always bow to the devotee of Sri Krishna who has such a pure mind, who is blessed, a yogi and a seeker.
    te: 'నిర్మలమైన హృదయము మనస్సును ఆహ్లాదపరస్తుంది. తామరపూవుసువాస నవంటిది. పూజ్యమైన గంగా, గోదావరీ తీర్థము (నీరు) వలె పవిత్రమైనది. అదే విష్ణువు నారాధించే ఆధారము శివునికి ఇష్టము, లక్ష్మీదేవి నివాసము, సంతోషం తోనిండివుంటుంది. ఐశ్వర్యము నిచ్చేది,ఎపుడూ దేవుని నామగానం అనే యజ్ఞము చేస్తూ పుణ్యము కలిగించేది, అటువంటి పవిత్రమైన మనస్సుకల్గిన మానవుడు,ధన్యుడు, యోగిసాధ కుడు అయిన శ్రీ కృష్ణ భక్తునికి ఎపుడూ నమస్కరిస్తూంటాను.'
  - type: verse
    id: v61
    no: '61'
    hk: |-
      vizAla vizvam viSNu mayam sadAzivam rAsalIlA lAsyarAganilayam .
      vizvezasRjitam virATsvarUpam maGgaLArAmam sarvam zrI kRSNahAsam..
    en: "This endless universe is filled with Vishnu and always in balance. It is full of various arts containing the nine rasas, dance, song, games and music. Brahma's creation is part of Sri Krishna's cosmic form; all living beings rejoice, experiencing all auspiciousness: the whole universe is a scattering of Sri Krishna's smiles."
    te: 'యీ అనంతమైన జగత్తు విష్ణువుతో నిండి ఎపుడూ సమతుల్యం. నవరసాలు కూడిన వివిధ కళలతో, నృత్యం, గానం ఆటపాటలతో నిండివుంటుంది. బ్రహ్మసృష్టి శ్రీ కృష్ణ విశ్వరూపంలో అంతర్భాగం, అన్ని శుభములు అనుభవిస్తూ జీవకోటి ఆనందిస్తుంటారు: మొత్తం అంతటా శ్రీ కృష్ణుని చిరునవ్వుల చిందులే.'
  - type: verse
    id: v62
    no: '62'
    hk: 'paGkham laGghanti vArI zaJca zambhuJjayanti naraikavijayaH daitya deha zalkam bhavati (viSNu) zaGkham pAJcajanyam citram zrI kRSNa cidvilAsam (sadA) dayAmayam..'
    en: A monkey leapt over the endless ocean with ease. Arjuna, a mere man, defeated Mahadeva. The conch called Panchajanya, a part of a demon's body, shines in the hand of Vishnu. Ah! How wonderful is the sport of Sri Krishna! Is it not always full of compassion!
    te: 'ఒక కోతి అంతులేని సముద్రాన్ని అవలీలగా గెంతేసింది. కేవలం మనుష్యుడైన అర్జునుడు మహాదేవుణ్ణి జయించాడు. ఒక రాక్షసుని శరీరంలోని భాగమైన పాంచజన్యం అనేపేరుగల శంఖం, విష్ణుమూర్తి చేతిలో చేరి ప్రకాశిస్తూంది. ఆహా! శ్రీ కృష్ణ చిదిల్వానం ఎంతచిత్రం! ఎప్పుడూ దయతోనిండి వుంటుంది కదా!'
  - type: verse
    id: v63
    no: '63'
    hk: uDupi nAtham upendrAnujam udyAnavihAriNam hiraNmayIzaMhira Nyagarbham bhaktavazyaMsadAzivam vAsudevaMvande zrI kRSNamme mokSadam..
    en: 'Salutations always to Sri Krishna, who gives me liberation: the child Gopala of the Udupi shrine, the younger brother of Indra, who roams in Brindavan, the husband of Sri Lakshmi Devi, the God of gods, who is won over only through devotion, who protects all equally, the son of Vasudeva.'
    te: 'ఉడుపి తీర్థంలోని బాల గోపాలుడు, ఇంద్రునికి తమ్ముడు, బృందా వనములోవిహరించేవాడు, శ్రీ లక్ష్మీ దేవి భర్త, దేవాది దేవుడు, భక్తితో మాత్రమే, వశమయ్యేవాడు, అందరనీ సమానంగా కాచి రక్షించేవాడు, వసుదేవుని తనయుడు, నాకు మోక్షమిచ్చే శ్రీకృష్ణునికి ఎప్పుడూ వందనములు.'
  - type: verse
    id: v64
    no: '64'
    hk: |-
      vande gaurI zaGkara kumAram tArakavAram devasenAniJca SaSThIzam.
      narvadaMzrI vallIzam (viSNuputrIzam) ripughnumme sarvarogaghnam zrI subrahmaNyasvAminam..
    en: Salutations to Sri Subrahmanya Swami, the son of Parvati and Parameshwara, the slayer of Tarakasura, the commander of the army of the gods, the husband of Shashthi Devi and of Sri Valli, the daughter of Sri Maha Vishnu, who destroys my enemies and all diseases.
    te: 'పార్వతీపరమేశ్వరుల కుమారుడు, తారకాసురుని సంహరించిన వాడు, దేవతల సేనానాయకుడు, షష్ఠీ దేవికి, శ్రీ మహావిష్ణువు కూతురైన శ్రీ వల్లికి భర్త, నా శత్రువులను, సమస్తరోగములను నశింపజేసే, శ్రీసుబ్రహ్మణ్య స్వామికి నమోవాకములు'
  - type: verse
    id: v65
    no: '65'
    hk: |-
      dagdham tIti sarvaduggAni dahantItimugdha mohinI vyAmoha tRSNam.
      siddhyam tIti zAzvata zrI viSNu sAyujyam pathamekam zrI kRSNapada dhyAnam ..
    en: It burns away all sufferings, reduces to ashes the habit of behaving improperly out of excessive desire on seeing a beautiful woman, and grants the eternal union with Vishnu. The one very easy method that provides all of this is meditating on Sri Krishna with devotion.
    te: 'అన్ని బాధల్నీ కాల్చిపారేస్తుంది, అందమైన అతివ కంటబడగానే విపరీతమైన కోరికతో అనుచితంగా ప్రవర్తించే తీరును, నుసిచేస్తుంది, శాశ్వతమైన విష్ణు సాయుజ్యాన్ని ప్రసాదిస్తుంది. వీటన్నిటినీ సమకూర్చే చాలా సులభమైన ఒకే ఒక పద్ధతి శ్రీ కృష్ణుని భక్తితో ధ్యానించడమే॥'
  - type: verse
    id: v66
    no: '66'
    hk: |-
      sarvadhAriyaina cakradhAriyaina velpANiyaina kodaNDapANi yainan .
      sarvamamarci mukti niccugA bhagavadbhaktuniki sadvartanukin ..
    en: A perfect, skillful, compassionate, and righteous path. By completely surrendering oneself, one can attain the supreme devotion to Bhagavan.
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v67
    no: '67'
    title: gurvAzIrvAkyam
    hk: |-
      oM. gAyatrI mantratulyam caturviGg zcAkSara bhagavatprasAdita vAGmayam .
      tat vedavedAnta zAstrasaGgItAdi kaLAsAhitya narvannabhavati .
      bhagavannAmasaGkIrtanasamam, tasmAt sarvaprayatnena zrIzrI kRSNa .
      dhyAna yogAbhyAsI bhava, premamayIbhava, mokSagAmI bhava, siddhirbhava..
      sarvam zrI rAdhAkRSNArpaNamastu..
    en: "Equal to the twenty-four-syllable Gayatri mantra is the literature given by God, such as hymns. Every Veda, Purana, Itihasa, hymn and kalpa: all those \"authors\" who say they wrote these are merely \"scribes\", who wrote down what God graciously placed in their minds, and not owners. However much one studies and practises any Veda, Vedanta, shastra, music, art or literature, it bears less fruit than singing God's various names. That is, reciting God's Ashtottara and Sahasranama hymns is best. In this modern age no rules are needed. Therefore, making every effort, may we keep meditating on Sri Krishna, may we be filled with love, may we travel on the path of liberation, and may liberation be ours!"
    te: 'ఇరువది నాల్గు అక్షరాల తో కూడిన గాయత్రీమంత్రంతో సరితూగేది, భగవంతుడు ప్రసాదించిన స్తోత్రములు వగైరా సాహిత్యము. ఏ వేదమైనా, పురాణం, ఇతిహాసం, స్తోత్రం కల్పం - ఇవన్నీ వ్రాసేమని చెప్పుకునే “ రచయిత” లందరూ కేవలం “ లేఖకులు” భగవంతుడు అనుగ్రహించి, వీరి మనస్సులో ప్రవేశ పెట్టిన వాటిని లిఖించే వారు మాత్రమే కాని స్వంతదారులు కాదు. ఏవేదం, వేదాంతం, శాస్త్రం, సంగీతం, కళ, సాహిత్యం, అభ్యసించి, ఉపాసించినా భగవంతుని వివిధ నామాలు గానం చెయ్యటంకన్న తక్కువ ఫలవంతం.అంటే, భగవంతుని అష్టోత్తర, సహస్రనామస్తోత్రాలు పఠించటమే ఉత్తమం. యీ ఆధునికయుగంలో, ఏ నియమాలు అవసరంలేదు. అందువల్ల అన్నివిధాలా ప్రయత్నించి, శ్రీకృష్ణ ధ్యానం చేస్తూందుముగాక! ప్రేమతో నిండి వుందుము గాక! మోక్షమార్గములో ప్రయాణింస్తూందాము-ముక్తి కలుగుగాక!'
  - type: verse
    id: v68
    no: '68'
    title: zrI rAdhAkRSNa pAdAkrAntam
    hk: |-
      oM.. uDupInAtham upendrAnujam, udyAna vihAriNam, hiraNma yIzam.
      hiraNyagarbham,bhakta vazyam, sadAzivam, vAsudevam, vande, zrI kRSNamme, mokSadam..
    en: "Ah! Oh! How wonderful: the heart feels as if floating in the air and the mind leaps. It destroys the six chief enemies called desire, anger, greed, delusion, pride and jealousy, along with all the other adversaries; it scatters the pitch darkness called ignorance; it brings auspiciousness and peace; it kindles devotion and knowledge, removes attachment to worldly matters and inspires one to remain detached. If, with closed eyes in meditation, one holds Sri Krishna's feet in the mind in purity of thought, word and deed, then very easily Sri Krishna's face, shining with a smile, appears before our eyes, meaning the eyes of knowledge. It surely gives everything here and liberation at the end of life."
    te: 'ఆహా! ఓహోహో!! చాలా అద్భుతం, హృదయం గాలిలో తేలిపోయేటట్టు అనిపించేది, మనస్సు త్రుళ్ళిపడుతుంది. కామ, క్రోధ, లోభ, మోహ, మద, మాత్సర్యాలు అనబడే ఆరు ప్రధాన శత్రువులతో పాటు, మిగిలిన విరోధులందరను నశింపచేసేది, అజ్ఞానం అనే కారుచీకటిని పటాపంచలు చేసేది, శుభములు, శాంతి కల్గించేది, భక్తి, జ్ఞానం, రగిల్చి ప్రాపంచిక విషయాలమీది మోహం తొలగించి, తటస్థంగా వుండేటట్టు ప్రేరేపించేది-ధ్యానంతో కన్నులు మూసుకుని త్రికరణశుద్ధిగా శ్రీకృష్ణుని పాదములను మనస్సులో నిలుపుకుంటే, చాలా సులభంగా, శ్రీకృష్ణుని చిరునవ్వుతో తళతళా ప్రకాశించే ముఖము మనకన్నులకు కనబడుతుంది. అంటే, జ్ఞానేత్రాలకు అని అర్థం. అది నిక్కచ్చిగా ఇహంలో అన్నీ ఇచ్చి జన్మాంతంలో మోక్షం కల్గిస్తుంది.'
  - type: verse
    id: v69
    no: '69'
    hk: |-
      ramyamainadi, rAmanAmamu, hRdyamamainadi, rAmacaritamu, bhakti, zaktikArakam, muktipradamodakam..
      ramya ..
      dhyAname gamya vathamai, parandhAmuvaDanu, anu gadyamai ..
      ramya..
      sAdhyamainadi rAmasmaraNamu, mokSaH gamyamainadi rAma zaraNyamu..
      rAmanAmamu ramyamainadi, ramyamainadi rAma nAmamu, dhanyamainadi nADu jIvanamu, labhyamai tArakarAmamu .
      abhayamai, mukti pradamai, zrI rAdhAkRSNa caraNa zaraNyamai ..
    en: How pleasant is the name of Lord Rama, how blissful it is to hear his tales, source of Bhakti & Sakthi, bestower of liberation, the ultimate goal - surrender to Lord Rama. Lord Rama’s pleasant name has brought me success in this worldly life, and it shall grant me salvation as well. May it make me fearless, as I surrender in front of Sri Radha Krishna’s lotus feet.
    te: 'ఈ గీతిక తెలుగు లోనే ఉన్నది'
  - type: verse
    id: v70
    no: '70'
    hk: |-
      kAmezvaram, kamalAkSam, kAntipuJjam, karuNAmayaJca kaLyANa sarvadam .
      zrIlakSmIzam, jagadrakSakam, vande harSizam, zrIrAdhAkRSNam, me, kaivalyadam
    en: Salutations at all times, night and day, to Lord Sri Radha-Krishna, the master of the form of all desires, the lotus-eyed one, a mass of light, compassionate, the cause of all auspiciousness, Sri Lakshminatha, the protector of the world, the Lord who grants liberation.
    te: 'అన్ని కోరికల స్వరూపమునకు అధిపతి, కమలమువంటి కన్నులు కలవాడు, వెలుగులపోగు, దయామయుడు, అన్ని శుభములు కల్గించేవాడు, శ్రీలక్ష్మీనాధుడు, జగత్తుకు రక్షకుడు, అయిన శ్రీరాధాకృష్ణ ప్రభువునకు, మోక్షమొసగే స్వామికి, రాత్రిపగలు, అన్ని వేళలా, నమస్కారములు.'
  - type: verse
    id: v71
    no: '71'
    hk: vaikuNThavAsinam, vaijayantI virAjitam, virATpuruSam, zrImahAviSNum, vandeham, vaidehI vibhum vedavedAnta vedyam, zrIrAdhAkRSNam, me, mokSadam..
    en: 'Salutations to Lord Radha-Krishna, who gives me liberation: Sri Maha Vishnu, who lives in Vaikuntha, shines with the Vaijayanti garland, has the cosmic form and is the husband of Lakshmi Devi, the God worshipped through all the Vedas, Vedantas and hymns, the lord of all worlds.'
    te: 'వైకుంఠంలో నివసించేవాడు, వైజయంతి మాలతో ప్రకాశించేవాడు, విశ్వరూపుడు, లక్ష్మీదేవి భర్తగు శ్రీమహావిష్ణువు, అన్నివేదాలు, వేదాంతాలు, స్తోత్రం వగైరాలతో ఆరాధింపబడే దేముడు, అన్నిలోకాలకు అధిపతి, నాకు మోక్షమిచ్చే రాధాకృష్ణ భగవానులకు నమస్సులు.'
  - type: verse
    id: v72
    no: '72'
    hk: |-
      nityAnandamayam devam, viSNum, vibhUti prabhum, sarojA saugandha rAjanam.
      nIrajAkSam, nikhilalokezam, zrIrAdhAkRSNam, me, muktidam ..
    en: 'Salutations to Sri Krishna, who gives me liberation: the God always full of joy, Vishnu who displays glories, who shines gracefully with the fragrance of lotuses, whose eyes are like lotuses, the lord of all worlds.'
    te: 'ఎపుడూ ఆనందం నిండివుండే దైవం, మహిమలు ప్రదర్శించే విష్ణువు, తామరపూల పరిమళంతో తీవిగా విరాజిల్లే, కమలము వంటి కళ్ళుకల, అన్ని లోకాలకు అధిపతి, నాకు ముక్తినిచ్చే శ్రీకృష్ణునికి వందనములు.'
  - type: verse
    id: v73
    no: '73'
    hk: |-
      oM.. vande, vizvavibhum vizvam bharam, vizva mohanam, jaganmohinI rUpa dharam .
      viSNum, zambhu bhrAntikArakam, lIlAvinodinam, zrI bRndAkRSNam me.
      mokSadam..
    en: 'I bow to Sri Krishna, who gives me liberation, Mukunda: the ruler of the universe, its sustainer, the enchanter, who with the Jagan Mohini form bewildered even Samba Sadashiva himself, and who roams and plays in Brindavan.'
    te: 'విశ్వానికి పాలకుడు, భరించేవాడు, మోహింపచేసేవాడు, జగన్మోహినీ రూపంతో సాక్షాత్ సాంబ సదాశివునే భ్రమింపచేసి, లీలగా బృందావనంలో విహరించి, వినోదించే శ్రీకృష్ణుని, నాకు ముక్తినిచ్చే ముకుందునికి మొక్కుతున్నాను.'
  - type: verse
    id: v74
    no: '74'
    hk: |-
      alaGkAra stotrapriyo viSNuH, abhiSekArcana priyazzivaH ..
      kuGkamapUjAmicchatideviH akSatapatrANizcagaNezaH..
    en: Vishnu likes adornment and hymns; Shiva likes abhisheka and worship; worship with kumkum is dear to Sri Maha Lakshmi; Vighneshwara likes akshata and leaves. If one worships each in the way that is dear to them, that Lord is pleased and shows mercy easily.
    te: 'విష్ణువు అలంకారం, స్తోత్రం ఇష్టపడతాడు; శివుడు అభిషేకం, అర్చన - కుంకుమతో పూజ శ్రీమహాలక్ష్మికి ప్రీతి, విఘ్నేశ్వరునికి అక్షతలు, ఆకులు ఇష్టము. ఎవరికి ప్రీతి పాత్రమైనవిధంగా వారిని అర్చిస్తే, ఆ స్వామి ప్రసన్నుడై, సులభంగా కరుణిస్తాడు.'
  - type: verse
    id: v75
    no: '75'
    hk: |-
      oM namazzivAyeti paJcAkSarIca, oM namo nArAyaNASTAkSarI mantra sarvasvam.
      tArakarAmam.
      zrI rAdhAkRSNam, dhyAnayoga mArga darzinam .
      oM, namo bhagavate vAsudevA yetidvA dazAkSaryupAsaka, bhaktyAya skAntAkarSitam, karuNAsAndram, vande zrI bRndAkRSNam.
      me, mokSadam
    en: 'The five-syllable mantra "Om Namah Shivaya", the eight-syllable mantra "Om Namo Narayanaya", and the Taraka mantra "Sri Rama": whichever mantra one meditates with, the guide who makes us blessed, Lord Sri Radha-Krishna, is drawn like a magnet to devotees who worship with the twelve syllables "Om Namo Bhagavate Vasudevaya". Salutations to Lord Sri Krishna, that ocean of compassion, the giver of liberation to me.'
    te: '‘ఓనమశ్శివాయ’ అనే ఐదు అక్షరముల మంత్రము, “ఓంనమోనారాయణాయ” అనే ఎనిమిది అక్షరముల మంత్రము, “శ్రీరామ” అనే తారక మంత్రము - ఏవిధమైన మంత్రపూర్వకముగా ధ్యానం చేసినా, మనలను ధన్యులను చేసే మనకు మార్గదర్శకుడు, శ్రీరాధాకృష్ణ విభుడు: ‘ఓం నమో భగవతే వాసుదేవాయ’ అనే పన్నెండు అక్షరములతో ఉపాసించే భక్తులపట్ల అయస్కాంతంలా ఆకర్షితుడౌతాడు. అట్టి దయాసముద్రుడు, నాకు ముక్తి ప్రదాత అగు శ్రీకృష్ణ భగవానులకు ప్రణామము.'
  - type: verse
    id: v76
    no: '76'
    hk: |-
      zrI kRSNarUpam, mugdhamanoharam, vizvamohana maGgaLAnandakaram, vizva vyAptam, zrI kRSNanAdam, muraLIravam, oGkAra madhuram, gItAvAkyam vedansarvAdhikam, zrI kRSNa bhASyam, nirApekSavidhitakarmAcaraNaJca, yogAbhyAsam, bhaktim mukti pradam, zrI kRSNakRtyam duSTa zikSaNam, ziSTarakSaNam..
      zrI kRSNatatvam satyam, bhaktavazyam.
      saccidAnandam, vinodam, vizvapremaH..
    en: "Sri Krishna's form is lovely and captivates the mind. It enchants all the worlds, brings auspiciousness, and fills the entire universe. The music of Sri Krishna's flute is the sweetness of Om, and the words of the Gita are of greater glory than all the Vedas. The meaning of Sri Krishna's words: without expecting personal gain, a person should perform the duties assigned to them; liberation is attained through devotion. Sri Krishna's plays and deeds destroy the wicked and protect the righteous. Sri Krishna's nature and way: to be won over by devotees without deceit; Sat, Chit, Ananda (the joy filled with true knowledge gained through inquiry); to delight with mischievous acts, and to flood all the worlds with love."
    te: 'శ్రీకృష్ణుని ఆకారము ముద్దుగావుంటూ, మనస్సును ఆకట్టుకుంటుంది. ప్రపంచాలన్నింటినీ మోహింపచేసి, శుభాలు కల్గిస్తుంది. జగత్తంతా నిండి వుంటుంది. శ్రీకృష్ణుని వేణుగానం ఓంకారపు తీయదనము, గీతలోని మాటలు అన్ని వేదాలకంటే, అధిక మహిమకల్గినవి. శ్రీకృష్ణుని మాటలకర్థము - స్వంతప్రయోజనం ఆశించకుండా, మనిషి తనకు విధించబడిన కర్మలు ఆచరించాలి. భక్తి ద్వారా ముక్తి సాధకము. శ్రీ కృష్ణుని లీలలు, చేతలు - దుర్మార్గులను నశింపచేసి, సన్మార్గులను రక్షించుట. శ్రీకృష్ణుని ప్రకృతి, పద్ధతి - కపటము లేకుండ భక్తులకు వశమగుట, సత్ చిత్, ఆనందం (నిజమైన, జిజ్ఞాసద్వారా లభించే జ్ఞానంతో నిండివుండే ఆనందం). కొంటె పనులతో ఆనందపరచటం, అన్ని లోకాలనూ ప్రేమతో ముంచెత్తటం.'
  - type: verse
    id: v77
    no: '77'
    hk: zrI kRSNAvatAram, lIlAmAnuSam, naTahAsalAsya, navarasabharitam, bAlya krIDArambhAta zrI yAjJAna prakAzakam, namAmi, nityam, tatsarvezam mamArA dhyadaivam, zrI rAdhAkRSNam, me, mokSadam ..
    en: 'Salutations always to Sri Radha-Krishna, the dear God I worship, the God of gods: the Krishna incarnation is a human form that performs divine plays, flooding the world with games, songs, dance and laughter, beginning as a little boy with all he played, and bringing good and knowledge to all.'
    te: 'శ్రీకృష్ణావతారం - లీలలు చేసే మనుష్యరూపం, ఆట, పాట, నాట్యం, నవ్వులతో ముంచెత్తేది, చిన్న పిల్లాడిగా, ఆడినవన్నిటితో మొదలుగా, అందరికీ మంచి, జ్ఞానం కల్గించటం, అటువంటి దేవద్ధేవుడైన శ్రీకృష్ణుడు నేను ఆరాధించే ఇష్ట దైవం, కైవల్యం కలుగజేసే శ్రీరాధాకృష్ణదేవులకు ఎల్లప్పుడూ నమస్కారము.'
  - type: verse
    id: v78
    no: '78'
    hk: |-
      vande vighnezvaram, sarvadam zivatejaJca, zrI zAradAm.
      zailajAm, zyAmalAm .
      brahma, viSNuzzivaika sarvezam, saccidAnandam, zrI rAdhAkRSNam, me, mokSadam ..
    en: Salutations to Sri Krishna, the eternal abode of ever-lasting joy, in whose cosmic form are included Vighneshwara, who gets intended tasks done without obstacles; Kumaraswami, who arranges everything; Sarasvati, the giver of learning; Parvati, the bringer of auspiciousness; Lakshmi Devi, the giver of the eight kinds of wealth; and Brahma, Vishnu and Maheshwara, the agents of creation, preservation and dissolution.
    te: 'నిర్విఘ్నంగా తలచిన పనులు జరిపించేటటువంటి విఘ్నేశ్వరునికి, అన్ని అమర్చే కుమారస్వామికి, విద్యాప్రదాయిని సరస్వతి, మంగళకారిణి పార్వతి, అష్టైశ్వర్యాలనిచ్చే లక్ష్మీదేవి, సృష్టి, స్థితి, లయకారకులైన బ్రహ్మ, విష్ణు, మహేశ్వరులు - వీరందరూ తనవిశ్వరూపంలో అంతర్భాగంగా గల శాశ్వతుడైన సదా ఆనందధామములగు శ్రీకృష్ణునికి ప్రణామము.'
  - type: verse
    id: v79
    no: '79'
    hk: |-
      he zrI kRSNa bhagavAn ..
      deham rogamayam, jarAbhArama tibAdhA karam, nityAnubhavam bAndhava .
      nirasanam, saMsAram bhayaGkaram sadA .
      vyarthamadya prabhutyAyuH zUnyamme .
      bhaviSya jIvitecchaH dehime, - takSaNa asmajjanmAntaJca etat kSaNa .
      tavazrIpadazAzvata sAnnidhyam, zrIzrIkRSNAnandamaya vaikuNTha vAsam .
    en: O Lord Sri Krishna! The body is full of diseases. Old age is very hard. Being shaken off by one's own people happens every day! Family life disturbs with fear and suffering. It is pointless for me to live any longer. I have no desire at all to live. End this birth immediately. That very moment draw me permanently to your sacred feet and bless me to dwell in the supreme, joyful Vaikuntha, Lord Sri Krishna!
    te: 'ఓ శ్రీకృష్ణ భగవాన్! శరీరం రోగములతో నిండివుంది. ముసలితనం చాలాకష్టమైనది. అయినవాళ్ళు విదిలించడం రోజూ జరుగుతున్నదే! కుటుంబ జీవితం భయం, బాధలతో కలవర పరుస్తోంది. ఇటుపైన నేను బ్రతకటం వృధా. నాకు ఇంకా జీవించాలనే కోరిక ఏమాత్రం లేదు. తక్షణం యీ జన్మను ముగింపచేయి. ఆక్షణమేనీ శ్రీపాదములచెంతకు శాశ్వతంగా చేరదీసి అత్యుత్తమమైన ఆనందకరమైన వైకుంఠంలో ఉండేలా అనుగ్రహించు, శ్రీకృష్ణప్రభు!'
  - type: verse
    id: v80
    no: '80'
    hk: |-
      yegezvaram, rAdhA sahaika deha, devezvaram, mamahRdaya sthitam, vande .
      rAjIvAkSam, rAsalIlA brahmacAriNam, vizvajanakam, zrI kRSNam muktidam ..
    en: 'Salutations to Sri Krishna, who gives me liberation: the Lord of yoga, together with Radha, the God of all gods, who stands firm in my heart, lotus-eyed, who roamed with thousands in the Rasa Lila, ever celibate, the father of all the worlds.'
    te: 'యోగేశ్వరుడు, రాధా సహితుడైన, అందరి దేముళ్ళకూ దేముడు, నా హృదయంలో స్థిరంగా నిల్చిన, పద్మముల వంటి కన్నులు గల, రాసలీలలతో కొన్ని వేలమందితో విహారము సల్పిన, సదా బ్రహ్మచారి, అన్ని లోకాలకూ తండ్రి అయిన, నాకు ముక్తినిచ్చే శ్రీకృష్ణునికి వందనములు.'
  - type: verse
    id: v81
    no: '81'
    hk: |-
      maGgaLam zrIrAmacandrAya sarvalo kamaGgaLAyaca.
      devAya, parabrahmAya, zrIzrI rAdhAkRSNAya maGgaLam..
    en: Victory to Sri Ramachandra, who brings auspiciousness to all the worlds! Blessings to the Lord, the Supreme Self, Sri Radha-Krishna! May there always be good for all people and all worlds!
    te: 'అన్ని లోకములకూ శుభములు కల్గించే, శ్రీరామచంద్రునికి జయమగుగాక! భగవంతుడు, పరమాత్మడగు శ్రీరాధాకృష్ణులకు మంగళమగుగాక! సర్వులకు, సర్వలోకములకు, సదా శుభమగుగాక!'
  - type: verse
    id: v82
    no: '82'
    hk: |-
      oM zrIrAma oM hare kRSNa oM..
      vighnezvarAya vidmahe, vighnaharAya dhImahi tanno sarvasiddhiprada gaNeza devatAH pracodayAt II vighnezvara namastubhyam, bhavAnI zaGkara sutaH zivatejAgraja.
      zrIrAdhAkRSNadhyAnArambham kaivalya prAptyardham kariSyAmi, siddhirbhavatu mesadA..
    en: I understand the one called the lord of obstacles as the God who removes (destroys) obstacles, and I know (beginning with my own teacher, and by the grace of Sri Krishna, the first guru of the universe) that he is the one who makes all efforts bear fruit. Salutations to you, O Lord of obstacles, son of Parvati and Parameshwara and elder brother of Kumaraswami! I begin meditation on the God of gods, Lord Sri Radha-Krishna, to attain the state of liberation. Bless me so that this effort of mine may succeed.
    te: 'విఘ్నములకు అధిపతి అని చెప్పబడిన వారిని, విఘ్నములను హరించే (నశింపజేసే) దైవముగా అర్థముచేసుకుని, ఆస్వామియే అన్ని ప్రయత్నములు ఫలించేటట్లుగా చేయువారని (మావిద్యాగురువుగారితో మొదలు, విశ్వమునకే ఆది గురువైన శ్రీకృష్ణ విభుని అనుగ్రహముతో) తెలుసు కొనుచున్నాను. పార్వతీ పరమేశ్వరుల కుమారుడు, కుమారస్వామికి అన్నగారైన ఓ విఘ్నరాజా! నీకు నమస్కారము. కైవల్య పదసాధనకై, దేవాది దేవులు శ్రీ రాధాకృష్ణ ప్రభువుల ధ్యానము మొదలెడుతున్నాను. నాయీ ప్రయత్నము సఫలం అయ్యేలా అనుగ్రహించు.'
  - type: verse
    id: v83
    no: '83'
    hk: |-
      oM.. bhajeham, bhujaGga bhUSaNam, bhavAnIzam, bhavabhayaharam, bhaktavaradam, zrIkRSNavandyam.
      sadAzivam, namukhaSaNmukhanandi bhRGgyAdi, prathamagaNa, pariveSTitenduzekharam.
      gaGgAdharam, devAdi devam, vizva sundaram) zrIrAdhAkRSNa satatArAdhanA nandamayam.
      bhiSakrathamam, sarvarogaghnam, memokSadam..
    en: 'I sing the praises of Mahadeva, who gives liberation: Nagabhushana (who wears a snake as an ornament), the husband of Gauri Devi, who destroys fear in worldly life, who grants boons to devotees, who is bowed to by Sri Krishna, who always looks on all equally, who presides with the foremost ganas such as Ganesha, Karttikeya, Nandi and Bhringi, who bears Ganga Devi on his head, the God of all gods, the most handsome in the universe (the enchanting Sadashiva, who contains all universes within him, is without doubt supremely beautiful), who always worships Sri Radha-Krishna, the first mendicant, who destroys all diseases (according to the Rudra mantra "adhyavocadadhivaktā prathamo daivyo bhiṣak", Ishwara is the first physician).'
    te: 'నాగభూషణుడు (పామును ఆభరణముగా ధరించినవాడు) గౌరీ దేవి భర్త, సంసారంలో భయం నశింపజేసేవాడు, భక్తులకువరములు ప్రసాదించేవాడు, శ్రీకృష్ణునిచే నమస్కరింపబడేవాడు, ఎపుడూ అందర్నీ సమానంగా చూసేవాడు, గణేశ, కార్తికేయ, నంది,భృంగిమొదలగు ప్రథమ గణముతో కొలువుతీరేవాడు గంగా దేవిని శిరస్సున ధరించినవాడు, దేవతలందరికి దేవుడు, జగత్తులో అత్యంత అందగాడు ( అన్ని విశ్వములను తనలో ఇముడ్చు కున్న జగన్మోహన సదాశివుడు నిస్సంశయంగా మహాసుందరుడే), శ్రీ రాధాకృష్ణులను ఎల్లపుడూ కొలిచేవాడు, ఆది బిక్షువు, అన్ని రోగములు నశింపజేసేవాడు ( అధ్యవోచధతివకా ప్రథమోదైవ్యోభిషక్" అనే రుద్రమంత్రము ప్రకారము ఈశ్వరుడు మొదటివైద్యులు), ముక్తినిచ్చే మహాదేవుని గూర్చి భజన చేస్తున్నాను.'
  - type: verse
    id: v84
    no: '84'
    hk: zrI dhanvantaram, zrImahA viSNu svarUpam, kSIrasAgara sambhavam, surabhiSagvaram, sarvadam, mama sarvarogaghnaJca, vande, zrIrAdhAkRSNam mokSadam..
    en: Salutations to Sri Dhanvantari, who shines in the form of Sri Maha Vishnu, who was born when the ocean of milk was churned to obtain nectar, the physician of the gods, who arranges everything and, according to Sri Krishna's grace, removes all the diseases in my body, and to Lord Sri Radha-Krishna, the giver of my liberation.
    te: 'శ్రీమహావిష్ణువు రూపంతో ప్రకాశించేవాడు,అమృతసాధనకై పాలసముద్రము చిలికినపుడు పుట్టినవాడు, దేవతలకు వైద్యులు, అన్నీ సమకూర్చి, నాశరీరములోని అన్ని వ్యాధులను శ్రీకృష్ణానుగ్రహానుసారము, పోగొట్టే శ్రీధన్వంతరికి, నాకుముక్తి ప్రదాతైన శ్రీ రాధాకృష్ణ దేవునికి వందనములు.'
  - type: verse
    id: v85
    no: '85'
    hk: |-
      junnutinanivADu, kannEnaunananivADu.
      kannayya mannanalenivADu, dunna potukanna kanikiSTuNDilan..
    en: 'One who has never eaten junnu (colostrum pudding), one who never says "yes" to a young girl, one who has no regard for Kannayya (Krishna): in this world he is lower than a buffalo bull.'
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v86
    no: '86'
    hk: |-
      zrI harinAma saGkIrtana manudhyAna pakvamaujunnuvaladannavADu.
      zrIharihara bhakti kanna minna ledanEruganivADu.
      zrIharihara ajasatulakaTAkSarahituDai, zrIhari harA.
      naruDudhariNin dunnakanna hInacarituNDagun..
    en: One who refuses the ripened fruit of singing Sri Hari's name and of meditation, one who does not know that there is nothing higher than devotion to Sri Hari and Hara, who is without the sidelong glance of Sri Hari, Hara, Aja (Brahma) and Sati, O Sri Hari, Hara! Such a man on earth becomes one of conduct lower than a buffalo.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v87
    no: '87'
    hk: |-
      calanamandugAni, caJcalanamandu gAni, caJcalAkSa bhogulandugAni caJcalamanaskulandugAni, cakradhAri cariJcaDEnnaDu sarvopagatuNDayyun .
      nizcala bhaktacittamandu nizcayambuganuNDEllEDalan..
    en: The Discus-Bearer never wanders in restlessness, nor in the fickle, nor in those whose eyes roam after pleasures, nor in those of unsteady minds. Though present everywhere, he certainly dwells in every land in the steady mind of the devotee.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v89
    no: '89'
    hk: |-
      surAdhyakSam zivam sadAzivapriyam zivAnanda laharI lAsya ravaLIravam.
      sadA bhaktavaradam cakradharam zatA nandaJca sahasrAkSam.
      susmitavadanAravindam sammohanAvatAram zrImannArAyaNam sakalalokezam sarvArdhapradam suzlokezam.
      sarvaklezaharam zubhAGgam zrIvatsAkam zAzvatam vande zrIkRSNam mamamokSadam..
    en: "Respectful salutations to Lord Sri Krishna, who gives me liberation: the lord of the hosts of gods, who always looks on all alike, dear to Shiva, delighting in the sound of Om, the stream of Shiva's bliss, with an unfading face as beautiful as a lotus, who enchants everyone, whose abode is water, the lord of all worlds, who gives everything of worth, with splendid limbs, Lakshminatha, the eternal one."
    te: 'దేవగణములకు అధిపతి, ఎపుడూ అందర్నీ సమంగా చూసేవాడు, శివునికి ఇష్టుడు, శివానందప్రవాహమైన ఓంకార శబ్దప్రమోదుడు, చెక్కుచెదరని తామర పూవ్వు వంటిసొయగంనిండిన,ముఖంతో, అందర్నీ మోహింపజేసే, నీరు నివాసముగాగల, అన్నిలోకాలకు అధిపతి, అర్థవంతమైన అన్నిటినీ ఇచ్చేవాడు,శోభస్కరమైన అవయవములతో, లక్ష్మీనాధుడు, శాశ్వతుడగు, నాకు మోక్షమిచ్చే శ్రీ కృష్ణప్రభువుకు నమస్సుమాంజలులు.'
  - type: verse
    id: v90
    no: '90'
    hk: |-
      satataMsmarAmi sakalalokezam rAsalIlAzrI vinodinam zrI kRSNam.
      nityannamAmi vijayasArathim zikhipiJchamauLim zazibindum zrI kRSNam.
      sadAvande, go, gopikA, gopa, bAlAnandaGgovardhanoddhArakam zrI kRSNam.
      bhajAmyaharnizam mahAtejam pApaharam paramAtmAnam memokSadam zrI kRSNam..
    en: "I always keep in my mind and meditate on, and bow to, Sri Krishna Paramatma, the God who gives me liberation: the lord of all worlds, who delights in the Rasa Lila, the charioteer of Arjuna, who wears a peacock feather in his hair as an ornament (peacocks mate through the eyes; this bird is a symbol of celibacy, and this ornament of the always-celibate Sri Krishna carries this hint); who protects cows, cowherds, gopikas and boys, who held up Mount Govardhana like an umbrella on his little finger and protected the people of Gokula from Indra's rain of stones; most radiant, the destroyer of all sins."
    te: 'అన్ని లోకాలకు ప్రభువు,రాసలీలతో వినోదించేవాడు, అర్జునునిరథసారథి, నెమలికన్ను అలంకారముగా తలలో ధరించినవాడు (నెమలి దంపతుల కలయిక కన్నులతో జరుగుతుంది - యీపక్షి బ్రహ్మచర్యమునకు ప్రతీక. ఘోటకబ్రహ్మచారియైన శ్రీకృష్ణుని పైవిధమైన అలంకారంలో యీసూచన ఇమిడివున్నది) ఆవులను, ఆవులకాచేవారిని, గోపికలను, బాలులను రక్షిస్తూ, గోవర్ధనగిరిని గొడుగులా చిటికెనవ్రేలి పైనిలిపి, ఇంద్రునిరాళ్ళ వర్షం నుంచి, గోకుల వాసుల్ని రక్షించినవాడు. అత్యంత కాంతి వంతుడు, పాపములన్నీ నశింపజేసేవాడు - అయిన శ్రీ కృష్ణపరమాత్మను, నాకు ముక్తి నిచ్చేదైవమును ఎల్లపుడూ మనస్సులో నిలుపుకుని ధ్యానిస్తూంటాను, నమస్కరిస్తూంటాను.'
  - type: verse
    id: v91
    no: '91'
    hk: |-
      oM namo nArAyaNAya oM namazzivAya ceti mahA mantra dvayAntargata “rA” yeti “ma” iti mUlAkSarasam yuktam zrI sadAziva sRjita “rAma”, nAmna virAjita zrI rAmacandram dazaradhAtmajam raghuvIram sarvadam.
      zirasAnamAmi sadA saccidAnanda brahmaGkaikeyIsutam kausalyAputram..
      zrI hanumatsItA lakSmaNa bharata zatRghna sahita bhadrAdrirAmam.
      manasAsmarAmi smaraNeka mAtreNa zAzvata abhayadam memokSadam..
    en: "Salutations to Sri Ramachandra, who shines with the Taraka name \"Rama\", created by Sri Sadashiva himself by joining the key root syllables \"Ra\" and \"Ma\" of the Vishnu eight-syllable mantra \"Om Namo Narayanaya\" and the Shiva five-syllable mantra \"Om Namah Shivaya\"! The son of Dasharatha, hero of the Raghu dynasty, who grants all that is asked, the form of Sachchidananda Parabrahman, the beloved son of Kaikeyi and Kausalya: I bow my head to Sri Rama continually. I remember wholeheartedly Bhadradri Ramachandra, enthroned with Sri Hanuman, Sita Devi, Lakshmana, Bharata and Shatrughna; salutations to that Lord, who by the mere remembrance of that name grants lasting fearlessness and liberation to me."
    te: '"ఓం నమో నారాయణాయ" అనే విష్ణు అష్టాక్షరీ మంత్రము మరియు "ఓం నమశ్శివాయ" అనే శివ పంచాక్షరీ మంత్రములలోని కీలకమైన మూలాక్షరాలైన "రా" మరియు "మ"లను సంధించి, సాక్షాత్తు శ్రీ సదాశివునిచే సృష్టించబడిన "రామ" అనే తారకనామముతో విరాజిల్లే శ్రీరామచంద్రునికి ప్రణామాలు! దశరథుని కుమారుడు, రఘువంశ వీరుడు, కోరినవన్నీ ప్రసాదించేవాడు, సచ్చిదానంద పరబ్రహ్మ స్వరూపుడు, కైకేయీ-కౌసల్యల ముద్దుల తనయుడైన శ్రీరామునికి నిరంతరం శిరస్సు వంచి నమస్కరిస్తున్నాను. శ్రీ హనుమంతుడు, సీతాదేవి, లక్ష్మణుడు, భరతుడు మరియు శత్రుఘ్నులతో కూడి కొలువైయున్న భద్రాద్రి రామచంద్రుని మనసారా స్మరిస్తున్నాను; కేవలం ఆ నామస్మరణ మాత్రంచేతనే శాశ్వతమైన అభయమును, నాకు మోక్షమును ప్రసాదించు ఆ ప్రభువునకు వందనములు.'
  - type: verse
    id: v92
    no: '92'
    hk: |-
      anarthakam kAlayApanam cakSINamAyuHkSaNekSaNe.
      zarIrazidhilam sahajamantam, kuruzrI kRSNadhyAnam muktipradam ..
    en: Wasting time is harmful because with every passing moment the lifespan shrinks; the body wasting away and dying in time is very ordinary and unavoidable. Therefore one should always meditate on Sri Krishna. Only then will liberation come.
    te: 'సమయంవృధాచెయ్యటం చేటు ఎందుకంటే, క్షణం గడిచే కొద్దీ,ఆయుర్దాయంతగ్గి పోతూంటుంది, మనశరీరము కృశించిపోవటం,కాలక్రమేణా చనిపోవటం చాలా మామూలు, తప్పని విషయం. అందువల్ల ఎపుడూ శ్రీకృష్ణుని ధ్యానిస్తూండాలి. అపుడే మోక్షంకల్గుతుంది.'
  - type: verse
    id: v93
    no: '93'
    hk: |-
      satatamusaccidAnanda svarUpuDaina sAkSAt zrI kRSNa paramAtmaye nannu nirantaramu zrI kRSNapada dhyAna nimagnunigA karuNimpan, sarvaloka prasiddha aSTaizvarya pUrvaka divyasaukhyambulelanAku? cAlu nAku I akhaNDaizvarya varaprasAdamu ika e kalakalamunainan kalavaraparacanazakturAlai kalalo kaDali alala valE kUlipovu takSaNamu tana Avegamuto, tejomaya zrIkRSNa bhagavAnAjJAnu sAramu nizcayambugan tAmEntavArainan, paDatIpAdAkrAntulaurA.
      mArgadarzakapuruSottama zrIkRSNA..
    en: This hymn is in Telugu itself.
    te: 'ఈ గీతిక తెలుగులోనే ఉన్నది'
  - type: verse
    id: v94
    no: '94'
    hk: |-
      preraNam zrI yogezvara rAmezvara daivataizca, likhitam zrIpadadhyAna gItAvaLiH zreyantasyagAnam zrI rAdhAkRSNa kRpAyogyatArtham.
      ihajanmam dhanyam kaivalya padasAdhanArthamityucyate..
    en: These prayer songs were written under the inspiration of Lord Yogeshwara Sri Krishna, who gives joy to all. Singing them is very beneficial and makes one deserving of God's grace. The purpose of this birth is that humans, instead of being born again and dying again and turning like a wheel, attain liberation!
    te: 'అందరకూ ఆనందం కల్గించే, యోగేశ్వర శ్రీకృష్ణ దేవుల ప్రేరణతో, యీదైవ ప్రార్థన గీతాలు వ్రాయబడినది. వీటిని పాడుకోవటం చాలా శ్రేయస్కరం, భగవంతుని దయకు అర్హత కల్గిస్తుంది. యీ జన్మప్రయోజనం, మానవులు, తిరిగిపుడుతూ, చస్తూచక్రంలా తిరుగు తూందకుండా, కైవల్యం సాధించడానికే సుమా!'
  - type: verse
    id: v95
    no: '95'
    hk: |-
      oM.. bhagavadgItAcAryam, bhava bhaya rogazokaharam, bhaktirajjubandhitam.
      varadam sarvasiddhidam zrInAdham vande zrIkRSNammama mokSadam..
      oM zrIrAma oM hare zrI kRSNa parabrahmaNenamaH
    en: 'Salutations to Sri Krishna, who gives me liberation: the teacher who gave the Bhagavad Gita, who removes the fear of worldly life, who destroys all diseases and sorrows, who is bound by the rope of devotion, who fulfils all desires and makes all works end in complete success, the husband of Rama (Lakshmi).'
    te: 'భగవద్గీత ప్రసాదించిన గురువు, సంసార భయం తొలగించేవాడు, అన్ని రోగాలనూ, దుఃఖాలనూ నశింప జేసే, భక్తి అనే త్రాడుతో బంధింపబడే,కోరికలన్నీ తీర్చే అన్ని పనులూ దిగ్విజయంగా జరిగేటట్టుచేసే, రమాపతి, నాకు ముక్తినిచ్చే శ్రీకృష్ణులకు నమోవాకములు.'
  - type: verse
    id: v96
    no: '96'
    hk: |-
      oM zrI subrahmaNyam narvamaGgaLAnutam surasenAninam ziva tejam, zrI vallIzam .
      viSNu saGkalpodbhavam, velpANinam bAlam, tArakaharam, SaNmukham.
      zrI kRSNahAna prakAzapraNavArdha pravINa ziva gurum, rakSakam, vande.
      kArtikeyam, sarvadam, zaravaNam, sarvarogannam, ripughnaJca memokSadam.
    en: "Salutations to Subrahmanyeshwara, the destroyer of all diseases and enemies, the giver of liberation: the son of Uma who gives all auspiciousness, the commander of the army of the gods, praised as the radiance of Samba Shiva himself, the husband of Sri Valli, the daughter of Vishnu, born by the will of Sri Maha Vishnu, bearer of the weapon called the Vel, always a child, the slayer of Tarakasura, the husband of Shashthi Devi, famed as the guru even of Shiva, the first among those who know the meaning of Om, the light of Sri Krishna's smile, the protector of the afflicted, raised by the Krittikas, the giver of everything, Sharavana, my auspicious one."
    te: 'అన్ని శుభములనిచ్చే ఉమాసుతుడు, దేవతలసేనానాయకుడు, సాక్షాత్సాంబశివుని తేజస్సుగాకీర్తింపబడే వాడు విష్ణుమూర్తికూతురగు శ్రీ వల్లికిభర్త, శ్రీమహావిష్ణువు సంకల్ప ప్రకారము జనించినవాడు, వేల్ అనే ఆయుధం ధరించేవాడు, ఎపుడూ చిన్న పిల్లవాడే, తారకాసురుని చంపిన, షష్ఠీదేవిభర్త, శ్రీకృష్ణుని చిరునవ్వు యొక్క వెలుగైన ఓంకారమునకు అర్థము తెలిసినవారిలో ప్రథముడైన శివునికే గురువుగా ప్రసిద్ధిచెందిన వాడు, ఆర్తులను కాపాడేవాడు, కృత్తికా పక్షులచే పెంచబడ్డవాడు, అన్నీ ఇచ్చేవాడు, శరవణుడు అనే, నా మంగళవాడు, అన్ని వ్యాధులను శత్రువులను, నశింపజేసి, మోక్షకారకుడైన సుబ్రహ్మణ్యేశ్వరునికి నమోవాకములు.'
  - type: verse
    id: v97
    no: '97'
    hk: |-
      oM. sarvezazrI kRSNam, manoharam, mamArAdhyadevaram, zrIkaram, sadAzirasAnamAmi, manasAsmarAmi sadAhasitavadanam Azritavatsalam vAsudeva zrIkRSNam.
      (mugdha) muddu kRSNam madana gopAlam rAdhA kRSNam vande karuNA sindhum zrIkRSNam.
      bAlaGgopAlam yazodAnandanandanam, navanItacoram, lIlAmAnuSam naTvaram - satyasvarUpam sAndIpanI antevAsinam bhaktavaradam, dauSTyAntakam.
      praNAmyaharnizam paraJjyotiH varandhAma parameza zrIkRSNam, mamakaivalyadam..
    en: 'I always bow my head to Sri Krishna, the lord of all, who captivates the mind, the God I worship, the giver of wealth; I remember him in my mind and worship him through meditation. Salutations to Sri Krishna with an ever-smiling face, who protects those who take refuge, the son of Vasudeva, charming, delighting, the cowherd, Lord Radha-Krishna, the ocean of compassion; Gopala the child, the son of Yashoda and Nanda, who stole butter in Gokula, who was born as a man and showed many plays, the great actor, the towering form filled with truth, the disciple of the sage Sandipani, who fulfils devotees'' wishes, the sacred form of light, the dweller of the highest Goloka, Parameshwara, who gives me liberation. I bow to him always, without any difference of day or night.'
    te: 'అందరికీ అధిపతి శ్రీకృష్ణుడు, మనస్సును ఆకట్టుకునేవాడు,నేను కొలిచే దేవుడు, ఐశ్వర్యములిచ్చేవాడువీరికి ఎపుడూ తలవంచి నమస్కరిస్తున్నాను. మానసికంగా తలుచుకుంటున్నాను ధ్యానమార్గంలో ఆరాధిసున్నాను ఎపుడూ నవ్వుతూండే ముఖం, ఆశ్రయించిన వారిని ఆదుకునే, వసుదేవుని కుమారుడగు శ్రీకృష్ణుడు, ముద్దులొలికే శ్రీకృష్ణుడు, ఆనంద పరిచే, ఆవుల కాపరి రాధాకృష్ణప్రభువు, దయాసాగరుడగు శ్రీ కృష్ణునికి నమస్కారం చిన్నవాడైన గోపాలుడు, యశోదా నందుల బిడ్డ, గోకులంలో వెన్నదొంగిలించేవాడు, మనుష్యునిగా జన్మించి, అనేక లీలలు చూపిన వాడు, మహానటుడు, నిజమునిండిన నిలువెత్తురూపసి, సాందీపనిమహర్షికి శిష్యుడు, భక్తుల కోరికలను తీర్చేవాడు, పవిత్రమైన జ్యోతి స్వరూపుడు,సర్వోత్కృష్టమైన గోలోకవాసి, పరమేశ్వరుడు, నాకు కైవల్య మొసగే, శ్రీ కృష్ణునికి, పగలు రాత్రి, అనే భేదంలేకుండా ఎపుడూ నమస్కరిస్తూంటాను.'
  - type: verse
    id: v98
    no: '98'
    title: DolAlAsyam
    hk: |-
      tanmayilAlI, tanmayinAdha devezAlAlI.
      tejomayilAlI, tejomayahRdayAlAlI.
      tejasvinIlAlI, tejazrI zazaurI lAlI..
      tejorUpiNi lAlI, tejorUpAdhipA lAlI.
      pallavi..
      tatsatsItArAmAlAli, ramAramaNAlAlI.
      tApassarvahara, zrIrAdhAkRSNA lAlI..
      sirisirirazmIlAlI, musimusihAsarAzIlAlI.
      nusmitavadanAlAlI, AzritavatsalalAlI .
      tapasvinI lAlI, tapasvarUpAlAlI.
      tatvabodhini lAlI, tatvavedAnta vedyAlAlI.
      vizva mAtA lAlI.
      vizvanAdh lAlI, sarvamaGgaLa lAlI, piGgaLa sundara lAlI.
      zubha kAriNI lAlI.
      zubhazrIkAntA lAlI.
      kSIrodayA lAlI.
      kSIra sandra zayanAlAlI.
      hanumatsevita pUrNAvatAra zrIrAmA lAlI.
      balarAmAnuja sampUrNAvatAra zrI rAdhA kRSNA lAlI.
      pUrNacandrikA lAlI.
      hiraNya garbhA lAlI pallavi .
      tatsat maithilI manohara lAlI.
      rAga hRdaya zrI rAdhAkRSNA lAlI.
      bhava bhaya roga zoka harame, vaziSTha gaNa viziSTA lAlI.......
      tanmayi lAlI..
    en: Jo jo, Lakshmi Devi! Jo jo, husband of Lakshmi, lord of all the gods! Jo jo, mass of light! Sri Krishna, whose whole mind is filled with divine light! Jo jo! Lakshmi, full of radiance, jo jo! Sri Vishnu, her husband! Jo jo! Form of light! Jo jo, husband of Sridevi! Jo jo, Sita and Rama, forms of truth and reality! Jo jo to Rama Devi! Giver of joy, Sri Krishna, who destroys all distress! Jo jo, radiance of good fortune! Lotus shining with a good smiling face! God who looks lovingly on those who take refuge! Jo jo, immersed in penance, the very form of penance! Jo jo, Mother who teaches truth! Lord who accepts offerings as the one to be worshipped in the Vedas and Vedantas! Jo jo, father of all the worlds! Mother who gives all auspiciousness! Jo jo, dawn-coloured one! Father! Jo jo, cause of auspiciousness! Husband of that Mother! Jo jo, you who arose from the ocean of milk! Jo jo, you who sleep on the ocean of milk! Sri Rama, the full incarnation served by Anjaneya! Jo jo, younger brother of Balarama, Purushottama! God of gods who is full in every way, Sri Krishna incarnation! Jo jo, Mother shining like the full moon! Jo jo, Sri Krishna, God of everyone in all the universes! Jo jo, Sita, the form of truth, the daughter of the ruler of Mithila, wife of Rama! Jo jo, Lord Sri Radha-Krishna with a heart full of love! Jo jo, Sri Ramachandra, best in the Vasishtha tradition, who destroys my family's fears, diseases and tears!
    te: 'లక్ష్మీదేవీ జోజో। లక్ష్మీపతీ, అందరి దేముళ్ళకే అధిపతీ, జోజో/ కాంతిపుంజమా జోజో మనసంతా దివ్యకాంతితో నిండిన శ్రీకృష్ణా! జోజో। కాంతినిండివుండే లక్ష్మీజోజో। ఆమెభర్తపగు శ్రీ విష్ణూ! జోజో। కాంతిస్వరూపీ! జోజో శ్రీదేవీనాధా! జోజో! తత్త్వము, సత్యముల రూపమైన సీతారాములారా! జోజో! రమాదేవికి జోజో! ఆనందంకల్గించేవాడా అన్ని వ్యాకులాల్నీ నశింపజేసే శ్రీకృష్ణా। జోజో! సౌభాగ్యముల ప్రకాశమా! జోజో! మంచి నవ్వుముఖంతో రాజిల్లేకమలా! ఆశ్రయించిన వారిని ప్రేమతో చూసేదేవా! జోజో! తపస్సులో మునిగివుండే, తపస్సు యొక్క ఆకారమా! జోజో! తత్త్వమును భోధించేమాతా। తత్త్వము, వేద వవేదాంతములందు పూజనీ యుడగా నివాళులందు కొనే స్వామీ। జోజో! అన్నిలోకాలకూ తండ్రీ! అన్ని మంగళములనిచ్చే అమ్మా॥ జోజో! అరుణనందరా। నాన్నా! శుభములకుకారకురాలా/జోజో! ఆమాతకు నాధా/జోజో! పాలనముద్రం నుండి ఉద్భవించిన దానా!జోజో! పాలనముద్రమీద పవళించే వాడా/జోజో! ఆంజనేయునిచే సేవింపబడేపూర్ణావతారా! శ్రీరామా! జోజో బలరాముని తమ్ముడైన పురుషోత్తమా అన్ని నిండుగా గల దేవాదిదేవా శ్రీకృష్ణావతారా! జోజో నిండు నున్నమి నాటి చంద్రుని వలెశోభిల్లేతల్లీ! జోజో అన్ని విశ్వాల్లో అందరికీ దేవుడైన శ్రీ కృష్ణా! జోజో నిజము యొక్క ఆకారమైనమిథిలాధిపతి కూతురైన, సీతకువతి! జోజో! ప్రేమతో నిండుగుండెల శ్రీరాధాకృష్ణ ప్రభూ! జోజో! నాకుగల కుటుంబీక, భయము,వ్యాధులు, ఏడ్పులు, నశింపజేసే, వశిష్ఠగణములో, సర్వోత్కృష్టుడైన శ్రీరామచంద్రా! జోజో!'
  - type: verse
    id: v99
    no: '99'
    title: dhyAna mahatyam - vizvaguru zrI kRSNasUktiH
    hk: |-
      oM.. jihvAgrevanati zrI kRSNanAma saGkIrtanam ca saMsAramaihikam hRdayassarvam zrI kRSNAnandamayam karoti .
      dhyAnam zrI kRSNasAyujyadam tasmAtsarva yatnena zrI kRSNadhyAnayogI bhava sAyujya sAdhana mastu..
    en: The power to praise Sri Krishna with his many names is at the very tip of the tongue; worldly life, the bond of this world, stays at home. Meditation on Sri Krishna is full of the bliss of Sri Krishna, gives great joy and, at the end, liberation. Therefore, making every effort, may you practise the yoga of meditation on Sri Krishna! May liberation be attained!
    te: 'నాలిక కొననేవుంటుంది శ్రీకృష్ణుని బహునామాలతో స్తోత్రం (చేసేశక్తి), యీలోకంలో బంధమైన సంసారం ఇంట్లో వుంటుంది. శ్రీకృష్ణ ధ్యానం శ్రీకృష్ణానందం తోనిండివుండినది, కల్గిస్తుంది మహాసంతోషం, చివరల్లోముక్తి. అందువల్ల అన్ని ప్రయత్నాలుచేసి, శ్రీకృష్ణధ్యాన యోగం అభ్యసింతురుగాక! మోక్షము లభించుగాక!'
  - type: verse
    id: v100
    no: '100'
    hk: |-
      nitya vandanam tejaH puJjam harim daityaharam mamArAdhya daivam tANDava zrI kRSNam madhurassarvam madhurAdhipam mAdhavam bRndAlIlA zrI kRSNam vizvarUpam.
      jagatsarvadaJjaganmohanam jagadAnanda kArakam rAdhezam zrI kRSNam.
      bAla kRSNam me sarvasvam zrInRsiMham gItAkRSNam dhyAnakRSNam sAyujyadam..
      zvAsAntAzvAnam (antya vinnapam) dIna dayALA.
      zrI kRSNa devA..
      dehi me, takSaNam tedivya pada sAyujyam zAzvatam..
      “bhagavadprasAdam” - sarvam zrI rAdhAkRSNArpaNamastu
    en: 'Salutations to the little Krishna, who arranged everything for me: the mass of light, Vishnu, the slayer of demons, the God I worship, Sri Krishna who delights in dance, whose stories and plays are all of great flavour, the ruler of Mathura, the husband of Lakshmi Devi, who performed the Rasa Lila in Brindavan, the cosmic form, who has become the entire universe, who enchants all the worlds, the cause of joy, Radhanatha Sri Krishna. A lion among men, who taught meditation through the Gita, Sri Krishna alone gives me liberation! May he keep blessing me to always remember him! Adi Narayana, who helps the helpless! Sri Krishna Deva! Right now, merge me into your sacred, nectar-filled, joy-giving feet. Protect me!'
    te: 'కాంతి సమూహము, విష్ణువు, రాక్షసులను చంపేసే వాడు, నేనుకొలిచే దైవం, నాట్యవినోది శ్రీకృష్ణుడు, ఆయన గాధలన్నీ, లీలలన్నీ మహా రుచివంతం, మదురకుపాలకుడు, లక్ష్మీదేవి భర్త, బృందావనం లో, రాసలీల సాగించిన వాడు, విశ్వరూపుడు, జగత్తంతాతానైన, అన్నిలో కాలనూ వ్యామోహింపజేసే వాడు, ఆనందమునకు కారకుడు రాధానాధుడు శ్రీ కృష్ణుడే। నాకు అన్నీ అమర్చిన బుజ్జి కృష్ణునికి నమోవాకాలు. నరులలో సింహమువంటివాడు, గీత ద్వారాధ్యాన బోధచేసిన, నాకు కైవల్య ప్రసాది శ్రీ కృష్ణులే! ఎపుడూ వారిని స్మరించేటట్టు నన్ను అనుగ్రహిస్తూనే వుందురు గాక! దిక్కులేని వారిని ఆదుకునే ఆది నారాయణా ! శ్రీకృష్ణ దేవా! ఇప్పటికిప్పుడే నన్ను నీ పవిత్రమైన అమృతమునిండిన ఆనందదాయకమైన పాదములలో నన్నుకలిపేసుకో! కాచిరక్షించు।'
  - type: verse
    id: v101
    no: '101'
    title: zrI rAdhAkRSNamuktAvaliH
    hk: |-
      oM namonArAyaNAya, oM namo bhagavate vAsudevAya harekRSNa rAmeti,sadAdhyAyAmi, vizvarUpa zrIkRSNam bhaktajanapAlakam, rakSakam, zrIrAdhAkRSNam, zAzvata zrIkRSNasAyujyadam ..
    en: I always meditate on Sri Radha-Krishna, the cosmic form who rules and protects his devotees, and on Sri Krishna Deva who grants the lasting union with Sri Krishna, with the eight-syllable mantra "Om Namo Narayanaya", the twelve-syllable mantra "Om Namo Bhagavate Vasudevaya", and "Hare Krishna, Rama".
    te: 'ఓం నమోనారాయణాయ అనే అష్టాక్షరి(8 అక్షరాల) మంత్రంతో, ఓం నమోభగవతే వాసుదేవాయ అనే ద్వాదశాక్షరితో, హరే కృష్ణ, రామ అంటూ, విశ్వరూపుడు, భక్త జనులను పాలించి రక్షించే శ్రీరాధాకృష్ణులను శాశ్వత మైన శ్రీకృష్ణసాయుజ్యమొసగే శ్రీ కృష్ణ దేవులను ఎపుడూ ధ్యానిస్తున్నాను.'
  - type: verse
    id: v102
    no: '102'
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam .
      skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam .
      mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi .
      zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam.
      (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: 'I keep in my mind and meditate on that Lord of all, Sri Maha Vishnu, who grants all boons as Sri Venkateshwara Swami, the visible God of Kali Yuga; Kumaraswami and his elder brother Vighneshwara; Narasimha Swami; Shiva; Sai Natha; Vishnu, the husband of Rama; Hanuman; and Sri Rama, the cause of auspiciousness. I bow my head to Sri Radha-Krishna, the maker of Kali Yuga, the lord of all universes, who gives liberation.'
    te: 'ఆసర్వేశ్వరుడు, కలియుగ ప్రత్యక్ష దైవమైన శ్రీవేంకటేశ్వరస్వామి గా అన్నివరాల నిచ్చే శ్రీమహావిష్ణువును, కుమారస్వామి, వీరి అన్న గార్లైన విఘ్నేశ్వరుని, నరసింహస్వామిని, శివుని, సాయినాథుని,రమాపతి యగు విష్ణువును, హనుమంతుని, శుభములకు కారకుడైన శ్రీరాముని మనస్సులో నిలిపి, ధ్యానంచేస్తున్నాను. కలియుగ కర్త అయిన, విశ్వములన్నిటికివిభుడు, కైవల్య మొసగే శ్రీరాధా కృష్ణ దేవులకు తలవంచి నమస్కరిస్తున్నాను.'
  - type: verse
    id: v103
    no: '103'
    title: zrIkRSNa rakSA kavacam
    hk: |-
      oM taddevakInandanam, kArAgAra janitam, jagannATaka sUtradhAriNam .
      vAsudevam, bhakta sarvadam vizvarUpa pradarzinam muktidam nizIdhe yamunAmArge, nandagRha pravezikam, vande yazodAnanda gopAlam vizvazAntikaram .
      kSIrArtham, zizuhelayA, mAtRvakSojAMzuka, karSaNodyutakaraH zrI karaH kRSNassapuSNAtunaH ..
      (108 akSaramula kUrpu)
    en: "May the little hand of Sri Krishna, that child, raised to pull at his mother's sari end with a small child's stubbornness for milk, which gives all auspiciousness, always protect me: the son of Devaki, born in a prison, who enchants the worlds with his Vishnu/Yoga maya and, according to the fruits of each one's karma, leads lives like an exciting drama; the son of Vasudeva, the one who gives devotees everything, who even showed the cosmic form, the giver of liberation, who entered Nanda's house on a dark night by the path of the Yamuna, the son of Yashoda, the cowherd, who gives peace to the whole universe."
    te: 'ఆదేవకికొడుకు, చెరసాల లో జన్మించిన వాడు, లోకాలను తన విష్ణు / యోగమాయతో మోహింపజేసి, ఎవరి కర్మల ఫలానుసారం జీవితములు ఉత్కంఠతో నాటకముగా నడిపించేవాడు, వసుదేవుని పుత్రుడు, భక్తులకు అన్నీ ప్రసాదించేవాడుగా, విశ్వరూపాన్ని కూడ ప్రదర్శించినవాడు, మోక్షప్రదాత, చీకటి రాత్రిలో యమునానదీ మార్గంలో నందునింట ప్రవేశించిన వాడు, యశోదసుతుడు, ఆవులకాపరి, విశ్వమంతటికి శాంతినిచ్చే వాడు,పాలుకావాలని చిన్న పిల్లాడి మంకుతనం చేష్టతో తల్లి పైటకొంగు లాగటానికి పైకెత్తిన, శ్రీకృష్ణుని ఆ చిన్నారి చిట్టి చెయ్యి, అన్ని శుభములనిచ్చేది, నన్ను సదా రక్షించుచుండుగదా!'
  - type: verse
    id: v104
    no: '104'
    title: zrIkRSNadhyAna sarvasvam
    hk: |-
      oM . vedam zrIkRSNam, vedArtham zrIkRSNam, , vedAntam zrIkRSNam, vedavedAntargata daivam zrIkRSNam, nAdam zrIkRSNam, oM kAra nAdam zrIkRSNam, veNunAdam zrIkRSNam, pAJcajanya gItAnAdam zrIkRSNam dhyAnam zrIkRSNam yAgam yogam zrIkRSNam, vinodam zrIkRSNam, bhavabhayakhedachedanam zrIkRSNam .
      rAgam zrIkRSNam .
      anurAgam zrIkRSNam gAnam zrIkRSNam sAmagAnam zrIkRSNam hAsam zrIkRSNam rasalAsyam zrIkRSNam rAdhezam zrIkRSNam, jagadIzam zrIkRSNam .
      nATyam zrIkRSNam.
      jagannaTvaram zrIkRSNam mAyAjaganmohinam zrIkRSNam, naTarAjanRtyam zrIkRSNam .
      vANI vINA nAdAmRtam zrIkRSNam vamde, tam zrIkRSNam mamabhukti rakti zakti bhakti muktidam mumukSam zrIkRSNam dhanyam zrIkRSNa dhyAna jIvanam tathyam zrIkRSNa divyapAda zAzvata sAnnidhyam sAyujyam ..
      (daza gAyatri samAkSarI)
    en: "All the Vedas, the meaning of the Vedas, the Vedanta literature that teaches dispassion, the God hidden in the Vedas and Vedantas is Sri Krishna! The sound, Om, the voice of the flute, the sound of Sri Krishna's conch called Panchajanya, the sound produced by reciting the Gita, meditation, sacrifices, the humorous conversations and witty remarks: all these are Sri Krishna's acts that cut off fear and suffering in worldly life at the root. The melody, love and voice in a song, the recitation of the Sama Veda, dance; the first dramatist of the world, who took the enchanting Jagan Mohini form; Shiva's dance, and the sound of the veena played by Sarasvati, are like nectar. All this is Sri Krishna; Sri Krishna is in all of this. Constant salutations to that God of gods, Sri Krishna, who pervades the whole world, the Lord of the universe, who gives me food, love, strength and devotion, and at the end of this life merges me in his feet."
    te: 'వేదములన్నీ, వేదములకర్థము, వైరాగ్యము బోధించే వేదాంతసాహిత్యము, వేదవేదాంతములలో, నిబిడీకృతమైన దైవము శ్రీ కృష్ణుడే! శబ్దం, ఓంకారం, వేణుస్వరము, పాంచజన్య మనే శ్రీ కృష్ణుని శంఖపుధ్వని, గీతాఉచ్చారణ వల్ల కల్గిన శబ్దము, ధ్యానం, యజ్ఞ యాగములు, జరిపేహాస్యపు సంభాషణలు, చతురోక్తులు, ఇవన్నీ కూడా సంసారములోని భయము,వ్యధలను మొదలంటే సరికే సే శ్రీకృష్ణ చర్యలే. పాటలోని రాగము, ప్రేమ, స్వరము, సామవేదం చదవటం, నాట్యము, జగత్తులోని మొదటి నాటక కర్త, మాయాజగన్మోహినీ రూపం ధరించిన వాడు, శివుని నృత్యము, సరస్వతి చేసే వీణానాదం, అమృతం వంటిది. ఇవన్నీ శ్రీకృష్ణుడే - వీటన్నీటా శ్రీకృష్ణుడే. అటువంటి లోకమంతా వ్యాపించిన దేవదేవుడు శ్రీ కృష్ణునికి, నాకు తిండి, ప్రేమ, బలం, భక్తి ప్రసాదించి, యీజన్మాంతలో తన పాదములలో విలీనము చేసుకునే జగన్నాధులగు శ్రీకృష్ణ దైవమునకు సదావందనము.'
  - type: verse
    id: v105
    no: '105'
    title: zrIkRSNa sAyujya sAdhanam
    hk: ''
    en: The spiritual practice leading to union with Sri Krishna.
    te: ''
  - type: verse
    id: v105a
    no: 105a
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam .
      skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam .
      mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi .
      zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam.
      (kaliyuganAthunito {prAraMbhiMci} kaliyuga kartAto dhyAna samApti)
    en: Prostration to Sri Krishna, the compassionate one who removes all my sins; who, with boundless mercy, takes upon himself the fruits of all the actions done in all births so that I need not bear them any longer; who removes fear, arranges everything, and gives liberation at the end of this life.
    te: 'దయామయుడు నాపాపములన్నీ పోగొట్టి, సర్వజన్మలలో చేసిన, అన్ని కర్మల ఫలితములు ఇటుపై నేను భరించ వలసిన అవసరం లేకుండా, అపారమైన కరుణతో తానే స్వీకరించి, భయం పోగొట్టి, అన్నీ అమర్చి, యీజన్మాంతంలో ముక్తినిచ్చే శ్రీకృష్ణునికి సాష్టాంగనమస్కారము.'
  - type: verse
    id: v105b
    no: 105b
    title: zrI zrIkRSNa AtmArpaNam
    hk: |-
      sarvadevezam sarvavizvezam sarvesarvadAzritassarvadam suzlokezam .
      yuga puruSam snigdhamohanAkAram patitoddhArakam oGkAra prakAzam .
      jagadgurum jyotisvarupam, dhyAyAmi satatam, tamIzam mehRdaya sthitam.
      sarvam samarpayAmi.
      AtmArpaNam kariSyAmi zrIkRSNam mamasAyujdam ..
    en: 'I always meditate on Sri Krishna: the God of gods, lord of all worlds, who always protects all who take refuge in him, Sri Lakshminatha, the Yuga Purusha (the best among all, in any age), the enchanting form that shines with smiles, who raised many who had fallen by the nature of their qualities, the brilliance of the sound of Om, the guru of all, who shines in the form of a sacred flame and stands in my heart. Along with myself, I place everything he gave me at his feet; this is indeed the God who gives union with himself!'
    te: 'దేవాదిదేవుడు, అన్నిలోకాలకు అధిపతి, ఎల్లపుడూ తనను ఆశ్రయించిన వారందర్నీ ఆదుకునేవాడు, శ్రీలక్ష్మీ నాథుడు, యుగపురుషుడు (ఏయుగంలోనైన, అందరిలో శ్రేష్ఠుడు) నవ్వులతో రాజిల్లే, పరవశింపజేసే రూపసి, ఎందరో గుణగణరీత్యా అధోగతి పాలైన వారిని ఉద్ధరించినవాడు, ఓంకార స్వరమునకే వెలుగుజిలుగు, అందరికీ గురువు, పవిత్రమైన దీపశిఖరూపంతో తళతళలాడే ఆయీశ్వరుడునాహృదయంలో నిలిచి యున్నవాడైన శ్రీకృష్ణుని ఎపుడూ ధ్యానిస్తున్నాను. నాతో సహా, వారు నాకిచ్చినవన్నీ, వారి పాదాల ముందుపెడుతున్నాను, సాయుజ్యం ఇచ్చే దైవం వీరేసుమా!'
  - type: verse
    id: v106
    no: '106'
    title: bahurUpa zrIkRSNadhyAnam
    hk: |-
      oM tatsarvezam kaliyuga pratyakSa daivatam, harim sarvadam zrIveGkaTezam .
      skandam, skandAgrajam zrI nRsimham sadAzivam ca sAIzam .
      mAdhavam mahAviSNum hanumam zrIrAmam maGgaLakaram manasAsmarAmi .
      zirasAnamAmi kaliyuga kartRm, vizveza zrIrAdhAkRSNam sAyujyadam.
      (kaliyuganAthunito prArambhiJci kaliyuga kartAto dhyAna samApti)
    en: "Salutations to Sri Krishna: the mischievous, smiling, playful little child, the lotus of Sri Maha Lakshmi's heart, remover of all faults, the eternal one whose abode is water at the time of dissolution, the delighter of Radha's mind, the stream of melody born from his wonderful flute music, Hiranyagarbha, that is, the God of gods; he alone gives liberation to all, and he is the beloved God who makes me attain liberation. Salutations to such a Mukunda."
    te: 'కొంటెగానవ్వుతూ చిలిపిచేష్టలు చేసేచిన్ని పాపడు, శ్రీమహాలక్ష్మీ హృదయ సరోజ మైనవాడు, సర్వదోషహారి, ప్రళయ కాలమున నీరు నివాసము గాగల శాశ్వతుడు, తన అద్భుతమైన వేణునాదము నుంచి జనించిన, రాగప్రవాహమైన రాధామనోరంజకుడు, హిరణ్యగర్భుడు - అనగా దేవాది దేవుడు, అగుశ్రీ కృష్ణునికి ప్రణామము, వారే సర్వులకు మోక్షమిచ్చేవాడు, నన్ను ముక్తిపొందునట్లు చేయు ఆరాధ్యదైవము వీరే, అట్టి ముకుందునికి వందనములు.'
  - type: verse
    id: v107
    no: '107'
    title: zvAsAntAzvAsam (tudi vinnapam)
    hk: |-
      dInadayALA .
      zrIkRSNadevA .
      dehi, me, takSaNa te divyapada sAyujyam zAzvatam ..
    en: Protector of the helpless! Sri Krishna! Merge me into your feet forever, right now.
    te: 'దిక్కులేనివారిని రక్షించేవాడా! శ్రీకృష్ణా! ఇపుడే నాన్ను శాశ్వతంగా నీ పాదాలలో కలిపేసుకో'
  - type: verse
    id: v108
    no: '108'
    title: vizvamaGgaLam
    hk: |-
      maGgaLam narasimhAya, herambaH bAlAya, hanuma zrIrAmadattAya .
      gurvAdi nArAyaNaparabrahmAya, harihara zubhazrI devyaizca maGgaLam, sAyIzAzrita vatsalaH sadAzivasvarupAya maGgaLam .
      jagannAtha, deveza, lIlA vinodagopAla muktipradAya zrIrAdhAkRSNAya maGgaLam ..
      (108 akSaramula kUrpu)
    en: 'May there always be auspiciousness for Sri Narasimha Swami, Ganesha, Shanmukha, Anjaneya, Sri Rama, Dattatreya, Adi Narayana the Parabrahman, Vishnu, Shiva, Lakshmi and Gauri who give all auspiciousness, Sai Baba, Samba Sadashiva who cherishes those who take refuge, Jagannatha, the God of all gods, Gopalakrishna who delights in play, and Sri Krishna Swami who gives liberation! May all the worlds be well!'
    te: 'శ్రీనృసింహస్వామికి, గణేశునికి, షణ్ముఖునికి, ఆంజనేయునికి, శ్రీరామునికి,దత్తాత్రేయునికి, పరబ్రహ్మఅయిన ఆదినారయణునికి, విష్ణు,శివ,అన్ని మంగళాలనిచ్చే లక్ష్మీ, గౌరీ, దేవీలకు, సాయి బాబాకు, ఆశ్రయించిన వారిని ఆదరించేసాంబసదా శివునికి,జగన్నాధుడు,దేవులందరకు దేవుడు, లీలావినోదాలగోపాలకృష్ణునికి, మోక్షమిచ్చే శ్రీకృష్ణ స్వామికి ఎల్లపుడూ మంగళమగు గాక! అన్నిలోకాలకు శుభమగుగాక!'
  - type: verse
    id: v109
    no: '109'
    title: dhyAnAntara namovAkam
    hk: ''
    en: |-
      Concluding prayer upon meditation
    te: |
  - type: verse
    id: v109-1
    no: 109 (1)
    hk: |-
      oM vande vinAyakam kumAram vAyunandanam ca parandhAmam zrI raghu rAmam .
      brahmaviSNuzziva zrIdevI svarupa vaMzImohanam zrI rAdhA kRSNam mokSadam .
    en: 'Salutations to Sri Krishna, the giver of liberation, Vamshi Mohana Krishna, who holds within his cosmic form all the gods, male and female: Ganesha, Subrahmanya, Hanuman, Sri Rama the Supreme Abode, Brahma, Vishnu, Shiva, Rajarajeshwari and Gayatri.'
    te: 'గణేశునికి, సుబ్రహ్మణ్యనికి, హనుమకు, పరంధాముడైన శ్రీరామునికి, బ్రహ్మవిష్ణు, శివ, రాజరాజేశ్వరి, గాయత్రి అందరి స్త్రీపురుష స్వరూపువైన దేవులందరిని, తన విశ్వరూపంలో, ఇముడ్చుకున్న, వంశీ మోహన కృష్ణుడు, కైవల్య ప్రదుడైన శ్రీకృష్ణునికి వందనం.'
  - type: verse
    id: v109-2
    no: 109(2)
    hk: |-
      oM namo digdazA pradIpta praNava divyadhavaLa (prabhaJjana) prakAzam sundarezvaram .
      (zivam zivAnIzam somazekharam sarvezvaram sarvadam sarva rogaghnam ca ripughnam zAzvata sAyujyadam) zivam zivAnIzam zrIkRSNAnandamayam zambhum mama zrIkRSNa sAyujyadam ..
    en: 'Salutations to Mahadeva, who is our giver of liberation: the Om that lights up all directions, immensely handsome, filled with sacred, glittering white light, Shiva, the husband of Gauri, the God full of the bliss of Sri Krishna.'
    te: 'అన్ని దిక్కులు ప్రకాశింపజేసే ఓంకారం, పవిత్రమైన ధగధగమెరిసే తెలువు కాంతిజి గేళ్ళతో నిండిన అమితమైన అందగాడు, శివుడు, గౌరీపతి, శ్రీకృష్ణానందంతో నిండింపుండే దైవము, మాకు ముక్తి వరదుడు అగు మహాదేవునికి నమోవాకాలు.'
  - type: verse
    id: v110
    no: '110'
    title: phaNiphaNAgra zrIkRSNapadavinyAsam
    hk: |-
      duSTa zikSaNa vilakSaNa vilAsam .
      bAlakRSNa kathAzravaNam ca nAmagAnam dhRvam jIvanmuktidAyakam .

      sarvAparAdhAn kSamadhvam
      bhagavatprasAdam
      sarvam zrIrAdhAkRSNArpaNamastu
      zrIkRSNa zaraNAgataH lekhakaH
    en: The effortless dance of Sri Krishna's feet on the hood of the serpent (on Kaliya's head), a novel way of punishing the wicked! Liberation comes by listening to the stories full of the plays of dear Gopala Krishna, or by meditating on him by each of his names.
    te: 'పాముపడగ (కాళీయుని తలపై) నిలిపిన శ్రీకృష్ణుని పదముల అలవోక నృత్యము, దుష్టులను శిక్షించే వినూత్న పద్ధతి! ముద్దు గోపాల కృష్ణునిలీలలలో నిండిన కథలు విన్నా, పేరు పేరుగా ధ్యానంచేసినా ముక్తి కల్గుతుంది.'
  - type: verse
    id: v111
    no: '111'
    title: punaH zrIkRSNadhyAnam (navanamakam)
    hk: |-
      oM kAra svarUpam, oM kArAlaGkRtam, oM kAra jaTAjUTa dharam oM kAra nAdapriyam, oM kArIzvaram .
      oM kAratejam, oM kAra nAdAmRtAnandapradam, oM kArakSetrezvaram, oM trinetram .
      oM tripurAntakam, tripura sundarIzam, oM trailokyavandyam, oM oM zaGkaramIzvaram .
      oM zambhum, oM sAmbam, oM zivapaJcAkSari tapasvI prasannam, oM, oM satyam zivam sundaram, oM sadAvande, me sAyujyada zrI kRSNa vizvarupAntargata virUpAkSam zAzvatAnandadam .
    en: "Salutations to the Lord who is the form of Om, with his adornments, the one with matted locks who loves the sound of Om, the lord of the Omkara shrine, the radiance of Om, who gives a joy equal to the nectar of its sound; the three-eyed one, the slayer of the Tripura demons, the husband of Tripura Sundari, worshipped by the three worlds, Shankara, Ishwara, Samba, Shambhu, who appears before one who worships with \"Om Namah Shivaya\"; Virupaksha, the union of truth, equanimity and auspiciousness, the giver of lasting joy, who is hidden within the cosmic form of Sri Krishna who gives liberation."
    te: 'ఓంకారము ఆకారము, అలంకరణ, జడలధారి, ఓంకార శబ్దమునిష్టపడే, ఓంకారక్షేత్రనాధుడు, ఓంకారపుతేజస్సు, దాని ధ్వని అనే అమృతముతోసమానమైన ఆనందం ఇచ్చే, మూడు కళ్ళవాడు, త్రిపురాసురులను చంపిన, త్రిపుర సుందరి భర్త, ముల్లోకాలు పూజించే, శంకరుడు, ఈశ్వరుడు, సాంబుడు, శంభుడు, “ఓంనమశ్శివాయ” తో ఉపాసిస్తే సాక్షాత్కరిస్తాడు. నిజము, సమత్వము, శుభముల కలయిక అగు విరూపాక్షుడు, శాశ్వతమైన సంతోషమిచ్చేవాడు, కైవల్యమిచ్చే శ్రీకృష్ణుని విశ్వరూపంలో నిబిడీకృతమైన స్వామికి నమస్కారములు.'
  - type: verse
    id: v112
    no: '112'
    hk: |-
      oM namo zrIkRSNAya vAstupumsAya, gRhAdhiSThAna devAyaca .
      kurusarvAriSTaharam, me, gRhe, sarvatramaGgaLam, lakSmI saha nityanivAsam, zrIkRSNAnandamayam ..
    en: O Sri Krishna! Vastu Purusha! God who stands as the protector of the house! Let Lakshmi Devi always remain steadily in our house, and you always together with her; make it filled with all auspiciousness and with the bliss of Sri Krishna.
    te: 'ఓ శ్రీకృష్ణా! వాస్తుపురుషుడా! ఇంటికి రక్షణగా నిలిచే దైవమా! మా ఇంట ఎపుడూ లక్ష్మీదేవి స్థిరముగా వుండేలా, ఆమెతో నిత్యమూ కలిసినీవుంటూ, అన్ని శుభాలకలిగేటట్టు, శ్రీకృష్ణానందమయంగా చెయ్యి.'
  - type: verse
    id: v113
    no: '113'
    hk: |-
      hariNApi hareNApi brahmaNApi surendrapi .
      krodhakAntAprasannArtham pAdAkrAntAH nasaMzayaH
      he mArgadarsaka puruSottama zrIkRSNa .
      namonamaH.
    en: Harini, Deer, Brahma, and Indra (the king of gods); destroyer of anger, pleasant one, and he who casts away doubt from the mind - O Hemargha-darshaka (Revealer of golden paths), Purushottama, Sri Krishna - Salutations, salutations.
    te: ''
  - type: verse
    id: v114
    no: '114'
    hk: |-
      tam nakhazikha paryantamadbhata saundarya zobhitAGgam .
      zikhipiJchamauLim, mRdUmadhurahAsapradIptavadanam .
      khaluharam khANDavadahana kArakam, baliSTham, balarAmAnujam .
      akhaNDatejorAzim Adidaivam, zrIkRSNam, vande, me, mokSadam ..
    en: 'Salutations to Sri Krishna, who gives me liberation: shining with immense beauty in his limbs from head to toenail, with the peacock feather in his hair, his face lovely with a fine smile, the slayer of the wicked, the cause of the burning of the Khandava forest, of immense strength, the younger brother of Balarama, an endless mass of light, the first of the gods.'
    te: 'తలనించి కాలిగోటి వరకూ అమితమైన అందంతో వెలిగిపోయే అవయవాలసొంపు, తలలోని నెమలి కన్ను, చక్కటి చిరునవ్వుతో విరాజిల్లే మోము చందము, దుర్మార్గులను సంహరించే, ఖాండవవనం తగుల బడుటకు కారణమైనవాడు, అమితబలశాలి, బలరాముని తమ్ముడు, అంతులేని కాంతి పుంజం, మొదటి దేవులు, నాకు మోక్షమిచ్చే శ్రీకృష్ణునికి నమస్సులు.'
  - type: verse
    id: v115
    no: '115'
    hk: |-
      bAlakRSNam gopAlakRSNam rAdhAkRSNam rAsakrIDAkRSNam .
      dhyAyetsadAyoga kRSNam, lIlA kRSNam mokSadam, me, vaMzImohana kRSNam .
    en: 'Salutations to Sri Krishna, the giver of liberation: to Bala Krishna, the cowherd, who danced the dance of love with Radha, who gave the Gita and the science of yoga, the joy of games and songs, who enchants listeners with the music of the flute.'
    te: 'బాలకృష్ణునికి, ఆవులకాపరికి, రాధతో కలిసి, ప్రేమ నాట్యము సల్పిన వానికి, గీతా యోగవిద్యలనిచ్చిన, ఆటపాటల ఆనందుడు, మురళీగానంతో శ్రోతలను మంత్రముగ్ధులను చేసే, మోక్షప్రదాత శ్రీకృష్ణునికి వందనం.'
  - type: verse
    id: v116
    no: '116'
    hk: |-
      zrIkRSNadevaram halarAmAnujam, govardhanoddhArakam navanIta
      coram nanda nandanam gopIvastraharam duSTavanitAraJca phaNirAja bANAsuramardana madana gopAlam vana vihAralIlAvinodinam .
      ziSTastrImAnarakSakam bhArataraNasArathim vizvarUpam vizvajanAkarSaka vigraham .
      namAmi bhagavadgItA govindam muktimArgabodhakam mukundam vande, me, zrIkRSNam mokSadam ..
    en: "Salutations to Sri Krishna, who gives me liberation: the younger brother of Balarama, who lifted Mount Govardhana and protected the cows and cowherds, the butter thief, the son of Nanda, the cunning thief who carried off the gopikas' clothes (and who later saved Draupadi from dishonour by giving endless saris), who trampled down those who strayed from dharma such as Kaliya and Banasura, who roamed and delighted in Brindavan with games and songs, the chief deity behind the Bharata war, who took the cosmic form, the divinely beautiful one who can attract all worlds, who showed the path of liberation through the Bhagavad Gita."
    te: 'శ్రీకృష్ణదేవునికి, బలరామునికి చిన్నిసోదరుడు, గోవర్ధనగిరి నెత్తి, గో, గోపాలురను కాపాడిన, వెన్నదొంగ, నందుని సుతుడు, గోపికల బట్టలెత్తుకుపోయిన టక్కరిదొంగ, (తదుపరి మానభంగం కాకుండా అంతులేని చీరలిచ్చి ద్రౌపతిని కాపాడిన వాడు) కాళీయుడు, బాణాసురులు మొదలైన ధర్మము తప్పిన వారిని అణగ ద్రొక్కినవాడు, బృందావనంలో ఆటపాటలతో విహరించి ఆనందపరచినవాడు, భారతయుద్ధానికి మూలవిరాట్, విశ్వరూపం దాల్చిన, అన్ని లోకాలనూ ఆకర్షింపగల దివ్యసుందరుడు, భగద్గీత ద్వారా ముక్తి మార్గం చూపినవాడు, నామోక్షకారకుడైన శ్రీకృష్ణునికి వందనము.'
  - type: verse
    id: v117
    no: '117'
    hk: |-
      viSNum vizvavibhum virATa svarUpam vimalApatim virAjam
      vikramam .
      vizvAdhAram vijitAtmAnam vaSaTkAram vanamAlim, namo, zrIkRSNam, muktidam ..
    en: 'Salutations to Sri Krishna, who gives liberation: Vishnu, the lord of all worlds, the cosmic form, the husband of Lakshmi, resplendent with strength and valour, the very support of the universe, the great wrestler of the world, the ruler of the forests.'
    te: 'విష్ణుమూర్తి, అన్నిలోకాలకు ప్రభువు, విరాట్ స్వరూపుడు, లక్ష్మీపతి, బలపరాక్రమాలతో శోభిల్లేవాడు, విశ్వానికే ఆధారభూతుడు, జగజ్జట్టి, వనములకు పాలకుడు, ముక్తినిచ్చే శ్రీకృష్ణునికి నమస్కారము.'
  - type: verse
    id: v118
    no: '118'
    title: nirmalatvam (zrIkRSNapadapIThikA)
    hk: |-
      vaTapatrazAyim vizvAtmAnam aGguSThakrIDAdbhuta lIlAbAlam zrIkRSNam harim zAzvatagm zivamacyutam.
      tam nArAyaNam zrImannArAyaNam ArtatrAyaparAyaNam AdinArAyaNam vande, zrIkRSNam sarvArthadam, me, zrIkRSNa caraNa vilInavaradam ..
    en: "Respectful salutations to Sri Krishna, who gives everything and, at the end of this life, liberation: the little boy who at the time of dissolution floats on the water and delights in sucking the toe of his right foot on a banyan leaf as a child's act, the eternal one who is himself Shiva and Achyuta, who cherishes those who bow to him asking for protection."
    te: 'ప్రళయకాలంలో నీటిపైన త్రేలియాడుతూ, మఱ్ఱి ఆకుమీద తన కుడికాలి బొటనవ్రేలును శిశు చేష్టగా చీకుతూ వినోదించే చిన్ని బాలుడు, శాశ్వతుడు, శివుడు, అచ్యుతుడూ తానైనవాడు, కావుమని మ్రొక్కేవారి నాదరించేవాడు, అన్నీ ఇచ్చి, యీ జన్మాంతంలో కైవల్యమిచ్చే శ్రీకృష్ణునికి నమస్సుమాంజలి.'
  - type: verse
    id: v119
    no: '119'
    hk: |-
      kaLyANakRSNam kamanIyarupam kAma janakam kAmitArthadam
      karuNA kRSNam kRSNasundaram .
      kRSNamAnarakSakam kRSNasArathim ca kRSNagItAcAryam tam zrIkRSNam vande me zrIkRSNakaivalyadam ..
    en: "Salutations to Sri Krishna, who gives me liberation: the auspicious, eye-pleasing beauty (the father of Manmatha), who creates desires and fulfils them, the compassionate one, shining with the colour of a blue cloud, the protector of Draupadi's honour, the charioteer of Arjuna, the giver of the Bhagavad Gita. (The name \"Krishna\" belongs also to Draupadi and Arjuna.)"
    te: 'శుభములనిచ్చే కంటికింపైన రూపసి, (మన్మధుని తండ్రి) కోరికలు పుట్టించి వాటిని తీర్చేవాడు, కరుణామయుడు, నీలిమేఘవర్ణంతో మెరిసేవాడు, ద్రౌపదీ మానరక్షకుడు, అర్జునసారథి, భగవద్గీతా ప్రదాత నాకు మోక్షకారకుడు శ్రీకృష్ణునికి వందనం. (“కృష్ణ” అన్నపేరు ద్రౌపదికీ, అర్జునునికీ కూడ వున్నది.)'
  - type: verse
    id: v120-0
    no: 120 (0)
    hk: |-
      oM zrIlakSmI gaNeza sahita harezrI kRSNAya namaH.
      zrIkRSNa priyopaniSat (navakusumAH)

      (mantramulu "mahA devyaica vidmahe viSNupatnIca dhImIhi" vale paThiJcAli) ("mahA devyaica vidmahe viSNupatnIca dhImIhi" iva)
    en: Om, Salutations to Sri Lakshmi and Ganesha, and to Lord Sri Krishna. Sri Krishna's Beloved Upanishad (Nine blossoms of verse)
    te: ''
  - type: verse
    id: v120
    no: '120'
    hk: |-
      oM kSIra rAjakumArI ca vidmahe kSIra sandrazayana zrIkRSNa manoraJjanIca dhImahI .
      tanno akSaya aizvaryadA sadA zrIkRSNapada sevikA AdilakSmIH pracodayAt ..
    en: "(By the excellent teaching of the guru.) Ksheera Rajakumari: the daughter of the ocean of milk (Lakshmi Devi). Vidmahe: we know (that Mother is the giver of all auspiciousness). She is the embodiment of love who delights the mind of Sri Krishna who reclines on the ocean of milk. Dhimahi: we meditate on this Mother of the universe, who gives endless wealth, the fortunate one who always presses Sri Krishna's feet. Prachodayat: may she keep inspiring us to be people who meditate on Sri Krishna's feet!"
    te: '(ఉత్కృష్టమైన గురూపదేశము వలన) క్షీరరాజకుమారి: పాలసముద్రుని కుమార్తె (లక్ష్మీదేవి) విద్మహే: తెలుసుకొనుచున్నాము (అన్ని శుభములనిచ్చేదే అమ్మయని) యీమె, పాలసముద్రం పై పవళించే శ్రీకృష్ణుని మనస్సును సంతోష పరిచే ప్రేమరూపిణిగా, ధీమహి: ధ్యానించు చున్నాము యీ విశ్వమాత అంతులేని సంపద నిచ్చేది, ఎల్లపుడు శ్రీకృష్ణుని చరణములోత్తుతూన్న భాగ్యశాలిని మమ్ము శ్రీకృష్ణ పదధ్యానమూర్తులుగా ప్రచోదయాత్: ప్రేరేపించుచునే యుండుగాక!'
  - type: verse
    id: v121
    no: '121'
    hk: |-
      oM ramA ramyA zivA hemA ca vidmahe, rAdhA kRSNa rAgarAgiNyai ca dhImahi .
      tanno ramAramaNa caraNa vilIna mArgadarzinIH pracodayAt..
    en: Om, We know Rama, the Beautiful, Shiva, the Golden One; We meditate on Radha, Krishna's passionate beloved; May she who reveals the path of merging into the lotus feet Of the Divine Lover (Rama's Beloved) Always inspire and guide us.
    te: ''
  - type: verse
    id: v122
    no: '122'
    hk: |-
      oM candra vadanAya vidmahe, candrasahodaryaica dhImahi .
      tanno zarazcandrakoTi prabhAsa, zrIkRSNa priyAH zyAmalAH pracodayAt ..
    en: Om, We know the one with a moon-like face; We meditate on the sibling of the moon; May the beloved of Sri Krishna, the dark-complexioned one, Inspire us with the radiance of millions of autumn moons.
    te: ''
  - type: verse
    id: v123
    no: '123'
    hk: |-
      oM zakti svarUpiNyaica vidmahe, bhaktAbhISTa varadAyinI ca dhImahi .
      tanno mukti pradamukunda zrIkRSNa hRdayAnandinIH pracodayAt..
    en: Om, We know the embodiment of Divine Energy; We meditate on the one who grants the desires of devotees; May she who brings joy to Krishna's heart, The bestower of liberation through Mukunda (Krishna), Always inspire and guide us.
    te: ''
  - type: verse
    id: v124
    no: '124'
    hk: |-
      oM sarvamaGgaLAya vidmahe, sarvazubhaparampara kAriNI ca dhImahi.
      tanno sarvasarveza zrIkRSNa sahavAsinIH pracodayAt ..
    en: Om, We know the One who embodies all auspiciousness; We meditate on the supreme creator of all that is blessed; May she who resides alongside Sri Krishna, The mistress of all lords and masters, Always inspire and guide us.
    te: ''
  - type: verse
    id: v125
    no: '125'
    hk: |-
      oM akhilaloka jananIca vidmahe, nikhilaloka zokavinAzinyaica dhImahi.
      tanno akhilANDezvarI apurupA suzlokA kRSNAH pracodayAt..
    en: Om, We know the One who embodies all auspiciousness; We meditate on the supreme creator of all that is blessed; May she who resides alongside Sri Krishna, The mistress of all lords and masters, Always inspire and guide us.
    te: ''
  - type: verse
    id: v126
    no: '126'
    hk: |-
      oM vidyAnAmna virAjitAya vidmahe vizvezvari vimalAdevyaica dhImahi.
      tanno vaiSNavI, kRSNaveNI, vANI, nArAyaNIH pracodayAt..
    en: Om, We know the one who is resplendent among all knowledge; We meditate on the immaculate Universal Goddess; May the Vaishnavi (Divine Feminine Principle), The companion of Krishna, The sacred voice of Narayana, Always inspire and guide us.
    te: ''
  - type: verse
    id: v127
    no: '127'
    hk: |-
      oM aSTavidhalakSmIH zca vidmahe, aSTaizvaryadAyinI zrI mahAlakSmI ca dhImahi .
      tanno aSTakaSTAdi sarvasaGkaTahAriNI zrIkRSNa ramaNIH pracodayAt..
    en: Om, We know Lakshmi who appears in 8 avataras; We meditate on Sri Mahalakshmi, the bestower of eight types of prosperity; May she who removes all obstacles and difficulties, The beloved of Sri Krishna, Always inspire and guide us.
    te: ''
  - type: verse
    id: v128
    no: '128'
    hk: |-
      oM gAyatri sAvitrI sarasvatI rupi sandhyA devyai ca vidmahe, mayA upAsitAdityAntargata tejazrI ca dhImahi .
      tanno zrIkRSNa hAsaharSitA zAntA mokSalakSmIH pracodayAta..
    en: Om, We know the form of Gayatri, Savitri, and Saraswati; We meditate on the Sandhya Goddess, whose radiant essence Is contained within the inner light of the Sun; May the serene Moksha Lakshmi, who delights in Krishna's smile, Always inspire and guide us.
    te: ''
  - type: section
    id: s03
    hk: namovAkam
    en: Obeisance
  - type: verse
    id: v129
    no: '129'
    hk: |-
      oM sarvAntaryAmi zrIhari iti vidmahe, sarvadhara sarvAdhAra sarvavarada zrImannArAyaNAya dhImahi .
      tanno devAdi deva mokSaprada zrIdhara zrIkRSNaH pracodayAt..
    en: ''
    te: ''
  - type: verse
    id: v130
    no: '130'
    hk: |-
      oM namo kRSNa namokRSNa zrIkRSNa kRSNa hare hare ..
      ..
      zrIkRSNa prasAdam..
      ..
      sarvam zrIkRSNArpaNamastu ..
      ..
      hariH oM tatsat..
    en: Om, Salutations to Krishna; Salutations again to Krishna; Sri Krishna, Krishna, Hari, Hari Sri Krishna's Grace May everything be offered to Sri Krishna Hari Om, That is the Truth.
    te: ''
  - type: section
    id: s04
    hk: 'puruSottamapadadhyAnam :'
    en: Meditation on the supreme state (or abode) of the Purushottama
  - type: verse
    id: v131
    no: '131'
    hk: |-
      zrIkRSNAya vAstupuMsAya, gRhAdhidevAya, vande,sarvAnugrahakArakAyaca.
      kurumamagRhalakSmI nilayam, zrIkRSNa hRdaya nandanam, sadA zAnti saubhAgya zobhitam ..
    en: O Lord Sri Krishna! As Vastu Purusha you are the chief God of the house, and you bless in every way. Look on our house with kindness and make it a dwelling of Lakshmi, always shining with peace and prosperity, so that we may live in a way that pleases Sri Krishna's mind. Salutations to you.
    te: 'హే శ్రీకృష్ణదేవా! వాస్తు పురుషరూపంగా ఇంటికి ప్రధానదైవము, అన్ని విధాలా అనుగ్రహిస్తావు. లక్ష్మీనిలయముగా, ఎల్లపుడు శాంతి సౌభాగ్యాలతో శోభిల్లేటట్టుగా శ్రీకృష్ణుని మనస్సు హర్షించేటట్టుమేము ఉండగలిగేటట్లు, మా ఇంటిని చల్లగా చూడు, తయారు చెయ్యి. నీకు వందనం.'
  - type: verse
    id: v132
    no: '132'
    hk: |-
      tejassarojam zrIkRSNa prasAditam zrIkRSNa bhaktilaharIlAsyamaGgaLArAmam.
      tejazrI kRSNavAsam, bhavam, megRha, zrIkRSNahAsa prakAzamAnandadhAmam ..
    en: This house is like a bright lotus, an auspicious abode bathed in the stream of devotion to Sri Krishna, where Lakshmi and Sri Krishna always remain; Sri Krishna has graciously given this house (where we live) as a mass of his sweet smiles and joys. Lord Sri Krishna has blessed us.
    te: 'ప్రకాశవంతమైన తామరపుష్పంలా, శ్రీకృష్ణుని భక్తి ప్రవాహంలో ఓలలాడే శుభనివాసం, లక్ష్మీ శ్రీకృష్ణులు ఎల్లపుడు నిలిచేటట్లు, శ్రీకృష్ణుని మధురమైన చిరునవ్వుల సంతోషాల ప్రోగుగా శ్రీకృష్ణులు అనుగ్రహించి ప్రసాదించినదీ ఇల్లు (మేము కాపురముండేది). ధన్యులను చేసినారు శ్రీకృష్ణవిభులు.'
  - type: section
    id: s05
    hk: vandanam vAsudeva zrIkRSNAya
    en: I bow down to Vasudeva Sri Krishna
  - type: verse
    id: v133
    no: '133'
    hk: |-
      zrIkRSNa nAma gAnam karomi punaH punaH .
      zrIkRSNa lIlAsmaraNam karomi punaH punaH .
      zrIkRSNabhaktasahavAsam karomi punaH punaH .
      zrIkRSNa padadhyAnam AjanmAntam karomi punaH punaH ..
    en: I sing Sri Krishna's many names again and again! I remember Sri Krishna's mischievous acts and the wonders he did effortlessly, again and again! Living with Sri Krishna's devotees, I meditate on Sri Krishna's feet all my life, again and again! I live in the bliss of Sri Krishna, leaping and leaping!
    te: 'శ్రీ కృష్ణుని పలునామాలు పాడుకుంటాను మళ్ళీ మళ్ళీ! శ్రీ కృష్ణుని చిలిపి చేష్టలు, అవలీలగా చేసిన అద్భుతములు తలచుకొంటాను మళ్ళీ మళ్ళీ! శ్రీ కృష్ణుని భక్తులతో కలిసి జీవినూ శ్రీ కృష్ణుని చరణములను యీజన్మంతా ధ్యానిస్తూంటాను మళ్ళీ మళ్ళీ! శ్రీ కృష్ణానందమయంగా బ్రతుకుతుంటాను తృళ్ళీ తృళ్లీ!!'
  - type: verse
    id: v134
    no: '134'
    hk: |-
      vande mAtaram pitaram agrajassarvam jyeSTham zreSTham vande .
      vande, asmat gurum zrIkRSNa padadhyAna kArakam .
      vande, vizvaguram zrIkRSNam karuNAmayam, vande .
      vande sadAlIlAkRSNam, sarvadam, asmat janmAnte mama zrIkRSNa kaivalyadam ..
    en: Salutations to our parents who gave us birth; to Rukmini, Radha and Krishna, the parents of the universe; to all the noble ones born before us; to the teacher who turned my mind, which was leaping about in vexation, toward meditation on Sri Krishna's feet; to Sri Krishna, the teacher of all the worlds, the compassionate one who always delights in his divine plays, the endlessly merciful Vasudeva Sri Krishna.
    te: 'మాకు జన్మనిచ్చిన తల్లి దండ్రులకు, విశ్వజననీ జనకులు రుక్మిణీ రాధాకృష్ణులకు మాకంటే ముందు జన్మించిన ఉత్తములైన వారందరికీ, శ్రీ కృష్ణపద ధ్యానం వైపు, చికాకులతో చిందులు త్రొక్కే నామనస్సును మళ్ళించిన గురుదేవులకు, అన్నిలోకాలకు గురువైన శ్రీ కృష్ణులకు, కరుణా మయుడైన, ఎపుడూ చిద్విలాసాలతో వినోదించే వారికి, అనంత దయామయుడైన వాసుదేవ శ్రీ కృష్ణునికి ప్రణామము.'
  - type: verse
    id: u1
    no: ''
    title: manavi
    hk: |-
      cinmayAnanda zrIkRSNulu anugrahiJci tAnupaliki, yI
      ceta vrAyiJci nannu tarimpacesitiri.
    en: 'My prayer: May Sri Krishna, the embodiment of conscious bliss, bless me and, through His grace, write with this hand and carry me across (liberate me)'
    te: ''
  - type: verse
    id: u2
    no: ''
    hk: |-
      oM zrI mahAgaNAdhipataye namaH
      oM zrI rAma zrI kRSNa parabrahmaNe namaH
      zrI zrI zrI kRSNa - dAsa samvAdam
    en: |-
      Om, salutations to Sri Maha Ganadhipati (the great Lord of the Ganas, Ganesha)
      Om, salutations to Sri Rama, Sri Krishna, the Supreme Brahman
      This is the sacred dialogue between Sri Krishna,
      the infinite Lord of compassion,
      and his humble devotee, the servant who surrenders in love
    te: ''
  - type: verse
    id: v135A
    no: 135A
    hk: |-
      oM.. tailAbhyaGgana, saugandha, zobhita zubhAGgam, divya dhavaLa vastrAbharaNa zikhipiJchadharam .
      janmadivase mAtRvAtsalya pUrvaka, samarpita, svAdhiSTha bhojana, santuSTa varSa traya bAlakam.
      jananI hastasthita, hrasvasthUla zarIra zrIkRSNam pazya parihAsam karomiti - he pInakAya kRSNa .
      zlAghanIya .
      sthiraciruhAsavadana, zrI bhagavAnuvAca - pathavihIna arbhaka .
      tavarakSaNArtham sadA laGghanodyuktoham..
    en: 'With oil massage, fragrant, adorned with auspicious limbs, wearing divine white garments and a peacock feather crown. On his birthday, with maternal affection, the mother offers him his favorite food, satisfied with her three-year-old child. Holding him in her hands, seeing his short and stout body, Sri Krishna with a playful smile, says: "O plump Krishna, you are praiseworthy!" The blessed Lord responds: "O helpless child, I am always prepared to protect you."'
    te: ''
  - type: section
    id: s06
    hk: mamAparAdhakSamAkrozaH
    en: My cry (plea) for forgiveness of offenses
  - type: verse
    id: v136
    no: '136'
    hk: |-
      ariSadvargam mamAzritam, ahamkArAgrahapUritasvabhAvam .
      paranindAtmastutyAcaraNam, asatyamaya vAcAlatvam sarva sanmArgarahitam ca, svalpadaivacintana jIvanam.
      nAham kSamArhOpi, tvamananta dayAmaya deva iti, kSama .
      kSama .
      karuNA kRSNa .
      rakSa .
      rakSa .
      zrIrAdhAkRSNa ..
      - dehime, abhayam, aparAdhakSama, asmajanmAnte, tavazrIcaraNa sAyujyam , zrIkRSNAnandamayam, zAzvatam .
    en: "Desire, anger, greed, delusion, pride and jealousy always cling to me. My nature is full of arrogance and excessive anger. I blame others and praise myself. I am an anthill of lies, and I am in the habit of talking too much. In whatever way you look, there is no good conduct in me. I remember God very little and spend my life as I please. I am not at all worthy of being forgiven. Even so, O Lord Sri Krishna, since you are a God full of endless compassion, with the nature of forgiving any sinner, forgive me. Protect me, O Lord Radha-Krishna! Take away my fear. Forgive all my faults and destroy my sin. At the end of this life, that is, the moment I die, cancel the world of Yama, punishments and so on, merge me into your feet, and let me always meditate on you and remain immersed in endless joy."
    te: 'కామ, క్రోధ, లోభ, మోహ, మద, మాత్సర్యాలు నన్నెపుడూ అంటి పెట్టుకునే వుంటాయి. దురహంకారము, అతికోపము నిండిన స్వభావము. ఇతరులను నిందిస్తూ నన్ను నేను పొగుడుకుంటూంటాను. అబద్ధాల పుట్టగా, అతివాగుడు అలవాటు. ఏవిధంగా చూసినా మంచి ప్రవర్తన లేదు. చాలా తక్కువగా భగవంతుణ్ణి తలుస్తూ జీవితం ఇష్టం వచ్చినట్లు గడిపేస్తూంటా. నేను ఎంత మాత్రం మన్నింపబడటాన్కి అర్హుణ్ణి కాదు. అయినా సరే, హే శ్రీ కృష్ణ విభో! నీవు అంతులేని కరుణతో నిండిన దైవము కనుక, ఎటువంటి పాపి నైన మన్నించే నైజం కలవాడివిగా, నన్ను క్షమించు. రక్షించు, ఓ రాధాకృష్ణదేవా! నాకు భయం పొగొట్టు. అన్ని తప్పుల్నీ మన్నించి పాపం నశింపజేయి. యీ జన్మాంతంలో, అంటే చనిపోయిన తక్షణం యమలోకం, శిక్షలు వగైరాలు రద్దుచేసి, శ్రీ చరణాలలో కలిపేసుకుని, ఎపుడూ నిన్ను ధ్యానించి, అంతులేని ఆనందంలో మునిగా వుండేలా చెయ్యి.'
  - type: verse
    id: v137
    no: '137'
    hk: |-
      oM zrI saurabharamyavarNa, suma, kisalaya latApariSvaGgA zvattha mUlasthitam .
      tacchayAcchAdi tavinA grISmatApa tejomayam prazAnta vadanam.
      vanavihAra gopAlam, muraLI nAdAmRtAnandapradam vizvamohanam.
      bhaktahRdayastham, rAdhezam, jagadrakSakam, vande me zrIkRSNam, kaivalyadam .
    en: "Salutations to Sri Krishna, who gives me liberation: he who stands at the foot of a peepal tree wound about with beautifully coloured, fragrant flowers and creepers of tender shoots, of limitless radiance, who feels no heat of summer because of that tree's shade, whose forehead shows a joyful mind free of any sorrow; the cowherd who roams in forest flower gardens, who gives joy and enchants all worlds with the music of his wonderful divine flute, who lives in the minds of devotees, Radhanatha, the protector of the universe."
    te: 'అందమైన రంగు, సువాసనగల పూలతో, లేతచిగుళ్ళ తీగలతో, చుట్టుకున్న మ్రానుగల రావిచెట్టు మొదట నిల్చినవాడు, ఆచెట్టు నీడవల్ల వేసంగి ఎండబాధ లేకున్న అపరిమిత కాంతివంతుడు, ఏ వ్యధలు లేని ఆనందభావనగలనుదురు, అడవి పూల తోటలలో విహరించే ఆవుల కాపరి, తన అద్భుతమైన దివ్య వేణువు గానంతో ఆనందం ఇచ్చి అన్ని లోకాలనూ సమ్మోహన పరచేవాడు, భక్తుల మనస్సులలో మనుగడ, రాధానాథుడు, విశ్వమును రక్షించే వాడు అగు, నాకు మోక్షమొసగే శ్రీకృష్ణునికి నమస్కారం.'
  - type: verse
    id: v138
    no: '138'
    hk: |-
      sadAzivArAdhakam, sadAzivArAdhitam, sazivasvarupam, sadAziva svabhAvam.
      sadA zivAnandarAmam, sadA zivam ca viSNum, sadAzrita ssarvadam.
      sahasrassahasrassahasrAm sarazzirAzim, sahasra zIrarSam, sahasrAkSam, tam.
      sadAdhyAyAmi, yogezvaram, sarvadevezvaram, sadAdhyanezvaram zrIkRSNam, sadgurum, zrIkRSNa sAyujyadam .
    en: 'Salutations to Sri Krishna, the excellent guru, and to the one who desires liberation and gives it to me: who always worships Shiva and is worshipped by Shiva, whose way is to look on all alike, who always gives joy, who as Shiva and as Vishnu gives everything to all who take refuge, the Sun, a mass of light shining with thousands upon thousands of rays, Yogeshwara with a thousand heads and eyes, the lord of all the gods, the presiding deity of the method of meditation.'
    te: 'ఎపుడూ శివుని పూజించే, శివునిచే పూజింపబడే, అందర్నీ సమంగా చూసే పద్ధతి, ఎపుడూ ఆనందం కలిగించే, ఆశ్రయించిన వారందరికీ అన్నీ ఇచ్చే శివుడు, విష్ణువు, వేలవేల కిరణాలతో విరాజిల్లే వెలుగు ప్రోగుల సూర్యుడు, వేయి తలలు, కన్నులు గల యోగేశ్వరుడు, అందరి దేముళ్ళకు నాథుడు, ధ్యాన విధానమునకు అధిష్ఠానదైవము, ఉత్తమగురవు-శ్రీకృష్ణునికి, నాకు ముక్తినిచ్చే ముముక్షువుకు నమోవాకాలు.'
  - type: verse
    id: v139
    no: '139'
    hk: |-
      nityasatyatatva zrI kRSNamitrAbhilASiraham, nirantara dhyAnAnandasahitam .
      satyadevasAyajyada zrI kRSNa zaraNAzritam, sarvam zrIkRSNAnujJayA ..
      - svalambhavam mamazeSajIvitam, sulabham zrI kRSNa zaraNyapatha gamanam .
      sampUrNArogya pUritam ca, sarvesarvadA zrI kRSNa dhyAnabharitam .
      pAhi .
      pAhi .
      caGgalvadhAri .
      karuNAmaya, vizvarupa, zrI kRSNavAsudeva .
      muktiprada .
      dehi,me, asmat janmAnte zrI kRSNa caraNazAzvata sAyujyam..
    en: |-
      I seek only the friendship of Sri Krishna, whose nature is always truth. Along with the divine bliss that arises from unhindered meditation, I have begged for the shelter of Sri Krishna, the true God who gives liberation; all this is with Sri Krishna's permission. May the rest of my life be very short! May I travel the path of taking refuge in Sri Krishna without much effort! May I pass my time without any disease or trouble, always immersed in meditation on Sri Krishna! O wearer of a garland of kalhara flowers! Ocean of compassion! Son of Vasudeva who shines in the cosmic form! Giver of liberation! Sri Krishna! After I die, without any delay, merge me immediately into your sacred feet, and bless me to be always full of joy, without the trouble of being born again and dying again. Protect me! I have placed my trust in you alone, according to your command and your grace.
    te: 'ఎల్లపుడూ సత్యమే స్వభావస్వరూపముగా గల శ్రీ కృష్ణునిదే స్నేహం కోరుకుంటా. అడ్డూ అదుపులేని ధ్యానమువల్ల కలిగే దివ్యానందంతో సహా, నిజమైన భగవంతుడు కైవల్యమిచ్చే శ్రీకృష్ణుని ఆశ్రయాన్ని యాచించా - ఇదంతా శ్రీకృష్ణుని అనుమతితోనే. నా మిగిలిన జీవితం చాలా తక్కువగుగాక! ఎక్కువ శ్రమ లేకుండా శ్రీకృష్ణుని ఆశ్రయించే మార్గంలో ప్రయాణింతును గాక! ఏ రోగం, రొచ్చు లేకుండా కాలక్షేపం చేస్తూ, ఎపుడూ శ్రీ కృష్ణుని ధ్యానంలో మునిగివుందును గాక! చంగల్వ పూలదండ ధరించిన వాడా! దయానముద్రుడా! విశ్వరూపంతో విలసిల్లే వసుదేవునికుమారా! ముక్తిని అనుగ్రహించే వాడా! శ్రీకృష్ణా! నేను చనిపోయిన అనంతరం ఎట్టి జాప్యం లేకుండా తక్షణం నీ శ్రీపాదములలో విలీనం చేసుకుని, తిరిగి, పుట్టి, చచ్చు రొచ్చు లేని విధంగా ఎల్లపుడూ ఆనందంతో నిండివుండేలా అనుగ్రహించు. కాచి రక్షించు! నిన్నే నమ్ముకున్నాను - నీ ఆజ్ఞానుసారం, నీ అనుగ్రహప్రకారం'
  - type: section
    id: s07
    hk: zrIkRSNamokSanandamayam
    en: Sri Krishna, who is liberation itself and filled with bliss
  - type: verse
    id: v140
    no: '140'
    title: zrIkRSNanivAsasthAnam
    hk: |-
      oM.. vasati, nahinahi, goloke, kapaTakarmiSThinAm, hRdayenica.
      nijabhaktAyatra, zrIkRSNa nAmAni gAyanti, tathyam, tatra zrIkRSNatiSThati ..
    en: Sri Krishna is not in Goloka, the abode of joy above all the worlds, nor in the minds of false worshippers. Wherever devotees sing praising him by name, there, truly, the blue-eyed one, the abode of joy, Sri Krishna, always remains firmly.
    te: 'అన్ని లోకాలకన్న పైన, ఆనందనిలయమైన గోలోకంలో కాని, దొంగ ఆరాధకుల మనస్సులలో కాని, శ్రీకృష్ణుడు వుండడు. ఎక్కడెక్కడ తనను పేరుపేరునా స్తోత్రం చేస్తూ భక్తులు పాడుకుంటూంటారో, అక్కడ నిక్కముగా, నీలనయన, ఆనంద ధామ, శ్రీకృష్ణులు ఎల్లపుడూ స్థిరంగా వుంటారు.'
  - type: verse
    id: v141
    no: '141'
    title: zrI zrI kRSNa tatvAvagataH (mantram -nArAyaNAya vidmahe)
    hk: |-
      oM tatvasvarUpAya vidmahe, tulasImAlAdharAya dhImahi,
      tannotejomaya, zrIkRSNaH pracodayAt..
    en: I pray (meditate) with a single mind to the one who is the very form of truth, known through the path of devotion, wearing a garland of tulsi. May Kamalavati and Sri Krishna, that mass of light, keep inspiring my meditation on them!
    te: 'తత్వము యొక్క ఆకారమైనవారిని, భక్తి మార్గంలో తెలుసుకుని, తులసీ దండమెడలో వున్నవారిని ఏకాగ్రచిత్తంతో ప్రార్థిస్తూ (ధ్యానిస్తూ) న్నాను. ఆకాంతివుంజమైన కమలావతి శ్రీకృష్ణులు వారిపైని నాధ్యానమును నదా ప్రేరేపించుచునేయుందురు గాక!'
  - type: verse
    id: v142
    no: '142'
    title: zrIkRSNAmRta bIjAkSarI (bhajana kIrtana)
    hk: |-
      kRSNam kRSNam tejokRSNam zauryakRSNam kRSNam kRSNam.
      kRSNam kRSNam zizukRSNam satyakRSNam kRSNam kRSNam.
      kRSNam kRSNam bAlakRSNam lIlAkRSNam kRSNam kRSNam.
      kRSNam kRSNam bRndAkRSNam gopakRSNam kRSNam kRSNam.
      kRSNam kRSNam rAgakRSNam krIDAkRSNam kRSNam kRSNam.
      kRSNam kRSNam ramyakRSNam vamzIkRSNam kRSNam kRSNam.
      kRSNam kRSNam gItAkRSNam dhyAnakRSNam kRSNam kRSNam.
      kRSNam kRSNam rAmakRSNam rAdhAkRSNam kRSNam kRSNam.


      kRSNam kRSNam mohana kRSNam muraLIkRSNam kRSNam tANdava kRSNam zrIkRSNam .
      kRSNam kRSNam vandekRSNam kRSNam kRSNam karuNAkRSNam sAyujyadam zrI kRSNam ..
      namAmi nityam tam zrI kRSNam me kaivalyadam..
    en: "A song composed with Sri Krishna's many names; free singing: after the worship of Sri Krishna, salutations to him."
    te: 'శ్రీ కృష్ణుని పలునామాలతో కూర్చిన గీతిక; స్వేచ్ఛా గానం: శ్రీకృష్ణ భజన తర్వాత, వారికి నమస్కారములు.'
  - type: verse
    id: v143
    no: '143'
    title: zrIkRSNAnandAmRtamayam
    hk: |-
      tRptAnandam, nityAnandam, tapAnandam, AtmAnandam .
      vidyAnandam, vijJAnAnandam, jJAnAnandam, gurvAnandam, pUrNAnandam, vedAnandam, devAnandam, brahmAnandam, cidAnandam, sarvAnandam, satyAnandam, viSNvAnandam .
      sadAnandam, cinmayAnandam, paramAnandam, zivAnandam, karmAnandam raktyAnandam, lakSmyAnandam, sukhAnandam .
      bhogAnandam, bhAgyAnandam, dharmAnandam, gRhAnandam .
      dhyAnAnandam nAmagAnAnandam, zrI zrIkRSNa bhaktAnandam, mokSAnandam ..
      sRSTyAnandam, pAlanAnandam, layAnandam, jagatsarvam zrIkRSNAnanda mandiram .
      yogAnandam, saccidAnandam, tatsarvam zrI kRSNAnandAmRtamayam ..
    en: |-
      The experience of joy from contentment is always happiness! What comes from penance is the rapture of knowing the Supreme Self within. Satisfaction from learning, the rapture of grasping the essence of learning, the ease of discerning right from wrong, the teacher's satisfaction that comes only from teaching worthy disciples! Contentment without any lack comes from reciting the Vedas; knowledge of Brahman comes from understanding the nature of God; delight of mind; and looking at everything, the feeling that even Sri Maha Vishnu rejoices because of upholding truth. Always inquiry, the joy that comes with excellent practice, the great joy that comes in understanding the nature of Shiva. The householder rejoices through performing actions, through love and affection, through achieving what he wanted, through pleasures that give comfort, through wealth, and through performing prescribed duties. Through meditation he attains liberation (by various names) and gains endless joy. In the sustaining of creation and in wiping everything out at dissolution, in all the changes that take place in the universe, joy is blended through all of it. The bliss of Sri Krishna, which is like a temple: that is, the world itself is an abode of joy. What is hidden in yoga, the combination of purity and truth, a different form of joy: all of these are filled with the nectar of joy given by Sri Krishna.
    te: 'తృప్తి వల్ల వచ్చే సంతోషపు అనుభవం, ఎపుడూ ఆనందమే! తపస్సు వల్ల కలిగేది తనలోని, పరమాత్మను తెలుసుకున్న పరవశం! చదువువల్ల సంతనము, చదువుల సారము గ్రహించిన పరవశత, తప్పొప్పుల గ్రహింపుతో హాయి, సరియైన శిష్యులకు విద్య బోధన వల్లే కల్గే గురువుగారి సంతనము! ఏ తక్కువ లేని తృప్తి, వేద పఠనం వల్ల వచ్చేది, దైవతత్వము అర్ధమగుట వల్ల కలిగే బ్రహ్మజ్ఞానము, మనస్సునకు ఉల్లాసము, అంతటాచూస్తే, సత్యపాలన వల్ల శ్రీ మహావిష్ణువుకే, మురిసిపాయే భావం: ఎపుడూ, జిజ్ఞాస, ఉత్కృష్టమైన సాధనతో కలిగే ఆనందం శివతత్వము అర్ధమగుటలో వచ్చిన మహాసంతోషము. కర్మలు చేయటం వల్ల, ప్రేమానురాగాల వల్ల, అనుకున్నది సాధించటం వల్ల, వచ్చేది సుఖంకలిగించే ఆనంధం సౌఖ్యాల వల్ల, ఐశ్వర్యాల వల్ల, విధితధర్మం ఆచరించటం వల్ల గృహస్థుడు ఆనందిస్తాడు.ధ్యానం చేయటం వల్ల, (వివిధ పేర్లతో) మోక్షముసాధించి, అంతులేని ఆనందం పొందుతాడు - సృష్టిలా పరిపాలనలో, ప్రళయంతో మొత్తం తుడిచిపెట్టెయ్యడంలో - అన్నిజగత్తులో జరిగే పరిమణామాలే - వీటన్నిటిలో కలబోసి ఉన్నది ఆనందం - ఒక మందిరంగాగల శ్రీ కృష్ణానందం- అంటే, లోకమే ఒక ఆనందపునిలయం. యోగంలో నిబిడీకృతమైనది, శౌచిత్వము సత్యముల సముదాయ మొక ఆనంద విభిన్న రూపము ఇవన్నీ కూడ శ్రీ కృష్ణుని ప్రసాదితము గాగల ఆనందపు అమృతముతో నిండివున్నది.'
  - type: section
    id: s08
    hk: zrIkRSNa kRpAdhArAmRtam
    en: The nectar-like stream of Sri Krishna's compassion
  - type: verse
    id: v144
    no: '144'
    hk: |-
      oM zrI padmalocanam, padmasundaram, padminI prANezam zrIkRSNam.
      paramadayALum, ca, parandhAmam, praNamAmi, me, paramapadam, zrI zrI kRSNam ..
      sadAzivArAdhakam, sadAzivArAdhitam, sadAzivAnandarAmam, sadAzivam ca viSNum sadAbhaktassarvadam.
      sahasrassahasrAm sarazzirAzim .
      sahasrazIrSam sahasrAkSam, tam, sadAdhAyAmi me zrI kRSNam, sAyujyadam ..
    en: 'Salutations to Sri Krishna, who grants an eternal abode in that supreme Sri Krishna Goloka: lotus-eyed, beautiful, the husband of Lakshmi Devi who was born in a lotus, of endless compassion, the Supreme Abode. (The meaning of the remaining part is given in song 138.)'
    te: 'తామరపూవు వంటి సుందర మైనకనులు, సౌందర్యం, పద్మములో జన్మించిన లక్ష్మీదేవి భర్త, అనంతకరుణామయుడు, పరంధాముడు, ఆ అత్యున్నతమైన శ్రీ కృష్ణగోలోకమునశాశ్వతనివాస మొసగే, శ్రీకృష్ణునికి వందనం (మిగిలిన భాగమునకు భావము 138 గీతక లో ఇవ్వబడినది)'
  - type: verse
    id: v145
    no: '145'
    hk: |-
      zrI kRSNa mandasmita mukhaprakAzamananta koTi zazi prabhasamAnam .
      zrI kRSNa hastazthita navanItagoLam vizAla vizvAdhika dhanyamUrtiH
      zrI kRSNa karAravindastha muraLI svaram madhuram, vizvamohanakaram .
      zrI kRSNa bAlalIlAvinodam, yazodAnandamayam ca, jagatpramodakam ..
      nityam namAmi niratamArAdhayAmi, satatam smarAmi sadA dhyAyAmi me hRdayastham, dayALu, zrI kRSNam, mamasAyujyadam ..
      zrI kRSNa dhyAnam muktipradam, zrI kRSNanAmagAnam mokSakaram zrI kRSNakathA zravaNam sAyujyadam .
    en: "The smiling face of little Sri Krishna outshines endless crores of moons, and the ball of butter in his hand: in the vast universe it is the luckiest, because it has reached his hand, and he will eat it! The sound of the flute in Sri Krishna's hand is very sweet and enchants all the worlds. Sri Krishna's childhood pranks delighted Yashoda and cause joy to all the worlds. Every day I bow, constantly worship, always meditate and remember Sri Krishna, the merciful Lord in my heart, who gives me liberation. Meditating on Sri Krishna, praising him by his many names, and listening to stories made of his plays and glories: all these can give liberation!"
    te: 'చిరునవ్వు చిందించే చిన్నారి శ్రీకృష్ణుని మోము అంతులేనికోటానుకోట్ల చంద్రుల సాగను, వారిచేతిలోనున్న వెన్న ముద్ద, విశాల జగత్తులో నే చాలా అదృష్టవంతురాలు - ఎందువల్లనంటే, వారి చేతజేరింది, వారు అరగిస్తారు! శ్రీకృష్ణుచేత వేణువుధ్వని అతితీపి, లోకాలన్నిటినీ సమ్మోహింపజేస్తుంది. శ్రీకృష్ణునిచిన్న తనపుచిలిపి చేష్టలు యశోదనుమురిపించి, అన్నిలోకాలకు సంతోషకారణము ప్రతిరోజు నమస్కరిస్తున్నా - నిరంతరం పూజిస్తున్నా, ఎపుడూ ధ్యానంచేస్తున్నా, జ్ఞప్తిచేసుకుంటున్నా, నాహృదయంలోని, కనికరించే స్వామి నాకు కైవల్యమిచ్చే శ్రీకృష్ణుని. శ్రీకృష్ణుని ధ్యానం, శ్రీకృష్ణుని పలునామలతో స్తోత్రంచెయ్యటం, వారిలీలలతో, మహత్తులతో కూర్చిన కథలు వినటం, ఇవన్నీ మోక్షంఇవ్వగలిగేవే!'
  - type: verse
    id: v146
    no: '146'
    title: zrIkRSNa mokSAmRtAkSari
    hk: |-
      zrIkRSNam vande, me mokSadam ..
      he zrI kRSNa .
      mokSa bhikSAndehi ..
      hare zrI kRSNa .
      mokSam dehi .
    en: Salutations to Sri Krishna, who gives me liberation. O Sri Krishna! Free me, free me! Sri Krishna, remover of sins! Grant liberation!
    te: 'నాకు మోక్షమిచ్చే శ్రీకృష్ణునికి నమస్కారం. ఓ శ్రీకృష్ణా! ముక్తి నినాకుముక్తి గావెయ్యి. పాపహారి శ్రీకృష్ణా ! కైవల్యమిమ్మా!'
  - type: verse
    id: v147
    no: '147'
    title: zrI kRSNa mAnasika darzanam
    hk: |-
      zrI kRSNam manasAdarzayAmi.
      zrI kRSNamanodarzanam divyAnandakaram, anantam, anirvacanIyam, adbhutam.

      zrI kRSNadarzanAnandastotram :
      trimUrtyaika rupAya, triguNAtIta devAya, trivikramAya devadevezvarAya - namonamaH maGgaLam .
      dazAvatAra dharAya, dazakaNTha harAya, dAzarathAya, vizvavaradAya, zrI rAmacandrAya - namonamaH maGgaLam.
      vizvezAya, vizvavaradAya, vizvavyAptAya, vizvarUpAya vAsudevAya, zrI rAdhezAya, rukmiNI prANezAya namo namaH maGgaLam .
      sadAzritavatsalAya sadAzivAya, yazodAnandakRSTAya sampUrNAvatArAya, mamazrI zrIkRSNA divyadarzanapradAya, zrI zrI kRSNasAyujyadAya mama, zrI zrI kRSNa AnandamUrtaye namo namo namaH maGgaLam - hare zrI kRSNa .
      mokSam dehI.
    en: I am able to see Sri Krishna with the mind. By his grace this experience is unprecedented, wonderful, a great delight, and gives endless joy that cannot be put into words. In the joy of seeing him, I praise Lord Sri Krishna in this way. You whose form is the union of Brahma, Vishnu and Shiva! God of gods whom sattva, rajas and tamas cannot approach! Incomparable hero in the three worlds! Salutations! Victory! You who took ten incarnations! Rama who slew the ten-headed Ravana! You who grant everything asked to the people of all worlds! Salutations! Victory! You who rule all the worlds! Giver of all boons! Cosmic form who is hidden within all worlds! Son of Vasudeva! Radhanatha! Husband of Rukmini! Sri Krishna! Salutations! Victory! You who always show kindness to those who take refuge in you, who look on all alike, who delight Yashoda, the complete incarnation, the best of the best of men! My beloved God, who granted me your divine vision and who will merge me into yourself forever! God of gods, joy incarnate! Salutations! Victory, victory! Om Sri Krishna! Grant me liberation!
    te: 'శ్రీకృష్ణునిమనస్సుతో చూడగలుగుతున్నాను - వారి అనుగ్రహ వల్ల యీఅనుభవం అపూర్వం, అద్భుతం, మహాసంతోష కారి, మాటలలో చెప్పలేని అంతము ఎరుగని ఆనందం కల్గిస్తుంది. వారిని చూసిన ఆనందంతో, శ్రీకృష్ణ భగవానుని, యీవిధంగా స్తోత్రం చేస్తున్నాను. బ్రహ్మ విష్ణుశివుల సమైక్యమైన ఆకారము గలవాడా! సత్వ, రజస్త మోగుణములు దరిచేరరాని దేవాది దేవా! ముల్లో కాలలో నూసాటిలేని శూరుడా! నమస్కారం! జయమగుగాక! పదిఅవతరాలెత్తిన వాడా! పది తలలరావణుని పరిమార్చినరామా! అన్నిలోకాలలోని వారికీ కోరినవన్నీ ఒసగేవాడా! నమస్కారం జయమగుగాక! అన్నిలోకాలకు పరిపాలకు డా! అన్నివరాలిచ్చేవాడా! అన్నిలోకాలలో,నిబిడీకృతమైన, విశ్వరూపుడా! వసుదేవుని పుత్రుడా! రాధానాధా! రుక్మిణి పతీ! శ్రీకృష్ణా! నమస్కారం జయమగుగాక! ఎపుడూ నిన్నాశ్రయించిన వారి మీద దయచూపే, నమంగా చూసే, యశోదకు సంతోషకారి, పరిపూర్ణ మైనపురుషోత్తమోత్తమ అవతారా! నాకు నీదివ్య దర్శనం ప్రసాదించిన, శాశ్వతంగా నీలోకలుపుకునే, నాఆరాధ్యదైవమా! ఆనందము మూర్తీభవించిన దేవదేవా! నమస్కారం జయం జయం, ఓం శ్రీకృష్ణా!నాకు ముక్తినిమ్ముసుమా!'
  - type: verse
    id: v148
    no: '148'
    title: jayamaGgaLa bharatAvAkyam
    hk: 'maGgaLam jaya maGgaLam sarvamaGgaLam vizvajayamaGgaLam ..'
    en: Victory, victory, completely! May there be victory at all times, for everyone, everywhere, for the dwellers of all worlds!
    te: 'జయం జయం పూర్తిగా! అన్నిటా అందరికీ అన్నివేళలా అన్నిలోకాలవాసులకూ జయమగుగాక!'
  - type: section
    id: s09
    hk: 'zrIkRSNa dhyAnaphalitam:'
    en: The fruit (result) of meditating on Sri Krishna
  - type: verse
    id: v149
    no: '149'
    hk: |-
      etatsarvam zrI kRSNAjJAnusAram zrI kRSNAnugraha prasAdam .
      zrI kRSNa lIlAgItA ssarvam, zrI kRSNa varapradAnam .
      zrI kRSNAnandamayam ca, zrI kRSNahAnaprakAzam .
      zrI rAthAkRSNadhyAna phalitam, zAzvata zrI kRSNa sAyujyam..
    en: "These deeds, writings, songs, meditations, hymns, games and songs, all the songs of Sri Krishna's plays, are all graciously given by Sri Krishna! Talking about Sri Krishna's plays and singing in fondly chosen melodies are all boons he gave. Offering prayers to Lord Sri Radha-Krishna, his divine, joyful, smile-lit splendour, is nothing but merging as a part into his sacred feet, so that there is no further birth. What more do I need than this, Kannayya! Keep on showing me mercy!"
    te: 'యీచేతలు, వ్రాతలు, గీతాలా పనలు, ధ్యానములు, భజనలు, ఆటపాటలు, శ్రీకృష్ణ లీలాగానములన్నీ శ్రీకృష్ణులు అనుగ్రహించి దయ చేసినవే! శ్రీకృష్ణులలీలలు ముచ్చటించు కోవటం, మురిపెంగారాగాలు తియ్యటం, అన్నీ వారిచ్చినవరమే। వారిదివ్యానందమయమైన, చిరునవ్వుల వెలుగు జిలుగుల చిందులు, శ్రీరాధాకృష్ణ ప్రభువులను ప్రార్థించటం ఇక మరుజన్మ లేని విధంగా వారి పవిత్రపాదములలో అంశగా కలిసిపోవటమే! ఇంతకన్నా ఏదైనా నాకెందుకు కన్నయ్యా! నన్ను కరుణిస్తూంటూనేవుండు సుమీ ।'
  - type: verse
    id: u3
    no: ''
    hk: bhagavatprasAdam - sarvam zrI rAdhAkRSNArpaNamastu sarvAparAdhAna kSamadhvam mokSasAdhanamastu
    en: By the grace of the Lord - may everything be an offering to Sri Radha-Krishna. May all offenses be forgiven, and may this become the means to liberation
    te: ''
  - type: verse
    id: v150
    no: '150'
    title: zrI kRSNa kizoravilAsam
    hk: |-
      oM.. nandakizoram gopakizoram, vasukizoram, lazokizoram.
      bAlakizoram, gopAlakizoram, lIlAkizoram, rAgakizoram.
      nAdakizoram, nATyakizoram, bRndAkizoram brahmAnandakizoram.
      zrInRsimha kizoram, brahmANda kizoram, sadAvande, mokSadam me zrI kRSNam vizva kizoram ..
    en: "Salutations always to you, Mukunda who reclines on a banyan leaf, Lord Sri Krishna, who gives liberation, Muralimohana: to the gopa boy, the son of Vasudeva, the beloved child of Yashoda Devi, the enchanting boy, the son of Nanda, the young lion cub, the cowherd, the tender little one, who delights with games and songs, the small embodiment of love, who sings and dances, who roams Brindavan, the little darling who gave the bliss of Brahman through the Rasa Lila, and who alone, the fondly loved child, remained in all the worlds at the end of dissolution."
    te: 'గోపబాలుడు, వసుదేవసుతుడు, యశోదాదేవి ముద్దుబిడ్డ నందుని కుమారుడైన ముగ్ధబాలునికి, చిన్న సింహంపిల్ల, ఆవుల కాపరి, కోమలమైన చిన్నారి, ఆటపాటలతో మురిపించే, ప్రేమైక చిరుమూర్తి, పాటలు పాడే, నృత్యము నాడే, బృందావనవిహారి, రాసలీలద్వారా బ్రహ్మానందం పంచిన బుజ్జిబాబు, అన్నిలోకాలలో, ప్రళయాంతంలో, నిల్చిన ఏకైక ముద్దులమురిపాల బాల ముకుందవటపత్రశాయీ! శ్రీకృష్ణ ప్రభో । మోక్షమిచ్చే మురళీ మోహనా। వందనం నీకెల్లపుడూ!'
  - type: verse
    id: v151
    no: '151'
    title: zrI kRSNa tatva prakAzakam
    hk: |-
      nanukOlturubhaktulu, sadAtapasvisAmba zivunigA, zivapaJcAkSarito.
      nArAyaNAkSaryupAsakulu, viSNubhaktulu, tArakarAmadhyAnadhanyulu
      zrIrAma zaraNAgatuph tatvajJalu, nAnitya satyavizvamaya zrIkRSNunigA vAsu
      deva dvAdazAkSari japiJci tarintu, rituruliSTadevatAvigrahunigan ..
      sarvadevAzritula samamugacUtunu, sarvamamarci santasaparacEda .
      Artulu pazcAttAptulai, sthiracittulE", sarvezvarA .
      mAtappulumannimpumu.
      nIvedikkani, OkamArannacAlu, Abhayamicci Adukuni .
      sarvasaubhAgyamulu, janmAntamuna, mokSasAyujyamOsaGgEda,
      nizcayambugan, bhaktavazyuDanai ..
    en: O Lord Krishna, the devotees worship You always as Samba Shiva, with Shiva's Panchakshara mantra. Narayana's mantra worshippers, Vishnu devotees, and those blessed with Tarak Rama meditation have surrendered to Sri Rama's shelter. Those who know the truth, eternal and universal, worship You as Sri Krishna, chanting Vasudeva's twelve-syllable mantra, while also honoring their chosen deity. I see the peace of all divine beings, dedicating everything and bringing joy. Those with wounded hearts, filled with remorse, becoming steady-minded, O Supreme Lord, please forgive our mistakes. You are our sole refuge. Just one glance is enough. Grant us fearlessness and protection. You will bestow all auspiciousness, throughout life and ultimately liberation and divine union, this I firmly believe, for You are controlled by devotion.
    te: ''
  - type: verse
    id: v152
    no: '152'
    title: zrIkRSNa amRtopadezam - antyAdezam
    hk: |-
      nenu bhaktavazyuDanu, dhyAnamArgasulabhalabhyuDanu, veda, dAna, yajJa, japa, tapo,
      karmAnuSThAnAdi, bahuvidhamulugA nannArAdhiJcu bhaktulandari nI karuNintunu, vAri
      hRdayame, nAnijamaina zAzvatanivAsamu.
      zivapaJcAkSarI mantropAsanadvArA, nityatapasvisadAziva svarUpunigA, viSNu aSTAkSarIto,
      nAkaLyANamarUpamaina zrI lakSmi nArAyaNunigA, tArakarAmamantramuto,
      dazAvatAramulalo AdarzapuruSAvatAruDaina zrIrAmunigA, vAsudevadvAdazAkSarIto
      - vizvarUpa zrIkRSNunigA, leka, mare itara iSTa devatA vigrahunigA nAmagAnaJcesinA,
      ArAdhiJcinA, sarvadAprasannuDanu, kAni, Oka svarUpunigA ArAdhiJci,
      marorUpamunu dveSiJcu, ahaGkArulu a thogatipAlauduru.
      bhaktulandaruku, amRta bIjamainatOmmidi akSaramulasamudAyamaina - “navAkSari”
      oM..
      zrI..
      zivarAmakRSNAya namaH..
      anumantramunu prasAdiJcucunnAnu.
      upAsiJci, mokSasAdhakulaudurugAka !!!
      gamanika : nArAyaNuDanna nIru nivAsamugAgalavADani arthamu, zrI mahAviSNuvani
      cEbuduru.
      satyame vIrini, divyamaGgaLavigrahuDagu, sarvaloka antya praLayakAlamuna,
      vaTapatrazAyigA, krIDA bAlakRSNarUpunigA vinodiJcu, sarvasarvezvaruDu, zAzvatuDagu
      zrIzrI kRSNa paramAtmagA grahimpadagunu.
      zrImannArAyaNa aSTAkSarI mantropAsana bahuprItikaramu
    en: |-
      Sri Krishna’s divine and binding Guidance: I am controlled by devotion, easily accessible through meditation's path. Through Vedic practices, donations, sacrifices, chanting, penance, and ritual performances, I will show compassion to all devotees who worship me in numerous ways, and their heart is truly my eternal dwelling place.
      Through various paths of mantra worship, one can approach the Divine in multiple forms: As Sadashiva, the eternal ascetic; As Vishnu with the eight-syllable mantra; As Sri Lakshmi Narayana, embodying auspiciousness; As Sri Rama, the ideal avatar in the ten divine incarnations; As Sri Krishna, the universal form with the twelve-syllable Vasudeva mantra; Or through any chosen deity's form.
      However, a word of caution: those who worship one divine form while despising another, driven by ego, will fall into lower spiritual states. The text offers a profound nine-syllable mantra (Navakshari): OM SRI SHIVARAMAKRISHNAYA NAMAH.
      The ultimate guidance is to worship with devotion, seeking liberation.
    te: ''
  - type: verse
    id: v153
    no: '153'
    hk: |-
      oM mAm dhyAyanti, nija bhaktAH zivaH viSNuH zrIrAmaH
      vizvarupa vizvamaya, divyamaGgaLa vigraha, zrI kRSNaH gAyatrIH iti anekarupadaivaca.
      zivapaJcAkSari, nArAyaNASTAkSari tArakarAma, vAsudeva, dvadazAkSaryAdi upasakAH .
      samadarziraham, mayAzritassarva rakSakam ca kalausmaraNekamAtreNAbhayam, dadAmi, ihaloke sarvasampadAm, janmAnte zAzvata sAyujyam, bhaktavazyoham sadA.
      uttamam iSTa devatArAdhanam, narakapradam, parapakSadveSam, kurubhakti yogAbhAyAsam, zreyomokSArtham nityam .
      zivarAma kRSNAya namaH iti, mayAdatta, amRtabIja, navAkSarI japam, sarvo tkRSTam sarvamantrasAram ca zAntiH kaivalyadam ..
    en: Om, My devotees meditate on me as Shiva, Vishnu, Sri Rama as the Cosmic Form, Universal Being, Divine Auspicious Embodiment, Sri Krishna, and Gayatri in many divine forms. Those who worship Shiva's Five-Syllable Mantra, Narayana's Eight-Syllable Mantra, Taraka Rama, Vasudeva, Twelve-Syllable Mantras. I am equal-minded, a protector of those who seek me. By merely remembering me in Kali Yuga, I grant Fearlessness, All prosperity in this world, and Eternal liberation at life's end. The supreme worship of chosen deities Prevents hell, Avoids enmity toward others, and Cultivates devotion and yoga. For ultimate spiritual liberation, salutations to Shiva, Rama, Krishna! I offer the immortal seed, The Nine-Syllable Japa, and The essence of all mantras, Bringing peace and ultimate liberation.
    te: ''
  - type: section
    id: s10
    hk: 'mama vinnapam :'
    en: My humble request
  - type: verse
    id: v154
    no: '154'
    hk: |-
      bhavam mamajIvitaratham mameza zrIkRSNacoditam, dhanuJjaya sahitam dhanyam .
      satyazrIH zreyoprAptartham, ante zrIkRSNa caraNa zAzvata vilIna sidyartham ..
      zrI zrI kRSNamaGgaLahArati :
    en: May my life proceed smoothly, evenly and on a straight path, without any ups and downs, directed by Lord Sri Krishna along with Phalguna (Arjuna)! May riches be given for me to enjoy, and may I at the end of this life be absorbed into Sri Krishna's footsteps!
    te: 'నా జీవితం ఎట్టి ఒడుదుడుకులు లేకుండా సజావుగా, సాఫిగా, ఋజుమార్గంలో, పల్గుణునితో సహా శ్రీకృష్ణ విభుని చేనిర్దేశింప బడి, సాగుగాక! ఐశ్వర్యములు, అనుభవమునకు ఇవ్వబడి, నాయీజన్మాంతములో శ్రీ కృష్ణుల అడుగులలో అంతర్లీనమౌదునుగాక!'
  - type: verse
    id: v155
    no: '155'
    hk: |-
      oM.. tejazrIzAya, zrImannArAyaNAya, svapAdAGguSTha
      cUpaNAnandalIlA bAlAyaca .
      taddevadevezAya, mameza zrIkRSNAya mokSapradAya, zAzvatAya, maGgaLam ..
      maGgaLam jayamaGgaLam .
      sarvamaGgaLam .
      sarvesarva janame jayamaGgaLam ..
      maGgaLam mahat zrI zrI zrI zrI zrI
      iti zrI kRSNa dhyAnagItAvaliH sarvam sampUrNam
      sarvAparAdhAn kSamadhvam
      bhagavatprasAtam
      sarvam zrI kRSNArpaNamastu
      hariH oM tatsat
    en: Always auspiciousness and victory, victory to the lord of Kantimati, the lotus-eyed one whose abode is water, the dear little mischievous child who, as a childish act, sucks the toe of his own foot, that God of gods, my master, Sri Krishna, who always remains.
    te: 'కాంతిమతీనాధునికి, నీరు నివాసముగాగల నీరజాక్షునికి, బాల్యచేష్టగా, తనకు డిపాదంబొటనవ్రేలు చీకుకునే చిన్నారి చిలిపి పాపనికి, ఆదేవాదిదేవునికి, నాకు, అధిపతి, ఎపుడూ నిలిచివుండే శ్రీకృష్ణదేవేరులకు ఎల్లపుడు శుభం శుభంజయంజయం'
  - type: section
    id: s11
    hk: 'zrI kRSNAsAyUjya sAdhanam :'
    en: The means of attaining union with Sri Krishna
  - type: verse
    id: v156
    no: '156'
    hk: |-
      oM.. tejasvinam, tejazrIzam, tejaH puJjam, tejomayam, tejorAzim, tejorUpam, tejodhipam, tejasvantam .
      tamIzam, tanmayIzam, tatsarvezam, tatsarvArthadam .
      tapazyAmi, zrI zrI kRSNa AjJAnusAram nityam me, tANDava zrI kRSNam, zrI kRSNacaraNa sAyujyadam..

      namo kRSNa.
      namo kRSNa.
      kRSNa kRSNa.
      hare hare.
      hare kRSNa hare kRSNa kRSNa kRSNa hare hare .
      hare rAma.
      hare rAma.
      rAma rAma.
      hare hare.
      zivoham.
      zivoham.
      zivoham .
      zivoham .
      haroham .
      haroham .
      haroham .
      haroham .
      oM namazzivAya.
      oM namaH zrIrAmabhadrAya.
      oM namo nArAyaNAya
      oM namo bhagavate vAsudevAya.
      ..
      oM ..
      zrI ..
      zivarAma kRSNAya namaH ..
    en: 'Salutations always to our Sri Krishna, who makes the eyes rejoice with his dance and gives liberation, by the permission given through his grace and in devotion: the radiant one, husband of Kantimati, a mass of light, made of light, whose very form is light, the lord of light, to whom all light belongs, that Sri Krishna, Lakshminatha, the giver of everything.'
    te: 'కాంతివంతుడు, కాంతిమతీపతి, కాంతిపుంజం,కాంతి మయుడు, కాంతియే ఆకారము, కాంతికి అధినాధుడు, కాంతి అంతా తన స్వంతమైనవాడు, ఆ శ్రీకృష్ణులు, లక్ష్మీనాథుడు, అన్నీ ఇచ్చేవాడు, శ్రీకృష్ణులను, వారి దయవల్ల ఇవ్వబడిన అనుజ్ఞవల్ల భక్తితో ఎపుడూ, నృత్యముతో నయనానందకర, కైవల్యప్రదుడు మాశ్రీకృష్ణునికి ఎల్లవేళలా నమస్సులు.'
  - type: verse
    id: v157
    no: '157'
    hk: |-
      oM sarveza zrIkRSNam zirazA namAmi.
      rukmiNIza zrIkRSNam manasA smarAmi.
      rAdheza zrIkRSNam niratamArAdhayAmi.
      satya zrIkRSNam aharnizam vandyAmi.
      parameza zrIkRSNam nirantaram pazyAmi.
      hRdayasthamama zrIkRSNam sadA dhyAyAmi.
      rAgamaya zrIkRSNam me sarvam samarpayAmi .

      sAyujyada zrIkRSNam mamAtmArpaNam kariSyAmi ..
      zrI kRSNapada dhyAnam - sarvesarvadA - zrIkR sAyujya sAdhanam ..
    en: |-
      I bow my head and salute Sri Krishna, who gives wealth to all. Wholehearted salutations to Sri Krishna, the husband of Rukmini. Unbroken salutations to Radha-Krishna. Obeisance night and day to Sri Krishna, the husband of Satya. Constant homage to the pure God of gods, Sri Krishna. I worship in my heart. To Sri Krishna, the embodiment of love, I dedicate everything I have enjoyed so far as being what he himself gave. To Sri Krishna, the giver of liberation, I place my very self at his feet. Meditating constantly and steadily on Sri Krishna's feet is the way to attain liberation.
    te: 'అందరకీ ఐశ్వర్య మిచ్చే శ్రీకృష్ణునికి తల వంచి వందనంచేస్తున్నాను. రుక్మిణి పతి శ్రీకృష్ణునికి మనసారా నమస్కారం రాధాకృష్ణునికి అవిచ్ఛంన్నంగా,నమోవాకాలు. సత్యానాధుడు శ్రీకృష్ణునికి రాత్రి, పగలు కూడ అభివంధనం. విశుద్ధదేవదేవ శ్రీకృష్ణునికి ఎల్లపుడూ దండాలు. నాహృదయంలో కొలుస్తూంటాను. ప్రేమైకమూర్తి శ్రీకృష్ణునికి వారిచ్చినవే నావిగాఇంత వరకూ అనుభవిస్తున్న వన్నీ అంకితంచేస్తున్నాను. కైవల్య కర శ్రీకృష్ణునికి ఆత్మనే వారి చరణముల చెంత వుంచేస్తున్నాను. శ్రీకృష్ణుని పాదాలను తదేకంగా, ఎపుడూ ధ్యానించడమే, ముక్తి పొందడానికి మార్గము.'
  - type: section
    id: s12
    hk: sarvam zrIkRSNArpaNa prakaraNam
    en: The principle (or teaching) of offering everything to Sri Krishna
  - type: verse
    id: v158
    no: '158'
    hk: |-
      zrI kRSNa preritam zrI kRSNasaGkalpitam zrI kRSNa bhASitam
      zrI kRSNaprasAditam.
      zrIkRSNa uddizyagAnam, zrIkRSNa upadezitam.
      zrI kRSNa prabhAvapUritam ca zrIkRSNa lIlAvinodaprakAzam.
      sarvasarveza, zrI kRSNamayamidam, zrI kRSNastotra sAhitya lakSmissarvam, mayAsaha, mama, sarvadA, sAyujyadA, mameza, zrIkRSNa caraNa, sarojArpaNam, karomi, kevalam zrIkRSNa kRpAkAraNAt ..
    en: |-
      Singing these songs about Sri Krishna, inspired by Sri Krishna, which he himself thought of, spoke and gave, is what he asked me to do. All the tales of delightful, mischievous acts performed by Sri Krishna, full of his glory, are filled with his splendour. This heap of riches, the composition of these hymns to Sri Krishna, beginning with me, I offer all of it at the feet of Sri Krishna, who gave me everything, merges me into his sandals at the end of this life and has given a permanent abode as a boon; all this is through Sri Krishna's endless compassion!
    te: 'శ్రీకృష్ణులు ప్రేరేపించి, వారుతలుచుకొని ప్రవచించి, ప్రసాదించిన యీ శ్రీకృష్ణుని గూర్చిన గీతాలుపాడటం, వారుచెయ్య మన్నదే. శ్రీకృష్ణుని మహాత్యమునిండిన శ్రీకృష్ణులు జరిపిన ఆనందింపజేసే చిలిపి చేష్టల గాధాలన్నీ శ్రీ కృష్ణుని వైభవముతో నిండివున్నవి, యీ శ్రీకృష్ణుని స్తోత్రముల రచన అనే ఐశ్వర్యపు రాశిని నాతో మొదలు పెట్టి అన్నియును, నాకు అన్నీ అనుగ్రహించి, యీజన్మాంతంలో తన పాదుకులలో కలిపేసుకుని శాశ్వతంగాని వాసం వరంగాఇచ్చిన, శ్రీకృష్ణుల పాదపద్మములచెంత సమర్పించు చున్నాను, ఇదంతా శ్రీకృష్ణుల అనంతదయవల్లే సుమా!'
  - type: verse
    id: v159
    no: '159'
    hk: |-
      zrIkRSNacaraNam mamazaraNam ca sarvasvam,
      zrI kRSNa padadhyAnam zrI kRSNa nirdezita mamajIvitAlambanam.
      zrI kRSNabharita mama hRdayassarvam sarvadA zrI kRSNAnandamayam.
      zrI kRSNapAdAravindam me zAzvatAnanda nilayam ca mokSakSetram ..
      sadAvande me zrI kRSNam sarvadam zrI kRSNasAyujyadam.
    en: |-
      Sri Krishna's feet are my refuge; they are everything! Meditation on Sri Krishna, and what he commanded as if drawing a line, is the support of my life. By his grace my whole mind, in which he dwells, is filled with the bliss of Sri Krishna. Sri Krishna's lotus feet are the state of liberation where I have been graced to dwell forever. Always bowing, salutations again and again to Sri Krishna, the giver of liberation.
    te: 'శ్రీకృష్ణుని పాదములే నాకుగతి. అన్నీ అవ్వే! శ్రీకృష్ణుల ధ్యానం, వారు గీతగీసినట్లుగా శాశించిన ప్రకారమే, నాబ్రతుక్కు ఆలంబనం. వారి అనుగ్రహంవల్ల వారు నివాసమున్న నా మనస్సంతా శ్రీకృష్ణానందమయం. శ్రీకృష్ణ పదకమలములు నేను శాశ్వతంగా నివసింప ననుగ్రహింపబడిన ముక్తి స్థానం. ఎపుడూ నమస్త మొసగి, మోక్షమిచ్చే శ్రీకృష్ణునికి నమోనమః'
