    no: '161'
    hk: |-
      muktAyamAna mukundamAlA aho! atyadbhutam, AhlAdakaram, varNanAtItamamanollAsakaram | ariSaDvargAdiroga sarvaripuharam
      ajJAnAndhavinAzakaram | zubhakaram zAntikaram, bhaktijJAna vairAgya uddIpanakaram, amandA nandadam | zrIkRSNa smitavadana divyamanodarzanam
      sAdhyam zrIkRSNadhyAna pUrvaka zaraNA gatidvArA, sarvadam ante zrIkRSNa sAyujyakaram
    en: Aha! What a strange sight! The Divyadarshan of Lord Krishna which bestows Happiness in the heart brings an unexplainable thrill, destroys the six anarthas, removes the darkness of ignorance, instills peace, and devotional knowledge, destroys the illusion, brings endless joy to the heart was possible due to concentrated meditation. I offer millions of obeisances to Lord Sri Krishna.
    te: ''
  - type: verse
    id: v162
    no: '162'
    hk: |-
      aNvAdi brahma brahmANDaparyantam zrIkRSNAjJAnuvartiH sRSTissarvam, zrIkRSNamayam zrIkRSNAntargataJca.. tasyakiJcida vivyartham nAsti |
      tasyakiJcidapi akRSNannAsti ..
    en: Starting from the atom to the creator Brahma, all the universes function as per the command of Lord Krishna! Everything is Lord Krishna! Everywhere it is Lord Krishna! Nothing is useless, because there is nothing that is not Krishna.
    te: ''
  - type: verse
    id: v163
    no: '163'
    hk: |-
      oM namAmi kRSNam nanda nandanam navanItacoram, nagadharam nAgazayanam zrIkRSNam . praNamAmi, kRSNam pArthasArathim pAJcajanyapANim,
      payaH priyam caparandhAmam zrIkRSNam. vandeharnizam kRSNam, viSNum vizvavaradam zrIkRSNam | bhajAmi bhavabhayaharam, bhaktavaradam
      muktipradam zrIkRSNam ..
    en: Son of Nanda Maharaj, the butter thief, the holder of Govardhana mountain and conch one who is resting on the Sesha, Arjuna's charioteer, lover of milk having a blissful form, Vishnu who rules and protects all the universes, one who gives boons to the devotees by dispelling the fear of material existence, to that Lord Krishna, who gives salvation, I offer my obeisances.
    te: ''
  - type: verse
    id: v164
    no: '164'
    hk: |-
      zrIkRSNuDu sarvAnanda nidhAnamu, sadA Ananda dhAmamu | zrIkRSNuni, nirdezamu sarvarasarAgaramya manoharamu. mokSakAma darzitamu . sarve sarvadA sarvavidha Azrita mandAramu! bhaktA bhISTapradadaivatamu sarvadA,
      sarvavarada sAyujyada satyanArAyaNa, lIlA bAla vinoda bharatimu. zrIkRSNahAsaprakAzatejo mayamu, bhaktimukti kArakamu.
    en: Lord Sri Krishna is the embodiment of all bliss, the above of eternal happiness. Lord Krishna's music filled with mellowness that steals the heart, shows the path of salvation. He is the wish-fulfilling tree in all ways at all times for all those who take refuge. One who is the fulfiller of desires for devotees, bestowers of all boons, bestower of liberation Satyanarayana. Filled with joyful childhood pastimes! Lord Krishna’s bright and effulgent smile is the bestower of devotion and liberation.
    te: ''
  - type: verse
    id: v165
    no: '165'
    title: zrIkRSNuni govinodamu
    hk: |-
      tAnOkatuvvAyi vIpunEkki rayyi rayyina gantulu veyiJcucu, cilipi ceSTalu ceyuveLa, verOka legadUDa allaricedamu
      ramma"ni saigagA, tana kuDipAdamu nAku cuNDa, tanapai kONDEmulu gopakAntalu cEppagA-kopiJcina yazodamma tananu mandalimpagA
      nizzabdamugA nundunani, kapaTa zapathamugA tarjanini, cirupEdavulapai niDu, muddulu mUTagaTTu cinni gopAluni ciguruTAkuvaNTi
      cinnAri ciTTElaraceyi, abhayahastamai, sadA mammulanu kApADucuNDune yuNDugAka!
    en: 'Lord Krishna’s playtime with cows: When he was on the back of a calf making it run and doing pranks, while another young calf beckoned him licking his right foot calling him for mischief, while Yashoda chastised him due to complaints of Gopis one who made a false promise to remain obedient, may the adorable tiny hand of that smiling Gopala bestow fearlessness and always protect us.'
    te: ''
  - type: verse
    id: v166
    no: '166'
    hk: |-
      navanItacora! nArIcora! nArI cIrAcora
      nArI prANacora nAga garvacora gopI mAnacora. gopikAmAnasa corA. kSIracorA rukmiNi cora. rAdhA hRdaya cora, raNacora |
      cANUraprANacora | ramaNIcora maNicaurya dUSi tapAJcajanyacora. pArijAtacora namo sarvapApa doSacora varada, zrIhari kRSNA .
    en: This butter thief! Thief of women, Thief of the clothes of women, thief of life of women, thief of Naga’s pride, thief of Gopis’ dignity, thief of Gopis’ heart, the milk thief, stealer of Rukmini, thief of Radha’s heart, one who ran away from the battlefield, thief of Chanura’s life, who stole the blame of stealing mani, one whole stole panchajanya, stealer of parijata, the stealer of all sins and faults, the bestower Sri Hari Krishna.
    te: ''
  - type: verse
    id: v167
    no: '167'
    hk: |-
      oM mAtA | me, mAdhavI. mANikyavINApANI. makarakuNDala dharI |
      mahezvarIzcAdhika mamA rAdhyadevI mahIsama kSamAmayI, mamatAnu rAgajharI. mama, kArAnu rAgamayI, mama janmArtha mUlakAriNI,
      mA taramIzvarIm namostute |
    en: O, my mother who has given birth to me! You are my visible Goddess on earth, superior even to Shri Mahalakshmi, Saraswati, Parvati, and Aditi! My worshipable sacred crown jewel among women! More tolerant than the earth, embodiment of love and affection! Oh, my Mother who has given meaning to my birth! Millions of obeisances unto you.
    te: ''
  - type: verse
    id: v168
    no: '168'
    hk: |-
      vidyAlayam prathame, dvitIyaJca granthAlayam, devAlayam tRtIyaJca vidyA vijJAna samupArjanaJca. mukti sAdhanArtham, nizcayam
      daivanirNItam bhuvim. mAtRparyaGkamArambhAt, samRddhi rapipAThazAlayoH | vidyasamupArjanama sampUrNam bhavati, vinA, anu nitya granthazodhanam .. tasmAt jJAna bhANDAra granthAlaya
      saMvardhanam vidhIyate
    en: Schools, libraries, and temples respectively are arrangements made by God in this world for human beings to acquire education, knowledge, and salvation. We should make our lives fruitful with their good use. A man who starts by gurgling in his mother's lap, no matter how much he studies and learns in schools, if he does not consult many relevant texts (reference books, etc.), will not gain knowledge. Therefore, libraries should be widely established and developed as repositories of knowledge. Thus we should make good use of our money.
    te: ''
  - type: verse
    id: v169
    no: '169'
    hk: |-
      yogezvara zrIkRSNa prasAditam, zrIkRSNa prasAditam, sarvaroganivArakam. naraloke, sampUrNA nanda jIvanArtham, nityam
      zrIkRSNa vizvarUpa saundarya nandanam
    en: To avoid all diseases and live hale and healthy on earth, one must regularly practice yoga, as instructed by Lord Krishna. This is the advice of many experienced elders.
    te: ''
  - type: verse
    id: v170
    no: '170'
    hk: |-
      oM. namaste astubhagavan vizva varada rukmiNIzAya satyAnandA pradAyya oM namo nArAyaNAya,
      oM namazzivAya, namo zrIrAmabhadrAya, namaH zivarAmakRSNAya, ityaneka mantrarUpa pUjitAya, mamArogya rakSaka dhanvantari
      devAya oM, oM. oM namo vizvarUpAya, sadAnamo, mamArAdhya rAdhAmAdhava, zrIkRSNAya, gAna, lAsya, rAgalIlA vinoda
      mukundAya, mama yIpsi tassarvadA, sAyujyadA, yazodAnanda govinda gopAlAya, vaTapatrazayana, jaganmohana, Ananda
      bAlAya, tatsarva sarveza, zrIman zrIkRSNa prabhave, namo namaH .. zrIkRSNam vande jagadgurum, sarvadammesAyujyadam||
      he zrIkRSNabhagavAn| dehi,me, vAJchitassarvam, ante zAzvatahRdayAnandada, tavazrIcaraNa vilInam..
    en: |-
      The above can be recited as a mantra as in Srirudra Namakam or as a meditation song - a hymn praising and saluting our adoring Lord Sri Krishna with various names. I bow to You, O Lord, benefactor of the universe, Lord of Rukmiṇī, bestower of truth and bliss. Om namo Nārāyaṇāya.
      Om namaḥ Śivāya. I bow to Śrī Rāma-bhadra, to Śiva-Rāma-Kṛṣṇa—worshipped in many mantra forms.
      To Dhanvantari Deva, the protector of my health, Om, Om.
      Om namo to the Universal Form, perpetual salutations to You, my worshiped Rādhā-Mādhava Śrī Kṛṣṇa.
      O Mukunda, delighting in song, dance, and musical play—ever grant my desired union (sāyujya).
      To Yaśodā-nandana, Govinda, Gopāla, the child reclining on the banyan leaf,
      the enchanter of the universe, the blissful boy—unto that Supreme Lord of all, Śrīman Śrī Kṛṣṇa, I bow again and again.

      I bow to Śrī Kṛṣṇa, the teacher of the world, the eternal giver of divine union.
      O Śrī Kṛṣṇa Bhagavān! Grant me all that I desire,
      and at the end, grant me the eternal bliss of merging into Your lotus feet."
    te: ''
  - type: verse
    id: v171
    no: '171'
    hk: |-
      oM.. jagadrakSakam jagadIzvaram jagajjanakam jagannAdham| jagatprabhum,
      jagadvaradam jagatsarvadam jagannATaka sUtra dhAriNam. jaganmohinIrUpadharam jaganmohanAkAram jagatsundarIzam | jagadAnandakArakam
      zrIkRSNam namAmi jagat jIvakoTi kaivalyadam
    en: Obeisances unto Lord Sri Krishna, the protector of all the worlds, the bestower of wealth, the father, the ruler, the bestower of boons, the ingenious hero, the one who took the form of the most mesmerizing beautiful women during the churning of the milk ocean, who intoxicated all the demons, who captivated everyone, the supreme beauty of the universe, husband of goddesses of fortune, the bestower of joy and liberation.
    te: ''
  - type: verse
    id: v172
    no: '172'
    hk: |-
      oM. nayA ce, suralokapAlanam, navApsarasAsukha lAlasam, . navitta, ramya, harmyeSu
      cittam, na, me, kiJcidanya masti | iyam sustanI muktimAninIcahastAt, sumAgIm, zubhAGgIm, zrIkRSNacaraNa sthira cAriNIm dadAtu .
    en: I do not ask for the possession of the heavenly world, or embrace of beautiful women, or wealth, or residence in palaces or any other thing. I only wish to have the hand of liberation which resides at the most auspicious divine lotus feet of Lord Sri Krishna.
    te: ''
  - type: verse
    id: v173
    no: '173'
    hk: |-
      zravaNAnakSatrodbhavA, dugdhassarvadagA, dagaddhaga dhagaddhagA yadedIpyamAna divyarUpa bAlA. vizva nirdezitA. vizAlanetrA vizvamAtA! he viSNu
      sahodarI, mUlAtArA rAjitA . jaganmUlAdhArA. zAradA zyAmalA zaila jANAm zubhAMzA, zrIdurgA. namostudevI. namo nama, mama
      yIpsita ssarvadAyinI, varade, sarvamaGgaLA. siddhirbhavatu, me, sarve sarvadA!
    en: The one who appears on Sravana Nakshatra, one who burns all miseries, one who shines with divine effulgence, takes the form of a small baby, the commander of all worlds, oh broad-eyed mother of the world! Vishnu’s younger sister, Shining as Yogamaya in Mula Nakshatra, the basis of all worlds, expansion of three mothers, Sridurga Mata! Salutations unto you, who fulfills all my wishes and gives me good fortune.
    te: ''
  - type: verse
    id: v174
    no: '174'
    hk: |-
      akhila lokAzcaryakara, sarvajanAkarSaka, susmita vadanA ravinda madana gopAlam | AdinArAyaNam, ArtatrANaparAyaNam, anurAgamaya mAtmArAma, mAnandadhAmam vAsudevam,
      vizvarUpam, rAdhA sahaDolAlAsya lIlA vinodinam, bhaktavazyam zrIkRSNam! tam vande, sarvasarvezvaram, bhaktijJAna, dhyAna vidyAmaya!
      mokSasAdhanagItA pracAram, abhaya dam, memukti dam||
    en: Madanagopala, who has a lotus-like face, whose smile attracts everyone, who amazes all the worlds, who dwells in the causal ocean, embodiment of love who protects those who are in pain, who has a blissful form, the son of Vasudeva, who holds the world within him, who swings with Radha, who enjoys pastimes, who comes under the control of the devotees, to that lord I pay my obeisances. Lord of Lords, who dispels fear by giving the Bhagavat Gita that teaches devotion, knowledge, meditation, and shows the path to liberation, to that giver of liberation Shri Krishna Parabrahma my Salutations.
    te: ''
  - type: verse
    id: v175
    no: '175'
    hk: |-
      zazAGkA, gomAtA madhyasthasthita meghazyAma sundaram, kapilavatsalAlana
      karakamala kamanIyam | mugdhamadhura smita mukhAravindam, madanagopAlam, bRndAvihAra, lIlA mAnuSavigraham|
      vande, yazodAnandagovindam, devakI vasudeva sutam, deva devezvaram, murArim, mAdhavam, nandabAlam, bhajAmi, AnandarAmam, mameza
      zrIkRSNam, zrIkRSNa dAsyAnandavarapradAram, ante zrIkRSNa padakaivalya dam..
    en: The moon in the sky, the azure beauty standing amid cows, shining with a gentle smile caressing the calf with his tender hand, the mischievous actor who wanders freely in Vrndavana as Madanagopala, the son of Yashoda, the delighter of the cows, the son of Devaki and Vasudeva, the god of gods, the enemy of Mura, the husband of the goddess of fortune, Gopala, the abode of bliss, my lord Sri Krishna I worship you with praises. He is bestowing the wonderful boon of devotional service unto Him and at the end of my life merges with him. I repeatedly pay my obeisances.
    te: ''
  - type: verse
    id: v176
    no: '176'
    hk: |-
      vande dhenur dugdhapriyam, navanItahastam, dugdha ssarvaharam, sarvesarvadA Azritavatsalam, deva devezam, zrIdharam| vande, paya sA udhasvatI, gosam vAhana
      madhye, kSIra dhArApAna, lIlA vinodinam, jagadAdhAram, manoharam vande, bhujaGga bhogA gra, padavinyAsa, vilAsa, bAlagopAlam, tam,
      kALim dinIpunIta karam, zrIkaram vande, me, zrIkRSNa ucchiSTa, kSIra, navanIta, phalagrahaNabhAgyAdi, mahotRSTa, zrIkRSNa nityasevAvara pradAram,
      -ca, AsmajjanmAnte, zrIkRSNa parama padavilIna varadam ..
    en: The Supreme Lord who affectionately accepts cow milk as an offering, having a butter ball in his hand, the lord who destroys the miseries of all, husband of goddesses of fortune, while milking cow who mischievously drinks portions of the milk that falls from the udder and lets the rest fall to the ground and enjoying himself in this way, he who is the support of the world, one who wipes out the miseries of the mind and steels the heart, one who gives pleasure to Lakshmi, Gopalabala who danced on the serpent hood of Kaliya, purified the waters of Kalindi making it pure and useful, one who accepted the hand of Lakshmi, although I do not have any qualifications Lord Krishna with utmost mercy bestowed upon me with the remnants of milk and butter accepted by him which is the top most (also bestowed the position of eternal servant and services unto Lord Krishna) at the end of this life one who eternally accepts me at his lotus feet, to that merciful Sri Krishna I offer my Dandavat Pranams.
    te: ''
  - type: verse
    id: v177
    no: '177'
    hk: |-
      vande vizvamohana bAlam, vizvAdhAram vanamAlim, vana vihAra
      vAsudevam | gopAlam sAmUhika vanabhojana madhye, uttiSTham, dadhyAnna kabaLahastam, padmapadayugaLazobhitam! kapaTa gopagogaNa anveSaNa
      nATaka lIlA vinodinam, cirahAsavadanam, sadAvande, vidhAta garvahArakam, gopa, goga NarakSakam, zrIkRSNam, mamArAdhya rAdhA mAdhavam, me,
      zrIkRSNa Ananda, dhAma nitya nivAsa varadam ..
    en: The wonderful boy who bewilders the entire universe, the basis of everything, delivers the forest wandering in it, the son of Vasudeva, tending the cows in the forest, rose from the middle of the lunch with the pulp of curd-rice in his hand, pretending to be an innocent having lotus-like feet, the smiling child who appeared searching for the cows and Gopas stole by Bramha, our adorable Mukunda, who suppressed the pride of the Creator and saved the cows and Gopas, to our worshipable lord RadhaKrishna, husband of Laksmi, bestower of the boon Kaivalya, to that Lord Sri Krishna’s feet, I offer my obeisances.
    te: ''
  - type: verse
    id: v178
    no: '178'
    hk: |-
      oM.. kSIrajAnujam, candram, sudhAMzum,
      zaratkAle zRGgArAdhikAsaktikArakam, zrIkRSNa bRndArAsalIlA darzana dhanyadevaram | kSIra sandrazayana zrIkRSNazyAla kala, vande zivaziro
      bhUSaNam zazim zubhakaram zazAGkam..
    en: The younger brother of Goddess Lakshmi born from the ocean of milk, the Moon, endowed with the Nectarian rays, in the autumn who arouses the Sringara rasa in mankind, the fortunate who witnessed the divine Sri Krishna rasa lila in Vrindavan, the younger brother-in-law of Lord Krishna who lies in the milk ocean, shining like an ornament on the head of Shiva, the ruler of the household and looking mercifully at the world to that Shahanka I pay my obeisances.
    te: ''
  - type: verse
    id: v179
    no: '179'
    hk: |-
      zrIkRSNanAmagAnam karomi, punaHpunaH. zrIkRSNalIlA smaraNam karomi, punaHpunaH| zrIkRSNa bhaktasahavAsam karomi, punaH, punaH, zrIkRSNa pada
      dhyAnam cadAsyam karomi punaH punaH..
    en: Throughout this life, I will repeatedly chant the name of Lord Krishna, listen to his pastimes, remember him, associate with the devotees of Lord Krishna, serve Sri Krishna’s feet, and meditate. This is the process of uniting with the Lord Krishna's feet which is taught by Lord Krishna himself. Those words of Sri Krishna are instructions for me.
    te: ''
  - type: verse
    id: v180
    no: '180'
    hk: |-
      zrIkRSNopadezamu nasnuddeziJcinade o mUDhAtmA! Agrahamunanta mOdiJcukOnumA.
      kopamunu campukOnumA .mAyA mohavimuktuDavagumA. jIvitamu kSaNakSaNamu tarugusumA. kAlamu iTu painanU vyardhamu
      kAnIyakumA maLLI maLLI puTTi caccu, cakrabandhamunuNDi vimuktuDavagumA. koTAnukoTla janmala tadupari narajanma kaligE sumA! tirigi
      krimikITamugA puTTakumA, duzcaryalu valadusumA. pazcattApapaDumA. manonAkkAya, karmala pavitruDavagusumA. manassAkSiki vyatirekamuga
      naDuvakumA! karuNAmaya zrIkRSNa dhyAna nimagnuDavagumA. yI janma tudina zrIkRSNa caraNa vilInamu, sAdhyamu, tathyamu sumA.. ( nenu
      yI jIvitAntam jIvanmRtuDigA paDi vuNDAli) nIpada dAsyamu dhyAnamu, nIpaibhaktiyu, premayu satatamu. nIpadadAsula sahavAsamu
      niratamu yI jIvita paryantamu pramukhamugan: nI nAmagAnamu, zaraNamu, nI divyapadakaivalyamu maraNAnantaramu tathyamugan |
      nIviccina varamulu nAku ananta karuNato nijamuga zrIkRSNA.. navvutA| navvistA| navvutU navvistA| navvistU navvutA .. navvulu ruvvutA,
      civvu rivvunA. nuvvu navvaGgA kuvvAkuvvaGgA. nityAnam daGgA| nalguri madhyaGgA, nirantaraGgA raGgA raGgA, pANDuraGgA ..
      helagA, avalIlagA, truLLutU trELLutU taLataLA tArakalA bratikestA! nI dayacENTa, nAtudakaNTA.. o navvulanidhI. nagadhara naLinI zrIkRSNa
      zrInidhI | pUrNa dayAdivyadadhI | premala pEnnidhI. mA jIvana paramAvadhI .. zaraNanipiJci, nannu, nIcEntaku cercukuNTivi kadammA
      zrIkRSNAnandamayunigAnimmA. yI bratukutudaku nannu zrIkRSNa AnandAdhAma nitya nivAsigA ceyavammA . "zrIkRSNa prasAdam" sarvam
      zrIkRSNArpaNamastu||
    en: 'O foolish mind subdue your ego, kill your anger, and be free from illusion! Life is fleeting! Let time not be wasted here and there, get delivered from the repeated cycle of birth and death. Got the human birth after billions of births! Do not be born again as a vermin, avoid evil deeds, and repent! Purify the deeds of Mind, Body, and Action, do not go against the conscience. Engage in the meditation of the merciful Sri Krishna! At the end of this birth, it is guaranteed to obtain the lotus feet of Sri Krishna (I shall lead the rest of my life as a lifeless person) Meditation on the service at your feet, devotion to you, love, and constant association with your devotees for the rest of your life, primarily singing of your glories, taking refuge at you reaching your divine feet is guaranteed at the end of the life. The blessings you have truly bestowed upon me with infinite compassion, Lord Krishna: Let me smile, make others smile, make you smile, smile with bliss, amongst others, always smile, with ease, with enthusiasm, I shall live like a star with your mercy till my end. Oh treasurer of smiles, Nagadhara Nalini, Sri Krishna Srinidhi, full of compassion, the embodiment of love, the goal of our life, treasurer of lotuses, who made me surrender and brought me near you. Let me get Sri Krishna Ananandamaya. May this life make me an eternal resident of Sri Krishna Ananda Rama: "Sri Krishna Prasadam" Sarvam Sri Krishnarpanamastu.'
    te: ''
  - type: verse
    id: v181
    no: '181'
    hk: |-
      namAmi, satatam,tat,sat, cidAnandam, mugdhamuraLI, ravaLIlola, bAlagopAlam, rAdhAmAdhavam, govindam, bRndAvihAra, madana gopAlam, Anandanilayam
      naLinInAdham anantakoTi, brahmANDanAyakam, jagannavaram, gajendramokSadam, vande! vande, nudevam,
      yazodA, mAtAnurAgabaddham, ulUkabandhanakrIDAvinodinaMvizva varadam||
    en: Situated in Satchitananda, mesmerizing the world by playing flute and relishing its melody, little Krishna who is an expert in playing along with Radha in the forest of Tulasi, embodiment of happiness, the master of billions of universes, directing the drama of the world, one who delivered Gajendra, son of Vasudeva, bound to grinding motor by the love of mother Yashoda, directing the universes through his pastimes to that Supreme Personality Godhead Sri Krishna I always pay my obeisances.
    te: ''
  - type: verse
    id: v182
    no: '182'
    hk: |-
      govindamRdu, madhurAdharA, zoNa, zoNimAvakSarAjitA, rAdhAdi taptahRdaya, bhaktassarvAnanda damAnandadhAmam. golokabRndA vAsina, mIzvaram
      devadevezama mArAdhya zrIkRSNam, mama, zrIkRSNa dAsyam, zrIkRSNabhaktim, anmajanmAnte, zrIkRSNapadakaivalyadam, manmAbhirAmam. oM hare zrIkRSNAya namaH
    en: Gopala gives joy to the cows, giving pleasure to Radha with the mellow music coming from his sweet and soft lips, the residence of the hankering devotees and giver of happiness, the blissful resident of Goloka Vrindavana, Lord of Lords, my worshipable lord, protecting this unqualified me from being an orphan, bestowing devotional service to Sri Krishna, the merciful Lord Sri Krishna who unites me at his lotus feet at the end of this life to that lord my innumerable obeisances. Om Hare Sri Krishna Namaha!
    te: ''
  - type: verse
    id: v183
    no: '183'
    hk: |-
      zrIkRSNaMvande jagadgurum mamanityAnuSThAnam - navadazavidha ArAdhana, (sandhyAvandanapUrvakam)
      1. dhyAnam: dhyAnamekaMzrIrAdhAkRSNa devaram..
      2. gAnam: gAnamekaMvaMzImohana kRSNa, krIDAvinodammanoharam, sAmagAnasadRzam..
      3. japamekam,nArAyaNASTAkSari: harekRSNamantrapUrvakam (japam)
      4. bhajanam: bhajanamekam zrIkRSNa divya nAmamanantaphalitadam|
      5. lakSyam: lakSyamekam zrIkRSNa pAdAravinda kaivalyam||
      6. kartavyam: kartavyamekam anukSaNa zrIkRSNa padadhyAnam, nAma gAnam, zeSa jIvitaparyam tam..
      7. sphUrtiH: sphUrtirekam zrIkRSNa anugra hapUrvaka AjJApAlanam
      8. darzanam: darzanam zrIkRSNa divyamaGgaLa vigraham, zrIkRSNa dayAkAraNAt janmasAphalyArdham ..
      9. zaraNam: zaraNa mekaikam zrIkRSNa divyavzrIcaraNadvayam..
      10. vAsam: vAsamekaikam zAzvata zrIkRSNa Ananda dhAmanivAsam..

      vITitopATugA
      zlo.. zravaNam, kIrtanam, viSNoH, smaraNam, pAdasevanam arcanam, vandanam, dAsyam, sakhyam, Atmanivedanam - navavidhabhaktimArgamulu (vyAsa bhAgavatam-7:5:23) anusariddAmu.
      1. zravaNam : zravaNamekam zrIkRSNa vividhAvatAra, kathAbharitabhAgavatam|
      2. kIrtanam kIrtanam kRpAkAraka zrIkRSNa bhaktassarva vijayapurANammokSa sAdhakam..
      3. smaraNam : smaraNamekam zrIkRSNa bhagavadgItAsUktimuktAvaLiH..
      4. pAdasevanam: kaivalyaprada, dayAmaya, zrIkRSNa pAdasevanam, karomi AjanmAntam ..
      5. arcanam : arca yAmi, devadeveza zrIkRSNam anantarUpa prabhum..
      6. vandanam vandanam
      7. dAsyam : dAsyaGkaromi, bhaktassarva sahita zrIkRSNa devaram
      8. sakhyam sakhyaGkaromi, zrIkRSNa bhakti, pracArakadhmanya puruSa nahasrapUrvakam, sadAhasita, zrIkRSNam, anunityam ..
      9. Atmanivedanam : mamArambhAt, zrIkRSNa prasAdita, sparvam, zrIkRSNArpaNam, karomitakSaNam, Atma nivedanam ..

      zrIkRSNa dAsyadazakam
      1. kanulumUsina, kAnabaDu, kamanIyakAntuDu, zrIkRSNuDu, dAsoha maJcu, zirasuvaJci, zaraNani, zrIcaraNamulaNTagan
      2. mukkucivara, cinduleyu, cilipicinnAri, caGgalva dAri, nandanandana, mukunduDu, navarasabharita, zrIkRSNa lIlAmRta, tatvAsvAdana, cesi, mudamuga, gadya padyamula, AtmArpaNa ceya, hRdyamnamugan |
      3. pEdavi vippagA, vEluvaDu, vEnnadOGga, vizvarUpuni, divya gADhAgAnamu, jagatpramodamugan, zrIkRSNa kRpA kAraNambugan!
      4. kaNThamandu, kaliyatirugu, zrIkaNThuDu, akuNThita bhaktidI, kSAparuDa, vagumani, hEccariJcucun
      5. hRdayasthu~DayyE, mAhiraNmayIzuNDu, mAyAmohAtItuDa, va gumani, hitamu, palkucun.
      6. cetalanadupuceyu, cinmayAnanda, gItAcAryuDu, svaphalApekSarahita, karmAcaraNacesi, sarvakarmaphalamu, tanakarpiJcumanu, zrIkRSNa caityanyam, bOkkaTE, ucitamanucun, takSaNamAcarimpumanucun 1
      7. kaDupuniNDu, kAruNyadhAmuni, kaTAkSambuna, zrIkRSNa, madhurapuNya, kathAsmaraNa, zravaNA, nandamulavalan |
      8. naDakalu, nagadharuni, nirdiSTa iSTapadulu, aSTakaSTa naSTaduSTa, nikRSTambulu, nikkamuga, nivAriJcucun |
      9. nArIcora, naLinInAdhu, muraLIravaLulu, nakhazikhaparyantamu, rakSanOsagu, niratamu, nelanAlgucEragula naDayADinan |
      10. dikkutocaninannu, devadeveza zrIkRSNalu, dayAsudhA, karamula, ceradIsi, tana, paramapada, dAsya, dhyAnavaramOsagi, nAlkuJcuna, nArAyaNamantramu,
      nirantaramuga, nartimpajesi, yIjIvitAntamuna, zrIkRSNa kaivalyamu, prasAdim tunani,ri ardratato, sarvaniyantagAna, kevalamu, yIsarvAdhamuni, uddariJci dhanyuni gAceyuTa kun !!
      “zrIkRSNa prasAdam"
      "sarvam zrIkRSNArpaNamastu”
    en: |-
      Shri Krishnam Vande Jagadgurum Nityanushthanam - Navdashavidha Aradhana, (Sandhyavandana Purvakam):
      Dhyanam (meditation): Dhyanamekam Sri Radhakrishna Devaram||
      Meditate on one and only Sri Radha Krishna!!
      Ganam (singing): Ganamekam Vamsi Mohana Krishna Krida Vinodamanoharam Samagana Sadrsham
      Sing the glories of one and only Vamsi Mohana Krishna, whose pastimes steal the heart!
      Japam (chanting): Japamekam Narayanashtakshari, Hare Krishna Mantra purvakaram Chant one and only Narayanaastkshari, Hare Krishna Mantra!!
      Bhajanam (worship): Bhajanamekam Sri Krishna Divya Namam Ananta Phalitadam Worship the unlimited glories of Sri Krishna’s transcendental name!
      Lakshyam (goal): Lakshyamekam Sri Krishna Padaravinda Kaivalyam||
      The only goal is liberation at the lotus feet of Sri Krishna!!
      Kartavya (duty): Kartavyamekam Anukshana Sri Krishna pada dhyanam, nama ganam, sesha jeevita paryantam||
      The only Duty is constant remembrance of the lotus feet of Sri Krishna, singing his name the remaining life!!
      Sphurti (Inspiration):- Shpurtiekam Sri Krishna anugraha purvaka angya palanam||
      Inspiration is executing the merciful instructions of Sri Krishna!!
      Darshanam (vision): Darshanam Shrikrishna Divyamangala Vigraham, Shrikrishna Dayakaranath Janma Saphalyartham ||
      Vision is beholding the transcendental and auspicious form of Sri Krishna which makes life successful.
      Saranam (shelter): Saranam ekaikam Sri Krishna Divya Sricharanadwayam ||
      Shelter is one and only divine lotus feet of Sri Krishna!!
      Vasam (residence): Vasamekaikam Saswata Sri Krishna Ananda dharma nivasam is the permanent abode of Sri Krishna |
      Ananda Dham Residence is the only eternal and blissful abode of Sri Krishna!!

      Along with these, let us follow (Vyasa Bhagavatam-7:5:23) śravaṇaṁ kīrtanaṁ viṣṇoḥ smaraṇaṁ pāda-sevanam arcanaṁ vandanaṁ dāsyaṁ sakhyam ātma-nivedana.
      Shravanam: Shravanamekam Sri Krishna Vikavatara Kathabharitabhagavatam||
      Kirtam: Kirtanam Krupakaraka Sri Krishna Bhaktasarva Vijayapuranam moksha Sadhakam||
      Smaranam: Smaranamekam Sri Krishna Bhagavad Gita Sukti Muktavali ||
      Padasevanam: Kaivalyaprada, Dayamaya, Sri Krishna Padasevanam Karomi aajanmantham ||
      Archanam: Archa Yami, Devadevesh Shri Krishna manantarupa Prabhum!!
      Vandanam : Vandanam Karishyami, Nandanavanaviharam, Sri Krishna Vibhum ||
      Dasya: Dasyankaromi, Bhaktasarva Sahita Sri Krishna Devaram ||
      Sakhyam : Sakhyam karomi, Sri Krishna bhakti, pracharakarmasya purusha sahasrapurvakam, sadahasita, Sri Krishna, anunityam ||
      Atman Nivedana : Mamarambahat, Sri Krishna Prasadita, Sarvam, Sri Krishnarpanam, Karomi tatshanam, Atma Nivedana ||

      Sri Krishnadasya Dashakam:
      1. I bow down my head touching the lotus feet of the lord declaring myself as a servant of Sri
      Krishna whose pleasing form can be seen even with eyes closed.
      2. Relishing and happily offering from the bottom of my heart the prose and poems of Sri
      Krishna Lilamrita which is filled with all nine Rasas on Mukunda the son of Nanda, the
      mischievous child, who very quickly becomes restless, who is wearing a Changalva flower
      Garland.
      3. As I speak the words that come out glorifying the divine pastimes of the butter thief, the
      Viswarupa, are giving pleasure to one and all are due to the causeless mercy of the lord Sri
      Krishna.
      4. The lord Srikantha is cautioning me from within my voice to become a staunch devotee fixed
      in the vow of ever-increasing devotion
      5. Occupying the heart of the Golden lord, is wishing me to overcome the illusions of Maya
      6. The controller of deeds, the Chinmayananda Geetacharya, is instructing us to perform duties
      without expectations, offer the results of all activities to Him, is indicating that the only
      desirable is Krishna Consciousness, which should be practiced without delay.
      7. One gets complete satisfaction (stomach full) hearing and meditating on the sweet and pious
      pastimes of Sri Krishna due to his compassion and mercy.
      8. The choicest composed of the activities of the lord bedecked with ornaments will completely
      eradicate all types of miseries
      9. Following always the sweet sound coming from the flute of the stealer of the hearts of
      women (Gopis), the master of goddesses of fortune (Lakshmi), will protect one from top to
      toe
      10. Only to deliver and bless this anxious and most fallen and baffled self, being the supreme
      controller, the supreme lord Sri Krishna has accepted me with his merciful and sweet arms
      and bestowed the boon of the Supreme abode, constant meditation, and service unto him. He
      is making the Narayana Mantra always dance at the tip of my tongue, assuring Sri Krishna
      Kaivalyam (merging in him) at the end of this life.

      Sri Krishna Prasadam!
      Sarvam Sri Krishnarpanamastu!
      Kalluri Surya Prakasamurthy
    te: ''
