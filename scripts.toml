[[script]]
id = "tamil"
name = "Tamil"
label = "தமிழ்"
english = "Tamil"
lang = "ta"
digits = "௦௧௨௩௪௫௬௭௮௯"
font = "Noto Serif Tamil"
# Tamil has one letter for ka kha ga gha. zuddha marks them with superscript numerals;
# saraLa is plain Tamil. Tamil writes class nasals natively, so both take zuddha HK.
zuddha = { hk = "zuddha", nativize = false }
saraLa = { hk = "zuddha", nativize = true, post = ["TamilRemoveApostrophe", "TamilRemoveNumbers"] }

