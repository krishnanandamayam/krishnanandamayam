# The scripts the site offers. To add one: copy a block, set `name` to the Aksharamukha script
# name (https://www.aksharamukha.com/documentation), pick a Google Font, and rebuild.
#
# For each mode:
#   hk        which HK convention is fed to the transliterator: "zuddha" or "saraLa"
#   nativize  Aksharamukha's nativize flag. It means something different for every script, so the
#             anusvara behaviour never relies on it; it is on only where a script's own
#             orthography needs it (short e/o marks, য়, Tamil without superscripts).
#   post      Aksharamukha post-options
#
# Per script:
#   digits    the ten native digits (0-9, in order). zuddha writes numbers in them and saraLa in
#             Latin 0-9, whatever Aksharamukha did on its own. Tamil's superscript marks (ப்³)
#             are not 0-9 and are left alone. Roman has none.

default = "telugu"

[[script]]
id = "telugu"
name = "Telugu"
label = "తెలుగు"
english = "Telugu"
lang = "te"
digits = "౦౧౨౩౪౫౬౭౮౯"
font = "Noto Serif Telugu"
zuddha = { hk = "zuddha", nativize = false }
saraLa = { hk = "saraLa", nativize = false }

